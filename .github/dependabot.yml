version: 2
updates:
  # baseline PULL-PUSH-REQ-2: watch third-party Action updates even though
  # they're SHA-pinned — Dependabot opens a PR bumping the pin (with the
  # tag as a comment), it does not silently trust a moving tag.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # codeql-action ships init/autobuild/analyze/upload-sarif as separate
    # action paths behind ONE shared version. Ungrouped, Dependabot opens a
    # PR per path, each bumping one pin and leaving the others behind — the
    # resulting mixed-version workflow fails with "Loaded a configuration
    # file for version X, but running version Y", so every such PR is red by
    # construction and none can ever merge. Grouping makes them one PR that
    # moves all pins together. (Found Sep 7, 2026: PRs #12/#13/#15.)
    groups:
      codeql-action:
        patterns:
          - "github/codeql-action*"

  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"

  # The distroless base digests. CRITICAL (owner, Sep 8): nothing had
  # watched these since Sprint 3 — the pins lived in .goreleaser.yaml and
  # .ko.yaml where no ecosystem looks. The FROM lines are written
  # image:tag@sha256 because Dependabot's docker ecosystem does not update
  # a bare image@sha256 line; with a tag to track it bumps the digest. A
  # base bump is patch/minor for the auto-merge lane; the reproducibility
  # check and release-artifact acceptance are the gates that catch a bad
  # base. The debug image's busybox comes from static:debug-nonroot and
  # moves with it — no separate tracking.
  - package-ecosystem: "docker"
    directory: "/build/docker"
    schedule:
      interval: "weekly"
