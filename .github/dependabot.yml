version: 2
updates:
  # baseline PULL-PUSH-REQ-2: watch third-party Action updates even though
  # they're SHA-pinned — Dependabot opens a PR bumping the pin (with the
  # tag as a comment), it does not silently trust a moving tag.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # REQ-SUP-001-AC1 (owner, Oct 5): a new version waits 7 days before Dependabot proposes it.
    cooldown:
      default-days: 7
    # codeql-action ships init/autobuild/analyze/upload-sarif as separate
    # action paths behind ONE shared version. Ungrouped, Dependabot opens a
    # PR per path, each bumping one pin and leaving the others behind — the
    # resulting mixed-version workflow fails with "Loaded a configuration
    # file for version X, but running version Y", so every such PR is red by
    # construction and none can ever merge. Grouping makes them one PR that
    # moves all pins together. (Found Sep 7, 2026: PRs #12/#13/#15.)
    groups:
      codeql-action:
        patterns:
          - "github/codeql-action*"

  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"

  # The pinned Go source scanner of the release chain's Check stage (advisor Oct 12, ruling G): tools/govulncheck is its own module (go.mod and go.sum are the pin), so a
  # new version reaches it through this reviewed path, with the same 7-day wait as the actions and the pip pins. Dependabot moves go.mod and go.sum; ci.yml's `go install
  # golang.org/x/vuln/cmd/govulncheck@vX` is by hand, and bin/chain-install-witness-test.sh is red until the two agree (so a bump cannot merge half done).
  - package-ecosystem: "gomod"
    directory: "/tools/govulncheck"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7

  # The hash-pinned adjudicator SDK (anthropic) the auditor's real model client imports.
  # Dependabot bumps the pin + regenerates hashes; the workflow installs it with
  # --require-hashes only on real/schedule runs.
  - package-ecosystem: "pip"
    directory: "/.github/agent"
    schedule:
      interval: "weekly"
    # REQ-SUP-001-AC1: the same 7-day wait as github-actions; gomod keeps its CVE-fix target.
    cooldown:
      default-days: 7
    # pydantic pins pydantic-core EXACTLY. The group bundles them when both update; it does NOT
    # stop a lone pydantic-core bump (the #106/#111 case that broke the auditor's SDK install).
    # The guard is ci.yml's resolve step: a PR whose pins do not resolve fails the
    # required `allowlist` check and never auto-merges.
    groups:
      pydantic:
        patterns:
          - "pydantic"
          - "pydantic-core"
