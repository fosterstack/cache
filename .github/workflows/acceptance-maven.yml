name: Maven acceptance

# Phase 1 item 6 (test-strategy §2.5; audit §21's eight scenarios). A real
# multi-module Maven project (bench/maven-sample: app -> lib edge, real
# compilation, a JUnit test) built against fscache through the Maven Build
# Cache Extension's remote HTTP mode. The local cache directory is pointed
# at a disposable path and wiped between builds, so a warm restore is
# REMOTE evidence. Every count asserted below was measured empirically
# before this workflow was written (2026-09-11): a cold build performs 2
# lookup GETs (404) and 5 uploads; a warm build restores both modules.
#
# Compatibility policy (scenario 8): the versions this matrix tests are
# the versions we claim to work with — the sample pins the newest tested
# version, and the matrix also runs the oldest supported one. A version
# not in this matrix is not a claim.
#
# Wrong/missing credentials (scenario 7) behave the way build caches
# document: the build COMPLETES (remote failures are non-fatal), the
# extension logs "Error downloading/uploading cache item ... 401", and the
# server stores nothing. The assertion is exactly that — completed build,
# 401s at the server, zero stored entries — not a build failure.

on:
  push:
    branches: [main]
  pull_request:
  # Release-chain mode (design §2 Stage 5): the chain calls this suite
  # with the candidate image digest; the server under test is then the
  # exact candidate, not a from-source build.
  workflow_call:
    inputs:
      image-ref:
        description: 'candidate image reference (@sha256) to run the server from; empty = build from source'
        required: false
        type: string
        default: ''
    outputs:
      results:
        description: 'JSON list of the AC IDs this suite asserted, with results'
        value: ${{ jobs.acceptance-maven.outputs.results }}

permissions:
  contents: read

env:
  COLD_LOOKUPS: "2"   # GET 404s on an empty cache
  COLD_UPLOADS: "5"   # buildinfo + artifacts across both modules
  MODULES: "2"

jobs:
  acceptance-maven:
    name: acceptance-maven
    runs-on: ubuntu-latest
    # F05: release mode pulls the deliberately private candidates package;
    # a called workflow's unspecified permissions become NONE regardless
    # of the caller's ceiling, so the job must ask for packages: read
    # itself. Harmless in PR mode (unused; downgraded on forks).
    permissions:
      contents: read
      packages: read
    outputs:
      results: ${{ steps.results.outputs.results }}
    strategy:
      fail-fast: false
      matrix:
        extension-version: ["1.2.0", "1.2.3"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27'
          check-latest: true

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: pin the matrix extension version
        run: |
          sed -i "s|<version>[0-9.]*</version>|<version>${{ matrix.extension-version }}</version>|" \
            bench/maven-sample/.mvn/extensions.xml
          grep version bench/maven-sample/.mvn/extensions.xml

      - name: build fscache and start it WITH Basic Auth
        if: inputs.image-ref == ''
        run: |
          CGO_ENABLED=0 go build -o /tmp/fscache-mvn ./cmd/fscache
          FSCACHE_ADDR=:18098 FSCACHE_DATA_DIR=/tmp/fscache-mvn-data \
            FSCACHE_USERNAME=mvn FSCACHE_PASSWORD=acceptance-secret \
            /tmp/fscache-mvn & echo $! > /tmp/fscache-mvn.pid
          for _ in $(seq 1 20); do
            curl -sf http://localhost:18098/healthz && exit 0; sleep 0.5
          done
          echo "server never became healthy" >&2; exit 1

      - name: start the exact candidate image WITH Basic Auth (release-chain mode)
        if: inputs.image-ref != ''
        env:
          IMAGE_REF: ${{ inputs.image-ref }}
        run: |
          set -euo pipefail
          echo '${{ github.token }}' | docker login ghcr.io -u '${{ github.actor }}' --password-stdin
          docker run -d --name fscache-mvn-acc -p 127.0.0.1:18098:8080 \
            -e FSCACHE_USERNAME=mvn -e FSCACHE_PASSWORD=acceptance-secret \
            "${IMAGE_REF}"
          for _ in $(seq 1 20); do
            curl -sf http://localhost:18098/healthz && exit 0; sleep 0.5
          done
          echo "candidate image never became healthy" >&2
          docker logs fscache-mvn-acc >&2 || true
          exit 1

      - name: write settings.xml credential sets
        run: |
          mkdir -p /tmp/m2-good /tmp/m2-bad
          cat > /tmp/m2-good/settings.xml <<'XML'
          <settings>
            <servers>
              <server><id>fscache</id><username>mvn</username><password>acceptance-secret</password></server>
            </servers>
          </settings>
          XML
          sed 's/acceptance-secret/WRONG-password/' /tmp/m2-good/settings.xml > /tmp/m2-bad/settings.xml

      # Scenarios 1 + 6: a real multi-module build uploads remote entries,
      # authenticated via the documented settings.xml <server> conventions.
      - name: cold build (uploads; Basic Auth via settings.xml)
        working-directory: bench/maven-sample
        run: |
          rm -rf /tmp/mvn-bc lib/target app/target
          mvn -B -s /tmp/m2-good/settings.xml verify \
            -Dmaven.build.cache.location=/tmp/mvn-bc \
            -Dmaven.build.cache.remote.url=http://localhost:18098/maven \
            -Dmaven.build.cache.remote.save.enabled=true

      - name: assert the cold build populated the remote (server-side evidence)
        run: |
          set -euo pipefail
          curl -s -u mvn:acceptance-secret localhost:18098/metrics > /tmp/m-cold.txt
          puts=$(awk '/^fscache_http_requests_total\{method="PUT",status="201"\}/ {print $2}' /tmp/m-cold.txt || true)
          gets404=$(awk '/^fscache_http_requests_total\{method="GET",status="404"\}/ {print $2}' /tmp/m-cold.txt || true)
          echo "cold: uploads=${puts:-0} lookups-missed=${gets404:-0}"
          [ "${puts:-0}" -eq "$COLD_UPLOADS" ] || { echo "::error::cold uploads ${puts:-0}, expected $COLD_UPLOADS" >&2; exit 1; }
          [ "${gets404:-0}" -eq "$COLD_LOOKUPS" ] || { echo "::error::cold lookups ${gets404:-0}, expected $COLD_LOOKUPS" >&2; exit 1; }

      - name: checksum the cold build's artifacts
        working-directory: bench/maven-sample
        run: sha256sum lib/target/lib-*.jar app/target/app-*.jar | tee /tmp/cold-jars.sha256

      # Scenario 2: local outputs AND local cache removed — the warm build
      # can only be served by the remote.
      - name: wipe local outputs and local cache
        working-directory: bench/maven-sample
        run: rm -rf /tmp/mvn-bc lib/target app/target

      # Scenarios 3 + 5: the clean second build restores from fscache, and
      # the server's counters prove where the bytes came from.
      - name: warm build (must restore from the remote)
        working-directory: bench/maven-sample
        run: |
          mvn -B -s /tmp/m2-good/settings.xml verify \
            -Dmaven.build.cache.location=/tmp/mvn-bc \
            -Dmaven.build.cache.remote.url=http://localhost:18098/maven \
            -Dmaven.build.cache.remote.save.enabled=true | tee /tmp/warm.log

      - name: assert both modules restored, served by the remote
        run: |
          set -euo pipefail
          restored=$(grep -c 'Found cached build, restoring' /tmp/warm.log || true)
          echo "restored modules: ${restored}"
          [ "${restored}" -eq "$MODULES" ] || { echo "::error::${restored} modules restored, expected $MODULES" >&2; exit 1; }
          curl -s -u mvn:acceptance-secret localhost:18098/metrics > /tmp/m-warm.txt
          hits=$(awk '/^fscache_cache_hits_total/ {print $2}' /tmp/m-warm.txt)
          echo "server-side cache hits: ${hits:-0}"
          [ "${hits:-0}" -ge "$MODULES" ] || { echo "::error::server saw ${hits:-0} hits; the restore did not come from the remote" >&2; exit 1; }

      # Scenario 4: restored artifacts are the same bytes the cold build
      # uploaded.
      - name: assert restored artifacts are byte-identical
        working-directory: bench/maven-sample
        run: |
          set -euo pipefail
          sha256sum lib/target/lib-*.jar app/target/app-*.jar > /tmp/warm-jars.sha256
          diff -u /tmp/cold-jars.sha256 /tmp/warm-jars.sha256
          echo "restored jars byte-identical"

      # Scenario 7: wrong credentials, then no credentials. Documented
      # behavior: build completes, errors logged, server 401s, nothing
      # stored.
      - name: wrong and missing credentials fail the documented way
        working-directory: bench/maven-sample
        run: |
          set -euo pipefail
          before_puts=$(curl -s -u mvn:acceptance-secret localhost:18098/metrics \
            | awk '/^fscache_http_requests_total\{method="PUT",status="201"\}/ {print $2}')

          rm -rf /tmp/mvn-bad lib/target app/target
          mvn -B -s /tmp/m2-bad/settings.xml verify \
            -Dmaven.build.cache.location=/tmp/mvn-bad \
            -Dmaven.build.cache.remote.url=http://localhost:18098/maven \
            -Dmaven.build.cache.remote.save.enabled=true | tee /tmp/bad.log
          grep -q 'Error downloading cache item' /tmp/bad.log \
            || { echo "::error::wrong credentials produced no logged download errors" >&2; exit 1; }

          rm -rf /tmp/mvn-none lib/target app/target
          mvn -B verify \
            -Dmaven.build.cache.location=/tmp/mvn-none \
            -Dmaven.build.cache.remote.url=http://localhost:18098/maven \
            -Dmaven.build.cache.remote.save.enabled=true | tee /tmp/none.log
          grep -q 'Error downloading cache item' /tmp/none.log \
            || { echo "::error::missing credentials produced no logged download errors" >&2; exit 1; }

          after_puts=$(curl -s -u mvn:acceptance-secret localhost:18098/metrics \
            | awk '/^fscache_http_requests_total\{method="PUT",status="201"\}/ {print $2}')
          echo "stored uploads before=${before_puts} after=${after_puts}"
          [ "${after_puts}" -eq "${before_puts}" ] \
            || { echo "::error::unauthenticated runs stored entries on the server" >&2; exit 1; }

      # ── REQ-EVICT-002-AC4 ────────────────────────────────────────────
      # Same shape as the Gradle AC3 scenario: one module output larger
      # than the cap; the build completes twice, the oversized archive is
      # 413'd with the documented header, the small module still caches.
      - name: start a capped server (source mode)
        if: inputs.image-ref == ''
        run: |
          set -euo pipefail
          FSCACHE_ADDR=:18099 FSCACHE_DATA_DIR=/tmp/fscache-mvn-capped \
            FSCACHE_USERNAME=mvn FSCACHE_PASSWORD=acceptance-secret \
            FSCACHE_MAX_BYTES=262144 /tmp/fscache-mvn & echo $! > /tmp/fscache-mvn-capped.pid
          for _ in $(seq 1 20); do
            curl -sf http://localhost:18099/healthz && exit 0; sleep 0.5
          done
          echo "capped server never became healthy" >&2; exit 1

      - name: start a capped candidate (release-chain mode)
        if: inputs.image-ref != ''
        env:
          IMAGE_REF: ${{ inputs.image-ref }}
        run: |
          set -euo pipefail
          docker run -d --name fscache-mvn-capped -e FSCACHE_MAX_BYTES=262144 \
            -e FSCACHE_USERNAME=mvn -e FSCACHE_PASSWORD=acceptance-secret \
            -p 127.0.0.1:18099:8080 "${IMAGE_REF}"
          for _ in $(seq 1 20); do
            curl -sf http://localhost:18099/healthz && exit 0; sleep 0.5
          done
          echo "capped candidate never became healthy" >&2
          docker logs fscache-mvn-capped >&2 || true
          exit 1

      - name: REQ-EVICT-002-AC4 — oversized module output never caches, the build never cares
        run: |
          set -euo pipefail
          # One incompressible 512 KiB resource, generated ONCE and copied
          # byte-for-byte into BOTH workspaces. A per-workspace random file
          # (the old bug) gave the app module a DIFFERENT cache key in a and
          # b, so a warm restore of the app could never even be attempted and
          # the two keys could not be compared. Shared bytes => identical app
          # key across builds. 512 KiB exceeds the 256 KiB cap even after the
          # cache's gzip; the lib module stays small and caches normally.
          head -c 524288 /dev/urandom > /tmp/mvn-oversized-shared.bin
          for copy in a b; do
            cp -r bench/maven-sample "/tmp/mvn-capped-${copy}"
            rm -rf "/tmp/mvn-capped-${copy}/lib/target" "/tmp/mvn-capped-${copy}/app/target"
            mkdir -p "/tmp/mvn-capped-${copy}/app/src/main/resources"
            cp /tmp/mvn-oversized-shared.bin \
              "/tmp/mvn-capped-${copy}/app/src/main/resources/bench-large.bin"
          done
          # Keep the full build-cache extension log (INFO level, not -q) so
          # the real app artifact key and its 413 rejection are identifiable.
          run_build() { # dir, cache-location, logfile
            (cd "$1" && mvn -B -s /tmp/m2-good/settings.xml verify \
              -Dmaven.build.cache.location="$2" \
              -Dmaven.build.cache.remote.url=http://localhost:18099/maven \
              -Dmaven.build.cache.remote.save.enabled=true) 2>&1 | tee "$3"
          }
          run_build /tmp/mvn-capped-a /tmp/mvn-bc-capped-a /tmp/mvn-capped-a.log \
            || { echo "::error::first capped build failed - an oversized output must be a cache miss, never a build failure" >&2; exit 1; }
          run_build /tmp/mvn-capped-b /tmp/mvn-bc-capped-b /tmp/mvn-capped-b.log \
            || { echo "::error::second capped build failed - the oversized app must not break a same-key rebuild" >&2; exit 1; }

          # Proof 1 (shared-resource fix): the app hashed to the SAME key in
          # both builds. The local cache always stores a built module under
          # <loc>/v1.1/<group>/app/<KEY>/local/, independent of extension
          # version or remote outcome, so read the KEY off the filesystem.
          app_local_a=$(find /tmp/mvn-bc-capped-a -type f -path '*/app/*/local/app.jar' | head -1)
          app_local_b=$(find /tmp/mvn-bc-capped-b -type f -path '*/app/*/local/app.jar' | head -1)
          [ -n "$app_local_a" ] && [ -n "$app_local_b" ] \
            || { echo "::error::app module was not built into either local cache - cannot identify its key" >&2; exit 1; }
          app_key_a=$(basename "$(dirname "$(dirname "$app_local_a")")")
          app_key_b=$(basename "$(dirname "$(dirname "$app_local_b")")")
          echo "app cache key: a=${app_key_a} b=${app_key_b}"
          [ "$app_key_a" = "$app_key_b" ] \
            || { echo "::error::app cache key differs across workspaces (${app_key_a} vs ${app_key_b}) - the oversized resource was not shared byte-for-byte" >&2; exit 1; }
          app_key="$app_key_a"

          # Proof 2 (real key rejected): the extension UPLOADS the oversized
          # app artifact and the server answers 413 - it does not pre-skip.
          # Tie the 413 to the real app key, not to any incidental entry.
          grep -Eq 'status code: 413|Request Entity Too Large' /tmp/mvn-capped-a.log \
            || { echo "::error::build a logged no 413 - the oversized app upload was not rejected by the server" >&2; exit 1; }
          grep -Fq "app/${app_key}/app.jar" /tmp/mvn-capped-a.log \
            || { echo "::error::build a never attempted the app/${app_key}/app.jar remote save" >&2; exit 1; }

          # Proof 3 (remote absence of the real key): search the EXTENSION
          # CACHE directories, NOT the project tree - a remotely restored
          # artifact lands under fscache/, a locally built one under local/.
          # The oversized app.jar must appear under fscache/ in NEITHER build.
          if find /tmp/mvn-bc-capped-a /tmp/mvn-bc-capped-b -type f -path '*/app/*/fscache/*.jar' | grep -q .; then
            echo "::error::the oversized app archive was restored from the remote despite the cap" >&2; exit 1
          fi
          # ...and confirm directly on the server that the real app key holds
          # no artifact: HEAD the exact remote path -> 404.
          app_code=$(curl -s -u mvn:acceptance-secret -o /dev/null -w '%{http_code}' \
            -I "http://localhost:18099/maven/v1.1/com.fosterstack.bench/app/${app_key}/app.jar")
          [ "$app_code" = "404" ] \
            || { echo "::error::app/${app_key}/app.jar is retrievable from the remote (${app_code}) - the oversized artifact was stored" >&2; exit 1; }

          # Proof 4 (small module DID round-trip): on build b the lib module
          # is served from the remote - the extension logs the restore and the
          # downloaded artifact lands under fscache/ - and it is byte-identical
          # to build a's freshly compiled lib. This, not an aggregate PUT
          # count, is what proves the warm restore of the small module.
          grep -q 'Found cached build, restoring com.fosterstack.bench:lib' /tmp/mvn-capped-b.log \
            || { echo "::error::the small lib module was NOT restored from the remote on the second build" >&2; exit 1; }
          find /tmp/mvn-bc-capped-b -type f -path '*/lib/*/fscache/lib.jar' | grep -q . \
            || { echo "::error::lib was not populated from the remote (no fscache/lib.jar) on the second build" >&2; exit 1; }
          lib_a=$(sha256sum /tmp/mvn-capped-a/lib/target/lib-*.jar | awk '{print $1}')
          lib_b=$(sha256sum /tmp/mvn-capped-b/lib/target/lib-*.jar | awk '{print $1}')
          echo "lib sha256: a=${lib_a} b=${lib_b}"
          [ "$lib_a" = "$lib_b" ] \
            || { echo "::error::remotely restored lib jar differs from the uploaded bytes" >&2; exit 1; }

          # Mechanism check (kept, but NOT a substitute for the build evidence
          # above): the server's rejection contract, probed directly.
          head -c 524288 /dev/urandom > /tmp/mvn-oversized-probe.bin
          hdr=$(curl -s -u mvn:acceptance-secret -D - -o /dev/null -X PUT \
            --data-binary @/tmp/mvn-oversized-probe.bin http://localhost:18099/maven/oversizedprobe)
          grep -q '^HTTP/[0-9.]* 413' <<<"$hdr" || { echo "::error::oversized probe was not 413" >&2; exit 1; }
          grep -qi '^X-FSCache-Reject: entry-exceeds-cache-cap' <<<"$hdr" \
            || { echo "::error::413 lacks the X-FSCache-Reject: entry-exceeds-cache-cap header" >&2; exit 1; }
          code=$(curl -s -u mvn:acceptance-secret -o /dev/null -w '%{http_code}' -I http://localhost:18099/maven/oversizedprobe)
          [ "$code" = "404" ] || { echo "::error::rejected entry is retrievable (${code}) - it was stored" >&2; exit 1; }
          echo "REQ-EVICT-002-AC4: identical app key ${app_key} across builds; oversized app upload 413'd and absent from the remote; small lib restored remotely byte-for-byte; reject mechanism verified"

      - name: stop the capped server
        if: always()
        run: |
          kill "$(cat /tmp/fscache-mvn-capped.pid)" 2>/dev/null || true
          docker rm -f fscache-mvn-capped 2>/dev/null || true

      # Reached only when every assertion above passed (matrix legs
      # report identical results; last writer wins, harmlessly).
      - name: report the ACs this suite asserted
        id: results
        run: |
          echo 'results=[{"ac":"REQ-MAVEN-001-AC1","result":"pass"},{"ac":"REQ-MAVEN-001-AC2","result":"pass"},{"ac":"REQ-EVICT-002-AC4","result":"pass"}]' >> "$GITHUB_OUTPUT"

      - name: stop fscache
        if: always()
        run: kill "$(cat /tmp/fscache-mvn.pid)" 2>/dev/null || true
