name: Acceptance

# The client acceptance suites: Gradle, then Maven once per extension version (1.2.0, 1.2.3), in the one required job `acceptance`.
# Push to main and pull requests run them from source. The release chain does not call this file (REQ-CHAIN-006-AC10): Check runs
# the suites through bin/check-acceptance.sh, and this file starts no container image (REQ-SUP-001-AC29).

on:
  push:
    branches: [main]
  pull_request:

# A pull request's FIRST run attempt of this workflow shares a group with the pull request's other first attempts, so a newer push cancels its older run. Every other run (whatever
# its event, and any re-run of any head) gets a group of its own per run and attempt: it is never cancelled, never replaced as a pending run, and a re-run of an old head cancels
# nothing. The prefix is a literal, not github.workflow, so no workflow name can collide with another's group.
concurrency:
  group: ${{ github.event_name == 'pull_request' && github.run_attempt == '1' && format('acceptance-pr-{0}', github.event.pull_request.number) || format('acceptance-{0}-{1}', github.run_id, github.run_attempt) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  acceptance:
    name: acceptance
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27'
          check-latest: true

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: build fscache from source
        run: CGO_ENABLED=0 go build -o /tmp/fscache-bench ./cmd/fscache

      - name: start fscache
        run: |
          FSCACHE_ADDR=:18095 FSCACHE_DATA_DIR=/tmp/fscache-bench-data /tmp/fscache-bench &
          echo $! > /tmp/fscache-bench.pid
          for _ in $(seq 1 20); do
            curl -sf http://localhost:18095/healthz && exit 0
            sleep 0.5
          done
          echo "fscache never became healthy" >&2
          exit 1

      - name: the Gradle suite (bin/acceptance-gradle.sh, REQ-GRADLE-001-AC1..AC4)
        run: bash bin/acceptance-gradle.sh

      # ── REQ-EVICT-002-AC3 ────────────────────────────────────────────
      # A build with one cacheable output larger than the configured cap
      # must complete normally, twice: the oversized entry is 413'd with
      # the documented header and simply never cached; other outputs
      # still round-trip. The cap (48 KiB) sits between the compiled-class
      # entries (KBs) and the 64 KiB resource injected below.
      - name: start a capped server (source mode)
        run: |
          set -euo pipefail
          FSCACHE_ADDR=:18096 FSCACHE_DATA_DIR=/tmp/fscache-capped-data \
            FSCACHE_MAX_BYTES=49152 /tmp/fscache-bench & echo $! > /tmp/fscache-capped.pid
          for _ in $(seq 1 20); do
            curl -sf http://localhost:18096/healthz && exit 0; sleep 0.5
          done
          echo "capped server never became healthy" >&2; exit 1

      - name: the Gradle capped-server suite (bin/acceptance-gradle-capped.sh, REQ-EVICT-002-AC3)
        run: bash bin/acceptance-gradle-capped.sh

      # Each extension version starts from a clean state (as its own runner once did), with the server WITH Basic Auth on 18098.
      # REQ-EVICT-002-AC4: the capped server (on 18099) is the same shape as the Gradle AC3 scenario: one module output larger
      # than the cap; the build completes twice, the oversized archive is 413'd with the documented header, the small module still caches.
      - name: the Maven suites, once per extension version (bin/acceptance-maven.sh, REQ-MAVEN-001-AC1, AC2; bin/acceptance-maven-capped.sh, REQ-EVICT-002-AC4)
        env:
          COLD_LOOKUPS: "2"   # GET 404s on an empty cache
          COLD_UPLOADS: "5"   # buildinfo + artifacts across both modules
          MODULES: "2"
        run: |
          set -euo pipefail
          wait_healthy() {
            for _ in $(seq 1 20); do
              curl -sf "http://localhost:$1/healthz" && return 0; sleep 0.5
            done
            echo "server on $1 never became healthy" >&2; return 1
          }
          for v in 1.2.0 1.2.3; do
            rm -rf /tmp/fscache-mvn-data /tmp/fscache-mvn-capped /tmp/mvn-* /tmp/m2-* /tmp/m-cold* /tmp/m-warm* \
              bench/maven-sample/target bench/maven-sample/lib/target bench/maven-sample/app/target
            sed -i "s|<version>[0-9.]*</version>|<version>$v</version>|" bench/maven-sample/.mvn/extensions.xml
            grep version bench/maven-sample/.mvn/extensions.xml
            FSCACHE_ADDR=:18098 FSCACHE_DATA_DIR=/tmp/fscache-mvn-data \
              FSCACHE_USERNAME=mvn FSCACHE_PASSWORD=acceptance-secret \
              /tmp/fscache-bench & echo $! > /tmp/fscache-mvn.pid
            wait_healthy 18098
            bash bin/acceptance-maven.sh
            FSCACHE_ADDR=:18099 FSCACHE_DATA_DIR=/tmp/fscache-mvn-capped \
              FSCACHE_USERNAME=mvn FSCACHE_PASSWORD=acceptance-secret \
              FSCACHE_MAX_BYTES=262144 /tmp/fscache-bench & echo $! > /tmp/fscache-mvn-capped.pid
            wait_healthy 18099
            bash bin/acceptance-maven-capped.sh
            kill "$(cat /tmp/fscache-mvn.pid)" "$(cat /tmp/fscache-mvn-capped.pid)"
            # the next round binds the same ports: wait until both servers have exited (a killed job's status is 143)
            wait "$(cat /tmp/fscache-mvn.pid)" "$(cat /tmp/fscache-mvn-capped.pid)" || true
          done

      - name: stop the servers
        if: always()
        run: |
          for f in fscache-capped fscache-bench fscache-mvn fscache-mvn-capped; do
            kill "$(cat "/tmp/$f.pid")" 2>/dev/null || true
          done
