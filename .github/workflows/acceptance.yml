name: Acceptance

# The client acceptance suites (workflow consolidation 4 of 4, owner RATIFIED Oct 2): acceptance-gradle.yml and
# acceptance-maven.yml merged, unchanged. Each job keeps its required check name (acceptance-gradle; acceptance-maven
# (1.2.0) and (1.2.3) from its matrix), its permissions and its results output. Push to main and pull requests run
# them from source; release.yml calls this file once with the candidate image and hands both results to the
# acceptance predicate.

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      image-ref:
        description: 'candidate image reference (@sha256) to run the server from; empty = build from source'
        required: false
        type: string
        default: ''
    outputs:
      gradle-results:
        description: 'JSON list of the AC IDs the Gradle suite asserted, with results'
        value: ${{ jobs.acceptance-gradle.outputs.results }}
      maven-results:
        description: 'JSON list of the AC IDs the Maven suite asserted, with results'
        value: ${{ jobs.acceptance-maven.outputs.results }}

permissions:
  contents: read

jobs:
  acceptance-gradle:
    name: acceptance-gradle
    runs-on: ubuntu-latest
    # F05: release mode pulls the deliberately private candidates package;
    # a called workflow's unspecified permissions become NONE regardless
    # of the caller's ceiling, so the job must ask for packages: read
    # itself. Harmless in PR mode (unused; downgraded on forks).
    permissions:
      contents: read
      packages: read
    outputs:
      results: ${{ steps.results.outputs.results }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27'
          check-latest: true

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'

      - name: build fscache from source
        if: inputs.image-ref == ''
        run: CGO_ENABLED=0 go build -o /tmp/fscache-bench ./cmd/fscache

      - name: start fscache
        if: inputs.image-ref == ''
        run: |
          FSCACHE_ADDR=:18095 FSCACHE_DATA_DIR=/tmp/fscache-bench-data /tmp/fscache-bench &
          echo $! > /tmp/fscache-bench.pid
          for _ in $(seq 1 20); do
            curl -sf http://localhost:18095/healthz && exit 0
            sleep 0.5
          done
          echo "fscache never became healthy" >&2
          exit 1

      - name: refuse an image-ref that is not pinned by digest
        if: inputs.image-ref != ''
        env:
          IMAGE_REF: ${{ inputs.image-ref }}
        run: |
          set -euo pipefail
          pin_re='^[a-z0-9]+([._/:-][a-z0-9]+)*@sha256:[0-9a-f]{64}$'
          if ! [[ "${IMAGE_REF}" =~ $pin_re ]]; then
            printf 'image-ref must be name@sha256:<64 lowercase hex>, got: %q\n' "${IMAGE_REF}" >&2
            exit 1
          fi

      - name: start the exact candidate image (release-chain mode)
        if: inputs.image-ref != ''
        env:
          IMAGE_REF: ${{ inputs.image-ref }}
        run: |
          set -euo pipefail
          echo '${{ github.token }}' | docker login ghcr.io -u '${{ github.actor }}' --password-stdin
          docker run -d --name fscache-acc -p 127.0.0.1:18095:8080 "${IMAGE_REF}"
          for _ in $(seq 1 20); do
            curl -sf http://localhost:18095/healthz && exit 0
            sleep 0.5
          done
          echo "candidate image never became healthy" >&2
          docker logs fscache-acc >&2 || true
          exit 1

      - name: the Gradle suite (bin/acceptance-gradle.sh, REQ-GRADLE-001-AC1..AC4)
        run: bash bin/acceptance-gradle.sh

      # ── REQ-EVICT-002-AC3 ────────────────────────────────────────────
      # A build with one cacheable output larger than the configured cap
      # must complete normally, twice: the oversized entry is 413'd with
      # the documented header and simply never cached; other outputs
      # still round-trip. The cap (48 KiB) sits between the compiled-class
      # entries (KBs) and the 64 KiB resource injected below.
      - name: start a capped server (source mode)
        if: inputs.image-ref == ''
        run: |
          set -euo pipefail
          FSCACHE_ADDR=:18096 FSCACHE_DATA_DIR=/tmp/fscache-capped-data \
            FSCACHE_MAX_BYTES=49152 /tmp/fscache-bench & echo $! > /tmp/fscache-capped.pid
          for _ in $(seq 1 20); do
            curl -sf http://localhost:18096/healthz && exit 0; sleep 0.5
          done
          echo "capped server never became healthy" >&2; exit 1

      - name: start a capped candidate (release-chain mode)
        if: inputs.image-ref != ''
        env:
          IMAGE_REF: ${{ inputs.image-ref }}
        run: |
          set -euo pipefail
          docker run -d --name fscache-capped -e FSCACHE_MAX_BYTES=49152 \
            -p 127.0.0.1:18096:8080 "${IMAGE_REF}"
          for _ in $(seq 1 20); do
            curl -sf http://localhost:18096/healthz && exit 0; sleep 0.5
          done
          echo "capped candidate never became healthy" >&2
          docker logs fscache-capped >&2 || true
          exit 1

      - name: the Gradle capped-server suite and its results (bin/acceptance-gradle-capped.sh, REQ-EVICT-002-AC3)
        id: results
        run: bash bin/acceptance-gradle-capped.sh

      - name: stop the capped server
        if: always()
        run: |
          kill "$(cat /tmp/fscache-capped.pid)" 2>/dev/null || true
          docker rm -f fscache-capped 2>/dev/null || true

      - name: stop fscache
        if: always()
        run: kill "$(cat /tmp/fscache-bench.pid)" 2>/dev/null || true

  acceptance-maven:
    name: acceptance-maven
    env:   # the scenario counts (top-level in acceptance-maven.yml; moved onto this job unchanged)
      COLD_LOOKUPS: "2"   # GET 404s on an empty cache
      COLD_UPLOADS: "5"   # buildinfo + artifacts across both modules
      MODULES: "2"
    runs-on: ubuntu-latest
    # F05: release mode pulls the deliberately private candidates package;
    # a called workflow's unspecified permissions become NONE regardless
    # of the caller's ceiling, so the job must ask for packages: read
    # itself. Harmless in PR mode (unused; downgraded on forks).
    permissions:
      contents: read
      packages: read
    outputs:
      results: ${{ steps.results.outputs.results }}
    strategy:
      fail-fast: false
      matrix:
        extension-version: ["1.2.0", "1.2.3"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27'
          check-latest: true

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: pin the matrix extension version
        run: |
          sed -i "s|<version>[0-9.]*</version>|<version>${{ matrix.extension-version }}</version>|" \
            bench/maven-sample/.mvn/extensions.xml
          grep version bench/maven-sample/.mvn/extensions.xml

      - name: build fscache and start it WITH Basic Auth
        if: inputs.image-ref == ''
        run: |
          CGO_ENABLED=0 go build -o /tmp/fscache-mvn ./cmd/fscache
          FSCACHE_ADDR=:18098 FSCACHE_DATA_DIR=/tmp/fscache-mvn-data \
            FSCACHE_USERNAME=mvn FSCACHE_PASSWORD=acceptance-secret \
            /tmp/fscache-mvn & echo $! > /tmp/fscache-mvn.pid
          for _ in $(seq 1 20); do
            curl -sf http://localhost:18098/healthz && exit 0; sleep 0.5
          done
          echo "server never became healthy" >&2; exit 1

      - name: refuse an image-ref that is not pinned by digest
        if: inputs.image-ref != ''
        env:
          IMAGE_REF: ${{ inputs.image-ref }}
        run: |
          set -euo pipefail
          pin_re='^[a-z0-9]+([._/:-][a-z0-9]+)*@sha256:[0-9a-f]{64}$'
          if ! [[ "${IMAGE_REF}" =~ $pin_re ]]; then
            printf 'image-ref must be name@sha256:<64 lowercase hex>, got: %q\n' "${IMAGE_REF}" >&2
            exit 1
          fi

      - name: start the exact candidate image WITH Basic Auth (release-chain mode)
        if: inputs.image-ref != ''
        env:
          IMAGE_REF: ${{ inputs.image-ref }}
        run: |
          set -euo pipefail
          echo '${{ github.token }}' | docker login ghcr.io -u '${{ github.actor }}' --password-stdin
          docker run -d --name fscache-mvn-acc -p 127.0.0.1:18098:8080 \
            -e FSCACHE_USERNAME=mvn -e FSCACHE_PASSWORD=acceptance-secret \
            "${IMAGE_REF}"
          for _ in $(seq 1 20); do
            curl -sf http://localhost:18098/healthz && exit 0; sleep 0.5
          done
          echo "candidate image never became healthy" >&2
          docker logs fscache-mvn-acc >&2 || true
          exit 1

      - name: the Maven suite (bin/acceptance-maven.sh, REQ-MAVEN-001-AC1, AC2)
        run: bash bin/acceptance-maven.sh

      # ── REQ-EVICT-002-AC4 ────────────────────────────────────────────
      # Same shape as the Gradle AC3 scenario: one module output larger
      # than the cap; the build completes twice, the oversized archive is
      # 413'd with the documented header, the small module still caches.
      - name: start a capped server (source mode)
        if: inputs.image-ref == ''
        run: |
          set -euo pipefail
          FSCACHE_ADDR=:18099 FSCACHE_DATA_DIR=/tmp/fscache-mvn-capped \
            FSCACHE_USERNAME=mvn FSCACHE_PASSWORD=acceptance-secret \
            FSCACHE_MAX_BYTES=262144 /tmp/fscache-mvn & echo $! > /tmp/fscache-mvn-capped.pid
          for _ in $(seq 1 20); do
            curl -sf http://localhost:18099/healthz && exit 0; sleep 0.5
          done
          echo "capped server never became healthy" >&2; exit 1

      - name: start a capped candidate (release-chain mode)
        if: inputs.image-ref != ''
        env:
          IMAGE_REF: ${{ inputs.image-ref }}
        run: |
          set -euo pipefail
          docker run -d --name fscache-mvn-capped -e FSCACHE_MAX_BYTES=262144 \
            -e FSCACHE_USERNAME=mvn -e FSCACHE_PASSWORD=acceptance-secret \
            -p 127.0.0.1:18099:8080 "${IMAGE_REF}"
          for _ in $(seq 1 20); do
            curl -sf http://localhost:18099/healthz && exit 0; sleep 0.5
          done
          echo "capped candidate never became healthy" >&2
          docker logs fscache-mvn-capped >&2 || true
          exit 1

      - name: the Maven capped-server suite and its results (bin/acceptance-maven-capped.sh, REQ-EVICT-002-AC4)
        id: results
        run: bash bin/acceptance-maven-capped.sh

      - name: stop the capped server
        if: always()
        run: |
          kill "$(cat /tmp/fscache-mvn-capped.pid)" 2>/dev/null || true
          docker rm -f fscache-mvn-capped 2>/dev/null || true

      - name: stop fscache
        if: always()
        run: kill "$(cat /tmp/fscache-mvn.pid)" 2>/dev/null || true
