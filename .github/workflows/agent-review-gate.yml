name: Agent review gate

# REQ-AUD-18 AC3: the verdict runs main's copies of three checks over the PR head, read as git objects, and
# judges no review record. Register row 78: every action reference in the PR head must be a full commit digest
# (.github/agent/bin/check-action-pins.py, main's copy). Here — not in a check of its own — because this check
# is the one a PR cannot skip, edit or impersonate (below).
#
# The same verdict also runs main's copies of the allowlist guard (bin/check-file-allowlist.sh, over the head's
# file list, with ALLOWLIST_HEAD_REV so the head is judged as a commit) and of the pin-wiring judge
# (.github/agent/tests/pin-wiring-test.sh, PIN_WIRING_JUDGE_GIT, over the head's ci.yml), so a PR cannot
# disable its own whole-tree guard by editing ci.yml.
#
# Protected by construction (review loop, both vendors):
# - pull_request_target: GitHub always runs the DEFAULT branch's copy of this file, so a PR can
#   neither edit nor skip its own gate; the judge checks out the base branch only, so the gate
#   script is main's too. The baseline (ops/docs/cicd-security-baseline.md) forbids
#   pull_request_target WITH CHECKOUT OF PR CODE — never done here: PR heads are fetched as git
#   objects and read only through `git ls-tree` / `git diff` / `git show`; nothing is checked out,
#   installed or executed.
# - The verdict is the check run `auditor-review-gate`, created by the `fosterstack-automation`
#   App (register row 56: one generic App, no sprawl) with a token scoped to checks:write. Its
#   credentials are secrets of the `agent` environment, restricted to the default branch: a PR's
#   own `pull_request` workflow runs on refs/pull/N/merge and cannot reach them. The ruleset pins
#   the required check to that App, so a same-named check from any Actions job does not satisfy
#   it. The auditor's own use of the App is downscoped to contents + pull-requests (auditor.yml).
# - Judge and publish are separate jobs on PR events: the judge reads PR data and holds no
#   secret; the publisher holds the App token and never touches PR data.
# - Only PRs into the default branch are judged, against the checked-out default branch (never the
#   event's base), and `edited` (a retarget) re-runs the gate.
# - Dependabot-triggered runs get no environment secrets, so a Dependabot PR's publish finds no
#   App credentials. The scheduled SWEEP (not Dependabot-triggered) judges every open PR into the
#   default branch whose head has no auditor-review-gate check from the App yet, and publishes.
#   The sweep holds the App token while reading PR data — still as git objects only, never
#   executed; it runs only the default branch's gate script.
#
# THE MERGE QUEUE (REQ-DEP-005-AC3, cache#542). The required check `auditor-review-gate` must also be posted on the
# merge queue's head, by the App. The queue judge is a `workflow_run` job, not a `merge_group` job, because a
# merge_group run has a GITHUB_REF that is never the default branch, so it cannot reach the `agent` environment that
# holds the App credentials. `workflow_run` runs the default branch's copy of this file, so the group never edits it.
# - queue-judge holds no secret and runs no code of the group: the head is fetched as a git object and only main's
#   .github/agent/bin/queue-gate-judge.sh reads it. queue-publish holds the App token and touches no group data.
# - `requested` fires when the queue starts CI, so the verdict is posted early. A missing verdict leaves the check
#   absent and the queue ejects the group at its timeout: that fails closed, and no sweep covers it.
# - Every failure to read, validate or judge publishes failure, never success.

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, edited]
  # the merge queue's CI run (REQ-DEP-005-AC3): the job `queue-judge` only; every other job tests event_name
  workflow_run:
    workflows: [CI]
    types: [requested]
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
    inputs:
      audit_pr:
        description: 'Write the passed-audit record (REQ-REL-012) for this pull request number; with audit_head'
        type: string
        default: ''
      audit_head:
        description: 'The pull request head sha the record is for (40 lower-case hex); empty = run the sweep'
        type: string
        default: ''

permissions: {}

concurrency:
  group: >-
    agent-review-gate-${{ github.event.pull_request.number
    || (inputs.audit_head != '' && format('record-{0}', inputs.audit_pr))
    || (github.event_name == 'workflow_run'
        && format('queue-{0}-{1}', github.event.workflow_run.event, github.event.workflow_run.head_sha))
    || 'sweep' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request_target' }}

jobs:
  judge:
    name: agent review gate — judge
    if: github.event_name == 'pull_request_target' && github.event.pull_request.base.ref == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      verdict: ${{ steps.gate.outputs.verdict }}
    steps:
      # the DEFAULT branch: the gate code that judges the PR is never the PR's own
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: fetch the PR head as data (never checked out, never executed)
        env:
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "+refs/pull/${PR}/head:refs/remotes/pr/head"
          got="$(git rev-parse refs/remotes/pr/head)"
          [ "$got" = "$HEAD_SHA" ] || { echo "::error::PR head moved (${got} != ${HEAD_SHA}); a newer run judges it" >&2; exit 1; }

      - name: run the default branch's review gate and pin check over the PR head
        id: gate
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ github.token }}   # read-only: resolves each `# vX` tag to its commit
          # the PR's identity, as the ci allowlist job sees it, for main's copy of the allowlist guard
          GITHUB_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          GITHUB_BASE_REF: ${{ github.event.pull_request.base.ref }}
          GITHUB_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          set -uo pipefail
          # judged by the checked-out default branch's copies (HEAD), never the PR's
          verdict=success
          # row 78: every action reference in the head is a commit digest (git objects only)
          python3 -I .github/agent/bin/check-action-pins.py --verify-tags --git "$HEAD_SHA" || verdict=failure
          # the PR cannot run its own copy of its guard: main's allowlist script judges the head's file list
          # and main's pin-wiring judge reads the head's ci.yml, both as git objects (nothing of the PR runs)
          git ls-tree -r -z --name-only "$HEAD_SHA" | ALLOWLIST_NUL=1 ALLOWLIST_HEAD_REV="$HEAD_SHA" bash bin/check-file-allowlist.sh || verdict=failure
          mkdir -p "$RUNNER_TEMP/yaml-shim" && ln -sfn "$PWD/.github/agent/fixtures/testlib/pyyaml" "$RUNNER_TEMP/yaml-shim/yaml"
          PYTHONPATH="$RUNNER_TEMP/yaml-shim" PIN_WIRING_JUDGE_GIT="$HEAD_SHA" bash .github/agent/tests/pin-wiring-test.sh || verdict=failure
          # REQ-SCAN-015: main's scanner guard judges the head's workflows and composite actions as git objects, so a step
          # of the PR's own CI that overwrites the guard on disk changes nothing
          PYTHONPATH="$RUNNER_TEMP/yaml-shim" SCAN_GUARD_JUDGE_GIT="$HEAD_SHA" bash bin/scan-no-workflow-call-test.sh || verdict=failure
          # REQ-REL-012 (release process rule 6): a pull request into main carries a passed-audit record for its exact head. Main's judge and main's writers policy read the record
          # branch audit/<head sha> through the read-only token; the pull request supplies only its head sha and nothing else
          bash bin/audit-record-judge.sh "$HEAD_SHA" "$GITHUB_BASE_REF" || verdict=failure
          echo "verdict=${verdict}" >> "$GITHUB_OUTPUT"
          [ "$verdict" = success ]

  publish:
    name: agent review gate — publish
    needs: judge
    # not on cancellation (a superseded run must not overwrite a newer verdict on the same head)
    if: ${{ !cancelled() && github.event_name == 'pull_request_target' && github.event.pull_request.base.ref == github.event.repository.default_branch }}
    runs-on: ubuntu-latest
    environment: agent
    permissions: {}
    steps:
      - name: are the App credentials available to this run?
        id: cfg
        env:
          APP_ID: ${{ secrets.AUDITOR_APP_ID }}
        run: |
          if [ -n "$APP_ID" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"
          else echo "::notice::no App credentials in this run (a Dependabot-triggered run gets none) — the scheduled sweep publishes this PR's check"; echo "ok=false" >> "$GITHUB_OUTPUT"; fi

      - name: mint the App token (checks:write only)
        id: app
        if: steps.cfg.outputs.ok == 'true'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.AUDITOR_APP_ID }}
          private-key: ${{ secrets.AUDITOR_APP_PRIVATE_KEY }}
          repositories: cache
          permission-checks: write

      - name: publish the auditor-review-gate check run on the PR head
        if: steps.cfg.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          VERDICT: ${{ needs.judge.outputs.verdict }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          # the queue's own publisher owns this check name on a queue head: a later post would replace its verdict
          queue_tips="$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}" 'refs/heads/gh-readonly-queue/*')" \
            || { echo "::warning::the merge queue branches could not be listed: nothing is posted"; exit 0; }
          tips="$(cut -f1 <<<"$queue_tips")"
          if grep -qxF "$HEAD_SHA" <<<"$tips"; then
            echo "::notice::this head is the tip of a live merge queue branch: the queue publishes its verdict"; exit 0
          fi
          if [ "$VERDICT" = "success" ]; then conclusion=success; summary="Every action reference is a commit digest, and the allowlist guard, the pin-wiring judge, the scanner guard and the passed-audit record for this head passed."
          else conclusion=failure; summary="An action reference is not a commit digest, or the allowlist guard, the pin-wiring judge, the scanner guard or the passed-audit record failed (or the judge did not finish) — see the run log."; fi
          gh api "repos/${GITHUB_REPOSITORY}/check-runs" -f name=auditor-review-gate -f head_sha="$HEAD_SHA" \
            -f status=completed -f conclusion="$conclusion" -f details_url="$RUN_URL" \
            -f "output[title]=auditor review gate: ${conclusion}" -f "output[summary]=${summary}" >/dev/null

  # REQ-REL-012 (release process rule 6): the writer of the passed-audit record. Dispatched with a pull request number and its head sha by the step that clears the review; it takes
  # nothing else from the pull request. Main's copy of bin/audit-record-write.sh re-reads the pull request (open, into main, this head) and makes ONE signed commit on audit/<head sha>,
  # through the App's token scoped to contents write and pull-requests read (the lane guard allows audit/ and only audit/<that sha>). It holds no PR data other than the two inputs and runs nothing of the PR.
  record:
    name: agent review gate — passed-audit record writer
    if: github.event_name == 'workflow_dispatch' && inputs.audit_head != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: agent
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: mint the App token (contents write, pull requests read)
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.AUDITOR_APP_ID }}
          private-key: ${{ secrets.AUDITOR_APP_PRIVATE_KEY }}
          repositories: cache
          permission-contents: write
          permission-pull-requests: read

      - name: may a record be written? (the pull request is open, into main, with this exact head; no passing record yet)
        id: prep
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          AUDIT_PR: ${{ inputs.audit_pr }}
          AUDIT_HEAD: ${{ inputs.audit_head }}
          AUDIT_ACTOR: ${{ github.triggering_actor }}
        run: |
          set -euo pipefail
          state=$(bash bin/audit-record-prepare.sh "$AUDIT_PR" "$AUDIT_HEAD" | tail -n 1)
          echo "state=${state}" >> "$GITHUB_OUTPUT"

      - name: make the signed record commit (one commit on audit/<head>, parented on the head)
        if: steps.prep.outputs.state == 'proceed'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          AUDIT_HEAD: ${{ inputs.audit_head }}
        run: python3 .github/agent/bin/auditor-signed-commit.py --repo "$GITHUB_REPOSITORY" --branch "audit/${AUDIT_HEAD}" --base "$AUDIT_HEAD" --prefix audit/ --message "audit record" --path audit-record

      - name: judge what was written, as the review gate will
        if: steps.prep.outputs.state == 'proceed'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          AUDIT_HEAD: ${{ inputs.audit_head }}
        run: bash bin/audit-record-judge.sh "$AUDIT_HEAD" main

  # REQ-DEP-005-AC3: the review gate on the merge queue's head (see the header).
  queue-judge:
    name: agent review gate — queue judge
    if: github.event_name == 'workflow_run' && github.event.workflow_run.event == 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read   # the allowlist guard's one lookup of the pull request's head branch
    outputs:
      verdict: ${{ steps.judge.outputs.verdict }}
    steps:
      # the DEFAULT branch only: no ref, path or repository from workflow_run
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: fetch the queue head as data (never checked out, never executed) and judge it with main's script
        id: judge
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          # read-only: tag lookups, the passed-audit records, the pull request's head branch
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          verdict=failure
          # kept: gh-readonly-queue/main/pr-9-<sha>; emptied: feature/x, gh-readonly-queue/main/a..b, one with a space
          case "$HEAD_BRANCH" in
            gh-readonly-queue/main/*[!A-Za-z0-9._/-]* | *..* | gh-readonly-queue/main/) HEAD_BRANCH= ;;
            gh-readonly-queue/main/*) ;;
            *) HEAD_BRANCH= ;;
          esac
          # the fetched tip must be the event's head: that, not the ref's name, ties the ref to the head
          if [ "${#HEAD_SHA}" -eq 40 ] && [[ "$HEAD_SHA" != *[!0-9a-f]* ]] && [ -n "$HEAD_BRANCH" ] \
             && git fetch --no-tags -q origin "+refs/heads/main:refs/remotes/origin/main" \
             && git fetch --no-tags -q origin "+refs/heads/${HEAD_BRANCH}:refs/remotes/queue/head" \
             && [ "$(git rev-parse refs/remotes/queue/head)" = "$HEAD_SHA" ] \
             && bash .github/agent/bin/queue-gate-judge.sh "$HEAD_SHA" "$HEAD_BRANCH"; then
            verdict=success
          fi
          echo "verdict=${verdict}" >> "$GITHUB_OUTPUT"
          [ "$verdict" = success ]

  queue-publish:
    name: agent review gate — queue publish
    needs: queue-judge
    # not on cancellation (a superseded run must not overwrite a newer verdict on the same head)
    if: ${{ !cancelled() && github.event_name == 'workflow_run' && github.event.workflow_run.event == 'merge_group' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: agent
    permissions: {}
    steps:
      - name: mint the App token (checks:write only)
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.AUDITOR_APP_ID }}
          private-key: ${{ secrets.AUDITOR_APP_PRIVATE_KEY }}
          repositories: cache
          permission-checks: write

      - name: publish the auditor-review-gate check run on the queue head
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          VERDICT: ${{ needs.queue-judge.outputs.verdict }}
          RUN_LINK: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          [ "${#HEAD_SHA}" -eq 40 ] && [[ "$HEAD_SHA" != *[!0-9a-f]* ]] \
            || { echo "::error::the queue head is not 40 lower-case hex" >&2; exit 1; }
          if [ "$VERDICT" = "success" ]; then
            conclusion=success
            summary="Every pull request in the merge group has a passed-audit record, and main's judges passed."
          else
            conclusion=failure
            summary="The merge group is not a chain of merges, a pull request has no readable passed-audit record,"
            summary="${summary} or a judge failed (or did not finish) — see the run log."
          fi
          gh api "repos/${GITHUB_REPOSITORY}/check-runs" -f name=auditor-review-gate -f head_sha="$HEAD_SHA" \
            -f status=completed -f conclusion="$conclusion" -f details_url="$RUN_LINK" \
            -f "output[title]=auditor review gate: ${conclusion}" -f "output[summary]=${summary}" >/dev/null

  sweep:
    name: agent review gate — sweep
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.audit_head == '')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: agent
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: mint the App token (checks:write only)
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.AUDITOR_APP_ID }}
          private-key: ${{ secrets.AUDITOR_APP_PRIVATE_KEY }}
          repositories: cache
          permission-checks: write

      - name: judge and publish every open PR into the default branch that has no verdict yet
        env:
          LIST_TOKEN: ${{ github.token }}
          APP_TOKEN: ${{ steps.app.outputs.token }}
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
          DEFAULT: ${{ github.event.repository.default_branch }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -uo pipefail
          GH_TOKEN="$LIST_TOKEN" gh pr list --base "$DEFAULT" --state open --limit 200 \
            --json number,headRefOid,headRefName,headRepository,headRepositoryOwner \
            --jq '.[] | "\(.number) \(.headRefOid) \(.headRefName) \((.headRepositoryOwner.login // "") + "/" + (.headRepository.name // ""))"' > "$RUNNER_TEMP/prs.txt"
          mkdir -p "$RUNNER_TEMP/yaml-shim" && ln -sfn "$PWD/.github/agent/fixtures/testlib/pyyaml" "$RUNNER_TEMP/yaml-shim/yaml"
          fail=0
          while read -r n sha headref headrepo; do
            case "$n$sha" in *[!0-9a-f]*) echo "::error::unexpected PR list line"; fail=1; continue ;; esac
            # the App's latest verdict on this head: none -> judge; success -> done; a failure from the
            # last 6 hours -> judge again (a transient failure, e.g. the tag API, must not strand the
            # head) and publish only if it has turned to success, so a head that still fails is not
            # re-posted every sweep; an older failure waits for a push or a re-run (API budget)
            last="$(GH_TOKEN="$APP_TOKEN" gh api \
              "repos/${GITHUB_REPOSITORY}/commits/${sha}/check-runs?check_name=auditor-review-gate" \
              --jq "[.check_runs[] | select(.app.slug == \"${APP_SLUG}\")] | sort_by(.completed_at) | last
                    | if . == null then \"none\" elif .conclusion == \"success\" then \"success\"
                      elif (now - (.completed_at | fromdate)) < 21600 then \"failure\" else \"stale\" end")" \
              || { fail=1; continue; }
            case "$last" in success) continue ;; esac
            # an older failure waits for a push or a re-run, EXCEPT when the head has a passed-audit record branch now (REQ-REL-012: the record is written after the review clears, which can be
            # hours after the first "no record" verdict, and no event of the pull request re-runs its gate): one cheap lookup, then it is judged again like a recent failure
            if [ "$last" = stale ]; then
              GH_TOKEN="$LIST_TOKEN" gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/audit/${sha}" > /dev/null 2>&1 || continue
              last=failure
            fi
            git fetch --no-tags -q origin "+refs/pull/${n}/head:refs/remotes/pr/${n}" || { fail=1; continue; }
            [ "$(git rev-parse "refs/remotes/pr/${n}")" = "$sha" ] || continue     # moved: next sweep
            conclusion=failure
            if GH_TOKEN="$LIST_TOKEN" python3 -I .github/agent/bin/check-action-pins.py --verify-tags --git "$sha" \
               && git ls-tree -r -z --name-only "$sha" | ALLOWLIST_NUL=1 GITHUB_HEAD_REF="$headref" GITHUB_BASE_REF="$DEFAULT" GITHUB_HEAD_REPO="$headrepo" \
                    ALLOWLIST_HEAD_REV="$sha" bash bin/check-file-allowlist.sh \
               && PYTHONPATH="$RUNNER_TEMP/yaml-shim" PIN_WIRING_JUDGE_GIT="$sha" bash .github/agent/tests/pin-wiring-test.sh \
               && PYTHONPATH="$RUNNER_TEMP/yaml-shim" SCAN_GUARD_JUDGE_GIT="$sha" bash bin/scan-no-workflow-call-test.sh \
               && GH_TOKEN="$LIST_TOKEN" bash bin/audit-record-judge.sh "$sha" "$DEFAULT"; then
              conclusion=success   # every action reference a digest (row 78), main's allowlist guard, pin-wiring judge, scanner guard and the passed-audit record (REQ-REL-012)
            fi
            if [ "$last" = "failure" ] && [ "$conclusion" = "failure" ]; then echo "PR #${n} ${sha:0:7}: still failure"; continue; fi
            # a head that is the tip of a live merge queue branch is the queue publisher's (same check name and SHA);
            # a head can become one while it is judged, so the branches are read here, right before the post
            queue_tips="$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}" 'refs/heads/gh-readonly-queue/*')" \
              || { echo "PR #${n} ${sha:0:7}: the queue branches could not be listed, not posted"; fail=1; continue; }
            tips="$(cut -f1 <<<"$queue_tips")"
            if grep -qxF "$sha" <<<"$tips"; then
              echo "PR #${n} ${sha:0:7}: the head of a live merge queue branch, not posted"; continue
            fi
            GH_TOKEN="$APP_TOKEN" gh api "repos/${GITHUB_REPOSITORY}/check-runs" -f name=auditor-review-gate -f head_sha="$sha" \
              -f status=completed -f conclusion="$conclusion" -f details_url="$RUN_URL" \
              -f "output[title]=auditor review gate: ${conclusion}" \
              -f "output[summary]=Judged by the scheduled sweep (the PR's own run had no App credentials)." >/dev/null || fail=1
            echo "PR #${n} ${sha:0:7}: ${conclusion}"
          done < "$RUNNER_TEMP/prs.txt"
          exit "$fail"
