name: Agent review gate

# REQ-AUD-18 AC3 (owner decision, option C, Sep 27): every change under .github/agent/ clears the
# independent second review's stop rule before merge — as a CHECK. A PR touching .github/agent/
# must carry .github/agent/reviews/<tree>.json bound to its exact content (see the gate script).
#
# Why pull_request_target, and why it is safe here. On `pull_request` the workflow AND the gate
# script come from the PR itself, so a PR could switch its own gate off (review round 1, both
# vendors). pull_request_target runs this file and the gate from the BASE branch instead. The
# baseline (ops/docs/cicd-security-baseline.md) forbids pull_request_target WITH CHECKOUT OF PR
# CODE; this workflow never does that:
#   - actions/checkout checks out the base branch only, with no persisted credentials;
#   - the PR head is fetched as git OBJECTS (`git fetch refs/pull/N/head`) and only ever read
#     through `git ls-tree` / `git diff` / `git show` — never checked out, installed, or executed;
#   - no secrets; the token can only read contents and write check runs.
# The verdict is a CHECK RUN named `auditor-review-gate` created through the Checks API on the PR
# HEAD commit (a pull_request_target job's own check run attaches to the base commit). Created
# with this job's token it belongs to the GitHub Actions app (integration 15368) — what the
# `main-protection` ruleset and release admission (stage-admission.yml: app-pinned check runs,
# never legacy commit statuses) both require.

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  checks: write

concurrency:
  group: auditor-review-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  gate:
    name: auditor review gate (runner)
    runs-on: ubuntu-latest
    steps:
      - name: open the auditor-review-gate check run on the PR head
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          id="$(gh api "repos/${GITHUB_REPOSITORY}/check-runs" -f name=auditor-review-gate \
            -f head_sha="$HEAD_SHA" -f status=in_progress -f details_url="$RUN_URL" --jq .id)"
          echo "id=${id}" >> "$GITHUB_OUTPUT"

      # the BASE branch: the gate code that judges the PR is never the PR's own
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: fetch the PR head as data (never checked out, never executed)
        env:
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "+refs/pull/${PR}/head:refs/remotes/pr/head"
          got="$(git rev-parse refs/remotes/pr/head)"
          [ "$got" = "$HEAD_SHA" ] || { echo "::error::PR head moved (${got} != ${HEAD_SHA}); a newer run judges it" >&2; exit 1; }

      - name: run main's review gate over the PR head
        id: gate
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          base="$(git merge-base "$BASE_SHA" "$HEAD_SHA")"
          python3 .github/agent/bin/auditor-review-gate.py --base "$base" --head "$HEAD_SHA"

      - name: complete the check run with the verdict
        if: always() && steps.check.outputs.id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          CHECK_ID: ${{ steps.check.outputs.id }}
          OUTCOME: ${{ steps.gate.outcome }}
        run: |
          if [ "$OUTCOME" = "success" ]; then conclusion=success; summary="The review-loop record clears the stop rule, or the PR changes nothing under .github/agent/."
          else conclusion=failure; summary="No valid review-loop record for this .github/agent/ content — see the run log."; fi
          gh api -X PATCH "repos/${GITHUB_REPOSITORY}/check-runs/${CHECK_ID}" -f status=completed \
            -f conclusion="$conclusion" -f "output[title]=auditor review gate: ${conclusion}" \
            -f "output[summary]=${summary}" >/dev/null
