name: Agent review gate

# REQ-AUD-18 AC3 (owner decision, option C, Sep 27): every change under .github/agent/ clears the
# independent second review's stop rule before merge — as a CHECK. A PR touching .github/agent/
# must carry .github/agent/reviews/<tree>.json bound to its exact content (see the gate script).
#
# Register row 78: the same verdict also requires every action reference in the PR head to be a
# full commit digest (.github/agent/bin/check-action-pins.py, main's copy, reading the head as git
# objects). Here — not in a check of its own — because this check is the one a PR cannot skip,
# edit or impersonate (below), and the checker's own changes need the review record above.
#
# The same verdict also runs main's copies of the allowlist guard (bin/check-file-allowlist.sh, over the head's
# file list, with ALLOWLIST_HEAD_REV so the head is judged as a commit) and of the pin-wiring judge
# (.github/agent/tests/pin-wiring-test.sh, PIN_WIRING_JUDGE_GIT, over the head's ci.yml), so a PR cannot
# disable its own whole-tree guard by editing ci.yml. The guard's own files are review-gated like .github/agent/.
#
# Protected by construction (review loop, both vendors):
# - pull_request_target: GitHub always runs the DEFAULT branch's copy of this file, so a PR can
#   neither edit nor skip its own gate; the judge checks out the base branch only, so the gate
#   script is main's too. The baseline (ops/docs/cicd-security-baseline.md) forbids
#   pull_request_target WITH CHECKOUT OF PR CODE — never done here: PR heads are fetched as git
#   objects and read only through `git ls-tree` / `git diff` / `git show`; nothing is checked out,
#   installed or executed.
# - The verdict is the check run `auditor-review-gate`, created by the `fosterstack-automation`
#   App (register row 56: one generic App, no sprawl) with a token scoped to checks:write. Its
#   credentials are secrets of the `agent` environment, restricted to the default branch: a PR's
#   own `pull_request` workflow runs on refs/pull/N/merge and cannot reach them. The ruleset pins
#   the required check to that App, so a same-named check from any Actions job does not satisfy
#   it. The auditor's own use of the App is downscoped to contents + pull-requests (auditor.yml).
# - Judge and publish are separate jobs on PR events: the judge reads PR data and holds no
#   secret; the publisher holds the App token and never touches PR data.
# - Only PRs into the default branch are judged, against the checked-out default branch (never the
#   event's base), and `edited` (a retarget) re-runs the gate.
# - Dependabot-triggered runs get no environment secrets, so a Dependabot PR's publish finds no
#   App credentials. The scheduled SWEEP (not Dependabot-triggered) judges every open PR into the
#   default branch whose head has no auditor-review-gate check from the App yet, and publishes.
#   The sweep holds the App token while reading PR data — still as git objects only, never
#   executed; it runs only the default branch's gate script.

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, edited]
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: agent-review-gate-${{ github.event.pull_request.number || 'sweep' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request_target' }}

jobs:
  judge:
    name: agent review gate — judge
    if: github.event_name == 'pull_request_target' && github.event.pull_request.base.ref == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      verdict: ${{ steps.gate.outputs.verdict }}
    steps:
      # the DEFAULT branch: the gate code that judges the PR is never the PR's own
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: fetch the PR head as data (never checked out, never executed)
        env:
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "+refs/pull/${PR}/head:refs/remotes/pr/head"
          got="$(git rev-parse refs/remotes/pr/head)"
          [ "$got" = "$HEAD_SHA" ] || { echo "::error::PR head moved (${got} != ${HEAD_SHA}); a newer run judges it" >&2; exit 1; }

      - name: run the default branch's review gate and pin check over the PR head
        id: gate
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ github.token }}   # read-only: resolves each `# vX` tag to its commit
          # the PR's identity, as the ci allowlist job sees it, for main's copy of the allowlist guard
          GITHUB_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          GITHUB_BASE_REF: ${{ github.event.pull_request.base.ref }}
          GITHUB_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          set -uo pipefail
          # judged against the checked-out default branch (HEAD), never the event's base
          base="$(git merge-base HEAD "$HEAD_SHA")" || { echo "verdict=failure" >> "$GITHUB_OUTPUT"; exit 1; }
          verdict=success
          python3 .github/agent/bin/auditor-review-gate.py --base "$base" --head "$HEAD_SHA" || verdict=failure
          # row 78: every action reference in the head is a commit digest (git objects only)
          python3 .github/agent/bin/check-action-pins.py --verify-tags --git "$HEAD_SHA" || verdict=failure
          # the PR cannot run its own copy of its guard: main's allowlist script judges the head's file list
          # and main's pin-wiring judge reads the head's ci.yml, both as git objects (nothing of the PR runs)
          git ls-tree -r -z --name-only "$HEAD_SHA" | ALLOWLIST_NUL=1 ALLOWLIST_HEAD_REV="$HEAD_SHA" bash bin/check-file-allowlist.sh || verdict=failure
          mkdir -p "$RUNNER_TEMP/yaml-shim" && ln -sfn "$PWD/.github/agent/fixtures/testlib/pyyaml" "$RUNNER_TEMP/yaml-shim/yaml"
          PYTHONPATH="$RUNNER_TEMP/yaml-shim" PIN_WIRING_JUDGE_GIT="$HEAD_SHA" bash .github/agent/tests/pin-wiring-test.sh || verdict=failure
          echo "verdict=${verdict}" >> "$GITHUB_OUTPUT"
          [ "$verdict" = success ]

  publish:
    name: agent review gate — publish
    needs: judge
    # not on cancellation (a superseded run must not overwrite a newer verdict on the same head)
    if: ${{ !cancelled() && github.event_name == 'pull_request_target' && github.event.pull_request.base.ref == github.event.repository.default_branch }}
    runs-on: ubuntu-latest
    environment: agent
    permissions: {}
    steps:
      - name: are the App credentials available to this run?
        id: cfg
        env:
          APP_ID: ${{ secrets.AUDITOR_APP_ID }}
        run: |
          if [ -n "$APP_ID" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"
          else echo "::notice::no App credentials in this run (a Dependabot-triggered run gets none) — the scheduled sweep publishes this PR's check"; echo "ok=false" >> "$GITHUB_OUTPUT"; fi

      - name: mint the App token (checks:write only)
        id: app
        if: steps.cfg.outputs.ok == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.AUDITOR_APP_ID }}
          private-key: ${{ secrets.AUDITOR_APP_PRIVATE_KEY }}
          repositories: cache
          permission-checks: write

      - name: publish the auditor-review-gate check run on the PR head
        if: steps.cfg.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          VERDICT: ${{ needs.judge.outputs.verdict }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ "$VERDICT" = "success" ]; then conclusion=success; summary="The review-loop record clears the stop rule (or the PR changes nothing under .github/agent/), and every action reference is a commit digest."
          else conclusion=failure; summary="No valid review-loop record for this .github/agent/ content, or an action reference that is not a commit digest (or the judge did not finish) — see the run log."; fi
          gh api "repos/${GITHUB_REPOSITORY}/check-runs" -f name=auditor-review-gate -f head_sha="$HEAD_SHA" \
            -f status=completed -f conclusion="$conclusion" -f details_url="$RUN_URL" \
            -f "output[title]=auditor review gate: ${conclusion}" -f "output[summary]=${summary}" >/dev/null

  sweep:
    name: agent review gate — sweep
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: agent
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: mint the App token (checks:write only)
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.AUDITOR_APP_ID }}
          private-key: ${{ secrets.AUDITOR_APP_PRIVATE_KEY }}
          repositories: cache
          permission-checks: write

      - name: judge and publish every open PR into the default branch that has no verdict yet
        env:
          LIST_TOKEN: ${{ github.token }}
          APP_TOKEN: ${{ steps.app.outputs.token }}
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
          DEFAULT: ${{ github.event.repository.default_branch }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -uo pipefail
          GH_TOKEN="$LIST_TOKEN" gh pr list --base "$DEFAULT" --state open --limit 200 \
            --json number,headRefOid,headRefName,headRepository,headRepositoryOwner \
            --jq '.[] | "\(.number) \(.headRefOid) \(.headRefName) \((.headRepositoryOwner.login // "") + "/" + (.headRepository.name // ""))"' > "$RUNNER_TEMP/prs.txt"
          mkdir -p "$RUNNER_TEMP/yaml-shim" && ln -sfn "$PWD/.github/agent/fixtures/testlib/pyyaml" "$RUNNER_TEMP/yaml-shim/yaml"
          fail=0
          while read -r n sha headref headrepo; do
            case "$n$sha" in *[!0-9a-f]*) echo "::error::unexpected PR list line"; fail=1; continue ;; esac
            # the App's latest verdict on this head: none -> judge; success -> done; a failure from the
            # last 6 hours -> judge again (a transient failure, e.g. the tag API, must not strand the
            # head) and publish only if it has turned to success, so a head that still fails is not
            # re-posted every sweep; an older failure waits for a push or a re-run (API budget)
            last="$(GH_TOKEN="$APP_TOKEN" gh api "repos/${GITHUB_REPOSITORY}/commits/${sha}/check-runs?check_name=auditor-review-gate" \
              --jq "[.check_runs[] | select(.app.slug == \"${APP_SLUG}\")] | sort_by(.completed_at) | last
                    | if . == null then \"none\" elif .conclusion == \"success\" then \"success\"
                      elif (now - (.completed_at | fromdate)) < 21600 then \"failure\" else \"stale\" end")" \
              || { fail=1; continue; }
            case "$last" in success|stale) continue ;; esac
            git fetch --no-tags -q origin "+refs/pull/${n}/head:refs/remotes/pr/${n}" || { fail=1; continue; }
            [ "$(git rev-parse "refs/remotes/pr/${n}")" = "$sha" ] || continue     # moved: next sweep
            conclusion=failure
            if base="$(git merge-base HEAD "$sha")" && python3 .github/agent/bin/auditor-review-gate.py --base "$base" --head "$sha" \
               && GH_TOKEN="$LIST_TOKEN" python3 .github/agent/bin/check-action-pins.py --verify-tags --git "$sha" \
               && git ls-tree -r -z --name-only "$sha" | ALLOWLIST_NUL=1 GITHUB_HEAD_REF="$headref" GITHUB_BASE_REF="$DEFAULT" GITHUB_HEAD_REPO="$headrepo" \
                    ALLOWLIST_HEAD_REV="$sha" bash bin/check-file-allowlist.sh \
               && PYTHONPATH="$RUNNER_TEMP/yaml-shim" PIN_WIRING_JUDGE_GIT="$sha" bash .github/agent/tests/pin-wiring-test.sh; then
              conclusion=success   # the review record, every action reference a digest (row 78), main's allowlist guard and pin-wiring judge
            fi
            if [ "$last" = "failure" ] && [ "$conclusion" = "failure" ]; then echo "PR #${n} ${sha:0:7}: still failure"; continue; fi
            GH_TOKEN="$APP_TOKEN" gh api "repos/${GITHUB_REPOSITORY}/check-runs" -f name=auditor-review-gate -f head_sha="$sha" \
              -f status=completed -f conclusion="$conclusion" -f details_url="$RUN_URL" \
              -f "output[title]=auditor review gate: ${conclusion}" \
              -f "output[summary]=Judged by the scheduled sweep (the PR's own run had no App credentials)." >/dev/null || fail=1
            echo "PR #${n} ${sha:0:7}: ${conclusion}"
          done < "$RUNNER_TEMP/prs.txt"
          exit "$fail"
