name: Daily CVE auditor

# The sealed daily CVE auditor. It consumes the day's main-candidate-rescan artifacts
# (selected by TODAY'S main head, regardless of the rescan's conclusion — a red rescan is
# exactly the day that needs adjudication), installs the pinned scanners, scans the
# candidate image and the checked-out source ON THE RUNNER, builds a validated run
# manifest, audits the findings and (when not dry) opens the PRs and owner-decision issues.
#
# Two dispatch knobs (workflow_dispatch only): dry_run (default true) does everything except
# gh pr create / gh issue create; adjudicator (real|stub, default real) chooses the model
# client. adjudicator=stub uses the checked-in test double and SKIPS the OIDC mint, so the
# workflow can be dispatched green on a feature branch where the federation rule refuses a
# token. Schedule runs are always real and never dry.
#
# The federated identity is minted AFTER installs and scans, immediately before the driver,
# and refreshed in the background for long runs. The six model/workspace identifiers are
# GitHub environment SECRETS (masked in logs); no vars.* and no ANTHROPIC_API_KEY anywhere.
on:
  schedule:
    - cron: '23 8 * * *'   # after the 07:41 main-candidate rescan; offset from 0/11/41
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Do everything except open PRs and issues'
        type: boolean
        default: true
      adjudicator:
        description: 'Model client: real (federated SDK) or stub (checked-in test double)'
        type: choice
        options: [real, stub]
        default: real
      test_image:
        description: 'Audit this image ref@digest instead of the day''s candidate (proving runs)'
        type: string
        default: ''
      known_defect_log:
        description: 'Known-defect log path (proving runs may point at a fixture log)'
        type: string
        default: .github/agent/known-defect-log.json
      panel_probe:
        description: 'Probe the scanner panel''s two seats once instead of judging (proves keyless federation; publishes nothing; main only)'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  audit:
    name: audit
    # a seat-probe dispatch runs ONLY the panel-probe job below: no ordinary audit, delivery, App token or claim logging
    if: ${{ !inputs.panel_probe }}
    runs-on: ubuntu-latest
    # The `agent` environment (main-restricted, holds the model/App secrets) is attached ONLY when
    # secrets are actually needed — a real adjudicator or a scheduled run. A stub-adjudicator
    # dispatch attaches NO environment and needs NO secrets, so it can run on a req/ branch (e.g.
    # a pre-merge proving run). Empty string => no environment.
    environment: ${{ (github.event_name == 'schedule' || inputs.adjudicator == 'real') && 'agent' || '' }}
    permissions:
      id-token: write
      contents: read
      pull-requests: write
      issues: write
      actions: read        # to list/download the rescan run's artifacts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # no saved job token at all: from checkout v6 it lives in a separate credential file
          # that `git config --unset-all ...extraheader` no longer clears, so it would win over
          # the App token on push (#137). The repo is public; fetches need no credential.
          persist-credentials: false

      - name: Select and download the day's main-candidate-rescan artifacts
        id: rescan
        if: ${{ github.event_name == 'schedule' || inputs.test_image == '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo='${{ github.repository }}'
          main_head=$(gh api "repos/${repo}/commits/main" --jq '.sha')
          echo "main head: ${main_head}"
          runs=$(gh run list --workflow main-candidate-rescan.yml --branch main --limit 50 \
                   --json databaseId,headSha,conclusion,createdAt)
          # today's main head, regardless of conclusion (a red rescan is the day that needs us)
          rid=$(printf '%s' "$runs" | jq -r --arg h "$main_head" \
                  '[.[]|select(.headSha==$h)]|sort_by(.createdAt)|last|.databaseId // empty')
          if [ -z "$rid" ]; then
            rid=$(printf '%s' "$runs" | jq -r 'sort_by(.createdAt)|last|.databaseId // empty')
            echo "::warning::no main-candidate-rescan run for main head ${main_head}; using latest run ${rid} (digest binding unavailable)"
            echo "head_bound=false" >> "$GITHUB_OUTPUT"
          else
            echo "head_bound=true" >> "$GITHUB_OUTPUT"
          fi
          [ -n "$rid" ] || { echo "::error::no main-candidate-rescan run to consume" >&2; exit 1; }
          echo "selected rescan run: ${rid}"
          echo "run_id=${rid}" >> "$GITHUB_OUTPUT"
          # wait (bounded) for the selected run to finish, so its artifacts are complete; the scanner panel judges only
          # a COMPLETED run of main's head created within the last day (checked by the panel step below)
          for _ in $(seq 1 90); do
            st=$(gh run view "$rid" --json status --jq .status)
            [ "$st" = completed ] && break
            echo "rescan run ${rid} is ${st}; waiting"; sleep 60
          done
          meta=$(gh run view "$rid" --json status,createdAt,headSha)
          echo "rescan_status=$(printf '%s' "$meta" | jq -r .status)" >> "$GITHUB_OUTPUT"
          echo "rescan_created=$(printf '%s' "$meta" | jq -r .createdAt)" >> "$GITHUB_OUTPUT"
          mkdir -p "${RUNNER_TEMP}/rescan" "${RUNNER_TEMP}/rescan-reports"
          gh run download "$rid" -n oci-candidate -D "${RUNNER_TEMP}/rescan" \
            || gh run download "$rid" -D "${RUNNER_TEMP}/rescan"
          # the rescan's own scanner reports + recorded candidate digests, if that run
          # produced them (added this round; older runs pre-date the upload — not fatal)
          gh run download "$rid" -n rescan-scanner-reports -D "${RUNNER_TEMP}/rescan-reports" \
            || echo "::warning::selected run has no rescan-scanner-reports artifact; the auditor will scan on the runner and cannot assert the recorded digest"
          # the scanner panel's tally (scanner-panel rules 3-6): its unique findings are judged below (rules 7-9)
          gh run download "$rid" -n panel-evidence -D "${RUNNER_TEMP}/panel" \
            || echo "::warning::selected run has no panel-evidence artifact; the scanner panel's audits cannot run"

      - name: Set up Go for govulncheck and the source scan
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        continue-on-error: true
        with:
          go-version-file: go.mod
          cache: false

      - name: Install the pinned scanners and build the validated run manifest
        id: manifest
        env:
          GITHUB_SHA: ${{ github.sha }}
          TEST_IMAGE: ${{ inputs.test_image }}
          KNOWN_DEFECT_LOG: ${{ inputs.known_defect_log }}
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          set -uo pipefail
          command -v skopeo >/dev/null 2>&1 || sudo apt-get update -qq && sudo apt-get install -y -qq skopeo || true
          for s in grype trivy osv-scanner snyk; do ./bin/install-scanner.sh "$s" || echo "::warning::${s} install failed; it will be recorded 'did not run'"; done
          # govulncheck pinned by module version; syft a pinned, checksummed release binary (below). Both
          # best-effort: syft is grype's cataloguer and reads distroless status.d, so grype's package inventory is
          # real even on distroless; without it grype falls back and the OS quorum decides
          GOBIN="${RUNNER_TEMP}/gobin" go install golang.org/x/vuln/cmd/govulncheck@v1.1.4 \
            || echo "::warning::could not install govulncheck; reachability will be recorded 'did not run'"
          # syft: a pinned, checksum-verified release binary (no run-time module download: Sep 30's run failed on
          # transient sum.golang.org errors while building it from source)
          mkdir -p "${RUNNER_TEMP}/gobin"
          ./bin/install-scanner.sh syft "${RUNNER_TEMP}/gobin" \
            || echo "::warning::could not install syft; grype inventory falls back to matched packages"
          export PATH="${RUNNER_TEMP}/gobin:${PATH}"
          # Scan a CONTAINER ARCHIVE, never a daemon ref (R12 item 2). one line per scanner
          # is printed here (grype 0.118.0 db=… packages=… findings=…); a scanner that
          # inventories zero packages is recorded 'did not run'.
          python3 .github/agent/bin/auditor-manifest.py \
            --rescan-dir "${RUNNER_TEMP}/rescan" \
            --rescan-reports "${RUNNER_TEMP}/rescan-reports" \
            --source-dir "${GITHUB_WORKSPACE}" \
            --reports "${RUNNER_TEMP}/reports" \
            --test-image "${TEST_IMAGE}" \
            --known-defect-log "${KNOWN_DEFECT_LOG:-.github/agent/known-defect-log.json}" \
            --out "${RUNNER_TEMP}/manifest.json"

      - name: Mint the federated OIDC identity token (real adjudicator only, after scans)
        id: oidc
        if: ${{ github.event_name == 'schedule' || inputs.adjudicator == 'real' }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const token = await core.getIDToken('https://api.anthropic.com')
            core.setSecret(token)
            const fs = require('fs')
            const p = `${process.env.RUNNER_TEMP}/anthropic-identity-token`
            fs.writeFileSync(p, token)
            core.exportVariable('ANTHROPIC_IDENTITY_TOKEN_FILE', p)
            // Print ONLY the identity claims the Anthropic federation rule matches on, so a
            // token-exchange 401 can be diagnosed against the real token shape. NEVER the token
            // itself (it stays setSecret-masked). The payload is the middle JWT segment.
            try {
              const payload = JSON.parse(Buffer.from(token.split('.')[1], 'base64url').toString('utf8'))
              const claims = {}
              for (const k of ['sub','aud','ref','job_workflow_ref','environment','repository','repository_owner_id']) {
                claims[k] = payload[k]
              }
              core.info('OIDC identity claims (federation-rule inputs): ' + JSON.stringify(claims))
            } catch (e) {
              core.warning('could not decode OIDC claims for logging: ' + e)
            }

      - name: Refresh the identity token in the background (runs longer than four minutes)
        if: ${{ github.event_name == 'schedule' || inputs.adjudicator == 'real' }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs')
            const p = `${process.env.RUNNER_TEMP}/anthropic-identity-token`
            const refresh = async () => {
              try {
                const t = await core.getIDToken('https://api.anthropic.com')
                core.setSecret(t); fs.writeFileSync(p, t)
              } catch (e) { core.warning(`identity refresh failed: ${e}`) }
            }
            // re-mint every 4 minutes; the step returns immediately, the timer lives with the job
            setInterval(refresh, 4 * 60 * 1000).unref?.()

      # Mint a GitHub App installation token (fosterstack-auditor, cache only, Contents +
      # Pull requests write) ONLY for delivery runs. The job's own GITHUB_TOKEN stays
      # contents:read; this token goes to the driver step alone, as its GH_TOKEN and git push
      # credential, so the auditor's draft PR is opened by the App identity and bound by the
      # rulesets on main (the App is on no bypass list). No PAT, ever.
      - name: Mint the delivery App token (non-dry runs only)
        id: app-token
        # Non-dry only. On a scheduled run "non-dry" requires the repo variable
        # AUDITOR_SCHEDULE_MODE to be exactly "live"; unset or anything else keeps the schedule
        # dry (the rollout's dry week). On dispatch it follows the dry_run input as before.
        if: ${{ (github.event_name == 'schedule' && vars.AUDITOR_SCHEDULE_MODE == 'live') || (github.event_name != 'schedule' && inputs.dry_run == false) }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.AUDITOR_APP_ID }}
          private-key: ${{ secrets.AUDITOR_APP_PRIVATE_KEY }}
          repositories: cache
          # exactly what delivery uses — never `checks`: the same App publishes the review gate's
          # verdict (agent-review-gate.yml), and the auditor must not be able to mint one
          permission-contents: write
          permission-pull-requests: write

      - name: Install the pinned adjudicator SDK (real adjudicator only, before the driver)
        # The real adjudicator client imports the anthropic SDK; it was never installed, so every
        # model call failed with ModuleNotFoundError (surfaced by the driver as "adjudicator
        # unavailable"). Install it hash-pinned (the same pinned-checksum contract as the
        # scanners) into the SAME python3 the driver runs, and ASSERT the workload-identity
        # federation surface is importable — or fail the run with exactly that message.
        if: ${{ github.event_name == 'schedule' || inputs.adjudicator == 'real' }}
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --require-hashes --break-system-packages \
            -r .github/agent/adjudicator-requirements.txt
          python3 - <<'PY'
          from anthropic.lib.credentials import WorkloadIdentityCredentials, IdentityTokenFile  # noqa: F401
          from openai.auth import WorkloadIdentity  # noqa: F401  (the scanner panel's second seat)
          print("adjudicator SDKs ready: both workload-identity federation surfaces importable")
          PY

      - name: Run the auditor
        env:
          ANTHROPIC_FEDERATION_RULE_ID: ${{ secrets.ANTHROPIC_FEDERATION_RULE_ID }}
          ANTHROPIC_ORGANIZATION_ID: ${{ secrets.ANTHROPIC_ORGANIZATION_ID }}
          ANTHROPIC_SERVICE_ACCOUNT_ID: ${{ secrets.ANTHROPIC_SERVICE_ACCOUNT_ID }}
          ANTHROPIC_WORKSPACE_ID: ${{ secrets.ANTHROPIC_WORKSPACE_ID }}
          AUDITOR_MODEL_PRIMARY: ${{ secrets.AUDITOR_MODEL_PRIMARY }}
          AUDITOR_MODEL_FALLBACK: ${{ secrets.AUDITOR_MODEL_FALLBACK }}
          AUDITOR_KEV_CATALOG: ${{ runner.temp }}/kev.json
          # the App installation token (delivery) for THIS step only — git push + gh pr create;
          # falls back to the read-only job token on a dry run where no delivery happens.
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
          # the App has Contents + Pull requests only (no Issues), so owner-decision issues
          # MUST use the job token's issues:write, passed separately.
          AUDITOR_ISSUES_TOKEN: ${{ github.token }}
          AUDITOR_APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          AUDITOR_ALLOW_REAL_GH: '1'   # this workflow is the ONLY context allowed to run real git/gh
          # REQ-AUD-17 AC3: the owner's repo variable flips auditor PRs from draft to auto-merge
          # (squash). Unset/anything-but-on keeps drafts (the dry week + the first live week). The
          # merge still waits on all required checks + the main rulesets — the App has no bypass.
          AUDITOR_AUTOMERGE: ${{ vars.AUDITOR_AUTOMERGE }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -uo pipefail
          curl -fsS https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json \
            -o "${AUDITOR_KEV_CATALOG}" || echo "::warning::could not fetch the CISA KEV catalog"
          adj='${{ github.event_name == 'schedule' && 'real' || inputs.adjudicator }}'
          # The schedule is DRY unless the repo variable AUDITOR_SCHEDULE_MODE is exactly "live"
          # (unset or anything else => dry). Dispatch follows the dry_run input. The schedule
          # always uses the REAL adjudicator (a dry week still exercises the real model).
          dry='${{ github.event_name == 'schedule' && (vars.AUDITOR_SCHEDULE_MODE == 'live' && 'false' || 'true') || inputs.dry_run }}'
          adj_arg=""
          [ "$adj" = "stub" ] && adj_arg="--adjudicator .github/agent/fixtures/adjudicator/stub-adjudicator.py"
          # when an App token is present (delivery run), authenticate git/gh with it and set
          # the commit identity to the App bot (no vendor/model name anywhere). The checkout
          # persists no job token (persist-credentials: false), so the App token (GH_TOKEN) is
          # the only push credential, via gh's git credential helper.
          if [ -n "${AUDITOR_APP_SLUG:-}" ]; then
            gh auth setup-git
            git config user.name "${AUDITOR_APP_SLUG}[bot]"
            git config user.email "${AUDITOR_APP_SLUG}[bot]@users.noreply.github.com"
          fi
          set -e
          python3 .github/agent/bin/auditor-run.py \
            --manifest "${RUNNER_TEMP}/manifest.json" \
            --kev "${AUDITOR_KEV_CATALOG}" \
            --dry-run "${dry}" --today "$(date -u +%F)" \
            --out "${RUNNER_TEMP}/auditor-out" ${adj_arg}
          cp "${RUNNER_TEMP}/manifest.json" "${RUNNER_TEMP}/auditor-out/manifest.json" || true
          cp -r "${RUNNER_TEMP}/reports" "${RUNNER_TEMP}/auditor-out/scanner-reports" 2>/dev/null || true
          cp "${AUDITOR_KEV_CATALOG}" "${RUNNER_TEMP}/auditor-out/kev.json" 2>/dev/null || true

      # The scanner panel's audits (scanner-panel rules 7-9, 8(c), 13, 14; owner Oct 3: "the audits run in the
      # auditor's daily run, right after the rescan, in one of its steps"). The rescan tallied the scanners and listed
      # the findings only one scanner reported; this judges them with two auditor seats, each reached through keyless
      # federation: seat A is the provider above, seat B the second vendor's workload identity. The step mints each
      # seat's GitHub identity token itself, fresh for every exchange (the job's id-token: write), so a long debate
      # never outlives its tokens. Identifiers and model names come only from the environment's secrets
      # (REQ-AUD-6 AC1); nothing public names a vendor. The panel's own per-run token budget is written below.
      - name: Judge the rescan's unique findings (scanner panel rules 7-9, 8(c), 13, 14)
        id: panel
        if: ${{ always() && steps.rescan.outcome == 'success' }}
        env:
          ANTHROPIC_FEDERATION_RULE_ID: ${{ secrets.ANTHROPIC_FEDERATION_RULE_ID }}
          ANTHROPIC_ORGANIZATION_ID: ${{ secrets.ANTHROPIC_ORGANIZATION_ID }}
          ANTHROPIC_SERVICE_ACCOUNT_ID: ${{ secrets.ANTHROPIC_SERVICE_ACCOUNT_ID }}
          ANTHROPIC_WORKSPACE_ID: ${{ secrets.ANTHROPIC_WORKSPACE_ID }}
          ANTHROPIC_IDENTITY_TOKEN_FILE: ${{ runner.temp }}/panel-a-token
          PANEL_AUDIT_A_MODEL: ${{ secrets.AUDITOR_MODEL_PRIMARY }}
          PANEL_AUDIT_B_IDENTITY_PROVIDER_ID: ${{ secrets.PANEL_AUDIT_B_IDENTITY_PROVIDER_ID }}
          PANEL_AUDIT_B_SERVICE_ACCOUNT_ID: ${{ secrets.PANEL_AUDIT_B_SERVICE_ACCOUNT_ID }}
          PANEL_AUDIT_B_PROJECT_ID: ${{ secrets.PANEL_AUDIT_B_PROJECT_ID }}
          PANEL_AUDIT_B_MODEL: ${{ secrets.PANEL_AUDIT_B_MODEL }}
          GH_TOKEN: ${{ github.token }}
          RESCAN_HEAD_BOUND: ${{ steps.rescan.outputs.head_bound }}
          RESCAN_STATUS: ${{ steps.rescan.outputs.rescan_status }}
          RESCAN_CREATED: ${{ steps.rescan.outputs.rescan_created }}
        run: |
          set -euo pipefail
          # the panel judges only today's completed rescan of main's head: never a stale, unfinished or other-head run
          # (an unusable run fails this step visibly; the next daily run judges again)
          [ "${RESCAN_HEAD_BOUND}" = true ] || { echo "::error::scanner panel: no rescan run of main's head to judge" >&2; exit 1; }
          [ "${RESCAN_STATUS}" = completed ] || { echo "::error::scanner panel: the rescan run did not finish in time" >&2; exit 1; }
          age=$(( $(date -u +%s) - $(date -u -d "${RESCAN_CREATED}" +%s) ))
          [ "$age" -le 93600 ] || { echo "::error::scanner panel: the rescan run is ${age}s old (more than a day)" >&2; exit 1; }
          [ -f "${RUNNER_TEMP}/panel/verdict.json" ] || { echo "::error::scanner panel: the rescan run has no panel-evidence" >&2; exit 1; }
          seats='${{ (github.event_name == 'schedule' || inputs.adjudicator == 'real') && 'real' || 'none' }}'
          # yesterday's judgments, debates and scores: the OPEN panel PR's branch (pending, not yet merged) if there is
          # one, else main's file; a closed or rejected branch never steers the run
          state="${RUNNER_TEMP}/panel-state.json"
          open_pr=$(gh pr list --head auditor/panel --state open --json number --jq '.[0].number // empty')
          if [ -n "$open_pr" ] && git fetch --quiet origin auditor/panel && git show FETCH_HEAD:.auditor/panel-state.json > "$state" 2>/dev/null; then
            echo "state from the open panel PR #${open_pr}"
          elif [ -f .auditor/panel-state.json ]; then cp .auditor/panel-state.json "$state"; echo "state from main"
          else rm -f "$state"; echo "no earlier state: the first day"
          fi
          python3 .github/agent/bin/auditor-panel.py judge --verdict "${RUNNER_TEMP}/panel/verdict.json" \
            --state "$state" --profiles .github/policy/scanner-profiles.json --oci "${RUNNER_TEMP}/rescan" \
            --out "${RUNNER_TEMP}/panel-out" --seats "$seats" --today "$(date -u +%F)" --token-budget 200000

      - name: Deliver the panel audits — a pull request from the auditor lane, the tracking issue, the owner report
        if: ${{ always() && steps.panel.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
          AUDITOR_ISSUES_TOKEN: ${{ github.token }}
          AUDITOR_ALLOW_REAL_GH: '1'
          AUDITOR_AUTOMERGE: ${{ vars.AUDITOR_AUTOMERGE }}   # REQ-AUD-17 AC3: the owner's switch, as for the CVE auditor's PRs
        run: |
          set -euo pipefail
          dry='${{ github.event_name == 'schedule' && (vars.AUDITOR_SCHEDULE_MODE == 'live' && 'false' || 'true') || inputs.dry_run }}'
          dry_arg=""
          [ "$dry" = "false" ] || dry_arg="--dry-run"
          python3 .github/agent/bin/auditor-panel.py deliver --out "${RUNNER_TEMP}/panel-out" --repo . \
            --today "$(date -u +%F)" ${dry_arg}

      - name: Publish the report to the run summary
        if: ${{ always() }}
        run: |
          if [ -f "${RUNNER_TEMP}/auditor-out/report.md" ]; then
            cat "${RUNNER_TEMP}/auditor-out/report.md" >> "${GITHUB_STEP_SUMMARY}"
          else
            echo "The auditor produced no report (see the failed step above)." >> "${GITHUB_STEP_SUMMARY}"
          fi
          cat "${RUNNER_TEMP}/panel-out/summary.md" >> "${GITHUB_STEP_SUMMARY}" 2>/dev/null || true

      - name: Upload the full audit trail
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: auditor-run
          include-hidden-files: true
          path: |
            ${{ runner.temp }}/auditor-out
            ${{ runner.temp }}/panel-out
            ${{ runner.temp }}/manifest.json
            ${{ runner.temp }}/reports

  # The scanner panel's seat probe (REQ-SCAN-008-AC3, live proof; advisor 0051): on request, from main only, in its own
  # job so nothing else of the auditor runs. It installs the pinned SDKs and sends each seat ONE fixed audit over a
  # committed synthetic bundle, with retries disabled (at most two model requests). It publishes nothing; the summary
  # names only the seats, scrubbed; a failing seat fails the job with its masked error.
  panel-probe:
    name: scanner panel seat probe (on request, main only)
    if: ${{ inputs.panel_probe && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    environment: agent
    permissions:
      contents: read
      id-token: write   # each seat's identity token is minted in the probe process
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned SDKs (both seats)
        run: python3 -m pip install --quiet --require-hashes --break-system-packages -r .github/agent/adjudicator-requirements.txt

      - name: Probe the scanner panel's two seats
        env:
          ANTHROPIC_FEDERATION_RULE_ID: ${{ secrets.ANTHROPIC_FEDERATION_RULE_ID }}
          ANTHROPIC_ORGANIZATION_ID: ${{ secrets.ANTHROPIC_ORGANIZATION_ID }}
          ANTHROPIC_SERVICE_ACCOUNT_ID: ${{ secrets.ANTHROPIC_SERVICE_ACCOUNT_ID }}
          ANTHROPIC_WORKSPACE_ID: ${{ secrets.ANTHROPIC_WORKSPACE_ID }}
          ANTHROPIC_IDENTITY_TOKEN_FILE: ${{ runner.temp }}/panel-a-token
          PANEL_AUDIT_A_MODEL: ${{ secrets.AUDITOR_MODEL_PRIMARY }}
          PANEL_AUDIT_B_IDENTITY_PROVIDER_ID: ${{ secrets.PANEL_AUDIT_B_IDENTITY_PROVIDER_ID }}
          PANEL_AUDIT_B_SERVICE_ACCOUNT_ID: ${{ secrets.PANEL_AUDIT_B_SERVICE_ACCOUNT_ID }}
          PANEL_AUDIT_B_PROJECT_ID: ${{ secrets.PANEL_AUDIT_B_PROJECT_ID }}
          PANEL_AUDIT_B_MODEL: ${{ secrets.PANEL_AUDIT_B_MODEL }}
        run: |
          set -euo pipefail
          rc=0
          python3 .github/agent/bin/auditor-panel.py probe --seats real --out "${RUNNER_TEMP}/probe" --token-budget 20000 || rc=$?
          cat "${RUNNER_TEMP}/probe/summary.md" >> "${GITHUB_STEP_SUMMARY}" 2>/dev/null || true
          exit "$rc"
