      - name: the k8s acceptance harness's fenced exclusion — its two generated scripts come only from docs/kubernetes.md (advisor 0084)
        run: python3 -I bin/suite-guard-run.py run test-evidence/suite-floors.json k8s-harness-fence-test.sh .github/agent/tests/k8s-harness-fence-test.sh
      - name: the pin age check — 7 days by a server-side time, named per moved version (REQ-SUP-001 AC2, AC3)
        run: python3 -I bin/suite-guard-run.py run test-evidence/suite-floors.json pin-age-check-test.sh .github/agent/tests/pin-age-check-test.sh
      - name: the daily supply-chain audit — advisories, upstream, disputed hits with checked-in exceptions, held-PR re-runs (REQ-SUP-001 AC5-AC10)
        run: python3 -I bin/suite-guard-run.py run test-evidence/suite-floors.json pin-audit-test.sh .github/agent/tests/pin-audit-test.sh
      - name: where the supply-chain checks run — Dependabot cooldown, the PR job's read-only token, one writer per job (REQ-SUP-001 AC1, AC4, AC6)
        run: python3 -I bin/suite-guard-run.py run test-evidence/suite-floors.json supply-chain-wiring-test.sh .github/agent/tests/supply-chain-wiring-test.sh

  # Register row 75 (the #133 lesson: three ruleset edits, each silently stalled
  # Dependabot). The ruleset on main and .github/policy/required-checks.json must
  # match exactly — contexts and integration IDs — on EVERY PR and every push to
  # main, so drift is red the day it happens, not when a bot PR quietly stalls.
  required-check-guard:
    name: required-check guard
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: guard regressions (offline fixtures)
        run: bash bin/required-check-guard-test.sh

      # The verdict uses THIS tree's list, so a PR that fixes a stale list goes green on
      # its own run; on push to main the tree is main.
      - name: the ruleset on main vs this tree's required-checks.json
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash bin/required-check-guard.sh .github/policy/required-checks.json

  # Row 76: on a push to main, drift between main's list and the ruleset opens (or updates) the `required-check drift`
  # issue and dispatches the fixer in the ops repository. Only on push to main: the issue write and the App secrets (the
  # main-only `agent` environment) are held by a job that runs main's own code, never by a job that runs a pull
  # request's or a queue group's scripts. A drift first seen on a PR run stays a red check there and is picked up by the
  # next push to main. Best effort: no token or a failed call is a warning; the issue is the record.
  drift-fixer-dispatch:
    name: dispatch the fixer for required-check drift
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    environment: agent
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # One open issue, updated in place, never duplicated.
      - name: open or update the `required-check drift` issue when main's list has drifted
        id: drift-issue
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set +e -uo pipefail   # the runner starts bash with -e; the guard's refusal is data here
          gh api "repos/${GITHUB_REPOSITORY}/contents/.github/policy/required-checks.json?ref=main" \
            --jq '.content' | base64 -d > "${RUNNER_TEMP}/main-required-checks.json" || exit 0
          out=$(bash bin/required-check-guard.sh "${RUNNER_TEMP}/main-required-checks.json" 2>&1) && rc=0 || rc=$?
          # Drift (1), or a ruleset that enforces nothing at all (a refusal, not a read error).
          if [ "$rc" -ne 1 ] && ! grep -q "NO required status checks" <<<"$out"; then
            echo "main's list vs the ruleset: rc ${rc} — no drift issue to open"; exit 0
          fi
          title="required-check drift"
          # shellcheck disable=SC2016  # literal Markdown backticks, not expansions
          {
            echo 'The ruleset on `main` and `.github/policy/required-checks.json` on `main` differ (contexts and integration IDs must both match, exactly). Until they agree the Dependabot auto-merge guard refuses every patch/minor PR and every PR ci run is red.'
            echo
            echo 'Fix whichever is wrong: the ruleset (owner, GitHub UI) or the list (a PR).'
            echo
            echo "Seen by ${RUN_URL}"
            echo
            echo '```'
            printf '%s\n' "${out}"
            echo '```'
          } > "${RUNNER_TEMP}/drift-body.md"
          n=$(gh issue list --state open --search "\"${title}\" in:title" --json number,title \
                | jq -r --arg t "$title" '[.[] | select(.title == $t)][0].number // empty')
          if [ -n "$n" ]; then gh issue edit "$n" --body-file "${RUNNER_TEMP}/drift-body.md" >/dev/null && echo "updated #${n}"
          else url=$(gh issue create --title "$title" --body-file "${RUNNER_TEMP}/drift-body.md") && n="${url##*/}" && echo "$url"; fi
          if [ -n "$n" ]; then echo "issue=$n" >> "$GITHUB_OUTPUT"; fi

      - name: mint the App token for dispatching the fixer (ops, contents:write only)
        if: ${{ steps.drift-issue.outputs.issue != '' }}
        id: app-ops
        continue-on-error: true
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.AUDITOR_APP_ID }}
          private-key: ${{ secrets.AUDITOR_APP_PRIVATE_KEY }}
          repositories: ops
          permission-contents: write
      - name: dispatch
        if: ${{ steps.drift-issue.outputs.issue != '' }}
        env:
          DISPATCH_TOKEN: ${{ steps.app-ops.outputs.token }}
          ISSUE: ${{ steps.drift-issue.outputs.issue }}
        run: bash bin/dispatch-fixer.sh fix-required-check-drift "$ISSUE" || true

  # REQ-CHAIN-001-AC6, "whose CI verifies" (slice 4b-6; orchestrator ruling Oct 13). On a pull request that commits .github/policy/rc-proof.json this job requires the change to
  # be exactly the marker and the removal of the one KR-CUTOVER entry of test-evidence/known-red.json, and verifies the run the marker names with the verifier of the BASE
  # checkout (bin/marker-pr-gate.py runs `chain-verify.py rc-proof` on the run's artifacts). Any other pull request passes it without a read. Three read permissions, no
  # secret; a fork's token is read-only and enough. LIMIT: a pull request that also rewrites THIS job is stopped by the workflow-change rule (both reviews and the owner's
  # merge), not by the job; bin/marker-gate-test.sh pins the job's text so an edit fails the suite on the same pull request.
  marker-gate:
    name: marker-gate
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      actions: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: head
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
          persist-credentials: false
      - name: the marker pull request's files, and the run its marker names
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files" --jq '.[] | .filename | @json' > changed.txt
          python3 -I -B base/bin/marker-pr-gate.py --base-dir base --head-dir head --files changed.txt --repository "$GITHUB_REPOSITORY"

  requirements:
    name: requirements
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # full history: verify-freeze reads the requirements file AS OF each baseline's fixed
          # commit (row 80), e.g. 326c459 for v0.2.1
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27'
          check-latest: true
      # The validator's own regression suite runs FIRST. `run . check`
      # exercises the validator against the real baseline only; the tests
      # cover the inputs the baseline doesn't contain (omitted status,
      # malformed dates, second documents, deprecations), and the nested
      # module is excluded from the product CI's `go test ./...`, so
      # without this step they execute nowhere in CI (round-2 review,
      # finding 2 — proven by a deliberate failure in a disposable copy).
      - name: validator regression tests
        run: go -C tools/requirements test -race -shuffle=on ./...
      - name: validate requirements and matrix freshness
        run: go -C tools/requirements run . check
      # R07 + row 80: the frozen release baseline must stay consistent with
      # the requirements file AS OF ITS FIXED COMMIT (exact hash + complete
      # blocking set) - never main's current file, so editing requirements on
      # main never turns it red, while a hand-edited freeze is still caught
      # here, in PR CI. Approval is checked only at release admission.
      - name: frozen baseline consistency (approval-agnostic)
        run: go -C tools/requirements run . verify-freeze v0.2.1
      # Repeatable regressions for the daily image rescan's merge,
      # classification and platform-enumeration logic (audit B04d/B04e/B04f):
      # the extracted bin/rescan-statement.py is exercised against real
      # CLI-shaped fixtures (Snyk OS/application/mixed, Trivy/Grype
      # clean/finding/error/malformed, finding+operational-exit, and the
      # multi-arch/null-platform/empty-arch/unknown/single-image enumeration
      # cases), so a scanner-evidence regression is caught in PR CI. Pure
      # python3 + jq — no network, gh or scanners.
      - name: daily-rescan merge/classification/enumeration regressions
        run: python3 -I bin/suite-guard-run.py run test-evidence/suite-floors.json rescan-statement-test.sh bin/rescan-statement-test.sh

  dependency-review:
    # required on pull requests and in the merge queue; never on a push (nothing to compare)
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: the merge queue's base and head are named (REQ-DEP-005-AC2)
        if: github.event_name == 'merge_group'
        env:
          QUEUE_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          QUEUE_HEAD: ${{ github.event.merge_group.head_sha }}
        run: |
          [ -n "$QUEUE_BASE_SHA" ] && [ -n "$QUEUE_HEAD" ] || {
            echo "::error::the merge queue named no base or head commit:" \
              "nothing to compare, so this check fails"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          # a pull request leaves both empty (the action reads the PR); the queue's two commits are read in its place
          base-ref: ${{ github.event.merge_group.base_sha }}
          head-ref: ${{ github.event.merge_group.head_sha }}

  # Scanner-panel rule 12 (REQ-SCAN-012-AC4): on main, a change to the guide, the VEX file or its generator runs the live test against the newest published
  # release that carries the rule-10 files (never on a pull request or a schedule); until a v0.3 release exists the test announces a skip.
  live-test-gate:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: diff
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            echo "changed=true" >> "$GITHUB_OUTPUT"   # no usable base: run rather than miss a change
            exit 0
          fi
          git diff --name-only "$BEFORE" "$GITHUB_SHA" > "$RUNNER_TEMP/changed.txt"   # complete before it is read
          if grep -qE '^(docs/using-our-vex\.md|docs/using-our-vex\.cannot-run\.json|docs/using-our-vex\.live-blocks\.json|docs/using-our-vex\.live-fixture\.json|\.vex/.+|bin/vex-forms\.py|bin/vex-live-(run\.sh|test\.py))$' "$RUNNER_TEMP/changed.txt"; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  live-test:
    needs: live-test-gate
    if: github.event_name == 'push' && needs.live-test-gate.outputs.changed == 'true'
    runs-on: ubuntu-latest
    concurrency:   # one live test at a time across both workflows: the sweep owns the whole test estate
      group: vex-live-test
      cancel-in-progress: false
    environment: live-test   # holds the five LIVE_TEST_* identifiers (advisor 0078); its tag policy must admit rc and final v tags
    permissions:
      contents: read
      id-token: write
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: install crane, Grype and cosign (pinned by checksum)
        run: |
          set -euo pipefail
          bash bin/install-scanner.sh crane
          bash bin/install-scanner.sh cosign
          mkdir -p "$RUNNER_TEMP/tools"
          bash bin/install-scanner.sh grype "$RUNNER_TEMP/tools"
          echo "$RUNNER_TEMP/tools" >> "$GITHUB_PATH"
      - name: install docker-scout (pinned by checksum)
        run: |
          set -euo pipefail
          bash bin/install-scanner.sh docker-scout "$RUNNER_TEMP"
          mkdir -p "$HOME/.docker/cli-plugins" && install -m 0755 "$RUNNER_TEMP/docker-scout" "$HOME/.docker/cli-plugins/docker-scout"
      - name: AWS, as the live-test role (federated; the test ECR repository and live-test Inspector filters only)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.LIVE_TEST_AWS_ROLE_ARN }}
          aws-region: us-east-1
      - name: Google, as the live-test service account (federated; the test Artifact Registry repository and VEX notes)
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.LIVE_TEST_GCP_PROVIDER }}
          service_account: ${{ vars.LIVE_TEST_GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        with:
          version: '587.0.0'
      - name: the live test, every guide command as written, the fixture's finding shown before and gone after
        env:
          MODE: main
          ECR: ${{ vars.LIVE_TEST_ECR_REPOSITORY }}
          GAR: ${{ vars.LIVE_TEST_GAR_REPOSITORY }}
          GH_TOKEN: ${{ github.token }}
          DH_REPO: ${{ vars.LIVE_TEST_DOCKERHUB_REPOSITORY }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TEST_USERNAME: ${{ secrets.DOCKERHUB_TEST_USERNAME }}
          DOCKERHUB_TEST_PUSH_TOKEN: ${{ secrets.DOCKERHUB_TEST_PUSH_TOKEN }}
          DOCKERHUB_SCOUT_TOKEN: ${{ secrets.DOCKERHUB_SCOUT_TOKEN }}
        run: bash bin/vex-live-run.sh run
      - name: cleanup, delete every image, live-test filter and VEX note the run created
        if: always()
        env:
          ECR: ${{ vars.LIVE_TEST_ECR_REPOSITORY }}
          GAR: ${{ vars.LIVE_TEST_GAR_REPOSITORY }}
          DH_REPO: ${{ vars.LIVE_TEST_DOCKERHUB_REPOSITORY }}
          DOCKERHUB_TEST_USERNAME: ${{ secrets.DOCKERHUB_TEST_USERNAME }}
          DOCKERHUB_TEST_PUSH_TOKEN: ${{ secrets.DOCKERHUB_TEST_PUSH_TOKEN }}
        run: bash bin/vex-live-run.sh cleanup
