name: CI

# Runs on every push and pull request (baseline PULL-PUSH-REQ-1). Fork PRs
# get GitHub's default no-secrets treatment; this workflow never uses
# pull_request_target, so a fork PR's code never runs with repo secrets.
on:
  push:
    branches: [main]
  pull_request:

# A pull request's FIRST run attempt of this workflow shares a group with the pull request's other first attempts, so a newer push cancels its older run. Every other run (whatever
# its event, and any re-run of any head) gets a group of its own per run and attempt: it is never cancelled, never replaced as a pending run, and a re-run of an old head cancels
# nothing. The prefix is a literal, not github.workflow, so no workflow name can collide with another's group.
concurrency:
  group: ${{ github.event_name == 'pull_request' && github.run_attempt == '1' && format('ci-pr-{0}', github.event.pull_request.number) || format('ci-{0}-{1}', github.run_id, github.run_attempt) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # One required context for the Go tests. The race run writes the coverage profile, so the tests run once; each coverage gate runs once; the
  # FIPS run is the second, separate test run (it needs its own environment). The vendored tree is what `go mod vendor` regenerates (REQ-VEND-001-AC3) on every pull request,
  # Dependabot's included: it only compares, with no token and no commit. The whole history is fetched so origin/main is readable:
  # bin/vendor-check.sh passes a tree without vendor/ only when origin/main has none either.
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27'
          check-latest: true
      - name: go mod verify
        run: go mod verify
      - name: vendor/ is what go mod vendor regenerates
        run: bash bin/vendor-check.sh
      - name: dependency-provenance.json lists the modules of vendor/ with the hashes of go.sum (REQ-VEND-001-AC4)
        run: python3 bin/vendor-provenance.py check --vendor-dir vendor --go-sum go.sum --provenance dependency-provenance.json
      - name: go vet
        run: go vet ./...
      - name: static build (CGO_ENABLED=0)
        run: CGO_ENABLED=0 go build -o /dev/null ./cmd/fscache
      - name: the cache's own code and the built binary have no HTTP client and no outbound dial (REQ-IMAGE-001-AC13)
        run: python3 -I bin/suite-guard-run.py run test-evidence/suite-floors.json check-no-outbound-test.sh bin/check-no-outbound-test.sh
      # test-strategy.md §6: the coverage RATCHET. Coverage says the tests ran the code, not that they would notice it being wrong;
      # this gate is the floor, not the claim. Two Go modules, each measured and reported separately (an honest denominator - a root
      # `go test ./...` does not include the nested tools/requirements module). -coverpkg=./... on the root credits a
      # statement executed as a dependency of another package's test.
      - name: go test (race), with the root module's coverage profile
        run: go test -race -shuffle=on -covermode=atomic -coverpkg=./... -coverprofile=/tmp/root.out ./...
      - name: measure tools/requirements module
        run: go -C tools/requirements test -covermode=atomic -coverprofile=/tmp/req.out ./...
      # Enforce ZERO uncovered eligible statements per module (not a rounded 100.0% display); the exclusions live in the
      # committed policy file and there are none.
      - name: enforce the coverage floor
        run: |
          fail=0
          bash bin/coverage-gate.sh /tmp/root.out "root module" > /tmp/coverage-gate.txt 2>&1 || fail=1
          bash bin/coverage-gate.sh /tmp/req.out "tools/requirements module" >> /tmp/coverage-gate.txt 2>&1 || fail=1
          cat /tmp/coverage-gate.txt
          { echo "## Statement coverage (zero-uncovered gate, max_uncovered=$(jq -r '.max_uncovered' .github/policy/coverage.json))"; echo; echo '```'; cat /tmp/coverage-gate.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          [ "$fail" -eq 0 ]
      # REQ-AUD-18 AC2: the auditor's Python (.github/agent/bin/) is held to the same gate —
      # ZERO uncovered eligible statements over the parser tests + the matrix suite; the only
      # exclusions are the reasoned line ranges in .github/agent/coverage-exclusions.txt.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: pin pip (hash-checked)
        run: |
          python3 -m pip install --quiet --require-hashes --only-binary=:all: -r .github/agent/pip-requirements.txt
          python3 -m pip --version
      - name: auditor Python coverage — zero uncovered (REQ-AUD-18 AC2)
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --require-hashes --only-binary=:all: -r .github/agent/coverage-requirements.txt
          python3 -m pip install --quiet --require-hashes --only-binary=:all: -r .github/agent/test-requirements.txt
          COVERAGE_REPORT_OUT=/tmp/auditor-python-coverage.txt bash .github/agent/tests/coverage-gate.sh
          { echo "## Auditor Python coverage (REQ-AUD-18 AC2)"; echo; echo '```'; cat /tmp/auditor-python-coverage.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: publish both profiles as evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-profiles
          path: |
            /tmp/root.out
            /tmp/req.out
            /tmp/auditor-python-coverage.txt
          retention-days: 90
      # The mechanical oracle for the FIPS check. GOFIPS140 selects Go's CMVP-validated cryptographic module (cert #5247) at build
      # time; GODEBUG=fips140=only makes that module REFUSE any non-approved algorithm at runtime rather than quietly computing it.
      # Running the full suite under both means every crypto path the tests exercise — ours or a dependency's — is proven
      # approved-only on every commit. This bites: a probe that calls crypto/md5 panics under fips140=only with "not allowed in
      # FIPS 140-only mode". Scope, stated honestly because SECURITY.md says the same: =only proves the paths the tests actually
      # execute; the depguard crypto allowlist covers the static side. Neither alone is the whole claim.
      - name: build the -fips variant (same env as the released binary)
        run: CGO_ENABLED=0 GOFIPS140=v1.0.0 go build -o /tmp/fscache-fips ./cmd/fscache
      - name: full test suite, validated module, approved algorithms only
        run: GOFIPS140=v1.0.0 GODEBUG=fips140=only go test -race -shuffle=on ./...

  lint:
    name: lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2   # on a pull request the checkout is the merge commit, so HEAD^1 is the base tip
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27'
          check-latest: true
      # Go 1.27.2's compiler writes export data version 5; the prebuilt
      # golangci-lint v2.13.2 binary the action downloads reads up to version
      # 4 and fails every package at the import phase. v2.14.0 is installed
      # with `go install` under the CI Go toolchain (pinned, exact version);
      # .golangci.yml (the checks) is unchanged, and `config verify`
      # still runs before the lint, as the action did.
      - name: install golangci-lint (pinned)
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0
      - name: golangci-lint (staticcheck, gofmt, goimports, md5/sha1 import ban)
        run: |
          gobin="$(go env GOPATH)/bin"; export PATH="$gobin:$PATH"   # the program named literally
          golangci-lint config verify   # the action ran this before every run (its verify input defaults to true)
          golangci-lint run ./...
      - name: no shop words added to a file a customer can read
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: git diff -U0 --no-renames --no-color HEAD^1 HEAD | python3 -I bin/check-customer-words.py

  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27'
          check-latest: true
      - name: install the pinned Go (pinned by checksum)
        run: bash bin/install-scanner.sh go
      - name: install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
      - name: govulncheck (the same judgment as Check)
        run: python3 -I -B bin/check-govulncheck.py --scanners .github/policy/scanners.json --out "$RUNNER_TEMP/gv"

  # Hygiene, requirements and supply-chain checks. The whole-tree allowlist guard, the pin checker and the scanner-workflow guard are not run here:
  # the review gate (agent-review-gate.yml) runs main's copies of them over the pull request head, and a pull request can edit its own copies.
  allowlist:
    name: allowlist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # full history: the checks compare suppression files with the merge base against the base branch
          fetch-depth: 0

      - name: make sure the base branch ref exists
        env:
          BASE: ${{ github.base_ref }}
        run: |
          # empty on a push (nothing to compare against); on a pull request refuse an odd base name before the fetch
          if [ -n "${BASE}" ]; then
            [[ "${BASE}" =~ ^[A-Za-z0-9._][A-Za-z0-9._/-]*$ ]] || exit 1
            [[ "${BASE}" != *..* ]] || exit 1
            git fetch --no-tags origin "+refs/heads/${BASE}:refs/remotes/origin/${BASE}"
          fi

      - name: allowlist branch-scoping regressions
        run: python3 -I bin/suite-guard-run.py run test-evidence/suite-floors.json check-file-allowlist-test.sh bin/check-file-allowlist-test.sh

      - name: customer-word check regressions
        run: python3 -I bin/suite-guard-run.py run test-evidence/suite-floors.json check-customer-words-test.sh bin/check-customer-words-test.sh

      - name: branch sweep and local prune regressions
        run: python3 -I bin/suite-guard-run.py run test-evidence/suite-floors.json branch-sweep-test.sh bin/branch-sweep-test.sh

      - name: govulncheck fixture modules materialize (never indexed by the dependency graph)
        run: python3 -I bin/suite-guard-run.py run test-evidence/suite-floors.json govulncheck-fixtures-test.sh .github/agent/tests/govulncheck-fixtures-test.sh

      - name: suite guard (no tracked test file is empty)
        run: bash bin/suite-guard.sh files

      - name: suite floors only rise (against the merge base on a pull request)
        if: ${{ github.base_ref != '' }}
        env:
          BASE: ${{ github.base_ref }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          bash bin/suite-guard.sh floors-vs-base --allow-from-body "$(git merge-base HEAD "origin/${BASE}")" \
            test-evidence/suite-floors.json

      - name: set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: pin pip (hash-checked)
        run: |
          python3 -m pip install --quiet --require-hashes --only-binary=:all: -r .github/agent/pip-requirements.txt
          python3 -m pip --version
      - name: the hash-pinned test requirements (PyYAML, which the workflow checks read the workflows with, and the report lint's cmark-gfm)
        run: |
          python3 -m pip install --quiet --require-hashes --only-binary=:all: -r .github/agent/test-requirements.txt
      - name: every reusable-workflow caller covers its callees' permissions (R01)
        run: python3 bin/check-workflow-permissions.py

      # Row 78: the pin checker's own cases. The check itself (every action reference a full commit digest, each version comment resolving
      # to the pinned commit) runs in the review gate from main's copy.
      - name: the pin checker's own cases (row 78)
        run: python3 -I bin/suite-guard-run.py run test-evidence/suite-floors.json check-action-pins-test.sh .github/agent/tests/check-action-pins-test.sh
      - name: the pip that CI runs is pinned in every job that installs with pip (REQ-SUP-001-AC13)
        run: python3 -I bin/suite-guard-run.py run test-evidence/suite-floors.json pip-pin-test.sh .github/agent/tests/pip-pin-test.sh
      - name: the documented Gradle and Maven snippets have the structure acceptance runs, and the Kubernetes reset order
        run: python3 -I bin/suite-guard-run.py run test-evidence/suite-floors.json docs-snippets-test.sh .github/agent/tests/docs-snippets-test.sh

      # The hash-pinned auditor requirements must RESOLVE: a lone Dependabot bump of pydantic-core
      # (pydantic pins it exactly) merged green twice (#106, #111) and broke every real/scheduled
      # auditor run at install. Resolving here makes such a bump fail the required check instead.
      - name: auditor Python requirements resolve (hash-pinned SDK + coverage tool)
        run: |
          for r in .github/agent/adjudicator-requirements.txt .github/agent/coverage-requirements.txt .github/agent/test-requirements.txt; do
            python3 -m pip install --quiet --dry-run --ignore-installed --require-hashes --only-binary=:all: \
              --target "$RUNNER_TEMP/resolve-check" -r "$r"
          done

      - name: auditor layout — everything auditor-related under .github/agent/ (REQ-AUD-18 AC1)
        run: git ls-files | python3 .github/agent/bin/auditor-layout-check.py

      - name: auditor suites — parser unit tests and the requirements-matrix suite
        env:
          BASE: ${{ github.base_ref }}
        run: |
          # REQ-SUP-001-AC28, AC31: when a pull request changes the Gradle wrapper pin or jar, the online tests compare them with Gradle's published sum
          if [ -n "${BASE}" ] && ! git diff --quiet "origin/${BASE}...HEAD" -- bench/gradle-sample/gradle/wrapper/gradle-wrapper.properties bench/gradle-sample/gradle/wrapper/gradle-wrapper.jar .github/policy/gradle-wrapper-jar-sha256.txt; then
            export GRADLE_SUM_ONLINE=1
          fi
          bash .github/agent/tests/auditor-parser-tests.sh

      - name: auditor requirements-matrix suite (REQ-CI-005, a counting step)
        run: python3 -I bin/suite-guard-run.py run test-evidence/suite-floors.json auditor-matrix-test.sh .github/agent/tests/auditor-matrix-test.sh

      - name: auditor report-label suite (REQ-CI-005, a counting step)
        run: python3 -I bin/suite-guard-run.py run test-evidence/suite-floors.json auditor-labels-test.sh .github/agent/tests/auditor-labels-test.sh

      # The scanner-panel probe's request cap against the PINNED SDKs (Codex #155 phase-2 r2): both re-send once after a
      # 401 outside max_retries, so the cap is proven on the real SDK code, offline (a mock transport serves every request).
      - name: the probe's one-request-per-seat cap against the hash-pinned SDKs (REQ-SCAN-008)
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/panel-sdk"
          # the venv's own pip is the interpreter's bundled one: pin it first, from the same hash-checked file (REQ-SUP-001 AC13)
          "$RUNNER_TEMP/panel-sdk/bin/python" -m pip install --quiet --require-hashes --only-binary=:all: -r .github/agent/pip-requirements.txt
          "$RUNNER_TEMP/panel-sdk/bin/python" -m pip --version
          "$RUNNER_TEMP/panel-sdk/bin/pip" install --quiet --require-hashes --only-binary=:all: -r .github/agent/adjudicator-requirements.txt
          PANEL_SDK_TEST_REQUIRED=1 "$RUNNER_TEMP/panel-sdk/bin/python" .github/agent/bin/tests/test_panel_sdk_probe.py -v

      - name: the committed melange recipes are exactly the generator's output from build/melange.yaml.tmpl (REQ-BUILDTOOLS-001-AC5)
        run: python3 bin/gen-recipes.py --check

      # Punch list #3c/#6c. Version literals in prose and commands rot at
      # the next release, and this class has bitten twice: a README
      # "Release pipeline (v0.1.0)" line, and an entire RELEASING.md
      # verification section built around one tag. The standing rule is that
      # "we need not forget" resolves to a mechanical check, never to
      # memory. This is that check, and it lands only now that every doc is
      # already clean, so it goes green on arrival rather than as a
      # standing red.
      - name: no unmarked version literals in public docs
        run: ./bin/check-version-literals.sh

      # VEX tripwire (punch list #4b). A dependency we answered with a VEX
      # statement is answered on the facts as they were: golang-jwt is not
      # in the build at all, which is why CVE-2024-51744 does not apply to
      # us. If it ever enters go.sum, that premise is dead and the published
      # statement becomes a false public claim — the worst failure mode an
      # attestation has. Fail loudly and make someone re-check it.
      #
      # go.sum, not `go mod graph`: the graph lists modules that packages we
      # do not import happen to require, which is exactly the distinction
      # the VEX statement rests on.
      - name: VEX tripwire — components answered by a VEX statement must stay absent
        run: |
          set -euo pipefail
          if grep -q 'golang-jwt' go.sum; then
            echo "::error::golang-jwt has entered go.sum. The published VEX statement for CVE-2024-51744 claims component_not_present, which is no longer true on its face. VEX statement requires review before this can merge — see .vex/README.md." >&2
            exit 1
          fi
          echo "VEX tripwire: golang-jwt absent from go.sum, as the published statement asserts."

  # The suites that are not steps of a job above: one matrix leg per suite of test-evidence/suite-floors.json that no counting step of this file names (a suite is named by
  # its file name, under bin/ or .github/agent/tests/), each on its own runner. A leg that fails fails the job; every suite is also held to its floor (bin/suite-guard-run.py).
  suite-list:
    name: suite-list
    runs-on: ubuntu-latest
    outputs:
      suites: ${{ steps.list.outputs.suites }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: list
        run: |
          counted=$(grep -o 'suite-guard-run.py run test-evidence/suite-floors.json [^ ]*' .github/workflows/ci.yml | cut -d' ' -f4)
          echo "suites=$(jq -c --arg counted "$counted" '[keys[] | select(. as $k | $counted | split("\n") | index($k) | not)]' test-evidence/suite-floors.json)" >> "$GITHUB_OUTPUT"

  suites:
    name: suites (${{ matrix.suite }})
    needs: suite-list
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJSON(needs.suite-list.outputs.suites) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: pin pip (hash-checked)
        run: |
          python3 -m pip install --quiet --require-hashes --only-binary=:all: -r .github/agent/pip-requirements.txt
          python3 -m pip --version
      - name: the hash-pinned test requirements (PyYAML, which the wiring suites read the workflows with, and the report lint's cmark-gfm)
        run: |
          python3 -m pip install --quiet --require-hashes --only-binary=:all: -r .github/agent/test-requirements.txt

      - name: install the pinned grype (the suites that run the real scanner)
        if: ${{ matrix.suite == 'vex-scope-test.sh' || matrix.suite == 'vex-both-scanners-test.sh' }}
        run: ./bin/install-scanner.sh grype

      - name: the suite, held to its floor
        env:
          SUITE: ${{ matrix.suite }}
        run: |
          path=$(git ls-files -- "bin/$SUITE" ".github/agent/tests/$SUITE")
          python3 -I bin/suite-guard-run.py run test-evidence/suite-floors.json "$SUITE" "$path"

  # The required check `allowlist-chain` (REQ-CI-001): this gate keeps the name, needs the suites, always runs, takes no checkout and no action, and
  # fails unless the suites job's result is exactly `success` (failed, skipped, cancelled, missing or empty fails: a skipped required check counts as passed).
  allowlist-chain:
    name: allowlist-chain
    runs-on: ubuntu-latest
    needs: [suites]
    if: ${{ always() }}
    steps:
      - name: every suite succeeded (a failed, skipped, cancelled or missing result fails)
        env:
          RESULT: ${{ needs.suites.result }}
        run: '[ "$RESULT" = success ] || { echo "the suites did not all succeed: [$RESULT]"; exit 1; }'

  # REQ-CHAIN-001-AC6, "whose CI verifies" (slice 4b-6). On a pull request that commits .github/policy/rc-proof.json this job requires the change to
  # be exactly the marker and the removal of the one KR-CUTOVER entry of test-evidence/known-red.json, and verifies the run the marker names with the verifier of the BASE
  # checkout (bin/marker-pr-gate.py runs `chain-verify.py rc-proof` on the run's artifacts). Any other pull request passes it without a read. Three read permissions, no
  # secret; a fork's token is read-only and enough. LIMIT: a pull request that also rewrites THIS job is stopped by the workflow-change rule (both reviews and the maintainers'
  # merge), not by the job; bin/marker-gate-test.sh pins the job's text so an edit fails the suite on the same pull request.
  marker-gate:
    name: marker-gate
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      actions: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: head
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
          persist-credentials: false
      - name: the marker pull request's files, and the run its marker names
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files" --jq '.[] | .filename | @json' > changed.txt
          python3 -I -B base/bin/marker-pr-gate.py --base-dir base --head-dir head --files changed.txt --repository "$GITHUB_REPOSITORY"

  requirements:
    name: requirements
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # full history: verify-freeze reads the requirements file AS OF each baseline's fixed
          # commit (row 80), e.g. 326c459 for v0.2.1
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27'
          check-latest: true
      # The validator's own regression suite runs FIRST. `run . check`
      # exercises the validator against the real baseline only; the tests
      # cover the inputs the baseline doesn't contain (omitted status,
      # malformed dates, second documents, deprecations), and the nested
      # module is excluded from the product CI's `go test ./...`, so
      # without this step they execute nowhere in CI (round-2 review,
      # finding 2 — proven by a deliberate failure in a disposable copy).
      - name: validator regression tests
        run: go -C tools/requirements test -race -shuffle=on ./...
      - name: validate requirements and matrix freshness
        run: go -C tools/requirements run . check
      # R07 + row 80: the frozen release baseline must stay consistent with
      # the requirements file AS OF ITS FIXED COMMIT (exact hash + complete
      # blocking set) - never main's current file, so editing requirements on
      # main never turns it red, while a hand-edited freeze is still caught
      # here, in PR CI. Approval is checked only at release admission.
      - name: frozen baseline consistency (approval-agnostic)
        run: go -C tools/requirements run . verify-freeze v0.2.1
      # Repeatable regressions for the daily image rescan's merge,
      # classification and platform-enumeration logic (audit B04d/B04e/B04f):
      # the extracted bin/rescan-statement.py is exercised against real
      # CLI-shaped fixtures (Snyk OS/application/mixed, Trivy/Grype
      # clean/finding/error/malformed, finding+operational-exit, and the
      # multi-arch/null-platform/empty-arch/unknown/single-image enumeration
      # cases), so a scanner-evidence regression is caught in PR CI. Pure
      # python3 + jq — no network, gh or scanners.
      - name: daily-rescan merge/classification/enumeration regressions
        run: python3 -I bin/suite-guard-run.py run test-evidence/suite-floors.json rescan-statement-test.sh bin/rescan-statement-test.sh
