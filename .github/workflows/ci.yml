name: CI

# Runs on every push and pull request (baseline PULL-PUSH-REQ-1). Fork PRs
# get GitHub's default no-secrets treatment; this workflow never uses
# pull_request_target, so a fork PR's code never runs with repo secrets.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27'
          check-latest: true
      - name: go vet
        run: go vet ./...
      - name: go test (race)
        run: go test -race -shuffle=on ./...
      - name: static build (CGO_ENABLED=0)
        run: CGO_ENABLED=0 go build -o /dev/null ./cmd/fscache

  # test-strategy.md §6: the coverage RATCHET. Fails when total statement
  # coverage of non-excluded Go code drops below the committed floor
  # (.github/policy/coverage.json). Coverage says the tests ran the
  # code, not that they would notice it being wrong — the mutation-score
  # companion is tracked separately; this gate is the floor, not the claim.
  coverage:
    name: coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27'
          check-latest: true
      # Two Go modules, each measured and reported separately (an honest
      # denominator - a root `go test ./...` does not include the nested
      # tools/requirements module). -coverpkg=./... on the root credits a
      # statement executed as a dependency of another package's test.
      - name: measure root product module
        run: go test -race -covermode=atomic -coverpkg=./... -coverprofile=/tmp/root.out ./...
      - name: measure tools/requirements module
        run: go -C tools/requirements test -covermode=atomic -coverprofile=/tmp/req.out ./...
      # Enforce ZERO uncovered eligible statements per module (not a
      # rounded 100.0% display). Exclusions live in the committed policy
      # file and there are none.
      - name: enforce the coverage floor
        run: |
          set -euo pipefail
          max=$(jq -r '.max_uncovered' .github/policy/coverage.json)
          fail=0
          {
            echo "## Statement coverage (zero-uncovered gate, max_uncovered=${max})"
            echo
            echo '```'
            bash bin/coverage-gate.sh /tmp/root.out "root module" || fail=1
            bash bin/coverage-gate.sh /tmp/req.out  "tools/requirements module" || fail=1
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          bash bin/coverage-gate.sh /tmp/root.out "root module"
          bash bin/coverage-gate.sh /tmp/req.out  "tools/requirements module"
          [ "$fail" -eq 0 ] || exit 1
      # REQ-AUD-18 AC2: the auditor's Python (.github/agent/bin/) is held to the same gate —
      # ZERO uncovered eligible statements over the parser tests + the matrix suite; the only
      # exclusions are the reasoned line ranges in .github/agent/coverage-exclusions.txt.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: pin pip (hash-checked)
        run: |
          python3 -m pip install --quiet --require-hashes --only-binary=:all: -r .github/agent/pip-requirements.txt
          python3 -m pip --version
      - name: auditor Python coverage — zero uncovered (REQ-AUD-18 AC2)
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --require-hashes --only-binary=:all: -r .github/agent/coverage-requirements.txt
          python3 -m pip install --quiet --require-hashes --only-binary=:all: -r .github/agent/test-requirements.txt
          COVERAGE_REPORT_OUT=/tmp/auditor-python-coverage.txt bash .github/agent/tests/coverage-gate.sh
          { echo "## Auditor Python coverage (REQ-AUD-18 AC2)"; echo; echo '```'; cat /tmp/auditor-python-coverage.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: publish both profiles as evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-profiles
          path: |
            /tmp/root.out
            /tmp/req.out
            /tmp/auditor-python-coverage.txt
          retention-days: 90

  lint:
    name: lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27'
          check-latest: true
      - name: golangci-lint (staticcheck, gofmt, goimports, md5/sha1 import ban)
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13.2

  gosec:
    name: gosec
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27'
          check-latest: true
      # gosec is pinned to v2.29.0 (the latest), but run via `go install`
      # under the CI Go toolchain — NOT the securego/gosec Docker action,
      # whose bundled Go cannot type-check a go.mod on the 1.26 line and
      # fails at the import phase (it never reaches the checks). Same
      # install pattern as gremlins in go-freshness.yml's mutation job. gosec still exits
      # non-zero on any finding, so the gate is unchanged.
      - name: install gosec (pinned)
        run: go install github.com/securego/gosec/v2/cmd/gosec@v2.29.0
      - name: run gosec
        run: |
          gobin="$(go env GOPATH)/bin"; export PATH="$gobin:$PATH"   # the program named literally (pin checker: advisor 0084)
          gosec -fmt sarif -out gosec-results.sarif ./...
      # Fork PRs get a read-only GITHUB_TOKEN that `permissions:` cannot
      # elevate, so security-events: write is not granted and this upload
      # cannot succeed. gosec is a REQUIRED status check: without this guard
      # the upload failure sinks the job and every external contributor's PR
      # arrives with a red required check it has no way to fix. The scan
      # itself still runs and still gates the PR — only the results upload
      # is skipped, and code scanning keeps its coverage from same-repo
      # pushes and the default branch.
      - name: upload SARIF
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        if: always() && github.event.pull_request.head.repo.fork != true
        with:
          sarif_file: gosec-results.sarif

  # The mechanical oracle for our FIPS claim (punch list #10a). GOFIPS140
  # selects Go's CMVP-validated cryptographic module (cert #5247) at build
  # time; GODEBUG=fips140=only makes that module REFUSE any non-approved
  # algorithm at runtime rather than quietly computing it. Running the full
  # suite under both means every crypto path the tests exercise — ours or a
  # dependency's — is proven approved-only on every commit.
  #
  # This bites: verified against a probe that calls crypto/md5, which panics
  # under fips140=only with "not allowed in FIPS 140-only mode". A gate that
  # cannot fail would prove nothing, so that was checked before this job was
  # written, not assumed.
  #
  # Scope, stated honestly because SECURITY.md says the same: =only proves
  # the paths the tests actually execute. The depguard crypto allowlist
  # below covers the static side. Neither alone is the whole claim.
  fips140-only:
    name: fips140-only
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27'
          check-latest: true
      - name: build the -fips variant (same env as the released binary)
        run: CGO_ENABLED=0 GOFIPS140=v1.0.0 go build -o /tmp/fscache-fips ./cmd/fscache
      - name: full test suite, validated module, approved algorithms only
        run: GOFIPS140=v1.0.0 GODEBUG=fips140=only go test -race -shuffle=on ./...

  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27'
          check-latest: true
      - name: install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
      - name: govulncheck
        run: govulncheck ./...

  # ---------------------------------------------------------------------------------------------------------------
  # Merged from hygiene.yml, requirements.yml and dependency-review.yml (workflow consolidation 2 of 4, owner RATIFIED
  # Oct 2). Same events (push to main, pull_request); every job keeps its name, top-level placement and own
  # permissions; dependency-review runs on pull requests only, the only scope it is required on.
  allowlist:
    name: allowlist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # full history: the check compares suppression files with the merge base against the base branch
          fetch-depth: 0

      - name: make sure the base branch ref exists
        env:
          BASE: ${{ github.base_ref }}
        run: |
          # empty on a push (nothing to compare against); on a pull request refuse an odd base name before the fetch
          if [ -n "${BASE}" ]; then
            [[ "${BASE}" =~ ^[A-Za-z0-9._][A-Za-z0-9._/-]*$ ]] || exit 1
            [[ "${BASE}" != *..* ]] || exit 1
            git fetch --no-tags origin "+refs/heads/${BASE}:refs/remotes/origin/${BASE}"
          fi

      - name: check every tracked file against the allowlist
        env:
          # head repo vs this repo decides whether an auditor/* head is the real lane (a fork can name a branch anything)
          GITHUB_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: git ls-files | ./bin/check-file-allowlist.sh

      - name: allowlist branch-scoping regressions (auditor suppression lane)
        run: bash bin/check-file-allowlist-test.sh

      - name: govulncheck fixture modules materialize (never indexed by the dependency graph)
        run: bash .github/agent/tests/govulncheck-fixtures-test.sh

      - name: set up Python for the workflow-permission check
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: pin pip (hash-checked)
        run: |
          python3 -m pip install --quiet --require-hashes --only-binary=:all: -r .github/agent/pip-requirements.txt
          python3 -m pip --version
      - name: every reusable-workflow caller covers its callees' permissions (R01)
        run: |
          # hash-pinned (row 78 pin pass on #156: no mutable package content in a required check)
          python3 -m pip install --quiet --require-hashes --only-binary=:all: -r /dev/stdin <<'REQ'
          pyyaml==6.0.2 --hash=sha256:80bab7bfc629882493af4aa31a4cfa43a4c57c83813253626916b8c7ada83476 --hash=sha256:1f71ea527786de97d1a0cc0eacd1defc0985dcf6b3f17bb77dcfc8c34bec4dc5
          REQ
          python3 bin/check-workflow-permissions.py

      # Row 78: every action reference is a full commit digest with its version in
      # a comment, and each comment resolves to the pinned commit. A tag or branch reference fails.
      - name: the pin checker's own cases (row 78)
        run: bash .github/agent/tests/check-action-pins-test.sh
      - name: every GitHub Action is pinned to a commit digest (row 78)
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/agent/bin/check-action-pins.py --verify-tags .
      - name: the pin check's wiring cannot be skipped or weakened (REQ-REL-005-AC1)
        run: bash .github/agent/tests/pin-wiring-test.sh
      - name: the pip that CI runs is pinned in every job that installs with pip (REQ-SUP-001-AC13)
        run: bash .github/agent/tests/pip-pin-test.sh
      - name: the documented Gradle and Maven snippets are the ones acceptance runs
        run: bash .github/agent/tests/docs-snippets-test.sh

      # The hash-pinned auditor requirements must RESOLVE: a lone Dependabot bump of pydantic-core
      # (pydantic pins it exactly) merged green twice (#106, #111) and broke every real/scheduled
      # auditor run at install. Resolving here makes such a bump fail the required check instead.
      - name: auditor Python requirements resolve (hash-pinned SDK + coverage tool)
        run: |
          for r in .github/agent/adjudicator-requirements.txt .github/agent/coverage-requirements.txt .github/agent/test-requirements.txt; do
            python3 -m pip install --quiet --dry-run --ignore-installed --require-hashes --only-binary=:all: \
              --target "$RUNNER_TEMP/resolve-check" -r "$r"
          done

      - name: auditor layout — everything auditor-related under .github/agent/ (REQ-AUD-18 AC1)
        run: git ls-files | python3 .github/agent/bin/auditor-layout-check.py

      - name: auditor suites — parser unit tests and the requirements-matrix suite
        run: |
          # the report lint renders with GitHub's own cmark-gfm (hash-pinned, test-only)
          python3 -m pip install --quiet --require-hashes --only-binary=:all: -r .github/agent/test-requirements.txt
          bash .github/agent/tests/auditor-parser-tests.sh
          bash .github/agent/tests/auditor-matrix-test.sh
          bash .github/agent/tests/auditor-labels-test.sh

      # The scanner-panel probe's request cap against the PINNED SDKs (Codex #155 phase-2 r2): both re-send once after a
      # 401 outside max_retries, so the cap is proven on the real SDK code, offline (a mock transport serves every request).
      - name: the probe's one-request-per-seat cap against the hash-pinned SDKs (scanner panel rule 8; REQ-SCAN-008)
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/panel-sdk"
          # the venv's own pip is the interpreter's bundled one: pin it first, from the same hash-checked file (REQ-SUP-001 AC13)
          "$RUNNER_TEMP/panel-sdk/bin/python" -m pip install --quiet --require-hashes --only-binary=:all: -r .github/agent/pip-requirements.txt
          "$RUNNER_TEMP/panel-sdk/bin/python" -m pip --version
          "$RUNNER_TEMP/panel-sdk/bin/pip" install --quiet --require-hashes --only-binary=:all: -r .github/agent/adjudicator-requirements.txt
          PANEL_SDK_TEST_REQUIRED=1 "$RUNNER_TEMP/panel-sdk/bin/python" .github/agent/bin/tests/test_panel_sdk_probe.py -v

      - name: privacy candidate-trace analyzer regressions (B03)
        run: bash bin/analyze-egress-trace-test.sh

      - name: scanner installer failure-path regressions (pinned-checksum contract)
        run: bash bin/install-scanner-test.sh

      - name: Dependabot reviewer regressions (row 75 — updates parsing, findings validation, mechanical decision)
        run: bash bin/dependabot-reviewer-test.sh
      - name: dependency lanes wiring — reviewer hourly from main, guard on every PR/push, patch/minor lane after the guard (rows 75, 80)
        run: bash bin/dependency-lanes-test.sh
      - name: the Dependabot reviewer's bundle carries the diff, every in-range release note and our usage (row 75 b)
        run: bash bin/dependabot-reviewer-gather-test.sh
      - name: the scanner panel's judge — counts and quorum, the VEX, seen by N of M, unique findings audited (scanner-panel rules 3-9)
        run: bash bin/panel-test.sh
      - name: the automatic patch-release decision — fix-class commits, next patch, one a day, notes, floating tags (owner Oct 2)
        run: bash bin/patch-decide-test.sh
      - name: admission's tag signer — the owner's SSH key on any tag, the release workflow's keyless identity on patch tags only (owner Oct 2)
        run: bash bin/admission-tag-signer-test.sh

      - name: release.yml's automatic patch wiring — decide on main only, keyless gitsign, the App pushes, failures open an issue (owner Oct 2)
        run: bash bin/release-patch-wiring-test.sh
      - name: the Maven capped scenario recognises the server's 413 in either resolver wording (REQ-EVICT-002-AC4)
        run: bash bin/acceptance-maven-413-test.sh
      - name: release.yml's notes commit runs exactly the committed signed-commit CLI (advisor 0210; the literal path is judged under .github/agent/)
        run: bash .github/agent/tests/release-notes-signed-test.sh
      - name: go-freshness opens its bump PR with the auditor App's token, read-only otherwise (owner, Oct 2)
        run: bash bin/go-freshness-wiring-test.sh
      - name: the ratified workflow consolidation (mutation runs weekly inside go-freshness; owner Oct 2)
        run: bash bin/workflow-consolidation-test.sh
      - name: the scanner panel's wiring — which scanner on which image, Google by federation, the VEX the only exception (rules 1, 2, 4, 9)
        run: bash bin/panel-wiring-test.sh
      - name: the k8s acceptance harness's fenced exclusion — its two generated scripts come only from docs/kubernetes.md (advisor 0084)
        run: bash .github/agent/tests/k8s-harness-fence-test.sh
      - name: the pin age check — 7 days by a server-side time, named per moved version (REQ-SUP-001 AC2, AC3)
        run: bash .github/agent/tests/pin-age-check-test.sh
      - name: the daily supply-chain audit — advisories, upstream, disputed hits with checked-in exceptions, held-PR re-runs (REQ-SUP-001 AC5-AC10)
        run: bash .github/agent/tests/pin-audit-test.sh
      - name: where the supply-chain checks run — Dependabot cooldown, the PR job's read-only token, one writer per job (REQ-SUP-001 AC1, AC4, AC6)
        run: bash .github/agent/tests/supply-chain-wiring-test.sh

      - name: PR-gate image verdict regressions (row 57 — counts, did-not-run, VEX coverage)
        run: bash bin/inspector-gate-test.sh

      - name: VEX product-scope regressions (audit R01 — exception bound to the FosterStack product)
        run: |
          ./bin/install-scanner.sh grype
          bash bin/vex-scope-test.sh

      - name: VEX applied by both gate scanners (REQ-REL-004-AC1 — covered suppressed, uncovered blocks, zero packages fails)
        run: bash bin/vex-both-scanners-test.sh

      - name: our VEX in three forms — the same statements, generated before the signed manifest (scanner-panel rule 10)
        run: bash bin/vex-forms-test.sh

      - name: the Docker Scout root-cause round's documents, matrix and judge (advisor 0120/0122)
        run: bash bin/scout-root-cause-test.sh

      - name: Go-bump PR recovery regressions (audit R03 — orphaned branch / closed-merged)
        run: bash bin/go-bump-open-pr-test.sh

      # VEX tripwire (punch list #4b). A dependency we answered with a VEX
      # statement is answered on the facts as they were: golang-jwt is not
      # in the build at all, which is why CVE-2024-51744 does not apply to
      # us. If it ever enters go.sum, that premise is dead and the published
      # statement becomes a false public claim — the worst failure mode an
      # attestation has. Fail loudly and make someone re-check it.
      #
      # go.sum, not `go mod graph`: the graph lists modules that packages we
      # do not import happen to require, which is exactly the distinction
      # the VEX statement rests on.
      # Punch list #3c/#6c. Version literals in prose and commands rot at
      # the next release, and this class has bitten twice: a README
      # "Release pipeline (v0.1.0)" line, and an entire RELEASING.md
      # verification section built around one tag. Owner doctrine is that
      # "we need not forget" resolves to a mechanical check, never to
      # memory. This is that check, and it lands only now that every doc is
      # already clean, so it goes green on arrival rather than as a
      # standing red.
      - name: no unmarked version literals in public docs
        run: ./bin/check-version-literals.sh

      - name: VEX tripwire — components answered by a VEX statement must stay absent
        run: |
          set -euo pipefail
          if grep -q 'golang-jwt' go.sum; then
            echo "::error::golang-jwt has entered go.sum. The published VEX statement for CVE-2024-51744 claims component_not_present, which is no longer true on its face. VEX statement requires review before this can merge — see .vex/README.md." >&2
            exit 1
          fi
          echo "VEX tripwire: golang-jwt absent from go.sum, as the published statement asserts."

  # Register row 75 (the #133 lesson: three ruleset edits, each silently stalled
  # Dependabot). The ruleset on main and .github/policy/required-checks.json must
  # match exactly — contexts and integration IDs — on EVERY PR and every push to
  # main, so drift is red the day it happens, not when a bot PR quietly stalls.
  required-check-guard:
    name: required-check guard
    runs-on: ubuntu-latest
    outputs:
      drift_issue: ${{ steps.drift-issue.outputs.issue }}
    permissions:
      contents: read
      issues: write        # the `required-check drift` issue (downgraded on fork/Dependabot runs)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: guard regressions (offline fixtures)
        run: bash bin/required-check-guard-test.sh

      # The verdict uses THIS tree's list, so a PR that fixes a stale list goes green on
      # its own run; on push to main the tree is main.
      - name: the ruleset on main vs this tree's required-checks.json
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash bin/required-check-guard.sh .github/policy/required-checks.json

      # The issue tracks drift ON MAIN (main's list vs the ruleset), whichever run sees it
      # first; one open issue, updated in place, never duplicated. Best effort: a
      # Dependabot or fork run has no issues:write, and the red check above still stands.
      - name: open or update the `required-check drift` issue when main's list has drifted
        id: drift-issue
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set +e -uo pipefail   # the runner starts bash with -e; the guard's refusal is data here
          gh api "repos/${GITHUB_REPOSITORY}/contents/.github/policy/required-checks.json?ref=main" \
            --jq '.content' | base64 -d > "${RUNNER_TEMP}/main-required-checks.json" || exit 0
          out=$(bash bin/required-check-guard.sh "${RUNNER_TEMP}/main-required-checks.json" 2>&1) && rc=0 || rc=$?
          # Drift (1), or a ruleset that enforces nothing at all (a refusal, not a read error).
          if [ "$rc" -ne 1 ] && ! grep -q "NO required status checks" <<<"$out"; then
            echo "main's list vs the ruleset: rc ${rc} — no drift issue to open"; exit 0
          fi
          title="required-check drift"
          # shellcheck disable=SC2016  # literal Markdown backticks, not expansions
          {
            echo 'The ruleset on `main` and `.github/policy/required-checks.json` on `main` differ (contexts and integration IDs must both match, exactly). Until they agree the Dependabot auto-merge guard refuses every patch/minor PR and every PR ci run is red.'
            echo
            echo 'Fix whichever is wrong: the ruleset (owner, GitHub UI) or the list (a PR).'
            echo
            echo "Seen by ${RUN_URL}"
            echo
            echo '```'
            printf '%s\n' "${out}"
            echo '```'
          } > "${RUNNER_TEMP}/drift-body.md"
          n=$(gh issue list --state open --search "\"${title}\" in:title" --json number,title \
                | jq -r --arg t "$title" '[.[] | select(.title == $t)][0].number // empty')
          if [ -n "$n" ]; then gh issue edit "$n" --body-file "${RUNNER_TEMP}/drift-body.md" >/dev/null && echo "updated #${n}"
          else url=$(gh issue create --title "$title" --body-file "${RUNNER_TEMP}/drift-body.md") && n="${url##*/}" && echo "$url"; fi
          if [ -n "$n" ]; then echo "issue=$n" >> "$GITHUB_OUTPUT"; fi

  # Row 76: a drift issue dispatches the fixer in the ops repository. Only on push to main: the
  # App secrets live in the main-only `agent` environment, which a PR run cannot use. A drift first
  # seen on a PR run is dispatched by the next push to main (or by hand). Best effort: no token or
  # a failed call is a warning; the issue is the record.
  drift-fixer-dispatch:
    name: dispatch the fixer for required-check drift
    needs: required-check-guard
    if: ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.required-check-guard.outputs.drift_issue != '' }}
    runs-on: ubuntu-latest
    environment: agent
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: mint the App token for dispatching the fixer (ops, contents:write only)
        id: app-ops
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.AUDITOR_APP_ID }}
          private-key: ${{ secrets.AUDITOR_APP_PRIVATE_KEY }}
          repositories: ops
          permission-contents: write
      - name: dispatch
        env:
          DISPATCH_TOKEN: ${{ steps.app-ops.outputs.token }}
          ISSUE: ${{ needs.required-check-guard.outputs.drift_issue }}
        run: bash bin/dispatch-fixer.sh fix-required-check-drift "$ISSUE" || true

  requirements:
    name: requirements
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # full history: verify-freeze reads the requirements file AS OF each baseline's fixed
          # commit (row 80), e.g. 326c459 for v0.2.1
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27'
          check-latest: true
      # The validator's own regression suite runs FIRST. `run . check`
      # exercises the validator against the real baseline only; the tests
      # cover the inputs the baseline doesn't contain (omitted status,
      # malformed dates, second documents, deprecations), and the nested
      # module is excluded from the product CI's `go test ./...`, so
      # without this step they execute nowhere in CI (round-2 review,
      # finding 2 — proven by a deliberate failure in a disposable copy).
      - name: validator regression tests
        run: go -C tools/requirements test -race -shuffle=on ./...
      - name: validate requirements and matrix freshness
        run: go -C tools/requirements run . check
      # R07 + row 80: the frozen release baseline must stay consistent with
      # the requirements file AS OF ITS FIXED COMMIT (exact hash + complete
      # blocking set) - never main's current file, so editing requirements on
      # main never turns it red, while a hand-edited freeze is still caught
      # here, in PR CI. Approval is checked only at release admission.
      - name: frozen baseline consistency (approval-agnostic)
        run: go -C tools/requirements run . verify-freeze v0.2.1
      # Repeatable semantic regressions for the authorization stage's
      # acceptance-content policy (audit B02b): the extracted validator is
      # exercised here against the frozen baseline with valid/empty/
      # missing/skip/invalid/fail/duplicate/unknown fixtures, so a
      # weakening of the policy is caught in PR CI, not only by an
      # external probe.
      - name: authorization acceptance-content policy regressions
        run: bash bin/authorize-acceptance-check-test.sh
      # Repeatable regressions for the daily image rescan's merge,
      # classification and platform-enumeration logic (audit B04d/B04e/B04f):
      # the extracted bin/rescan-statement.py is exercised against real
      # CLI-shaped fixtures (Snyk OS/application/mixed, Trivy/Grype
      # clean/finding/error/malformed, finding+operational-exit, and the
      # multi-arch/null-platform/empty-arch/unknown/single-image enumeration
      # cases), so a scanner-evidence regression is caught in PR CI. Pure
      # python3 + jq — no network, gh or scanners.
      - name: daily-rescan merge/classification/enumeration regressions
        run: bash bin/rescan-statement-test.sh

  dependency-review:
    if: ${{ github.event_name == 'pull_request' }}   # required on pull requests only; the action needs a PR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
