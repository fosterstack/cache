name: CodeQL

on:
  push:
    branches: [main]
  schedule:
    # Daily, so drift in CodeQL's own query packs still gets applied to
    # the current tree even on weeks with no code changes.
    - cron: '17 6 * * *'

# A pull request's FIRST run attempt of this workflow shares a group with the pull request's other first attempts, so a newer push cancels its older run. Every other run (whatever
# its event, and any re-run of any head) gets a group of its own per run and attempt: it is never cancelled, never replaced as a pending run, and a re-run of an old head cancels
# nothing. The prefix is a literal, not github.workflow, so no workflow name can collide with another's group.
concurrency:
  group: ${{ github.event_name == 'pull_request' && github.run_attempt == '1' && format('codeql-pr-{0}', github.event.pull_request.number) || format('codeql-{0}-{1}', github.run_id, github.run_attempt) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  analyze:
    name: analyze (go)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27'
          check-latest: true
      - name: initialize CodeQL
        uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: go
      - name: autobuild
        uses: github/codeql-action/autobuild@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
      - name: perform CodeQL analysis
        uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3

  # REQ-CI-001-AC6: a failed scheduled run opens a fix item (an issue with a fixed title and label, or a comment on the open one) and blocks nothing;
  # no pull request check reads it. The job holds issues: write and nothing else.
  report-failure:
    name: report-failure
    needs: [analyze]
    if: ${{ failure() && github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: open the fix item, or comment on the open one
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TITLE: "The scheduled CodeQL analysis failed"
          LABEL: scheduled-failure
        run: |
          set -euo pipefail
          url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          body="The scheduled run failed on ${GITHUB_SHA}: ${url}"
          n=$(gh issue list --state open --label "$LABEL" --json number,title --jq ".[] | select(.title == \"$TITLE\") | .number" | head -n 1)
          if [ -n "$n" ]; then
            gh issue comment "$n" --body "$body"
          else
            gh label create "$LABEL" --description "A scheduled run failed" --color D93F0B 2>/dev/null || true
            gh issue create --title "$TITLE" --label "$LABEL" --body "$body"
          fi
