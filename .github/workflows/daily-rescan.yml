name: Daily image rescan

# Release-chain daily rescan (release-chain-design.md §3): reads
# release-manifest.json from every published release that carries one
# and scans the DIGESTS it names — never tags, which can move — with
# every scanner in .github/policy/scanners.json at the same
# block-at-any-severity policy as the release gate, VEX the only
# exception. New CVEs get disclosed against unchanged bytes constantly;
# this is what feeds the 24-48h response SLA.
#
# Output is deliberately shaped as the seed of the VEX adjudication
# pipeline (ops_dossier_vex_service.md §9): one digest-keyed statement
# per (release, variant, scanner), carrying the scanner's identity and
# database state, the normalized findings, and the VEX evidence that was
# applied — uploaded as an artifact every run, clean or not. No product
# features; just don't preclude them.
#
# v0.1.0 predates release manifests and stays covered by the
# rescan-v010.yml stopgap until it is superseded.

on:
  schedule:
    - cron: '11 7 * * *' # offset from the hour to avoid GH's on-the-hour pile-up
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  manifests:
    name: enumerate release manifests
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.collect.outputs.targets }}
      any: ${{ steps.collect.outputs.any }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: collect (release, variant, digest, scanner) targets
        id: collect
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          scanners=$(jq -c '.scanners' .github/policy/scanners.json)
          : > /tmp/targets.jsonl

          # F12: legacy releases that predate release-manifest.json are
          # covered from a committed inventory, so the daily rescan never
          # silently stops covering the current public release.
          jq -c --argjson scanners "$scanners" \
            '.releases[] as $r | $r.images[] as $img | $scanners[] as $s |
             {release: $r.version, variant: $img.variant, digest: $img.digest, scanner: $s, source: "legacy-inventory"}' \
            .github/policy/legacy-releases.json >> /tmp/targets.jsonl
          legacy_versions=$(jq -r '[.releases[].version] | join(" ")' .github/policy/legacy-releases.json)

          # Manifest-bearing releases: enumerate ASSETS first, so we can
          # tell an intentional legacy absence (no manifest asset) from a
          # FAILED read of a manifest that is present (F13).
          for tag in $(gh release list --limit 100 --json tagName,isDraft \
                        --jq '.[] | select(.isDraft | not) | .tagName'); do
            case " $legacy_versions " in *" $tag "*) continue ;; esac
            has_manifest=$(gh release view "$tag" --json assets \
              --jq '[.assets[] | select(.name == "release-manifest.json")] | length')
            if [ "$has_manifest" -eq 0 ]; then
              echo "note: ${tag} has no release-manifest.json asset and is not in the legacy inventory — skipping (add it to legacy-releases.json if it must be scanned)"
              continue
            fi
            # The asset exists: a failed download/parse is an ERROR, not
            # an empty result that would erase the release from coverage.
            if ! gh release download "$tag" -p release-manifest.json -O "/tmp/m-${tag}.json"; then
              echo "::error::release-manifest.json is present on ${tag} but could not be downloaded — refusing to drop it from the rescan" >&2
              exit 1
            fi
            jq empty "/tmp/m-${tag}.json" 2>/dev/null \
              || { echo "::error::release-manifest.json on ${tag} is not valid JSON" >&2; exit 1; }
            imgcount=$(jq '.images | length' "/tmp/m-${tag}.json")
            [ "$imgcount" -ge 1 ] || { echo "::error::release-manifest.json on ${tag} lists no images" >&2; exit 1; }
            jq -c --arg tag "$tag" --argjson scanners "$scanners" \
              '.images[] as $img | $scanners[] as $s |
               {release: $tag, variant: $img.variant, digest: $img.digest, scanner: $s, source: "release-manifest"}' \
              "/tmp/m-${tag}.json" >> /tmp/targets.jsonl
          done

          targets=$(jq -s -c '.' /tmp/targets.jsonl)
          echo "targets=${targets}" >> "$GITHUB_OUTPUT"
          n=$(jq 'length' <<<"$targets")
          # There is ALWAYS at least the legacy inventory, so an empty set
          # means the inventory itself is broken - fail, do not no-op.
          if [ "$n" -eq 0 ]; then
            echo "::error::no rescan targets at all - the legacy inventory is empty or unreadable" >&2
            exit 1
          fi
          echo "any=true" >> "$GITHUB_OUTPUT"
          echo "rescanning ${n} (release, variant, scanner) targets"

  rescan:
    name: ${{ matrix.target.scanner }} ${{ matrix.target.release }} ${{ matrix.target.variant }}
    needs: manifests
    if: needs.manifests.outputs.any == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      packages: read
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.manifests.outputs.targets) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # ---- trivy (CLI: reliable version/db, by digest) -------------------
      - name: Trivy rescan (by digest, JSON findings)
        if: matrix.target.scanner == 'trivy'
        id: trivy
        continue-on-error: true
        env:
          TRIVY_VEX: ${{ github.workspace }}/.vex/fosterstack-cache.openvex.json
        run: |
          set -euo pipefail
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin v0.66.0
          echo '${{ github.token }}' | docker login ghcr.io -u '${{ github.actor }}' --password-stdin || true
          trivy image --quiet --exit-code 1 \
            --severity CRITICAL,HIGH,MEDIUM,LOW,UNKNOWN \
            --vex "${TRIVY_VEX}" \
            --format json --output /tmp/findings-raw.json \
            "ghcr.io/${{ github.repository_owner }}/cache@${{ matrix.target.digest }}"

      # ---- grype (CLI: reliable version/db, by digest) -------------------
      - name: Grype rescan (by digest, JSON findings)
        if: matrix.target.scanner == 'grype'
        id: grype
        continue-on-error: true
        run: |
          set -euo pipefail
          curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b /usr/local/bin v0.98.0
          echo '${{ github.token }}' | docker login ghcr.io -u '${{ github.actor }}' --password-stdin || true
          grype "registry:ghcr.io/${{ github.repository_owner }}/cache@${{ matrix.target.digest }}" \
            --fail-on negligible \
            --vex .vex/fosterstack-cache.openvex.json \
            -o json --file /tmp/findings-raw.json

      # ---- snyk ----------------------------------------------------------
      - name: install the Snyk CLI (pinned)
        if: matrix.target.scanner == 'snyk'
        uses: snyk/actions/setup@9adf32b1121593767fc3c057af55b55db032dc04 # v1.0.0
        with:
          snyk-version: v1.1307.0
      - name: Snyk rescan (by digest, JSON findings)
        if: matrix.target.scanner == 'snyk'
        id: snyk
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          set -uo pipefail
          [ -n "${SNYK_TOKEN:-}" ] || { echo "::error::SNYK_TOKEN unavailable — a rescan that silently skips a scanner is not a rescan" >&2; exit 1; }
          snyk container test \
            "ghcr.io/${{ github.repository_owner }}/cache@${{ matrix.target.digest }}" \
            --org=fosterstack-admin --json-file-output=/tmp/findings-raw.json

      # ---- scanner identity (F14) ----------------------------------------
      - name: record scanner version and database state
        run: |
          set -euo pipefail
          : > /tmp/scanner-meta
          case '${{ matrix.target.scanner }}' in
            trivy)
              echo "version=$(trivy --version 2>/dev/null | awk 'NR==1{print $2}')" >> /tmp/scanner-meta
              echo "db=$(trivy version --format json 2>/dev/null | jq -r '.VulnerabilityDB.UpdatedAt // "unknown"')" >> /tmp/scanner-meta ;;
            grype)
              echo "version=$(grype version 2>/dev/null | awk '/^Version:/{print $2}')" >> /tmp/scanner-meta
              echo "db=$(grype db status 2>/dev/null | awk '/Built|built/{print $NF; exit}')" >> /tmp/scanner-meta ;;
            snyk)
              echo "version=$(snyk version 2>/dev/null | head -1)" >> /tmp/scanner-meta
              echo "db=service-side (Snyk SaaS; no local database timestamp)" >> /tmp/scanner-meta ;;
          esac
          cat /tmp/scanner-meta

      # ---- statement -----------------------------------------------------
      - name: write the digest-keyed rescan statement
        id: statement
        run: |
          set -euo pipefail
          outcome='clean'
          case '${{ matrix.target.scanner }}' in
            trivy) [ '${{ steps.trivy.outcome }}' = 'success' ] || outcome='findings' ;;
            grype) [ '${{ steps.grype.outcome }}' = 'success' ] || outcome='findings' ;;
            snyk)  [ '${{ steps.snyk.outcome }}'  = 'success' ] || outcome='findings' ;;
          esac
          python3 - "$outcome" <<'PY'
          import json, sys, hashlib, datetime, os
          outcome = sys.argv[1]
          scanner = '${{ matrix.target.scanner }}'
          meta = {}
          try:
              for line in open('/tmp/scanner-meta'):
                  if '=' in line:
                      k, v = line.rstrip('\n').split('=', 1)
                      meta[k] = v
          except FileNotFoundError:
              pass
          findings = []
          try:
              raw = json.load(open('/tmp/findings-raw.json'))
              if scanner == 'trivy':
                  for res in raw.get('Results') or []:
                      for v in res.get('Vulnerabilities') or []:
                          findings.append({'id': v.get('VulnerabilityID'),
                                           'severity': (v.get('Severity') or '').lower(),
                                           'package': v.get('PkgName'),
                                           'fixed_in': v.get('FixedVersion') or None})
              elif scanner == 'grype':
                  for m in raw.get('matches') or []:
                      findings.append({'id': m['vulnerability'].get('id'),
                                       'severity': (m['vulnerability'].get('severity') or '').lower(),
                                       'package': m.get('artifact', {}).get('name'),
                                       'fixed_in': (m['vulnerability'].get('fix') or {}).get('versions') or None})
              elif scanner == 'snyk':
                  for v in raw.get('vulnerabilities') or []:
                      findings.append({'id': v.get('identifiers', {}).get('CVE', [v.get('id')])[0] if v.get('identifiers', {}).get('CVE') else v.get('id'),
                                       'severity': (v.get('severity') or '').lower(),
                                       'package': v.get('packageName'),
                                       'fixed_in': v.get('nearestFixedInVersion') or None})
          except FileNotFoundError:
              pass
          vex_doc = '.vex/fosterstack-cache.openvex.json'
          vex = json.load(open(vex_doc))
          statement = {
              'schema': 'https://fosterstack.com/rescan-statement/v1',
              'scanned_at': datetime.datetime.now(datetime.timezone.utc).isoformat(timespec='seconds'),
              'release': '${{ matrix.target.release }}',
              'variant': '${{ matrix.target.variant }}',
              'digest': '${{ matrix.target.digest }}',
              'image_ref': 'ghcr.io/${{ github.repository_owner }}/cache@${{ matrix.target.digest }}',
              'scanner': scanner,
              'scanner_version': meta.get('version', 'unknown'),
              'scanner_database': meta.get('db', 'unknown'),
              'policy': 'block at any severity; the published VEX document is the only exception',
              'verdict': outcome,
              'findings': findings,
              'raw_report': {
                  'path': 'findings-raw.json',
                  'sha256': (hashlib.sha256(open('/tmp/findings-raw.json','rb').read()).hexdigest()
                             if os.path.exists('/tmp/findings-raw.json') else None),
              },
              'vex': {
                  'document': vex_doc,
                  'sha256': hashlib.sha256(open(vex_doc, 'rb').read()).hexdigest(),
                  'applicable_statements': [
                      st for st in vex.get('statements', [])
                      if any(str(p.get('@id','')).endswith('${{ matrix.target.digest }}'.split(':')[-1])
                             or '${{ matrix.target.digest }}' in json.dumps(p)
                             for p in (st.get('products') or []))
                  ],
                  'document_statement_count': len(vex.get('statements', [])),
              },
          }
          json.dump(statement, open('/tmp/rescan-statement.json', 'w'), indent=1)
          print(json.dumps({'verdict': outcome, 'count': len(findings)}))
          PY
          echo "outcome=${outcome}" >> "$GITHUB_OUTPUT"

      - name: stage the raw report beside the statement
        run: |
          set -euo pipefail
          mkdir -p /tmp/rescan-out
          cp /tmp/rescan-statement.json /tmp/rescan-out/
          [ -f /tmp/findings-raw.json ] && cp /tmp/findings-raw.json /tmp/rescan-out/ || true

      - name: upload the statement AND the raw report (evidence, clean or not)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rescan-${{ matrix.target.release }}-${{ matrix.target.variant }}-${{ matrix.target.scanner }}
          path: /tmp/rescan-out/
          retention-days: 90

      - name: file/update a tracking issue on findings
        if: steps.statement.outputs.outcome == 'findings'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const t = ${{ toJSON(matrix.target) }};
            const short = t.digest.replace('sha256:', '').slice(0, 12);
            const title = `Daily rescan: findings in ${t.release} ${t.variant} @${short} (${t.scanner})`;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `The daily rescan found new findings.\n\n- release: \`${t.release}\`\n- variant: \`${t.variant}\`\n- digest: \`${t.digest}\`\n- scanner: \`${t.scanner}\`\n- statement artifact: \`rescan-${t.release}-${t.variant}-${t.scanner}\` on ${runUrl}\n\nThese bytes have not changed since release — this is a newly-disclosed CVE against previously-shipped code, the case the 24-48h response SLA targets. Per policy: if an upstream fix exists, ship the version bump; if not, publish a VEX statement and mitigation.`;
            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo, state: 'open', labels: 'daily-rescan',
            });
            const match = existing.find(i => i.title === title);
            if (match) {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: match.number, body });
            } else {
              await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title, body, labels: ['daily-rescan', 'security'] });
            }

      - name: a findings verdict fails the run (visible red, same bar as the gate)
        if: steps.statement.outputs.outcome == 'findings'
        run: |
          echo "::error::rescan found findings for ${{ matrix.target.release }} ${{ matrix.target.variant }} (${{ matrix.target.scanner }}) — see the tracking issue" >&2
          exit 1
