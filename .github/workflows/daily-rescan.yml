name: Daily image rescan

# Release-chain daily rescan (release-chain-design.md §3): reads
# release-manifest.json from every published release that carries one
# and scans the DIGESTS it names — never tags, which can move — with
# every scanner in .github/policy/scanners.json at the same
# block-at-any-severity policy as the release gate, VEX the only
# exception. New CVEs get disclosed against unchanged bytes constantly;
# this is what feeds the 24-48h response SLA.
#
# Output is deliberately shaped as the seed of the VEX adjudication
# pipeline (ops_dossier_vex_service.md §9): one digest-keyed statement
# per (release, variant, scanner), carrying the scanner's identity and
# database state, the normalized findings, and the VEX evidence that was
# applied — uploaded as an artifact every run, clean or not. No product
# features; just don't preclude them.
#
# v0.1.0 predates release manifests and stays covered by the
# rescan-v010.yml stopgap until it is superseded.

on:
  schedule:
    - cron: '11 7 * * *' # offset from the hour to avoid GH's on-the-hour pile-up
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  manifests:
    name: enumerate release manifests
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.collect.outputs.targets }}
      any: ${{ steps.collect.outputs.any }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: collect (release, variant, digest, scanner) targets
        id: collect
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          scanners=$(jq -c '.scanners' .github/policy/scanners.json)
          : > /tmp/targets.jsonl

          # F12: legacy releases that predate release-manifest.json are
          # covered from a committed inventory, so the daily rescan never
          # silently stops covering the current public release.
          jq -c --argjson scanners "$scanners" \
            '.releases[] as $r | $r.images[] as $img | $scanners[] as $s |
             {release: $r.version, variant: $img.variant, digest: $img.digest, scanner: $s, source: "legacy-inventory"}' \
            .github/policy/legacy-releases.json >> /tmp/targets.jsonl
          legacy_versions=$(jq -r '[.releases[].version] | join(" ")' .github/policy/legacy-releases.json)

          # Manifest-bearing releases: enumerate ASSETS first, so we can
          # tell an intentional legacy absence (no manifest asset) from a
          # FAILED read of a manifest that is present (F13).
          #
          # R12: capture the release list with an EXPLICIT exit check. A
          # `for tag in $(gh release list ...)` swallows the command
          # substitution's failure (set -e does not catch it there), so an
          # API outage would drop every manifest-bearing release while the
          # legacy inventory kept the job green. Fail loudly instead; an
          # empty-but-successful list (no releases yet) is fine.
          if ! gh release list --limit 100 --json tagName,isDraft > /tmp/releases.json; then
            echo "::error::could not enumerate releases (gh release list failed) - refusing to rescan a partial inventory" >&2
            exit 1
          fi
          jq -e 'type == "array"' /tmp/releases.json >/dev/null \
            || { echo "::error::gh release list did not return a JSON array" >&2; exit 1; }
          for tag in $(jq -r '.[] | select(.isDraft | not) | .tagName' /tmp/releases.json); do
            case " $legacy_versions " in *" $tag "*) continue ;; esac
            has_manifest=$(gh release view "$tag" --json assets \
              --jq '[.assets[] | select(.name == "release-manifest.json")] | length')
            if [ "$has_manifest" -eq 0 ]; then
              echo "note: ${tag} has no release-manifest.json asset and is not in the legacy inventory — skipping (add it to legacy-releases.json if it must be scanned)"
              continue
            fi
            # The asset exists: a failed download/parse is an ERROR, not
            # an empty result that would erase the release from coverage.
            if ! gh release download "$tag" -p release-manifest.json -O "/tmp/m-${tag}.json"; then
              echo "::error::release-manifest.json is present on ${tag} but could not be downloaded — refusing to drop it from the rescan" >&2
              exit 1
            fi
            jq empty "/tmp/m-${tag}.json" 2>/dev/null \
              || { echo "::error::release-manifest.json on ${tag} is not valid JSON" >&2; exit 1; }
            imgcount=$(jq '.images | length' "/tmp/m-${tag}.json")
            [ "$imgcount" -ge 1 ] || { echo "::error::release-manifest.json on ${tag} lists no images" >&2; exit 1; }
            jq -c --arg tag "$tag" --argjson scanners "$scanners" \
              '.images[] as $img | $scanners[] as $s |
               {release: $tag, variant: $img.variant, digest: $img.digest, scanner: $s, source: "release-manifest"}' \
              "/tmp/m-${tag}.json" >> /tmp/targets.jsonl
          done

          targets=$(jq -s -c '.' /tmp/targets.jsonl)
          echo "targets=${targets}" >> "$GITHUB_OUTPUT"
          n=$(jq 'length' <<<"$targets")
          # There is ALWAYS at least the legacy inventory, so an empty set
          # means the inventory itself is broken - fail, do not no-op.
          if [ "$n" -eq 0 ]; then
            echo "::error::no rescan targets at all - the legacy inventory is empty or unreadable" >&2
            exit 1
          fi
          echo "any=true" >> "$GITHUB_OUTPUT"
          echo "rescanning ${n} (release, variant, scanner) targets"

  rescan:
    name: ${{ matrix.target.scanner }} ${{ matrix.target.release }} ${{ matrix.target.variant }}
    needs: manifests
    if: needs.manifests.outputs.any == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      packages: read
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.manifests.outputs.targets) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Enumerate the platform CHILDREN of the index so both
      # architectures are scanned, not just the runner's default
      # (completion note: the ongoing rescan must cover each child, like
      # the release scanner). platforms.txt: one "os/arch<TAB>childref"
      # per line, always including the index itself as a fallback.
      - name: enumerate platform children
        if: matrix.target.scanner == 'trivy' || matrix.target.scanner == 'grype'
        run: |
          set -euo pipefail
          echo '${{ github.token }}' | docker login ghcr.io -u '${{ github.actor }}' --password-stdin || true
          ref="ghcr.io/${{ github.repository_owner }}/cache@${{ matrix.target.digest }}"
          : > /tmp/children.txt
          # A FAILED or MALFORMED enumeration must REJECT the run (B04): a
          # lost platform inventory must never be silently downgraded to a
          # single-arch index scan. Only a VALID manifest that genuinely has
          # no platform children falls back to "scan the index as itself".
          if ! docker buildx imagetools inspect --raw "$ref" > /tmp/index.json 2>/tmp/inspect.err; then
            echo "::error::could not inspect ${ref} to enumerate platform children — refusing to rescan on an unknown platform inventory" >&2
            cat /tmp/inspect.err >&2 || true
            exit 1
          fi
          if ! jq -e . /tmp/index.json >/dev/null 2>&1; then
            echo "::error::imagetools inspect for ${ref} did not return valid JSON — refusing to guess the platform inventory" >&2
            exit 1
          fi
          if jq -e '.manifests' /tmp/index.json >/dev/null 2>&1; then
            # A multi-platform index: enumerate the real OS/arch children.
            jq -r --arg repo "ghcr.io/${{ github.repository_owner }}/cache" \
              '.manifests[] | select(.platform.os != "unknown")
               | "\(.platform.os)/\(.platform.architecture)\t\($repo)@\(.digest)"' \
              /tmp/index.json >> /tmp/children.txt
            if [ ! -s /tmp/children.txt ]; then
              echo "::error::index ${ref} lists no usable platform children (all 'unknown') — refusing to rescan an empty inventory" >&2
              exit 1
            fi
          else
            # A valid single-arch image manifest (no child list): scan as itself.
            printf 'index\t%s\n' "$ref" >> /tmp/children.txt
          fi
          echo "children to scan:"; cat /tmp/children.txt

      # ---- trivy (CLI: reliable version/db, by digest) -------------------
      - name: Trivy rescan (by digest, JSON findings)
        if: matrix.target.scanner == 'trivy'
        id: trivy
        continue-on-error: true
        env:
          TRIVY_VEX: ${{ github.workspace }}/.vex/fosterstack-cache.openvex.json
        run: |
          set -euo pipefail
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin v0.66.0
          : > /tmp/scanned-platforms.txt
          rc=0
          op_fail=0
          child_no=0
          reports=()
          # B04: a FINDING makes trivy exit nonzero (--exit-code 1). Capture
          # that with `|| code=$?` so errexit does NOT abort the loop before
          # the code is read, the platform is recorded, the next child is
          # scanned, or the reports are merged. Every child is scanned.
          while IFS=$'\t' read -r platform ref; do
            [ -n "$platform" ] || continue
            child_no=$((child_no + 1))
            out="/tmp/findings-child-${child_no}.json"
            echo "trivy: ${platform} ${ref}"
            code=0
            trivy image --quiet --exit-code 1 \
              --severity CRITICAL,HIGH,MEDIUM,LOW,UNKNOWN \
              --vex "${TRIVY_VEX}" \
              --format json --output "$out" \
              "${ref}" || code=$?
            [ "$code" -gt "$rc" ] && rc=$code
            echo "${platform}" >> /tmp/scanned-platforms.txt
            # A FINDING still yields a valid report (with vulnerabilities); an
            # OPERATIONAL failure yields no valid report for this child.
            if [ -s "$out" ] && jq empty "$out" 2>/dev/null; then
              reports+=("$out")
            else
              echo "::warning::trivy produced no valid report for ${platform}" >&2
              op_fail=1
            fi
          done < /tmp/children.txt
          echo "$rc" > /tmp/scanner-rc
          echo "$op_fail" > /tmp/scanner-op-fail
          # Merge ONLY the explicit per-child input files (never a glob that
          # could slurp the aggregate output), so a finding in any child is
          # present when the statement is written.
          if [ "${#reports[@]}" -gt 0 ]; then
            jq -s '{Results: (map(.Results // []) | add)}' "${reports[@]}" > /tmp/findings-raw.json
          else
            echo '{"Results":[]}' > /tmp/findings-raw.json
          fi
          exit $rc

      # ---- grype (CLI: reliable version/db, by digest) -------------------
      - name: Grype rescan (by digest, JSON findings)
        if: matrix.target.scanner == 'grype'
        id: grype
        continue-on-error: true
        run: |
          set -euo pipefail
          curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b /usr/local/bin v0.98.0
          : > /tmp/scanned-platforms.txt
          rc=0
          op_fail=0
          child_no=0
          reports=()
          # B04: `--fail-on negligible` makes grype exit nonzero on a FINDING.
          # Capture it with `|| code=$?` so errexit does not abort the loop —
          # a grype finding is aggregated and classified as a finding, not
          # dropped and misreported as an operational error.
          while IFS=$'\t' read -r platform ref; do
            [ -n "$platform" ] || continue
            child_no=$((child_no + 1))
            out="/tmp/grype-child-${child_no}.json"
            echo "grype: ${platform} ${ref}"
            plat_arg=""
            case "$platform" in */*) plat_arg="--platform ${platform}";; esac
            code=0
            # shellcheck disable=SC2086
            grype "registry:${ref}" $plat_arg \
              --fail-on negligible \
              --vex .vex/fosterstack-cache.openvex.json \
              -o json --file "$out" || code=$?
            [ "$code" -gt "$rc" ] && rc=$code
            echo "${platform}" >> /tmp/scanned-platforms.txt
            if [ -s "$out" ] && jq empty "$out" 2>/dev/null; then
              reports+=("$out")
            else
              echo "::warning::grype produced no valid report for ${platform}" >&2
              op_fail=1
            fi
          done < /tmp/children.txt
          echo "$rc" > /tmp/scanner-rc
          echo "$op_fail" > /tmp/scanner-op-fail
          # Merge ONLY the explicit per-child input files.
          if [ "${#reports[@]}" -gt 0 ]; then
            jq -s '{matches: (map(.matches // []) | add)}' "${reports[@]}" > /tmp/findings-raw.json
          else
            echo '{"matches":[]}' > /tmp/findings-raw.json
          fi
          exit $rc

      # ---- snyk ----------------------------------------------------------
      - name: install the Snyk CLI (pinned)
        if: matrix.target.scanner == 'snyk'
        uses: snyk/actions/setup@9adf32b1121593767fc3c057af55b55db032dc04 # v1.0.0
        with:
          snyk-version: v1.1307.0
      - name: Snyk rescan (by digest, JSON findings)
        if: matrix.target.scanner == 'snyk'
        id: snyk
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          set -uo pipefail
          [ -n "${SNYK_TOKEN:-}" ] || { echo "::error::SNYK_TOKEN unavailable — a rescan that silently skips a scanner is not a rescan" >&2; exit 1; }
          snyk container test \
            "ghcr.io/${{ github.repository_owner }}/cache@${{ matrix.target.digest }}" \
            --org=fosterstack-admin --json-file-output=/tmp/findings-raw.json; echo "$?" > /tmp/scanner-rc
          # B04: Snyk container test only covers the multi-arch index's
          # selected architecture; it does NOT independently scan the
          # per-platform children. Rather than silently scan one arch and
          # claim the whole digest, record that scope limitation EXPLICITLY
          # in the statement. Per-child platform coverage is provided by
          # Trivy and Grype in the same (release, variant, scanner) matrix.
          printf 'index (snyk scans the index arch)\n' > /tmp/scanned-platforms.txt
          cat > /tmp/scan-scope.json <<'JSON'
          {"scanner": "snyk", "coverage": "index-selected-arch-only", "note": "Snyk container test scans the multi-arch index's selected architecture only; the per-platform children are NOT independently scanned by this scanner. Per-child coverage for this digest is provided by the trivy and grype targets in the same rescan matrix."}
          JSON

      # ---- scanner identity (F14) ----------------------------------------
      - name: record scanner version and database state
        run: |
          set -euo pipefail
          : > /tmp/scanner-meta
          case '${{ matrix.target.scanner }}' in
            trivy)
              echo "version=$(trivy --version 2>/dev/null | awk 'NR==1{print $2}')" >> /tmp/scanner-meta
              echo "db=$(trivy version --format json 2>/dev/null | jq -r '.VulnerabilityDB.UpdatedAt // "unknown"')" >> /tmp/scanner-meta ;;
            grype)
              echo "version=$(grype version 2>/dev/null | awk '/^Version:/{print $2}')" >> /tmp/scanner-meta
              echo "db=$(grype db status 2>/dev/null | awk '/Built|built/{print $NF; exit}')" >> /tmp/scanner-meta ;;
            snyk)
              echo "version=$(snyk version 2>/dev/null | head -1)" >> /tmp/scanner-meta
              echo "db=service-side (Snyk SaaS; no local database timestamp)" >> /tmp/scanner-meta ;;
          esac
          cat /tmp/scanner-meta

      # ---- statement -----------------------------------------------------
      - name: write the digest-keyed rescan statement
        id: statement
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json, sys, hashlib, datetime, os
          scanner = '${{ matrix.target.scanner }}'
          try:
              rc = int(open('/tmp/scanner-rc').read().strip() or '0')
          except (FileNotFoundError, ValueError):
              rc = 1
          # B04: a per-child OPERATIONAL failure (a scanned child that
          # produced no valid report) is recorded by the scanner loop. It is
          # authoritative: incomplete platform coverage is never a clean or
          # findings verdict, it is an error, even if the merged report parses.
          try:
              op_fail = open('/tmp/scanner-op-fail').read().strip() == '1'
          except FileNotFoundError:
              op_fail = False
          meta = {}
          try:
              for line in open('/tmp/scanner-meta'):
                  if '=' in line:
                      k, v = line.rstrip('\n').split('=', 1)
                      meta[k] = v
          except FileNotFoundError:
              pass
          findings = []
          report_ok = True
          try:
              raw = json.load(open('/tmp/findings-raw.json'))
              if scanner == 'trivy':
                  for res in raw.get('Results') or []:
                      for v in res.get('Vulnerabilities') or []:
                          findings.append({'id': v.get('VulnerabilityID'),
                                           'severity': (v.get('Severity') or '').lower(),
                                           'package': v.get('PkgName'),
                                           'fixed_in': v.get('FixedVersion') or None})
              elif scanner == 'grype':
                  for m in raw.get('matches') or []:
                      findings.append({'id': m['vulnerability'].get('id'),
                                       'severity': (m['vulnerability'].get('severity') or '').lower(),
                                       'package': m.get('artifact', {}).get('name'),
                                       'fixed_in': (m['vulnerability'].get('fix') or {}).get('versions') or None})
              elif scanner == 'snyk':
                  for v in raw.get('vulnerabilities') or []:
                      findings.append({'id': v.get('identifiers', {}).get('CVE', [v.get('id')])[0] if v.get('identifiers', {}).get('CVE') else v.get('id'),
                                       'severity': (v.get('severity') or '').lower(),
                                       'package': v.get('packageName'),
                                       'fixed_in': v.get('nearestFixedInVersion') or None})
          except (FileNotFoundError, json.JSONDecodeError):
              report_ok = False
          # Distinguish a COMPLETED scan (clean or with findings) from an
          # operational FAILURE (tool crashed / produced no valid report):
          # never label an operational failure as clean CVE evidence
          # (completion note). findings count is authoritative for
          # clean-vs-findings; a nonzero rc with no parsed findings is an
          # error, and an unparseable report is an error.
          if not report_ok or op_fail:
              outcome = 'error'
          elif len(findings) > 0:
              outcome = 'findings'
          elif rc != 0:
              outcome = 'error'
          else:
              outcome = 'clean'
          try:
              scanned_platforms = [p for p in open('/tmp/scanned-platforms.txt').read().splitlines() if p]
          except FileNotFoundError:
              scanned_platforms = []
          # B04: an explicit per-scanner coverage-scope limitation (e.g. Snyk
          # only scans the index's selected arch) is recorded so the digest
          # claim is never overstated. Absent for full-per-child scanners.
          scope_limitation = None
          try:
              scope_limitation = json.load(open('/tmp/scan-scope.json'))
          except (FileNotFoundError, json.JSONDecodeError):
              scope_limitation = None
          vex_doc = '.vex/fosterstack-cache.openvex.json'
          vex = json.load(open(vex_doc))
          statement = {
              'schema': 'https://fosterstack.com/rescan-statement/v1',
              'scanned_at': datetime.datetime.now(datetime.timezone.utc).isoformat(timespec='seconds'),
              'release': '${{ matrix.target.release }}',
              'variant': '${{ matrix.target.variant }}',
              'digest': '${{ matrix.target.digest }}',
              'image_ref': 'ghcr.io/${{ github.repository_owner }}/cache@${{ matrix.target.digest }}',
              'scanner': scanner,
              'scanner_version': meta.get('version', 'unknown'),
              'scanner_database': meta.get('db', 'unknown'),
              'scanned_platforms': scanned_platforms,
              'coverage_scope_limitation': scope_limitation,
              'policy': 'block at any severity; the published VEX document is the only exception',
              'verdict': outcome,
              'findings': findings,
              'raw_report': {
                  'path': 'findings-raw.json',
                  'sha256': (hashlib.sha256(open('/tmp/findings-raw.json','rb').read()).hexdigest()
                             if os.path.exists('/tmp/findings-raw.json') else None),
              },
              'vex': {
                  'document': vex_doc,
                  'sha256': hashlib.sha256(open(vex_doc, 'rb').read()).hexdigest(),
                  'applicable_statements': [
                      st for st in vex.get('statements', [])
                      if any(str(p.get('@id','')).endswith('${{ matrix.target.digest }}'.split(':')[-1])
                             or '${{ matrix.target.digest }}' in json.dumps(p)
                             for p in (st.get('products') or []))
                  ],
                  'document_statement_count': len(vex.get('statements', [])),
              },
          }
          json.dump(statement, open('/tmp/rescan-statement.json', 'w'), indent=1)
          print(json.dumps({'verdict': outcome, 'count': len(findings), 'platforms': scanned_platforms}))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as gh:
              gh.write(f'outcome={outcome}\n')
          PY

      - name: stage the raw report beside the statement
        run: |
          set -euo pipefail
          mkdir -p /tmp/rescan-out
          cp /tmp/rescan-statement.json /tmp/rescan-out/
          [ -f /tmp/findings-raw.json ] && cp /tmp/findings-raw.json /tmp/rescan-out/ || true

      - name: upload the statement AND the raw report (evidence, clean or not)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rescan-${{ matrix.target.release }}-${{ matrix.target.variant }}-${{ matrix.target.scanner }}
          path: /tmp/rescan-out/
          retention-days: 90

      - name: file/update a tracking issue on findings
        if: steps.statement.outputs.outcome == 'findings'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const t = ${{ toJSON(matrix.target) }};
            const short = t.digest.replace('sha256:', '').slice(0, 12);
            const title = `Daily rescan: findings in ${t.release} ${t.variant} @${short} (${t.scanner})`;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `The daily rescan found new findings.\n\n- release: \`${t.release}\`\n- variant: \`${t.variant}\`\n- digest: \`${t.digest}\`\n- scanner: \`${t.scanner}\`\n- statement artifact: \`rescan-${t.release}-${t.variant}-${t.scanner}\` on ${runUrl}\n\nThese bytes have not changed since release — this is a newly-disclosed CVE against previously-shipped code, the case the 24-48h response SLA targets. Per policy: if an upstream fix exists, ship the version bump; if not, publish a VEX statement and mitigation.`;
            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo, state: 'open', labels: 'daily-rescan',
            });
            const match = existing.find(i => i.title === title);
            if (match) {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: match.number, body });
            } else {
              await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title, body, labels: ['daily-rescan', 'security'] });
            }

      - name: a findings verdict fails the run (visible red, same bar as the gate)
        if: steps.statement.outputs.outcome == 'findings'
        run: |
          echo "::error::rescan found findings for ${{ matrix.target.release }} ${{ matrix.target.variant }} (${{ matrix.target.scanner }}) — see the tracking issue" >&2
          exit 1

      # An operational failure is NOT clean CVE evidence: fail the run with
      # a distinct signal so a scanner that could not run is never recorded
      # as a passing rescan (completion note).
      - name: an operational error fails the run distinctly
        if: steps.statement.outputs.outcome == 'error'
        run: |
          echo "::error::rescan scanner ${{ matrix.target.scanner }} failed to complete for ${{ matrix.target.release }} ${{ matrix.target.variant }} — this is an operational failure, not a clean result" >&2
          exit 1
