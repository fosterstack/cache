name: Dependabot auto-merge

# Brief §0.2(a) autonomous lane, mechanised: dependency bumps to
# upstream-published versions ship after the full CI gate and do not wait on
# the owner. This file arms patch and minor. A major is an API-break risk, so
# it gets a READER instead of a human: the hourly dependabot-reviewer.yml
# (register row 75) judges it against upstream release notes and our usage.
# So does a patch/minor whose release notes say "breaking" or "deprecat"
# (REQ-DEP-003-AC2, advisor tighten-only reading, Oct 22): the `screen` step applies the
# reviewer's own rule, so a flagged bump is treated here as a major.
#
# Two deliberate safety properties:
#
#  1. `pull_request`, NOT `pull_request_target`. The baseline
#     (ops/docs/cicd-security-baseline.md) treats adding pull_request_target
#     as weakening the supply-chain gate, because it runs with a writable
#     token in the context of the BASE repo while checking out PR-authored
#     code. This workflow also never checks out the PR at all — it only ever
#     touches the GitHub API — so no third-party code executes here, with or
#     without a token.
#
#  2. It refuses to run unless `main` actually has required status checks.
#     "Auto-merge is gated on all checks green" is only true if the branch
#     ruleset says which checks are required; with none configured,
#     `--auto` merges the moment the PR is mergeable, which is immediately.
#     The guard below fails closed rather than let that happen silently.

on: pull_request

permissions:
  contents: read

jobs:
  auto-merge:
    name: dependabot auto-merge
    # Identity comes from the PR author, not github.actor: actor is whoever
    # triggered THIS run, and a re-run or a synchronize can carry a
    # different actor than the bot that opened the PR.
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write        # enable auto-merge on the PR
      pull-requests: write   # approve the PR
      checks: read           # a major's verdict: the reviewer's check on THIS head
    steps:
      - name: dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # The same rule as bin/dependabot-reviewer.py `is_flagged` (the reviewer's candidate step), as a
      # heredoc because this workflow checks out nothing and fetches no script; bin/dependency-lanes-test.sh
      # runs this very code against the reviewer's on a corpus, so the two lanes cannot disagree about
      # who arms what. The PR body arrives by env, never interpolated into the script. No
      # `continue-on-error`: if the screen cannot run, nothing below arms.
      - name: screen — do the release notes say breaking or deprecated (REQ-DEP-003-AC2)
        id: screen
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          python3 -I - >> "$GITHUB_OUTPUT" <<'PY'
          import html, os, re
          from html.parser import HTMLParser
          _FLAG = re.compile(r"breaking|deprecat", re.I)
          _MDADJ = re.compile(r"[A-Za-z0-9]\[|\][A-Za-z0-9]|\]\([^\n]*\)[A-Za-z0-9]|\]\[[^\]\n]*\][A-Za-z0-9]")
          _MDEXOTIC = re.compile(r"\\[\[\]]|\]\(\s*<|&(?:#0*(?:91|93)|#x0*(?:5b|5d)|lbrack|rbrack|lsqb|rsqb);", re.I)
          _MDLINK = re.compile(r"\]\(|\]\[|\]:")
          _CHARREF = re.compile(r"&(?:#|[A-Za-z][A-Za-z0-9]*;)")
          _MDLABEL = re.compile(r"\]\[[^\]]*\]")
          _MDDEF = re.compile(r"(?m)^ {0,3}\[[^\]\n]+\]:.*$")
          class _Text(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.parts = []

              def handle_data(self, data):
                  self.parts.append(data)
          def _drop_targets(v, quotes):
              # Markdown inline link/image targets `](...)`, parentheses balanced, over lines; quotes=True also honours a quoted title that holds a ')'.
              # An unterminated target is unresolvable: None.
              out, i, n = [], 0, len(v)
              while i < n:
                  if v.startswith("](", i):
                      j, depth, inq = i + 2, 1, None
                      while j < n and depth > 0:
                          c = v[j]
                          if c == "\\":
                              j += 2
                              continue
                          if quotes and inq is None and c in "\"'" and v[j - 1] in " \t\n":
                              inq = c
                          elif quotes and inq == c:
                              inq = None
                          elif inq is None:
                              depth += 1 if c == "(" else -1 if c == ")" else 0
                          j += 1
                      if depth > 0:
                          return None
                      i = j
                      continue
                  out.append(v[i])
                  i += 1
              return "".join(out)
          def is_flagged(body):
              """True when a Dependabot PR body says "breaking" or "deprecat" (any case) as a reader would see it. The release notes and commit
              list between old and new are the body's <details> blocks, but markup makes block boundaries unreliable, so the WHOLE body is read and any
              hit counts: over-flagging only sends a bump to the two readers, never toward auto-merge (tighten-only). Views, any one of which counts:
              the raw body; with character references decoded; the HTML-rendered text (tags and comments dropped, nothing put in their place); and for
              each of those the letters and digits only, also with Markdown link targets (balanced parentheses, with and without a quoted title),
              reference labels and reference definitions removed first, so formatting, links and references between a word's pieces vanish. A body
              the parser cannot read, an unterminated link target, a word character touching link syntax, an escaped or encoded bracket, an <angle> destination,
              any character reference in a body that has link syntax, or link syntax left over after every reduction is flagged (fail toward the readers: the class is closed, not enumerated).
              A non-major so flagged is judged like a major (REQ-DEP-001-AC10)."""
              raw = str(body or "")
              try:
                  p = _Text()
                  p.feed(raw)
                  p.close()
                  views = (raw, html.unescape(raw), "".join(p.parts))
                  if _MDADJ.search(raw) or _MDEXOTIC.search(raw):   # link syntax this check does not resolve: an escaped bracket, an <angle> destination, an encoded bracket
                      return True
                  if _MDLINK.search(raw) and _CHARREF.search(raw):   # a character reference (numeric in any spelling, or named with ';'; a URL's &key=value is not one) in a body that has
                      return True                                    # link syntax can spell a bracket or parenthesis of the destination: not resolved here, the readers decide
                  more = []
                  for v in views:
                      more.append(v)
                      for q in (False, True):
                          t = _drop_targets(v, q)
                          if t is None:
                              return True
                          t = _MDDEF.sub("", _MDLABEL.sub("", t))
                          if "](" in t or "][" in t:   # link syntax that survives every reduction is unresolved
                              return True
                          more.append(t)
                  views += tuple(re.sub(r"[^A-Za-z0-9]", "", v) for v in more)
                  return any(_FLAG.search(v) for v in views + tuple(more))
              except Exception:
                  return True
          print("flagged=" + str(is_flagged(os.environ["PR_BODY"])).lower())
          PY

      - name: majors are the hourly reviewer's, not a human's (register row 75)
        if: steps.meta.outputs.update-type == 'version-update:semver-major' || steps.screen.outputs.flagged == 'true'
        run: |
          {
            echo "### Major bump — judged by the Dependabot reviewer"
            echo
            echo "\`${{ steps.meta.outputs.dependency-names }}\` is a **major** version bump"
            echo "(\`${{ steps.meta.outputs.previous-version }}\` → \`${{ steps.meta.outputs.new-version }}\`)."
            echo "Majors are read against upstream release notes and our usage by the hourly"
            echo "\`dependabot-reviewer\` workflow (it cannot run here: a Dependabot-triggered run holds"
            echo "no repository secrets). It arms auto-merge when nothing breaks a line of ours, or"
            echo "holds with an issue. Nothing waits on a person."
          } >> "$GITHUB_STEP_SUMMARY"

      # Owner, Oct 1: a merge verdict holds only for the head the reviewer read. A push to a major PR
      # (a Dependabot rebase or a new version) voids it: unless the reviewer has already approved THIS
      # head (its success check is on it — the reviewer may have got there first), auto-merge comes off
      # here at once and the hourly reviewer judges the new head afresh. Fails loudly if it cannot.
      # Also when the screen itself failed: its answer is unknown, so an arm without a verdict on the current head
      # still comes off (arming stays off: the arm step needs the screen to have succeeded).
      - name: a new head voids the reviewer's verdict on a major — turn auto-merge off
        if: ${{ !cancelled() && (steps.meta.outputs.update-type == 'version-update:semver-major' || steps.screen.outputs.flagged == 'true' || steps.screen.outcome == 'failure') }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # judge the PR's CURRENT head, never this event's: a stale job (an older push) must not disarm a
          # newer head the reviewer has already approved
          head=$(gh pr view "$PR_URL" --json headRefOid --jq .headRefOid)
          [ "$head" = "$HEAD_SHA" ] || echo "this run's head ${HEAD_SHA:0:7} is stale; judging the current head ${head:0:7}"
          lookup() { gh api "repos/${GITHUB_REPOSITORY}/commits/${head}/check-runs?check_name=dependabot-reviewer" \
                       --jq '[.check_runs[] | select(.app.slug == "fosterstack-automation")] | sort_by(.id) | last | .conclusion // "none"'; }
          verdict=$(lookup)
          armed=$(gh pr view "$PR_URL" --json autoMergeRequest --jq '.autoMergeRequest != null')
          if [ "$verdict" = success ]; then echo "the reviewer approved the current head (${head:0:7}); auto-merge stands"
          elif [ "$armed" = true ]; then
            gh pr merge --disable-auto "$PR_URL"; echo "auto-merge turned off: the new head is reviewed afresh"
          else echo "auto-merge is not armed; nothing to void"; fi

      - name: require that main enforces the exact expected check set
        if: steps.meta.outputs.update-type != 'version-update:semver-major' && steps.screen.outputs.flagged != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # The Sep 8 audit (§13) found the old guard checked only that AT
          # LEAST ONE required check existed. The guard compares the EFFECTIVE
          # required-check set on main — contexts and integration IDs both —
          # against .github/policy/required-checks.json and refuses on any
          # difference in either direction (bin/required-check-guard.sh; the
          # same script runs on every PR in ci.yml, register row 75).
          #
          # The script AND the list are fetched from protected MAIN via the
          # API, never from a checkout: this workflow deliberately checks out
          # nothing (see the header), and the PR's own copies are exactly what
          # an attacker editing them would control. Same trust-source rule as
          # the release chain's allowed-signers fetch.
          for f in bin/required-check-guard.sh .github/policy/required-checks.json; do
            gh api "repos/${GITHUB_REPOSITORY}/contents/${f}?ref=main" --jq '.content' | base64 -d \
              > "${RUNNER_TEMP}/$(basename "$f")"
          done
          bash "${RUNNER_TEMP}/required-check-guard.sh" "${RUNNER_TEMP}/required-checks.json"

      # The approval is an AUDIT TRAIL, not a gate. main's ruleset requires
      # signed commits and seven status checks; it does not require pull
      # request reviews, so nothing here depends on this succeeding.
      #
      # It fails by default with "GitHub Actions is not permitted to approve
      # pull requests", and we are deliberately LEAVING IT THAT WAY. The
      # setting that would fix it — Actions: allow creating and approving
      # pull requests — lets any workflow in the repo self-approve, which
      # is a supply-chain weakening that OpenSSF Scorecard flags and that
      # our own CI/CD baseline argues against. Trading that away to get a
      # cosmetic review on a bot PR is a bad deal.
      #
      # continue-on-error, not removal: if a required-review rule is ever
      # added to main, this step starts mattering again and its failure
      # will be visible in the run rather than silently absent.
      - name: approve (best effort — see note above)
        if: steps.meta.outputs.update-type != 'version-update:semver-major' && steps.screen.outputs.flagged != 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: >-
          gh pr review --approve "$PR_URL"
          --body "Autonomous lane (brief 0.2a): patch/minor dependency bump to
          an upstream-published version. Merging once every required check is green."

      - name: enable auto-merge
        if: steps.meta.outputs.update-type != 'version-update:semver-major' && steps.screen.outputs.flagged != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        # Bound to the head this run screened: an older run (an older body) cannot arm a newer head. The hold below reads the PR's files at that same head.
        run: |
          set -euo pipefail
          # held out of auto-merge and handled as a normal lane PR (a lane reviews it with both Codex seats and merges it): the pinned tool module (go.mod and go.sum under
          # tools/govulncheck/), whose version is also written by hand in ci.yml, which Dependabot cannot change; and any PR whose file list is at the API's cap of 100 (it
          # may be cut, so it cannot be judged). The hourly reviewer turns off an arm made earlier.
          # one read gives the file list and the head they belong to; the arm below is bound to the head this run screened (HEAD_SHA), so a push between the screen and the arm is not armed
          snap=$(gh pr view "$PR_URL" --json files,headRefOid)
          head=$(printf '%s' "$snap" | jq -r '.headRefOid')
          held=$(printf '%s' "$snap" | jq '[.files[].path | select(startswith("tools/govulncheck/"))] | length')
          total=$(printf '%s' "$snap" | jq '.files | length')
          [[ "$head" =~ ^[0-9a-f]{40}$ ]] || { echo "could not read the PR's head" >&2; exit 1; }
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "could not read the head this run screened" >&2; exit 1; }
          if [ "$head" != "$HEAD_SHA" ]; then
            echo "### Not armed: the PR has a newer head than the one this run screened" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "$held" != 0 ] || [ "$total" -ge 100 ]; then
            echo "### Held out of auto-merge" >> "$GITHUB_STEP_SUMMARY"
            echo "This PR touches tools/govulncheck/ (the pinned tool's version is also written in ci.yml) or lists 100 or more files (too many to judge): it is not armed here and is handled as a normal lane PR." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          gh pr merge --auto --squash --match-head-commit "$HEAD_SHA" "$PR_URL"
