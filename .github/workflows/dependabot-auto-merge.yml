name: Dependabot auto-merge

# Brief §0.2(a) autonomous lane, mechanised: dependency bumps to
# upstream-published versions ship after the full CI gate and do not wait on
# the owner. Patch and minor only — a major bump is an API-break risk that
# gets a human, which is the §0.2(b) instinct applied to our own deps.
#
# Two deliberate safety properties:
#
#  1. `pull_request`, NOT `pull_request_target`. The baseline
#     (ops/docs/cicd-security-baseline.md) treats adding pull_request_target
#     as weakening the supply-chain gate, because it runs with a writable
#     token in the context of the BASE repo while checking out PR-authored
#     code. This workflow also never checks out the PR at all — it only ever
#     touches the GitHub API — so no third-party code executes here, with or
#     without a token.
#
#  2. It refuses to run unless `main` actually has required status checks.
#     "Auto-merge is gated on all checks green" is only true if the branch
#     ruleset says which checks are required; with none configured,
#     `--auto` merges the moment the PR is mergeable, which is immediately.
#     The guard below fails closed rather than let that happen silently.

on: pull_request

permissions:
  contents: read

jobs:
  auto-merge:
    name: dependabot auto-merge
    # Identity comes from the PR author, not github.actor: actor is whoever
    # triggered THIS run, and a re-run or a synchronize can carry a
    # different actor than the bot that opened the PR.
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write        # enable auto-merge on the PR
      pull-requests: write   # approve the PR
    steps:
      - name: dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: hold majors for owner review
        if: steps.meta.outputs.update-type == 'version-update:semver-major'
        run: |
          {
            echo "### Held for owner review"
            echo
            echo "\`${{ steps.meta.outputs.dependency-names }}\` is a **major** version bump"
            echo "(\`${{ steps.meta.outputs.previous-version }}\` → \`${{ steps.meta.outputs.new-version }}\`)."
            echo "The autonomous lane covers patch and minor only; this one waits for a human."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: require that main enforces the exact expected check set
        if: steps.meta.outputs.update-type != 'version-update:semver-major'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # The Sep 8 audit (§13) found the old guard checked only that AT
          # LEAST ONE required check existed: six of seven checks could be
          # removed from the ruleset and auto-merge would still arm. The
          # guard now compares the EFFECTIVE required-check set on main —
          # contexts and integration IDs both — against the single source
          # of truth in .github/policy/required-checks.json, and refuses to
          # auto-merge on any difference in either direction. A missing
          # check means the gate was weakened; an unexpected extra check
          # means the list is stale; both are a human's problem, not a
          # robot's judgment call.
          #
          # The /rules/branches/main endpoint reports effective rules
          # aggregated across every ruleset, so this stays correct if
          # rules are ever split across rulesets again.
          actual=$(gh api "repos/${GITHUB_REPOSITORY}/rules/branches/main" \
                     --jq '[.[] | select(.type=="required_status_checks")
                                | .parameters.required_status_checks[]
                                | {context, integration_id}] | sort_by(.context)')
          # The list is fetched from protected MAIN via the API, never
          # from a checkout: this workflow deliberately checks out nothing
          # (see the header), and the PR's own copy of the list is exactly
          # what an attacker editing the list would control. Same
          # trust-source rule as the release chain's allowed-signers fetch.
          expected=$(gh api "repos/${GITHUB_REPOSITORY}/contents/.github/policy/required-checks.json?ref=main" \
                       --jq '.content' | base64 -d \
                     | jq '[.required_checks[]] | sort_by(.context)')
          echo "expected: $(jq -c '[.[].context]' <<<"${expected}")"
          echo "actual:   $(jq -c '[.[].context]' <<<"${actual}")"
          if [ "$(jq -cS . <<<"${actual}")" != "$(jq -cS . <<<"${expected}")" ]; then
            echo "::error::The required-check set on main does not match .github/policy/required-checks.json (contexts and integration IDs must both match, exactly). Auto-merge refuses to arm until they agree — update the ruleset (owner) or the list (PR), whichever is wrong." >&2
            exit 1
          fi

      # The approval is an AUDIT TRAIL, not a gate. main's ruleset requires
      # signed commits and seven status checks; it does not require pull
      # request reviews, so nothing here depends on this succeeding.
      #
      # It fails by default with "GitHub Actions is not permitted to approve
      # pull requests", and we are deliberately LEAVING IT THAT WAY. The
      # setting that would fix it — Actions: allow creating and approving
      # pull requests — lets any workflow in the repo self-approve, which
      # is a supply-chain weakening that OpenSSF Scorecard flags and that
      # our own CI/CD baseline argues against. Trading that away to get a
      # cosmetic review on a bot PR is a bad deal.
      #
      # continue-on-error, not removal: if a required-review rule is ever
      # added to main, this step starts mattering again and its failure
      # will be visible in the run rather than silently absent.
      - name: approve (best effort — see note above)
        if: steps.meta.outputs.update-type != 'version-update:semver-major'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: >-
          gh pr review --approve "$PR_URL"
          --body "Autonomous lane (brief 0.2a): patch/minor dependency bump to
          an upstream-published version. Merging once every required check is green."

      - name: enable auto-merge
        if: steps.meta.outputs.update-type != 'version-update:semver-major'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --auto --squash "$PR_URL"
