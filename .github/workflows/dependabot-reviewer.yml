name: Dependabot reviewer

# Register row 75: three dependency lanes. The auditor (cron) opens CVE bumps; Dependabot opens
# "latest" bumps; THIS workflow reads every pull request Dependabot opens into main, whatever its
# update kind (patch, minor, major, flagged) and whoever pushed a commit onto it since, and is its
# only review: a Dependabot pull request gets no other one.
# dependabot-auto-merge.yml still arms a plain patch/minor at once; this workflow leaves that arm
# on while it reads the bump and takes it away only with a failure verdict or for a forced re-review.
#
# Why hourly-from-main and never on a PR event: GitHub gives a Dependabot-triggered run no
# repository secrets, so a job that fires when Dependabot opens a PR can never hold the
# federated model identity. Same wall as the review gate, same answer: a scheduled sweep that
# runs main's copy of this file, checks out main only, and reads PR data through the API.
#
# What it does for each open Dependabot PR into main that has no `dependabot-reviewer` check from
# the App on its head yet:
#   0. spends nothing on a change it has already read: when the head is a merge commit and GitHub's
#      diff of it against main is byte for byte the diff of the head under it that carries the
#      success verdict (the new head only merges main in), the success is published on the new head
#      and no reader is called (bin/dependabot-reviewer.py same-diff);
#   1. gathers, with no model involved: the PR's commits (each one not Dependabot's marked so), the
#      whole diff of that exact head commit against main, never cut, the upstream release notes for
#      every version between old and new, and every line of ours that names the dependency
#      (bin/dependabot-reviewer.py gather). A verdict is for that commit: if the PR's head is another
#      commit when the readers have answered, nothing is published and the new head is read next hour;
#   2. sends that bundle to TWO readers through the same federation the auditor uses, and gets
#      ranked findings tagged breaks-us / check / noise — never a verdict (row 51);
#   3. decides MECHANICALLY (bin/dependabot-reviewer.py decide): no breaks-us from either
#      reader AND main's required-check guard passes => arm squash auto-merge, then publish the
#      check as success (the required checks still gate the actual merge; the App has no
#      bypass); any breaks-us => disarm any earlier auto-merge, open or update ONE issue with
#      both readers' findings for the ccode queue, then publish the check as failure; a reader
#      error, an unparseable answer, a missing diff, or any action that did not happen => no
#      check, so the next hourly run retries; three unfinished runs in a row => one issue.
#      The check goes up LAST: a head that carries it is never looked at again.
#   4. settles the arms of the heads it took up: none is left armed over a failure verdict, and a
#      patch/minor whose review did not finish is armed again as the auto-merge workflow had left it.
#
# The review gate (agent-review-gate.yml) passes a Dependabot head on this reviewer's success, and
# its sweep does not look again at a head whose gate check is green. So whenever this workflow
# publishes a verdict that is not success (failure, or neutral for a review that did not finish or is
# being done again), it FIRST publishes the gate's own check, `auditor-review-gate`, as failure on
# that head: the same check run the gate publishes (same name, same App: the token of step
# app-checks, checks:write), so a gate success published earlier cannot outlive it. It never
# publishes a gate success: after a later success here the gate's sweep judges the head again (it
# re-judges a failure from the last six hours; an older one is published again here, as a failure,
# so that it does), and a new head gets the gate's own run.
#
# It scans nothing, opens no PRs, edits nothing. Two App tokens with disjoint permissions:
# checks:write (publish the check) and contents+pull-requests (arm auto-merge), mirroring the
# split between agent-review-gate.yml and auditor.yml. The job token opens the held issue
# (the App has no Issues permission). No vendor or model name appears anywhere here, in the
# check, or in the issue (row 48); model ids live only in the `agent` environment's secrets.
#
# `dependabot-reviewer` is deliberately NOT a required check: it only ever runs on Dependabot's
# pull requests, and a required check would block every human PR.

on:
  schedule:
    - cron: '23 * * * *'   # hourly (owner: not every ten minutes)
  workflow_dispatch:
    inputs:
      pr:
        description: 'Review only this PR number (blank = every open Dependabot PR into main)'
        required: false
        default: ''
      force:
        description: 'Re-review even if the head already carries a dependabot-reviewer check'
        type: boolean
        default: false

permissions: {}

concurrency:
  group: dependabot-reviewer
  cancel-in-progress: false

jobs:
  review:
    name: dependabot reviewer
    runs-on: ubuntu-latest
    environment: agent
    permissions:
      id-token: write        # mint the federated identity token
      contents: read
      pull-requests: read    # list PRs, read diffs
      issues: write          # the held / reader-failure issues
      actions: read          # read this workflow's run history (the failure streak)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: mint the App token for the check run (checks:write only)
        id: app-checks
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.AUDITOR_APP_ID }}
          private-key: ${{ secrets.AUDITOR_APP_PRIVATE_KEY }}
          repositories: cache
          permission-checks: write

      - name: mint the App token for arming / disarming auto-merge (contents + pull-requests)
        id: app-merge
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.AUDITOR_APP_ID }}
          private-key: ${{ secrets.AUDITOR_APP_PRIVATE_KEY }}
          repositories: cache
          permission-contents: write
          permission-pull-requests: write

      - name: find open Dependabot PRs into main that have no verdict yet
        id: candidates
        env:
          GH_TOKEN: ${{ github.token }}
          APP_TOKEN: ${{ steps.app-checks.outputs.token }}
          APP_SLUG: ${{ steps.app-checks.outputs.app-slug }}
          MERGE_TOKEN: ${{ steps.app-merge.outputs.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ONLY_PR: ${{ inputs.pr }}
          FORCE: ${{ inputs.force }}
        # A verdict is the App's LATEST dependabot-reviewer check on the head: success or failure; neutral or none is
        # read this hour. A success from before this workflow last changed on main is not one: such a reviewer may
        # have read less than the whole diff, so the head is read again as a forced run reads it.
        # No reader is called for a merge of main whose diff against main is the passed head's, byte for byte: the same
        # change was read.
        # A plain patch/minor keeps the auto-merge workflow's arm through the review (the gate holds the merge); any
        # other arm without a success comes off before the review, so a setup step that fails later cannot leave it
        # standing. A person's disarm is never undone.
        # A lookup that fails is never "nothing to do": the PR is skipped and the step fails, so the failure streak sees it.
        run: |
          set +e -uo pipefail
          mkdir -p "$RUNNER_TEMP/work"; lookup_failed=0
          # when this workflow last changed on main: the newest commit of main that touched this file. Without it no
          # success can be told from an older reviewer's, so nothing is read or published this hour.
          this=.github/workflows/dependabot-reviewer.yml
          cutoff=$(gh api "repos/${GITHUB_REPOSITORY}/commits?sha=main&path=${this}&per_page=1" \
                     --jq '.[0].commit.committer.date') \
            && [[ "$cutoff" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$ ]] \
            || { echo "::error::cannot read when this workflow last changed on main — no verdict is read"; exit 1; }
          # <sha>: the App's latest reviewer check on that commit: its conclusion, none, or legacy (a success not
          # after the cutoff)
          verdict_of() {
            GH_TOKEN="$APP_TOKEN" gh api "repos/${GITHUB_REPOSITORY}/commits/$1/check-runs?check_name=dependabot-reviewer" \
              --jq "[.check_runs[] | select(.app.slug == \"${APP_SLUG}\")] | sort_by(.id) | last
                    | if . == null then \"none\"
                      elif .conclusion == \"success\" and ((.completed_at // \"\") <= \"${cutoff}\") then \"legacy\"
                      else .conclusion // \"none\" end"
          }
          gate_fail() { # <sha> <why>: the review gate's own check, as the gate publishes it (same name, same App), says failure on that commit
            GH_TOKEN="$APP_TOKEN" gh api "repos/${GITHUB_REPOSITORY}/check-runs" -f name=auditor-review-gate \
              -f head_sha="$1" -f status=completed -f conclusion=failure -f details_url="$RUN_URL" \
              -f "output[title]=auditor review gate: failure" -f "output[summary]=$2" >/dev/null
          }
          gate_of() { # <sha>: the App's newest gate check on that commit, as the gate's sweep reads it: none, success, failure (six hours old at most) or stale
            GH_TOKEN="$APP_TOKEN" gh api "repos/${GITHUB_REPOSITORY}/commits/$1/check-runs?check_name=auditor-review-gate" \
              --jq "[.check_runs[] | select(.app.slug == \"${APP_SLUG}\")] | sort_by(.completed_at) | last
                    | if . == null then \"none\" elif .conclusion == \"success\" then \"success\"
                      elif (now - (.completed_at | fromdate)) < 21600 then \"failure\" else \"stale\" end"
          }
          gate_stands() { # <n> <sha> <verdict>: no gate success stands over a failure or neutral verdict (1: that could not be made sure)
            local g
            g=$(gate_of "$2") && [ -n "$g" ] || return 1
            [ "$g" = success ] || return 0
            gate_fail "$2" "The Dependabot reviewer's verdict on this head is $3: it is not passed." || return 1
            echo "PR #$1 ${2:0:7}: the review gate's check said success over the reviewer's $3 — failed again"
          }
          # Without an audit record branch, the gate's sweep does not look again at a failure older than six hours, so a
          # head the reviewer passes after that would stay red. Publishing the failure anew (never a success) puts it
          # back inside the sweep's window.
          gate_refresh() { # <n> <sha>: a stale gate failure over a success verdict is published again (1: that could not be done)
            local g
            g=$(gate_of "$2") && [ -n "$g" ] || return 1
            [ "$g" = stale ] || return 0
            gate_fail "$2" "The Dependabot reviewer passed this head, and this check last failed more than six hours ago: failed again so that the gate's sweep judges the head anew." || return 1
            echo "PR #$1 ${2:0:7}: passed by the reviewer over a stale gate failure — the gate failure is published again for the sweep to judge"
          }
          gh pr list --base main --state open --author 'app/dependabot' --limit 100 \
            --json number,title,body,headRefOid > "$RUNNER_TEMP/work/prs.json" || { echo "::error::cannot list PRs"; exit 1; }
          : > "$RUNNER_TEMP/work/candidates.txt"; : > "$RUNNER_TEMP/work/lane-arms.txt"
          while read -r pr; do
            n=$(jq -r .number <<<"$pr"); sha=$(jq -r .headRefOid <<<"$pr")
            [ -z "$ONLY_PR" ] || [ "$ONLY_PR" = "$n" ] || continue
            jq -r '.body // ""' <<<"$pr" > "$RUNNER_TEMP/work/body-$n.txt"
            if ! python3 bin/dependabot-reviewer.py updates --title "$(jq -r .title <<<"$pr")" \
                   --body-file "$RUNNER_TEMP/work/body-$n.txt" > "$RUNNER_TEMP/work/updates-$n.json"; then
              echo "::error::PR #$n: could not read its updates"; lookup_failed=1; continue
            fi
            lane=$(jq -r 'if length > 0 and all(.[]; .kind == "not-major") then "yes" else "no" end' "$RUNNER_TEMP/work/updates-$n.json") \
              || { echo "::error::PR #$n: could not tell its update kinds"; lookup_failed=1; continue; }
            if ! prior=$(verdict_of "$sha") || [ -z "$prior" ]; then
              echo "::error::PR #$n ${sha:0:7}: could not read its reviewer checks — skipped this hour"; lookup_failed=1; continue
            fi
            if [ "$prior" = none ] && [ "$FORCE" != "true" ]; then
              # the spend guard (see above): walk back over merge commits to the nearest verdict; only a success is carried
              from=""; c="$sha"
              for _ in 1 2 3 4 5; do
                c=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${c}" --jq '.parents | if length == 2 then .[0].sha else "" end') && [ -n "$c" ] || break
                v=$(verdict_of "$c") && [ -n "$v" ] || break
                [ "$v" != none ] || continue
                [ "$v" != success ] || from="$c"
                break
              done
              if [ -n "$from" ] && python3 bin/dependabot-reviewer.py same-diff --repo "$GITHUB_REPOSITORY" --base main "$from" "$sha"; then
                if ! GH_TOKEN="$APP_TOKEN" gh api "repos/${GITHUB_REPOSITORY}/check-runs" -f name=dependabot-reviewer \
                       -f head_sha="$sha" -f status=completed -f conclusion=success -f details_url="$RUN_URL" \
                       -f "output[title]=dependabot reviewer: success" \
                       -f "output[summary]=Not read again: this head's diff against main is byte for byte the diff of ${from}, which two independent readers passed. The success is carried over from that head." >/dev/null; then
                  echo "::error::PR #$n ${sha:0:7}: could not publish the success carried over from ${from:0:7} — skipped this hour"; lookup_failed=1; continue
                fi
                echo "PR #$n ${sha:0:7}: the same diff against main as ${from:0:7}, which the readers passed — success carried over, no reader called"
                prior=success
              fi
            fi
            if [ "$FORCE" != "true" ] && { [ "$prior" = success ] || [ "$prior" = failure ]; }; then
              echo "PR #$n ${sha:0:7}: verdict already $prior"
              if [ "$prior" = failure ]; then
                gate_stands "$n" "$sha" failure || { echo "::error::PR #$n ${sha:0:7}: could not make sure the review gate's check is not success over the failure verdict"; lookup_failed=1; }
                if ! armed_now=$(gh pr view "$n" --json autoMergeRequest --jq '.autoMergeRequest != null'); then
                  echo "::error::PR #$n ${sha:0:7}: could not read its auto-merge state — skipped this hour"; lookup_failed=1; continue
                fi
                if [ "$armed_now" != false ]; then
                  if GH_TOKEN="$MERGE_TOKEN" gh pr merge --disable-auto "$n" >/dev/null; then echo "PR #$n ${sha:0:7}: armed over a failure verdict — auto-merge turned off"
                  else echo "::error::PR #$n ${sha:0:7}: armed over a failure verdict and could not be disarmed"; lookup_failed=1; fi
                fi
              fi
              if [ "$prior" = success ]; then
                gate_refresh "$n" "$sha" || { echo "::error::PR #$n ${sha:0:7}: could not publish its stale gate failure again"; lookup_failed=1; }
                # The reviewer arms and THEN publishes success, and a carried success lands after the auto-merge
                # workflow saw the new head: that workflow can so turn an approved arm off (REQ-DEP-003-AC2).
                if ! armed_now=$(gh pr view "$n" --json autoMergeRequest --jq '.autoMergeRequest != null'); then
                  echo "::error::PR #$n ${sha:0:7}: could not read its auto-merge state — skipped this hour"; lookup_failed=1; continue
                fi
                if [ "$armed_now" = false ]; then
                  if ! last_event=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${n}/events" --paginate \
                        --jq '.[] | select(.event | test("^auto_(merge|squash|rebase)_(enabled|disabled)$")) | "\(.event | sub("^auto_(squash|rebase)_"; "auto_merge_")) \(.actor.login)"' | tail -n 1; \
                      [ "${PIPESTATUS[0]}" = 0 ]); then
                    echo "::error::PR #$n ${sha:0:7}: could not read its auto-merge events — skipped this hour"; lookup_failed=1; continue
                  fi
                  case "$last_event" in
                    "auto_merge_disabled github-actions[bot]"|"auto_merge_disabled github-actions")
                      if gh api "repos/${GITHUB_REPOSITORY}/contents/.github/policy/required-checks.json?ref=main" --jq .content \
                           | base64 -d > "$RUNNER_TEMP/work/heal-required-checks.json" \
                         && bash bin/required-check-guard.sh "$RUNNER_TEMP/work/heal-required-checks.json"; then
                        if GH_TOKEN="$MERGE_TOKEN" gh pr merge --auto --squash --match-head-commit "$sha" "$n" >/dev/null; then
                          echo "PR #$n ${sha:0:7}: the approved arm was turned off meanwhile — put back"
                        else echo "::error::PR #$n ${sha:0:7}: could not put the approved arm back — retried next hour"; lookup_failed=1; fi
                      else echo "::error::PR #$n ${sha:0:7}: required-check guard refused — the approved arm stays off this hour"; lookup_failed=1; fi ;;
                  esac
                fi
              fi
              continue
            elif [ "$prior" = none ] || [ "$prior" = neutral ]; then
              if [ "$prior" = neutral ] && ! gate_stands "$n" "$sha" neutral; then
                echo "::error::PR #$n ${sha:0:7}: could not make sure the review gate's check is not success over the neutral verdict — skipped this hour"; lookup_failed=1; continue
              fi
              if ! armed=$(gh pr view "$n" --json autoMergeRequest --jq '.autoMergeRequest != null'); then
                echo "::error::PR #$n: could not read its auto-merge state — skipped this hour"; lookup_failed=1; continue
              fi
              if [ "$armed" != false ] && [ "$lane" = yes ]; then
                echo "$n $sha" >> "$RUNNER_TEMP/work/lane-arms.txt"
                echo "PR #$n: armed by the auto-merge workflow — left armed through the review"
              elif [ "$armed" != false ]; then
                if ! GH_TOKEN="$MERGE_TOKEN" gh pr merge --disable-auto "$n" >/dev/null; then
                  echo "::error::PR #$n: armed with no verdict and could not be disarmed — skipped this hour"; lookup_failed=1; continue
                fi
                echo "PR #$n: armed with no current verdict — auto-merge turned off before review"
              fi
            elif [ "$prior" = legacy ] \
                 || { [ "$FORCE" = "true" ] && { [ "$prior" = success ] || [ "$prior" = failure ]; }; }; then
              why=forced
              if [ "$prior" = legacy ]; then why="its success is older than this workflow on main"; prior=success; fi
              if ! GH_TOKEN="$MERGE_TOKEN" gh pr merge --disable-auto "$n" >/dev/null 2>&1 \
                   && [ "$(gh pr view "$n" --json autoMergeRequest --jq '.autoMergeRequest != null')" != false ]; then
                echo "::error::PR #$n: re-review ($why) could not turn auto-merge off — skipped, old verdict kept"
                lookup_failed=1; continue
              fi
              again="reading this head again ($why); its earlier '$prior' verdict no longer stands."
              if ! gate_fail "$sha" "The Dependabot reviewer is $again"; then
                echo "::error::PR #$n: re-review ($why) could not fail the gate's check — skipped (auto-merge is off)"
                lookup_failed=1; continue
              fi
              if ! GH_TOKEN="$APP_TOKEN" gh api "repos/${GITHUB_REPOSITORY}/check-runs" -f name=dependabot-reviewer \
                     -f head_sha="$sha" -f status=completed -f conclusion=neutral -f details_url="$RUN_URL" \
                     -f "output[title]=dependabot reviewer: neutral" \
                     -f "output[summary]=The reviewer is $again Auto-merge is off." >/dev/null; then
                echo "::error::PR #$n: re-review ($why) could not supersede its verdict — skipped (auto-merge is off)"
                lookup_failed=1; continue
              fi
              prior=neutral
            fi
            echo "$n $sha $prior" >> "$RUNNER_TEMP/work/candidates.txt"
            echo "PR #$n ${sha:0:7}: latest verdict '$prior' — will review"
          done < <(jq -c '.[]' "$RUNNER_TEMP/work/prs.json")
          count=$(wc -l < "$RUNNER_TEMP/work/candidates.txt" | tr -d ' ')
          echo "count=$count" >> "$GITHUB_OUTPUT"
          [ "$count" != "0" ] || echo "::notice::nothing to review this hour"
          [ "$lookup_failed" = 0 ] || { echo "::error::one or more PRs could not be looked up (see above)"; exit 1; }

      - name: mint the federated identity token
        id: mint
        if: ${{ !cancelled() && steps.candidates.outputs.count != '0' && steps.candidates.outputs.count != '' }}
        # Straight from the runner's OIDC endpoint: no third-party action holds the token.
        run: |
          set -euo pipefail
          tok=$(curl -sSf -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
                  "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=https://api.anthropic.com" | jq -r .value)
          [ -n "$tok" ] && [ "$tok" != "null" ] || { echo "::error::no identity token"; exit 1; }
          echo "::add-mask::$tok"
          printf '%s' "$tok" > "$RUNNER_TEMP/identity-token"
          echo "ANTHROPIC_IDENTITY_TOKEN_FILE=$RUNNER_TEMP/identity-token" >> "$GITHUB_ENV"
          # Print ONLY the claims the federation rule matches on (never the token) so a 401 at
          # exchange time is diagnosable against the rule.
          python3 - "$tok" <<'PY'
          import base64, json, sys
          seg = sys.argv[1].split('.')[1]
          claims = json.loads(base64.urlsafe_b64decode(seg + '=' * (-len(seg) % 4)))
          print('OIDC identity claims (federation-rule inputs):', json.dumps({k: claims.get(k) for k in
                ('sub', 'aud', 'ref', 'job_workflow_ref', 'environment', 'repository', 'repository_owner_id')}))
          PY

      - name: pin pip (hash-checked)
        id: pip_pin
        if: ${{ !cancelled() && steps.mint.outcome == 'success' }}
        run: |
          python3 -m pip install --quiet --require-hashes --only-binary=:all: --break-system-packages -r .github/agent/pip-requirements.txt
          python3 -m pip --version
      - name: install the pinned SDK (the auditor's hash-pinned set)
        id: sdk
        if: ${{ !cancelled() && steps.mint.outcome == 'success' && steps.pip_pin.outcome == 'success' }}
        run: |
          set -euo pipefail
          python3 -m pip install --require-hashes --break-system-packages -r .github/agent/adjudicator-requirements.txt
          # no inline interpreter code (handoff 0094): the import check is a heredoc, the pin checker's documented boundary
          python3 - <<'PY'
          from anthropic.lib.credentials import WorkloadIdentityCredentials, IdentityTokenFile  # noqa: F401
          print("sdk ready")
          PY

      # Row 76: a HOLD dispatches the fixer in the ops repository. Best effort: if the App is not
      # installed on ops this mint fails and the hold still stands (the issue is the record).
      - name: mint the App token for dispatching the fixer (ops, contents:write only)
        id: app-ops
        if: ${{ !cancelled() && steps.sdk.outcome == 'success' }}
        continue-on-error: true
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.AUDITOR_APP_ID }}
          private-key: ${{ secrets.AUDITOR_APP_PRIVATE_KEY }}
          repositories: ops
          permission-contents: write

      - name: gather, read twice, decide, act — one PR at a time
        if: ${{ !cancelled() && steps.sdk.outcome == 'success' && steps.app-merge.outcome == 'success' }}
        id: act
        env:
          # the reviewer's own federation rule; the other identifiers are shared with the auditor
          ANTHROPIC_FEDERATION_RULE_ID: ${{ secrets.REVIEWER_FEDERATION_RULE_ID }}
          ANTHROPIC_ORGANIZATION_ID: ${{ secrets.ANTHROPIC_ORGANIZATION_ID }}
          ANTHROPIC_SERVICE_ACCOUNT_ID: ${{ secrets.ANTHROPIC_SERVICE_ACCOUNT_ID }}
          ANTHROPIC_WORKSPACE_ID: ${{ secrets.ANTHROPIC_WORKSPACE_ID }}
          AUDITOR_MODEL_PRIMARY: ${{ secrets.AUDITOR_MODEL_PRIMARY }}
          AUDITOR_MODEL_FALLBACK: ${{ secrets.AUDITOR_MODEL_FALLBACK }}
          GH_TOKEN: ${{ github.token }}
          CHECKS_TOKEN: ${{ steps.app-checks.outputs.token }}
          MERGE_TOKEN: ${{ steps.app-merge.outputs.token }}
          DISPATCH_TOKEN: ${{ steps.app-ops.outputs.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # The runner starts bash with -e. Here every failure is handled explicitly, per PR, so
          # one PR's failure never abandons the rest of the hour or skips the outputs below.
          set +e -uo pipefail
          W="$RUNNER_TEMP/work"; fail=0; merged=0; held=0; errored=0; moved=0
          # A FRESH identity token for every reader call. Each `read` is its own process and its
          # own SDK exchange; exchanging one token twice fails (jti_reused — the auditor hit it),
          # and a token lives about five minutes. The runner endpoint is available to every step
          # of a job with id-token: write.
          mint() {
            local tok
            tok=$(curl -sSf -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
                    "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=https://api.anthropic.com" | jq -r .value) || return 1
            [ -n "$tok" ] && [ "$tok" != "null" ] || return 1
            echo "::add-mask::$tok"
            printf '%s' "$tok" > "$ANTHROPIC_IDENTITY_TOKEN_FILE"
          }
          # The gate's sweep skips a head whose gate check is green: a gate success must not outlive a verdict that is not success.
          publish() { # <sha> <conclusion> <summary>
            if [ "$2" != success ]; then
              GH_TOKEN="$CHECKS_TOKEN" gh api "repos/${GITHUB_REPOSITORY}/check-runs" -f name=auditor-review-gate \
                -f head_sha="$1" -f status=completed -f conclusion=failure -f details_url="$RUN_URL" \
                -f "output[title]=auditor review gate: failure" \
                -f "output[summary]=The Dependabot reviewer's verdict on this head is $2: it is not passed." >/dev/null || return 1
            fi
            GH_TOKEN="$CHECKS_TOKEN" gh api "repos/${GITHUB_REPOSITORY}/check-runs" -f name=dependabot-reviewer \
              -f head_sha="$1" -f status=completed -f conclusion="$2" -f details_url="$RUN_URL" \
              -f "output[title]=dependabot reviewer: $2" -f "output[summary]=$3" >/dev/null
          }
          # One open issue per title, updated in place. Returns non-zero if it could not look up,
          # create or update — the caller then posts NO check, so the next hour retries.
          issue_upsert() { # <title> <body-file>
            local list existing
            list=$(gh issue list --state open --search "\"$1\" in:title" --json number,title) || return 1
            existing=$(jq -r --arg t "$1" '[.[] | select(.title == $t)][0].number // empty' <<<"$list") || return 1
            ISSUE_NO=""
            if [ -n "$existing" ]; then gh issue edit "$existing" --body-file "$2" >/dev/null || return 1; ISSUE_NO="$existing"; echo "#$existing updated"
            else
              local url; url=$(gh issue create --title "$1" --body-file "$2") || return 1
              ISSUE_NO="${url##*/}"; echo "$url"
            fi
          }
          # A PR whose review did not finish this hour. Safe direction first: auto-merge OFF if
          # anything armed it. If the head already carries a verdict (a forced re-review), a
          # `neutral` check supersedes it, so the next hour retries instead of trusting the old
          # verdict. With no prior verdict nothing is posted (row 75: an error posts no check).
          unfinished() { # <n> <sha> <prior> <why>
            local armed
            errored=$((errored+1))
            echo "::warning::PR #$1: $4 — retry next hour"
            armed=$(gh pr view "$1" --json autoMergeRequest --jq '.autoMergeRequest != null') || armed=unknown
            if [ "$armed" != false ]; then
              GH_TOKEN="$MERGE_TOKEN" gh pr merge --disable-auto "$1" \
                || echo "::error::PR #$1: auto-merge may still be armed and could not be turned off"
            fi
            # a verdict on the head (forced) or one that may have landed despite an error response
            if [ "$3" = success ] || [ "$3" = failure ] || [ "$3" = attempted ]; then
              publish "$2" neutral "The re-review did not finish ($4). Auto-merge is off; the next hourly run retries. Evidence: this run's artifact." \
                || echo "::error::PR #$1: could not supersede its earlier '$3' verdict"
            fi
          }
          # main's list and main's ruleset must agree before a bump is armed: the same guard as the
          # patch/minor lane (bin/required-check-guard.sh, row 75). If main enforced no checks,
          # --auto would merge at once; the guard fails closed.
          if gh api "repos/${GITHUB_REPOSITORY}/contents/.github/policy/required-checks.json?ref=main" --jq .content \
               | base64 -d > "$W/main-required-checks.json" \
             && bash bin/required-check-guard.sh "$W/main-required-checks.json"; then guard_ok=1
          else guard_ok=0; echo "::error::required-check guard refused: nothing is armed this hour (every merge decision below becomes an error)"; fi
          while read -r n sha prior; do
            prior=${prior:-none}
            d="$W/pr-$n"; mkdir -p "$d"
            echo "::group::PR #$n ${sha:0:7}"
            # 1. gather (no model): the commits and the whole diff of exactly $sha against main; a missing diff or unreadable
            #    input is an error, never an empty bundle; a PR whose head is no longer $sha (exit 5) is left for the next hour
            python3 bin/dependabot-reviewer.py gather --pr "$n" --sha "$sha" --updates "$W/updates-$n.json" --out "$d"; rc=$?
            if [ "$rc" = 5 ]; then
              moved=$((moved+1)); echo "PR #$n: its head is no longer ${sha:0:7} — nothing read, nothing published; the new head is reviewed next hour"; echo "::endgroup::"; continue
            elif [ "$rc" != 0 ]; then
              unfinished "$n" "$sha" "$prior" "gather failed"; echo "::endgroup::"; continue
            fi
            # 2. two readers, independently, each with a fresh identity token
            for reader in AUDITOR_MODEL_PRIMARY AUDITOR_MODEL_FALLBACK; do
              mint || echo "::warning::PR #$n: could not mint a fresh identity token for $reader"
              python3 bin/dependabot-reviewer.py read --bundle "$d/bundle.md" \
                --prompt .github/policy/dependabot-reviewer-prompt.txt --model-env "$reader" --out "$d/reader-$reader.json" \
                || echo "::warning::PR #$n: reader $reader did not complete"
            done
            # 3. mechanical decision
            if ! python3 bin/dependabot-reviewer.py decide --reader "$d/reader-AUDITOR_MODEL_PRIMARY.json" \
                   --reader "$d/reader-AUDITOR_MODEL_FALLBACK.json" --out "$d/decision.json"; then
              unfinished "$n" "$sha" "$prior" "decide failed"; echo "::endgroup::"; continue
            fi
            decision=$(jq -r .decision "$d/decision.json") || decision=error
            names=$(jq -r '[.[]|"\(.name) \(.from)→\(.to)"]|join(", ")' "$W/updates-$n.json") || names="PR #$n"
            if [ "$decision" = merge ] && [ "$guard_ok" != 1 ]; then decision=guard; fi
            # The verdict is for $sha, the commit whose diff the readers were given. If the PR's head is another commit by now,
            # nothing is published and nothing is done to the PR: the new head is a candidate next hour.
            if ! head_now=$(gh pr view "$n" --json headRefOid --jq .headRefOid) || [ -z "$head_now" ]; then
              unfinished "$n" "$sha" "$prior" "could not read the PR's head after the review"; echo "::endgroup::"; continue
            fi
            if [ "$head_now" != "$sha" ]; then
              moved=$((moved+1)); echo "PR #$n: its head moved from ${sha:0:7} to ${head_now:0:7} during the review — nothing published; the new head is reviewed next hour"; echo "::endgroup::"; continue
            fi
            # 4. act FIRST, then publish the check: a head with a check is never looked at again, so
            #    the check goes up only once the action it reports has actually happened.
            case "$decision" in
              merge)
                # ledger: armed but not yet published — the cancellation cleanup step disarms these
                echo "$n $sha" >> "$W/armed-unpublished.txt"
                # bound to the head that was reviewed: a later push voids the verdict (owner, Oct 1)
                if GH_TOKEN="$MERGE_TOKEN" gh pr merge --auto --squash --match-head-commit "$sha" "$n"; then
                  if publish "$sha" success "Two independent readers found no documented change that breaks a line of ours ($names). Auto-merge armed; the required checks still gate the merge. Evidence: this run's artifact."; then
                    merged=$((merged+1)); echo "PR #$n: merge (auto-merge armed, check published)"
                    grep -vx "$n $sha" "$W/armed-unpublished.txt" > "$W/armed-unpublished.tmp"; mv "$W/armed-unpublished.tmp" "$W/armed-unpublished.txt"
                  else unfinished "$n" "$sha" attempted "the success check could not be published (auto-merge turned back off)"; fi
                else unfinished "$n" "$sha" "$prior" "auto-merge could not be armed"; fi ;;
              hold)
                title="bump held: PR #$n"   # short and the same for every head of the PR: one issue per PR, whatever the group holds
                {
                  echo "Dependabot PR #$n (\`${sha:0:7}\`: $names) is a bump that a reader says breaks a line of ours."
                  echo "This is the ccode queue's, not the owner's: fix our side, then re-run the reviewer with force=true."
                  echo; echo "Run: $RUN_URL"; echo
                  echo "## breaks-us findings"; echo
                  jq -r '.breaks_us[] | "- **\(.title)** (\(.reader | sub("AUDITOR_MODEL_PRIMARY";"reader A") | sub("AUDITOR_MODEL_FALLBACK";"reader B")))  \n  release note: \(.release_note)  \n  our line: `\(.our_line)`  \n  why: \(.why)"' "$d/decision.json"
                  echo; echo "## every finding, both readers, verbatim"
                  jq -r '.readers[] | "\n### \(.reader | sub("AUDITOR_MODEL_PRIMARY";"reader A") | sub("AUDITOR_MODEL_FALLBACK";"reader B"))\n", (if .error then "_(no answer: \(.error))_" elif (.findings|length)==0 then "_(no findings)_" else (.findings[] | "- [\(.severity)] **\(.title)**  \n  release note: \(.release_note)  \n  our line: `\(.our_line)`  \n  why: \(.why)") end)' "$d/decision.json"
                  echo; echo "## fix on our side"; echo; echo "_(ccode fills this in: the change to our line, or why the finding is wrong, then re-runs the reviewer with force=true)_"
                } > "$d/issue.md"
                # disarm any auto-merge a previous verdict armed (the check is not required, so it cannot hold the PR by itself)
                armed=$(gh pr view "$n" --json autoMergeRequest --jq '.autoMergeRequest != null') || armed=unknown
                if [ "$armed" = true ]; then GH_TOKEN="$MERGE_TOKEN" gh pr merge --disable-auto "$n" || armed=stuck; fi
                if [ "$armed" = unknown ] || [ "$armed" = stuck ]; then
                  unfinished "$n" "$sha" "$prior" "could not confirm auto-merge is off"
                elif ! issue_upsert "$title" "$d/issue.md"; then
                  unfinished "$n" "$sha" "$prior" "could not open/update the held issue"
                elif publish "$sha" failure "A reader found a documented change that breaks a line of ours ($names). Held (auto-merge off); see the issue. Evidence: this run's artifact."; then
                  held=$((held+1)); echo "PR #$n: hold (issue open, check published)"
                  # row 76: the fixer makes our-side change; a failed dispatch is a warning, the hold stands
                  bash bin/dispatch-fixer.sh fix-held-bump "$ISSUE_NO" "$n" || true
                else unfinished "$n" "$sha" "$prior" "held, issue open, but the failure check could not be published"; fi ;;
              guard)
                unfinished "$n" "$sha" "$prior" "readers found nothing that breaks us, but the required-check guard refused" ;;
              *)
                unfinished "$n" "$sha" "$prior" "$(jq -r '.reason // "reader error"' "$d/decision.json" 2>/dev/null || echo "reader error")" ;;
            esac
            echo "::endgroup::"
          done < "$W/candidates.txt"
          {
            echo "### Dependabot reviewer"; echo
            echo "- reviewed: $(wc -l < "$W/candidates.txt" | tr -d ' ') PR(s); merge armed: $merged; held: $held; head moved during the review (new head next hour): $moved; not finished (retry next hour): $errored"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "errored=$errored" >> "$GITHUB_OUTPUT"
          [ "$errored" = "0" ] || fail=1
          exit "$fail"

      # A run cancelled between arming a PR and publishing its success check would leave an arm
      # that no check records until the next hourly sweep disarms it. This runs on cancellation:
      # for each PR in that window (the ledger) it asks GitHub for the head's LATEST reviewer
      # check. `success` means the verdict landed (the cancellation came after publishing) and
      # the arm stands; none/neutral means the arm is not recorded and it is turned off. If the
      # lookup FAILS, a success may or may not have landed: the review gate's check is failed and a
      # `neutral` check goes up (it supersedes whatever is there, so the head is retried next hour),
      # then the arm comes off.
      - name: on cancellation, turn off any auto-merge armed without a published check
        if: cancelled()
        env:
          GH_TOKEN: ${{ steps.app-merge.outputs.token }}
          APP_TOKEN: ${{ steps.app-checks.outputs.token }}
          APP_SLUG: ${{ steps.app-checks.outputs.app-slug }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set +e -uo pipefail
          f="$RUNNER_TEMP/work/armed-unpublished.txt"
          [ -s "$f" ] || { echo "nothing armed without a check"; exit 0; }
          while read -r n sha; do
            [ -n "$n" ] && [ -n "${sha:-}" ] || continue
            latest=$(GH_TOKEN="$APP_TOKEN" gh api "repos/${GITHUB_REPOSITORY}/commits/${sha}/check-runs?check_name=dependabot-reviewer" \
                       --jq "[.check_runs[] | select(.app.slug == \"${APP_SLUG}\")] | sort_by(.id) | last | .conclusion // \"none\"") || latest=unknown
            if [ "$latest" = success ]; then echo "PR #$n: success check is on the head — the arm is recorded, left as is"; continue; fi
            if [ "$latest" = unknown ]; then
              # the gate's check first, as with every verdict that is not success; without it the neutral is not published
              GH_TOKEN="$APP_TOKEN" gh api "repos/${GITHUB_REPOSITORY}/check-runs" -f name=auditor-review-gate \
                -f head_sha="$sha" -f status=completed -f conclusion=failure -f details_url="$RUN_URL" \
                -f "output[title]=auditor review gate: failure" \
                -f "output[summary]=The Dependabot reviewer's verdict on this head is neutral: it is not passed." >/dev/null \
              && \
              GH_TOKEN="$APP_TOKEN" gh api "repos/${GITHUB_REPOSITORY}/check-runs" -f name=dependabot-reviewer \
                -f head_sha="$sha" -f status=completed -f conclusion=neutral -f details_url="$RUN_URL" \
                -f "output[title]=dependabot reviewer: neutral" \
                -f "output[summary]=The run was cancelled before its verdict could be confirmed. Auto-merge is off; the next hourly run reviews again." >/dev/null \
                || echo "::error::PR #$n: could not post the superseding neutral check; if a success landed this head needs a forced re-review"
            fi
            if gh pr merge --disable-auto "$n"; then echo "PR #$n: auto-merge turned off (cancelled before its check; latest: $latest)"
            else echo "::error::PR #$n: could not turn auto-merge off; the next hourly sweep disarms it"; fi
          done < "$f"

      # The auto-merge workflow's job can start many minutes after a push and arm a head between the decision loop's
      # disarm and its failure check; and the loop turns off that workflow's own arm when a review does not finish.
      # Both are put right here, after it.
      - name: settle the arms — none over a failure verdict, an arm lost to an unfinished review put back
        id: settle
        if: ${{ always() && steps.candidates.outputs.count != '0' && steps.candidates.outputs.count != '' && steps.app-merge.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          APP_TOKEN: ${{ steps.app-checks.outputs.token }}
          APP_SLUG: ${{ steps.app-checks.outputs.app-slug }}
          MERGE_TOKEN: ${{ steps.app-merge.outputs.token }}
        run: |
          set +e -uo pipefail
          W="$RUNNER_TEMP/work"; bad=0; guard=unknown
          while read -r n sha _; do
            [ -n "$n" ] && [ -n "${sha:-}" ] || continue
            if ! latest=$(GH_TOKEN="$APP_TOKEN" gh api "repos/${GITHUB_REPOSITORY}/commits/${sha}/check-runs?check_name=dependabot-reviewer" \
                       --jq "[.check_runs[] | select(.app.slug == \"${APP_SLUG}\")] | sort_by(.id) | last | .conclusion // \"none\"") || [ -z "$latest" ]; then
              echo "::error::PR #$n ${sha:0:7}: could not read its reviewer checks — its arm is not settled"; bad=1; continue
            fi
            if ! armed=$(gh pr view "$n" --json state,headRefOid,autoMergeRequest \
                         --jq "if .state != \"OPEN\" then \"closed\" elif .headRefOid != \"${sha}\" then \"moved\" else (.autoMergeRequest != null) end"); then
              echo "::error::PR #$n ${sha:0:7}: could not read its auto-merge state — its arm is not settled"; bad=1; continue
            fi
            case "$latest $armed" in
              "failure true")
                if GH_TOKEN="$MERGE_TOKEN" gh pr merge --disable-auto "$n" >/dev/null; then echo "PR #$n ${sha:0:7}: armed over its failure verdict — auto-merge turned off"
                else echo "::error::PR #$n ${sha:0:7}: armed over its failure verdict and could not be disarmed"; bad=1; fi ;;
              "none false"|"neutral false")
                grep -qx "$n $sha" "$W/lane-arms.txt" 2>/dev/null || continue
                if [ "$guard" = unknown ]; then
                  if gh api "repos/${GITHUB_REPOSITORY}/contents/.github/policy/required-checks.json?ref=main" --jq .content \
                       | base64 -d > "$W/settle-required-checks.json" \
                     && bash bin/required-check-guard.sh "$W/settle-required-checks.json"; then guard=ok; else guard=refused; fi
                fi
                if [ "$guard" != ok ]; then
                  echo "::error::PR #$n ${sha:0:7}: required-check guard refused — the arm stays off"; bad=1; continue
                fi
                if GH_TOKEN="$MERGE_TOKEN" gh pr merge --auto --squash --match-head-commit "$sha" "$n" >/dev/null; then
                  echo "PR #$n ${sha:0:7}: its review did not finish — armed again as it was before"
                else echo "::error::PR #$n ${sha:0:7}: unfinished review; its arm could not be put back"; bad=1; fi ;;
            esac
          done < "$W/candidates.txt"
          exit "$bad"

      # The failure streak is the run history itself. This job fails if and only if a review did
      # not finish (a lookup, the identity token, the SDK, gather, a reader, the guard, an action
      # or an arm that could not be settled — every one of those paths ends in `unfinished` or a
      # failed step), and a run with nothing to review succeeds. So "three failed runs in a row" is exactly "three unfinished
      # runs in a row": no state of our own to lose or misread. If the history cannot be read,
      # nothing is decided this hour; the next failed run reads it again.
      - name: three unfinished runs in a row => one issue for the ccode queue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set +e -uo pipefail
          if ! prior=$(gh run list --workflow dependabot-reviewer.yml --status completed --limit 5 --json databaseId,conclusion \
                         --jq "[.[] | select(.databaseId != ${GITHUB_RUN_ID})] | .[0:2] | map(.conclusion)") || [ -z "$prior" ]; then
            echo "::warning::could not read the run history — the streak is checked again next failed run"; exit 0
          fi
          echo "this run: failure; the two before it: ${prior}"
          [ "$(jq -r 'length == 2 and all(. == "failure")' <<<"$prior")" = true ] || exit 0
          title="dependabot reviewer: reader failures"
          printf 'The reviewer could not finish its Dependabot pull requests on three consecutive runs; bumps are not being judged.\n\nLatest: %s\n\nCheck the run log: the "OIDC identity claims" line against the federation rule, the SDK step, and each PR group.\n' \
            "$RUN_URL" > "$RUNNER_TEMP/streak-issue.md"
          list=$(gh issue list --state open --search "\"$title\" in:title" --json number,title) || exit 0
          existing=$(jq -r --arg t "$title" '[.[] | select(.title == $t)][0].number // empty' <<<"$list")
          if [ -n "$existing" ]; then gh issue comment "$existing" --body-file "$RUNNER_TEMP/streak-issue.md" >/dev/null
          else gh issue create --title "$title" --body-file "$RUNNER_TEMP/streak-issue.md" >/dev/null; fi

      # Owner, Oct 1: no identifier reaches the uploaded evidence, the bundle included. The readers
      # receive the bundle unmasked (it is not uploaded as is); everything is masked in place here.
      # The upload runs only if this succeeded, and a failure here never fails the run (AC6).
      - name: mask the evidence before it is uploaded
        id: mask
        if: ${{ always() && steps.candidates.outputs.count != '0' }}
        continue-on-error: true
        env:
          ANTHROPIC_FEDERATION_RULE_ID: ${{ secrets.REVIEWER_FEDERATION_RULE_ID }}
          ANTHROPIC_ORGANIZATION_ID: ${{ secrets.ANTHROPIC_ORGANIZATION_ID }}
          ANTHROPIC_SERVICE_ACCOUNT_ID: ${{ secrets.ANTHROPIC_SERVICE_ACCOUNT_ID }}
          ANTHROPIC_WORKSPACE_ID: ${{ secrets.ANTHROPIC_WORKSPACE_ID }}
          AUDITOR_MODEL_PRIMARY: ${{ secrets.AUDITOR_MODEL_PRIMARY }}
          AUDITOR_MODEL_FALLBACK: ${{ secrets.AUDITOR_MODEL_FALLBACK }}
        run: python3 bin/dependabot-reviewer.py mask-tree "$RUNNER_TEMP/work"

      - name: upload the evidence (bundles, both readers' answers, decisions)
        if: ${{ always() && steps.candidates.outputs.count != '0' && steps.mask.outcome == 'success' }}
        continue-on-error: true   # evidence is best effort; it must not make a finished review look unfinished
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dependabot-reviewer-${{ github.run_id }}
          path: ${{ runner.temp }}/work
          if-no-files-found: ignore
