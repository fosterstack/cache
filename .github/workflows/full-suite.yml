name: Full suite

# The suites that run before a release-candidate tag and nightly, never on a pull request (REQ-CI-007-AC2): every tracked suite that no
# step of ci.yml runs, and both acceptance suites. Admission reads the contexts of this file's jobs on the tagged commit.
on:
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:

# Every run gets a group of its own: a nightly run is never cancelled by another run, nor a run for a tag by the nightly.
concurrency:
  group: ${{ format('full-suite-{0}-{1}', github.run_id, github.run_attempt) }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # The suites that are not steps of a job above: one matrix leg per tracked suite (a *-test.sh file under bin/ or .github/agent/tests/) that no step of ci.yml runs by
  # its path, each on its own runner. A leg that fails fails the job.
  suite-list:
    name: suite-list
    runs-on: ubuntu-latest
    outputs:
      suites: ${{ steps.list.outputs.suites }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: list
        run: |
          counted=$(grep -oE 'run: bash (bin|\.github/agent/tests)/[^ ]+-test\.sh$' .github/workflows/ci.yml | sed 's|.*/||')
          git ls-files | grep -E '^(bin|\.github/agent/tests)/[^/]+-test\.sh$' | sed 's|.*/||' | grep -vxF "$counted" | jq -Rsc 'split("\n")[:-1]' | sed 's/^/suites=/' >> "$GITHUB_OUTPUT"

  suites:
    name: suites (${{ matrix.suite }})
    needs: suite-list
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJSON(needs.suite-list.outputs.suites) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: set up Go (the suites that run the real go, whose cases fail in CI when Go is missing)
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: '1.27.4'
      - name: pin pip (hash-checked)
        run: |
          python3 -m pip install --quiet --require-hashes --only-binary=:all: -r .github/agent/pip-requirements.txt
          python3 -m pip --version
      - name: the hash-pinned test requirements (PyYAML, which the wiring suites read the workflows with, and the report lint's cmark-gfm)
        run: |
          python3 -m pip install --quiet --require-hashes --only-binary=:all: -r .github/agent/test-requirements.txt

      - name: install the pinned grype (the suites that run the real scanner)
        if: ${{ matrix.suite == 'vex-scope-test.sh' || matrix.suite == 'vex-both-scanners-test.sh' }}
        run: ./bin/install-scanner.sh grype

      - name: install the pinned cosign and crane (the suite that runs the real binaries)
        if: ${{ matrix.suite == 'release-referrer-verify-test.sh' }}
        run: |
          ./bin/install-scanner.sh cosign
          ./bin/install-scanner.sh crane

      - name: the suite
        env:
          SUITE: ${{ matrix.suite }}
        run: python3 -I bin/run-ci-suite.py "$SUITE"

  # The required check `allowlist-chain` (REQ-CI-001): this gate keeps the name, needs the suites, always runs, takes no checkout and no action, and
  # fails unless the suites job's result is exactly `success` (failed, skipped, cancelled, missing or empty fails: a skipped required check counts as passed).
  allowlist-chain:
    name: allowlist-chain
    runs-on: ubuntu-latest
    needs: [suites]
    if: ${{ always() }}
    steps:
      - name: every suite succeeded (a failed, skipped, cancelled or missing result fails)
        env:
          RESULT: ${{ needs.suites.result }}
        run: '[ "$RESULT" = success ] || { echo "the suites did not all succeed: [$RESULT]"; exit 1; }'

  # both acceptance suites, from source (acceptance.yml is callable only; its job reports as "acceptance / acceptance")
  acceptance:
    name: acceptance
    uses: ./.github/workflows/acceptance.yml

  # REQ-CI-007-AC3: a failed scheduled run opens a fix item (an issue with a fixed title and label, or a comment on the open one) and blocks nothing;
  # no pull request check reads it. The job holds issues: write and nothing else.
  report-failure:
    name: report-failure
    needs: [suite-list, suites, allowlist-chain, acceptance]
    if: ${{ failure() && github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: open the fix item, or comment on the open one
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TITLE: "The scheduled full suite failed"
          LABEL: scheduled-failure
        run: |
          set -euo pipefail
          body="The scheduled run failed on ${GITHUB_SHA}: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          n=$(gh issue list --state open --label "$LABEL" --json number,title --jq ".[] | select(.title == \"$TITLE\") | .number" | head -n 1)
          if [ -n "$n" ]; then
            gh issue comment "$n" --body "$body"
          else
            gh label create "$LABEL" --description "A scheduled run failed" --color D93F0B 2>/dev/null || true
            gh issue create --title "$TITLE" --label "$LABEL" --body "$body"
          fi
