name: Go toolchain freshness

# Scheduled Go-toolchain freshness check (audit follow-up). The v0.2.0
# scan failure was a Go stdlib CVE treadmill: the shipped binary was built
# with a go1.25.x that had since accumulated disclosed stdlib CVEs — and
# staying inside the 1.25 line could not clear CVE-2026-46600, whose only
# fix was in 1.26.6/1.27. So the rule is "newest patch of a SUPPORTED
# minor", not "newest patch of the current minor": the job may propose a
# minor bump (e.g. 1.26 -> 1.27) when a newer supported line exists, so a
# fix that lands only in a newer minor is not out of reach. go.dev's
# default release list (mode=json, without include=all) is exactly the
# set of currently supported minors and their latest patches; the newest
# of those is the target. The PR still goes through the required `scan`
# gate and human review before merge, so a minor jump is proposed, never
# auto-applied.
#
on:
  schedule:
    - cron: '23 6 * * *'    # the freshness check, daily
    - cron: '43 6 * * 1'    # persona UAT, weekly (Mondays)
  workflow_dispatch: {}     # runs the freshness check only: persona UAT runs on its Monday cron alone

permissions:
  contents: read

jobs:
  check:
    name: open the go.mod bump PR when a newer patch exists
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.schedule == '23 6 * * *' }}
    runs-on: ubuntu-latest
    # The bump PR is opened with the auditor App's token (the repository setting that would let Actions'
    # own token open PRs stays off). The App's secrets live in the main-only `agent` environment; this job's own token
    # stays read-only, and only the bump step receives the App token.
    environment: agent
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false   # the App token, via gh, is the only push credential

      - name: compare go.mod against the newest patch of a supported minor
        id: cmp
        run: |
          set -euo pipefail
          current=$(awk '/^go /{print $2; exit}' go.mod)
          echo "current go directive: ${current}"
          # mode=json (WITHOUT include=all) lists only the currently
          # SUPPORTED releases — the two newest minors and their latest
          # patches. The max of those is the newest patch of a supported
          # minor; it is stable by construction (no rc/beta).
          latest=$(curl -fsSL 'https://go.dev/dl/?mode=json' \
            | jq -r '.[] | select(.stable==true) | .version' \
            | sed 's/^go//' | sort -V | tail -1)
          [ -n "$latest" ] || { echo "::error::could not determine the newest supported Go release from go.dev" >&2; exit 1; }
          echo "newest supported Go release: ${latest}"
          newest=$(printf '%s\n%s\n' "$current" "$latest" | sort -V | tail -1)
          if [ "$current" = "$latest" ] || [ "$newest" != "$latest" ]; then
            echo "go.mod is already at or ahead of the newest supported release — nothing to do"
            echo "bump=false" >> "$GITHUB_OUTPUT"
          else
            {
              echo "bump=true"
              echo "current=$current"
              echo "latest=$latest"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: mint the auditor App's token (exactly the auditor's scope)
        id: app-token
        if: steps.cmp.outputs.bump == 'true'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.AUDITOR_APP_ID }}
          private-key: ${{ secrets.AUDITOR_APP_PRIVATE_KEY }}
          repositories: cache
          permission-contents: write
          permission-pull-requests: write

      - name: open (or recover) the bump PR
        if: steps.cmp.outputs.bump == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          AUDITOR_APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          CURRENT: ${{ steps.cmp.outputs.current }}
          LATEST: ${{ steps.cmp.outputs.latest }}
        # Recovery logic (orphaned-branch, closed/merged handling) lives in the
        # unit-tested bin/go-bump-open-pr.sh, exercised by
        # bin/go-bump-open-pr-test.sh in hygiene CI (audit R03).
        run: |
          set -euo pipefail
          gh auth setup-git
          ./bin/go-bump-open-pr.sh "$CURRENT" "$LATEST"

  # Persona UAT, weekly (REQ-UAT-001): on the Monday cron only (a dispatch does not run it), the five personas follow the docs AS
  # PUBLISHED with the latest release (checked out under release-docs) against that release's public image, resolved to its digest.
  # The harness is the root checkout (today's main, bin/), so a persona never edits the code that judges it; the released docs sit under release-docs/. Results stay
  # private exactly as in the release chain: pass/fail lines only, one encrypted artifact per persona, no issue; a blocking persona
  # fails this job. The model identities are environment SECRETS (masked); the token budget is the one variable.
  # GATE: the job runs only when the repository variable PERSONA_UAT_ENABLED is exactly 'true' (unset = off). The condition is on the JOB, so while it is off the
  # persona-uat environment is never entered and no token is minted.
  persona-uat:
    if: ${{ vars.PERSONA_UAT_ENABLED == 'true' && github.event.schedule == '43 6 * * 1' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    environment: persona-uat
    permissions:
      contents: read
      id-token: write
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: install the pinned crane binary
        run: ./bin/install-scanner.sh crane

      - name: resolve the latest release and its image digest
        id: resolve
        env:
          GH_REPO: ${{ github.repository }}
          REGISTRY_OWNER: ${{ github.repository_owner }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=$(gh release view --json tagName -q .tagName)
          digest=$(crane digest "ghcr.io/${REGISTRY_OWNER}/cache:${tag#v}")
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${REGISTRY_OWNER}/cache@${digest}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: release-docs
          ref: ${{ steps.resolve.outputs.tag }}
          persist-credentials: false

      - name: kind from the runner image
        run: kind version || { echo "::error::PIPELINE, no kind"; exit 1; }

      - name: pin pip (hash-checked)
        run: |
          python3 -m pip install --quiet --require-hashes --only-binary=:all: --break-system-packages -r .github/agent/pip-requirements.txt
          python3 -m pip --version

      - name: install the provider SDK (hash-pinned)
        run: |
          python3 -m pip install --quiet --break-system-packages --require-hashes --only-binary=:all: -r bin/persona-uat-requirements.txt

      - name: mint the federated identity token for the model provider
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const token = await core.getIDToken('https://api.anthropic.com');
            core.setSecret(token);
            const f = process.env.RUNNER_TEMP + '/anthropic-identity-token';
            fs.writeFileSync(f, token, { mode: 0o600 });
            // Print ONLY the identity claims the Anthropic federation rule matches on (never the token, which stays masked): a token-exchange 401 is then diagnosable.
            try {
              const payload = JSON.parse(Buffer.from(token.split('.')[1], 'base64url').toString('utf8'));
              const claims = {};
              for (const k of ['sub', 'aud', 'ref', 'job_workflow_ref', 'environment', 'repository', 'repository_owner_id', 'event_name', 'iss']) {
                claims[k] = payload[k];
              }
              core.info('OIDC identity claims (federation-rule inputs): ' + JSON.stringify(claims));
            } catch (e) {
              core.warning('could not decode OIDC claims for logging');
            }

      - name: keep the identity token fresh for the whole job (a detached refresher)
        # The assertion lives about five minutes, the job up to two hours and every model call is a NEW process. A timer inside
        # actions/github-script dies with its step, so this is a process of its own: detached (nohup, output redirected, disowned),
        # it re-mints from the runner's OIDC endpoint into the same 0600 file until the file is removed by the last step.
        run: |
          set -euo pipefail
          f="${RUNNER_TEMP}/anthropic-identity-token"
          [ -f "$f" ] || { echo "::error::the identity token file does not exist yet: mint it first"; exit 1; }
          nohup bash -c '
            f="$1"; every="$2"
            while [ -e "$f" ] && sleep "$every"; do
              [ -e "$f" ] || break
              python3 bin/persona-uat.py --mint-identity "$f" || { [ "$?" -eq 3 ] && break; continue; }
            done
          ' identity-refresher "$f" "${PERSONA_UAT_REFRESH_SECONDS:-60}" </dev/null >/dev/null 2>&1 &
          disown

      - name: run the five personas against the latest release
        env:
          PERSONA_UAT_MODEL: ${{ secrets.PERSONA_UAT_MODEL }}
          PERSONA_UAT_COMPLIANCE_MODEL: ${{ secrets.PERSONA_UAT_COMPLIANCE_MODEL }}
          PERSONA_UAT_TOKEN_BUDGET: ${{ vars.PERSONA_UAT_TOKEN_BUDGET }}
          ANTHROPIC_FEDERATION_RULE_ID: ${{ secrets.ANTHROPIC_FEDERATION_RULE_ID }}
          ANTHROPIC_ORGANIZATION_ID: ${{ secrets.ANTHROPIC_ORGANIZATION_ID }}
          ANTHROPIC_SERVICE_ACCOUNT_ID: ${{ secrets.ANTHROPIC_SERVICE_ACCOUNT_ID }}
          ANTHROPIC_WORKSPACE_ID: ${{ secrets.ANTHROPIC_WORKSPACE_ID }}
          ANTHROPIC_IDENTITY_TOKEN_FILE: ${{ runner.temp }}/anthropic-identity-token
          PERSONA_UAT_IMAGE: ${{ steps.resolve.outputs.image }}
        run: python3 bin/persona-uat.py --mode weekly --image "$PERSONA_UAT_IMAGE" --repo release-docs --out persona-uat-out --tools bin/persona-uat-tools.json --recipient bin/persona-uat-recipient.pem --agent "python3 bin/persona-uat-agent.py"

      - name: upload the encrypted reports and transcripts
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: persona-uat-encrypted
          path: persona-uat-out/*.cms
          if-no-files-found: error

      - name: delete the identity token file
        if: ${{ always() }}
        run: python3 bin/persona-uat.py --remove-identity "${RUNNER_TEMP}/anthropic-identity-token" || rm -f "${RUNNER_TEMP}/anthropic-identity-token" "${RUNNER_TEMP}/anthropic-identity-token.tmp"

  # The daily refresh of the build inputs (REQ-REFRESH-001-AC24 to AC31). One job in this workflow, main only,
  # on the daily schedule or by hand, never on a pull request. It looks for a newer version of every base package and build tool, adds what it
  # finds to the package archive (verified by signature and checksum), opens a pull request on its own refresh/ branch that moves the build to the
  # new versions, and stores the archive back in our own registry only if something changed. It never merges, never pushes to main.
  # Its own token is read-only plus packages: write (the archive store); the pull request is opened with the auditor App's token, minted exactly
  # as the check job mints it and handed to the two steps that open pull requests.
  refresh:
    name: refresh the build inputs and open the refresh pull request
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || github.event.schedule == '23 6 * * *') }}
    # one refresh at a time: two overlapping runs could each pass the open-pull-request check and each open a pull request (AC29)
    concurrency:
      group: refresh-inputs
      cancel-in-progress: false
    runs-on: ubuntu-latest
    environment: agent
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false   # the App token, via gh, is the only push credential

      # The very first thing is the key. Before any tool is installed, any registry is touched, any archive is pulled or any token is minted,
      # the live Wolfi signing key must be the one pinned in build/locks/archive-keys.sha256 (a difference, a missing or repeated line: exit 3, a human looks).
      - name: check the live Wolfi key against the pinned one
        run: ./bin/refresh-inputs.sh key-check --repo-dir "$GITHUB_WORKSPACE"

      - name: install apko and crane at their fixed locations
        run: |
          set -euo pipefail
          sudo ./bin/install-build-tools.sh apko /usr/local/bin
          sudo chown "$(id -un)" /usr/local/bin
          # crane is the installer's checksum-pinned release binary: nothing is compiled in this job, which holds the auditor App's key
          # (REQ-REL-011-AC1)
          ./bin/install-scanner.sh crane

      # The FIPS module version check asks whether OUR toolchain ships a newer FIPS module version, so it reads the checksum-pinned toolchain the recipes build
      # with (install-scanner.sh go: the version go.mod names, only when it is the pinned one), not whatever the newest 1.27.x on the runner is.
      - name: install the pinned Go toolchain
        run: |
          set -euo pipefail
          ./bin/install-scanner.sh go

      - name: log in to our registry with the job's own token
        env:
          REGISTRY_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s' "$REGISTRY_TOKEN" | /usr/local/bin/crane auth login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: pull the archive by its recorded digest
        if: ${{ hashFiles('build/archive.json') != '' }}
        run: |
          set -euo pipefail
          ./bin/archive-pull.sh --pointer build/archive.json --out "$RUNNER_TEMP/archive"
          find "$RUNNER_TEMP/archive" -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum > "$RUNNER_TEMP/archive.before"

      # The one state with no archive: build/archive.json is absent on main. The live Wolfi key must be the one pinned in
      # build/locks/archive-keys.sha256 (a difference, a missing or repeated line stops for a human: exit 3); the refresh step then
      # builds the archive from the committed base locks. Any other state (a pointer that is unreadable or does not resolve) fails closed above.
      - name: bootstrap the archive from the pinned Wolfi key
        if: ${{ hashFiles('build/archive.json') == '' }}
        run: |
          set -euo pipefail
          ./bin/refresh-inputs.sh bootstrap --repo-dir "$GITHUB_WORKSPACE" --archive "$RUNNER_TEMP/archive"
          find "$RUNNER_TEMP/archive" -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum > "$RUNNER_TEMP/archive.before"

      - name: check the live Wolfi key against the pulled archive
        run: |
          set -euo pipefail
          ./bin/refresh-inputs.sh archive-key-check --repo-dir "$GITHUB_WORKSPACE" --archive "$RUNNER_TEMP/archive"

      - name: mint the auditor App's token (exactly the auditor's scope)
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.AUDITOR_APP_ID }}
          private-key: ${{ secrets.AUDITOR_APP_PRIVATE_KEY }}
          repositories: cache
          permission-contents: write
          permission-pull-requests: write

      - name: refresh the inputs (stage the pull request)
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          AUDITOR_APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          set -euo pipefail
          ./bin/refresh-inputs.sh refresh --repo-dir "$GITHUB_WORKSPACE" --archive "$RUNNER_TEMP/archive" --pr-author "$AUDITOR_APP_SLUG" --plan-dir "$RUNNER_TEMP/plan"

      - name: check for a newer FIPS module version
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          AUDITOR_APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          set -euo pipefail
          ./bin/refresh-inputs.sh fips-module --go-root /usr/local/bin/fscache-go --repo-dir "$GITHUB_WORKSPACE" --pr-author "$AUDITOR_APP_SLUG" --plan-dir "$RUNNER_TEMP/plan"

      # Stored first (last step), so the pull request that moves the build to the new versions can carry the new pointer.
      # Only when something changed; an archive that no pull request points to is harmless.
      - name: store the archive when something changed
        id: store
        run: |
          set -euo pipefail
          after=$(find "$RUNNER_TEMP/archive" -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum)
          if [ "$after" = "$(cat "$RUNNER_TEMP/archive.before")" ]; then
            echo "the archive is unchanged: nothing stored"
          else
            digest=$(./bin/archive-push.sh --dir "$RUNNER_TEMP/archive")
            echo "digest=${digest}" >> "$GITHUB_OUTPUT"
            echo "the archive changed and was stored at ${digest}" | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - name: open the pull requests
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          AUDITOR_APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          STORED_DIGEST: ${{ steps.store.outputs.digest }}
        run: |
          set -euo pipefail
          if [ ! -d "$RUNNER_TEMP/plan" ]; then
            echo "nothing planned: no pull request"
            exit 0
          fi
          gh auth setup-git
          git config user.name "$AUDITOR_APP_SLUG[bot]"
          git config user.email "$AUDITOR_APP_SLUG[bot]@users.noreply.github.com"
          if [ -n "$STORED_DIGEST" ]; then
            ./bin/refresh-inputs.sh open-pr --plan-dir "$RUNNER_TEMP/plan" --repo-dir "$GITHUB_WORKSPACE" --pr-author "$AUDITOR_APP_SLUG" --archive "$RUNNER_TEMP/archive" --archive-digest "$STORED_DIGEST"
          else
            ./bin/refresh-inputs.sh open-pr --plan-dir "$RUNNER_TEMP/plan" --repo-dir "$GITHUB_WORKSPACE" --pr-author "$AUDITOR_APP_SLUG"
          fi
