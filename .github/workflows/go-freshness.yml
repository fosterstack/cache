name: Go toolchain freshness

# Scheduled Go-toolchain freshness check (audit follow-up). The v0.2.0
# scan failure was a Go stdlib CVE treadmill: the shipped binary was built
# with a go1.25.x that had since accumulated disclosed stdlib CVEs — and
# staying inside the 1.25 line could not clear CVE-2026-46600, whose only
# fix was in 1.26.6/1.27. So the rule is "newest patch of a SUPPORTED
# minor", not "newest patch of the current minor": the job may propose a
# minor bump (e.g. 1.26 -> 1.27) when a newer supported line exists, so a
# fix that lands only in a newer minor is not out of reach. go.dev's
# default release list (mode=json, without include=all) is exactly the
# set of currently supported minors and their latest patches; the newest
# of those is the target. The PR still goes through the required `scan`
# gate and human review before merge, so a minor jump is proposed, never
# auto-applied.
#
# NOTE: PRs opened with the built-in GITHUB_TOKEN do not themselves
# trigger other workflows, so the required `scan` check may need a manual
# nudge (an empty commit, or close/reopen) until a bot PAT is configured.
# The job says so in the PR body.

on:
  schedule:
    - cron: '23 6 * * *'    # the freshness check, daily
    - cron: '43 6 * * 1'    # mutation testing, weekly (Mondays)
  workflow_dispatch: {}     # runs both

permissions:
  contents: read

jobs:
  check:
    name: open the go.mod bump PR when a newer patch exists
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.schedule == '23 6 * * *' }}
    runs-on: ubuntu-latest
    # The bump PR is opened with the auditor App's token (owner, Oct 2: the repository setting that would let Actions'
    # own token open PRs stays off). The App's secrets live in the main-only `agent` environment; this job's own token
    # stays read-only, and only the bump step receives the App token.
    environment: agent
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false   # the App token, via gh, is the only push credential

      - name: compare go.mod against the newest patch of a supported minor
        id: cmp
        run: |
          set -euo pipefail
          current=$(awk '/^go /{print $2; exit}' go.mod)
          echo "current go directive: ${current}"
          # mode=json (WITHOUT include=all) lists only the currently
          # SUPPORTED releases — the two newest minors and their latest
          # patches. The max of those is the newest patch of a supported
          # minor; it is stable by construction (no rc/beta).
          latest=$(curl -fsSL 'https://go.dev/dl/?mode=json' \
            | jq -r '.[] | select(.stable==true) | .version' \
            | sed 's/^go//' | sort -V | tail -1)
          [ -n "$latest" ] || { echo "::error::could not determine the newest supported Go release from go.dev" >&2; exit 1; }
          echo "newest supported Go release: ${latest}"
          newest=$(printf '%s\n%s\n' "$current" "$latest" | sort -V | tail -1)
          if [ "$current" = "$latest" ] || [ "$newest" != "$latest" ]; then
            echo "go.mod is already at or ahead of the newest supported release — nothing to do"
            echo "bump=false" >> "$GITHUB_OUTPUT"
          else
            {
              echo "bump=true"
              echo "current=$current"
              echo "latest=$latest"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: mint the auditor App's token (exactly the auditor's scope)
        id: app-token
        if: steps.cmp.outputs.bump == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.AUDITOR_APP_ID }}
          private-key: ${{ secrets.AUDITOR_APP_PRIVATE_KEY }}
          repositories: cache
          permission-contents: write
          permission-pull-requests: write

      - name: open (or recover) the bump PR
        if: steps.cmp.outputs.bump == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          AUDITOR_APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          CURRENT: ${{ steps.cmp.outputs.current }}
          LATEST: ${{ steps.cmp.outputs.latest }}
        # Recovery logic (orphaned-branch, closed/merged handling) lives in the
        # unit-tested bin/go-bump-open-pr.sh, exercised by
        # bin/go-bump-open-pr-test.sh in hygiene CI (audit R03).
        run: |
          set -euo pipefail
          gh auth setup-git
          ./bin/go-bump-open-pr.sh "$CURRENT" "$LATEST"

  # Mutation testing (advisory), merged from mutation.yml (workflow consolidation, owner RATIFIED Oct 2): weekly on
  # its own schedule, never on the daily freshness schedule. test-strategy.md §6: coverage says the tests ran the
  # code; the mutation score says the tests would NOTICE the code being wrong. gremlins mutates the product and re-runs
  # the suite per mutant; a mutant the suite still passes ("lived") is a gap in assertion strength. ADVISORY - the
  # score is published, never gated, until the owner sets a baseline in .gremlins.yaml.
  mutation:
    name: mutation
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.schedule == '43 6 * * 1' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27'
          check-latest: true
      - name: install gremlins (pinned to the full commit of v0.6.0; the Go checksum database verifies the bytes)
        run: go install github.com/go-gremlins/gremlins/cmd/gremlins@e05b1d47b8c55748e50abc28ff6b132c536bacca   # v0.6.0
      # gremlins takes a DIRECTORY, not a Go package pattern: `./...`
      # produced "No results to report" and no JSON while exiting 0 (R10).
      # Each MODULE is scanned separately with its directory argument; the
      # root scan excludes the nested tools/requirements module (its own
      # go.mod, covered by its own suite). The mutation SCORE stays
      # advisory, but an absent/empty report or a tool failure is a
      # failure - a green run with no mutations is not a baseline.
      - name: unleash gremlins per module
        id: run
        run: |
          set -uo pipefail
          gobin="$(go env GOPATH)/bin"; export PATH="$gobin:$PATH"   # gremlins named literally (pin checker: advisor 0084)
          fail=0
          run_module() { # label, out.json, log, workdir, extra-args...
            local label="$1" out="$2" log="$3" wd="$4"; shift 4
            echo "== gremlins: ${label} =="
            ( cd "$wd" && gremlins unleash --output "$out" "$@" . ) 2>&1 | tee "$log"
            local rc="${PIPESTATUS[0]}"
            if [ "$rc" -ne 0 ]; then
              echo "::error::gremlins failed for ${label} (exit ${rc})" >&2; fail=1; return
            fi
            if [ ! -s "$out" ] || ! jq -e '.mutants_total > 0' "$out" >/dev/null 2>&1; then
              echo "::error::gremlins produced no mutations for ${label} - not a valid baseline" >&2; fail=1; return
            fi
          }
          run_module "root product module" /tmp/mutation-root.json /tmp/mutation-root.log "$GITHUB_WORKSPACE" -E 'tools/requirements/.*'
          run_module "tools/requirements module" /tmp/mutation-req.json /tmp/mutation-req.log "$GITHUB_WORKSPACE/tools/requirements"
          {
            echo "## Mutation testing (advisory)"
            echo
            echo "Tool: gremlins v0.6.0. The score is advisory (test-strategy §6); an absent or empty report fails the run, a low efficacy does not."
            for m in root req; do
              f="/tmp/mutation-${m}.json"
              if [ -s "$f" ]; then
                echo
                echo "### ${m} module"
                # gremlins' top-level mutants_total EXCLUDES timed-out and
                # not-covered mutants, so report ALL per-mutant statuses
                # from the file - a timeout is not a proven kill.
                jq -r '
                  ([.files[].mutations[].status] | group_by(.) | map({key: .[0], value: length}) | from_entries) as $st
                  | "- statuses: killed \($st.KILLED // 0), lived \($st.LIVED // 0), timed-out \($st["TIMED OUT"] // 0), not-covered \($st["NOT COVERED"] // 0), not-viable \($st["NOT VIABLE"] // 0)"
                  + "\n- total mutants generated: \([.files[].mutations[]] | length)  (gremlins mutants_total, which excludes timeouts/not-covered: \(.mutants_total))"
                  + "\n- test efficacy (advisory): \(.test_efficacy)%  mutant coverage: \(.mutations_coverage)%"
                  + "\n- NOTE: timed-out mutants are NOT counted as proven kills; the score is advisory."' "$f"
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"
          [ "$fail" -eq 0 ] || exit 1
      - name: upload the mutation reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-report
          path: |
            /tmp/mutation-root.json
            /tmp/mutation-root.log
            /tmp/mutation-req.json
            /tmp/mutation-req.log
          retention-days: 90

  # Persona UAT, weekly (owner ratified Oct 3 and Oct 4; REQ-UAT-001): on the Monday cron only, the five personas follow the docs AS
  # PUBLISHED with the latest release (checked out under release-docs) against that release's public image, resolved to its digest.
  # The harness is the root checkout (today's main, bin/), so a persona never edits the code that judges it; the released docs sit under release-docs/. Results stay
  # private exactly as in the release chain: pass/fail lines only, one encrypted artifact per persona, no issue; a blocking persona
  # fails this job. The model identities are environment SECRETS (masked); the token budget is the one variable.
  persona-uat:
    if: ${{ github.event.schedule == '43 6 * * 1' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    environment: persona-uat
    permissions:
      contents: read
      id-token: write
      packages: read
    steps:
      - name: resolve the latest release and its image digest
        id: resolve
        env:
          GH_REPO: ${{ github.repository }}
          REGISTRY_OWNER: ${{ github.repository_owner }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=$(gh release view --json tagName -q .tagName)
          digest=$(docker buildx imagetools inspect "ghcr.io/${REGISTRY_OWNER}/cache:${tag#v}" --format '{{.Manifest.Digest}}')
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${REGISTRY_OWNER}/cache@${digest}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: release-docs
          ref: ${{ steps.resolve.outputs.tag }}
          persist-credentials: false

      - name: install the pinned kind binary
        run: ./bin/install-scanner.sh kind

      - name: install the provider SDK (hash-pinned)
        run: |
          python3 -m pip install --quiet --break-system-packages --require-hashes --only-binary=:all: -r bin/persona-uat-requirements.txt

      - name: mint the federated identity token for the model provider
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const token = await core.getIDToken('https://api.anthropic.com');
            core.setSecret(token);
            const f = process.env.RUNNER_TEMP + '/anthropic-identity-token';
            fs.writeFileSync(f, token, { mode: 0o600 });
            core.exportVariable('ANTHROPIC_IDENTITY_TOKEN_FILE', f);
            // The assertion lives about five minutes, the job up to two hours and every model call is a new process: re-mint
            // into the same file every four minutes (the auditor's pattern); the driver removes the file when it is done.
            const refresh = async () => {
              try {
                const t = await core.getIDToken('https://api.anthropic.com');
                core.setSecret(t); fs.writeFileSync(f, t, { mode: 0o600 });
              } catch (e) { core.warning(`identity refresh failed: ${e}`); }
            };
            setInterval(refresh, 4 * 60 * 1000).unref?.();

      - name: run the five personas against the latest release
        env:
          PERSONA_UAT_MODEL: ${{ secrets.PERSONA_UAT_MODEL }}
          PERSONA_UAT_COMPLIANCE_MODEL: ${{ secrets.PERSONA_UAT_COMPLIANCE_MODEL }}
          PERSONA_UAT_TOKEN_BUDGET: ${{ vars.PERSONA_UAT_TOKEN_BUDGET }}
          ANTHROPIC_FEDERATION_RULE_ID: ${{ secrets.ANTHROPIC_FEDERATION_RULE_ID }}
          ANTHROPIC_ORGANIZATION_ID: ${{ secrets.ANTHROPIC_ORGANIZATION_ID }}
          ANTHROPIC_SERVICE_ACCOUNT_ID: ${{ secrets.ANTHROPIC_SERVICE_ACCOUNT_ID }}
          ANTHROPIC_WORKSPACE_ID: ${{ secrets.ANTHROPIC_WORKSPACE_ID }}
        run: python3 bin/persona-uat.py --mode weekly --image "${{ steps.resolve.outputs.image }}" --repo release-docs --out persona-uat-out --tools bin/persona-uat-tools.json --recipient bin/persona-uat-recipient.pem --agent "python3 bin/persona-uat-agent.py"

      - name: upload the encrypted reports and transcripts
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: persona-uat-encrypted
          path: persona-uat-out/*.cms
          if-no-files-found: error
