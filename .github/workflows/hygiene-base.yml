name: hygiene-base

# Register row 78, the half a pull request cannot change. On pull_request_target GitHub runs THIS
# file and the checker as they are on the base branch; the PR's files are checked out as data only
# (parsed, never executed; the token is read-only; no secrets). A PR that edits hygiene.yml cannot
# skip this job, and a PR that edits the checker is still judged by main's checker. A PR that
# changes the enforcement itself (the checker or this file) fails here by design: loosening it is
# the owner's merge (ruleset bypass), never an ordinary one. On push to main, main checks itself.
# No job-level `if:` and no path filter: the check always runs, so it never passes as "skipped".

on:
  pull_request_target:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  base:
    name: check-action-pins (base)
    runs-on: ubuntu-latest
    steps:
      - name: the checker (the base branch, or main on push)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: trusted
          persist-credentials: false
      - name: the PR's files, as data only
        if: github.event_name == 'pull_request_target'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
          persist-credentials: false
      - name: the enforcement is unchanged (changing it is the owner's merge)
        if: github.event_name == 'pull_request_target'
        run: |
          changed=0
          for f in bin/check-action-pins.py .github/workflows/hygiene-base.yml; do
            if ! cmp -s "trusted/$f" "candidate/$f"; then echo "::error::$f changes the enforcement"; changed=1; fi
          done
          exit "$changed"
      - name: every action and image reference is a digest (the base branch's checker)
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ github.event_name == 'pull_request_target' && 'candidate' || 'trusted' }}
        run: /usr/bin/python3 trusted/bin/check-action-pins.py --verify-tags "$TARGET"
