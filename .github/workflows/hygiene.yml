name: Public-repo hygiene

# Backstop for .githooks/pre-commit — catches anything committed without
# that hook installed/enabled (git hooks are opt-in per clone; CI is not).
# See bin/check-file-allowlist.sh for the one allowlist both share.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  allowlist:
    name: allowlist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: check every tracked file against the allowlist
        run: git ls-files | ./bin/check-file-allowlist.sh

      - name: allowlist branch-scoping regressions (auditor suppression lane)
        run: bash bin/check-file-allowlist-test.sh

      - name: govulncheck fixture modules materialize (never indexed by the dependency graph)
        run: bash .github/agent/tests/govulncheck-fixtures-test.sh

      - name: set up Python for the workflow-permission check
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: every reusable-workflow caller covers its callees' permissions (R01)
        run: |
          python3 -m pip install --quiet pyyaml
          python3 bin/check-workflow-permissions.py

      # The hash-pinned auditor requirements must RESOLVE: a lone Dependabot bump of pydantic-core
      # (pydantic pins it exactly) merged green twice (#106, #111) and broke every real/scheduled
      # auditor run at install. Resolving here makes such a bump fail the required check instead.
      - name: auditor Python requirements resolve (hash-pinned SDK + coverage tool)
        run: |
          for r in .github/agent/adjudicator-requirements.txt .github/agent/coverage-requirements.txt .github/agent/test-requirements.txt; do
            python3 -m pip install --quiet --dry-run --ignore-installed --require-hashes --only-binary=:all: \
              --target "$RUNNER_TEMP/resolve-check" -r "$r"
          done

      - name: auditor layout — everything auditor-related under .github/agent/ (REQ-AUD-18 AC1)
        run: git ls-files | python3 .github/agent/bin/auditor-layout-check.py

      - name: auditor suites — parser unit tests and the requirements-matrix suite
        run: |
          # the report lint renders with GitHub's own cmark-gfm (hash-pinned, test-only)
          python3 -m pip install --quiet --require-hashes --only-binary=:all: -r .github/agent/test-requirements.txt
          bash .github/agent/tests/auditor-parser-tests.sh
          bash .github/agent/tests/auditor-matrix-test.sh

      - name: privacy candidate-trace analyzer regressions (B03)
        run: bash bin/analyze-egress-trace-test.sh

      - name: scanner installer failure-path regressions (pinned-checksum contract)
        run: bash bin/install-scanner-test.sh

      - name: PR-gate image verdict regressions (row 57 — counts, did-not-run, VEX coverage)
        run: bash bin/inspector-gate-test.sh

      - name: VEX product-scope regressions (audit R01 — exception bound to the FosterStack product)
        run: |
          ./bin/install-scanner.sh grype
          bash bin/vex-scope-test.sh

      - name: VEX applied by both gate scanners (REQ-REL-004-AC1 — covered suppressed, uncovered blocks, zero packages fails)
        run: bash bin/vex-both-scanners-test.sh

      - name: Go-bump PR recovery regressions (audit R03 — orphaned branch / closed-merged)
        run: bash bin/go-bump-open-pr-test.sh

      # VEX tripwire (punch list #4b). A dependency we answered with a VEX
      # statement is answered on the facts as they were: golang-jwt is not
      # in the build at all, which is why CVE-2024-51744 does not apply to
      # us. If it ever enters go.sum, that premise is dead and the published
      # statement becomes a false public claim — the worst failure mode an
      # attestation has. Fail loudly and make someone re-check it.
      #
      # go.sum, not `go mod graph`: the graph lists modules that packages we
      # do not import happen to require, which is exactly the distinction
      # the VEX statement rests on.
      # Punch list #3c/#6c. Version literals in prose and commands rot at
      # the next release, and this class has bitten twice: a README
      # "Release pipeline (v0.1.0)" line, and an entire RELEASING.md
      # verification section built around one tag. Owner doctrine is that
      # "we need not forget" resolves to a mechanical check, never to
      # memory. This is that check, and it lands only now that every doc is
      # already clean, so it goes green on arrival rather than as a
      # standing red.
      - name: no unmarked version literals in public docs
        run: ./bin/check-version-literals.sh

      - name: VEX tripwire — components answered by a VEX statement must stay absent
        run: |
          set -euo pipefail
          if grep -q 'golang-jwt' go.sum; then
            echo "::error::golang-jwt has entered go.sum. The published VEX statement for CVE-2024-51744 claims component_not_present, which is no longer true on its face. VEX statement requires review before this can merge — see .vex/README.md." >&2
            exit 1
          fi
          echo "VEX tripwire: golang-jwt absent from go.sum, as the published statement asserts."

  # Register row 75 (the #133 lesson: three ruleset edits, each silently stalled
  # Dependabot). The ruleset on main and .github/policy/required-checks.json must
  # match exactly — contexts and integration IDs — on EVERY PR and every push to
  # main, so drift is red the day it happens, not when a bot PR quietly stalls.
  required-check-guard:
    name: required-check guard
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write        # the `required-check drift` issue (downgraded on fork/Dependabot runs)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: guard regressions (offline fixtures)
        run: bash bin/required-check-guard-test.sh

      # The verdict uses THIS tree's list, so a PR that fixes a stale list goes green on
      # its own run; on push to main the tree is main.
      - name: the ruleset on main vs this tree's required-checks.json
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash bin/required-check-guard.sh .github/policy/required-checks.json

      # The issue tracks drift ON MAIN (main's list vs the ruleset), whichever run sees it
      # first; one open issue, updated in place, never duplicated. Best effort: a
      # Dependabot or fork run has no issues:write, and the red check above still stands.
      - name: open or update the `required-check drift` issue when main's list has drifted
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -uo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/contents/.github/policy/required-checks.json?ref=main" \
            --jq '.content' | base64 -d > "${RUNNER_TEMP}/main-required-checks.json" || exit 0
          out=$(bash bin/required-check-guard.sh "${RUNNER_TEMP}/main-required-checks.json" 2>&1); rc=$?
          [ "$rc" -eq 1 ] || { echo "main's list vs the ruleset: rc ${rc} — no drift issue to open"; exit 0; }
          title="required-check drift"
          # shellcheck disable=SC2016  # literal Markdown backticks, not expansions
          {
            echo 'The ruleset on `main` and `.github/policy/required-checks.json` on `main` differ (contexts and integration IDs must both match, exactly). Until they agree the Dependabot auto-merge guard refuses every patch/minor PR and every PR hygiene run is red.'
            echo
            echo 'Fix whichever is wrong: the ruleset (owner, GitHub UI) or the list (a PR).'
            echo
            echo "Seen by ${RUN_URL}"
            echo
            echo '```'
            printf '%s\n' "${out}"
            echo '```'
          } > "${RUNNER_TEMP}/drift-body.md"
          n=$(gh issue list --state open --search "\"${title}\" in:title" --json number,title \
                | jq -r --arg t "$title" '[.[] | select(.title == $t)][0].number // empty')
          if [ -n "$n" ]; then gh issue edit "$n" --body-file "${RUNNER_TEMP}/drift-body.md" >/dev/null && echo "updated #${n}"
          else gh issue create --title "$title" --body-file "${RUNNER_TEMP}/drift-body.md"; fi
