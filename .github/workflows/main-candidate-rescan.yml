name: Daily main-candidate rescan

# The main-candidate half of the daily rescan (companion to
# daily-rescan.yml, which rescans every PUBLISHED release's digests).
# daily-rescan.yml cannot cover main: main's candidate is never pushed to
# a package, it is built from source. So this job builds main's latest
# candidate through the SAME build + image-assembly stages the release
# chain uses (mode snapshot/pr) and rescans it daily. The gate scanners
# from .github/policy/scanners.json run in the scan-main matrix — grype over
# the six OCI children + every archive, osv-scanner over the six children +
# the Go modules. Trivy (register row 45) and Snyk (row 44) left the CI gate
# and live HERE, each in its own daily job: trivy over the six children + the
# archives, snyk one container test per variant (3/day) inside the Free-plan
# quota. Any finding OPENS A TRACKING ISSUE, closing the window the audit
# called out: a CVE disclosed against code already on main, with no PR open,
# surfaces within 24h instead of at the next release. A scanner that cannot
# install/run is a pipeline failure (red), never a silent clean pass
# (bin/install-scanner.sh).

on:
  schedule:
    - cron: '41 7 * * *' # 30m after daily-rescan, same offset-from-hour habit
  workflow_dispatch: {}

# Top level stays read-only; the two reusable-stage caller jobs carry
# their own grants (which the callee ceilings require), and the scan job
# adds issues:write for the tracking issue. Keeping the default narrow
# means the scan job never holds packages/id-token/attestations.
permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/stage-build.yml
    permissions:
      contents: read
      id-token: write
      attestations: write
    with:
      mode: snapshot

  assemble:
    needs: build
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/stage-image.yml
    with:
      mode: pr
      dist-artifact: dist-snapshot
      expected-checksums: ${{ needs.build.outputs.checksums }}
      upload-oci: true

  scanners:
    name: read the scanner list
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      list: ${{ steps.read.outputs.list }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: read
        run: echo "list=$(jq -c '.scanners' .github/policy/scanners.json)" >> "$GITHUB_OUTPUT"

  scan-main:
    name: main candidate scan (${{ matrix.scanner }})
    needs: [build, assemble, scanners]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    strategy:
      fail-fast: false
      matrix:
        scanner: ${{ fromJSON(needs.scanners.outputs.list) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: oci-candidate
          path: /tmp/oci/

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: matrix.scanner == 'grype'
        with:
          name: dist-snapshot
          path: dist/

      - name: verify archives before scanning them
        if: matrix.scanner == 'grype'
        env:
          EXPECTED: ${{ needs.build.outputs.checksums }}
        run: |
          set -euo pipefail
          printf '%s\n' "${EXPECTED}" > /tmp/expected-checksums.txt
          (cd dist && sha256sum -c /tmp/expected-checksums.txt --ignore-missing --strict)

      - name: install ${{ matrix.scanner }} (pinned by checksum; can't-run is a pipeline failure, not a finding)
        run: ./bin/install-scanner.sh '${{ matrix.scanner }}'

      - name: scan every variant (both platforms) and every archive
        id: scan
        continue-on-error: true
        run: |
          set -uo pipefail
          s='${{ matrix.scanner }}'
          # Both gate scanners scan the six loaded children; grype also scans
          # the archives, osv-scanner also the Go modules.
          sudo apt-get update -qq && sudo apt-get install -y -qq skopeo || exit 1
          : > /tmp/refs.txt
          for v in production debug fips; do
            for arch in amd64 arm64; do
              ref="ghcr.io/fosterstack/cache:cand-${v}-${arch}"
              skopeo copy --override-arch "${arch}" --override-os linux "oci-archive:/tmp/oci/${v}.oci" "docker-daemon:${ref}" || exit 1
              echo "${ref}" >> /tmp/refs.txt
            done
          done
          if [ "$s" = osv-scanner ]; then
            rc=0
            while read -r ref; do
              echo "osv-scanner image: ${ref}"
              osv-scanner scan image "${ref}" || { c=$?; [ "$c" -gt "$rc" ] && rc=$c; }
            done < /tmp/refs.txt
            osv-scanner scan source go.mod tools/requirements/go.mod || { c=$?; [ "$c" -gt "$rc" ] && rc=$c; }
            [ "$rc" -eq 0 ] && exit 0
            [ "$rc" -eq 1 ] && { echo "::error::osv-scanner found vulnerabilities (images or Go modules)" >&2; exit 1; }
            echo "::error::osv-scanner could not run (exit ${rc})" >&2; exit 1
          else
            grype db update >/dev/null 2>&1 || true
            while read -r ref; do
              echo "grype: ${ref}"
              grype "docker:${ref}" --fail-on negligible --vex .vex/fosterstack-cache.openvex.json || exit 1
            done < /tmp/refs.txt
            for a in dist/*.tar.gz; do
              grype "file:${a}" --fail-on negligible --vex .vex/fosterstack-cache.openvex.json || exit 1
            done
          fi

      - name: file/update a tracking issue when the main candidate is not clean
        if: steps.scan.outcome == 'failure'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const scanner = '${{ matrix.scanner }}';
            const title = `Daily main-candidate rescan: ${scanner} is not clean on main`;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `The daily main-candidate rescan found that \`${scanner}\` did not pass against main's latest candidate (commit \`${context.sha}\`).\n\nThis is code already on \`main\` with no PR open, so the PR-time \`scan\` gate did not catch it — most likely a newly-disclosed CVE against unchanged bytes (the 24h-response case).\n\n- scanner: \`${scanner}\`\n- commit: \`${context.sha}\`\n- run: ${runUrl}\n\nPer policy: if an upstream fix exists, open the version-bump PR (a finding blocks the next release's \`scan\` gate regardless); if not, publish a VEX statement in \`.vex/\` (and a \`.snyk\` entry citing it) and a mitigation. If the scanner could not run at all, that is a pipeline failure to fix, not a finding.`;
            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo, state: 'open', labels: 'daily-rescan',
            });
            const match = existing.find(i => i.title === title);
            if (match) {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: match.number, body });
            } else {
              await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title, body, labels: ['daily-rescan', 'security'] });
            }

      - name: fail the run if this scanner was not clean (visible red, same bar as the gate)
        if: steps.scan.outcome == 'failure'
        run: |
          echo "::error::main-candidate rescan: ${{ matrix.scanner }} is not clean on main — see the tracking issue" >&2
          exit 1

  # Snyk's daily home (decision register row 44): it left the CI gate and now
  # runs here only, one container test per variant per day (3 tests/day),
  # inside the Snyk Free plan's container-test quota. It gates nothing; a
  # finding (or a could-not-run) opens the tracking issue like the others.
  snyk-main:
    name: main candidate snyk (daily, one per variant)
    needs: [build, assemble]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: oci-candidate
          path: /tmp/oci/
      - name: install snyk (pinned by checksum; can't-run is a pipeline failure, not a finding)
        run: ./bin/install-scanner.sh snyk
      - name: Snyk container test — one child per variant (row 44; Free-plan container quota)
        id: snyk
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          set -uo pipefail
          [ -n "${SNYK_TOKEN:-}" ] || { echo "::error::SNYK_TOKEN unavailable — a scanner that cannot run is a pipeline failure (red), not a clean pass" >&2; exit 1; }
          sudo apt-get update -qq && sudo apt-get install -y -qq skopeo || exit 1
          # Snyk exits 0 when out of monthly quota (or unauthorized); detect it
          # in the output and fail (could-not-run), never a silent clean pass.
          snyk_run() {
            local out rc
            out="$("$@" 2>&1)"; rc=$?
            printf '%s\n' "$out"
            if printf '%s' "$out" | grep -qiE 'reached your monthly limit|increase your tests limit|not authori[sz]ed|authentication error|re-?authenticate'; then
              echo "::error::Snyk could not run (quota exhausted or unauthorized) — scanner-could-not-run, not clean" >&2
              exit 1
            fi
            return $rc
          }
          for v in production debug fips; do
            ref="ghcr.io/fosterstack/cache:snyk-${v}"
            skopeo copy --override-arch amd64 --override-os linux "oci-archive:/tmp/oci/${v}.oci" "docker-daemon:${ref}" || exit 1
            echo "snyk: ${ref}"
            snyk_run snyk container test "${ref}" --org=fosterstack-admin || exit 1
          done
      - name: file/update a tracking issue when snyk is not clean
        if: steps.snyk.outcome == 'failure'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const title = "Daily main-candidate rescan: snyk is not clean on main";
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `Snyk's daily container test (one per variant) did not pass against main's latest candidate (commit \`${context.sha}\`).\n\n- run: ${runUrl}\n\nIf it is a finding, adjudicate it via the audit-lane VEX review; if snyk could not run (quota/auth), that is a pipeline failure to fix, not a finding. Snyk is not a CI gate (row 44), so this does not block merges — it is the daily signal.`;
            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo, state: 'open', labels: 'daily-rescan',
            });
            const match = existing.find(i => i.title === title);
            if (match) {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: match.number, body });
            } else {
              await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title, body, labels: ['daily-rescan', 'security'] });
            }
      - name: fail the run if snyk was not clean
        if: steps.snyk.outcome == 'failure'
        run: |
          echo "::error::main-candidate snyk is not clean on main — see the tracking issue" >&2
          exit 1

  # Trivy's daily home (decision register row 45): it left the CI gate and
  # runs here once a day over the same candidate — the six OCI children plus
  # every dist archive — at the block-at-any-severity / VEX-only policy. It
  # gates nothing; a finding (or could-not-run) opens the tracking issue.
  trivy-main:
    name: main candidate trivy (daily)
    needs: [build, assemble]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: oci-candidate
          path: /tmp/oci/
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist-snapshot
          path: dist/
      - name: verify archives before scanning them
        env:
          EXPECTED: ${{ needs.build.outputs.checksums }}
        run: |
          set -euo pipefail
          printf '%s\n' "${EXPECTED}" > /tmp/expected-checksums.txt
          (cd dist && sha256sum -c /tmp/expected-checksums.txt --ignore-missing --strict)
      - name: install trivy (pinned by checksum; can't-run is a pipeline failure, not a finding)
        run: ./bin/install-scanner.sh trivy
      - name: Trivy scan (six children + every archive)
        id: trivy
        continue-on-error: true
        env:
          TRIVY_VEX: ${{ github.workspace }}/.vex/fosterstack-cache.openvex.json
        run: |
          set -uo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq skopeo || exit 1
          : > /tmp/refs.txt
          for v in production debug fips; do
            for arch in amd64 arm64; do
              ref="ghcr.io/fosterstack/cache:cand-${v}-${arch}"
              skopeo copy --override-arch "${arch}" --override-os linux "oci-archive:/tmp/oci/${v}.oci" "docker-daemon:${ref}" || exit 1
              echo "${ref}" >> /tmp/refs.txt
            done
          done
          trivy image --download-db-only >/dev/null 2>&1 || true
          while read -r ref; do
            echo "trivy: ${ref}"
            trivy image --quiet --exit-code 1 --severity CRITICAL,HIGH,MEDIUM,LOW,UNKNOWN --vex "${TRIVY_VEX}" "${ref}" || exit 1
          done < /tmp/refs.txt
          for a in dist/*.tar.gz; do
            tmp=$(mktemp -d); tar xzf "$a" -C "$tmp"
            trivy rootfs --quiet --exit-code 1 --severity CRITICAL,HIGH,MEDIUM,LOW,UNKNOWN --vex "${TRIVY_VEX}" "$tmp" || { rm -rf "$tmp"; exit 1; }
            rm -rf "$tmp"
          done
      - name: file/update a tracking issue when trivy is not clean
        if: steps.trivy.outcome == 'failure'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const title = "Daily main-candidate rescan: trivy is not clean on main";
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `Trivy's daily scan (six OCI children + every archive) did not pass against main's latest candidate (commit \`${context.sha}\`).\n\n- run: ${runUrl}\n\nIf it is a finding, adjudicate it via the audit-lane VEX review; if trivy could not run, that is a pipeline failure to fix, not a finding. Trivy is not a CI gate (row 45), so this does not block merges — it is the daily signal.`;
            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo, state: 'open', labels: 'daily-rescan',
            });
            const match = existing.find(i => i.title === title);
            if (match) {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: match.number, body });
            } else {
              await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title, body, labels: ['daily-rescan', 'security'] });
            }
      - name: fail the run if trivy was not clean
        if: steps.trivy.outcome == 'failure'
        run: |
          echo "::error::main-candidate trivy is not clean on main — see the tracking issue" >&2
          exit 1

  # The daily auditor (auditor.yml) consumes this run: it needs the candidate's recorded
  # digest (to assert it loaded the right image) and, in production, the scanners' JSON
  # reports (so REQ-AUD-1 AC2 — "consume the rescan's own scan output" — holds without the
  # auditor re-scanning). This job GATES NOTHING (mirrors the trivy/snyk daily jobs): it
  # writes machine-readable reports and uploads them with if: always(), so even a day the
  # candidate is red still hands the auditor its inputs.
  scanner-reports:
    name: scanner reports for the daily auditor (non-gating)
    needs: [build, assemble]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: oci-candidate
          path: /tmp/oci/
      - name: install scanners (pinned by checksum)
        run: for s in grype trivy osv-scanner; do ./bin/install-scanner.sh "$s" || true; done
      - name: load the candidates and emit JSON reports + recorded digests
        continue-on-error: true
        run: |
          set -uo pipefail
          command -v skopeo >/dev/null 2>&1 || sudo apt-get update -qq && sudo apt-get install -y -qq skopeo || true
          mkdir -p /tmp/reports
          : > /tmp/reports/candidate-digests.json
          python3 - <<'PY'
          import json, subprocess, os
          digs = {}
          for v in ("production", "debug", "fips"):
              oci = "/tmp/oci/%s.oci" % v
              if not os.path.exists(oci):
                  continue
              ref = "ghcr.io/fosterstack/cache:cand-%s" % v
              subprocess.run(["skopeo", "copy", "oci-archive:%s" % oci, "docker-daemon:%s" % ref], check=False)
              d = subprocess.run(["skopeo", "inspect", "--format", "{{.Digest}}", "docker-daemon:%s" % ref],
                                 capture_output=True, text=True).stdout.strip()
              if d:
                  digs[v] = d
          json.dump(digs, open("/tmp/reports/candidate-digests.json", "w"), indent=1)
          print("recorded digests:", digs)
          PY
          ref="ghcr.io/fosterstack/cache:cand-production"
          grype "docker:${ref}" -o json > /tmp/reports/grype.json 2>/dev/null || true
          trivy image --quiet --format json "${ref}" > /tmp/reports/trivy.json 2>/dev/null || true
          osv-scanner scan image --format json "${ref}" > /tmp/reports/osv-image.json 2>/dev/null || true
          osv-scanner scan source --format json ./go.mod > /tmp/reports/osv-gomod.json 2>/dev/null || true
      - uses: actions/upload-artifact@v7
        if: ${{ always() }}
        with:
          name: rescan-scanner-reports
          include-hidden-files: true
          path: /tmp/reports
