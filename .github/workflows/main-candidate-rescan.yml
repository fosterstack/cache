name: Daily main-candidate rescan

# The daily rescan: main's candidate (below) and, merged from daily-rescan.yml (consolidation 3 of 4), the CURRENT
# published release's digests only (the manifests and rescan jobs at the end; REQ-REL-004-AC5). main's candidate is never pushed to a package; this builds it from source through the
# same build + image-assembly stages the release chain uses, then runs the scanner panel (scanner-panel rules
# 1-9, ratified by the owner Oct 2; REQ-SCAN-001..009): Grype, Docker Scout and Amazon Inspector on the four
# images (production and fips, each on both architectures), Google Artifact Analysis on the two variants on linux/amd64, tallied together by bin/panel.py —
# package counts and quorum, the published VEX as the only exception, "seen by N of M", a tracking issue for
# findings seen by two or more scanners; unique findings are listed for the daily auditor, whose run audits them
# right after this one (REQ-REL-004-AC3, amended Oct 2; rule 9, owner Oct 3). Trivy and Snyk are no longer run by the panel, and the auditor reads the panel's verdict instead of scanning (handoff 0600).
on:
  schedule:
    - cron: '41 7 * * *' # offset from the hour; the published-release rescan runs in this same run
  workflow_dispatch: {}

# Top level stays read-only; the two reusable-stage caller jobs carry
# their own grants (which the callee ceilings require), and the scan job
# adds issues:write for the tracking issue. Keeping the default narrow
# means the scan job never holds packages/id-token/attestations.
permissions:
  contents: read

# One rescan at a time, none cancelled: the scratch package's prune and pushes are not safe to interleave.
concurrency:
  group: main-candidate-rescan
  cancel-in-progress: false

jobs:
  # The candidate build (REQ-CHAIN-004-AC12, AC14): Build in SNAPSHOT mode, no tag and no admission; the callers' grants are a static ceiling (read only: the building jobs hold no identity token).
  build:
    uses: ./.github/workflows/stage-build.yml
    permissions:
      contents: read
      checks: read
      statuses: read
      pull-requests: read
    with:
      mode: snapshot

  # ---------------------------------------------------------------------------------------------------------------
  # Our OpenVEX as the attestation children of each candidate's index (REQ-REL-010 on the rescan; handoff 0521, owner Oct 20: "this is
  # the preferred path - it gets us knowing our auditor works for a while before launch"). Docker Scout has applied our statements
  # only this way (probe 0221, run 37555367665: by tag and by exact index digest); every local-file and daemon-loaded form failed.
  # An attestation survives only in a registry, so the attested candidates go to the SCRATCH package ghcr.io/fosterstack/cache-scout-probe
  # (the one package bin/scout-root-cause.sh already writes; never the release package, never any other tag than the attested candidates
  # and the self-check fixtures), and the same run prunes it to the newest 14 days. Releases are unchanged.
  vex-attach:
    name: attach our OpenVEX to each candidate index and push the attested candidates (scratch package)
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # the scratch package only; the token cannot be narrower, the steps below name that one package
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: images
          path: /tmp/oci/
      - name: skopeo is on the runner image
        run: command -v skopeo > /dev/null || { echo "::error::skopeo is not on this runner image"; exit 1; }
      - name: log in to GHCR (the scratch package)
        env:
          GH_TOKEN: ${{ github.token }}
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      # Condition (b) of the approval: the scratch package holds the newest 14 days of versions, pruned in the run that adds to it. It runs
      # FIRST, so nothing this run pushes can lose its version to it, and it is strict: a listing that fails (other than "no such package
      # yet") or a delete that fails fails the job, never a green run that kept old versions.
      - name: prune the scratch package to the newest 14 days
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          cutoff=$(date -u -d '14 days ago' +%Y-%m-%dT%H:%M:%SZ 2>/dev/null || date -u -v-14d +%Y-%m-%dT%H:%M:%SZ)   # GNU date on the runner, BSD date on a laptop
          pkg="orgs/${GITHUB_REPOSITORY_OWNER}/packages/container/cache-scout-probe"
          # Only the package's own lookup may say "none yet" (HTTP 404); once it exists, any listing failure, a 404 included, fails the job.
          if vis=$(gh api "${pkg}" --jq .visibility 2>"$RUNNER_TEMP/prune.err"); then
            echo "== the scratch package ghcr.io/fosterstack/cache-scout-probe: visibility ${vis}; keeping versions updated since ${cutoff}" | tee -a "$GITHUB_STEP_SUMMARY"
            if ! ids=$(gh api --paginate "${pkg}/versions?per_page=100" --jq ".[] | select(.updated_at < \"${cutoff}\") | .id" 2>"$RUNNER_TEMP/prune.err"); then
              cat "$RUNNER_TEMP/prune.err" >&2; echo "::error::could not list the scratch package's versions, so it could not be pruned"; exit 1
            fi
          elif grep -q "HTTP 404" "$RUNNER_TEMP/prune.err"; then
            ids=""; echo "no scratch package yet; nothing to prune" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            cat "$RUNNER_TEMP/prune.err" >&2; echo "::error::could not look up the scratch package, so it could not be pruned"; exit 1
          fi
          n=0; kept=0; failed=0
          for id in ${ids}; do
            if gh api -X DELETE "${pkg}/versions/${id}" >/dev/null 2>"$RUNNER_TEMP/prune.err"; then n=$((n + 1))
            # GitHub never deletes a public package version with more than 5000 downloads (only its support can); that exact refusal is kept and named, any other failure still fails the job.
            elif grep -q "Publicly visible package versions with more than 5000 downloads cannot be deleted" "$RUNNER_TEMP/prune.err"; then kept=$((kept + 1)); echo "::warning::scratch version ${id} kept: GitHub does not delete a public package version with more than 5000 downloads"
            else cat "$RUNNER_TEMP/prune.err" >&2; failed=$((failed + 1)); fi
          done
          echo "pruned ${n} scratch version(s) older than 14 days; ${kept} kept (public, over 5000 downloads, GitHub will not delete them); ${failed} could not be deleted" | tee -a "$GITHUB_STEP_SUMMARY"
          [ "${failed}" -eq 0 ] || { echo "::error::${failed} scratch version(s) older than 14 days could not be deleted"; exit 1; }
      # Build's assemble has already given each candidate layout its attestation children (our OpenVEX, one per platform: REQ-REL-010-AC1) and
      # moved the layout's digest file to the final index. Each candidate is therefore copied, checked against Build's own digest file and as a whole
      # layout, and pushed AS BUILT by skopeo with its digests kept; the digest skopeo reports for the pushed index must be the final index's, or the job
      # fails. The attestation tool is not run on these layouts again (it refuses a second run); it runs only on the unattested self-check fixture below.
      - name: push each candidate index as Build attested it
        run: |
          set -euo pipefail
          mkdir -p /tmp/layout /tmp/attach
          jq -n '{}' > /tmp/attach/digests.json
          for v in production fips; do
            d="/tmp/layout/${v}"; rm -rf "${d}"; mkdir -p /tmp/layout
            cp -R "/tmp/oci/${v}" "${d}"
            chmod -R go-w "${d}"
            final=$(jq -er '.manifests | if length == 1 then .[0].digest else error("the layout does not hold exactly one index") end' "${d}/index.json")
            [ "$(cat "/tmp/oci/${v}.digest")" = "${final}" ] || { echo "::error::the ${v} layout names ${final}, not the digest Build recorded"; exit 1; }
            python3 bin/release-layout.py "${d}" "${final}"
            tag="cand-${GITHUB_RUN_ID}-${v}"
            skopeo copy --all --digestfile "/tmp/attach/${v}.pushed" "oci:${d}" "docker://ghcr.io/fosterstack/cache-scout-probe:${tag}"
            pushed=$(cat "/tmp/attach/${v}.pushed")
            [ "${pushed}" = "${final}" ] || { echo "::error::the registry took ${pushed} for ${v}, not the final index ${final}"; exit 1; }
            jq --arg v "${v}" --arg d "${final}" '. + {($v): $d}' /tmp/attach/digests.json > /tmp/attach/next.json
            mv /tmp/attach/next.json /tmp/attach/digests.json
            echo "${v}: final index ${final} (ghcr.io/fosterstack/cache-scout-probe:${tag})"
          done
      # The Scout self-check fixtures (rule 4): the pinned debian 12.0 linux/amd64 image wrapped in a one-child index (public image bytes), plain as the control and with an attestation
      # of OUR author that covers only CVE-2023-4911, in our published product form, with the fixture's glibc package as the subcomponent (every statement Scout applied in the Oct 23 root-cause round
      # named the package as a subcomponent of the product; the self-check statement named none and the self-check failed). Two tags, pruned like the rest.
      - name: build the Scout self-check fixtures and push them
        run: |
          set -euo pipefail
          rm -rf /tmp/layout/fixture /tmp/layout/fixture-image; mkdir -p /tmp/layout
          # the pinned digest is debian 12.0's linux/amd64 image manifest, not its index: skopeo's layout of it holds one IMAGE descriptor, so it is wrapped
          # into a one-child OCI index here (the shape of the candidate layouts), and the attestation tool's check of the layout is not loosened
          skopeo copy --all docker://docker.io/library/debian@sha256:60774985572749dc3c39147d43089d53e7ce17b844eebcf619d84467160217ab oci:/tmp/layout/fixture-image
          cp -R /tmp/layout/fixture-image /tmp/layout/fixture
          child=$(jq -ec '.manifests | if length == 1 then .[0] | {mediaType, digest, size} + {platform: {architecture: "amd64", os: "linux"}} else error("the fixture image layout is not one manifest") end' /tmp/layout/fixture-image/index.json)
          jq -nc --argjson c "${child}" '{schemaVersion: 2, mediaType: "application/vnd.oci.image.index.v1+json", manifests: [$c]}' > /tmp/layout/fixture/index.tmp
          idx=$(sha256sum /tmp/layout/fixture/index.tmp | cut -d' ' -f1)
          mv /tmp/layout/fixture/index.tmp "/tmp/layout/fixture/blobs/sha256/${idx}"
          jq -nc --arg d "sha256:${idx}" --argjson s "$(wc -c < "/tmp/layout/fixture/blobs/sha256/${idx}")" '{schemaVersion: 2, mediaType: "application/vnd.oci.image.index.v1+json", manifests: [{mediaType: "application/vnd.oci.image.index.v1+json", digest: $d, size: $s}]}' > /tmp/layout/fixture/index.json
          chmod -R go-w /tmp/layout/fixture
          jq --arg p "pkg:oci/cache?repository_url=ghcr.io/fosterstack/cache" '.["@id"] = "https://github.com/fosterstack/cache/scout-selfcheck" | .timestamp = "2026-10-03T00:00:00Z" | .version = 1
            | .statements = [{"vulnerability": {"name": "CVE-2023-4911"}, "status": "not_affected",
                              "justification": "vulnerable_code_not_present", "products": [{"@id": $p, "subcomponents": [{"@id": "pkg:deb/debian/glibc@2.36-9?os_distro=bookworm&os_name=debian&os_version=12"}]}]}]' .vex/fosterstack-cache.openvex.json > /tmp/attach/selfcheck-ours.json
          before=$(jq -er '.manifests | if length == 1 then .[0].digest else error("the fixture is not one index") end' /tmp/layout/fixture/index.json)
          skopeo copy --all --digestfile /tmp/attach/before.pushed oci:/tmp/layout/fixture "docker://ghcr.io/fosterstack/cache-scout-probe:selfcheck-before-${GITHUB_RUN_ID}"
          [ "$(cat /tmp/attach/before.pushed)" = "${before}" ] || { echo "::error::the registry took $(cat /tmp/attach/before.pushed) for the plain fixture, not ${before}"; exit 1; }
          rm -rf /tmp/layout/fixture-ours; cp -R /tmp/layout/fixture /tmp/layout/fixture-ours
          python3 bin/vex-index.py layout --layout /tmp/layout/fixture-ours --vex /tmp/attach/selfcheck-ours.json
          final=$(jq -er '.manifests | if length == 1 then .[0].digest else error("not one index") end' /tmp/layout/fixture-ours/index.json)
          python3 bin/vex-index.py verify-layout --layout /tmp/layout/fixture-ours --vex /tmp/attach/selfcheck-ours.json --base-digest "${before}"
          skopeo copy --all --digestfile /tmp/attach/ours.pushed oci:/tmp/layout/fixture-ours "docker://ghcr.io/fosterstack/cache-scout-probe:selfcheck-ours-${GITHUB_RUN_ID}"
          [ "$(cat /tmp/attach/ours.pushed)" = "${final}" ] || { echo "::error::the registry took $(cat /tmp/attach/ours.pushed) for the attested fixture, not ${final}"; exit 1; }
          jq --arg b "${before}" --arg o "${final}" '. + {"fixture-before": $b, "fixture-ours": $o}' /tmp/attach/digests.json > /tmp/attach/next.json && mv /tmp/attach/next.json /tmp/attach/digests.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vex-attach
          path: /tmp/attach/digests.json
          if-no-files-found: error
          retention-days: 1

  # ---------------------------------------------------------------------------------------------------------
  # The scanner panel (scanner-panel rules 1-9, ratified Oct 2; REQ-SCAN-001..009). Four scanner jobs, each
  # leaving its raw output per image for the tally; the set of images is written here, never computed:
  # Grype, Docker Scout and Amazon Inspector scan all four images (production and fips on both architectures); Google scans the two variants on
  # linux/amd64 only. Trivy and Snyk are not in the panel (rule 1). A scanner job that fails leaves fewer
  # outputs, which the tally counts as "did not run" (rule 3) — never as clean.
  panel-grype:
    name: panel — Grype (four images)
    needs: [build]
    runs-on: ubuntu-latest
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: images
          path: /tmp/oci/
      - name: install grype (pinned by checksum)
        run: ./bin/install-scanner.sh grype
      - name: Grype every image, given our VEX (rule 4)
        run: |
          set -uo pipefail
          ./bin/install-scanner.sh crane      # the chain's own copy tool (pinned by checksum): the built-index probe appends by digest with it
          # Only the VEX file may hide a finding (rule 4): grype reads an EMPTY config here, never the repository's, and a GRYPE_* variable (which can change
          # what it reports) stops the step, as in bin/grype-scan.sh and bin/check-scan.sh. Names only are printed, never values.
          bad_env=$(compgen -e | grep '^GRYPE_' | grep -vx 'GRYPE_DB_CACHE_DIR\|GRYPE_DB_AUTO_UPDATE' | tr '\n' ' ' || true)
          if [ -n "${bad_env}" ]; then
            echo "::error::grype: ${bad_env}set in the environment; only the VEX document may hide a finding, refusing to run" >&2
            exit 2
          fi
          : > "$RUNNER_TEMP/empty-grype.yaml"
          grype db update -c "$RUNNER_TEMP/empty-grype.yaml" >/dev/null 2>&1 || true
          mkdir -p /tmp/arc   # the tars stay out of /tmp/panel, which is uploaded
          for v in production fips; do
            for arch in amd64 arm64; do
              ref="ghcr.io/fosterstack/cache:cand-${v}-${arch}"; d="/tmp/panel/grype/${v}-${arch}"; mkdir -p "$d"
              ./bin/layout-archive.sh "/tmp/oci/${v}" "${arch}" "/tmp/arc/${v}-${arch}.tar" "${ref}" > /dev/null \
                || continue
              grype "docker-archive:/tmp/arc/${v}-${arch}.tar" -c "$RUNNER_TEMP/empty-grype.yaml" \
                --vex .vex/fosterstack-cache.openvex.json -o "cyclonedx-json=${d}/result.cdx.json" \
                || { rm -rf "${d}"; echo "::warning::grype could not scan ${v}-${arch} (the tally counts it as did not run)"; }
            done
          done
      - id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() }}
        with:
          name: panel-grype
          path: /tmp/panel/
          if-no-files-found: warn

  panel-scout:
    name: panel — Docker Scout (four images)
    needs: [build, vex-attach]
    runs-on: ubuntu-latest
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    environment: agent   # the read-only Docker Hub token for Scout lives here (owner, Oct 2)
    permissions:
      contents: read
      packages: read   # the attested candidates in the scratch package, read only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vex-attach
          path: ${{ runner.temp }}/attach
      - name: install docker-scout (pinned by checksum)
        run: |
          set -euo pipefail
          ./bin/install-scanner.sh docker-scout "$RUNNER_TEMP"
          mkdir -p "$HOME/.docker/cli-plugins" && install -m 0755 "$RUNNER_TEMP/docker-scout" "$HOME/.docker/cli-plugins/docker-scout"
      - name: log in to Docker Hub for Scout (read-only token)
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_SCOUT_TOKEN: ${{ secrets.DOCKERHUB_SCOUT_TOKEN }}
        run: printf '%s' "$DOCKERHUB_SCOUT_TOKEN" | docker login docker.io -u "$DOCKERHUB_USERNAME" --password-stdin
      - name: log in to GHCR (read only, the scratch package)
        env:
          GH_TOKEN: ${{ github.token }}
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      # Scout applies a statement only when its author matches --vex-author (default Docker's own) AND only through the index's
      # attestation (every local form failed, Oct 3-6). The self-check scans the pinned debian fixture twice by exact index digest,
      # plain and with our attestation covering only CVE-2023-4911 (built by the vex-attach job in the registry); bin/scout-selfcheck.py
      # passes only when exactly that CVE drops and every other finding stays (rule 4, REQ-SCAN-004-AC2), and refuses an empty or
      # malformed report. A red self-check keeps the rescan red (fail closed): Scout never scans the candidates behind it.
      - name: Scout applies our attestation to a fixture index (rule 4 self-check)
        run: |
          set -euo pipefail
          before=$(jq -er '."fixture-before"' "$RUNNER_TEMP/attach/digests.json")
          after=$(jq -er '."fixture-ours"' "$RUNNER_TEMP/attach/digests.json")
          mkdir -p "$RUNNER_TEMP/selfcheck"
          docker scout cves --format gitlab --vex-author '^FosterStack LLC$' --platform linux/amd64 "registry://ghcr.io/fosterstack/cache-scout-probe@${before}" > "$RUNNER_TEMP/selfcheck/before.json"
          docker scout cves --format gitlab --vex-author '^FosterStack LLC$' --platform linux/amd64 "registry://ghcr.io/fosterstack/cache-scout-probe@${after}" > "$RUNNER_TEMP/selfcheck/after.json"
          python3 bin/scout-selfcheck.py "$RUNNER_TEMP/selfcheck/before.json" "$RUNNER_TEMP/selfcheck/after.json" CVE-2023-4911
      - name: Docker Scout every image, given our VEX as the index's attestation (rule 4)
        run: |
          set -uo pipefail
          for v in production fips; do
            dig=$(jq -er --arg v "${v}" '.[$v]' "$RUNNER_TEMP/attach/digests.json") || { echo "::warning::no attested digest for ${v} (the tally counts both its images as did not run)"; continue; }
            for arch in amd64 arm64; do
              d="/tmp/panel/scout/${v}-${arch}"; mkdir -p "$d"
              docker scout sbom --format json --platform "linux/${arch}" "registry://ghcr.io/fosterstack/cache-scout-probe@${dig}" > "${d}/sbom.json" \
                && docker scout cves --format gitlab --vex-author '^FosterStack LLC$' --platform "linux/${arch}" "registry://ghcr.io/fosterstack/cache-scout-probe@${dig}" > "${d}/cves.json" \
                || { rm -rf "${d}"; echo "::warning::docker scout could not scan ${v}-${arch} (the tally counts it as did not run)"; }
            done
          done
      # What the first runs must tell us (handoff 0521 read-back, 5a and 5b): does Scout honor the attestation per platform of an index
      # (5a), by tag as well as by digest? Printed to the job summary, never deciding the job. It runs after a failed self-check too (!cancelled(), not always(): a cancelled run does not start five more scans): that is when its data is needed.
      - name: Scout attestation diagnostics (REQ-REL-010-AC6; printed, never decides)
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        run: |
          set +e
          (
            set -uo pipefail
              before=$(jq -er '."fixture-before"' "$RUNNER_TEMP/attach/digests.json")
            ours=$(jq -er '."fixture-ours"' "$RUNNER_TEMP/attach/digests.json")
            mkdir -p "$RUNNER_TEMP/diag"
            n() { jq '[.vulnerabilities[]?.identifiers[]?.value] | length' "$1"; }
            has() { jq --arg c CVE-2023-4911 '[.vulnerabilities[]?.identifiers[]?.value] | any(. == $c)' "$1"; }
            docker scout cves --format gitlab --vex-author '^FosterStack LLC$' --platform linux/amd64 "registry://ghcr.io/fosterstack/cache-scout-probe@${before}" > "$RUNNER_TEMP/diag/before.json"
            docker scout cves --format gitlab --vex-author '^FosterStack LLC$' --platform linux/amd64 "registry://ghcr.io/fosterstack/cache-scout-probe@${ours}" > "$RUNNER_TEMP/diag/ours-amd64.json"
            docker scout cves --format gitlab --vex-author '^FosterStack LLC$' --platform linux/arm64 "registry://ghcr.io/fosterstack/cache-scout-probe@${ours}" > "$RUNNER_TEMP/diag/ours-arm64.json"
            docker scout cves --format gitlab --vex-author '^FosterStack LLC$' "registry://ghcr.io/fosterstack/cache-scout-probe@${ours}" > "$RUNNER_TEMP/diag/ours-noplatform.json"
            docker scout cves --format gitlab --vex-author '^FosterStack LLC$' --platform linux/amd64 "registry://ghcr.io/fosterstack/cache-scout-probe:selfcheck-ours-${GITHUB_RUN_ID}" > "$RUNNER_TEMP/diag/ours-tag.json"
            {
              echo "== 5a/5b: Scout and our attestation on the debian fixture (CVE-2023-4911 present before: $(has "$RUNNER_TEMP/diag/before.json"), $(n "$RUNNER_TEMP/diag/before.json") findings)"
              echo "- our product form, amd64 platform, exact digest: CVE kept=$(has "$RUNNER_TEMP/diag/ours-amd64.json"), findings $(n "$RUNNER_TEMP/diag/ours-amd64.json")"
              echo "- our product form, arm64 platform, exact digest: CVE kept=$(has "$RUNNER_TEMP/diag/ours-arm64.json"), findings $(n "$RUNNER_TEMP/diag/ours-arm64.json")"
              echo "- our product form, no --platform, exact digest: CVE kept=$(has "$RUNNER_TEMP/diag/ours-noplatform.json"), findings $(n "$RUNNER_TEMP/diag/ours-noplatform.json")"
              echo "- our product form, by tag: CVE kept=$(has "$RUNNER_TEMP/diag/ours-tag.json"), findings $(n "$RUNNER_TEMP/diag/ours-tag.json")"
            } | tee -a "$GITHUB_STEP_SUMMARY"
          )
          rc=$?
          set -e
          mkdir -p /tmp/panel && cp -r "$RUNNER_TEMP/diag" /tmp/panel/scout-diag 2>/dev/null || true   # the raw reports, in the job's artifact
          [ "$rc" = 0 ] || echo "::warning::the Scout attestation diagnostics could not finish (exit ${rc}); the self-check above decides the job"
          exit 0
      - id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() }}
        with:
          name: panel-scout
          path: /tmp/panel/
          if-no-files-found: warn

  # The Docker Scout root-cause round (advisor 0120/0121/0122), dispatch only: the attestation path on a scratch package
  # (never the release package; the digests before and after are recorded), then Docker's documented control, one field
  # changed at a time, and our forms, on Scout 1.26.0 and the two previous minors. Results in the job summary.
  scout-root-cause:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    environment: agent   # the read-only Docker Hub token for Scout lives here (owner, Oct 2)
    permissions:
      contents: read
      # packages: write reaches every package linked to this repository (the token cannot be narrower); the job runs only
      # from main (the agent environment), and bin/scout-root-cause.sh refuses any target but the scratch package
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: the containerd image store (Docker's documented requirement for attestations)
        run: |
          set -euo pipefail
          echo '{"features": {"containerd-snapshotter": true}}' | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker
          docker info -f '{{ .DriverStatus }}'

      - name: install docker-scout 1.26.0, 1.25.0 and 1.24.0 and crane (each pinned by checksum); skopeo is the runner image's, checked
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/scout" "$HOME/.docker/cli-plugins"
          for t in docker-scout docker-scout-1.25.0 docker-scout-1.24.0; do
            mkdir -p "$RUNNER_TEMP/$t"      # install-scanner.sh never creates its DEST (Codex #176 r2, B2)
            ./bin/install-scanner.sh "$t" "$RUNNER_TEMP/$t"
          done
          mv "$RUNNER_TEMP/docker-scout/docker-scout" "$RUNNER_TEMP/scout/docker-scout-1.26.0"
          mv "$RUNNER_TEMP/docker-scout-1.25.0/docker-scout" "$RUNNER_TEMP/scout/docker-scout-1.25.0"
          mv "$RUNNER_TEMP/docker-scout-1.24.0/docker-scout" "$RUNNER_TEMP/scout/docker-scout-1.24.0"
          # the chain's own copy tool appends the attestation manifest to the scratch index (bin/scout-root-cause.sh: crane index append), by digest
          ./bin/install-scanner.sh crane
          command -v skopeo > /dev/null || { echo "::error::skopeo is not on this runner image"; exit 1; }

      - name: log in to Docker Hub (read-only token) and GHCR (this job's token)
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_SCOUT_TOKEN: ${{ secrets.DOCKERHUB_SCOUT_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s' "$DOCKERHUB_SCOUT_TOKEN" | docker login docker.io -u "$DOCKERHUB_USERNAME" --password-stdin
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin

      - name: the root-cause round
        env:
          SCOUT_DIR: ${{ runner.temp }}/scout
          PROBE_REPO: ghcr.io/fosterstack/cache-scout-probe
          RELEASE_TAG: '0.2.1'
        run: bash bin/scout-root-cause.sh "$RUNNER_TEMP/rc" | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() }}
        with:
          name: scout-root-cause
          path: ${{ runner.temp }}/rc/
          retention-days: 30

  # The Docker Scout older-versions sweep (advisor 0520), dispatch only and read-only: does any older Scout apply a LOCAL VEX file
  # (--vex-location)? 1.24.0 to 1.26.0 do not (docker/scout-cli#207). Each minor's newest patch is installed by the pinned
  # installer (checksum per version) and run against Docker's documented example and our statement. Nothing is published.
  scout-older-versions:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    environment: agent   # the read-only Docker Hub token for Scout lives here (owner, Oct 2)
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: install every swept docker-scout (each pinned by checksum)
        env:
          SCOUT_VERSIONS: '1.23.1 1.22.0 1.21.0 1.20.4 1.19.0 1.18.4 1.17.1 1.16.3 1.15.1 1.14.0 1.12.0 1.11.0 1.10.0 1.9.3 1.8.0 1.7.0 1.6.4 1.5.2 1.4.1 1.3.0 1.2.2 1.0.9'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/scout" "$HOME/.docker/cli-plugins"
          for v in $SCOUT_VERSIONS; do
            mkdir -p "$RUNNER_TEMP/docker-scout-$v"      # install-scanner.sh never creates its DEST
            ./bin/install-scanner.sh "docker-scout-$v" "$RUNNER_TEMP/docker-scout-$v"
            mv "$RUNNER_TEMP/docker-scout-$v/docker-scout" "$RUNNER_TEMP/scout/docker-scout-$v"
          done

      - name: log in to Docker Hub (read-only token)
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_SCOUT_TOKEN: ${{ secrets.DOCKERHUB_SCOUT_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$DOCKERHUB_SCOUT_TOKEN" | docker login docker.io -u "$DOCKERHUB_USERNAME" --password-stdin

      - name: the older-versions sweep
        env:
          SCOUT_DIR: ${{ runner.temp }}/scout
          SCOUT_VERSIONS: '1.23.1 1.22.0 1.21.0 1.20.4 1.19.0 1.18.4 1.17.1 1.16.3 1.15.1 1.14.0 1.12.0 1.11.0 1.10.0 1.9.3 1.8.0 1.7.0 1.6.4 1.5.2 1.4.1 1.3.0 1.2.2 1.0.9'
        run: bash bin/scout-older-versions.sh "$RUNNER_TEMP/sweep" | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() }}
        with:
          name: scout-older-versions
          path: ${{ runner.temp }}/sweep/
          retention-days: 30

  panel-inspector:
    name: panel — Amazon Inspector (four images)
    needs: [build]
    runs-on: ubuntu-latest
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    permissions:
      contents: read
      id-token: write   # the ScanSbom-only role, by OIDC (no stored secret)
    env:
      INSPECTOR_ROLE: arn:aws:iam::821302803867:role/fosterstack-cache-inspector-scan
      INSPECTOR_REGION: us-east-1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: images
          path: /tmp/oci/
      - name: install inspector-sbomgen (pinned by checksum)
        run: ./bin/install-scanner.sh inspector-sbomgen
      # the tars come before the cache restore below: the pin checker will not read a committed script run after a
      # step that writes into the workspace
      - name: make a tar of every variant/platform child
        run: |
          mkdir -p /tmp/arc
          for v in production fips; do
            for arch in amd64 arm64; do
              ./bin/layout-archive.sh "/tmp/oci/${v}" "${arch}" "/tmp/arc/${v}-${arch}.tar" \
                "ghcr.io/fosterstack/cache:cand-${v}-${arch}" > /dev/null \
                || echo "::warning::no tar for ${v}-${arch} (the tally counts it as did not run)"
            done
          done
      - name: assume the ScanSbom-only role (OIDC; no stored secret)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ env.INSPECTOR_ROLE }}
          aws-region: ${{ env.INSPECTOR_REGION }}
          role-session-name: cache-panel-${{ github.run_id }}
      # Same-day reuse of Amazon Inspector results (REQ-REL-004-AC8): keyed by the SBOM's package inventory (bin/inspector-reuse.py),
      # stored in the Actions cache, one entry per UTC day per run. The restore key never matches exactly, so restore-keys
      # picks the newest same-day entry; a run that only reused saves nothing. Same-repo runs only (no fork reads or writes).
      - name: Amazon Inspector - today's date (UTC) for the same-day reuse
        id: insp-date
        run: echo "date=$(date -u +%F)" >> "$GITHUB_OUTPUT"
      - name: Amazon Inspector - restore today's results (same-repo runs only)
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/inspector-cache
          key: inspector-${{ steps.insp-date.outputs.date }}-${{ github.run_id }}-miss
          restore-keys: inspector-${{ steps.insp-date.outputs.date }}-
      - name: Amazon Inspector every image (our pipeline applies the VEX, rule 4)
        id: insp-scan
        run: |
          set -uo pipefail
          # Same-day reuse (REQ-REL-004-AC8): an inventory Inspector already scanned today is copied from the cache
          # to scan.json; anything else calls ScanSbom once and stores the answer. The tally reads scan.json either way.
          cdir=/tmp/inspector-cache; fresh=0; mkdir -p "$cdir"
          for v in production fips; do
            for arch in amd64 arm64; do
              d="/tmp/panel/inspector/${v}-${arch}"; mkdir -p "$d"
              [ -s "/tmp/arc/${v}-${arch}.tar" ] || continue
              if ! inspector-sbomgen container --image "/tmp/arc/${v}-${arch}.tar" --outfile "${d}/sbom.cdx.json" \
                   --disable-progress-bar; then
                echo "::warning::inspector could not scan ${v}-${arch} (the tally counts it as did not run)"; continue
              fi
              key=$(python3 bin/inspector-reuse.py key "${d}/sbom.cdx.json") \
                || { echo "::warning::inspector could not scan ${v}-${arch} (the tally counts it as did not run)"; continue; }
              day=$(date -u +%F)
              verdict=$(python3 bin/inspector-reuse.py decide "$cdir" "${day}" "${d}/sbom.cdx.json") || verdict=call
              if [ "${verdict%%$'\n'*}" = reuse ] && cp "${verdict#*$'\n'}" "${d}/scan.json"; then
                :
              elif aws inspector-scan scan-sbom --sbom "file://${d}/sbom.cdx.json" --output-format CYCLONE_DX_1_5 > "${d}/scan.json"; then
                if ! python3 bin/inspector-reuse.py validate "${d}/sbom.cdx.json" "${d}/scan.json"; then
                  echo "::warning::the ScanSbom answer for ${v}-${arch} is not the response for this inventory (the tally counts it as did not run)"; rm -f "${d}/scan.json"
                elif [ "$(date -u +%F)" != "${day}" ]; then
                  echo "::notice::UTC midnight passed during the ScanSbom call for ${v}-${arch}: used this run, not cached"
                elif python3 bin/inspector-reuse.py store "$cdir" "${day}" "${d}/sbom.cdx.json" "${d}/scan.json"; then
                  fresh=$((fresh+1))
                else
                  echo "::warning::the validated ScanSbom answer for ${v}-${arch} could not be cached"
                fi
              else
                echo "::warning::inspector could not scan ${v}-${arch} (the tally counts it as did not run)"; rm -f "${d}/scan.json"
              fi
            done
          done
          echo "fresh=${fresh}" >> "$GITHUB_OUTPUT"
      - name: Amazon Inspector - the UTC day at save time
        id: insp-save-day
        if: always()
        run: echo "date=$(date -u +%F)" >> "$GITHUB_OUTPUT"
      - name: Amazon Inspector - save today's new results (only when this run made some; same-repo runs only)
        if: always() && steps.insp-scan.outputs.fresh != '' && steps.insp-scan.outputs.fresh != '0' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/inspector-cache
          key: inspector-${{ steps.insp-save-day.outputs.date }}-${{ github.run_id }}
      - id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() }}
        with:
          name: panel-inspector
          path: /tmp/panel/
          if-no-files-found: warn

  panel-google:
    name: panel — Google Artifact Analysis (two variants, linux/amd64)
    needs: [build]
    runs-on: ubuntu-latest
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    # The scanner identity admits main only as `push` or through the main-only `agent` environment; this
    # job runs on `schedule`, so it takes the environment (ops/terraform/gcp; no secret is read here).
    environment: agent
    permissions:
      contents: read
      id-token: write   # the workload identity (rule 2): no keys
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: images
          path: /tmp/oci/
      - name: federated identity (rule 2; the identifiers are repository variables)
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.CACHE_SCANNER_PROVIDER }}
          service_account: ${{ vars.CACHE_SCANNER_SERVICE_ACCOUNT }}
          project_id: fosterstack-cache
      - name: a pinned gcloud with the local-extract component
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        with:
          version: '587.0.0'
          install_components: local-extract
      - name: Google on-demand scan of the two variants, linux/amd64 only (rule 1; our pipeline applies the VEX)
        run: |
          set -uo pipefail
          mkdir -p /tmp/arc
          for v in production fips; do
            ref="ghcr.io/fosterstack/cache:cand-${v}-amd64"; d="/tmp/panel/google/${v}-amd64"; mkdir -p "$d"
            ./bin/layout-archive.sh "/tmp/oci/${v}" amd64 "/tmp/arc/${v}-amd64.tar" "${ref}" > /dev/null \
              && docker load -i "/tmp/arc/${v}-amd64.tar" > /dev/null || continue
            if gcloud artifacts docker images scan "${ref}" --additional-package-types=GO --format=json --log-http \
                 > "${d}/scan.json" 2> "${d}/http.log"; then
              python3 bin/panel.py google-packages "${d}/http.log" > "${d}/packages.json"
              gcloud artifacts docker images list-vulnerabilities "$(jq -r '.response.scan' "${d}/scan.json")" --format=json > "${d}/vulns.json" \
                || rm -f "${d}/packages.json"
            fi
            rm -f "${d}/http.log"   # the request log holds tokens; never uploaded
            [ -s "${d}/packages.json" ] || echo "::warning::google could not scan ${v} (the tally counts it as did not run)"
          done
      - id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() }}
        with:
          name: panel-google
          path: /tmp/panel/
          if-no-files-found: warn

  panel:
    name: panel — tally the day (rules 3-6)
    needs: [panel-grype, panel-scout, panel-inspector, panel-google]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write      # the tracking issue (rule 5)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: the grype scanner's output, by its artifact id into its own folder (no id = it did not run)
        if: ${{ needs.panel-grype.outputs.artifact-id != '' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          artifact-ids: ${{ needs.panel-grype.outputs.artifact-id }}
          path: /tmp/panel/panel-grype
      - name: the scout scanner's output, by its artifact id into its own folder (no id = it did not run)
        if: ${{ needs.panel-scout.outputs.artifact-id != '' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          artifact-ids: ${{ needs.panel-scout.outputs.artifact-id }}
          path: /tmp/panel/panel-scout
      - name: the inspector scanner's output, by its artifact id into its own folder (no id = it did not run)
        if: ${{ needs.panel-inspector.outputs.artifact-id != '' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          artifact-ids: ${{ needs.panel-inspector.outputs.artifact-id }}
          path: /tmp/panel/panel-inspector
      - name: the google scanner's output, by its artifact id into its own folder (no id = it did not run)
        if: ${{ needs.panel-google.outputs.artifact-id != '' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          artifact-ids: ${{ needs.panel-google.outputs.artifact-id }}
          path: /tmp/panel/panel-google
      - name: tally the day's findings — counts, quorum, seen by N of M (rules 3-6; unique findings go to the auditor)
        id: judge
        run: |
          set +e
          python3 bin/panel.py tally --in /tmp/panel --vex .vex/fosterstack-cache.openvex.json --out /tmp/panel-out
          echo "rc=$?" >> "$GITHUB_OUTPUT"
          cat /tmp/panel-out/summary.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null
          exit 0
      - name: open or update the tracking issue (seen by two or more scanners; rule 5)
        if: ${{ always() && steps.judge.outcome == 'success' && github.ref == 'refs/heads/main' }}   # only main's rescan files the issue
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          [ -s /tmp/panel-out/issue.md ] || exit 0
          title="Daily scanner panel: findings on main"
          { cat /tmp/panel-out/issue.md; echo; echo "commit \`${GITHUB_SHA}\` — run ${RUN_URL}"; } > /tmp/panel-out/issue-body.md
          n=$(python3 bin/rescan-statement.py find-issue --title "$title")   # every page of the open daily-rescan issues (the issue list command reads only 30)
          if [ -n "$n" ]; then gh issue comment "$n" --body-file /tmp/panel-out/issue-body.md
          else
            # `gh issue create --label X` fails when X does not exist, and a lost tracking issue is a lost finding: make sure both
            # labels exist first (created without forcing, so an existing label's colour and description are never overwritten; the values are
            # policy.LABELS', and a test pins them equal)
            gh label create daily-rescan --description "The daily rescan's tracking issue" --color 0E8A16 2>/dev/null || true
            gh label create security --description "Security finding" --color D93F0B 2>/dev/null || true
            gh issue create --title "$title" --label daily-rescan --label security --body-file /tmp/panel-out/issue-body.md
          fi
      - name: keep the verdict — the auditor's input (every finding, seen by N of M, the unique ones listed)
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: panel-evidence
          path: /tmp/panel-out/
          if-no-files-found: warn
      - name: fail the run unless every image counted and nothing is to report (rule 3; never reported clean)
        if: ${{ steps.judge.outputs.rc != '0' }}
        run: |
          echo "::error::scanner panel: rc ${{ steps.judge.outputs.rc }} (1 = findings to report, 2 = a scanner did not run, an image did not count, or the tally could not run)" >&2
          exit 1

  # ---------------------------------------------------------------------------------------------------------------
  # Merged from daily-rescan.yml (workflow consolidation 3 of 4, owner RATIFIED Oct 2): the daily rescan of the CURRENT
  # PUBLISHED release's digests (current release only, owner Oct 9) (release-chain-design.md §3) — enumerate the current release's manifest (or legacy inventory entry),
  # then scan each (release, variant, scanner) digest at the release gate's policy, VEX the only exception. It runs under
  # this file's ONE schedule, so the auditor never selects a rescan run that lacks the candidate.
  manifests:
    name: enumerate release manifests
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.collect.outputs.targets }}
      any: ${{ steps.collect.outputs.any }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: collect (release, variant, digest, scanner) targets
        id: collect
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          scanners=$(jq -c '.scanners' .github/policy/scanners.json)
          w="${RUNNER_TEMP:-/tmp}"
          : > "$w/targets.jsonl"

          # The daily rescan covers the CURRENT release only (owner, Oct 9 2026; scanner-panel rules, "the daily rescan
          # covers the current release only", REQ-REL-004-AC5): the latest published release by SEMANTIC VERSION, not by
          # date. A draft, a prerelease and a tag that is not exactly vMAJOR.MINOR.PATCH are never current. A release that
          # stops being current is no longer scanned, so no issue is opened or reopened for it.
          #
          # R12: capture the release list with an EXPLICIT exit check. A `for tag in $(gh release list ...)` swallows the
          # command substitution's failure (set -e does not catch it there), so an API outage would look like "no
          # release". Fail loudly instead; an empty-but-successful list is the no-release case below.
          if ! gh release list --limit 1000 --json tagName,isDraft,isPrerelease > "$w/releases.json"; then
            echo "::error::could not enumerate releases (gh release list failed) - refusing to rescan a partial inventory" >&2
            exit 1
          fi
          jq -e 'type == "array"' "$w/releases.json" >/dev/null \
            || { echo "::error::gh release list did not return a JSON array" >&2; exit 1; }
          # gh returns at most --limit releases, newest-created first. A list that REACHES the limit may have cut the current
          # release off (it can be the oldest by creation date), so it is an error, never a wrong or an empty day.
          if [ "$(jq 'length' "$w/releases.json")" -ge 1000 ]; then
            echo "::error::release list reached the limit of 1000: the current release may be hidden - refusing to pick from a truncated list" >&2
            exit 1
          fi
          current=$(jq -r '[.[] | select((.isDraft | not) and (.isPrerelease | not)
                                         and (.tagName | test("^v(0|[1-9][0-9]*)[.](0|[1-9][0-9]*)[.](0|[1-9][0-9]*)$")))
                            | .tagName]
                           | sort_by(ltrimstr("v") | split(".") | map(tonumber)) | last // empty' "$w/releases.json")

          if [ -z "$current" ]; then
            echo "note: no published release (every tag is a draft, a prerelease or not vMAJOR.MINOR.PATCH) - nothing to rescan today"
          else
            echo "current release: ${current} (the only release the daily rescan covers)"
            # F12: a legacy release that predates release-manifest.json is covered from the committed inventory while it
            # is the current release.
            if jq -e --arg v "$current" '[.releases[] | select(.version == $v)] | length > 0' \
                 .github/policy/legacy-releases.json >/dev/null; then
              jq -c --arg v "$current" --argjson scanners "$scanners" \
                '.releases[] | select(.version == $v) as $r | $r.images[] as $img | $scanners[] as $s |
                 {release: $r.version, variant: $img.variant, digest: $img.digest, scanner: $s, source: "legacy-inventory"}' \
                .github/policy/legacy-releases.json >> "$w/targets.jsonl"
            else
              # Enumerate ASSETS first, so an absent manifest is told from a FAILED read of one that is present (F13).
              # The current release without a manifest is an ERROR: the one release we cover must never silently drop out.
              has_manifest=$(gh release view "$current" --json assets \
                --jq '[.assets[] | select(.name == "release-manifest.json")] | length') \
                || { echo "::error::could not read the assets of release ${current} (gh release view failed) - refusing to rescan nothing" >&2; exit 1; }
              if [ "$has_manifest" -eq 0 ]; then
                echo "::error::the current release ${current} has no release-manifest.json asset and is not in the legacy inventory - refusing to rescan nothing" >&2
                exit 1
              fi
              tag="$current"
              if ! gh release download "$tag" -p release-manifest.json -O "/tmp/m-${tag}.json"; then
                echo "::error::release-manifest.json is present on ${current} but could not be downloaded - refusing to drop it from the rescan" >&2
                exit 1
              fi
              jq -e 'type == "object"' "/tmp/m-${tag}.json" >/dev/null 2>&1 \
                || { echo "::error::release-manifest.json on ${current} is not valid JSON" >&2; exit 1; }
              imgcount=$(jq '.images | length' "/tmp/m-${tag}.json")
              [ "$imgcount" -ge 1 ] || { echo "::error::release-manifest.json on ${current} lists no images" >&2; exit 1; }
              jq -c --arg tag "$current" --argjson scanners "$scanners" \
                '.images[] as $img | $scanners[] as $s |
                 {release: $tag, variant: $img.variant, digest: $img.digest, scanner: $s, source: "release-manifest"}' \
                "/tmp/m-${tag}.json" >> "$w/targets.jsonl"
            fi
          fi

          targets=$(jq -s -c '.' "$w/targets.jsonl")
          # Every matrix value reaches the rescan job: each must have its exact shape, or no matrix is emitted — a release
          # manifest's data never becomes shell source (Codex #160 pin pass, B78-01)
          TARGET_SHAPE='all(.[]; (.release | test("^v[0-9]+[.][0-9]+[.][0-9]+(-rc[.][0-9]+)?$")) and (.variant | test("^[a-z0-9][a-z0-9-]{0,31}$")) and (.digest | test("^sha256:[0-9a-f]{64}$")) and (.scanner | test("^[a-z0-9][a-z0-9-]{0,31}$")))'
          jq -e "$TARGET_SHAPE" <<<"$targets" > /dev/null \
            || { echo "::error::a rescan target has a malformed release, variant, digest or scanner - refusing to emit the matrix" >&2; exit 1; }
          n=$(jq 'length' <<<"$targets")
          # No published release is a quiet day, not a failed one: an empty matrix and any=false skip the rescan job.
          # A current release with no targets (empty legacy images, no scanners, no manifest images) is NOT a quiet day: fail closed.
          if [ "$n" -eq 0 ]; then
            if [ -n "$current" ]; then
              echo "::error::current release ${current} produced no rescan targets" >&2
              exit 1
            fi
            echo "targets=${targets}" >> "$GITHUB_OUTPUT"
            echo "any=false" >> "$GITHUB_OUTPUT"
            echo "no published release: the rescan matrix is empty"
            exit 0
          fi
          echo "targets=${targets}" >> "$GITHUB_OUTPUT"
          echo "any=true" >> "$GITHUB_OUTPUT"
          echo "rescanning ${n} (release, variant, scanner) targets"

  rescan:
    name: ${{ matrix.target.scanner }} ${{ matrix.target.release }} ${{ matrix.target.variant }}
    needs: manifests
    if: needs.manifests.outputs.any == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      packages: read
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.manifests.outputs.targets) }}
    # matrix values reach scripts only through these, quoted (B78-01)
    env:
      TARGET_RELEASE: ${{ matrix.target.release }}
      TARGET_VARIANT: ${{ matrix.target.variant }}
      TARGET_DIGEST: ${{ matrix.target.digest }}
      TARGET_SCANNER: ${{ matrix.target.scanner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Enumerate the platform CHILDREN of the index so both
      # architectures are scanned by EVERY scanner, not just the runner's
      # default (B04a: the ongoing rescan must cover each child for every
      # scanner it runs, like the release scanner). children.txt: one
      # "os/arch<TAB>childref" per line; a recognized single-image
      # manifest falls back to the index itself.
      - name: enumerate platform children
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin || true
          # the chain's own copy tool reads the candidate index, by digest (pinned by checksum; it uses the docker login above)
          ./bin/install-scanner.sh crane
          ref="ghcr.io/${GITHUB_REPOSITORY_OWNER}/cache@${TARGET_DIGEST}"
          : > /tmp/children.txt
          # A FAILED or MALFORMED enumeration must REJECT the run (B04): a
          # lost platform inventory must never be silently downgraded to a
          # single-arch index scan. Only a VALID manifest that genuinely has
          # no platform children falls back to "scan the index as itself".
          if ! crane manifest "$ref" > /tmp/index.json 2>/tmp/inspect.err; then
            echo "::error::could not inspect ${ref} to enumerate platform children — refusing to rescan on an unknown platform inventory" >&2
            cat /tmp/inspect.err >&2 || true
            exit 1
          fi
          # B04c/B04f: shape + descriptor validation lives in the extracted,
          # unit-tested bin/rescan-statement.py so the "every expected image
          # descriptor must have a usable platform" rule is exercised by
          # bin/rescan-statement-test.sh, not just an external probe. It
          # rejects invalid JSON, `{}`, `{"manifests":null}`, and — crucially
          # — a multi-platform index in which ANY plain image descriptor has a
          # null/empty/"unknown" platform (a lost platform is never downgraded
          # to a single-arch scan). A descriptor without a usable platform is
          # tolerated only when it is EXPLICITLY an attestation/referrer
          # descriptor. A recognized single-image manifest (.config + .layers)
          # still falls back to scanning the index as itself.
          python3 bin/rescan-statement.py enumerate \
            --index /tmp/index.json \
            --repo "ghcr.io/${{ github.repository_owner }}/cache" \
            --ref "$ref" \
            --out /tmp/children.txt
          echo "children to scan:"; cat /tmp/children.txt

      # ---- grype (CLI: reliable version/db, by digest) -------------------
      - name: Grype rescan (by digest, JSON findings)
        if: matrix.target.scanner == 'grype'
        id: grype
        continue-on-error: true
        run: |
          set -euo pipefail
          # Only the VEX file may hide a finding (rule 4): grype reads an EMPTY config (never the repository's), and a GRYPE_* variable stops the step,
          # as in bin/grype-scan.sh and bin/check-scan.sh (names only are printed). Zero packages = did not run (row 53): the inventory is written too.
          bad_env=$(compgen -e | grep '^GRYPE_' | grep -vx 'GRYPE_DB_CACHE_DIR\|GRYPE_DB_AUTO_UPDATE' | tr '\n' ' ' || true)
          if [ -n "${bad_env}" ]; then
            echo "::error::grype: ${bad_env}set in the environment; only the VEX document may hide a finding, refusing to run" >&2
            exit 2
          fi
          : > /tmp/empty-grype.yaml
          ./bin/install-scanner.sh grype
          rc=0
          child_no=0
          : > /tmp/children-scanned.jsonl
          # B04: `--fail-on negligible` makes grype exit nonzero on a
          # FINDING. Grype returns 2 for a vulnerability match and
          # 1 for an operational error (the reverse of its --help text;
          # see cmd/grype/cli/cli.go, unchanged at the pinned v0.118.0) - the exit-code contract
          # is in bin/rescan-statement.py. Capture it with `|| code=$?` so
          # errexit does not abort the loop; the per-child exit code +
          # report path are recorded and the merge/classification happens
          # once in bin/rescan-statement.py.
          while IFS=$'\t' read -r platform ref; do
            [ -n "$platform" ] || continue
            child_no=$((child_no + 1))
            out="/tmp/grype-child-${child_no}.json"; sbom="/tmp/grype-child-${child_no}.cdx.json"
            echo "grype: ${platform} ${ref}"
            plat_arg=""
            case "$platform" in */*) plat_arg="--platform ${platform}";; esac
            code=0
            # shellcheck disable=SC2086
            grype "registry:${ref}" $plat_arg -c /tmp/empty-grype.yaml \
              --fail-on negligible \
              --vex .vex/fosterstack-cache.openvex.json \
              -o "json=${out}" -o "cyclonedx-json=${sbom}" || code=$?
            [ "$code" -gt "$rc" ] && rc=$code
            # packages = components that carry a package URL, pkg:<type>/<name> (grype also lists files); unreadable = 0, which bin/rescan-statement.py refuses
            pk=$(jq '[.components[]? | select((.purl | type) == "string" and (.purl | startswith("pkg:") and (.[4:] | index("/") as $i | $i != null and $i > 0 and $i < length - 1)))] | length' "${sbom}" 2>/dev/null) || pk=0
            [[ "${pk}" =~ ^[0-9]+$ ]] || pk=0                  # an empty or odd result must not stop the loop before this child's record is written
            jq -nc --arg p "$platform" --arg r "$ref" --argjson e "$code" --arg f "$out" --argjson k "${pk}" \
              '{platform:$p, ref:$r, exit:$e, report:$f, packages:$k}' >> /tmp/children-scanned.jsonl
          done < /tmp/children.txt
          exit $rc

      # ---- osv-scanner (OSV.dev database, by digest) -------------------
      - name: OSV-Scanner rescan (by digest, JSON findings)
        if: matrix.target.scanner == 'osv-scanner'
        id: osv
        continue-on-error: true
        run: |
          set -euo pipefail
          # An empty config, every package and every vulnerability listed, and an OSV_SCANNER_* variable stops the step (as in bin/check-scan.sh).
          bad_env=$(compgen -e | grep '^OSV_SCANNER_' | tr '\n' ' ' || true)
          if [ -n "${bad_env}" ]; then
            echo "::error::osv-scanner: ${bad_env}set in the environment; only the VEX document may hide a finding, refusing to run" >&2
            exit 2
          fi
          : > /tmp/empty-osv.toml
          ./bin/install-scanner.sh osv-scanner
          rc=0
          child_no=0
          : > /tmp/children-scanned.jsonl
          # osv-scanner exit codes: 0 clean, 1 findings, other nonzero =
          # operational failure (contract in bin/rescan-statement.py). Captured
          # per child with `|| code=$?` so errexit does not abort the loop; the
          # merge/classification happens once, downstream.
          while IFS=$'\t' read -r platform ref; do
            [ -n "$platform" ] || continue
            child_no=$((child_no + 1))
            out="/tmp/osv-child-${child_no}.json"
            echo "osv-scanner: ${platform} ${ref}"
            code=0
            osv-scanner scan image --config /tmp/empty-osv.toml --all-packages --all-vulns --format json --output "$out" "${ref}" || code=$?
            [ "$code" -gt "$rc" ] && rc=$code
            pk=$(jq '[.results[]?.packages[]?] | length' "${out}" 2>/dev/null) || pk=0
            [[ "${pk}" =~ ^[0-9]+$ ]] || pk=0
            jq -nc --arg p "$platform" --arg r "$ref" --argjson e "$code" --arg f "$out" --argjson k "${pk}" \
              '{platform:$p, ref:$r, exit:$e, report:$f, packages:$k}' >> /tmp/children-scanned.jsonl
          done < /tmp/children.txt
          exit $rc

      # ---- scanner identity (F14) ----------------------------------------
      - name: record scanner version and database state
        run: |
          set -euo pipefail
          : > /tmp/scanner-meta
          case "$TARGET_SCANNER" in
            grype)
              echo "version=$(grype version 2>/dev/null | awk '/^Version:/{print $2}')" >> /tmp/scanner-meta
              echo "db=$(grype db status 2>/dev/null | awk '/Built|built/{print $NF; exit}')" >> /tmp/scanner-meta ;;
            osv-scanner)
              echo "version=$(osv-scanner --version 2>/dev/null | awk 'NR==1{print $NF}')" >> /tmp/scanner-meta
              echo "db=OSV.dev (osv-scalibr; deps.dev)" >> /tmp/scanner-meta ;;
          esac
          cat /tmp/scanner-meta

      # ---- statement -----------------------------------------------------
      # The merge, OS+application normalization (B04d), and exit-code
      # classification (B04e) live in the unit-tested bin/rescan-statement.py
      # (exercised by bin/rescan-statement-test.sh in the requirements CI
      # job), not inline here — so a regression is caught in PR CI. It reads
      # the per-child manifest each scanner loop wrote (platform, ref, exit
      # code, report path), applies each scanner's OWN exit-code contract
      # INDEPENDENTLY of parse success, merges OS AND application findings
      # from every child preserving platform + project context, and writes
      # the statement, the merged raw report, and the outcome/has_findings
      # step outputs.
      - name: write the digest-keyed rescan statement
        id: statement
        run: |
          set -euo pipefail
          python3 bin/rescan-statement.py statement \
            --scanner "$TARGET_SCANNER" \
            --children /tmp/children-scanned.jsonl \
            --expect-children "$(grep -c . /tmp/children.txt)" \
            --meta /tmp/scanner-meta \
            --vex .vex/fosterstack-cache.openvex.json \
            --scope-file /tmp/scan-scope.json \
            --release "$TARGET_RELEASE" \
            --variant "$TARGET_VARIANT" \
            --digest "$TARGET_DIGEST" \
            --image-ref "ghcr.io/${GITHUB_REPOSITORY_OWNER}/cache@${TARGET_DIGEST}" \
            --scanned-at "$(date -u +%Y-%m-%dT%H:%M:%S+00:00)" \
            --raw-out /tmp/findings-raw.json \
            --out /tmp/rescan-statement.json \
            --github-output "$GITHUB_OUTPUT"

      - name: stage the raw report AND the per-child reports beside the statement
        run: |
          set -euo pipefail
          mkdir -p /tmp/rescan-out
          cp /tmp/rescan-statement.json /tmp/rescan-out/
          [ -f /tmp/findings-raw.json ] && cp /tmp/findings-raw.json /tmp/rescan-out/ || true
          # B04d: retain the ORIGINAL per-child reports too, so the raw
          # evidence that carries e.g. an arm64 application-only finding
          # survives artifact upload, not just the merged report. The child
          # paths come from the deterministic per-child manifest (no glob).
          if [ -f /tmp/children-scanned.jsonl ]; then
            mkdir -p /tmp/rescan-out/children
            while IFS= read -r line; do
              [ -n "$line" ] || continue
              f=$(jq -r '.report' <<<"$line")
              [ -f "$f" ] && cp "$f" /tmp/rescan-out/children/ || true
            done < /tmp/children-scanned.jsonl
          fi

      - name: upload the statement AND the raw report (evidence, clean or not)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rescan-${{ matrix.target.release }}-${{ matrix.target.variant }}-${{ matrix.target.scanner }}
          path: /tmp/rescan-out/
          retention-days: 90

      # B04b: notify on ANY real finding, independently of completeness. This
      # fires on has_findings (not outcome=='findings'), so a run that both
      # found a CVE AND had an operational failure still files the issue —
      # while the operational error still fails the run below.
      - name: file/update a tracking issue on findings
        if: steps.statement.outputs.has_findings == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const t = ${{ toJSON(matrix.target) }};
            const short = t.digest.replace('sha256:', '').slice(0, 12);
            const title = `Daily rescan: findings in ${t.release} ${t.variant} @${short} (${t.scanner})`;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `The daily rescan found new findings.\n\n- release: \`${t.release}\`\n- variant: \`${t.variant}\`\n- digest: \`${t.digest}\`\n- scanner: \`${t.scanner}\`\n- statement artifact: \`rescan-${t.release}-${t.variant}-${t.scanner}\` on ${runUrl}\n\nThese bytes have not changed since release — this is a newly-disclosed CVE against previously-shipped code, the case the 24-48h response SLA targets. Per policy: if an upstream fix exists, ship the version bump; if not, publish a VEX statement and mitigation.`;
            // every page of the open daily-rescan issues (one page is 30): a tracking issue on a later page must be found, not duplicated; pull requests are not tracking issues
            const existing = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner, repo: context.repo.repo, state: 'open', labels: 'daily-rescan', per_page: 100,
            });
            const match = existing.find(i => !i.pull_request && i.title === title);
            if (match) {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: match.number, body });
            } else {
              // issues.create fails (422) when a label does not exist, and a lost tracking issue is a lost finding: make sure both
              // labels exist first. An existing label is left as it is (a 422 here is fine); any other failure shows up in the create below.
              // The values are policy.LABELS', and a test pins them equal.
              for (const [name, description, color] of [['daily-rescan', "The daily rescan's tracking issue", '0E8A16'], ['security', 'Security finding', 'D93F0B']]) {
                try { await github.rest.issues.createLabel({ owner: context.repo.owner, repo: context.repo.repo, name, description, color }); } catch (e) { /* exists, or the create below reports it */ }
              }
              await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title, body, labels: ['daily-rescan', 'security'] });
            }

      - name: a findings verdict fails the run (visible red, same bar as the gate)
        if: steps.statement.outputs.outcome == 'findings'
        run: |
          echo "::error::rescan found findings for ${TARGET_RELEASE} ${TARGET_VARIANT} (${TARGET_SCANNER}) — see the tracking issue" >&2
          exit 1

      # An operational failure is NOT clean CVE evidence: fail the run with
      # a distinct signal so a scanner that could not run is never recorded
      # as a passing rescan (completion note).
      - name: an operational error fails the run distinctly
        if: steps.statement.outputs.outcome == 'error'
        run: |
          echo "::error::rescan scanner ${TARGET_SCANNER} failed to complete for ${TARGET_RELEASE} ${TARGET_VARIANT} — this is an operational failure, not a clean result" >&2
          exit 1
