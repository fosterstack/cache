name: Daily main-candidate rescan

# The main-candidate half of the daily rescan (companion to daily-rescan.yml, which rescans every PUBLISHED
# release's digests). main's candidate is never pushed to a package; this builds it from source through the
# same build + image-assembly stages the release chain uses, then runs the scanner panel (scanner-panel rules
# 1-9, ratified by the owner Oct 2; REQ-SCAN-001..009): Grype, Docker Scout and Amazon Inspector on the six
# images, Google Artifact Analysis on the three variants on linux/amd64, tallied together by bin/panel.py —
# package counts and quorum, the published VEX as the only exception, "seen by N of M", a tracking issue for
# findings seen by two or more scanners; unique findings are listed for the daily auditor, whose run audits them
# right after this one (REQ-REL-004-AC3, amended Oct 2; rule 9, owner Oct 3). Trivy and Snyk are no longer run by the panel; scanner-reports below still hands the daily auditor
# its own inputs (REQ-AUD, unchanged).
on:
  schedule:
    - cron: '41 7 * * *' # 30m after daily-rescan, same offset-from-hour habit
  workflow_dispatch: {}

# Top level stays read-only; the two reusable-stage caller jobs carry
# their own grants (which the callee ceilings require), and the scan job
# adds issues:write for the tracking issue. Keeping the default narrow
# means the scan job never holds packages/id-token/attestations.
permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/stage-build.yml
    permissions:
      contents: read
      id-token: write
      attestations: write
    with:
      mode: snapshot

  assemble:
    needs: build
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/stage-image.yml
    with:
      mode: pr
      dist-artifact: dist-snapshot
      expected-checksums: ${{ needs.build.outputs.checksums }}
      upload-oci: true

  # ---------------------------------------------------------------------------------------------------------
  # The scanner panel (scanner-panel rules 1-9, ratified Oct 2; REQ-SCAN-001..009). Four scanner jobs, each
  # leaving its raw output per image for the tally; the set of images is written here, never computed:
  # Grype, Docker Scout and Amazon Inspector scan all six images; Google scans the three variants on
  # linux/amd64 only. Trivy and Snyk are not in the panel (rule 1). A scanner job that fails leaves fewer
  # outputs, which the tally counts as "did not run" (rule 3) — never as clean.
  panel-grype:
    name: panel — Grype (six images)
    needs: [build, assemble]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: oci-candidate
          path: /tmp/oci/
      - name: install grype (pinned by checksum)
        run: ./bin/install-scanner.sh grype
      - name: Grype every image, given our VEX (rule 4)
        run: |
          set -uo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq skopeo
          grype db update >/dev/null 2>&1 || true
          for v in production debug fips; do
            for arch in amd64 arm64; do
              ref="ghcr.io/fosterstack/cache:cand-${v}-${arch}"; d="/tmp/panel/grype/${v}-${arch}"; mkdir -p "$d"
              skopeo copy --override-arch "${arch}" --override-os linux "oci-archive:/tmp/oci/${v}.oci" "docker-daemon:${ref}" || continue
              grype "docker:${ref}" --vex .vex/fosterstack-cache.openvex.json -o "cyclonedx-json=${d}/result.cdx.json" \
                || echo "::warning::grype could not scan ${v}-${arch} (the tally counts it as did not run)"
            done
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ always() }}
        with:
          name: panel-grype
          path: /tmp/panel/
          if-no-files-found: warn

  panel-scout:
    name: panel — Docker Scout (six images)
    needs: [build, assemble]
    runs-on: ubuntu-latest
    environment: agent   # the read-only Docker Hub token for Scout lives here (owner, Oct 2)
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: oci-candidate
          path: /tmp/oci/
      - name: install docker-scout (pinned by checksum)
        run: |
          set -euo pipefail
          ./bin/install-scanner.sh docker-scout "$RUNNER_TEMP"
          mkdir -p "$HOME/.docker/cli-plugins" && install -m 0755 "$RUNNER_TEMP/docker-scout" "$HOME/.docker/cli-plugins/docker-scout"
      - name: log in to Docker Hub for Scout (read-only token)
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_SCOUT_TOKEN: ${{ secrets.DOCKERHUB_SCOUT_TOKEN }}
        run: printf '%s' "$DOCKERHUB_SCOUT_TOKEN" | docker login docker.io -u "$DOCKERHUB_USERNAME" --password-stdin
      - name: Docker Scout every image, given our VEX (rule 4)
        run: |
          set -uo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq skopeo
          for v in production debug fips; do
            for arch in amd64 arm64; do
              ref="ghcr.io/fosterstack/cache:cand-${v}-${arch}"; d="/tmp/panel/scout/${v}-${arch}"; mkdir -p "$d"
              skopeo copy --override-arch "${arch}" --override-os linux "oci-archive:/tmp/oci/${v}.oci" "docker-daemon:${ref}" || continue
              docker scout sbom --format json "local://${ref}" > "${d}/sbom.json" \
                && docker scout cves --format gitlab --vex-location .vex/fosterstack-cache.openvex.json "local://${ref}" > "${d}/cves.json" \
                || echo "::warning::docker scout could not scan ${v}-${arch} (the tally counts it as did not run)"
            done
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ always() }}
        with:
          name: panel-scout
          path: /tmp/panel/
          if-no-files-found: warn

  panel-inspector:
    name: panel — Amazon Inspector (six images)
    needs: [build, assemble]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # the ScanSbom-only role, by OIDC (no stored secret)
    env:
      INSPECTOR_ROLE: arn:aws:iam::821302803867:role/fosterstack-cache-inspector-scan
      INSPECTOR_REGION: us-east-1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: oci-candidate
          path: /tmp/oci/
      - name: install inspector-sbomgen (pinned by checksum)
        run: ./bin/install-scanner.sh inspector-sbomgen
      - name: assume the ScanSbom-only role (OIDC; no stored secret)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ env.INSPECTOR_ROLE }}
          aws-region: ${{ env.INSPECTOR_REGION }}
          role-session-name: cache-panel-${{ github.run_id }}
      - name: Amazon Inspector every image (our pipeline applies the VEX, rule 4)
        run: |
          set -uo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq skopeo
          for v in production debug fips; do
            for arch in amd64 arm64; do
              ref="ghcr.io/fosterstack/cache:cand-${v}-${arch}"; d="/tmp/panel/inspector/${v}-${arch}"; mkdir -p "$d"
              skopeo copy --override-arch "${arch}" --override-os linux "oci-archive:/tmp/oci/${v}.oci" "docker-daemon:${ref}" || continue
              inspector-sbomgen container --image "${ref}" --outfile "${d}/sbom.cdx.json" --disable-progress-bar \
                && aws inspector-scan scan-sbom --sbom "file://${d}/sbom.cdx.json" --output-format CYCLONE_DX_1_5 > "${d}/scan.json" \
                || echo "::warning::inspector could not scan ${v}-${arch} (the tally counts it as did not run)"
            done
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ always() }}
        with:
          name: panel-inspector
          path: /tmp/panel/
          if-no-files-found: warn

  panel-google:
    name: panel — Google Artifact Analysis (three variants, linux/amd64)
    needs: [build, assemble]
    runs-on: ubuntu-latest
    # The scanner identity admits main only as `push` or through the main-only `agent` environment; this
    # job runs on `schedule`, so it takes the environment (ops/terraform/gcp; no secret is read here).
    environment: agent
    permissions:
      contents: read
      id-token: write   # the workload identity (rule 2): no keys
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: oci-candidate
          path: /tmp/oci/
      - name: federated identity (rule 2; the identifiers are repository variables)
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.CACHE_SCANNER_PROVIDER }}
          service_account: ${{ vars.CACHE_SCANNER_SERVICE_ACCOUNT }}
          project_id: fosterstack-cache
      - name: a pinned gcloud with the local-extract component
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        with:
          version: '587.0.0'
          install_components: local-extract
      - name: Google on-demand scan of the three variants, linux/amd64 only (rule 1; our pipeline applies the VEX)
        run: |
          set -uo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq skopeo
          for v in production debug fips; do
            ref="ghcr.io/fosterstack/cache:cand-${v}-amd64"; d="/tmp/panel/google/${v}-amd64"; mkdir -p "$d"
            skopeo copy --override-arch amd64 --override-os linux "oci-archive:/tmp/oci/${v}.oci" "docker-daemon:${ref}" || continue
            if gcloud artifacts docker images scan "${ref}" --additional-package-types=GO --format=json --log-http \
                 > "${d}/scan.json" 2> "${d}/http.log"; then
              python3 bin/panel.py google-packages "${d}/http.log" > "${d}/packages.json"
              gcloud artifacts docker images list-vulnerabilities "$(jq -r '.response.scan' "${d}/scan.json")" --format=json > "${d}/vulns.json" \
                || rm -f "${d}/packages.json"
            fi
            rm -f "${d}/http.log"   # the request log holds tokens; never uploaded
            [ -s "${d}/packages.json" ] || echo "::warning::google could not scan ${v} (the tally counts it as did not run)"
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ always() }}
        with:
          name: panel-google
          path: /tmp/panel/
          if-no-files-found: warn

  panel:
    name: panel — tally the day (rules 3-6)
    needs: [panel-grype, panel-scout, panel-inspector, panel-google]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write      # the tracking issue (rule 5)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: the four scanners' outputs (a missing one is "did not run")
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          pattern: panel-*
          path: /tmp/panel/
          merge-multiple: true
      - name: tally the day's findings — counts, quorum, seen by N of M (rules 3-6; unique findings go to the auditor)
        id: judge
        run: |
          set +e
          python3 bin/panel.py tally --in /tmp/panel --vex .vex/fosterstack-cache.openvex.json --out /tmp/panel-out
          echo "rc=$?" >> "$GITHUB_OUTPUT"
          cat /tmp/panel-out/summary.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null
          exit 0
      - name: open or update the tracking issue (seen by two or more scanners; rule 5)
        if: ${{ always() && steps.judge.outcome == 'success' && github.ref == 'refs/heads/main' }}   # only main's rescan files the issue
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          [ -s /tmp/panel-out/issue.md ] || exit 0
          title="Daily scanner panel: findings on main"
          { cat /tmp/panel-out/issue.md; echo; echo "commit \`${GITHUB_SHA}\` — run ${RUN_URL}"; } > /tmp/panel-out/issue-body.md
          n=$(gh issue list --state open --label daily-rescan --json number,title --jq "[.[] | select(.title == \"${title}\")][0].number // empty")
          if [ -n "$n" ]; then gh issue comment "$n" --body-file /tmp/panel-out/issue-body.md
          else gh issue create --title "$title" --label daily-rescan --label security --body-file /tmp/panel-out/issue-body.md; fi
      - name: keep the verdict — the auditor's input (every finding, seen by N of M, the unique ones listed)
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: panel-evidence
          path: /tmp/panel-out/
          if-no-files-found: warn
      - name: fail the run unless every image counted and nothing is to report (rule 3; never reported clean)
        if: ${{ steps.judge.outputs.rc != '0' }}
        run: |
          echo "::error::scanner panel: rc ${{ steps.judge.outputs.rc }} (1 = findings to report, 2 = a scanner did not run, an image did not count, or the tally could not run)" >&2
          exit 1

  # The daily auditor (auditor.yml) consumes this run: it needs the candidate's recorded
  # digest (to assert it loaded the right image) and, in production, the scanners' JSON
  # reports (so REQ-AUD-1 AC2 — "consume the rescan's own scan output" — holds without the
  # auditor re-scanning). This job GATES NOTHING (mirrors the trivy/snyk daily jobs): it
  # writes machine-readable reports and uploads them with if: always(), so even a day the
  # candidate is red still hands the auditor its inputs.
  scanner-reports:
    name: scanner reports for the daily auditor (non-gating)
    needs: [build, assemble]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: oci-candidate
          path: /tmp/oci/
      - name: install scanners (pinned by checksum)
        run: for s in grype trivy osv-scanner; do ./bin/install-scanner.sh "$s" || true; done
      - name: load the candidates and emit JSON reports + recorded digests
        continue-on-error: true
        run: |
          set -uo pipefail
          command -v skopeo >/dev/null 2>&1 || sudo apt-get update -qq && sudo apt-get install -y -qq skopeo || true
          mkdir -p /tmp/reports
          : > /tmp/reports/candidate-digests.json
          python3 - <<'PY'
          import json, subprocess, os
          digs = {}
          for v in ("production", "debug", "fips"):
              oci = "/tmp/oci/%s.oci" % v
              if not os.path.exists(oci):
                  continue
              ref = "ghcr.io/fosterstack/cache:cand-%s" % v
              subprocess.run(["skopeo", "copy", "oci-archive:%s" % oci, "docker-daemon:%s" % ref], check=False)
              d = subprocess.run(["skopeo", "inspect", "--format", "{{.Digest}}", "docker-daemon:%s" % ref],
                                 capture_output=True, text=True).stdout.strip()
              if d:
                  digs[v] = d
          json.dump(digs, open("/tmp/reports/candidate-digests.json", "w"), indent=1)
          print("recorded digests:", digs)
          PY
          ref="ghcr.io/fosterstack/cache:cand-production"
          grype "docker:${ref}" -o json > /tmp/reports/grype.json 2>/dev/null || true
          trivy image --quiet --format json "${ref}" > /tmp/reports/trivy.json 2>/dev/null || true
          osv-scanner scan image --format json "${ref}" > /tmp/reports/osv-image.json 2>/dev/null || true
          osv-scanner scan source --format json ./go.mod > /tmp/reports/osv-gomod.json 2>/dev/null || true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ always() }}
        with:
          name: rescan-scanner-reports
          include-hidden-files: true
          path: /tmp/reports
