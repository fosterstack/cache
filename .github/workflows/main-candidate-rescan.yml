name: Daily main-candidate rescan

# The daily rescan: main's candidate (below) and, merged from daily-rescan.yml (consolidation 3 of 4), every PUBLISHED
# release's digests (the manifests and rescan jobs at the end). main's candidate is never pushed to a package; this builds it from source through the
# same build + image-assembly stages the release chain uses, then runs the scanner panel (scanner-panel rules
# 1-9, ratified by the owner Oct 2; REQ-SCAN-001..009): Grype, Docker Scout and Amazon Inspector on the six
# images, Google Artifact Analysis on the three variants on linux/amd64, tallied together by bin/panel.py —
# package counts and quorum, the published VEX as the only exception, "seen by N of M", a tracking issue for
# findings seen by two or more scanners; unique findings are listed for the daily auditor, whose run audits them
# right after this one (REQ-REL-004-AC3, amended Oct 2; rule 9, owner Oct 3). Trivy and Snyk are no longer run by the panel; scanner-reports below still hands the daily auditor
# its own inputs (REQ-AUD, unchanged).
on:
  schedule:
    - cron: '41 7 * * *' # offset from the hour; the published-release rescan runs in this same run
  workflow_dispatch: {}

# Top level stays read-only; the two reusable-stage caller jobs carry
# their own grants (which the callee ceilings require), and the scan job
# adds issues:write for the tracking issue. Keeping the default narrow
# means the scan job never holds packages/id-token/attestations.
permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/stage-build.yml
    permissions:
      contents: read
      id-token: write
      attestations: write
    with:
      mode: snapshot

  assemble:
    needs: build
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/stage-image.yml
    with:
      mode: pr
      dist-artifact: dist-snapshot
      expected-checksums: ${{ needs.build.outputs.checksums }}
      upload-oci: true

  # ---------------------------------------------------------------------------------------------------------
  # The scanner panel (scanner-panel rules 1-9, ratified Oct 2; REQ-SCAN-001..009). Four scanner jobs, each
  # leaving its raw output per image for the tally; the set of images is written here, never computed:
  # Grype, Docker Scout and Amazon Inspector scan all six images; Google scans the three variants on
  # linux/amd64 only. Trivy and Snyk are not in the panel (rule 1). A scanner job that fails leaves fewer
  # outputs, which the tally counts as "did not run" (rule 3) — never as clean.
  panel-grype:
    name: panel — Grype (six images)
    needs: [build, assemble]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: oci-candidate
          path: /tmp/oci/
      - name: install grype (pinned by checksum)
        run: ./bin/install-scanner.sh grype
      - name: Grype every image, given our VEX (rule 4)
        run: |
          set -uo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq skopeo
          grype db update >/dev/null 2>&1 || true
          for v in production debug fips; do
            for arch in amd64 arm64; do
              ref="ghcr.io/fosterstack/cache:cand-${v}-${arch}"; d="/tmp/panel/grype/${v}-${arch}"; mkdir -p "$d"
              skopeo copy --override-arch "${arch}" --override-os linux "oci-archive:/tmp/oci/${v}.oci" "docker-daemon:${ref}" || continue
              grype "docker:${ref}" --vex .vex/fosterstack-cache.openvex.json -o "cyclonedx-json=${d}/result.cdx.json" \
                || echo "::warning::grype could not scan ${v}-${arch} (the tally counts it as did not run)"
            done
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ always() }}
        with:
          name: panel-grype
          path: /tmp/panel/
          if-no-files-found: warn

  panel-scout:
    name: panel — Docker Scout (six images)
    needs: [build, assemble]
    runs-on: ubuntu-latest
    environment: agent   # the read-only Docker Hub token for Scout lives here (owner, Oct 2)
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: oci-candidate
          path: /tmp/oci/
      - name: install docker-scout (pinned by checksum)
        run: |
          set -euo pipefail
          ./bin/install-scanner.sh docker-scout "$RUNNER_TEMP"
          mkdir -p "$HOME/.docker/cli-plugins" && install -m 0755 "$RUNNER_TEMP/docker-scout" "$HOME/.docker/cli-plugins/docker-scout"
      - name: log in to Docker Hub for Scout (read-only token)
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_SCOUT_TOKEN: ${{ secrets.DOCKERHUB_SCOUT_TOKEN }}
        run: printf '%s' "$DOCKERHUB_SCOUT_TOKEN" | docker login docker.io -u "$DOCKERHUB_USERNAME" --password-stdin
      # Scout applies only statements whose author --vex-author accepts (default Docker's own): the scan and its self-check
      # both run bin/scout-vex-scan.sh (our author, GitLab format, local://). The self-check scans the pinned debian 12.0
      # fixture under our image's name with a VEX of our author covering only a CVE it does not have, then with one covering CVE-2023-4911;
      # bin/scout-selfcheck.py passes only when exactly that CVE drops and every other finding stays (rule 4,
      # REQ-SCAN-004-AC2), and refuses an empty or malformed report.
      # Advisor 0106: which product identifiers does Scout match for our image? A diagnostic — one statement per candidate
      # form, each on a different CVE the fixture has; it prints which forms Scout applied and never decides the job
      # (the self-check below does, and keeps the rescan red until our published form is applied: fail closed).
      - name: Scout product-form probe (rule 4 diagnostic, advisor 0106)
        # manual dispatch only; its own failures are contained (warning, exit 0) — the self-check decides the job
        if: github.event_name == 'workflow_dispatch'
        run: |
          set +e
          (
            set -euo pipefail
            sudo apt-get update -qq
            sudo apt-get install -y -qq skopeo
            skopeo copy docker://docker.io/library/debian@sha256:60774985572749dc3c39147d43089d53e7ce17b844eebcf619d84467160217ab \
              docker-daemon:ghcr.io/fosterstack/cache:selfcheck
            mkdir -p "$RUNNER_TEMP/probe"
            author=$(jq -er .author .vex/fosterstack-cache.openvex.json)
            jq -n --arg a "$author" '{"@context": "https://openvex.dev/ns/v0.2.0",
              "@id": "https://github.com/fosterstack/cache/scout-probe-none", "author": $a, "timestamp": "2026-10-03T00:00:00Z",
              "version": 1, "statements": [{"vulnerability": {"name": "CVE-1999-0001"}, "status": "not_affected",
              "justification": "vulnerable_code_not_present", "products": [{"@id": "pkg:oci/cache?repository_url=ghcr.io/fosterstack/cache"}]}]}' \
              > "$RUNNER_TEMP/probe/none.json"
            ./bin/scout-vex-scan.sh ghcr.io/fosterstack/cache:selfcheck "$RUNNER_TEMP/probe/none.json" "$RUNNER_TEMP/probe/before.json"
            python3 bin/scout-selfcheck.py probe-doc "$RUNNER_TEMP/probe/before.json" "$author" "$RUNNER_TEMP/probe/forms.json"
            ./bin/scout-vex-scan.sh ghcr.io/fosterstack/cache:selfcheck "$RUNNER_TEMP/probe/forms.json" "$RUNNER_TEMP/probe/after.json"
            echo "== Scout's default: which forms are applied" | tee -a "$GITHUB_STEP_SUMMARY"
            python3 bin/scout-selfcheck.py probe-report "$RUNNER_TEMP/probe/before.json" "$RUNNER_TEMP/probe/after.json" \
              "$RUNNER_TEMP/probe/forms.json.map" | tee -a "$GITHUB_STEP_SUMMARY"
            # the same document with --only-vex-affected; the report's delta check also says whether the flag hides
            # findings no statement covers (then: inconclusive, an uncovered finding disappeared)
            docker scout cves --format gitlab --vex-location "$RUNNER_TEMP/probe/forms.json" --vex-author '^FosterStack LLC$' \
              --only-vex-affected local://ghcr.io/fosterstack/cache:selfcheck > "$RUNNER_TEMP/probe/after-only.json"
            echo "== with --only-vex-affected" | tee -a "$GITHUB_STEP_SUMMARY"
            python3 bin/scout-selfcheck.py probe-report "$RUNNER_TEMP/probe/before.json" "$RUNNER_TEMP/probe/after-only.json" \
              "$RUNNER_TEMP/probe/forms.json.map" | tee -a "$GITHUB_STEP_SUMMARY"
            # advisor 0109, probe 3: statements naming the finding's package (a subcomponent from Scout's own SBOM) and
            # platform-qualified identifiers — on our local image, then on the same fixture as a registry image
            docker scout sbom --format json local://ghcr.io/fosterstack/cache:selfcheck > "$RUNNER_TEMP/probe/sbom.json"
            python3 bin/scout-selfcheck.py probe-doc3 "$RUNNER_TEMP/probe/before.json" "$RUNNER_TEMP/probe/sbom.json" "$author" \
              ghcr.io/fosterstack/cache selfcheck "$RUNNER_TEMP/probe/forms3.json"
            ./bin/scout-vex-scan.sh ghcr.io/fosterstack/cache:selfcheck "$RUNNER_TEMP/probe/forms3.json" "$RUNNER_TEMP/probe/after3.json"
            echo "== probe 3, local image: package subcomponents and platform" | tee -a "$GITHUB_STEP_SUMMARY"
            python3 bin/scout-selfcheck.py probe-report "$RUNNER_TEMP/probe/before.json" "$RUNNER_TEMP/probe/after3.json" \
              "$RUNNER_TEMP/probe/forms3.json.map" | tee -a "$GITHUB_STEP_SUMMARY"
            reg=registry://docker.io/library/debian@sha256:60774985572749dc3c39147d43089d53e7ce17b844eebcf619d84467160217ab
            docker scout cves --format gitlab --vex-location "$RUNNER_TEMP/probe/none.json" --vex-author '^FosterStack LLC$' "$reg" \
              > "$RUNNER_TEMP/probe/before-r.json"
            docker scout sbom --format json "$reg" > "$RUNNER_TEMP/probe/sbom-r.json"
            python3 bin/scout-selfcheck.py probe-doc3 "$RUNNER_TEMP/probe/before-r.json" "$RUNNER_TEMP/probe/sbom-r.json" "$author" \
              docker.io/library/debian sha256:60774985572749dc3c39147d43089d53e7ce17b844eebcf619d84467160217ab "$RUNNER_TEMP/probe/forms3r.json"
            docker scout cves --format gitlab --vex-location "$RUNNER_TEMP/probe/forms3r.json" --vex-author '^FosterStack LLC$' "$reg" \
              > "$RUNNER_TEMP/probe/after-r.json"
            echo "== probe 3, registry image" | tee -a "$GITHUB_STEP_SUMMARY"
            python3 bin/scout-selfcheck.py probe-report "$RUNNER_TEMP/probe/before-r.json" "$RUNNER_TEMP/probe/after-r.json" \
              "$RUNNER_TEMP/probe/forms3r.json.map" | tee -a "$GITHUB_STEP_SUMMARY"
          )
          rc=$?
          set -e
          mkdir -p /tmp/panel && cp -r "$RUNNER_TEMP/probe" /tmp/panel/scout-probe 2>/dev/null || true   # the raw probe files, in the job's artifact
          [ "$rc" = 0 ] || echo "::warning::the Scout probe could not finish (exit ${rc}); the self-check below decides the job"
          echo "Until our published form is applied, the self-check keeps this rescan red (fail closed, rule 4)." >> "$GITHUB_STEP_SUMMARY" || true
          exit 0
      - name: Scout applies a statement by our author to our image name (rule 4 self-check)
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq skopeo
          skopeo copy docker://docker.io/library/debian@sha256:60774985572749dc3c39147d43089d53e7ce17b844eebcf619d84467160217ab \
            docker-daemon:ghcr.io/fosterstack/cache:selfcheck
          mkdir -p "$RUNNER_TEMP/selfcheck"
          vex() {   # <statements json> <out>: a VEX document of our author
            jq -n --arg a "$(jq -er .author .vex/fosterstack-cache.openvex.json)" --argjson s "$1" '{"@context": "https://openvex.dev/ns/v0.2.0",
              "@id": "https://github.com/fosterstack/cache/scout-selfcheck", "author": $a, "timestamp": "2026-10-03T00:00:00Z",
              "version": 1, "statements": $s}' > "$2"
          }
          # "none": one statement for a CVE the fixture does not have (a VEX file with no statement may not be valid OpenVEX)
          vex '[{"vulnerability": {"name": "CVE-1999-0001"}, "status": "not_affected", "justification": "vulnerable_code_not_present",
                 "products": [{"@id": "pkg:oci/cache?repository_url=ghcr.io/fosterstack/cache"}]}]' "$RUNNER_TEMP/selfcheck/none.json"
          vex '[{"vulnerability": {"name": "CVE-2023-4911"}, "status": "not_affected", "justification": "vulnerable_code_not_present",
                 "products": [{"@id": "pkg:oci/cache?repository_url=ghcr.io/fosterstack/cache"}]}]' "$RUNNER_TEMP/selfcheck/one.json"
          ./bin/scout-vex-scan.sh ghcr.io/fosterstack/cache:selfcheck "$RUNNER_TEMP/selfcheck/none.json" "$RUNNER_TEMP/selfcheck/before.json"
          ./bin/scout-vex-scan.sh ghcr.io/fosterstack/cache:selfcheck "$RUNNER_TEMP/selfcheck/one.json" "$RUNNER_TEMP/selfcheck/after.json"
          docker image rm ghcr.io/fosterstack/cache:selfcheck >/dev/null
          python3 bin/scout-selfcheck.py "$RUNNER_TEMP/selfcheck/before.json" "$RUNNER_TEMP/selfcheck/after.json" CVE-2023-4911
      - name: Docker Scout every image, given our VEX (rule 4)
        run: |
          set -uo pipefail
          for v in production debug fips; do
            for arch in amd64 arm64; do
              ref="ghcr.io/fosterstack/cache:cand-${v}-${arch}"; d="/tmp/panel/scout/${v}-${arch}"; mkdir -p "$d"
              skopeo copy --override-arch "${arch}" --override-os linux "oci-archive:/tmp/oci/${v}.oci" "docker-daemon:${ref}" || continue
              docker scout sbom --format json "local://${ref}" > "${d}/sbom.json" \
                && ./bin/scout-vex-scan.sh "${ref}" .vex/fosterstack-cache.openvex.json "${d}/cves.json" \
                || echo "::warning::docker scout could not scan ${v}-${arch} (the tally counts it as did not run)"
            done
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ always() }}
        with:
          name: panel-scout
          path: /tmp/panel/
          if-no-files-found: warn

  # The Docker Scout root-cause round (advisor 0120/0121/0122), dispatch only: the attestation path on a scratch package
  # (never the release package; the digests before and after are recorded), then Docker's documented control, one field
  # changed at a time, and our forms, on Scout 1.26.0 and the two previous minors. Results in the job summary.
  scout-root-cause:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    environment: agent   # the read-only Docker Hub token for Scout lives here (owner, Oct 2)
    permissions:
      contents: read
      # packages: write reaches every package linked to this repository (the token cannot be narrower); the job runs only
      # from main (the agent environment), and bin/scout-root-cause.sh refuses any target but the scratch package
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: the containerd image store (Docker's documented requirement for attestations)
        run: |
          set -euo pipefail
          echo '{"features": {"containerd-snapshotter": true}}' | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker
          docker info -f '{{ .DriverStatus }}'

      - name: install docker-scout 1.26.0, 1.25.0 and 1.24.0 (each pinned by checksum) and skopeo
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/scout" "$HOME/.docker/cli-plugins"
          for t in docker-scout docker-scout-1.25.0 docker-scout-1.24.0; do
            mkdir -p "$RUNNER_TEMP/$t"      # install-scanner.sh never creates its DEST (Codex #176 r2, B2)
            ./bin/install-scanner.sh "$t" "$RUNNER_TEMP/$t"
          done
          mv "$RUNNER_TEMP/docker-scout/docker-scout" "$RUNNER_TEMP/scout/docker-scout-1.26.0"
          mv "$RUNNER_TEMP/docker-scout-1.25.0/docker-scout" "$RUNNER_TEMP/scout/docker-scout-1.25.0"
          mv "$RUNNER_TEMP/docker-scout-1.24.0/docker-scout" "$RUNNER_TEMP/scout/docker-scout-1.24.0"
          sudo apt-get update -qq && sudo apt-get install -y -qq skopeo

      - name: log in to Docker Hub (read-only token) and GHCR (this job's token)
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_SCOUT_TOKEN: ${{ secrets.DOCKERHUB_SCOUT_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s' "$DOCKERHUB_SCOUT_TOKEN" | docker login docker.io -u "$DOCKERHUB_USERNAME" --password-stdin
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin

      - name: the root-cause round
        env:
          SCOUT_DIR: ${{ runner.temp }}/scout
          PROBE_REPO: ghcr.io/fosterstack/cache-scout-probe
          RELEASE_TAG: '0.2.1'
        run: bash bin/scout-root-cause.sh "$RUNNER_TEMP/rc" | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ always() }}
        with:
          name: scout-root-cause
          path: ${{ runner.temp }}/rc/
          retention-days: 30

  panel-inspector:
    name: panel — Amazon Inspector (six images)
    needs: [build, assemble]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # the ScanSbom-only role, by OIDC (no stored secret)
    env:
      INSPECTOR_ROLE: arn:aws:iam::821302803867:role/fosterstack-cache-inspector-scan
      INSPECTOR_REGION: us-east-1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: oci-candidate
          path: /tmp/oci/
      - name: install inspector-sbomgen (pinned by checksum)
        run: ./bin/install-scanner.sh inspector-sbomgen
      - name: assume the ScanSbom-only role (OIDC; no stored secret)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ env.INSPECTOR_ROLE }}
          aws-region: ${{ env.INSPECTOR_REGION }}
          role-session-name: cache-panel-${{ github.run_id }}
      # Same-day reuse of Amazon Inspector results (REQ-REL-004-AC5): keyed by the SBOM's package inventory (bin/inspector-reuse.py),
      # stored in the Actions cache, one entry per UTC day per run. The restore key never matches exactly, so restore-keys
      # picks the newest same-day entry; a run that only reused saves nothing. Same-repo runs only (no fork reads or writes).
      - name: Amazon Inspector - today's date (UTC) for the same-day reuse
        id: insp-date
        run: echo "date=$(date -u +%F)" >> "$GITHUB_OUTPUT"
      - name: Amazon Inspector - restore today's results (same-repo runs only)
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/inspector-cache
          key: inspector-${{ steps.insp-date.outputs.date }}-${{ github.run_id }}-miss
          restore-keys: inspector-${{ steps.insp-date.outputs.date }}-
      - name: Amazon Inspector every image (our pipeline applies the VEX, rule 4)
        id: insp-scan
        run: |
          set -uo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq skopeo
          # Same-day reuse (REQ-REL-004-AC5): an inventory Inspector already scanned today is copied from the cache
          # to scan.json; anything else calls ScanSbom once and stores the answer. The tally reads scan.json either way.
          cdir=/tmp/inspector-cache; fresh=0; mkdir -p "$cdir"
          for v in production debug fips; do
            for arch in amd64 arm64; do
              ref="ghcr.io/fosterstack/cache:cand-${v}-${arch}"; d="/tmp/panel/inspector/${v}-${arch}"; mkdir -p "$d"
              skopeo copy --override-arch "${arch}" --override-os linux "oci-archive:/tmp/oci/${v}.oci" "docker-daemon:${ref}" || continue
              if ! inspector-sbomgen container --image "${ref}" --outfile "${d}/sbom.cdx.json" --disable-progress-bar; then
                echo "::warning::inspector could not scan ${v}-${arch} (the tally counts it as did not run)"; continue
              fi
              key=$(python3 bin/inspector-reuse.py key "${d}/sbom.cdx.json") \
                || { echo "::warning::inspector could not scan ${v}-${arch} (the tally counts it as did not run)"; continue; }
              verdict=$(python3 bin/inspector-reuse.py decide "$cdir" "$(date -u +%F)" "${d}/sbom.cdx.json") || verdict=call
              if [ "${verdict%%$'\n'*}" = reuse ] && cp "${verdict#*$'\n'}" "${d}/scan.json"; then
                :
              elif aws inspector-scan scan-sbom --sbom "file://${d}/sbom.cdx.json" --output-format CYCLONE_DX_1_5 > "${d}/scan.json"; then
                if python3 bin/inspector-reuse.py store "$cdir" "$(date -u +%F)" "${d}/sbom.cdx.json" "${d}/scan.json"; then
                  fresh=$((fresh+1))
                else
                  echo "::warning::the ScanSbom answer for ${v}-${arch} is not a CycloneDX result (the tally counts it as did not run)"; rm -f "${d}/scan.json"
                fi
              else
                echo "::warning::inspector could not scan ${v}-${arch} (the tally counts it as did not run)"; rm -f "${d}/scan.json"
              fi
            done
          done
          echo "fresh=${fresh}" >> "$GITHUB_OUTPUT"
      - name: Amazon Inspector - the UTC day at save time
        id: insp-save-day
        if: always()
        run: echo "date=$(date -u +%F)" >> "$GITHUB_OUTPUT"
      - name: Amazon Inspector - save today's new results (only when this run made some; same-repo runs only)
        if: always() && steps.insp-scan.outputs.fresh != '' && steps.insp-scan.outputs.fresh != '0' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/inspector-cache
          key: inspector-${{ steps.insp-save-day.outputs.date }}-${{ github.run_id }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ always() }}
        with:
          name: panel-inspector
          path: /tmp/panel/
          if-no-files-found: warn

  panel-google:
    name: panel — Google Artifact Analysis (three variants, linux/amd64)
    needs: [build, assemble]
    runs-on: ubuntu-latest
    # The scanner identity admits main only as `push` or through the main-only `agent` environment; this
    # job runs on `schedule`, so it takes the environment (ops/terraform/gcp; no secret is read here).
    environment: agent
    permissions:
      contents: read
      id-token: write   # the workload identity (rule 2): no keys
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: oci-candidate
          path: /tmp/oci/
      - name: federated identity (rule 2; the identifiers are repository variables)
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.CACHE_SCANNER_PROVIDER }}
          service_account: ${{ vars.CACHE_SCANNER_SERVICE_ACCOUNT }}
          project_id: fosterstack-cache
      - name: a pinned gcloud with the local-extract component
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        with:
          version: '587.0.0'
          install_components: local-extract
      - name: Google on-demand scan of the three variants, linux/amd64 only (rule 1; our pipeline applies the VEX)
        run: |
          set -uo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq skopeo
          for v in production debug fips; do
            ref="ghcr.io/fosterstack/cache:cand-${v}-amd64"; d="/tmp/panel/google/${v}-amd64"; mkdir -p "$d"
            skopeo copy --override-arch amd64 --override-os linux "oci-archive:/tmp/oci/${v}.oci" "docker-daemon:${ref}" || continue
            if gcloud artifacts docker images scan "${ref}" --additional-package-types=GO --format=json --log-http \
                 > "${d}/scan.json" 2> "${d}/http.log"; then
              python3 bin/panel.py google-packages "${d}/http.log" > "${d}/packages.json"
              gcloud artifacts docker images list-vulnerabilities "$(jq -r '.response.scan' "${d}/scan.json")" --format=json > "${d}/vulns.json" \
                || rm -f "${d}/packages.json"
            fi
            rm -f "${d}/http.log"   # the request log holds tokens; never uploaded
            [ -s "${d}/packages.json" ] || echo "::warning::google could not scan ${v} (the tally counts it as did not run)"
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ always() }}
        with:
          name: panel-google
          path: /tmp/panel/
          if-no-files-found: warn

  panel:
    name: panel — tally the day (rules 3-6)
    needs: [panel-grype, panel-scout, panel-inspector, panel-google]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write      # the tracking issue (rule 5)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: the four scanners' outputs (a missing one is "did not run")
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          pattern: panel-*
          path: /tmp/panel/
          merge-multiple: true
      - name: tally the day's findings — counts, quorum, seen by N of M (rules 3-6; unique findings go to the auditor)
        id: judge
        run: |
          set +e
          python3 bin/panel.py tally --in /tmp/panel --vex .vex/fosterstack-cache.openvex.json --out /tmp/panel-out
          echo "rc=$?" >> "$GITHUB_OUTPUT"
          cat /tmp/panel-out/summary.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null
          exit 0
      - name: open or update the tracking issue (seen by two or more scanners; rule 5)
        if: ${{ always() && steps.judge.outcome == 'success' && github.ref == 'refs/heads/main' }}   # only main's rescan files the issue
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          [ -s /tmp/panel-out/issue.md ] || exit 0
          title="Daily scanner panel: findings on main"
          { cat /tmp/panel-out/issue.md; echo; echo "commit \`${GITHUB_SHA}\` — run ${RUN_URL}"; } > /tmp/panel-out/issue-body.md
          n=$(gh issue list --state open --label daily-rescan --json number,title --jq "[.[] | select(.title == \"${title}\")][0].number // empty")
          if [ -n "$n" ]; then gh issue comment "$n" --body-file /tmp/panel-out/issue-body.md
          else
            # `gh issue create --label X` fails when X does not exist, and a lost tracking issue is a lost finding: make sure both
            # labels exist first (created without forcing, so an existing label's colour and description are never overwritten; the values are
            # policy.LABELS', and a test pins them equal)
            gh label create daily-rescan --description "The daily rescan's tracking issue" --color 0E8A16 2>/dev/null || true
            gh label create security --description "Security finding" --color D93F0B 2>/dev/null || true
            gh issue create --title "$title" --label daily-rescan --label security --body-file /tmp/panel-out/issue-body.md
          fi
      - name: keep the verdict — the auditor's input (every finding, seen by N of M, the unique ones listed)
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: panel-evidence
          path: /tmp/panel-out/
          if-no-files-found: warn
      - name: fail the run unless every image counted and nothing is to report (rule 3; never reported clean)
        if: ${{ steps.judge.outputs.rc != '0' }}
        run: |
          echo "::error::scanner panel: rc ${{ steps.judge.outputs.rc }} (1 = findings to report, 2 = a scanner did not run, an image did not count, or the tally could not run)" >&2
          exit 1

  # The daily auditor (auditor.yml) consumes this run: it needs the candidate's recorded
  # digest (to assert it loaded the right image) and, in production, the scanners' JSON
  # reports (so REQ-AUD-1 AC2 — "consume the rescan's own scan output" — holds without the
  # auditor re-scanning). This job GATES NOTHING (mirrors the trivy/snyk daily jobs): it
  # writes machine-readable reports and uploads them with if: always(), so even a day the
  # candidate is red still hands the auditor its inputs.
  scanner-reports:
    name: scanner reports for the daily auditor (non-gating)
    needs: [build, assemble]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: oci-candidate
          path: /tmp/oci/
      - name: install scanners (pinned by checksum)
        run: for s in grype trivy osv-scanner; do ./bin/install-scanner.sh "$s" || true; done
      - name: load the candidates and emit JSON reports + recorded digests
        continue-on-error: true
        run: |
          set -uo pipefail
          command -v skopeo >/dev/null 2>&1 || sudo apt-get update -qq && sudo apt-get install -y -qq skopeo || true
          mkdir -p /tmp/reports
          : > /tmp/reports/candidate-digests.json
          python3 - <<'PY'
          import json, subprocess, os
          digs = {}
          for v in ("production", "debug", "fips"):
              oci = "/tmp/oci/%s.oci" % v
              if not os.path.exists(oci):
                  continue
              ref = "ghcr.io/fosterstack/cache:cand-%s" % v
              subprocess.run(["skopeo", "copy", "oci-archive:%s" % oci, "docker-daemon:%s" % ref], check=False)
              d = subprocess.run(["skopeo", "inspect", "--format", "{{.Digest}}", "docker-daemon:%s" % ref],
                                 capture_output=True, text=True).stdout.strip()
              if d:
                  digs[v] = d
          json.dump(digs, open("/tmp/reports/candidate-digests.json", "w"), indent=1)
          print("recorded digests:", digs)
          PY
          ref="ghcr.io/fosterstack/cache:cand-production"
          grype "docker:${ref}" -o json > /tmp/reports/grype.json 2>/dev/null || true
          trivy image --quiet --format json "${ref}" > /tmp/reports/trivy.json 2>/dev/null || true
          osv-scanner scan image --format json "${ref}" > /tmp/reports/osv-image.json 2>/dev/null || true
          osv-scanner scan source --format json ./go.mod > /tmp/reports/osv-gomod.json 2>/dev/null || true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ always() }}
        with:
          name: rescan-scanner-reports
          include-hidden-files: true
          path: /tmp/reports

  # ---------------------------------------------------------------------------------------------------------------
  # Merged from daily-rescan.yml (workflow consolidation 3 of 4, owner RATIFIED Oct 2): the daily rescan of every
  # PUBLISHED release's digests (release-chain-design.md §3) — enumerate the release manifests and the legacy inventory,
  # then scan each (release, variant, scanner) digest at the release gate's policy, VEX the only exception. It runs under
  # this file's ONE schedule, so the auditor never selects a rescan run that lacks the candidate.
  manifests:
    name: enumerate release manifests
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.collect.outputs.targets }}
      any: ${{ steps.collect.outputs.any }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: collect (release, variant, digest, scanner) targets
        id: collect
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          scanners=$(jq -c '.scanners' .github/policy/scanners.json)
          : > /tmp/targets.jsonl

          # F12: legacy releases that predate release-manifest.json are
          # covered from a committed inventory, so the daily rescan never
          # silently stops covering the current public release.
          jq -c --argjson scanners "$scanners" \
            '.releases[] as $r | $r.images[] as $img | $scanners[] as $s |
             {release: $r.version, variant: $img.variant, digest: $img.digest, scanner: $s, source: "legacy-inventory"}' \
            .github/policy/legacy-releases.json >> /tmp/targets.jsonl
          legacy_versions=$(jq -r '[.releases[].version] | join(" ")' .github/policy/legacy-releases.json)

          # Manifest-bearing releases: enumerate ASSETS first, so we can
          # tell an intentional legacy absence (no manifest asset) from a
          # FAILED read of a manifest that is present (F13).
          #
          # R12: capture the release list with an EXPLICIT exit check. A
          # `for tag in $(gh release list ...)` swallows the command
          # substitution's failure (set -e does not catch it there), so an
          # API outage would drop every manifest-bearing release while the
          # legacy inventory kept the job green. Fail loudly instead; an
          # empty-but-successful list (no releases yet) is fine.
          if ! gh release list --limit 100 --json tagName,isDraft > /tmp/releases.json; then
            echo "::error::could not enumerate releases (gh release list failed) - refusing to rescan a partial inventory" >&2
            exit 1
          fi
          jq -e 'type == "array"' /tmp/releases.json >/dev/null \
            || { echo "::error::gh release list did not return a JSON array" >&2; exit 1; }
          for tag in $(jq -r '.[] | select(.isDraft | not) | .tagName' /tmp/releases.json); do
            case " $legacy_versions " in *" $tag "*) continue ;; esac
            has_manifest=$(gh release view "$tag" --json assets \
              --jq '[.assets[] | select(.name == "release-manifest.json")] | length')
            if [ "$has_manifest" -eq 0 ]; then
              echo "note: ${tag} has no release-manifest.json asset and is not in the legacy inventory — skipping (add it to legacy-releases.json if it must be scanned)"
              continue
            fi
            # The asset exists: a failed download/parse is an ERROR, not
            # an empty result that would erase the release from coverage.
            if ! gh release download "$tag" -p release-manifest.json -O "/tmp/m-${tag}.json"; then
              echo "::error::release-manifest.json is present on ${tag} but could not be downloaded — refusing to drop it from the rescan" >&2
              exit 1
            fi
            jq empty "/tmp/m-${tag}.json" 2>/dev/null \
              || { echo "::error::release-manifest.json on ${tag} is not valid JSON" >&2; exit 1; }
            imgcount=$(jq '.images | length' "/tmp/m-${tag}.json")
            [ "$imgcount" -ge 1 ] || { echo "::error::release-manifest.json on ${tag} lists no images" >&2; exit 1; }
            jq -c --arg tag "$tag" --argjson scanners "$scanners" \
              '.images[] as $img | $scanners[] as $s |
               {release: $tag, variant: $img.variant, digest: $img.digest, scanner: $s, source: "release-manifest"}' \
              "/tmp/m-${tag}.json" >> /tmp/targets.jsonl
          done

          targets=$(jq -s -c '.' /tmp/targets.jsonl)
          # Every matrix value reaches the rescan job: each must have its exact shape, or no matrix is emitted — a release
          # manifest's data never becomes shell source (Codex #160 pin pass, B78-01)
          TARGET_SHAPE='all(.[]; (.release | test("^v[0-9]+[.][0-9]+[.][0-9]+(-rc[.][0-9]+)?$")) and (.variant | test("^[a-z0-9][a-z0-9-]{0,31}$")) and (.digest | test("^sha256:[0-9a-f]{64}$")) and (.scanner | test("^[a-z0-9][a-z0-9-]{0,31}$")))'
          jq -e "$TARGET_SHAPE" <<<"$targets" > /dev/null \
            || { echo "::error::a rescan target has a malformed release, variant, digest or scanner - refusing to emit the matrix" >&2; exit 1; }
          echo "targets=${targets}" >> "$GITHUB_OUTPUT"
          n=$(jq 'length' <<<"$targets")
          # There is ALWAYS at least the legacy inventory, so an empty set
          # means the inventory itself is broken - fail, do not no-op.
          if [ "$n" -eq 0 ]; then
            echo "::error::no rescan targets at all - the legacy inventory is empty or unreadable" >&2
            exit 1
          fi
          echo "any=true" >> "$GITHUB_OUTPUT"
          echo "rescanning ${n} (release, variant, scanner) targets"

  rescan:
    name: ${{ matrix.target.scanner }} ${{ matrix.target.release }} ${{ matrix.target.variant }}
    needs: manifests
    if: needs.manifests.outputs.any == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      packages: read
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.manifests.outputs.targets) }}
    # matrix values reach scripts only through these, quoted (B78-01)
    env:
      TARGET_RELEASE: ${{ matrix.target.release }}
      TARGET_VARIANT: ${{ matrix.target.variant }}
      TARGET_DIGEST: ${{ matrix.target.digest }}
      TARGET_SCANNER: ${{ matrix.target.scanner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Enumerate the platform CHILDREN of the index so both
      # architectures are scanned by EVERY scanner, not just the runner's
      # default (B04a: the ongoing rescan must cover each child for Trivy,
      # Grype AND Snyk, like the release scanner). children.txt: one
      # "os/arch<TAB>childref" per line; a recognized single-image
      # manifest falls back to the index itself.
      - name: enumerate platform children
        run: |
          set -euo pipefail
          echo '${{ github.token }}' | docker login ghcr.io -u '${{ github.actor }}' --password-stdin || true
          ref="ghcr.io/${GITHUB_REPOSITORY_OWNER}/cache@${TARGET_DIGEST}"
          : > /tmp/children.txt
          # A FAILED or MALFORMED enumeration must REJECT the run (B04): a
          # lost platform inventory must never be silently downgraded to a
          # single-arch index scan. Only a VALID manifest that genuinely has
          # no platform children falls back to "scan the index as itself".
          if ! docker buildx imagetools inspect --raw "$ref" > /tmp/index.json 2>/tmp/inspect.err; then
            echo "::error::could not inspect ${ref} to enumerate platform children — refusing to rescan on an unknown platform inventory" >&2
            cat /tmp/inspect.err >&2 || true
            exit 1
          fi
          # B04c/B04f: shape + descriptor validation lives in the extracted,
          # unit-tested bin/rescan-statement.py so the "every expected image
          # descriptor must have a usable platform" rule is exercised by
          # bin/rescan-statement-test.sh, not just an external probe. It
          # rejects invalid JSON, `{}`, `{"manifests":null}`, and — crucially
          # — a multi-platform index in which ANY plain image descriptor has a
          # null/empty/"unknown" platform (a lost platform is never downgraded
          # to a single-arch scan). A descriptor without a usable platform is
          # tolerated only when it is EXPLICITLY an attestation/referrer
          # descriptor. A recognized single-image manifest (.config + .layers)
          # still falls back to scanning the index as itself.
          python3 bin/rescan-statement.py enumerate \
            --index /tmp/index.json \
            --repo "ghcr.io/${{ github.repository_owner }}/cache" \
            --ref "$ref" \
            --out /tmp/children.txt
          echo "children to scan:"; cat /tmp/children.txt

      # ---- trivy (CLI: reliable version/db, by digest) -------------------
      - name: Trivy rescan (by digest, JSON findings)
        if: matrix.target.scanner == 'trivy'
        id: trivy
        continue-on-error: true
        env:
          TRIVY_VEX: ${{ github.workspace }}/.vex/fosterstack-cache.openvex.json
        run: |
          set -euo pipefail
          ./bin/install-scanner.sh trivy
          rc=0
          child_no=0
          : > /tmp/children-scanned.jsonl
          # B04: a FINDING makes trivy exit nonzero (--exit-code 1). Capture
          # that with `|| code=$?` so errexit does NOT abort the loop before
          # the exit code is recorded, the platform is captured, or the next
          # child is scanned. Every child is scanned, its OWN exit code and
          # report path recorded per child; the merge, shape validation and
          # exit-code classification happen once, in the unit-tested
          # bin/rescan-statement.py, so no finding is dropped (deterministic,
          # explicit per-child inputs — no glob).
          while IFS=$'\t' read -r platform ref; do
            [ -n "$platform" ] || continue
            child_no=$((child_no + 1))
            out="/tmp/findings-child-${child_no}.json"
            echo "trivy: ${platform} ${ref}"
            code=0
            trivy image --quiet --exit-code 1 \
              --severity CRITICAL,HIGH,MEDIUM,LOW,UNKNOWN \
              --vex "${TRIVY_VEX}" \
              --format json --output "$out" \
              "${ref}" || code=$?
            [ "$code" -gt "$rc" ] && rc=$code
            jq -nc --arg p "$platform" --arg r "$ref" --argjson e "$code" --arg f "$out" \
              '{platform:$p, ref:$r, exit:$e, report:$f}' >> /tmp/children-scanned.jsonl
          done < /tmp/children.txt
          exit $rc

      # ---- grype (CLI: reliable version/db, by digest) -------------------
      - name: Grype rescan (by digest, JSON findings)
        if: matrix.target.scanner == 'grype'
        id: grype
        continue-on-error: true
        run: |
          set -euo pipefail
          ./bin/install-scanner.sh grype
          rc=0
          child_no=0
          : > /tmp/children-scanned.jsonl
          # B04: `--fail-on negligible` makes grype exit nonzero on a
          # FINDING. Grype returns 2 for a vulnerability match and
          # 1 for an operational error (the reverse of its --help text;
          # see cmd/grype/cli/cli.go, unchanged at the pinned v0.118.0) - the exit-code contract
          # is in bin/rescan-statement.py. Capture it with `|| code=$?` so
          # errexit does not abort the loop; the per-child exit code +
          # report path are recorded and the merge/classification happens
          # once in bin/rescan-statement.py.
          while IFS=$'\t' read -r platform ref; do
            [ -n "$platform" ] || continue
            child_no=$((child_no + 1))
            out="/tmp/grype-child-${child_no}.json"
            echo "grype: ${platform} ${ref}"
            plat_arg=""
            case "$platform" in */*) plat_arg="--platform ${platform}";; esac
            code=0
            # shellcheck disable=SC2086
            grype "registry:${ref}" $plat_arg \
              --fail-on negligible \
              --vex .vex/fosterstack-cache.openvex.json \
              -o json --file "$out" || code=$?
            [ "$code" -gt "$rc" ] && rc=$code
            jq -nc --arg p "$platform" --arg r "$ref" --argjson e "$code" --arg f "$out" \
              '{platform:$p, ref:$r, exit:$e, report:$f}' >> /tmp/children-scanned.jsonl
          done < /tmp/children.txt
          exit $rc

      # ---- osv-scanner (OSV.dev database, by digest) -------------------
      - name: OSV-Scanner rescan (by digest, JSON findings)
        if: matrix.target.scanner == 'osv-scanner'
        id: osv
        continue-on-error: true
        run: |
          set -euo pipefail
          ./bin/install-scanner.sh osv-scanner
          rc=0
          child_no=0
          : > /tmp/children-scanned.jsonl
          # osv-scanner exit codes: 0 clean, 1 findings, other nonzero =
          # operational failure (contract in bin/rescan-statement.py). Captured
          # per child with `|| code=$?` so errexit does not abort the loop; the
          # merge/classification happens once, downstream.
          while IFS=$'\t' read -r platform ref; do
            [ -n "$platform" ] || continue
            child_no=$((child_no + 1))
            out="/tmp/osv-child-${child_no}.json"
            echo "osv-scanner: ${platform} ${ref}"
            code=0
            osv-scanner scan image --format json --output "$out" "${ref}" || code=$?
            [ "$code" -gt "$rc" ] && rc=$code
            jq -nc --arg p "$platform" --arg r "$ref" --argjson e "$code" --arg f "$out" \
              '{platform:$p, ref:$r, exit:$e, report:$f}' >> /tmp/children-scanned.jsonl
          done < /tmp/children.txt
          exit $rc

      # ---- scanner identity (F14) ----------------------------------------
      - name: record scanner version and database state
        run: |
          set -euo pipefail
          : > /tmp/scanner-meta
          case "$TARGET_SCANNER" in
            trivy)
              echo "version=$(trivy --version 2>/dev/null | awk 'NR==1{print $2}')" >> /tmp/scanner-meta
              echo "db=$(trivy version --format json 2>/dev/null | jq -r '.VulnerabilityDB.UpdatedAt // "unknown"')" >> /tmp/scanner-meta ;;
            grype)
              echo "version=$(grype version 2>/dev/null | awk '/^Version:/{print $2}')" >> /tmp/scanner-meta
              echo "db=$(grype db status 2>/dev/null | awk '/Built|built/{print $NF; exit}')" >> /tmp/scanner-meta ;;
            osv-scanner)
              echo "version=$(osv-scanner --version 2>/dev/null | awk 'NR==1{print $NF}')" >> /tmp/scanner-meta
              echo "db=OSV.dev (osv-scalibr; deps.dev)" >> /tmp/scanner-meta ;;
          esac
          cat /tmp/scanner-meta

      # ---- statement -----------------------------------------------------
      # The merge, OS+application normalization (B04d), and exit-code
      # classification (B04e) live in the unit-tested bin/rescan-statement.py
      # (exercised by bin/rescan-statement-test.sh in the requirements CI
      # job), not inline here — so a regression is caught in PR CI. It reads
      # the per-child manifest each scanner loop wrote (platform, ref, exit
      # code, report path), applies each scanner's OWN exit-code contract
      # INDEPENDENTLY of parse success, merges OS AND application findings
      # from every child preserving platform + project context, and writes
      # the statement, the merged raw report, and the outcome/has_findings
      # step outputs.
      - name: write the digest-keyed rescan statement
        id: statement
        run: |
          set -euo pipefail
          python3 bin/rescan-statement.py statement \
            --scanner "$TARGET_SCANNER" \
            --children /tmp/children-scanned.jsonl \
            --meta /tmp/scanner-meta \
            --vex .vex/fosterstack-cache.openvex.json \
            --scope-file /tmp/scan-scope.json \
            --release "$TARGET_RELEASE" \
            --variant "$TARGET_VARIANT" \
            --digest "$TARGET_DIGEST" \
            --image-ref "ghcr.io/${GITHUB_REPOSITORY_OWNER}/cache@${TARGET_DIGEST}" \
            --scanned-at "$(date -u +%Y-%m-%dT%H:%M:%S+00:00)" \
            --raw-out /tmp/findings-raw.json \
            --out /tmp/rescan-statement.json \
            --github-output "$GITHUB_OUTPUT"

      - name: stage the raw report AND the per-child reports beside the statement
        run: |
          set -euo pipefail
          mkdir -p /tmp/rescan-out
          cp /tmp/rescan-statement.json /tmp/rescan-out/
          [ -f /tmp/findings-raw.json ] && cp /tmp/findings-raw.json /tmp/rescan-out/ || true
          # B04d: retain the ORIGINAL per-child reports too, so the raw
          # evidence that carries e.g. an arm64 application-only finding
          # survives artifact upload, not just the merged report. The child
          # paths come from the deterministic per-child manifest (no glob).
          if [ -f /tmp/children-scanned.jsonl ]; then
            mkdir -p /tmp/rescan-out/children
            while IFS= read -r line; do
              [ -n "$line" ] || continue
              f=$(jq -r '.report' <<<"$line")
              [ -f "$f" ] && cp "$f" /tmp/rescan-out/children/ || true
            done < /tmp/children-scanned.jsonl
          fi

      - name: upload the statement AND the raw report (evidence, clean or not)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rescan-${{ matrix.target.release }}-${{ matrix.target.variant }}-${{ matrix.target.scanner }}
          path: /tmp/rescan-out/
          retention-days: 90

      # B04b: notify on ANY real finding, independently of completeness. This
      # fires on has_findings (not outcome=='findings'), so a run that both
      # found a CVE AND had an operational failure still files the issue —
      # while the operational error still fails the run below.
      - name: file/update a tracking issue on findings
        if: steps.statement.outputs.has_findings == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const t = ${{ toJSON(matrix.target) }};
            const short = t.digest.replace('sha256:', '').slice(0, 12);
            const title = `Daily rescan: findings in ${t.release} ${t.variant} @${short} (${t.scanner})`;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `The daily rescan found new findings.\n\n- release: \`${t.release}\`\n- variant: \`${t.variant}\`\n- digest: \`${t.digest}\`\n- scanner: \`${t.scanner}\`\n- statement artifact: \`rescan-${t.release}-${t.variant}-${t.scanner}\` on ${runUrl}\n\nThese bytes have not changed since release — this is a newly-disclosed CVE against previously-shipped code, the case the 24-48h response SLA targets. Per policy: if an upstream fix exists, ship the version bump; if not, publish a VEX statement and mitigation.`;
            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo, state: 'open', labels: 'daily-rescan',
            });
            const match = existing.find(i => i.title === title);
            if (match) {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: match.number, body });
            } else {
              // issues.create fails (422) when a label does not exist, and a lost tracking issue is a lost finding: make sure both
              // labels exist first. An existing label is left as it is (a 422 here is fine); any other failure shows up in the create below.
              // The values are policy.LABELS', and a test pins them equal.
              for (const [name, description, color] of [['daily-rescan', "The daily rescan's tracking issue", '0E8A16'], ['security', 'Security finding', 'D93F0B']]) {
                try { await github.rest.issues.createLabel({ owner: context.repo.owner, repo: context.repo.repo, name, description, color }); } catch (e) { /* exists, or the create below reports it */ }
              }
              await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title, body, labels: ['daily-rescan', 'security'] });
            }

      - name: a findings verdict fails the run (visible red, same bar as the gate)
        if: steps.statement.outputs.outcome == 'findings'
        run: |
          echo "::error::rescan found findings for ${TARGET_RELEASE} ${TARGET_VARIANT} (${TARGET_SCANNER}) — see the tracking issue" >&2
          exit 1

      # An operational failure is NOT clean CVE evidence: fail the run with
      # a distinct signal so a scanner that could not run is never recorded
      # as a passing rescan (completion note).
      - name: an operational error fails the run distinctly
        if: steps.statement.outputs.outcome == 'error'
        run: |
          echo "::error::rescan scanner ${TARGET_SCANNER} failed to complete for ${TARGET_RELEASE} ${TARGET_VARIANT} — this is an operational failure, not a clean result" >&2
          exit 1
