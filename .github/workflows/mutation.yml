name: Mutation testing (advisory)

# test-strategy.md §6: coverage says the tests ran the code; the mutation
# score says the tests would NOTICE the code being wrong. gremlins mutates
# the product and re-runs the suite per mutant; a mutant the suite still
# passes ("lived") is a gap in assertion strength. This is ADVISORY - the
# score is published, never gated, until the owner sets a baseline in
# .gremlins.yaml. Runs weekly and on demand, not on every PR (a full
# mutation run is far heavier than the test suite).

on:
  schedule:
    - cron: '23 6 * * 1' # Mondays, offset from the hour
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  mutation:
    name: mutation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27'
          check-latest: true
      - name: install gremlins (pinned)
        run: go install github.com/go-gremlins/gremlins/cmd/gremlins@v0.6.0
      - name: unleash gremlins on the product packages
        id: run
        run: |
          set -uo pipefail
          {
            echo "## Mutation testing (advisory)"
            echo
            echo "Tool: gremlins v0.6.0. Score is advisory (test-strategy §6)."
            echo
            echo '```'
            "$(go env GOPATH)/bin/gremlins" unleash --output /tmp/mutation.json \
              ./... 2>&1 | tee /tmp/mutation.log | tail -40
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # never fail the run; the threshold in .gremlins.yaml is 0
          exit 0
      - name: upload the mutation report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-report
          path: |
            /tmp/mutation.json
            /tmp/mutation.log
          retention-days: 90
