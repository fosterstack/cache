name: Persona UAT

# Persona UAT (REQ-UAT-001), the one file with a persona job (one purpose per file). Two legs, both called from release.yml:
#   persona-uat-rc      the release-branch leg: release.yml calls this file once, in release mode on a push of a release/* branch only (the caller holds the branch and snapshot conditions), and
#                       four personas (gradle-platform-engineer, maven-jenkins-ci, readme-evaluator, on-call-engineer) test the image Build made, BEFORE anything is released; nothing is published.
#                       The driver loads that image into the on-call engineer's kind cluster (crane pull, kind load); a last step runs the README's and docs/docker-deploy.md's container-debugging commands against it.
#                       Build's production OCI layout (artifact images) is pushed with the pinned crane to a registry:2 service pinned by digest and published on the runner's loopback only;
#                       the pushed digest must equal Build's image-production digest, which the caller passes as the input digests. The image is unverified (no release-verify has run): that is what the personas test.
#   persona-uat-compliance  the promotion leg: the last job of the run a release tag push starts; release.yml calls this file after the release job has signed and published the image, and the compliance reviewer follows
#                       the public guide (the root checkout is the released tag) against the published image, as a customer would. A blocking finding fails the run; its fix ships as the next patch.
# Results stay private: pass/fail lines only, one encrypted artifact per persona, no issue; a blocking persona fails its job. The model identities and the four Anthropic ids are repository SECRETS (masked), passed by name by the caller; the
# token budget is the one variable. Every job is in the environment persona-uat and holds contents read and the identity token for the persona federation only: never the release signing key's role.
# GATE: PERSONA_UAT_ENABLED is exactly 'true' (unset = off), on each JOB, so while off the persona-uat environment is never entered and no token is minted.
# compliance-reviewer (it needs a signed, published image) runs in the compliance job only. No persona job runs on a timer.
on:
  workflow_call:
    inputs:
      digests:
        description: the digests.json text Build produced (the release-branch leg)
        type: string
        default: ''
      image:
        description: the published image, REF@sha256:... (the compliance leg, after the release job)
        type: string
        default: ''
    secrets:   # the caller passes exactly these six by name (never inherit)
      PERSONA_UAT_MODEL:
        required: false
      PERSONA_UAT_COMPLIANCE_MODEL:
        required: false
      ANTHROPIC_FEDERATION_RULE_ID:
        required: false
      ANTHROPIC_ORGANIZATION_ID:
        required: false
      ANTHROPIC_SERVICE_ACCOUNT_ID:
        required: false
      ANTHROPIC_WORKSPACE_ID:
        required: false

permissions:
  contents: read

jobs:
  persona-uat-rc:
    if: ${{ vars.PERSONA_UAT_ENABLED == 'true' && inputs.digests != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    environment: persona-uat
    permissions:
      contents: read
      id-token: write
    services:
      registry:
        image: registry:2@sha256:a3d8aaa63ed8681a604f1dea0aa03f100d5895b6a58ace528858a7b332415373
        ports:
          - 127.0.0.1:5000:5000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: images
          path: candidate/images

      - name: install the pinned crane binary
        run: ./bin/install-scanner.sh crane

      - name: load Build's production image into the registry on this runner, and check its digest
        env:
          DIGESTS: ${{ inputs.digests }}
        run: |
          set -euo pipefail
          want=$(jq -er '.["image-production"]' <<<"$DIGESTS")
          crane push candidate/images/production localhost:5000/cache:rc
          got=$(crane digest localhost:5000/cache:rc)
          [ "$got" = "$want" ] || { echo "::error::the pushed digest ${got} is not the one Build attested (${want})"; exit 1; }

      - name: kind from the runner image
        run: kind version || { echo "::error::PIPELINE, no kind"; exit 1; }

      - name: pin pip (hash-checked)
        run: |
          python3 -m pip install --quiet --require-hashes --only-binary=:all: --break-system-packages -r .github/agent/pip-requirements.txt
          python3 -m pip --version

      - name: install the provider SDK (hash-pinned)
        run: |
          python3 -m pip install --quiet --break-system-packages --require-hashes --only-binary=:all: -r bin/persona-uat-requirements.txt

      - name: mint the federated identity token for the model provider
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const token = await core.getIDToken('https://api.anthropic.com');
            core.setSecret(token);
            const f = process.env.RUNNER_TEMP + '/anthropic-identity-token';
            fs.writeFileSync(f, token, { mode: 0o600 });
            // Print ONLY the identity claims the Anthropic federation rule matches on (never the token, which stays masked): a token-exchange 401 is then diagnosable.
            try {
              const payload = JSON.parse(Buffer.from(token.split('.')[1], 'base64url').toString('utf8'));
              const claims = {};
              for (const k of ['sub', 'aud', 'ref', 'job_workflow_ref', 'environment', 'repository', 'repository_owner_id', 'event_name', 'iss']) {
                claims[k] = payload[k];
              }
              core.info('OIDC identity claims (federation-rule inputs): ' + JSON.stringify(claims));
            } catch (e) {
              core.warning('could not decode OIDC claims for logging');
            }

      - name: keep the identity token fresh for the whole job (a detached refresher)
        # The assertion lives about five minutes, the job up to two hours and every model call is a NEW process. A timer inside
        # actions/github-script dies with its step, so this is a process of its own: detached (nohup, output redirected, disowned),
        # it re-mints from the runner's OIDC endpoint into the same 0600 file until the file is removed by the last step.
        run: |
          set -euo pipefail
          f="${RUNNER_TEMP}/anthropic-identity-token"
          [ -f "$f" ] || { echo "::error::the identity token file does not exist yet: mint it first"; exit 1; }
          nohup bash -c '
            f="$1"; every="$2"
            while [ -e "$f" ] && sleep "$every"; do
              [ -e "$f" ] || break
              python3 bin/persona-uat.py --mint-identity "$f" || { [ "$?" -eq 3 ] && break; continue; }
            done
          ' identity-refresher "$f" "${PERSONA_UAT_REFRESH_SECONDS:-60}" </dev/null >/dev/null 2>&1 &
          disown

      - name: run the four release-candidate personas against Build's image on the local registry
        env:
          PERSONA_UAT_MODEL: ${{ secrets.PERSONA_UAT_MODEL }}
          PERSONA_UAT_COMPLIANCE_MODEL: ${{ secrets.PERSONA_UAT_COMPLIANCE_MODEL }}
          PERSONA_UAT_TOKEN_BUDGET: ${{ vars.PERSONA_UAT_TOKEN_BUDGET }}
          ANTHROPIC_FEDERATION_RULE_ID: ${{ secrets.ANTHROPIC_FEDERATION_RULE_ID }}
          ANTHROPIC_ORGANIZATION_ID: ${{ secrets.ANTHROPIC_ORGANIZATION_ID }}
          ANTHROPIC_SERVICE_ACCOUNT_ID: ${{ secrets.ANTHROPIC_SERVICE_ACCOUNT_ID }}
          ANTHROPIC_WORKSPACE_ID: ${{ secrets.ANTHROPIC_WORKSPACE_ID }}
          ANTHROPIC_IDENTITY_TOKEN_FILE: ${{ runner.temp }}/anthropic-identity-token
          PERSONA_UAT_IMAGE: localhost:5000/cache@${{ fromJSON(inputs.digests)['image-production'] }}
        run: python3 bin/persona-uat.py --mode rc --image "$PERSONA_UAT_IMAGE" --repo . --out persona-uat-out --tools bin/persona-uat-tools.json --recipient bin/persona-uat-recipient.pem --agent "python3 bin/persona-uat-agent.py" --allow-listen 5000

      - name: run the container-debugging commands of the README and docs/docker-deploy.md against Build's image
        # one pass/fail line per command, as the docs write them (the tty flag -t dropped: the runner has none); docker debug without its plugin is "not run"
        if: ${{ !cancelled() }}
        env:
          PERSONA_UAT_IMAGE: localhost:5000/cache@${{ fromJSON(inputs.digests)['image-production'] }}
        run: |
          set -uo pipefail
          fail=0
          check() { local name=$1; shift; if "$@"; then echo "pass: ${name}"; else echo "fail: ${name}"; fail=1; fi; }
          trap 'docker rm -f cache >/dev/null 2>&1; docker volume rm -f fscache-data >/dev/null 2>&1; kind delete cluster --name debug-check >/dev/null 2>&1' EXIT
          docker volume create fscache-data >/dev/null
          docker run -d --name cache -v fscache-data:/home/nonroot "$PERSONA_UAT_IMAGE" >/dev/null
          sleep 5
          check "README docker without docker debug: busybox sharing the network and process namespaces" \
            bash -c "printf 'wget -qO- http://127.0.0.1:8080/healthz\nps\n' | docker run --rm -i --network=container:cache --pid=container:cache busybox:1.37.0@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec sh -e"
          if docker debug --help 2>&1 | grep '^Usage:  docker debug' >/dev/null; then check "README docker debug" bash -c "echo exit | docker debug cache"; else echo "not run: README docker debug (the docker debug plugin is not on the runner)"; fi
          check "docker-deploy toolbox sharing the server's network and processes" \
            bash -c "printf 'wget -qO- http://localhost:8080/healthz\n' | docker run --rm -i --pid=container:cache --network=container:cache busybox:1.37.0@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec sh"
          check "docker-deploy blob volume, read-only" \
            docker run --rm -i -v fscache-data:/data:ro busybox:1.37.0@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec sh -c 'du -sh /data; ls -la /data/data/blobs'
          crane pull "${PERSONA_UAT_IMAGE%@*}:rc" rc-image.tar
          kind create cluster --name debug-check --image "$(jq -er .kind bin/persona-uat-tools.json)"
          kind load image-archive rc-image.tar --name debug-check
          timeout 60 bash -c 'until kubectl get serviceaccount default >/dev/null 2>&1; do sleep 1; done'
          kubectl run cache --image="${PERSONA_UAT_IMAGE%@*}:rc" --image-pull-policy=IfNotPresent
          kubectl wait --for=condition=Ready pod/cache --timeout=120s
          check "README kubectl debug" \
            bash -c "{ sleep 10; printf 'wget -qO- http://127.0.0.1:8080/healthz && echo HEALTHZ_OK\nps\n'; } | kubectl debug -i cache --image=busybox:1.37.0@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec --target=cache -- sh -e | grep -q HEALTHZ_OK"
          check "docker-deploy kubectl debug" \
            kubectl debug -i cache --image=busybox:1.37.0@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec --target=cache -- true
          exit "$fail"

      - name: upload the encrypted reports and transcripts
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: persona-uat-encrypted
          path: persona-uat-out/*.cms
          if-no-files-found: error

      - name: delete the identity token file
        if: ${{ always() }}
        run: python3 bin/persona-uat.py --remove-identity "${RUNNER_TEMP}/anthropic-identity-token" || rm -f "${RUNNER_TEMP}/anthropic-identity-token" "${RUNNER_TEMP}/anthropic-identity-token.tmp"

  persona-uat-compliance:
    if: ${{ vars.PERSONA_UAT_ENABLED == 'true' && inputs.image != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    environment: persona-uat
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: pin pip (hash-checked)
        run: |
          python3 -m pip install --quiet --require-hashes --only-binary=:all: --break-system-packages -r .github/agent/pip-requirements.txt
          python3 -m pip --version

      - name: install the provider SDK (hash-pinned)
        run: |
          python3 -m pip install --quiet --break-system-packages --require-hashes --only-binary=:all: -r bin/persona-uat-requirements.txt

      - name: mint the federated identity token for the model provider
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const token = await core.getIDToken('https://api.anthropic.com');
            core.setSecret(token);
            const f = process.env.RUNNER_TEMP + '/anthropic-identity-token';
            fs.writeFileSync(f, token, { mode: 0o600 });
            // Print ONLY the identity claims the Anthropic federation rule matches on (never the token, which stays masked): a token-exchange 401 is then diagnosable.
            try {
              const payload = JSON.parse(Buffer.from(token.split('.')[1], 'base64url').toString('utf8'));
              const claims = {};
              for (const k of ['sub', 'aud', 'ref', 'job_workflow_ref', 'environment', 'repository', 'repository_owner_id', 'event_name', 'iss']) {
                claims[k] = payload[k];
              }
              core.info('OIDC identity claims (federation-rule inputs): ' + JSON.stringify(claims));
            } catch (e) {
              core.warning('could not decode OIDC claims for logging');
            }

      - name: keep the identity token fresh for the whole job (a detached refresher)
        # The assertion lives about five minutes, the job up to two hours and every model call is a NEW process. A timer inside
        # actions/github-script dies with its step, so this is a process of its own: detached (nohup, output redirected, disowned),
        # it re-mints from the runner's OIDC endpoint into the same 0600 file until the file is removed by the last step.
        run: |
          set -euo pipefail
          f="${RUNNER_TEMP}/anthropic-identity-token"
          [ -f "$f" ] || { echo "::error::the identity token file does not exist yet: mint it first"; exit 1; }
          nohup bash -c '
            f="$1"; every="$2"
            while [ -e "$f" ] && sleep "$every"; do
              [ -e "$f" ] || break
              python3 bin/persona-uat.py --mint-identity "$f" || { [ "$?" -eq 3 ] && break; continue; }
            done
          ' identity-refresher "$f" "${PERSONA_UAT_REFRESH_SECONDS:-60}" </dev/null >/dev/null 2>&1 &
          disown

      - name: run the compliance reviewer against the published image
        env:
          PERSONA_UAT_MODEL: ${{ secrets.PERSONA_UAT_MODEL }}
          PERSONA_UAT_COMPLIANCE_MODEL: ${{ secrets.PERSONA_UAT_COMPLIANCE_MODEL }}
          PERSONA_UAT_TOKEN_BUDGET: ${{ vars.PERSONA_UAT_TOKEN_BUDGET }}
          ANTHROPIC_FEDERATION_RULE_ID: ${{ secrets.ANTHROPIC_FEDERATION_RULE_ID }}
          ANTHROPIC_ORGANIZATION_ID: ${{ secrets.ANTHROPIC_ORGANIZATION_ID }}
          ANTHROPIC_SERVICE_ACCOUNT_ID: ${{ secrets.ANTHROPIC_SERVICE_ACCOUNT_ID }}
          ANTHROPIC_WORKSPACE_ID: ${{ secrets.ANTHROPIC_WORKSPACE_ID }}
          ANTHROPIC_IDENTITY_TOKEN_FILE: ${{ runner.temp }}/anthropic-identity-token
          PERSONA_UAT_IMAGE: ${{ inputs.image }}
        run: python3 bin/persona-uat.py --mode release --image "$PERSONA_UAT_IMAGE" --repo . --out persona-uat-out --tools bin/persona-uat-tools.json --recipient bin/persona-uat-recipient.pem --agent "python3 bin/persona-uat-agent.py"

      - name: upload the encrypted reports and transcripts
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: persona-uat-encrypted
          path: persona-uat-out/*.cms
          if-no-files-found: error

      - name: delete the identity token file
        if: ${{ always() }}
        run: python3 bin/persona-uat.py --remove-identity "${RUNNER_TEMP}/anthropic-identity-token" || rm -f "${RUNNER_TEMP}/anthropic-identity-token" "${RUNNER_TEMP}/anthropic-identity-token.tmp"
