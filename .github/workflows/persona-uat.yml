name: Persona UAT

# Persona UAT (REQ-UAT-001), the one file with a persona job (owner rule docs/ratify/2026-11-13-workflows-grouped-by-purpose.md: one purpose per file). Two legs:
#   persona-uat-rc      the release-candidate leg: release.yml calls this file once, in release mode on a release-candidate tag only (the caller holds the tag and snapshot conditions), and
#                       the three personas (gradle-platform-engineer, maven-jenkins-ci, readme-evaluator) test the image Build made, BEFORE anything is released; nothing is published.
#                       Build's production OCI layout (artifact images) is pushed with the pinned crane to a registry:2 service pinned by digest and published on the runner's loopback only;
#                       the pushed digest must equal Build's image-production digest, which the caller passes as the input digests. The image is unverified (no release-verify has run): that is what the personas test.
#   persona-uat-weekly  the Monday cron: the five personas follow the docs AS PUBLISHED with the latest release (checked out under release-docs) against that release's public image,
#                       resolved to its digest. The harness is the root checkout (today's main, bin/), so a persona never edits the code that judges it.
# Results stay private: pass/fail lines only, one encrypted artifact per persona, no issue; a blocking persona fails its job. The model identities are environment SECRETS (masked); the
# token budget is the one variable. Every job is in the environment persona-uat and holds contents read and the identity token for the persona federation only: never the release signing key's role.
# GATE: PERSONA_UAT_ENABLED is exactly 'true' (unset = off), on each JOB, so while off the persona-uat environment is never entered and no token is minted.
# compliance-reviewer and on-call-engineer run in the weekly job only.
on:
  schedule:
    - cron: '43 6 * * 1'    # persona UAT, weekly (Mondays)
  workflow_call:
    inputs:
      digests:
        description: the digests.json text Build produced (the release-candidate leg)
        type: string
        default: ''

permissions:
  contents: read

jobs:
  persona-uat-rc:
    if: ${{ vars.PERSONA_UAT_ENABLED == 'true' && inputs.digests != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    environment: persona-uat
    permissions:
      contents: read
      id-token: write
    services:
      registry:
        image: registry:2@sha256:a3d8aaa63ed8681a604f1dea0aa03f100d5895b6a58ace528858a7b332415373
        ports:
          - 127.0.0.1:5000:5000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: images
          path: candidate/images

      - name: install the pinned crane binary
        run: ./bin/install-scanner.sh crane

      - name: load Build's production image into the registry on this runner, and check its digest
        env:
          DIGESTS: ${{ inputs.digests }}
        run: |
          set -euo pipefail
          want=$(jq -er '.["image-production"]' <<<"$DIGESTS")
          crane push candidate/images/production localhost:5000/cache:rc
          got=$(crane digest localhost:5000/cache:rc)
          [ "$got" = "$want" ] || { echo "::error::the pushed digest ${got} is not the one Build attested (${want})"; exit 1; }

      - name: kind from the runner image
        run: kind version || { echo "::error::PIPELINE, no kind"; exit 1; }

      - name: pin pip (hash-checked)
        run: |
          python3 -m pip install --quiet --require-hashes --only-binary=:all: --break-system-packages -r .github/agent/pip-requirements.txt
          python3 -m pip --version

      - name: install the provider SDK (hash-pinned)
        run: |
          python3 -m pip install --quiet --break-system-packages --require-hashes --only-binary=:all: -r bin/persona-uat-requirements.txt

      - name: mint the federated identity token for the model provider
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const token = await core.getIDToken('https://api.anthropic.com');
            core.setSecret(token);
            const f = process.env.RUNNER_TEMP + '/anthropic-identity-token';
            fs.writeFileSync(f, token, { mode: 0o600 });
            // Print ONLY the identity claims the Anthropic federation rule matches on (never the token, which stays masked): a token-exchange 401 is then diagnosable.
            try {
              const payload = JSON.parse(Buffer.from(token.split('.')[1], 'base64url').toString('utf8'));
              const claims = {};
              for (const k of ['sub', 'aud', 'ref', 'job_workflow_ref', 'environment', 'repository', 'repository_owner_id', 'event_name', 'iss']) {
                claims[k] = payload[k];
              }
              core.info('OIDC identity claims (federation-rule inputs): ' + JSON.stringify(claims));
            } catch (e) {
              core.warning('could not decode OIDC claims for logging');
            }

      - name: keep the identity token fresh for the whole job (a detached refresher)
        # The assertion lives about five minutes, the job up to two hours and every model call is a NEW process. A timer inside
        # actions/github-script dies with its step, so this is a process of its own: detached (nohup, output redirected, disowned),
        # it re-mints from the runner's OIDC endpoint into the same 0600 file until the file is removed by the last step.
        run: |
          set -euo pipefail
          f="${RUNNER_TEMP}/anthropic-identity-token"
          [ -f "$f" ] || { echo "::error::the identity token file does not exist yet: mint it first"; exit 1; }
          nohup bash -c '
            f="$1"; every="$2"
            while [ -e "$f" ] && sleep "$every"; do
              [ -e "$f" ] || break
              python3 bin/persona-uat.py --mint-identity "$f" || { [ "$?" -eq 3 ] && break; continue; }
            done
          ' identity-refresher "$f" "${PERSONA_UAT_REFRESH_SECONDS:-60}" </dev/null >/dev/null 2>&1 &
          disown

      - name: run the three release-candidate personas against Build's image on the local registry
        env:
          PERSONA_UAT_MODEL: ${{ secrets.PERSONA_UAT_MODEL }}
          PERSONA_UAT_COMPLIANCE_MODEL: ${{ secrets.PERSONA_UAT_COMPLIANCE_MODEL }}
          PERSONA_UAT_TOKEN_BUDGET: ${{ vars.PERSONA_UAT_TOKEN_BUDGET }}
          ANTHROPIC_FEDERATION_RULE_ID: ${{ secrets.ANTHROPIC_FEDERATION_RULE_ID }}
          ANTHROPIC_ORGANIZATION_ID: ${{ secrets.ANTHROPIC_ORGANIZATION_ID }}
          ANTHROPIC_SERVICE_ACCOUNT_ID: ${{ secrets.ANTHROPIC_SERVICE_ACCOUNT_ID }}
          ANTHROPIC_WORKSPACE_ID: ${{ secrets.ANTHROPIC_WORKSPACE_ID }}
          ANTHROPIC_IDENTITY_TOKEN_FILE: ${{ runner.temp }}/anthropic-identity-token
          PERSONA_UAT_IMAGE: localhost:5000/cache@${{ fromJSON(inputs.digests)['image-production'] }}
        run: python3 bin/persona-uat.py --mode rc --image "$PERSONA_UAT_IMAGE" --repo . --out persona-uat-out --tools bin/persona-uat-tools.json --recipient bin/persona-uat-recipient.pem --agent "python3 bin/persona-uat-agent.py" --allow-listen 5000

      - name: upload the encrypted reports and transcripts
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: persona-uat-encrypted
          path: persona-uat-out/*.cms
          if-no-files-found: error

      - name: delete the identity token file
        if: ${{ always() }}
        run: python3 bin/persona-uat.py --remove-identity "${RUNNER_TEMP}/anthropic-identity-token" || rm -f "${RUNNER_TEMP}/anthropic-identity-token" "${RUNNER_TEMP}/anthropic-identity-token.tmp"

  persona-uat-weekly:
    if: ${{ vars.PERSONA_UAT_ENABLED == 'true' && github.event.schedule == '43 6 * * 1' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    environment: persona-uat
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: install the pinned crane binary
        run: ./bin/install-scanner.sh crane

      - name: resolve the latest release and its image digest
        id: resolve
        env:
          GH_REPO: ${{ github.repository }}
          REGISTRY_OWNER: ${{ github.repository_owner }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=$(gh release view --json tagName -q .tagName)
          digest=$(crane digest "ghcr.io/${REGISTRY_OWNER}/cache:${tag#v}")
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${REGISTRY_OWNER}/cache@${digest}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: release-docs
          ref: ${{ steps.resolve.outputs.tag }}
          persist-credentials: false

      - name: kind from the runner image
        run: kind version || { echo "::error::PIPELINE, no kind"; exit 1; }

      - name: pin pip (hash-checked)
        run: |
          python3 -m pip install --quiet --require-hashes --only-binary=:all: --break-system-packages -r .github/agent/pip-requirements.txt
          python3 -m pip --version

      - name: install the provider SDK (hash-pinned)
        run: |
          python3 -m pip install --quiet --break-system-packages --require-hashes --only-binary=:all: -r bin/persona-uat-requirements.txt

      - name: mint the federated identity token for the model provider
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const token = await core.getIDToken('https://api.anthropic.com');
            core.setSecret(token);
            const f = process.env.RUNNER_TEMP + '/anthropic-identity-token';
            fs.writeFileSync(f, token, { mode: 0o600 });
            // Print ONLY the identity claims the Anthropic federation rule matches on (never the token, which stays masked): a token-exchange 401 is then diagnosable.
            try {
              const payload = JSON.parse(Buffer.from(token.split('.')[1], 'base64url').toString('utf8'));
              const claims = {};
              for (const k of ['sub', 'aud', 'ref', 'job_workflow_ref', 'environment', 'repository', 'repository_owner_id', 'event_name', 'iss']) {
                claims[k] = payload[k];
              }
              core.info('OIDC identity claims (federation-rule inputs): ' + JSON.stringify(claims));
            } catch (e) {
              core.warning('could not decode OIDC claims for logging');
            }

      - name: keep the identity token fresh for the whole job (a detached refresher)
        # The assertion lives about five minutes, the job up to two hours and every model call is a NEW process. A timer inside
        # actions/github-script dies with its step, so this is a process of its own: detached (nohup, output redirected, disowned),
        # it re-mints from the runner's OIDC endpoint into the same 0600 file until the file is removed by the last step.
        run: |
          set -euo pipefail
          f="${RUNNER_TEMP}/anthropic-identity-token"
          [ -f "$f" ] || { echo "::error::the identity token file does not exist yet: mint it first"; exit 1; }
          nohup bash -c '
            f="$1"; every="$2"
            while [ -e "$f" ] && sleep "$every"; do
              [ -e "$f" ] || break
              python3 bin/persona-uat.py --mint-identity "$f" || { [ "$?" -eq 3 ] && break; continue; }
            done
          ' identity-refresher "$f" "${PERSONA_UAT_REFRESH_SECONDS:-60}" </dev/null >/dev/null 2>&1 &
          disown

      - name: run the five personas against the latest release
        env:
          PERSONA_UAT_MODEL: ${{ secrets.PERSONA_UAT_MODEL }}
          PERSONA_UAT_COMPLIANCE_MODEL: ${{ secrets.PERSONA_UAT_COMPLIANCE_MODEL }}
          PERSONA_UAT_TOKEN_BUDGET: ${{ vars.PERSONA_UAT_TOKEN_BUDGET }}
          ANTHROPIC_FEDERATION_RULE_ID: ${{ secrets.ANTHROPIC_FEDERATION_RULE_ID }}
          ANTHROPIC_ORGANIZATION_ID: ${{ secrets.ANTHROPIC_ORGANIZATION_ID }}
          ANTHROPIC_SERVICE_ACCOUNT_ID: ${{ secrets.ANTHROPIC_SERVICE_ACCOUNT_ID }}
          ANTHROPIC_WORKSPACE_ID: ${{ secrets.ANTHROPIC_WORKSPACE_ID }}
          ANTHROPIC_IDENTITY_TOKEN_FILE: ${{ runner.temp }}/anthropic-identity-token
          PERSONA_UAT_IMAGE: ${{ steps.resolve.outputs.image }}
        run: python3 bin/persona-uat.py --mode weekly --image "$PERSONA_UAT_IMAGE" --repo release-docs --out persona-uat-out --tools bin/persona-uat-tools.json --recipient bin/persona-uat-recipient.pem --agent "python3 bin/persona-uat-agent.py"

      - name: upload the encrypted reports and transcripts
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: persona-uat-encrypted
          path: persona-uat-out/*.cms
          if-no-files-found: error

      - name: delete the identity token file
        if: ${{ always() }}
        run: python3 bin/persona-uat.py --remove-identity "${RUNNER_TEMP}/anthropic-identity-token" || rm -f "${RUNNER_TEMP}/anthropic-identity-token" "${RUNNER_TEMP}/anthropic-identity-token.tmp"
