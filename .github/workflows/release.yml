name: Release

# The release chain (release-chain-design.md): build once, verify by
# digest, promote by digest. Each stage is a reusable workflow with its
# own OIDC identity; one signed predicate per stage on exit, one
# verification per stage on entry; subjects are sha256 digests emitted
# by the stage that produced the bytes, never resolved from a registry
# after the fact. Tag mode is the only path that pushes anything, and
# promotion (the final stage) is the only path that can make anything
# public — and only after the authorization stage has verified the
# whole graph. Releases build ONLY here; `goreleaser release` (without
# --snapshot) is never invoked anywhere else.
#
# admission -> build -> image -> reproducibility -> { scans, acceptance }
#           -> authorization -> promotion

on:
  push:
    tags:
      - "v*"

# Caller grants must COVER every called job's requests, or the run is a
# startup_failure with zero jobs. checks/statuses: read are for the
# admission stage's required-check verification.
permissions:
  contents: write
  id-token: write
  attestations: write
  packages: write
  checks: read
  statuses: read
  pull-requests: read   # admission verifies pull_request-scoped checks on the merged-PR head (R01)

jobs:
  admission:
    uses: ./.github/workflows/stage-admission.yml

  build:
    needs: admission
    uses: ./.github/workflows/stage-build.yml
    with:
      mode: release
      admission-artifact: ${{ needs.admission.outputs.admission-artifact }}

  image:
    needs: build
    uses: ./.github/workflows/stage-image.yml
    with:
      mode: release
      dist-artifact: dist-release
      expected-checksums: ${{ needs.build.outputs.checksums }}

  reproducibility:
    needs: [build, image]
    uses: ./.github/workflows/stage-reproducibility.yml
    with:
      dist-artifact: dist-release
      expected-checksums: ${{ needs.build.outputs.checksums }}
      digests: ${{ needs.image.outputs.digests }}

  scans:
    needs: [build, image, reproducibility]
    uses: ./.github/workflows/stage-verify.yml
    with:
      digests: ${{ needs.image.outputs.digests }}
      dist-artifact: dist-release
      expected-checksums: ${{ needs.build.outputs.checksums }}
    secrets: inherit

  acceptance-artifacts:
    needs: [build, image, reproducibility]
    uses: ./.github/workflows/stage-acceptance-artifacts.yml
    with:
      dist-artifact: dist-release
      expected-checksums: ${{ needs.build.outputs.checksums }}
      mode: candidates
      digests: ${{ needs.image.outputs.digests }}

  acceptance:
    needs: [image, reproducibility]
    uses: ./.github/workflows/acceptance.yml
    with:
      image-ref: ghcr.io/${{ github.repository_owner }}/cache-candidates@${{ fromJSON(needs.image.outputs.digests).production }}

  acceptance-egress:
    needs: [image, reproducibility]
    uses: ./.github/workflows/stage-acceptance-egress.yml
    with:
      digests: ${{ needs.image.outputs.digests }}

  acceptance-k8s:
    needs: [image, reproducibility]
    uses: ./.github/workflows/stage-acceptance-k8s.yml
    with:
      digests: ${{ needs.image.outputs.digests }}

  acceptance-predicate:
    needs: [image, acceptance-artifacts, acceptance, acceptance-egress, acceptance-k8s]
    uses: ./.github/workflows/stage-acceptance-predicate.yml
    with:
      digests: ${{ needs.image.outputs.digests }}
      artifacts-results: ${{ needs.acceptance-artifacts.outputs.results }}
      gradle-results: ${{ needs.acceptance.outputs.gradle-results }}
      maven-results: ${{ needs.acceptance.outputs.maven-results }}
      egress-results: ${{ needs.acceptance-egress.outputs.results }}
      k8s-results: ${{ needs.acceptance-k8s.outputs.results }}

  authorization:
    needs: [admission, build, image, scans, acceptance-predicate]
    # The caller grants what stage-authorize's `authorize` job needs (a reusable workflow cannot
    # raise its caller's grant, R01): contents:read, id-token:write to sign the release-
    # authorization predicate, and issues:read so it can read the owner-decision issue acceptance
    # state (REQ-AUD-11). The workflow-level default omits issues:read, so declare it here.
    permissions:
      contents: read
      packages: read
      id-token: write
      attestations: write
      issues: read
    uses: ./.github/workflows/stage-authorize.yml
    with:
      digests: ${{ needs.image.outputs.digests }}
      admission-artifact: ${{ needs.admission.outputs.admission-artifact }}
      dist-artifact: dist-release
      expected-checksums: ${{ needs.build.outputs.checksums }}

  promotion:
    needs: [build, image, authorization]
    uses: ./.github/workflows/stage-promote.yml
    with:
      digests: ${{ needs.image.outputs.digests }}
      dist-artifact: dist-release
      expected-checksums: ${{ needs.build.outputs.checksums }}
    secrets: inherit

  # Scanner-panel rule 12 (owner RATIFIED Oct 2; REQ-SCAN-012): on a release candidate, once it is published, every
  # command of docs/using-our-vex.md runs as written against the real services, in the dedicated test repositories only.
  live-test:
    needs: promotion
    if: contains(github.ref_name, '-rc.')
    runs-on: ubuntu-latest
    concurrency:   # one live test at a time across both workflows: the sweep owns the whole test estate
      group: vex-live-test
      cancel-in-progress: false
    environment: live-test   # admits only main and v*-rc.* tags; holds the five LIVE_TEST_* identifiers (advisor 0078)
    permissions:
      contents: read
      id-token: write
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: false
      - name: install crane, Grype and Docker Scout (pinned)
        run: |
          set -euo pipefail
          GOTOOLCHAIN=local go install github.com/google/go-containerregistry/cmd/crane@v0.22.1
          mkdir -p "$RUNNER_TEMP/bin" "$HOME/.docker/cli-plugins"
          ./bin/install-scanner.sh grype "$RUNNER_TEMP/bin"
          ./bin/install-scanner.sh docker-scout "$RUNNER_TEMP"
          install -m 0755 "$RUNNER_TEMP/docker-scout" "$HOME/.docker/cli-plugins/docker-scout"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: AWS, as the live-test role (federated; the test ECR repository and live-test Inspector filters only)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.LIVE_TEST_AWS_ROLE_ARN }}
          aws-region: us-east-1
      - name: Google, as the live-test service account (federated; the test Artifact Registry repository and VEX notes)
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.LIVE_TEST_GCP_PROVIDER }}
          service_account: ${{ vars.LIVE_TEST_GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
      - name: the live test — every guide command as written, the fixture's finding shown before and gone after
        env:
          MODE: rc
          ECR: ${{ vars.LIVE_TEST_ECR_REPOSITORY }}
          GAR: ${{ vars.LIVE_TEST_GAR_REPOSITORY }}
          GH_TOKEN: ${{ github.token }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_SCOUT_TOKEN: ${{ secrets.DOCKERHUB_SCOUT_TOKEN }}
        run: bash bin/vex-live-test.sh run
      - name: cleanup — delete every image, live-test filter and VEX note the run created
        if: always()
        env:
          ECR: ${{ vars.LIVE_TEST_ECR_REPOSITORY }}
          GAR: ${{ vars.LIVE_TEST_GAR_REPOSITORY }}
        run: bash bin/vex-live-test.sh cleanup
