name: Release

# The release chain (release-chain-design.md): build once, verify by digest, publish by digest. Each stage is a reusable
# workflow with its own OIDC identity; one signed record per stage (Witness, and Sign's provenance), one verification per stage on entry; subjects
# are sha256 digests emitted by the stage that produced the bytes, never resolved from a registry after the fact. Tag mode is the only path that
# pushes anything, and Release (the final stage) is the only path that can make anything public, and only after it has verified every earlier
# stage's record. Releases build ONLY here, by the chain below; nothing else builds or publishes a release.
#
# build -> sign ; { build, sign } -> { rebuild, check } ; { build, rebuild } -> sign-rebuild ; { build, check } -> sign-check ; { check, sign, sign-rebuild, sign-check } -> release

on:
  push:
    tags:
      - "v*"
  # The dry run of the v0.3.0 chain (PR 1: the Sign boundary): a manual run on a branch; the hostile Build step and its judges run on a push of a
  # release-candidate tag, not here; it neither tags nor publishes (every other job below carries `!inputs.dry-run`).
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'run the hostile-step dry run (no tag, no publish)'
        type: boolean
        default: false

# Every job asks for what it needs. The
# workflow default is read-only; a caller's grants must COVER what the called stage requests, or the run is a startup_failure with zero jobs.
permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------------------------------------------
  # The v0.3.0 chain (PR 2: Build and Rebuild; REQ-CHAIN-004, REQ-CHAIN-005). Build, Sign and Rebuild carry the rules of
  # bin/chain-build-wiring-test.sh (an exact grammar for this graph). The gate G is the same text on build and sign: the chain
  # starts on a v* tag PUSH, or in a dry-run dispatch on any branch (a manual dispatch on an existing v* tag is not a release
  # run). Rebuild has no `if`: it runs after Build through `needs`, and a skipped Build skips it.
  # Check (PR 3) replaced the old scans, acceptance and authorization jobs; Release (PR 4) replaced the old promotion job.
  build:
    if: ${{ (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || inputs.dry-run == true }}
    permissions:
      contents: read
      checks: read
      statuses: read
      pull-requests: read
    uses: ./.github/workflows/stage-build.yml
    with:
      hostile: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && contains(github.ref_name, '-rc') }}   # the hostile Build step runs on a push of a release-candidate tag only

  # The Sign job of v0.3.0: its own workflow file, called only from here, with the digests.json text Build wrote.
  sign:
    if: ${{ (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || inputs.dry-run == true }}
    needs: build
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/stage-sign.yml
    with:
      digests: ${{ needs.build.outputs.digests }}
      stage: build

  # Rebuild: fresh runners rebuild everything Build built and compare every item; its only output is the verdict. It starts from Build's SIGNED records
  # (the building jobs hold no identity token; Sign signs what they recorded), so it needs Sign.
  rebuild:
    needs: [build, sign]
    permissions:
      contents: read
    uses: ./.github/workflows/stage-reproducibility.yml

  # Sign's second call: the same file, the stage rebuild: it checks and signs Rebuild's records
  # and receives no Rebuild apk or image. Its identity is the first call's (one workflow file, release.yml on top).
  sign-rebuild:
    needs: [build, rebuild]
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/stage-sign.yml
    with:
      digests: ${{ needs.build.outputs.digests }}
      stage: rebuild
      records: ${{ needs.rebuild.outputs.records }}

  # Check (REQ-CHAIN-006): scanners, acceptance suites, the FIPS check and the customer-guide commands against the exact candidate
  # digests, as three Witness steps. It needs Build and Sign (it verifies Build's record, signed by Sign, on entry) and runs beside Rebuild, never after it.
  check:
    needs: [build, sign]
    permissions:
      contents: read
    uses: ./.github/workflows/stage-verify.yml

  # Sign's third call (REQ-REL-011-AC1, cache#606): the same file, the stage check: it checks and signs the records of the Check jobs, which hold no identity token (their
  # steps build tools and run workloads), against the results Check uploaded. Its identity is the first call's.
  sign-check:
    needs: [build, check]
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/stage-sign.yml
    with:
      digests: ${{ needs.build.outputs.digests }}
      stage: check
      records: ${{ needs.check.outputs.records }}
      records-arm64: ${{ needs.check.outputs.records-arm64 }}

  # Release (REQ-CHAIN-007): the only job that holds a registry credential, a release-key role or write access to packages and
  # releases. It needs exactly Check, Sign, Sign-rebuild and Sign-check (it reaches Build and Rebuild through them), has no `if` that survives a failed or skipped predecessor
  # (a dry run publishes nothing, a branch run is not a release, and a skipped Build skips it through `needs`), passes no secrets to the stage (the environment named release holds them)
  # and creates no tag.
  release:
    if: ${{ startsWith(github.ref, 'refs/tags/v') && !inputs.dry-run }}
    needs: [check, sign, sign-rebuild, sign-check]
    # One publication at a time (release review R3, Oct 22): bin/release-publish.sh decides :X and :latest from the registry's tag list, so two
    # release runs must not interleave. One fixed group for every v* run, release candidates included. A queued run waits and a running one is never
    # cancelled (cancel-in-progress false). GitHub keeps one pending run per group: a second queued tag run replaces the first pending one, which ends
    # cancelled; the patch-failed job below then opens an issue saying to publish that tag again (it is not re-run silently or by hand alone).
    concurrency:
      group: release-publish
      cancel-in-progress: false
    permissions:
      contents: write
      packages: write
      id-token: write
    uses: ./.github/workflows/stage-promote.yml

  # (REQ-SCAN-012): on a release candidate (vX.Y.Z-rcN, nothing is published) the candidate images are pushed by digest
  # from Build's artifacts to the dedicated test repositories and the page's load and removal commands run as written; the blocks that read a release or a
  # registry run in live-test-release after publishing (docs/using-our-vex.cannot-run.json).
  live-test:
    needs: [check]
    if: ${{ startsWith(github.ref, 'refs/tags/v') && contains(github.ref_name, '-rc') && !inputs.dry-run }}
    runs-on: ubuntu-latest
    concurrency:   # one live test at a time across both workflows: the sweep owns the whole test estate
      group: vex-live-test
      cancel-in-progress: false
    environment: live-test   # holds the five LIVE_TEST_* identifiers; its tag policy must admit rc and final v tags
    permissions:
      contents: read
      id-token: write
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: digests
          path: candidate
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: items
          path: candidate
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: images
          path: candidate/images
      - name: install crane, Grype and cosign (pinned by checksum)
        run: |
          set -euo pipefail
          bash bin/install-scanner.sh crane
          bash bin/install-scanner.sh cosign
          mkdir -p "$RUNNER_TEMP/tools"
          bash bin/install-scanner.sh grype "$RUNNER_TEMP/tools"
          echo "$RUNNER_TEMP/tools" >> "$GITHUB_PATH"
      - name: install docker-scout (pinned by checksum)
        run: |
          set -euo pipefail
          bash bin/install-scanner.sh docker-scout "$RUNNER_TEMP"
          mkdir -p "$HOME/.docker/cli-plugins" && install -m 0755 "$RUNNER_TEMP/docker-scout" "$HOME/.docker/cli-plugins/docker-scout"
      - name: AWS, as the live-test role (federated; the test ECR repository and live-test Inspector filters only)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.LIVE_TEST_AWS_ROLE_ARN }}
          aws-region: us-east-1
      - name: Google, as the live-test service account (federated; the test Artifact Registry repository and VEX notes)
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.LIVE_TEST_GCP_PROVIDER }}
          service_account: ${{ vars.LIVE_TEST_GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        with:
          version: '587.0.0'
      - name: the live test, every guide command as written, the fixture's finding shown before and gone after
        env:
          MODE: rc
          ECR: ${{ vars.LIVE_TEST_ECR_REPOSITORY }}
          GAR: ${{ vars.LIVE_TEST_GAR_REPOSITORY }}
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_DIR: ${{ github.workspace }}/candidate
          DH_REPO: ${{ vars.LIVE_TEST_DOCKERHUB_REPOSITORY }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TEST_USERNAME: ${{ secrets.DOCKERHUB_TEST_USERNAME }}
          DOCKERHUB_TEST_PUSH_TOKEN: ${{ secrets.DOCKERHUB_TEST_PUSH_TOKEN }}
          DOCKERHUB_SCOUT_TOKEN: ${{ secrets.DOCKERHUB_SCOUT_TOKEN }}
        run: bash bin/vex-live-run.sh run
      - name: cleanup, delete every image, live-test filter and VEX note the run created
        if: always()
        env:
          ECR: ${{ vars.LIVE_TEST_ECR_REPOSITORY }}
          GAR: ${{ vars.LIVE_TEST_GAR_REPOSITORY }}
          DH_REPO: ${{ vars.LIVE_TEST_DOCKERHUB_REPOSITORY }}
          DOCKERHUB_TEST_USERNAME: ${{ secrets.DOCKERHUB_TEST_USERNAME }}
          DOCKERHUB_TEST_PUSH_TOKEN: ${{ secrets.DOCKERHUB_TEST_PUSH_TOKEN }}
        run: bash bin/vex-live-run.sh cleanup

  # The same live test, right after the final release is published, with every command block of the page as written (including the download, digest and verify blocks).
  live-test-release:
    needs: [release]
    if: ${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-rc') && !inputs.dry-run }}
    runs-on: ubuntu-latest
    concurrency:   # one live test at a time across both workflows: the sweep owns the whole test estate
      group: vex-live-test
      cancel-in-progress: false
    environment: live-test   # holds the five LIVE_TEST_* identifiers; its tag policy must admit rc and final v tags
    permissions:
      contents: read
      id-token: write
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: install crane, Grype and cosign (pinned by checksum)
        run: |
          set -euo pipefail
          bash bin/install-scanner.sh crane
          bash bin/install-scanner.sh cosign
          mkdir -p "$RUNNER_TEMP/tools"
          bash bin/install-scanner.sh grype "$RUNNER_TEMP/tools"
          echo "$RUNNER_TEMP/tools" >> "$GITHUB_PATH"
      - name: install docker-scout (pinned by checksum)
        run: |
          set -euo pipefail
          bash bin/install-scanner.sh docker-scout "$RUNNER_TEMP"
          mkdir -p "$HOME/.docker/cli-plugins" && install -m 0755 "$RUNNER_TEMP/docker-scout" "$HOME/.docker/cli-plugins/docker-scout"
      - name: AWS, as the live-test role (federated; the test ECR repository and live-test Inspector filters only)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.LIVE_TEST_AWS_ROLE_ARN }}
          aws-region: us-east-1
      - name: Google, as the live-test service account (federated; the test Artifact Registry repository and VEX notes)
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.LIVE_TEST_GCP_PROVIDER }}
          service_account: ${{ vars.LIVE_TEST_GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        with:
          version: '587.0.0'
      - name: the live test, every guide command as written, the fixture's finding shown before and gone after
        env:
          MODE: release
          ECR: ${{ vars.LIVE_TEST_ECR_REPOSITORY }}
          GAR: ${{ vars.LIVE_TEST_GAR_REPOSITORY }}
          GH_TOKEN: ${{ github.token }}
          DH_REPO: ${{ vars.LIVE_TEST_DOCKERHUB_REPOSITORY }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TEST_USERNAME: ${{ secrets.DOCKERHUB_TEST_USERNAME }}
          DOCKERHUB_TEST_PUSH_TOKEN: ${{ secrets.DOCKERHUB_TEST_PUSH_TOKEN }}
          DOCKERHUB_SCOUT_TOKEN: ${{ secrets.DOCKERHUB_SCOUT_TOKEN }}
        run: bash bin/vex-live-run.sh run
      - name: cleanup, delete every image, live-test filter and VEX note the run created
        if: always()
        env:
          ECR: ${{ vars.LIVE_TEST_ECR_REPOSITORY }}
          GAR: ${{ vars.LIVE_TEST_GAR_REPOSITORY }}
          DH_REPO: ${{ vars.LIVE_TEST_DOCKERHUB_REPOSITORY }}
          DOCKERHUB_TEST_USERNAME: ${{ secrets.DOCKERHUB_TEST_USERNAME }}
          DOCKERHUB_TEST_PUSH_TOKEN: ${{ secrets.DOCKERHUB_TEST_PUSH_TOKEN }}
        run: bash bin/vex-live-run.sh cleanup

  # The hostile judges, run on a release-candidate tag push (REQ-CHAIN-001-AC5): every attempt of the hostile Build step is judged by the REAL
  # verifier against the policy made for this run's own ref, and one positive control (this run's genuine Sign output) must be
  # ACCEPTED by the same policy. The outcome of an attempt is the verifier's own exit code, captured per attempt, never a field
  # the hostile step wrote. This job only judges; it publishes nothing.
  hostile-verify:
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && contains(github.ref_name, '-rc') }}
    needs: sign
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: hostile-attempts
          path: attempts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: signed-witness-build
          path: witness-build
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: provenance
          path: provenance
      - name: make the policy for this run's own ref
        run: python3 bin/chain-verify.py policy make --template .github/policy/release-policy.template.json --ref "$GITHUB_REF" --out policy.json
      - name: attempt mint_sign_cert
        run: |
          rc=0
          python3 bin/chain-verify.py verify --stage sign --record attempts/mint_sign_cert.json --policy policy.json 2> /tmp/mint_sign_cert.err || rc=$?
          python3 bin/chain-verify.py hostile-row --attempt mint_sign_cert --exit-code "$rc" --stderr /tmp/mint_sign_cert.err --out results/mint_sign_cert.json
      - name: attempt read_sign_token
        run: |
          rc=0
          python3 bin/chain-verify.py hostile-material --kind token --file attempts/read_sign_token.txt 2> /tmp/read_sign_token.err || rc=$?
          python3 bin/chain-verify.py hostile-row --attempt read_sign_token --exit-code "$rc" --stderr /tmp/read_sign_token.err --out results/read_sign_token.json
      - name: attempt read_sign_key
        run: |
          rc=0
          python3 bin/chain-verify.py hostile-material --kind key --file attempts/read_sign_key.txt --policy policy.json 2> /tmp/read_sign_key.err || rc=$?
          python3 bin/chain-verify.py hostile-row --attempt read_sign_key --exit-code "$rc" --stderr /tmp/read_sign_key.err --out results/read_sign_key.json
      - name: attempt hand_sign_code
        run: |
          rc=0
          python3 bin/chain-verify.py check-build-record --digests attempts/hand_sign_code.json --build-record witness-build/build-collection.json --policy policy.json 2> /tmp/hand_sign_code.err || rc=$?
          python3 bin/chain-verify.py hostile-row --attempt hand_sign_code --exit-code "$rc" --stderr /tmp/hand_sign_code.err --out results/hand_sign_code.json
      - name: attempt forge_provenance
        run: |
          rc=0
          python3 bin/chain-verify.py verify --stage sign --record attempts/forge_provenance.json --policy policy.json 2> /tmp/forge_provenance.err || rc=$?
          python3 bin/chain-verify.py hostile-row --attempt forge_provenance --exit-code "$rc" --stderr /tmp/forge_provenance.err --out results/forge_provenance.json
      - name: positive control (this run's genuine Sign output must be accepted)
        run: |
          rc=0
          python3 bin/chain-verify.py verify --stage sign --record provenance/provenance.json --policy policy.json --rekor-stub provenance/provenance.rekor.json 2> /tmp/positive_control.err || rc=$?
          python3 bin/chain-verify.py hostile-row --attempt positive_control --exit-code "$rc" --stderr /tmp/positive_control.err --out results/positive_control.json
      - name: collect the rows
        run: python3 bin/chain-verify.py hostile-collect results --out hostile-results.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hostile-results
          path: hostile-results.json

  hostile-verdict:
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && contains(github.ref_name, '-rc') }}
    needs: hostile-verify
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: hostile-results
          path: hostile-results
      - name: every hostile attempt refused with its own cause, the positive control accepted
        run: python3 bin/chain-verify.py hostile-verdict hostile-results/hostile-results.json

  # Persona UAT, release-candidate leg (REQ-UAT-001-AC1): on a release candidate the three personas
  # (gradle-platform-engineer, maven-jenkins-ci, readme-evaluator) test the image Build made, BEFORE anything is released, and nothing is published. The job needs Build only.
  # Build's production OCI layout (artifact images) is pushed with the pinned crane to a registry:2 service pinned by digest and published on the runner's loopback only; the pushed
  # digest must equal Build's image-production digest. The job holds no registry credential and no write permission (contents read, id-token write for the federated model
  # token only); the driver is told the registry's port (--allow-listen 5000) so its stray-listener guard accepts that one listener; the personas' containers are never on the host network and the token file is 0600. The image is unverified (no release-verify has run): that is what the personas test.
  # GATE: PERSONA_UAT_ENABLED is exactly 'true' (unset = off), on the JOB, so while off the persona-uat environment is never entered and no token is minted.
  # compliance-reviewer and on-call-engineer run in the weekly job only (go-freshness.yml).
  persona-uat:
    needs: [build]
    if: ${{ vars.PERSONA_UAT_ENABLED == 'true' && startsWith(github.ref, 'refs/tags/v') && contains(github.ref_name, '-rc') && !inputs.dry-run }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    environment: persona-uat
    permissions:
      contents: read
      id-token: write
    services:
      registry:
        image: registry:2@sha256:a3d8aaa63ed8681a604f1dea0aa03f100d5895b6a58ace528858a7b332415373
        ports:
          - 127.0.0.1:5000:5000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: images
          path: candidate/images

      - name: install the pinned crane binary
        run: ./bin/install-scanner.sh crane

      - name: load Build's production image into the registry on this runner, and check its digest
        env:
          DIGESTS: ${{ needs.build.outputs.digests }}
        run: |
          set -euo pipefail
          want=$(jq -er '.["image-production"]' <<<"$DIGESTS")
          crane push candidate/images/production localhost:5000/cache:rc
          got=$(crane digest localhost:5000/cache:rc)
          [ "$got" = "$want" ] || { echo "::error::the pushed digest ${got} is not the one Build attested (${want})"; exit 1; }

      - name: kind from the runner image
        run: kind version || { echo "::error::PIPELINE, no kind"; exit 1; }

      - name: pin pip (hash-checked)
        run: |
          python3 -m pip install --quiet --require-hashes --only-binary=:all: --break-system-packages -r .github/agent/pip-requirements.txt
          python3 -m pip --version

      - name: install the provider SDK (hash-pinned)
        run: |
          python3 -m pip install --quiet --break-system-packages --require-hashes --only-binary=:all: -r bin/persona-uat-requirements.txt

      - name: mint the federated identity token for the model provider
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const token = await core.getIDToken('https://api.anthropic.com');
            core.setSecret(token);
            const f = process.env.RUNNER_TEMP + '/anthropic-identity-token';
            fs.writeFileSync(f, token, { mode: 0o600 });
            // Print ONLY the identity claims the Anthropic federation rule matches on (never the token, which stays masked): a token-exchange 401 is then diagnosable.
            try {
              const payload = JSON.parse(Buffer.from(token.split('.')[1], 'base64url').toString('utf8'));
              const claims = {};
              for (const k of ['sub', 'aud', 'ref', 'job_workflow_ref', 'environment', 'repository', 'repository_owner_id', 'event_name', 'iss']) {
                claims[k] = payload[k];
              }
              core.info('OIDC identity claims (federation-rule inputs): ' + JSON.stringify(claims));
            } catch (e) {
              core.warning('could not decode OIDC claims for logging');
            }

      - name: keep the identity token fresh for the whole job (a detached refresher)
        # The assertion lives about five minutes, the job up to two hours and every model call is a NEW process. A timer inside
        # actions/github-script dies with its step, so this is a process of its own: detached (nohup, output redirected, disowned),
        # it re-mints from the runner's OIDC endpoint into the same 0600 file until the file is removed by the last step.
        run: |
          set -euo pipefail
          f="${RUNNER_TEMP}/anthropic-identity-token"
          [ -f "$f" ] || { echo "::error::the identity token file does not exist yet: mint it first"; exit 1; }
          nohup bash -c '
            f="$1"; every="$2"
            while [ -e "$f" ] && sleep "$every"; do
              [ -e "$f" ] || break
              python3 bin/persona-uat.py --mint-identity "$f" || { [ "$?" -eq 3 ] && break; continue; }
            done
          ' identity-refresher "$f" "${PERSONA_UAT_REFRESH_SECONDS:-60}" </dev/null >/dev/null 2>&1 &
          disown

      - name: run the three release-candidate personas against Build's image on the local registry
        env:
          PERSONA_UAT_MODEL: ${{ secrets.PERSONA_UAT_MODEL }}
          PERSONA_UAT_COMPLIANCE_MODEL: ${{ secrets.PERSONA_UAT_COMPLIANCE_MODEL }}
          PERSONA_UAT_TOKEN_BUDGET: ${{ vars.PERSONA_UAT_TOKEN_BUDGET }}
          ANTHROPIC_FEDERATION_RULE_ID: ${{ secrets.ANTHROPIC_FEDERATION_RULE_ID }}
          ANTHROPIC_ORGANIZATION_ID: ${{ secrets.ANTHROPIC_ORGANIZATION_ID }}
          ANTHROPIC_SERVICE_ACCOUNT_ID: ${{ secrets.ANTHROPIC_SERVICE_ACCOUNT_ID }}
          ANTHROPIC_WORKSPACE_ID: ${{ secrets.ANTHROPIC_WORKSPACE_ID }}
          ANTHROPIC_IDENTITY_TOKEN_FILE: ${{ runner.temp }}/anthropic-identity-token
          PERSONA_UAT_IMAGE: localhost:5000/cache@${{ fromJSON(needs.build.outputs.digests)['image-production'] }}
        run: python3 bin/persona-uat.py --mode rc --image "$PERSONA_UAT_IMAGE" --repo . --out persona-uat-out --tools bin/persona-uat-tools.json --recipient bin/persona-uat-recipient.pem --agent "python3 bin/persona-uat-agent.py" --allow-listen 5000

      - name: upload the encrypted reports and transcripts
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: persona-uat-encrypted
          path: persona-uat-out/*.cms
          if-no-files-found: error

      - name: delete the identity token file
        if: ${{ always() }}
        run: python3 bin/persona-uat.py --remove-identity "${RUNNER_TEMP}/anthropic-identity-token" || rm -f "${RUNNER_TEMP}/anthropic-identity-token" "${RUNNER_TEMP}/anthropic-identity-token.tmp"

  patch-failed:
    # Also when the release job was CANCELLED (audit ruling, Oct 22): the release job's concurrency group keeps one pending run, so a third queued tag run
    # replaces the first pending one, which ends as cancelled, not failed. failure() alone would open no issue; the issue below says to publish the tag again.
    if: ${{ always() && (contains(needs.*.result, 'failure') || needs.release.result == 'cancelled') && startsWith(github.ref, 'refs/tags/v') && github.event_name != 'workflow_dispatch' && !inputs.dry-run }}
    needs: [build, sign, rebuild, sign-rebuild, check, sign-check, release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: open the issue for the abandoned release attempt
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RELEASE_RESULT: ${{ needs.release.result }}
        run: |
          if [ "$RELEASE_RESULT" = cancelled ]; then
            gh issue create --title "auditor: release ${GITHUB_REF_NAME} cancelled" \
              --body "The release run for ${GITHUB_REF_NAME} was cancelled (replaced while pending in the release queue): it did not publish. Publish ${GITHUB_REF_NAME} again. Run: ${RUN_URL}"
          else
            gh issue create --title "auditor: release ${GITHUB_REF_NAME} failed" \
              --body "The release run for ${GITHUB_REF_NAME} failed and is abandoned (no retry). Publish it again once the cause is fixed. Run: ${RUN_URL}"
          fi
