name: Release

# The release chain (release-chain-design.md; v0.3.0 rules 50 to 71): build once, verify by digest, publish by digest. Each stage is a reusable
# workflow with its own OIDC identity; one signed record per stage (Witness, and Sign's provenance), one verification per stage on entry; subjects
# are sha256 digests emitted by the stage that produced the bytes, never resolved from a registry after the fact. Tag mode is the only path that
# pushes anything, and Release (the final stage) is the only path that can make anything public, and only after it has verified every earlier
# stage's record. Releases build ONLY here, by the chain below; nothing else builds or publishes a release.
#
# build -> sign ; { build, sign } -> { rebuild, check } ; { build, rebuild } -> sign-rebuild ; { build, check } -> sign-check ; { check, sign, sign-rebuild, sign-check } -> release

on:
  push:
    tags:
      - "v*"
    # Automatic patch releases (owner RATIFIED Oct 2; REQ-REL-009): a push to main and a daily schedule run ONLY the
    # decide job below; the chain itself starts only on a v* tag.
    branches:
      - main
  schedule:
    - cron: '47 9 * * *'   # daily, after the rescan (07:41) and the auditor (08:23)
  # The dry run of the v0.3.0 chain (PR 1: the Sign boundary): a manual run on a branch; the hostile Build step and its judges run on a push of a
  # release-candidate tag, not here; it neither tags nor publishes (every other job below carries `!inputs.dry-run`).
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'run the hostile-step dry run (no tag, no publish)'
        type: boolean
        default: false

# Every job asks for what it needs (v0.3.0 rule 56: only the Release job holds write access to packages and the repository's releases). The
# workflow default is read-only; a caller's grants must COVER what the called stage requests, or the run is a startup_failure with zero jobs.
permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------------------------------------------
  # Automatic patch releases (owner RATIFIED Oct 2; advisor read-backs 0051/0055/0056/0057; REQ-REL-009).
  # On main only: decides whether a patch is due (bin/patch-decide.py: fix-only since the latest tag, rule 1; at once for
  # a removed critical/high finding on push, else at most once a day, rule 2), signs the tag keylessly with gitsign under
  # THIS workflow's identity (rule 3), and pushes it with the auditor App's token, whose tag push starts the chain below.
  decide:
    if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'workflow_dispatch' && !inputs.dry-run }}
    # one decision at a time: a push and the daily run never both cut the same day (queued, never cancelled)
    concurrency:
      group: patch-decide
      cancel-in-progress: false
    runs-on: ubuntu-latest
    environment: agent          # the App's secrets live here (main only)
    permissions:
      contents: read
      checks: read              # wait for the tagged commit's required checks (advisor 0063)
      id-token: write           # gitsign signs with this workflow's own OIDC identity (no key)
      issues: write             # the standing "main is not patch-clean" issue
    outputs:
      tagged: ${{ steps.push.outputs.tagged }}   # the patch-notes job opens the changelog PR (advisor 0135)
      version: ${{ steps.decide.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # REQ-CHAIN-001-AC6: no patch decision proceeds unless the committed marker names a recorded green rc-tag run of exactly these chain files (a missing marker
      # fails this step, so the job ends before anything is decided, scanned or tagged)
      - name: the rc-proof marker validates for this commit
        run: python3 bin/patch-decide.py rc-proof --marker .github/policy/rc-proof.json --commit "$GITHUB_SHA"

      - name: install the pinned tools (gitsign; grype)
        run: |
          set -euo pipefail
          ./bin/install-scanner.sh gitsign
          ./bin/install-scanner.sh grype

      - name: what changed since the latest tag (the PR labels of each commit) and whether a patch was cut today
        id: facts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # the baseline is the latest PUBLISHED release: a tag whose release run failed is a used version number,
          # never the baseline, so the next run releases what it held (REQ-REL-009-AC10; Codex #159 r1, B4)
          gh release list --exclude-drafts --limit 1000 --json tagName,isPrerelease \
            --jq '[.[] | select(.isPrerelease | not) | .tagName]' > "$RUNNER_TEMP/released.json"
          since=$(jq -r '.[]' "$RUNNER_TEMP/released.json" | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
            | while read -r t; do git rev-parse -q --verify "refs/tags/$t" > /dev/null && echo "$t"; done | sort -V | tail -1 || true)
          echo "since=${since}" >> "$GITHUB_OUTPUT"
          echo '{}' > "$RUNNER_TEMP/labels.json"
          if [ -n "$since" ]; then
            for sha in $(git rev-list "${since}..HEAD"); do
              l=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${sha}/pulls" --jq '[.[0].labels[]?.name]' 2>/dev/null || echo '[]')
              jq --arg s "$sha" --argjson l "$l" '. + {($s): $l}' "$RUNNER_TEMP/labels.json" > "$RUNNER_TEMP/l.tmp" && mv "$RUNNER_TEMP/l.tmp" "$RUNNER_TEMP/labels.json"
            done
          fi
          today=$(date -u +%F)
          cut=$(git for-each-ref --format='%(creatordate:short) %(refname:short)' 'refs/tags/v*' | awk -v t="$today" '$1==t' | grep -c . || true)
          echo "cut_today=$([ "${cut:-0}" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      # every event scans: the decision uses the result on push only; the notes need it for a daily patch too (AC8)
      - name: the latest release's findings this commit removes (release vs. HEAD)
        if: ${{ steps.facts.outputs.since != '' }}
        env:
          SINCE: ${{ steps.facts.outputs.since }}
        run: |
          set -uo pipefail
          # every variant of the release must scan: one that cannot is "unknown" (no at-once cut), never an empty
          # release (Codex #159 r1, B2)
          ver="${SINCE#v}"; rel=(); ok=1
          for t in $(python3 bin/patch-decide.py variants --version "$ver"); do
            if grype "ghcr.io/${GITHUB_REPOSITORY}:${t}" -o json > "$RUNNER_TEMP/rel-${t}.json"; then rel+=("$RUNNER_TEMP/rel-${t}.json")
            else echo "::warning::the release image ${t} could not be scanned"; ok=0; fi
          done
          # each scan goes to the decision on its own and is validated there — no aggregation that turns a malformed
          # document into an empty one; a base-image failure is the base's alone (Codex #159 r2, B2 / NEW-1)
          rel_args=(); for f in "${rel[@]}"; do rel_args+=(--release-grype "$f"); done
          # Rules 61 and 62: no base image exists (the image is assembled by apko from committed locks), so none is scanned and no distribution package
          # finding counts as removed (unknown never counts). The base inputs are the committed locks and records of .github/policy/base-inputs.json; the
          # ones that moved since the release are printed here, and bin/patch-decide.py classifies a commit from the same list (the base-input-changed signal).
          python3 bin/patch-decide.py base-moved --base-inputs .github/policy/base-inputs.json --since "$SINCE" > "$RUNNER_TEMP/base-moved.txt" || exit 1
          cat "$RUNNER_TEMP/base-moved.txt" >> "$GITHUB_STEP_SUMMARY"
          if [ "$ok" != 1 ] || ! python3 bin/patch-decide.py removed "${rel_args[@]}" --gomod go.mod \
               --out "$RUNNER_TEMP/removed.json"; then
            touch "$RUNNER_TEMP/removed-unknown"
          fi

      - name: decide (bin/patch-decide.py)
        id: decide
        run: |
          set -euo pipefail
          removed=(); [ -f "$RUNNER_TEMP/removed.json" ] && removed=(--removed "$RUNNER_TEMP/removed.json")
          [ ! -f "$RUNNER_TEMP/removed-unknown" ] || removed=(--removed-unknown)
          python3 bin/patch-decide.py decide --event "${GITHUB_EVENT_NAME}" --cut-today '${{ steps.facts.outputs.cut_today }}' \
            --released "$RUNNER_TEMP/released.json" --labels "$RUNNER_TEMP/labels.json" "${removed[@]}" --out "$RUNNER_TEMP/decision.json"
          {
            echo "cut=$(jq -r .cut "$RUNNER_TEMP/decision.json")"
            echo "version=$(jq -r '.version // ""' "$RUNNER_TEMP/decision.json")"
            echo "dirty=$(jq -r '(.not_clean | length) > 0' "$RUNNER_TEMP/decision.json")"
          } >> "$GITHUB_OUTPUT"

      - name: main is not patch-clean — the standing information issue (no vendor or model names)
        if: ${{ steps.decide.outputs.dirty == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          title="auditor: main is not patch-clean"
          # One body, entries whole (REQ-REL-009 AC1: "the commits and why"): as many complete lines as fit under 60000 bytes, never a line cut
          # (so a redacted text is never split), then how many are left out; the decide job log lists them all. Handed over as a file: the whole
          # list as one argument is past the kernel's limit and the step died with exit 126 (run 39989891074).
          python3 - "$RUNNER_TEMP" <<'PY'
          import json, sys
          t = sys.argv[1]
          d = json.load(open(t + "/decision.json"))
          body = "No patch was cut: these commits since %s are not fix-only (rule 1). A minor release, or the owner's patch-fix label on the PR, resolves each.\n\n" % (d.get("since") or "the latest tag")
          LIMIT, total, placed = 60000, len(d["not_clean"]), 0
          foot = lambda left: "\n... and %d more of %d commits; the decide job log lists them all\n" % (left, total)
          for e in d["not_clean"]:
              line = "- " + e + "\n"
              if len((body + line).encode()) + len(foot(total).encode()) > LIMIT: break
              body += line
              placed += 1
          if placed < total: body += foot(total - placed)
          open(t + "/issue-body.md", "w").write(body)
          PY
          n=$(gh issue list --state open --search "$title in:title" --json number,title --jq "[.[] | select(.title == \"$title\")][0].number // empty")
          if [ -n "$n" ]; then gh issue comment "$n" --body-file "$RUNNER_TEMP/issue-body.md"; else gh issue create --title "$title" --body-file "$RUNNER_TEMP/issue-body.md"; fi

      # REQ-REL-009-AC13 (owner RATIFIED Oct 2): a CI patch uses the latest owner-approved ACs baseline of its line, only
      # if the requirements are byte-for-byte unchanged since it. Admission applies this rule; decide applies the SAME
      # rule to the same sources first (owner-signed tags), so it never cuts a tag admission must refuse. Otherwise no
      # cut: it waits for the owner.
      - name: pre-check the ACs baseline admission will require (bin/admission-tag-signer.py baseline)
        id: basecheck
        if: ${{ steps.decide.outputs.cut == 'true' }}
        env:
          VERSION: ${{ steps.decide.outputs.version }}
        run: |
          set -euo pipefail
          # baselines only from owner-SSH-signed tags of the line, verified against protected main's allowed signers —
          # exactly what admission reads (Codex #163 r1, B01; advisor 0093)
          git fetch -q --no-tags origin main
          git show origin/main:.github/policy/allowed_signers > "$RUNNER_TEMP/allowed_signers"
          python3 bin/admission-tag-signer.py owner-baselines --tag "${VERSION}" \
            --allowed-signers "$RUNNER_TEMP/allowed_signers" --out "$RUNNER_TEMP/owner-baselines"
          b=$(python3 bin/admission-tag-signer.py baseline --tag "${VERSION}" --owner-baselines "$RUNNER_TEMP/owner-baselines" \
                --requirements requirements/requirements.yaml)
          echo "$b"
          case "$b" in
            "use "*)
              # admission will read the tagged commit's copy and refuse it unless it equals the owner tag's (pin pass B03)
              base=$(cut -d' ' -f2 <<<"$b")
              if git show "${base}:requirements/releases/${base}.yaml" | cmp -s - "requirements/releases/${base}.yaml"; then
                echo "ok=true" >> "$GITHUB_OUTPUT"
              else
                echo "::notice::no cut: requirements/releases/${base}.yaml differs from the owner-signed ${base}"
                echo "ok=false" >> "$GITHUB_OUTPUT"
              fi ;;
            *) echo "::notice::no cut: ${b#no }"; echo "ok=false" >> "$GITHUB_OUTPUT" ;;
          esac

      # Admission requires every push-scoped required check green on the exact tagged commit; on a push, that commit's
      # checks are still running when decide runs. Wait for them (bounded: a wait, never a retry, rule 7); cut only if they
      # are all green, judged as admission judges them. Otherwise no cut, and the daily run picks the patch up.
      - name: wait for the tagged commit's required checks (as admission judges them; bounded)
        id: checks
        if: ${{ steps.basecheck.outputs.ok == 'true' }}
        timeout-minutes: 65
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # the same query admission makes (filter=latest), against the same policy: protected main's, never the
          # checked-out commit's (Codex #159 r1, B6; pin pass B01/B02) — so "ready" here is what admission will see
          end=$((SECONDS + 3600))
          while [ "$SECONDS" -lt "$end" ]; do
            # re-read each time: a policy change on main during the wait applies, as it will at admission (pin pass B02)
            git fetch -q --no-tags origin main
            git show origin/main:.github/policy/required-checks.json > "$RUNNER_TEMP/required-checks.json"
            gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/check-runs?filter=latest&per_page=100" --paginate \
              --jq '[.check_runs[] | {name, status, conclusion, app_id: .app.id}]' | jq -s 'add // []' > "$RUNNER_TEMP/runs.json"
            v=$(python3 bin/patch-decide.py ready --required "$RUNNER_TEMP/required-checks.json" --check-runs "$RUNNER_TEMP/runs.json")
            echo "$v"
            case "${v%% *}" in
              ready) echo "ready=true" >> "$GITHUB_OUTPUT"; exit 0 ;;
              no) echo "::notice::no cut: ${v#no }; the daily run tries again once main is green"; echo "ready=false" >> "$GITHUB_OUTPUT"; exit 0 ;;
            esac
            sleep 60
          done
          echo "::notice::no cut: the required checks did not finish within 60 minutes; the daily run tries again"
          echo "ready=false" >> "$GITHUB_OUTPUT"

      # AC8 (advisor 0130/0135): the fixes from the release scans, the VEX changes since the latest tag and the
      # next-release entries no earlier patch published; an incomplete scan or an uncited entry fails here: no tag
      - name: the patch notes (bin/patch-decide.py notes)
        if: ${{ steps.decide.outputs.cut == 'true' }}
        env:
          SINCE: ${{ steps.facts.outputs.since }}
          VERSION: ${{ steps.decide.outputs.version }}
        run: |
          set -euo pipefail
          if [ -f "$RUNNER_TEMP/removed-unknown" ]; then
            echo "::error::the latest release could not be scanned: its fixes cannot be listed, so no patch"; exit 1
          fi
          ver="${SINCE#v}"
          var=()
          for t in $(python3 bin/patch-decide.py variants --version "$ver"); do
            v="${t#"$ver"}"; var+=(--variant-grype "${v#-}=$RUNNER_TEMP/rel-${t}.json")   # "", "debug" or "fips": the variant name the notes use
          done
          old=(); if git show "${SINCE}:.vex/fosterstack-cache.openvex.json" > "$RUNNER_TEMP/vex-old.json" 2>/dev/null; then
            old=(--vex-old "$RUNNER_TEMP/vex-old.json"); fi
          { git for-each-ref 'refs/tags/v*' --format='%(contents)'; cat docs/quality/releases/CHANGELOG.md 2>/dev/null || true; } > "$RUNNER_TEMP/published.txt"
          python3 bin/patch-decide.py notes --version "$VERSION" "${var[@]}" --gomod go.mod "${old[@]}" \
            --vex-new .vex/fosterstack-cache.openvex.json --next-notes docs/next-release-notes.md \
            --published "$RUNNER_TEMP/published.txt" --out "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md" >> "$GITHUB_STEP_SUMMARY"

      - name: sign the patch tag keylessly (gitsign, this workflow's identity)
        if: ${{ steps.checks.outputs.ready == 'true' }}
        env:
          VERSION: ${{ steps.decide.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "fosterstack release"
          git config user.email "release@users.noreply.github.com"
          git -c gpg.format=x509 -c gpg.x509.program=gitsign tag -s --cleanup=verbatim -F "$RUNNER_TEMP/notes.md" "$VERSION"
          git -c gpg.format=x509 -c gpg.x509.program=gitsign verify-tag "$VERSION" 2>&1 | tail -2 || true

      - name: mint the auditor App's token (contents write on cache only)
        id: app-token
        if: ${{ steps.checks.outputs.ready == 'true' }}
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.AUDITOR_APP_ID }}
          private-key: ${{ secrets.AUDITOR_APP_PRIVATE_KEY }}
          repositories: cache
          permission-contents: write

      - name: push the signed tag (the App transports it)
        id: push
        if: ${{ steps.checks.outputs.ready == 'true' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          VERSION: ${{ steps.decide.outputs.version }}
        run: |
          set -euo pipefail
          gh auth setup-git
          git push origin "refs/tags/${VERSION}"
          echo "tagged=true" >> "$GITHUB_OUTPUT"

  # AC8 + advisor 0130/0135: the pushed tag's notes go on top of docs/quality/releases/CHANGELOG.md and leave docs/next-release-notes.md,
  # in one generated PR that auto-merges on green (required checks; never a push to main). Its own App token.
  patch-notes:
    needs: decide
    if: ${{ needs.decide.outputs.tagged == 'true' && !inputs.dry-run }}
    runs-on: ubuntu-latest
    environment: agent
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: mint the auditor App's token (contents + pull requests on cache only)
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.AUDITOR_APP_ID }}
          private-key: ${{ secrets.AUDITOR_APP_PRIVATE_KEY }}
          repositories: cache
          permission-contents: write
          permission-pull-requests: write

      - name: the changelog-and-clear PR (auto-merge on green)
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          VERSION: ${{ needs.decide.outputs.version }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "+refs/tags/${VERSION}:refs/tags/${VERSION}"
          git cat-file tag "$VERSION" | python3 bin/patch-decide.py tag-notes > "$RUNNER_TEMP/notes.md"
          python3 bin/patch-decide.py changelog --notes "$RUNNER_TEMP/notes.md" --changelog docs/quality/releases/CHANGELOG.md \
            --next-notes docs/next-release-notes.md
          branch="patch-notes/${VERSION}"
          # The commit is made through the GitHub API so GitHub signs it (main requires signed commits; a `git commit` here would be unsigned and
          # its PR would stay blocked). Its parent is the commit the generated files were computed from: the checkout of main (a branch checkout,
          # so HEAD is main's tip at checkout time). A newer main tip as parent would carry these files over edits made since.
          base=$(git rev-parse HEAD)
          paths=(--path docs/quality/releases/CHANGELOG.md)
          [ ! -f docs/next-release-notes.md ] || paths+=(--path docs/next-release-notes.md)
          oid=$(python3 .github/agent/bin/auditor-signed-commit.py --repo "$GITHUB_REPOSITORY" --branch "$branch" --base "$base" --prefix patch-notes/ \
            --message "Release notes for ${VERSION}: docs/quality/releases/CHANGELOG.md, next-release-notes cleared" "${paths[@]}")
          # RESIDUALS (documented, not handled here): (1) moving the live branch is not atomic: a writer between the head re-read and the forced
          # ref update can be overwritten (inherited from the signed-commit helper, #190; one run per tag; the branch name is not a reserved lane, so this is a residual);
          # (2) a rerun after the notes were published and merged can prepend the same changelog entry again (no already-published detection).
          # Re-runnable, bound to what THIS job made: the PR is the open one from this branch INTO main, in THIS repository (a fork PR with the same
          # branch name is ignored), exactly one, kept by NUMBER, and its head must be the commit the helper just made ($oid); auto-merge is enabled
          # only for that head (--match-head-commit). Any other state is a refusal.
          own='[.[] | select(.isCrossRepository == false)]'
          count=$(gh pr list --head "$branch" --base main --state open --json number,headRefOid,isCrossRepository --jq "$own | length")
          [ "$count" -le 1 ] || { echo "more than one open PR from $branch into main; refusing" >&2; exit 1; }
          if [ "$count" -eq 0 ]; then
            gh pr create --base main --head "$branch" --title "Release notes for ${VERSION}" \
              --body "Generated after the ${VERSION} patch tag (REQ-REL-009 AC8; advisor 0130/0135): its notes on top of docs/quality/releases/CHANGELOG.md, the published entries removed from docs/next-release-notes.md."
          fi
          number=$(gh pr list --head "$branch" --base main --state open --json number,headRefOid,isCrossRepository --jq "$own | .[0].number")
          head=$(gh pr list --head "$branch" --base main --state open --json number,headRefOid,isCrossRepository --jq "$own | .[0].headRefOid")
          [[ "$number" =~ ^[0-9]+$ ]] || { echo "no open PR from $branch into main; refusing" >&2; exit 1; }
          [ "$head" = "$oid" ] || { echo "the open PR's head is not the commit this job made; refusing" >&2; exit 1; }
          gh pr merge --auto --squash --match-head-commit "$oid" "$number"
          # main's ruleset requires up-to-date branches: a PR that is BEHIND main is brought up to date (a failure of the update is not an error)
          state=$(gh pr view "$number" --json mergeStateStatus --jq .mergeStateStatus) || state=unknown
          if [ "$state" = "BEHIND" ]; then
            gh pr update-branch "$number" || true
          fi

  # ---------------------------------------------------------------------------------------------------------------
  # The v0.3.0 chain (PR 2: Build and Rebuild; REQ-CHAIN-004, REQ-CHAIN-005). Build, Sign and Rebuild carry the rules of
  # bin/chain-build-wiring-test.sh (an exact grammar for this graph). The gate G is the same text on build and sign: the chain
  # starts on a v* tag PUSH, or in a dry-run dispatch on any branch (a manual dispatch on an existing v* tag is not a release
  # run). Rebuild has no `if`: it runs after Build through `needs`, and a skipped Build skips it.
  # Check (PR 3) replaced the old scans, acceptance and authorization jobs; Release (PR 4) replaced the old promotion job.
  build:
    if: ${{ (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || inputs.dry-run == true }}
    permissions:
      contents: read
      checks: read
      statuses: read
      pull-requests: read
    uses: ./.github/workflows/stage-build.yml
    with:
      hostile: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && contains(github.ref_name, '-rc') }}   # the hostile Build step runs on a push of a release-candidate tag only (advisor 0383)

  # The Sign job of v0.3.0 (rule 52): its own workflow file, called only from here, with the digests.json text Build wrote.
  sign:
    if: ${{ (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || inputs.dry-run == true }}
    needs: build
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/stage-sign.yml
    with:
      digests: ${{ needs.build.outputs.digests }}
      stage: build

  # Rebuild (rule 54): fresh runners rebuild everything Build built and compare every item; its only output is the verdict. It starts from Build's SIGNED records
  # (the building jobs hold no identity token; Sign signs what they recorded), so it needs Sign.
  rebuild:
    needs: [build, sign]
    permissions:
      contents: read
    uses: ./.github/workflows/stage-reproducibility.yml

  # Sign's second call (owner Oct 22 2026, ops/docs/ratify/2026-10-22-witness-signed-outside-build.md): the same file, the stage rebuild: it checks and signs Rebuild's records
  # and receives no Rebuild apk or image. Its identity is the first call's (one workflow file, release.yml on top).
  sign-rebuild:
    needs: [build, rebuild]
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/stage-sign.yml
    with:
      digests: ${{ needs.build.outputs.digests }}
      stage: rebuild
      records: ${{ needs.rebuild.outputs.records }}

  # Check (rules 55, 58, 70; REQ-CHAIN-006): scanners, acceptance suites, the FIPS check and the customer-guide commands against the exact candidate
  # digests, as three Witness steps. It needs Build and Sign (it verifies Build's record, signed by Sign, on entry) and runs beside Rebuild, never after it.
  check:
    needs: [build, sign]
    permissions:
      contents: read
    uses: ./.github/workflows/stage-verify.yml

  # Sign's third call (REQ-REL-011-AC1, cache#606): the same file, the stage check: it checks and signs the records of the Check jobs, which hold no identity token (their
  # steps build tools and run workloads), against the results Check uploaded. Its identity is the first call's.
  sign-check:
    needs: [build, check]
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/stage-sign.yml
    with:
      digests: ${{ needs.build.outputs.digests }}
      stage: check
      records: ${{ needs.check.outputs.records }}
      records-arm64: ${{ needs.check.outputs.records-arm64 }}

  # Release (rules 56, 57, 64, 69, 71; REQ-CHAIN-007): the only job that holds a registry credential, the apk signing key or write access to packages and
  # releases. It needs exactly Check, Sign, Sign-rebuild and Sign-check (rule 70; it reaches Build and Rebuild through them), has no `if` that survives a failed or skipped predecessor
  # (a dry run publishes nothing, a branch run is not a release, and a skipped Build skips it through `needs`), passes no secrets to the stage (the environment named release holds them)
  # and creates no tag.
  release:
    if: ${{ startsWith(github.ref, 'refs/tags/v') && !inputs.dry-run }}
    needs: [check, sign, sign-rebuild, sign-check]
    # One publication at a time (release review R3, Oct 22): bin/release-publish.sh decides :X and :latest from the registry's tag list, so two
    # release runs must not interleave. One fixed group for every v* run, release candidates included. A queued run waits and a running one is never
    # cancelled (cancel-in-progress false). GitHub keeps one pending run per group: a second queued tag run replaces the first pending one, which ends
    # cancelled; the patch-failed job below then opens an issue saying to publish that tag again (it is not re-run silently or by hand alone).
    concurrency:
      group: release-publish
      cancel-in-progress: false
    permissions:
      contents: write
      packages: write
      id-token: write
    uses: ./.github/workflows/stage-promote.yml

  # Scanner-panel rule 12 (owner RATIFIED Oct 2; REQ-SCAN-012): on a release candidate (vX.Y.Z-rcN, nothing is published) the candidate images are pushed by digest
  # from Build's artifacts to the dedicated test repositories and the page's load and removal commands run as written; the blocks that read a release or a
  # registry run in live-test-release after publishing (docs/using-our-vex.cannot-run.json).
  live-test:
    needs: [check]
    if: ${{ startsWith(github.ref, 'refs/tags/v') && contains(github.ref_name, '-rc') && !inputs.dry-run }}
    runs-on: ubuntu-latest
    concurrency:   # one live test at a time across both workflows: the sweep owns the whole test estate
      group: vex-live-test
      cancel-in-progress: false
    environment: live-test   # holds the five LIVE_TEST_* identifiers (advisor 0078); its tag policy must admit rc and final v tags
    permissions:
      contents: read
      id-token: write
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: digests
          path: candidate
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: items
          path: candidate
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: images
          path: candidate/images
      - name: install crane, Grype and cosign (pinned by checksum)
        run: |
          set -euo pipefail
          bash bin/install-scanner.sh crane
          bash bin/install-scanner.sh cosign
          mkdir -p "$RUNNER_TEMP/tools"
          bash bin/install-scanner.sh grype "$RUNNER_TEMP/tools"
          echo "$RUNNER_TEMP/tools" >> "$GITHUB_PATH"
      - name: install docker-scout (pinned by checksum)
        run: |
          set -euo pipefail
          bash bin/install-scanner.sh docker-scout "$RUNNER_TEMP"
          mkdir -p "$HOME/.docker/cli-plugins" && install -m 0755 "$RUNNER_TEMP/docker-scout" "$HOME/.docker/cli-plugins/docker-scout"
      - name: AWS, as the live-test role (federated; the test ECR repository and live-test Inspector filters only)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.LIVE_TEST_AWS_ROLE_ARN }}
          aws-region: us-east-1
      - name: Google, as the live-test service account (federated; the test Artifact Registry repository and VEX notes)
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.LIVE_TEST_GCP_PROVIDER }}
          service_account: ${{ vars.LIVE_TEST_GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        with:
          version: '587.0.0'
      - name: the live test, every guide command as written, the fixture's finding shown before and gone after
        env:
          MODE: rc
          ECR: ${{ vars.LIVE_TEST_ECR_REPOSITORY }}
          GAR: ${{ vars.LIVE_TEST_GAR_REPOSITORY }}
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_DIR: ${{ github.workspace }}/candidate
          DH_REPO: ${{ vars.LIVE_TEST_DOCKERHUB_REPOSITORY }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TEST_USERNAME: ${{ secrets.DOCKERHUB_TEST_USERNAME }}
          DOCKERHUB_TEST_PUSH_TOKEN: ${{ secrets.DOCKERHUB_TEST_PUSH_TOKEN }}
          DOCKERHUB_SCOUT_TOKEN: ${{ secrets.DOCKERHUB_SCOUT_TOKEN }}
        run: bash bin/vex-live-run.sh run
      - name: cleanup, delete every image, live-test filter and VEX note the run created
        if: always()
        env:
          ECR: ${{ vars.LIVE_TEST_ECR_REPOSITORY }}
          GAR: ${{ vars.LIVE_TEST_GAR_REPOSITORY }}
          DH_REPO: ${{ vars.LIVE_TEST_DOCKERHUB_REPOSITORY }}
          DOCKERHUB_TEST_USERNAME: ${{ secrets.DOCKERHUB_TEST_USERNAME }}
          DOCKERHUB_TEST_PUSH_TOKEN: ${{ secrets.DOCKERHUB_TEST_PUSH_TOKEN }}
        run: bash bin/vex-live-run.sh cleanup

  # The same live test, right after the final release is published, with every command block of the page as written (including the download, digest and verify blocks).
  live-test-release:
    needs: [release]
    if: ${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-rc') && !inputs.dry-run }}
    runs-on: ubuntu-latest
    concurrency:   # one live test at a time across both workflows: the sweep owns the whole test estate
      group: vex-live-test
      cancel-in-progress: false
    environment: live-test   # holds the five LIVE_TEST_* identifiers (advisor 0078); its tag policy must admit rc and final v tags
    permissions:
      contents: read
      id-token: write
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: install crane, Grype and cosign (pinned by checksum)
        run: |
          set -euo pipefail
          bash bin/install-scanner.sh crane
          bash bin/install-scanner.sh cosign
          mkdir -p "$RUNNER_TEMP/tools"
          bash bin/install-scanner.sh grype "$RUNNER_TEMP/tools"
          echo "$RUNNER_TEMP/tools" >> "$GITHUB_PATH"
      - name: install docker-scout (pinned by checksum)
        run: |
          set -euo pipefail
          bash bin/install-scanner.sh docker-scout "$RUNNER_TEMP"
          mkdir -p "$HOME/.docker/cli-plugins" && install -m 0755 "$RUNNER_TEMP/docker-scout" "$HOME/.docker/cli-plugins/docker-scout"
      - name: AWS, as the live-test role (federated; the test ECR repository and live-test Inspector filters only)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.LIVE_TEST_AWS_ROLE_ARN }}
          aws-region: us-east-1
      - name: Google, as the live-test service account (federated; the test Artifact Registry repository and VEX notes)
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.LIVE_TEST_GCP_PROVIDER }}
          service_account: ${{ vars.LIVE_TEST_GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        with:
          version: '587.0.0'
      - name: the live test, every guide command as written, the fixture's finding shown before and gone after
        env:
          MODE: release
          ECR: ${{ vars.LIVE_TEST_ECR_REPOSITORY }}
          GAR: ${{ vars.LIVE_TEST_GAR_REPOSITORY }}
          GH_TOKEN: ${{ github.token }}
          DH_REPO: ${{ vars.LIVE_TEST_DOCKERHUB_REPOSITORY }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TEST_USERNAME: ${{ secrets.DOCKERHUB_TEST_USERNAME }}
          DOCKERHUB_TEST_PUSH_TOKEN: ${{ secrets.DOCKERHUB_TEST_PUSH_TOKEN }}
          DOCKERHUB_SCOUT_TOKEN: ${{ secrets.DOCKERHUB_SCOUT_TOKEN }}
        run: bash bin/vex-live-run.sh run
      - name: cleanup, delete every image, live-test filter and VEX note the run created
        if: always()
        env:
          ECR: ${{ vars.LIVE_TEST_ECR_REPOSITORY }}
          GAR: ${{ vars.LIVE_TEST_GAR_REPOSITORY }}
          DH_REPO: ${{ vars.LIVE_TEST_DOCKERHUB_REPOSITORY }}
          DOCKERHUB_TEST_USERNAME: ${{ secrets.DOCKERHUB_TEST_USERNAME }}
          DOCKERHUB_TEST_PUSH_TOKEN: ${{ secrets.DOCKERHUB_TEST_PUSH_TOKEN }}
        run: bash bin/vex-live-run.sh cleanup

  # The hostile judges, run on a release-candidate tag push (v0.3.0 rules 52a, 59; REQ-CHAIN-001-AC5): every attempt of the hostile Build step is judged by the REAL
  # verifier against the policy made for this run's own ref, and one positive control (this run's genuine Sign output) must be
  # ACCEPTED by the same policy. The outcome of an attempt is the verifier's own exit code, captured per attempt, never a field
  # the hostile step wrote. This job only judges; it publishes nothing.
  hostile-verify:
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && contains(github.ref_name, '-rc') }}
    needs: sign
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: hostile-attempts
          path: attempts
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: signed-witness-build
          path: witness-build
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: provenance
          path: provenance
      - name: make the policy for this run's own ref
        run: python3 bin/chain-verify.py policy make --template .github/policy/release-policy.template.json --ref "$GITHUB_REF" --out policy.json
      - name: attempt mint_sign_cert
        run: |
          rc=0
          python3 bin/chain-verify.py verify --stage sign --record attempts/mint_sign_cert.json --policy policy.json 2> /tmp/mint_sign_cert.err || rc=$?
          python3 bin/chain-verify.py hostile-row --attempt mint_sign_cert --exit-code "$rc" --stderr /tmp/mint_sign_cert.err --out results/mint_sign_cert.json
      - name: attempt read_sign_token
        run: |
          rc=0
          python3 bin/chain-verify.py hostile-material --kind token --file attempts/read_sign_token.txt 2> /tmp/read_sign_token.err || rc=$?
          python3 bin/chain-verify.py hostile-row --attempt read_sign_token --exit-code "$rc" --stderr /tmp/read_sign_token.err --out results/read_sign_token.json
      - name: attempt read_sign_key
        run: |
          rc=0
          python3 bin/chain-verify.py hostile-material --kind key --file attempts/read_sign_key.txt --policy policy.json 2> /tmp/read_sign_key.err || rc=$?
          python3 bin/chain-verify.py hostile-row --attempt read_sign_key --exit-code "$rc" --stderr /tmp/read_sign_key.err --out results/read_sign_key.json
      - name: attempt hand_sign_code
        run: |
          rc=0
          python3 bin/chain-verify.py check-build-record --digests attempts/hand_sign_code.json --build-record witness-build/build-collection.json --policy policy.json 2> /tmp/hand_sign_code.err || rc=$?
          python3 bin/chain-verify.py hostile-row --attempt hand_sign_code --exit-code "$rc" --stderr /tmp/hand_sign_code.err --out results/hand_sign_code.json
      - name: attempt forge_provenance
        run: |
          rc=0
          python3 bin/chain-verify.py verify --stage sign --record attempts/forge_provenance.json --policy policy.json 2> /tmp/forge_provenance.err || rc=$?
          python3 bin/chain-verify.py hostile-row --attempt forge_provenance --exit-code "$rc" --stderr /tmp/forge_provenance.err --out results/forge_provenance.json
      - name: positive control (this run's genuine Sign output must be accepted)
        run: |
          rc=0
          python3 bin/chain-verify.py verify --stage sign --record provenance/provenance.json --policy policy.json --rekor-stub provenance/provenance.rekor.json 2> /tmp/positive_control.err || rc=$?
          python3 bin/chain-verify.py hostile-row --attempt positive_control --exit-code "$rc" --stderr /tmp/positive_control.err --out results/positive_control.json
      - name: collect the rows
        run: python3 bin/chain-verify.py hostile-collect results --out hostile-results.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hostile-results
          path: hostile-results.json

  hostile-verdict:
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && contains(github.ref_name, '-rc') }}
    needs: hostile-verify
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: hostile-results
          path: hostile-results
      - name: every hostile attempt refused with its own cause, the positive control accepted
        run: python3 bin/chain-verify.py hostile-verdict hostile-results/hostile-results.json

  # Persona UAT, release-candidate leg (REQ-UAT-001-AC1; advisor reading Oct 17 of the owner's Oct 3/4 rule and REQ-CHAIN-007-AC14): on a release candidate the three personas
  # (gradle-platform-engineer, maven-jenkins-ci, readme-evaluator) test the image Build made, BEFORE anything is released, and nothing is published. The job needs Build only.
  # Build's production OCI layout (artifact images) is pushed with the pinned crane to a registry:2 service pinned by digest and published on the runner's loopback only; the pushed
  # digest must equal Build's image-production digest. The job holds no registry credential and no write permission (contents read, id-token write for the federated model
  # token only); the driver is told the registry's port (--allow-listen 5000) so its stray-listener guard accepts that one listener; the personas' containers are never on the host network and the token file is 0600. The image is unverified (no release-verify has run): that is what the personas test.
  # GATE: PERSONA_UAT_ENABLED is exactly 'true' (unset = off), on the JOB, so while off the persona-uat environment is never entered and no token is minted.
  # compliance-reviewer and on-call-engineer run in the weekly job only (go-freshness.yml).
  persona-uat:
    needs: [build]
    if: ${{ vars.PERSONA_UAT_ENABLED == 'true' && startsWith(github.ref, 'refs/tags/v') && contains(github.ref_name, '-rc') && !inputs.dry-run }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    environment: persona-uat
    permissions:
      contents: read
      id-token: write
    services:
      registry:
        image: registry:2@sha256:a3d8aaa63ed8681a604f1dea0aa03f100d5895b6a58ace528858a7b332415373
        ports:
          - 127.0.0.1:5000:5000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: images
          path: candidate/images

      - name: install the pinned crane binary
        run: ./bin/install-scanner.sh crane

      - name: load Build's production image into the registry on this runner, and check its digest
        env:
          DIGESTS: ${{ needs.build.outputs.digests }}
        run: |
          set -euo pipefail
          want=$(jq -er '.["image-production"]' <<<"$DIGESTS")
          crane push candidate/images/production localhost:5000/cache:rc
          got=$(crane digest localhost:5000/cache:rc)
          [ "$got" = "$want" ] || { echo "::error::the pushed digest ${got} is not the one Build attested (${want})"; exit 1; }

      - name: kind from the runner image
        run: kind version || { echo "::error::PIPELINE, no kind"; exit 1; }

      - name: pin pip (hash-checked)
        run: |
          python3 -m pip install --quiet --require-hashes --only-binary=:all: --break-system-packages -r .github/agent/pip-requirements.txt
          python3 -m pip --version

      - name: install the provider SDK (hash-pinned)
        run: |
          python3 -m pip install --quiet --break-system-packages --require-hashes --only-binary=:all: -r bin/persona-uat-requirements.txt

      - name: mint the federated identity token for the model provider
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const token = await core.getIDToken('https://api.anthropic.com');
            core.setSecret(token);
            const f = process.env.RUNNER_TEMP + '/anthropic-identity-token';
            fs.writeFileSync(f, token, { mode: 0o600 });
            // Print ONLY the identity claims the Anthropic federation rule matches on (never the token, which stays masked): a token-exchange 401 is then diagnosable.
            try {
              const payload = JSON.parse(Buffer.from(token.split('.')[1], 'base64url').toString('utf8'));
              const claims = {};
              for (const k of ['sub', 'aud', 'ref', 'job_workflow_ref', 'environment', 'repository', 'repository_owner_id', 'event_name', 'iss']) {
                claims[k] = payload[k];
              }
              core.info('OIDC identity claims (federation-rule inputs): ' + JSON.stringify(claims));
            } catch (e) {
              core.warning('could not decode OIDC claims for logging');
            }

      - name: keep the identity token fresh for the whole job (a detached refresher)
        # The assertion lives about five minutes, the job up to two hours and every model call is a NEW process. A timer inside
        # actions/github-script dies with its step, so this is a process of its own: detached (nohup, output redirected, disowned),
        # it re-mints from the runner's OIDC endpoint into the same 0600 file until the file is removed by the last step.
        run: |
          set -euo pipefail
          f="${RUNNER_TEMP}/anthropic-identity-token"
          [ -f "$f" ] || { echo "::error::the identity token file does not exist yet: mint it first"; exit 1; }
          nohup bash -c '
            f="$1"; every="$2"
            while [ -e "$f" ] && sleep "$every"; do
              [ -e "$f" ] || break
              python3 bin/persona-uat.py --mint-identity "$f" || { [ "$?" -eq 3 ] && break; continue; }
            done
          ' identity-refresher "$f" "${PERSONA_UAT_REFRESH_SECONDS:-60}" </dev/null >/dev/null 2>&1 &
          disown

      - name: run the three release-candidate personas against Build's image on the local registry
        env:
          PERSONA_UAT_MODEL: ${{ secrets.PERSONA_UAT_MODEL }}
          PERSONA_UAT_COMPLIANCE_MODEL: ${{ secrets.PERSONA_UAT_COMPLIANCE_MODEL }}
          PERSONA_UAT_TOKEN_BUDGET: ${{ vars.PERSONA_UAT_TOKEN_BUDGET }}
          ANTHROPIC_FEDERATION_RULE_ID: ${{ secrets.ANTHROPIC_FEDERATION_RULE_ID }}
          ANTHROPIC_ORGANIZATION_ID: ${{ secrets.ANTHROPIC_ORGANIZATION_ID }}
          ANTHROPIC_SERVICE_ACCOUNT_ID: ${{ secrets.ANTHROPIC_SERVICE_ACCOUNT_ID }}
          ANTHROPIC_WORKSPACE_ID: ${{ secrets.ANTHROPIC_WORKSPACE_ID }}
          ANTHROPIC_IDENTITY_TOKEN_FILE: ${{ runner.temp }}/anthropic-identity-token
          PERSONA_UAT_IMAGE: localhost:5000/cache@${{ fromJSON(needs.build.outputs.digests)['image-production'] }}
        run: python3 bin/persona-uat.py --mode rc --image "$PERSONA_UAT_IMAGE" --repo . --out persona-uat-out --tools bin/persona-uat-tools.json --recipient bin/persona-uat-recipient.pem --agent "python3 bin/persona-uat-agent.py" --allow-listen 5000

      - name: upload the encrypted reports and transcripts
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: persona-uat-encrypted
          path: persona-uat-out/*.cms
          if-no-files-found: error

      - name: delete the identity token file
        if: ${{ always() }}
        run: python3 bin/persona-uat.py --remove-identity "${RUNNER_TEMP}/anthropic-identity-token" || rm -f "${RUNNER_TEMP}/anthropic-identity-token" "${RUNNER_TEMP}/anthropic-identity-token.tmp"

  patch-failed:
    # Also when the release job was CANCELLED (audit ruling, Oct 22): the release job's concurrency group keeps one pending run, so a third queued tag run
    # replaces the first pending one, which ends as cancelled, not failed. failure() alone would open no issue; the issue below says to publish the tag again.
    if: ${{ always() && (contains(needs.*.result, 'failure') || needs.release.result == 'cancelled') && startsWith(github.ref, 'refs/tags/v') && github.event_name != 'workflow_dispatch' && !inputs.dry-run }}
    needs: [build, sign, rebuild, sign-rebuild, check, sign-check, release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: open the issue for the abandoned release attempt
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RELEASE_RESULT: ${{ needs.release.result }}
        run: |
          if [ "$RELEASE_RESULT" = cancelled ]; then
            gh issue create --title "auditor: release ${GITHUB_REF_NAME} cancelled" \
              --body "The release run for ${GITHUB_REF_NAME} was cancelled (replaced while pending in the release queue): it did not publish. Publish ${GITHUB_REF_NAME} again. Run: ${RUN_URL}"
          else
            gh issue create --title "auditor: release ${GITHUB_REF_NAME} failed" \
              --body "The release run for ${GITHUB_REF_NAME} failed and is abandoned (no retry). The next daily run tries again once the cause is fixed. Run: ${RUN_URL}"
          fi
# edited
# edited
