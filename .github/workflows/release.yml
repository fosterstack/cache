name: Release

# The release chain (release-chain-design.md): ONE workflow file, one job per stage step, each on its own GitHub-hosted runner (owner rule
# docs/ratify/2026-11-13-workflows-grouped-by-purpose.md; the rulings of cache#921). Build once, verify by digest, publish by digest. Every job asks for what it needs: the
# workflow-level permissions are empty. One signed record per stage (Witness, and Sign's provenance), one verification per stage on entry; subjects
# are sha256 digests emitted by the job that produced the bytes, never resolved from a registry after the fact. Tag mode is the only path that
# pushes anything, and the job release is the only path that can make anything public, and only after it has verified every earlier
# stage's record. Releases build ONLY here; nothing else builds or publishes a release.
# The jobs that sign (sign, sign-rebuild, sign-check, sign-release) are the only ones in the environment sign and the only ones that hold the identity token for the release
# key's KMS federation: the building and checking jobs hold no key, no token and no secret; their records are made under a throwaway key and trusted by nobody until a sign job checks and signs them.
#
# build-freeze -> build-apk -> build-assemble -> sign ; build-assemble -> { rebuild-apk -> rebuild-assemble } ; { build-assemble, sign } -> check (after check-govulncheck)
# { build-assemble, rebuild-assemble } -> sign-rebuild ; { build-assemble, check } -> sign-check ; { check, sign, sign-rebuild, sign-check } -> release-compare -> release-verify -> release -> sign-release
#
# In snapshot mode (workflow_call from scan.yml and main-candidate-rescan.yml) only Build and Rebuild run: the gate G starts Build, and every job that signs, publishes, checks or holds a
# write or an identity token is guarded off (guard S, and inputs.mode != 'snapshot' on the others).

on:
  push:
    tags:
      - "v*"
  # The dry run of the chain: a manual run on a branch; Build stops at admission (a branch is refused); it neither tags nor publishes.
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'run the chain graph on a branch (no tag, no publish)'
        type: boolean
        default: false
  # Called by scan.yml and main-candidate-rescan.yml in snapshot mode only (REQ-CHAIN-004-AC14); a tag push or a dispatch carries no mode input and runs as release.
  workflow_call:
    inputs:
      mode:
        description: release or snapshot
        type: string
        default: release
    outputs:
      digests:
        description: the digests.json text Build wrote
        value: ${{ jobs.build-assemble.outputs.digests }}

permissions: {}

jobs:
  # ---------------------------------------------------------------------------------------------------------------
  # Build (REQ-CHAIN-004). The gate G is on build-freeze only; the rest of Build and Rebuild run through needs.

  build-freeze:
    if: ${{ (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || inputs.dry-run == true || inputs.mode == 'snapshot' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: the mode is release or snapshot
        env:
          MODE: ${{ inputs.mode || 'release' }}
        run: bash bin/build-stage-refuse-mode.sh "$MODE"
      - name: install Go (pinned by checksum)
        if: ${{ inputs.mode != 'snapshot' }}
        run: bash bin/install-scanner.sh go
      - name: the freeze check of every baseline file
        if: ${{ inputs.mode != 'snapshot' }}
        run: bash bin/build-freeze.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ inputs.mode != 'snapshot' }}
        with:
          name: freeze
          path: freeze

  # the apk legs: one job, a matrix over the two native runners
  build-apk:
    needs: build-freeze
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    permissions:
      contents: read
      checks: read
      statuses: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: the mode is release or snapshot
        env:
          MODE: ${{ inputs.mode || 'release' }}
        run: bash bin/build-stage-refuse-mode.sh "$MODE"
      - name: install Witness (pinned by checksum)
        run: bash bin/install-scanner.sh witness
      - name: install Go (pinned by checksum)
        run: bash bin/install-scanner.sh go
      - name: install melange (pinned by checksum)
        run: bash bin/install-build-tools.sh melange
      - name: install crane (pinned by checksum)
        run: bash bin/install-scanner.sh crane
      - name: pull the archive by its committed digest
        run: bash bin/archive-pull.sh --pointer build/archive.json --out archive
      - name: unpack the host tools from the archive (bubblewrap for melange's runner)
        run: python3 -I bin/install-host-bwrap.py --archive archive --lock build/locks/host-tools.lock --root host-tools
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: ${{ inputs.mode != 'snapshot' }}
        with:
          name: freeze
          path: freeze
      - name: apk under Witness
        if: ${{ inputs.mode != 'snapshot' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash bin/witnessed-local.sh apk bin/build-stage-apk.sh
      - name: snapshot-apk under Witness
        if: ${{ inputs.mode == 'snapshot' }}
        run: bash bin/witnessed-local.sh snapshot-apk bin/build-stage-snapshot-apk.sh
      - name: sandbox wall probe
        run: bash bin/chain-sandbox-probe.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: apk-${{ matrix.runner }}
          path: out
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: witness-apk-${{ matrix.runner }}
          path: witness-apk
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ inputs.mode != 'snapshot' && matrix.runner == 'ubuntu-24.04' }}
        with:
          name: admission
          path: admission.json

  build-assemble:
    needs: build-apk
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      digests: ${{ steps.digests.outputs.digests }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: the mode is release or snapshot
        env:
          MODE: ${{ inputs.mode || 'release' }}
        run: bash bin/build-stage-refuse-mode.sh "$MODE"
      - name: install Witness (pinned by checksum)
        run: bash bin/install-scanner.sh witness
      - name: install apko (pinned by checksum)
        run: bash bin/install-build-tools.sh apko
      - name: install crane (pinned by checksum)
        run: bash bin/install-scanner.sh crane
      - name: pull the archive by its committed digest
        run: bash bin/archive-pull.sh --pointer build/archive.json --out archive
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: apk-ubuntu-24.04
          path: apk/ubuntu-24.04
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: apk-ubuntu-24.04-arm
          path: apk/ubuntu-24.04-arm
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: witness-apk-ubuntu-24.04
          path: rec-apk/ubuntu-24.04
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: witness-apk-ubuntu-24.04-arm
          path: rec-apk/ubuntu-24.04-arm
      - name: build under Witness
        if: ${{ inputs.mode != 'snapshot' }}
        run: bash bin/witnessed-local.sh build bin/build-stage-assemble.sh
      - name: snapshot-build under Witness
        if: ${{ inputs.mode == 'snapshot' }}
        run: bash bin/witnessed-local.sh snapshot-build bin/build-stage-snapshot-assemble.sh
      - id: digests
        name: expose digests.json as the job output
        run: echo "digests=$(jq -c . digests.json)" >> "$GITHUB_OUTPUT"
      - name: hostile step
        run: bash bin/chain-hostile-step.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hostile-attempts
          path: attempts
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: witness-build
          path: witness-build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests
          path: digests.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: items
          path: items.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ inputs.mode != 'snapshot' }}
        with:
          name: admission-baseline
          path: admission-baseline.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: images
          path: out

  # Sign (REQ-CHAIN-001-AC9): receives Build's records and the artifacts they name, checks them (chain-verify.py sign-records), signs the records with the release key in KMS and then the provenance.
  # The four sign jobs are the only jobs in the environment sign; each runs only on a v* tag push of release.yml itself (guard S).
  sign:
    needs: build-assemble
    if: ${{ inputs.mode != 'snapshot' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && startsWith(github.workflow_ref, format('{0}/.github/workflows/release.yml@', github.repository)) }}
    runs-on: ubuntu-24.04
    environment: sign
    permissions:
      contents: read
      id-token: write
    env:
      AWS_ROLE_ARN: arn:aws:iam::821302803867:role/fosterstack-cache-release-signing
      AWS_REGION: us-east-1
      RELEASE_KMS_KEY_REF: awskms:///alias/fosterstack-release-signing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: witness-build
          path: witness-build
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: digests
          path: witness-build
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: items
          path: witness-build
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: admission-baseline
          path: witness-build
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: witness-apk-ubuntu-24.04
          path: witness-apk-ubuntu-24.04
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: witness-apk-ubuntu-24.04-arm
          path: witness-apk-ubuntu-24.04-arm
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: images
          path: artifacts/witness-build/out
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: artifacts/witness-build/dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: apk-ubuntu-24.04
          path: artifacts/witness-apk-ubuntu-24.04/out
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: apk-ubuntu-24.04-arm
          path: artifacts/witness-apk-ubuntu-24.04-arm/out
      - name: install the aws CLI (pinned by checksum)
        run: bash bin/install-scanner.sh aws-cli
      - name: write Build's digest list to a file
        env:
          DIGESTS: ${{ needs.build-assemble.outputs.digests }}
        run: printf '%s' "$DIGESTS" > digests.json
      - name: check Build's records against the artifacts, then sign them
        run: env -u ACTIONS_ID_TOKEN_REQUEST_TOKEN -u ACTIONS_ID_TOKEN_REQUEST_URL python3 -I -B bin/chain-verify.py sign-records --stage build --template .github/policy/release-policy.template.json --digests digests.json --artifacts-dir artifacts --out staged --record-dir witness-build --record-dir witness-apk-ubuntu-24.04 --record-dir witness-apk-ubuntu-24.04-arm
      - name: sign the staged records and check each signed one
        run: bash bin/witness-sign-staged.sh staged signed
      - name: check Build's record and the digests, then sign the provenance
        run: bash bin/with-aws-token.sh sign --check --signer cosign --digests digests.json --items witness-build/items.json --build-record signed/witness-build/build-collection.json --template .github/policy/release-policy.template.json --out provenance
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: provenance
          path: provenance
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signed-witness-build
          path: signed/witness-build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signed-witness-apk-ubuntu-24.04
          path: signed/witness-apk-ubuntu-24.04
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signed-witness-apk-ubuntu-24.04-arm
          path: signed/witness-apk-ubuntu-24.04-arm

  # Rebuild (REQ-CHAIN-005): fresh runners rebuild everything Build built and compare every item; its only output is the verdict. The apk legs are one job, a matrix over the two native runners.
  # It carries no if and needs Build only, so it also runs in snapshot mode, where every sign job is skipped.
  rebuild-apk:
    needs: build-assemble
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: the mode is release or snapshot
        env:
          MODE: ${{ inputs.mode || 'release' }}
        run: bash bin/build-stage-refuse-mode.sh "$MODE"
      - name: install Witness (pinned by checksum)
        run: bash bin/install-scanner.sh witness
      - name: install Go (pinned by checksum)
        run: bash bin/install-scanner.sh go
      - name: install melange (pinned by checksum)
        run: bash bin/install-build-tools.sh melange
      - name: install crane (pinned by checksum)
        run: bash bin/install-scanner.sh crane
      - name: pull the archive by its committed digest
        run: bash bin/archive-pull.sh --pointer build/archive.json --out archive
      - name: unpack the host tools from the archive (bubblewrap for melange's runner)
        run: python3 -I bin/install-host-bwrap.py --archive archive --lock build/locks/host-tools.lock --root host-tools
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: witness-build
          path: witness-build
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: digests
          path: build-in
      - name: rapk under Witness
        if: ${{ inputs.mode != 'snapshot' }}
        run: bash bin/witnessed-local.sh rapk bin/build-stage-rebuild-apk.sh
      - name: snapshot-rapk under Witness
        if: ${{ inputs.mode == 'snapshot' }}
        run: bash bin/witnessed-local.sh snapshot-rapk bin/build-stage-snapshot-rebuild-apk.sh
      - name: write the record digests of this apk job to a file
        if: ${{ inputs.mode != 'snapshot' }}
        run: bash bin/rebuild-records-digests.sh --rapk "${{ matrix.runner }}" witness-rapk > rebuild-records.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rapk-${{ matrix.runner }}
          path: out
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: witness-rapk-${{ matrix.runner }}
          path: witness-rapk
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ inputs.mode != 'snapshot' }}
        with:
          name: rebuild-records-${{ matrix.runner }}
          path: rebuild-records.json

  rebuild-assemble:
    needs: rebuild-apk
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      records: ${{ steps.records.outputs.records }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: the mode is release or snapshot
        env:
          MODE: ${{ inputs.mode || 'release' }}
        run: bash bin/build-stage-refuse-mode.sh "$MODE"
      - name: install Witness (pinned by checksum)
        run: bash bin/install-scanner.sh witness
      - name: install apko (pinned by checksum)
        run: bash bin/install-build-tools.sh apko
      - name: install crane (pinned by checksum)
        run: bash bin/install-scanner.sh crane
      - name: pull the archive by its committed digest
        run: bash bin/archive-pull.sh --pointer build/archive.json --out archive
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: witness-build
          path: witness-build
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: digests
          path: build-in
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: items
          path: build-in
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rapk-ubuntu-24.04
          path: rapk/ubuntu-24.04
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rapk-ubuntu-24.04-arm
          path: rapk/ubuntu-24.04-arm
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: witness-rapk-ubuntu-24.04
          path: rec-rapk/ubuntu-24.04
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: witness-rapk-ubuntu-24.04-arm
          path: rec-rapk/ubuntu-24.04-arm
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: ${{ inputs.mode != 'snapshot' }}
        with:
          name: rebuild-records-ubuntu-24.04
          path: rec-digests/ubuntu-24.04
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: ${{ inputs.mode != 'snapshot' }}
        with:
          name: rebuild-records-ubuntu-24.04-arm
          path: rec-digests/ubuntu-24.04-arm
      - name: check the rapk records against the digest lists their jobs uploaded
        if: ${{ inputs.mode != 'snapshot' }}
        run: bash bin/rebuild-records-digests.sh --check "$(cat rec-digests/ubuntu-24.04/rebuild-records.json)" "$(cat rec-digests/ubuntu-24.04-arm/rebuild-records.json)"
      - name: rebuild under Witness
        if: ${{ inputs.mode != 'snapshot' }}
        run: bash bin/witnessed-local.sh rebuild bin/build-stage-rebuild-assemble.sh
      - name: snapshot-rebuild under Witness
        if: ${{ inputs.mode == 'snapshot' }}
        run: bash bin/witnessed-local.sh snapshot-rebuild bin/build-stage-snapshot-rebuild-assemble.sh
      - id: records
        name: expose the record digests as the job output
        if: ${{ inputs.mode != 'snapshot' }}
        run: r=$(bash bin/rebuild-records-digests.sh witness-rebuild rec-rapk/ubuntu-24.04 rec-rapk/ubuntu-24.04-arm) && echo "records=$r" >> "$GITHUB_OUTPUT"
      # always(): the verdict (snapshot-verdict.json in snapshot mode) is the only place the per-image digests and the differing items are readable, failed comparison or not
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: witness-rebuild
          path: witness-rebuild

  # Sign's second job: checks and signs Rebuild's records; it receives no Rebuild apk or image (Rebuild's outputs never reach a job that signs).
  sign-rebuild:
    needs: [build-assemble, rebuild-assemble]
    if: ${{ inputs.mode != 'snapshot' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && startsWith(github.workflow_ref, format('{0}/.github/workflows/release.yml@', github.repository)) }}
    runs-on: ubuntu-24.04
    environment: sign
    permissions:
      contents: read
      id-token: write
    env:
      AWS_ROLE_ARN: arn:aws:iam::821302803867:role/fosterstack-cache-release-signing
      AWS_REGION: us-east-1
      RELEASE_KMS_KEY_REF: awskms:///alias/fosterstack-release-signing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: witness-rapk-ubuntu-24.04
          path: witness-rapk-ubuntu-24.04
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: witness-rapk-ubuntu-24.04-arm
          path: witness-rapk-ubuntu-24.04-arm
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: witness-rebuild
          path: witness-rebuild
      - name: install the aws CLI (pinned by checksum)
        run: bash bin/install-scanner.sh aws-cli
      - name: write Build's digest list to a file
        env:
          DIGESTS: ${{ needs.build-assemble.outputs.digests }}
        run: printf '%s' "$DIGESTS" > digests.json
      - name: write Rebuild's record digests to a file
        env:
          RECORDS: ${{ needs.rebuild-assemble.outputs.records }}
        run: printf '%s' "$RECORDS" > rebuild-records.json
      - name: check Rebuild's records, then sign them
        run: env -u ACTIONS_ID_TOKEN_REQUEST_TOKEN -u ACTIONS_ID_TOKEN_REQUEST_URL python3 -I -B bin/chain-verify.py sign-records --stage rebuild --template .github/policy/release-policy.template.json --digests digests.json --expect-digests rebuild-records.json --out staged --record-dir witness-rapk-ubuntu-24.04 --record-dir witness-rapk-ubuntu-24.04-arm --record-dir witness-rebuild
      - name: sign the staged records and check each signed one
        run: bash bin/witness-sign-staged.sh staged signed
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signed-witness-rapk-ubuntu-24.04
          path: signed/witness-rapk-ubuntu-24.04
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signed-witness-rapk-ubuntu-24.04-arm
          path: signed/witness-rapk-ubuntu-24.04-arm
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signed-witness-rebuild
          path: signed/witness-rebuild

  # Check (REQ-CHAIN-006): scanners, acceptance suites, the FIPS check and the customer-guide commands against the exact candidate digests. govulncheck publishes no release binary, so it is built from the committed
  # tools/govulncheck module in its own job, which holds no credential; the check job downloads it by artifact id after download-artifact's own digest check.
  check-govulncheck:
    if: ${{ inputs.mode != 'snapshot' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: install Go (pinned by checksum)
        run: bash bin/install-scanner.sh go
      - name: build govulncheck (pinned by go.sum)
        run: bash bin/install-scanner.sh govulncheck
      - name: place the built govulncheck for upload
        run: bash bin/pack-govulncheck.sh
      - id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: govulncheck
          path: govulncheck-out/govulncheck

  # One job over both chips; it holds no identity token (its records are made under a throwaway key and signed by sign-check). Its records leave as one artifact per architecture, never as job outputs.
  check:
    needs: [check-govulncheck, build-assemble, sign]
    if: ${{ inputs.mode != 'snapshot' }}
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: install Witness (pinned by checksum)
        run: bash bin/install-scanner.sh witness
      - name: install grype (pinned by checksum)
        run: bash bin/install-scanner.sh grype
      - name: install osv-scanner (pinned by checksum)
        run: bash bin/install-scanner.sh osv-scanner
      - name: install Go (pinned by checksum)
        run: bash bin/install-scanner.sh go
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.check-govulncheck.outputs.artifact-id }}
          path: govulncheck-dl
      - name: install govulncheck from its build job (its download was digest-checked)
        run: bash bin/unpack-govulncheck.sh
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: signed-witness-build
          path: witness-build
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: digests
          path: witness-build
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: images
          path: images
      - name: scanners under Witness
        run: bash bin/witnessed-local.sh scanners bin/check-phase.sh scanners
      - name: acceptance under Witness
        run: bash bin/witnessed-local.sh acceptance bin/check-phase.sh acceptance
      - name: runtime under Witness
        run: bash bin/witnessed-local.sh runtime bin/check-phase.sh runtime
      - name: write the record digests of this job to a file
        run: bash bin/check-records-digests.sh witness-scanners witness-acceptance witness-runtime > check-records.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: witness-check-${{ matrix.runner }}
          path: |-
            witness-scanners
            witness-acceptance
            witness-runtime
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: check-results-${{ matrix.runner }}
          path: check-results
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: check-records-${{ matrix.runner }}
          path: check-records.json

  # Sign's third job: checks and signs the records of the Check jobs against the results they name and the digest lists they uploaded; it receives nothing built by them.
  sign-check:
    needs: [build-assemble, check]
    if: ${{ inputs.mode != 'snapshot' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && startsWith(github.workflow_ref, format('{0}/.github/workflows/release.yml@', github.repository)) }}
    runs-on: ubuntu-24.04
    environment: sign
    permissions:
      contents: read
      id-token: write
    env:
      AWS_ROLE_ARN: arn:aws:iam::821302803867:role/fosterstack-cache-release-signing
      AWS_REGION: us-east-1
      RELEASE_KMS_KEY_REF: awskms:///alias/fosterstack-release-signing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: witness-check-ubuntu-24.04
          path: rec-check/ubuntu-24.04
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: witness-check-ubuntu-24.04-arm
          path: rec-check/ubuntu-24.04-arm
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: check-results-ubuntu-24.04
          path: artifacts/check-results-ubuntu-24.04
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: check-results-ubuntu-24.04-arm
          path: artifacts/check-results-ubuntu-24.04-arm
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: check-records-ubuntu-24.04
          path: rec-digests/ubuntu-24.04
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: check-records-ubuntu-24.04-arm
          path: rec-digests/ubuntu-24.04-arm
      - name: install the aws CLI (pinned by checksum)
        run: bash bin/install-scanner.sh aws-cli
      - name: write Build's digest list to a file
        env:
          DIGESTS: ${{ needs.build-assemble.outputs.digests }}
        run: printf '%s' "$DIGESTS" > digests.json
      - name: check Check's records against the results, then sign them
        run: env -u ACTIONS_ID_TOKEN_REQUEST_TOKEN -u ACTIONS_ID_TOKEN_REQUEST_URL python3 -I -B bin/chain-verify.py sign-records --stage check --template .github/policy/release-policy.template.json --digests digests.json --expect-digests rec-digests/ubuntu-24.04/check-records.json --expect-digests rec-digests/ubuntu-24.04-arm/check-records.json --artifacts-dir artifacts --out staged --record-dir rec-check/ubuntu-24.04/witness-scanners --record-dir rec-check/ubuntu-24.04/witness-acceptance --record-dir rec-check/ubuntu-24.04/witness-runtime --record-dir rec-check/ubuntu-24.04-arm/witness-scanners --record-dir rec-check/ubuntu-24.04-arm/witness-acceptance --record-dir rec-check/ubuntu-24.04-arm/witness-runtime
      - name: sign the staged records and check each signed one
        run: bash bin/witness-sign-staged.sh staged signed
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signed-witness-check-ubuntu-24.04
          path: signed/ubuntu-24.04
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signed-witness-check-ubuntu-24.04-arm
          path: signed/ubuntu-24.04-arm

  # Release (REQ-CHAIN-007). The compare job receives Build's apks and Rebuild's apks, compares them with bin/release-compare.sh and hands on one small result file. It holds contents read ONLY: no environment, no secret, no write token
  # and no identity token, so it is a plain step and not a Witness step; Rebuild's apks never reach a job that holds a credential.
  release-compare:
    needs: [check, sign, sign-rebuild, sign-check]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: apk-ubuntu-24.04
          path: apks/ubuntu-24.04
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: apk-ubuntu-24.04-arm
          path: apks/ubuntu-24.04-arm
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rapk-ubuntu-24.04
          path: rapks/ubuntu-24.04
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rapk-ubuntu-24.04-arm
          path: rapks/ubuntu-24.04-arm
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: signed-witness-rapk-ubuntu-24.04
          path: witness-rapk-ubuntu-24.04
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: signed-witness-rapk-ubuntu-24.04-arm
          path: witness-rapk-ubuntu-24.04-arm
      - name: compare Build's and Rebuild's apks
        run: bash bin/release-compare.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: apk-compare
          path: apk-compare
          if-no-files-found: error

  # contents read and nothing else: no identity token, no environment, no secret, no write token. It verifies every earlier stage's record (release-verify under the local Witness script, a throwaway key).
  # The job release needs it, so no job that holds a write token or a secret starts unless the records were verified by an earlier job.
  release-verify:
    needs: release-compare
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: install witness (pinned by checksum)
        run: bash bin/install-scanner.sh witness
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: signed-witness-build
          path: witness-build
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: digests
          path: witness-build
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: items
          path: witness-build
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: admission-baseline
          path: witness-build
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: signed-witness-rebuild
          path: witness-rebuild
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: signed-witness-check-ubuntu-24.04
          path: witness-check/ubuntu-24.04
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: signed-witness-check-ubuntu-24.04-arm
          path: witness-check/ubuntu-24.04-arm
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: check-results-ubuntu-24.04
          path: check-results/ubuntu-24.04
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: check-results-ubuntu-24.04-arm
          path: check-results/ubuntu-24.04-arm
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: provenance
          path: provenance
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: apk-compare
          path: apk-compare
      - name: release-verify under Witness (a throwaway key, no identity token)
        run: bash bin/witnessed-local.sh release-verify bin/release-verify.sh
      - name: release-verify record holds no token (REQ-CHAIN-007-AC12)
        run: python3 -I bin/chain-verify.py record-env --record witness-release-verify/release-verify-collection.local.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: witness-release-verify
          path: witness-release-verify
          if-no-files-found: error

  # The only job that makes anything public: it holds a registry credential, contents write and packages write, and NO key role and no identity token (the signatures are the job sign-release's). A release candidate (a tag with a hyphen)
  # never enters this job: the guard S followed by the candidate condition is the job's own if (REQ-CHAIN-007-AC14).
  # One publication at a time: bin/release-publish.sh decides :X and :latest from the registry's tag list, so two release runs must not interleave. A queued run waits and a running one is never cancelled; GitHub keeps one pending run per group,
  # so a second queued tag run replaces the first pending one, which ends cancelled; patch-failed then opens an issue saying to publish that tag again.
  release:
    needs: [release-verify, release-compare]
    if: ${{ inputs.mode != 'snapshot' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && startsWith(github.workflow_ref, format('{0}/.github/workflows/release.yml@', github.repository)) && !contains(github.ref_name, '-') }}
    runs-on: ubuntu-24.04
    concurrency:
      group: release-publish
      cancel-in-progress: false
    environment: release
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: install witness (pinned by checksum)
        run: bash bin/install-scanner.sh witness
      - name: install cosign (pinned by checksum)
        run: bash bin/install-scanner.sh cosign
      - name: install crane (pinned by checksum)
        run: bash bin/install-scanner.sh crane
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: signed-witness-build
          path: witness-build
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: digests
          path: witness-build
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: items
          path: witness-build
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: admission-baseline
          path: witness-build
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: signed-witness-rebuild
          path: witness-rebuild
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: signed-witness-check-ubuntu-24.04
          path: witness-check/ubuntu-24.04
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: signed-witness-check-ubuntu-24.04-arm
          path: witness-check/ubuntu-24.04-arm
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: check-results-ubuntu-24.04
          path: check-results/ubuntu-24.04
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: check-results-ubuntu-24.04-arm
          path: check-results/ubuntu-24.04-arm
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: provenance
          path: provenance
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: apk-compare
          path: apk-compare
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: images
          path: images
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: apk-ubuntu-24.04
          path: apks/ubuntu-24.04
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: apk-ubuntu-24.04-arm
          path: apks/ubuntu-24.04-arm
      - name: release-verify under Witness
        run: bash bin/witnessed.sh release-verify bin/release-verify.sh
      - name: release-publish under Witness
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: bash bin/witnessed.sh release-publish bin/release-publish.sh
      - name: release-assets under Witness
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash bin/witnessed.sh release-assets bin/release-assets.sh
      - name: release-postverify under Witness
        run: bash bin/witnessed.sh release-postverify bin/release-postverify.sh
      - name: release-verify record holds no token (REQ-CHAIN-007-AC12)
        run: python3 -I bin/chain-verify.py record-env --record witness-release-verify/release-verify-collection.json
      - name: release-publish record holds no token (REQ-CHAIN-007-AC12)
        run: python3 -I bin/chain-verify.py record-env --record witness-release-publish/release-publish-collection.json
      - name: release-assets record holds no token (REQ-CHAIN-007-AC12)
        run: python3 -I bin/chain-verify.py record-env --record witness-release-assets/release-assets-collection.json
      - name: release-postverify record holds no token (REQ-CHAIN-007-AC12)
        run: python3 -I bin/chain-verify.py record-env --record witness-release-postverify/release-postverify-collection.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-evidence
          path: release-evidence
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: witness-release
          path: |-
            witness-release-verify
            witness-release-publish
            witness-release-assets
            witness-release-postverify

  # Sign's fourth job (ruling 7 of cache#921): after release publishes, it alone holds the KMS role and the registry write it needs to attach the signatures and attestations (bin/release-sign.sh) and to sign the apks
  # (bin/release-apks.sh). Release holds neither the role nor an identity token. Its if carries the release-candidate condition: a candidate signs nothing.
  sign-release:
    needs: release
    if: ${{ inputs.mode != 'snapshot' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && startsWith(github.workflow_ref, format('{0}/.github/workflows/release.yml@', github.repository)) && !contains(github.ref_name, '-') }}
    runs-on: ubuntu-24.04
    environment: sign
    permissions:
      contents: read
      id-token: write
      packages: write
    env:
      AWS_ROLE_ARN: arn:aws:iam::821302803867:role/fosterstack-cache-release-signing
      AWS_REGION: us-east-1
      RELEASE_KMS_KEY_REF: awskms:///alias/fosterstack-release-signing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: install witness (pinned by checksum)
        run: bash bin/install-scanner.sh witness
      - name: install cosign (pinned by checksum)
        run: bash bin/install-scanner.sh cosign
      - name: install crane (pinned by checksum)
        run: bash bin/install-scanner.sh crane
      - name: install the aws CLI (pinned by checksum)
        run: bash bin/install-scanner.sh aws-cli
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: signed-witness-build
          path: witness-build
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: digests
          path: witness-build
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: items
          path: witness-build
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: admission-baseline
          path: witness-build
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: signed-witness-rebuild
          path: witness-rebuild
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: signed-witness-check-ubuntu-24.04
          path: witness-check/ubuntu-24.04
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: signed-witness-check-ubuntu-24.04-arm
          path: witness-check/ubuntu-24.04-arm
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: check-results-ubuntu-24.04
          path: check-results/ubuntu-24.04
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: check-results-ubuntu-24.04-arm
          path: check-results/ubuntu-24.04-arm
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: provenance
          path: provenance
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: apk-compare
          path: apk-compare
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: images
          path: images
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: apk-ubuntu-24.04
          path: apks/ubuntu-24.04
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: apk-ubuntu-24.04-arm
          path: apks/ubuntu-24.04-arm
      - name: release-apks under Witness
        run: bash bin/witnessed.sh release-apks bin/release-apks.sh
      - name: release-sign under Witness
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: bash bin/witnessed.sh release-sign bin/release-sign.sh
      - name: release-apks record holds no token (REQ-CHAIN-007-AC12)
        run: python3 -I bin/chain-verify.py record-env --record witness-release-apks/release-apks-collection.json
      - name: release-sign record holds no token (REQ-CHAIN-007-AC12)
        run: python3 -I bin/chain-verify.py record-env --record witness-release-sign/release-sign-collection.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-evidence-signatures
          path: release-evidence
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: witness-release-signatures
          path: |-
            witness-release-apks
            witness-release-sign

  # ---------------------------------------------------------------------------------------------------------------
  # The live tests and the hostile judges stay here (they test the release); persona UAT is persona-uat.yml.
  # (REQ-SCAN-012): on a release candidate (vX.Y.Z-rcN, nothing is published) the candidate images are pushed by digest
  # from Build's artifacts to the dedicated test repositories and the page's load and removal commands run as written; the blocks that read a release or a
  # registry run in live-test-release after publishing (docs/using-our-vex.cannot-run.json). Each is in its own environment and holds the identity token for its own federations only, never the KMS role.
  live-test:
    needs: [check]
    if: ${{ inputs.mode != 'snapshot' && startsWith(github.ref, 'refs/tags/v') && contains(github.ref_name, '-rc') && !inputs.dry-run }}
    runs-on: ubuntu-latest
    concurrency:   # one live test at a time across both workflows: the sweep owns the whole test estate
      group: vex-live-test
      cancel-in-progress: false
    environment: live-test   # holds the five LIVE_TEST_* identifiers; its tag policy must admit rc and final v tags
    permissions:
      contents: read
      id-token: write
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: digests
          path: candidate
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: items
          path: candidate
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: images
          path: candidate/images
      - name: install crane, Grype and cosign (pinned by checksum)
        run: |
          set -euo pipefail
          bash bin/install-scanner.sh crane
          bash bin/install-scanner.sh cosign
          mkdir -p "$RUNNER_TEMP/tools"
          bash bin/install-scanner.sh grype "$RUNNER_TEMP/tools"
          echo "$RUNNER_TEMP/tools" >> "$GITHUB_PATH"
      - name: install docker-scout (pinned by checksum)
        run: |
          set -euo pipefail
          bash bin/install-scanner.sh docker-scout "$RUNNER_TEMP"
          mkdir -p "$HOME/.docker/cli-plugins" && install -m 0755 "$RUNNER_TEMP/docker-scout" "$HOME/.docker/cli-plugins/docker-scout"
      - name: AWS, as the live-test role (federated; the test ECR repository and live-test Inspector filters only)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.LIVE_TEST_AWS_ROLE_ARN }}
          aws-region: us-east-1
      - name: Google, as the live-test service account (federated; the test Artifact Registry repository and VEX notes)
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.LIVE_TEST_GCP_PROVIDER }}
          service_account: ${{ vars.LIVE_TEST_GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        with:
          version: '587.0.0'
      - name: the live test, every guide command as written, the fixture's finding shown before and gone after
        env:
          MODE: rc
          ECR: ${{ vars.LIVE_TEST_ECR_REPOSITORY }}
          GAR: ${{ vars.LIVE_TEST_GAR_REPOSITORY }}
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_DIR: ${{ github.workspace }}/candidate
          DH_REPO: ${{ vars.LIVE_TEST_DOCKERHUB_REPOSITORY }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TEST_USERNAME: ${{ secrets.DOCKERHUB_TEST_USERNAME }}
          DOCKERHUB_TEST_PUSH_TOKEN: ${{ secrets.DOCKERHUB_TEST_PUSH_TOKEN }}
          DOCKERHUB_SCOUT_TOKEN: ${{ secrets.DOCKERHUB_SCOUT_TOKEN }}
        run: bash bin/vex-live-run.sh run
      - name: cleanup, delete every image, live-test filter and VEX note the run created
        if: always()
        env:
          ECR: ${{ vars.LIVE_TEST_ECR_REPOSITORY }}
          GAR: ${{ vars.LIVE_TEST_GAR_REPOSITORY }}
          DH_REPO: ${{ vars.LIVE_TEST_DOCKERHUB_REPOSITORY }}
          DOCKERHUB_TEST_USERNAME: ${{ secrets.DOCKERHUB_TEST_USERNAME }}
          DOCKERHUB_TEST_PUSH_TOKEN: ${{ secrets.DOCKERHUB_TEST_PUSH_TOKEN }}
        run: bash bin/vex-live-run.sh cleanup

  # The same live test, right after the final release is published, with every command block of the page as written (including the download, digest and verify blocks).
  live-test-release:
    needs: [release]
    if: ${{ inputs.mode != 'snapshot' && startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-rc') && !inputs.dry-run }}
    runs-on: ubuntu-latest
    concurrency:   # one live test at a time across both workflows: the sweep owns the whole test estate
      group: vex-live-test
      cancel-in-progress: false
    environment: live-test   # holds the five LIVE_TEST_* identifiers; its tag policy must admit rc and final v tags
    permissions:
      contents: read
      id-token: write
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: install crane, Grype and cosign (pinned by checksum)
        run: |
          set -euo pipefail
          bash bin/install-scanner.sh crane
          bash bin/install-scanner.sh cosign
          mkdir -p "$RUNNER_TEMP/tools"
          bash bin/install-scanner.sh grype "$RUNNER_TEMP/tools"
          echo "$RUNNER_TEMP/tools" >> "$GITHUB_PATH"
      - name: install docker-scout (pinned by checksum)
        run: |
          set -euo pipefail
          bash bin/install-scanner.sh docker-scout "$RUNNER_TEMP"
          mkdir -p "$HOME/.docker/cli-plugins" && install -m 0755 "$RUNNER_TEMP/docker-scout" "$HOME/.docker/cli-plugins/docker-scout"
      - name: AWS, as the live-test role (federated; the test ECR repository and live-test Inspector filters only)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.LIVE_TEST_AWS_ROLE_ARN }}
          aws-region: us-east-1
      - name: Google, as the live-test service account (federated; the test Artifact Registry repository and VEX notes)
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.LIVE_TEST_GCP_PROVIDER }}
          service_account: ${{ vars.LIVE_TEST_GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        with:
          version: '587.0.0'
      - name: the live test, every guide command as written, the fixture's finding shown before and gone after
        env:
          MODE: release
          ECR: ${{ vars.LIVE_TEST_ECR_REPOSITORY }}
          GAR: ${{ vars.LIVE_TEST_GAR_REPOSITORY }}
          GH_TOKEN: ${{ github.token }}
          DH_REPO: ${{ vars.LIVE_TEST_DOCKERHUB_REPOSITORY }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TEST_USERNAME: ${{ secrets.DOCKERHUB_TEST_USERNAME }}
          DOCKERHUB_TEST_PUSH_TOKEN: ${{ secrets.DOCKERHUB_TEST_PUSH_TOKEN }}
          DOCKERHUB_SCOUT_TOKEN: ${{ secrets.DOCKERHUB_SCOUT_TOKEN }}
        run: bash bin/vex-live-run.sh run
      - name: cleanup, delete every image, live-test filter and VEX note the run created
        if: always()
        env:
          ECR: ${{ vars.LIVE_TEST_ECR_REPOSITORY }}
          GAR: ${{ vars.LIVE_TEST_GAR_REPOSITORY }}
          DH_REPO: ${{ vars.LIVE_TEST_DOCKERHUB_REPOSITORY }}
          DOCKERHUB_TEST_USERNAME: ${{ secrets.DOCKERHUB_TEST_USERNAME }}
          DOCKERHUB_TEST_PUSH_TOKEN: ${{ secrets.DOCKERHUB_TEST_PUSH_TOKEN }}
        run: bash bin/vex-live-run.sh cleanup

  # The hostile judges, run on a release-candidate tag push (REQ-CHAIN-001-AC5): every attempt of the hostile Build step is judged by the REAL
  # verifier against the policy made for this run's own ref, and one positive control (this run's genuine Sign output) must be
  # ACCEPTED by the same policy. The outcome of an attempt is the verifier's own exit code, captured per attempt, never a field
  # the hostile step wrote. This job only judges; it publishes nothing.
  hostile-verify:
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && contains(github.ref_name, '-rc') }}
    needs: sign
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: hostile-attempts
          path: attempts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: signed-witness-build
          path: witness-build
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: provenance
          path: provenance
      - name: make the policy for this run's own ref
        run: python3 bin/chain-verify.py policy make --template .github/policy/release-policy.template.json --ref "$GITHUB_REF" --out policy.json
      - name: attempt mint_sign_cert
        run: |
          rc=0
          python3 bin/chain-verify.py verify --stage sign --record attempts/mint_sign_cert.json --policy policy.json 2> /tmp/mint_sign_cert.err || rc=$?
          python3 bin/chain-verify.py hostile-row --attempt mint_sign_cert --exit-code "$rc" --stderr /tmp/mint_sign_cert.err --out results/mint_sign_cert.json
      - name: attempt read_sign_token
        run: |
          rc=0
          python3 bin/chain-verify.py hostile-material --kind token --file attempts/read_sign_token.txt 2> /tmp/read_sign_token.err || rc=$?
          python3 bin/chain-verify.py hostile-row --attempt read_sign_token --exit-code "$rc" --stderr /tmp/read_sign_token.err --out results/read_sign_token.json
      - name: attempt read_sign_key
        run: |
          rc=0
          python3 bin/chain-verify.py hostile-material --kind key --file attempts/read_sign_key.txt --policy policy.json 2> /tmp/read_sign_key.err || rc=$?
          python3 bin/chain-verify.py hostile-row --attempt read_sign_key --exit-code "$rc" --stderr /tmp/read_sign_key.err --out results/read_sign_key.json
      - name: attempt hand_sign_code
        run: |
          rc=0
          python3 bin/chain-verify.py check-build-record --digests attempts/hand_sign_code.json --build-record witness-build/build-collection.json --policy policy.json 2> /tmp/hand_sign_code.err || rc=$?
          python3 bin/chain-verify.py hostile-row --attempt hand_sign_code --exit-code "$rc" --stderr /tmp/hand_sign_code.err --out results/hand_sign_code.json
      - name: attempt forge_provenance
        run: |
          rc=0
          python3 bin/chain-verify.py verify --stage sign --record attempts/forge_provenance.json --policy policy.json 2> /tmp/forge_provenance.err || rc=$?
          python3 bin/chain-verify.py hostile-row --attempt forge_provenance --exit-code "$rc" --stderr /tmp/forge_provenance.err --out results/forge_provenance.json
      - name: positive control (this run's genuine Sign output must be accepted)
        run: |
          rc=0
          python3 bin/chain-verify.py verify --stage sign --record provenance/provenance.json --policy policy.json 2> /tmp/positive_control.err || rc=$?
          python3 bin/chain-verify.py hostile-row --attempt positive_control --exit-code "$rc" --stderr /tmp/positive_control.err --out results/positive_control.json
      - name: collect the rows
        run: python3 bin/chain-verify.py hostile-collect results --out hostile-results.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hostile-results
          path: hostile-results.json

  hostile-verdict:
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && contains(github.ref_name, '-rc') }}
    needs: hostile-verify
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: hostile-results
          path: hostile-results
      - name: every hostile attempt refused with its own cause, the positive control accepted
        run: python3 bin/chain-verify.py hostile-verdict hostile-results/hostile-results.json

  # Persona UAT, release-candidate leg (REQ-UAT-001-AC1, AC6): the jobs live in persona-uat.yml; this is the one call of that file, in release mode on a release-candidate tag only.
  # The persona job needs Build only, holds no registry credential and no write permission, and never the KMS role. GATE: PERSONA_UAT_ENABLED is exactly 'true' (unset = off).
  persona-uat-rc:
    needs: build-assemble
    if: ${{ inputs.mode != 'snapshot' && vars.PERSONA_UAT_ENABLED == 'true' && startsWith(github.ref, 'refs/tags/v') && contains(github.ref_name, '-rc') }}
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/persona-uat.yml
    with:
      digests: ${{ needs.build-assemble.outputs.digests }}

  patch-failed:
    # Also when the release job was CANCELLED (audit ruling, Oct 22): the release job's concurrency group keeps one pending run, so a third queued tag run
    # replaces the first pending one, which ends as cancelled, not failed. failure() alone would open no issue; the issue below says to publish the tag again.
    if: ${{ inputs.mode != 'snapshot' && always() && (contains(needs.*.result, 'failure') || needs.release.result == 'cancelled') && startsWith(github.ref, 'refs/tags/v') && github.event_name != 'workflow_dispatch' && !inputs.dry-run }}
    needs: [build-freeze, build-apk, build-assemble, sign, rebuild-apk, rebuild-assemble, sign-rebuild, check-govulncheck, check, sign-check, release-compare, release-verify, release, sign-release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: open the issue for the abandoned release attempt
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RELEASE_RESULT: ${{ needs.release.result }}
        run: |
          if [ "$RELEASE_RESULT" = cancelled ]; then
            gh issue create --title "auditor: release ${GITHUB_REF_NAME} cancelled" \
              --body "The release run for ${GITHUB_REF_NAME} was cancelled (replaced while pending in the release queue): it did not publish. Publish ${GITHUB_REF_NAME} again. Run: ${RUN_URL}"
          else
            gh issue create --title "auditor: release ${GITHUB_REF_NAME} failed" \
              --body "The release run for ${GITHUB_REF_NAME} failed and is abandoned (no retry). Publish it again once the cause is fixed. Run: ${RUN_URL}"
          fi
