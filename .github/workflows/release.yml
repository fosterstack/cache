name: Release

# Two jobs: build-and-scan builds a SNAPSHOT and scans it; publish then
# REBUILDS and pushes. The published build is not the scanned build — the
# scan verdict attaches to the commit, not to the published digests (Sep 8
# audit §2; RELEASING.md states the same gap publicly). This workflow also
# runs no tests, despite what its comments used to claim. The release-chain
# rework replaces this file stage by stage; until then, this header tells
# the truth about it. Releases build ONLY here — see RELEASING.md; this
# workflow is the only place `goreleaser release` (without --snapshot) is
# ever invoked.
on:
  push:
    tags:
      - "v*"

env:
  IMAGE_BASE: ghcr.io/fosterstack/cache
  GORELEASER_VERSION: "2.17.1"
  KO_VERSION: "0.19.1"

jobs:
  # Phase 1: build every artifact in --snapshot mode. Snapshot builds
  # never touch a real registry (ko loads images into the local Docker
  # daemon under a goreleaser.ko.local tag instead of pushing — verified
  # locally before this workflow was written), so this job can scan
  # freely with zero risk of an unscanned image reaching GHCR.
  build-and-scan:
    name: build & scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27'
          check-latest: true

      - uses: ko-build/setup-ko@61b4d1d396f5b2e7d6bb6fefdce3dc38d1a13445 # v0.10
        with:
          version: v${{ env.KO_VERSION }}

      - name: build every artifact (snapshot — no publish, nothing leaves this runner)
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: ${{ env.GORELEASER_VERSION }}
          args: release --snapshot --clean --skip=publish,announce,validate

      - name: presence check — the three image variants this release must produce
        run: |
          for tag in latest debug fips; do
            docker image inspect "goreleaser.ko.local:${tag}" >/dev/null
          done

      # The published docs tell operators to troubleshoot with
      # `--entrypoint /busybox/sh` and state that /bin/sh does not exist.
      # Both halves are asserted here, against the snapshot images, before
      # anything is published — so the claim cannot ship ahead of the fact,
      # and an upstream base change that added /bin/sh would fail the
      # release instead of silently falsifying the documentation.
      - name: debug variant must have a working shell at /busybox/sh
        run: |
          out=$(docker run --rm --entrypoint /busybox/sh goreleaser.ko.local:debug -c 'echo shell-ok')
          if [ "$out" != "shell-ok" ]; then
            echo "::error::/busybox/sh did not run in the debug image (docs/verify-images.md documents it as the entry point)" >&2
            exit 1
          fi
          if docker run --rm --entrypoint /bin/sh goreleaser.ko.local:debug -c true 2>/dev/null; then
            echo "::error::/bin/sh exists in the debug image, but the docs state it does not — update the docs or the base pin" >&2
            exit 1
          fi
          for tag in latest fips; do
            if docker run --rm --entrypoint /busybox/sh "goreleaser.ko.local:${tag}" -c true 2>/dev/null; then
              echo "::error::${tag} image has a shell at /busybox/sh — production variants must not" >&2
              exit 1
            fi
          done

      # Both scanners read the SAME VEX document (.vex/, punch list #4b), so
      # an exception is a single published claim rather than two tool-local
      # suppressions that can drift apart. No VEX statement, no exception,
      # no push — see .vex/README.md.
      #
      # Multi-scanner, asserted against every variant of the SNAPSHOT
      # build. A finding here fails the workflow and the publish job never
      # runs — but what publish pushes is a separate build of the same
      # commit, so this scan clears the source, not the published bytes.
      # The scanner set is .github/policy/scanners.json.
      - name: Trivy scan (production image)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: goreleaser.ko.local:latest
          exit-code: '1'
          severity: 'CRITICAL,HIGH,MEDIUM,LOW,UNKNOWN'
        env:
          TRIVY_VEX: ${{ github.workspace }}/.vex/fosterstack-cache.openvex.json
      - name: Trivy scan (debug image)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: goreleaser.ko.local:debug
          exit-code: '1'
          severity: 'CRITICAL,HIGH,MEDIUM,LOW,UNKNOWN'
        env:
          TRIVY_VEX: ${{ github.workspace }}/.vex/fosterstack-cache.openvex.json
      - name: Trivy scan (fips image)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: goreleaser.ko.local:fips
          exit-code: '1'
          severity: 'CRITICAL,HIGH,MEDIUM,LOW,UNKNOWN'
        env:
          TRIVY_VEX: ${{ github.workspace }}/.vex/fosterstack-cache.openvex.json

      # severity-cutoff: negligible is load-bearing, not decoration. The
      # action's DEFAULT cutoff is medium, so without this line Grype was
      # silently passing low and negligible findings that the Trivy steps
      # above (which list every severity including UNKNOWN) would block —
      # the two "independent scanners" were not holding the same bar.
      # Policy: nothing reaches the registry with a known CVE at ANY
      # severity; the only exception is a published VEX statement.
      - name: Grype scan (production image)
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: goreleaser.ko.local:latest
          fail-build: true
          only-fixed: false
          severity-cutoff: negligible
          vex: .vex/fosterstack-cache.openvex.json
      - name: Grype scan (debug image)
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: goreleaser.ko.local:debug
          fail-build: true
          only-fixed: false
          severity-cutoff: negligible
          vex: .vex/fosterstack-cache.openvex.json
      - name: Grype scan (fips image)
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: goreleaser.ko.local:fips
          fail-build: true
          only-fixed: false
          severity-cutoff: negligible
          vex: .vex/fosterstack-cache.openvex.json

      # Snyk joins the BLOCKING gate on the same terms as the others
      # (punch list #4e), not as a report-only side channel. It is here for
      # its proprietary database: roughly an eight-day lead over GHSA and
      # low overlap with Grype's feed, which is the whole point of running
      # an intentionally anti-correlated pair rather than two tools that
      # agree with each other.
      #
      # The CLI version is pinned rather than tracking `latest`: this is a
      # release gate, and an unpinned scanner is an unpinned dependency
      # that decides what ships. Deliberately one release behind the newest
      # so it has had exposure before it can block us.
      - name: install the Snyk CLI
        uses: snyk/actions/setup@9adf32b1121593767fc3c057af55b55db032dc04 # v1.0.0
        with:
          snyk-version: v1.1307.0

      # A blocking gate that silently skips is worse than no gate: it looks
      # like coverage on the dashboard and enforces nothing. If the token
      # is missing the release fails here, loudly, rather than sailing past
      # a scanner that never ran.
      - name: Snyk token must be present
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          if [ -z "${SNYK_TOKEN:-}" ]; then
            echo "::error::SNYK_TOKEN is not available to this run, so the Snyk gate cannot execute. Refusing to publish behind a scanner that did not run. Check the org-level Actions secret (visibility: public repositories)." >&2
            exit 1
          fi

      # No --severity-threshold anywhere below: the policy is that nothing
      # ships with a known CVE at ANY severity, so the default (report
      # everything) is what we want. Exceptions go through .vex/ and any
      # .snyk entry must cite the governing statement — see .vex/README.md.
      - name: Snyk Open Source (go.mod) and container scans
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          set -uo pipefail
          failed=0

          {
            echo "## Snyk scan verdicts"
            echo
            echo "Scanner: \`snyk $(snyk version 2>/dev/null | head -1)\`, org \`fosterstack-admin\`."
            echo "Policy: block on a finding at any severity; exceptions only via a published VEX statement."
            echo
          } >> "$GITHUB_STEP_SUMMARY"

          run_scan() {
            label="$1"; shift
            out=$(mktemp)
            if "$@" > "$out" 2>&1; then
              echo "### ${label} — clean" >> "$GITHUB_STEP_SUMMARY"
            else
              rc=$?
              failed=1
              echo "### ${label} — FAILED (exit ${rc})" >> "$GITHUB_STEP_SUMMARY"
            fi
            {
              echo
              echo '```'
              tail -n 60 "$out"
              echo '```'
              echo
            } >> "$GITHUB_STEP_SUMMARY"
            cat "$out"
            rm -f "$out"
          }

          run_scan "Open Source (go.mod)" \
            snyk test --org=fosterstack-admin --all-projects

          for tag in latest debug fips; do
            run_scan "Container (:${tag})" \
              snyk container test "goreleaser.ko.local:${tag}" --org=fosterstack-admin
          done

          if [ "${failed}" -ne 0 ]; then
            echo "::error::Snyk reported findings (or failed to run). Nothing is published. Fix the finding, or publish a VEX statement in .vex/ and a .snyk entry citing it." >&2
            exit 1
          fi
          echo "Snyk: all scans clean." >> "$GITHUB_STEP_SUMMARY"

  # Phase 2: only reached if every scan above was clean. Rebuilds with the
  # real tag version (this job never sees the snapshot-tagged images from
  # phase 1 — they don't leave the phase 1 runner) and is the only place
  # in this repo that pushes to GHCR.
  publish:
    name: publish
    needs: build-and-scan
    runs-on: ubuntu-latest
    permissions:
      contents: write # create/edit the GitHub release
      packages: write # push to GHCR
      id-token: write # Sigstore keyless signing + attestation OIDC
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27'
          check-latest: true

      - uses: ko-build/setup-ko@61b4d1d396f5b2e7d6bb6fefdce3dc38d1a13445 # v0.10
        with:
          version: v${{ env.KO_VERSION }}

      # cosign-release pinned explicitly: the action's own default (v3.0.6)
      # has a bug where `sign-blob` without --bundle fails with an opaque
      # "create bundle file: open : no such file or directory" instead of
      # the clean "must specify --bundle" validation error v3.1.3 gives —
      # found by reproducing the CI failure locally. Pinning to the
      # version verified locally either way.
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3

      - name: log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: build, publish images (ko), create draft GitHub release, upload binaries
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: ${{ env.GORELEASER_VERSION }}
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: resolve published image digests
        id: digests
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          for pair in "prod=${version}" "debug=${version}-debug" "fips=${version}-fips"; do
            key="${pair%%=*}"; tag="${pair#*=}"
            digest=$(docker buildx imagetools inspect "${IMAGE_BASE}:${tag}" --format '{{json .Manifest}}' | jq -r .digest)
            echo "${key}=${digest}" | tee -a "$GITHUB_OUTPUT"
          done

      - name: cosign sign images (keyless — no signing key exists to steal)
        run: |
          set -euo pipefail
          cosign sign --yes "${IMAGE_BASE}@${{ steps.digests.outputs.prod }}"
          cosign sign --yes "${IMAGE_BASE}@${{ steps.digests.outputs.debug }}"
          cosign sign --yes "${IMAGE_BASE}@${{ steps.digests.outputs.fips }}"

      - name: SLSA provenance attestation (production image)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_BASE }}
          subject-digest: ${{ steps.digests.outputs.prod }}
          push-to-registry: true
      - name: SLSA provenance attestation (debug image)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_BASE }}
          subject-digest: ${{ steps.digests.outputs.debug }}
          push-to-registry: true
      - name: SLSA provenance attestation (fips image)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_BASE }}
          subject-digest: ${{ steps.digests.outputs.fips }}
          push-to-registry: true

      # Binary/tarball materials: SBOM+provenance for the images comes
      # from ko's own --sbom=spdx (attached to the pushed image as an OCI
      # referrer) plus the attestations above; the bare-binary archives
      # need their own provenance + a signature, since ko never touches
      # them.
      - name: SLSA provenance attestation (binary archives + checksums)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "dist/*.tar.gz,dist/checksums.txt"

      # cosign v3 deprecated the separate --output-signature/
      # --output-certificate flags in favor of a single Sigstore bundle
      # file (confirmed locally against cosign v3.1.3: the old flags now
      # print a deprecation notice and, depending on patch version, either
      # hard-error or silently fail to write anything).
      - name: cosign sign checksums.txt (keyless blob signature covers every archive by hash)
        run: |
          set -euo pipefail
          cosign sign-blob --yes \
            --bundle dist/checksums.txt.bundle \
            dist/checksums.txt

      - name: upload signature material to the release
        run: gh release upload "${GITHUB_REF_NAME}" dist/checksums.txt.bundle --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The VEX ships WITH the artifacts it describes. Anyone auditing a
      # release gets our exception claims alongside the SBOM and the
      # provenance, instead of having to take a scan result on faith.
      - name: publish the VEX document with the release
        run: gh release upload "${GITHUB_REF_NAME}" .vex/fosterstack-cache.openvex.json --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Final gate: verify what was actually published, not just trust
      # that the steps above ran. This is also the exact command a
      # customer runs to verify the bytes they pulled (RELEASING.md /
      # "verify our images" doc) — proving it here is both a gate and a
      # test of the customer-facing instructions.
      - name: gh attestation verify (the pipeline's own proof, not a promise)
        run: |
          set -euo pipefail
          for digest in "${{ steps.digests.outputs.prod }}" "${{ steps.digests.outputs.debug }}" "${{ steps.digests.outputs.fips }}"; do
            gh attestation verify "oci://${IMAGE_BASE}@${digest}" --owner fosterstack
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # A release the public cannot pull is a failed release. Today that
      # fails SILENTLY: GHCR publishes new packages PRIVATE by default, and
      # the workflow is authenticated, so every step above succeeds while
      # the world gets UNAUTHORIZED. The visibility flip is one-time PER
      # PACKAGE — cache is already public, so this is not a chore on any
      # normal release — but a future new package name would walk straight
      # into it, and nobody would notice until a user complained.
      #
      # Deliberately UNAUTHENTICATED: a fresh anonymous registry token and
      # nothing else. No GITHUB_TOKEN, no docker login, no ambient
      # credential — otherwise this would prove only that WE can pull it,
      # which is exactly the bug. It runs BEFORE undrafting, so a release
      # the public cannot reach never becomes visible in the first place.
      #
      # Any non-200 fails: 401/403 means the package is not public, 404
      # means the tag is not there. Both are release failures.
      - name: verify every published tag is anonymously pullable
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          repo="${IMAGE_BASE#ghcr.io/}"

          token=$(curl -fsSL "https://ghcr.io/token?scope=repository:${repo}:pull&service=ghcr.io" | jq -r .token)
          if [ -z "${token}" ] || [ "${token}" = "null" ]; then
            echo "::error::could not obtain an anonymous pull token for ${repo}. The package is almost certainly not public — see ops runbook-ghcr.md." >&2
            exit 1
          fi

          accept='application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json'
          failed=0
          for tag in "${version}" latest "${version}-debug" debug "${version}-fips" fips; do
            code=$(curl -s -o /dev/null -w '%{http_code}' \
                     -H "Authorization: Bearer ${token}" \
                     -H "Accept: ${accept}" \
                     "https://ghcr.io/v2/${repo}/manifests/${tag}")
            if [ "${code}" = "200" ]; then
              echo "  ok        ${IMAGE_BASE}:${tag}"
            else
              echo "  NOT PUBLIC ${IMAGE_BASE}:${tag} (HTTP ${code})"
              failed=1
            fi
          done

          if [ "${failed}" -ne 0 ]; then
            echo "::error::One or more published tags are not anonymously pullable. The release is NOT public and has been left as a draft. Flip the package to public (one-time, per package) — see ops runbook-ghcr.md — then re-run this workflow." >&2
            exit 1
          fi
          echo "All published tags are anonymously pullable."

      - name: publish the release (undraft now that it's fully attested)
        run: gh release edit "${GITHUB_REF_NAME}" --draft=false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
