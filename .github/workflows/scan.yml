name: scan

# The single required "scan" status check (audit follow-up). It exists so
# a disclosed vulnerability is caught at PR time and on every push to main
# and every tag — the same policy the release chain's stage-verify applies
# at tag time, brought forward so tag day is not the first time the whole
# scanner set runs. It builds the candidate through the EXACT same build +
# image-assembly stages the release chain uses (mode: snapshot/pr), so the
# bytes scanned here are the bytes the chain would ship, then runs every
# scanner in .github/policy/scanners.json against all three OCI variants and
# every dist archive: trivy and grype scan BOTH platform children of every
# variant; snyk (its container findings arch-invariant for these images, and
# quota-limited) scans one child per variant plus the go.mod SCA. Policy is
# identical to stage-verify: block at ANY severity; the published VEX
# document is the only exception mechanism; red blocks the merge. A scanner
# that cannot be installed or run is a PIPELINE failure (red), never a
# silent clean pass (see bin/install-scanner.sh).
#
# The aggregation job at the bottom is named `scan`; that is the one
# context to add to the main-protection ruleset as a required check.

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

# The caller's grant must COVER what the reusable stages REQUEST, or the
# run is a startup_failure with zero jobs (release-chain-pr.yml learned
# this the hard way). id-token/attestations/packages are unused in
# snapshot/pr mode but must be grantable for the shared stage files. Fork
# and Dependabot events have write scopes silently downgraded to read by
# GitHub; the snapshot/pr path needs none of them, so those events still
# build and scan.
permissions:
  contents: read
  id-token: write
  attestations: write
  packages: write

jobs:
  build:
    uses: ./.github/workflows/stage-build.yml
    with:
      mode: snapshot

  assemble:
    needs: build
    uses: ./.github/workflows/stage-image.yml
    with:
      mode: pr
      dist-artifact: dist-snapshot
      expected-checksums: ${{ needs.build.outputs.checksums }}
      upload-oci: true

  scanners:
    name: read the scanner list
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.read.outputs.list }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: read
        run: echo "list=$(jq -c '.scanners' .github/policy/scanners.json)" >> "$GITHUB_OUTPUT"

  scanner:
    name: scan (${{ matrix.scanner }})
    needs: [build, assemble, scanners]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        scanner: ${{ fromJSON(needs.scanners.outputs.list) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: oci-candidate
          path: /tmp/oci/

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist-snapshot
          path: dist/

      - name: verify archives before scanning them
        env:
          EXPECTED: ${{ needs.build.outputs.checksums }}
        run: |
          set -euo pipefail
          printf '%s\n' "${EXPECTED}" > /tmp/expected-checksums.txt
          (cd dist && sha256sum -c /tmp/expected-checksums.txt --ignore-missing --strict)

      - name: install ${{ matrix.scanner }} (pinned by checksum; a scanner that can't run is a pipeline failure, not a finding)
        run: ./bin/install-scanner.sh '${{ matrix.scanner }}'

      # Load every (variant, platform) child of each OCI archive into the
      # docker daemon with skopeo. buildx writes an OCI-LAYOUT tar, which
      # trivy --input / grype oci-archive: do not read (trivy: "manifest.json
      # not found"; grype: operational exit 1). Loading each single-arch
      # child into the daemon is the format every scanner reads by ref -
      # the path the snyk leg already used.
      - name: load every variant/platform child into the docker daemon
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq skopeo
          : > /tmp/refs.txt
          for v in production debug fips; do
            for arch in amd64 arm64; do
              ref="ghcr.io/fosterstack/cache:cand-${v}-${arch}"
              skopeo copy --override-arch "${arch}" --override-os linux \
                "oci-archive:/tmp/oci/${v}.oci" "docker-daemon:${ref}"
              echo "${ref}" >> /tmp/refs.txt
            done
          done
          echo "loaded images to scan:"; cat /tmp/refs.txt

      - name: Trivy scan every loaded image and every archive
        if: matrix.scanner == 'trivy'
        env:
          TRIVY_VEX: ${{ github.workspace }}/.vex/fosterstack-cache.openvex.json
        run: |
          set -euo pipefail
          trivy image --download-db-only >/dev/null 2>&1 || true
          while read -r ref; do
            echo "trivy: ${ref}"
            trivy image --quiet --exit-code 1 \
              --severity CRITICAL,HIGH,MEDIUM,LOW,UNKNOWN \
              --vex "${TRIVY_VEX}" "${ref}"
          done < /tmp/refs.txt
          for a in dist/*.tar.gz; do
            echo "trivy rootfs archive: $a"
            tmp=$(mktemp -d); tar xzf "$a" -C "$tmp"
            trivy rootfs --quiet --exit-code 1 --severity CRITICAL,HIGH,MEDIUM,LOW,UNKNOWN --vex "${TRIVY_VEX}" "$tmp"
            rm -rf "$tmp"
          done

      - name: Grype scan every loaded image and every archive
        if: matrix.scanner == 'grype'
        run: |
          set -euo pipefail
          grype db update >/dev/null 2>&1 || true
          while read -r ref; do
            echo "grype: ${ref}"
            grype "docker:${ref}" --fail-on negligible --vex .vex/fosterstack-cache.openvex.json
          done < /tmp/refs.txt
          for a in dist/*.tar.gz; do
            echo "grype archive: $a"
            grype "file:${a}" --fail-on negligible --vex .vex/fosterstack-cache.openvex.json
          done

      - name: Snyk token must be present (a gate that silently skips is worse than none)
        if: matrix.scanner == 'snyk'
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          [ -n "${SNYK_TOKEN:-}" ] || { echo "::error::SNYK_TOKEN unavailable — a scanner that cannot run is a pipeline failure (red), not a clean pass" >&2; exit 1; }
      - name: Snyk Open Source (go.mod) + container (one child per variant; trivy/grype cover both)
        if: matrix.scanner == 'snyk'
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          set -uo pipefail
          failed=0; cantrun=0
          # A scanner that cannot RUN is a pipeline failure, never a clean pass.
          # Snyk exits 0 when it is out of monthly test quota (or unauthorized)
          # and just prints the limit message — so `|| failed=1` alone would let
          # the gate go GREEN having tested nothing. Detect that in the output
          # and force red as could-not-run, kept distinct from a finding.
          snyk_run() {
            local out rc
            out="$("$@" 2>&1)"; rc=$?
            printf '%s\n' "$out"
            if printf '%s' "$out" | grep -qiE 'reached your monthly limit|increase your tests limit|not authori[sz]ed|authentication error|re-?authenticate'; then
              cantrun=1
            elif [ "$rc" -ne 0 ]; then
              failed=1
            fi
          }
          # Snyk Open Source over the Go modules (snyk's distinctive SCA view).
          snyk_run snyk test --org=fosterstack-admin --all-projects
          # Container: the minimum this gate needs from snyk. trivy and grype
          # already scan BOTH platform children of every variant on their own
          # legs; snyk's container findings for these images are arch-invariant
          # (same base + same-toolchain Go binary), so snyk tests ONE child per
          # variant — every variant still goes through snyk's DB, at half the
          # container tests (3, not 6), which is the free-plan quota that bites.
          # Filtered into a file (not a pipe) so the flags stay in this shell.
          grep -E -- '-amd64$' /tmp/refs.txt > /tmp/snyk-refs.txt || true
          while read -r ref; do
            echo "snyk: ${ref}"
            snyk_run snyk container test "${ref}" --org=fosterstack-admin
          done < /tmp/snyk-refs.txt
          if [ "${cantrun}" -ne 0 ]; then
            echo "::error::Snyk could not run (monthly test quota exhausted or unauthorized). Per agent-remediation-rules this is a scanner-could-not-run PIPELINE failure, not a finding and not a clean pass — restore Snyk quota/auth (see the Snyk plan)." >&2
            exit 1
          fi
          if [ "${failed}" -ne 0 ]; then
            echo "::error::Snyk reported findings. Fix the finding, or publish a VEX statement in .vex/ and a .snyk entry citing it." >&2
            exit 1
          fi

  scan:
    name: scan
    needs: scanner
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: every scanner must have run and passed
        run: |
          r='${{ needs.scanner.result }}'
          echo "aggregate scanner result: ${r}"
          [ "${r}" = "success" ] || { echo "::error::one or more scanners failed, were cancelled, or were skipped (result=${r}). Per policy nothing is clean unless every scanner in scanners.json runs and passes." >&2; exit 1; }
