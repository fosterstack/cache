name: scan

# The single required "scan" status check (audit follow-up). It exists so
# a disclosed vulnerability is caught at PR time and on every push to main
# and every tag — the same policy the release chain's stage-verify applies
# at tag time, brought forward so tag day is not the first time the whole
# scanner set runs. It builds the candidate through the EXACT same build +
# image-assembly stages the release chain uses (mode: snapshot/pr), so the
# bytes scanned here are the bytes the chain would ship, then runs every
# scanner in the `pr_gate` list of .github/policy/scanners.json.
#
# Decision row 57 (supersedes row 45 for this gate): TWO scanners with
# DIFFERENT DATABASES (different aggregations, overlapping upstream
# sources) — grype (Anchore's own database) scans both platform children of
# every OCI variant AND every dist archive; Amazon Inspector scans the same
# six children (inspector-sbomgen inventories each image on the runner;
# only the SBOM goes to inspector-scan:ScanSbom). Go code: govulncheck
# (its own job), the symbol-level authority. Trivy and OSV-Scanner left
# this gate. Findings block at ANY severity with the published VEX document
# as the only exception (grype via --vex; Inspector via bin/inspector-gate.py,
# which applies the same document). A scanner that cannot be installed or
# run, or that inventories zero packages (row 53), is a PIPELINE failure
# (red), never a silent clean pass (bin/install-scanner.sh).
#
# Inspector needs no stored secret: the scanner job alone requests
# id-token: write and assumes a ScanSbom-only role by OIDC on pull requests
# (Dependabot's included), pushes to main and tags (REQ-REL-004-AC1 as
# ratified Sep 29, decision row 73; the role's trust names those subjects).
#
# The aggregation job at the bottom is named `scan`; that is the one
# context to add to the main-protection ruleset as a required check.

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

# Workflow default: read only. Each job states what it needs. The two
# reusable-stage callers (build, assemble) grant what the shared stage files
# REQUEST, or the run is a startup_failure with zero jobs
# (the former release-chain-pr.yml learned this the hard way); id-token/attestations/
# packages are unused in snapshot/pr mode. The scanner job requests
# id-token: write for the Inspector leg's role assumption. Dependabot-
# triggered runs get a read-only token that the permissions key can raise
# (GitHub docs, "Troubleshooting Dependabot on GitHub Actions"); fork
# events are downgraded and need none of this to build and scan.
permissions:
  contents: read

jobs:
  build:
    permissions:
      contents: read
      id-token: write
      attestations: write
      packages: write
    uses: ./.github/workflows/stage-build.yml
    with:
      mode: snapshot

  assemble:
    needs: build
    permissions:
      contents: read
      id-token: write
      attestations: write
      packages: write
    uses: ./.github/workflows/stage-image.yml
    with:
      mode: pr
      dist-artifact: dist-snapshot
      expected-checksums: ${{ needs.build.outputs.checksums }}
      upload-oci: true

  # ---------------------------------------------------------------------------------------------------------------
  # Merged from release-chain-pr.yml (workflow consolidation 5, owner RATIFIED Oct 2; advisor read-back 0062): the
  # PR-mode proof of the reproducibility property. One build feeds both: `assemble` above is assembly A, `assemble-b`
  # assembles the same attested binaries again in an independent job (verify only: it uploads no oci-candidate, so the
  # artifact name stays unique), and the required check `reproducibility` demands identical index digests for every
  # variant. The release relies only on release.yml's own reproducibility stage (stage-reproducibility.yml, unchanged);
  # this job is a PR/main proof and never a gate on the tag chain.
  assemble-b:
    needs: build
    permissions:
      contents: read
      id-token: write
      attestations: write
      packages: write
    uses: ./.github/workflows/stage-image.yml
    with:
      mode: pr
      dist-artifact: dist-snapshot
      expected-checksums: ${{ needs.build.outputs.checksums }}

  artifact-acceptance:
    needs: build
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/stage-acceptance-artifacts.yml
    with:
      dist-artifact: dist-snapshot
      expected-checksums: ${{ needs.build.outputs.checksums }}

  reproducibility:
    name: reproducibility
    needs: [assemble, assemble-b]
    runs-on: ubuntu-latest
    steps:
      - name: two independent assemblies must agree, digest for digest
        run: |
          set -euo pipefail
          a='${{ needs.assemble.outputs.digests }}'
          b='${{ needs.assemble-b.outputs.digests }}'
          echo "assembly A: $a"
          echo "assembly B: $b"
          for v in production debug fips; do
            da=$(jq -r --arg v "$v" '.[$v]' <<<"$a")
            db=$(jq -r --arg v "$v" '.[$v]' <<<"$b")
            if [ -z "$da" ] || [ "$da" = "null" ]; then
              echo "::error::assembly A produced no digest for ${v}" >&2; exit 1
            fi
            if [ "$da" != "$db" ]; then
              echo "::error::${v} is NOT reproducible: ${da} vs ${db}" >&2; exit 1
            fi
            echo "${v}: reproducible at ${da}"
          done

  scanners:
    name: read the scanner list
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.read.outputs.list }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: read
        run: echo "list=$(jq -c '.pr_gate' .github/policy/scanners.json)" >> "$GITHUB_OUTPUT"

  scanner:
    name: scan (${{ matrix.scanner }})
    needs: [build, assemble, scanners]
    runs-on: ubuntu-latest
    # id-token: write is for the Inspector leg's role assumption and is the
    # only place in this workflow's own jobs that requests it.
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        scanner: ${{ fromJSON(needs.scanners.outputs.list) }}
    env:
      INSPECTOR_ROLE: arn:aws:iam::821302803867:role/fosterstack-cache-inspector-scan
      INSPECTOR_REGION: us-east-1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Both gate scanners read the OCI images; only grype scans the
      # release archives. So: the image download + daemon load run for
      # both; the archive download + verify run for grype only.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: oci-candidate
          path: /tmp/oci/

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: matrix.scanner == 'grype'
        with:
          name: dist-snapshot
          path: dist/

      - name: verify archives before scanning them
        if: matrix.scanner == 'grype'
        env:
          EXPECTED: ${{ needs.build.outputs.checksums }}
        run: |
          set -euo pipefail
          printf '%s\n' "${EXPECTED}" > /tmp/expected-checksums.txt
          (cd dist && sha256sum -c /tmp/expected-checksums.txt --ignore-missing --strict)

      - name: install ${{ matrix.scanner }} (pinned by checksum; a scanner that can't run is a pipeline failure, not a finding)
        run: ./bin/install-scanner.sh '${{ matrix.scanner == 'inspector' && 'inspector-sbomgen' || matrix.scanner }}'

      # Load every (variant, platform) child into the docker daemon. buildx
      # writes an OCI-layout tar the scanners do not read directly, so each
      # single-arch child is loaded by ref. Both gate scanners scan these
      # six children by ref.
      - name: load every variant/platform child into the docker daemon
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq skopeo
          : > /tmp/refs.txt
          for v in production debug fips; do
            for arch in amd64 arm64; do
              ref="ghcr.io/fosterstack/cache:cand-${v}-${arch}"
              skopeo copy --override-arch "${arch}" --override-os linux \
                "oci-archive:/tmp/oci/${v}.oci" "docker-daemon:${ref}"
              echo "${ref}" >> /tmp/refs.txt
            done
          done
          echo "loaded images to scan:"; cat /tmp/refs.txt

      - name: Grype scan every loaded image and every archive
        if: matrix.scanner == 'grype'
        run: |
          set -euo pipefail
          grype db update >/dev/null 2>&1 || true
          echo "## Grype" >> "$GITHUB_STEP_SUMMARY"
          # bin/grype-scan.sh: one pass per target, counts, VEX, zero packages = red.
          g() { ./bin/grype-scan.sh "$1" "$2"; }
          while read -r ref; do g "docker:${ref}" "${ref##*:}"; done < /tmp/refs.txt
          for a in dist/*.tar.gz; do g "file:${a}" "${a#dist/}"; done

      - name: Amazon Inspector — assume the ScanSbom-only role (OIDC; no stored secret)
        if: matrix.scanner == 'inspector'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ env.INSPECTOR_ROLE }}
          aws-region: ${{ env.INSPECTOR_REGION }}
          role-session-name: cache-pr-scan-${{ github.run_id }}

      # Same-day reuse of Amazon Inspector results (REQ-REL-004-AC5): keyed by the SBOM's package inventory (bin/inspector-reuse.py),
      # stored in the Actions cache, one entry per UTC day per run. The restore key never matches exactly, so restore-keys
      # picks the newest same-day entry; a run that only reused saves nothing. Same-repo runs only (no fork reads or writes).
      - name: Amazon Inspector - today's date (UTC) for the same-day reuse
        id: insp-date
        if: matrix.scanner == 'inspector'
        run: echo "date=$(date -u +%F)" >> "$GITHUB_OUTPUT"
      - name: Amazon Inspector - restore today's results (same-repo runs only)
        if: matrix.scanner == 'inspector' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/inspector-cache
          key: inspector-${{ steps.insp-date.outputs.date }}-${{ github.run_id }}-miss
          restore-keys: inspector-${{ steps.insp-date.outputs.date }}-

      - name: Amazon Inspector scan every loaded image
        id: insp-scan
        if: matrix.scanner == 'inspector'
        run: |
          set +e -uo pipefail   # the runner starts bash with -e; every image must be scanned before the verdict
          # inspector-sbomgen inventories each child on the runner; only the
          # SBOM leaves the runner. bin/inspector-reuse.py keys the inventory
          # (package names and versions only): an inventory Inspector already
          # scanned today (an earlier image of this run, or the day's cache)
          # is reused, anything else calls ScanSbom once and stores the answer
          # (REQ-REL-004-AC5). bin/inspector-gate.py prints the package count,
          # applies the published VEX to the findings, reused or fresh, and
          # returns 0 clean / 1 findings / 2 did not run.
          mkdir -p /tmp/insp /tmp/inspector-cache; rc=0; sent=0; stored=0; reused=0
          # the UTC day is read from the clock at each decision (never once per run); a fresh answer is cached only if the
          # clock still reads that day when it arrives (UTC midnight during the call: used this run, not cached)
          echo "## Amazon Inspector" >> "$GITHUB_STEP_SUMMARY"
          while read -r ref; do
            tag="${ref##*:}"
            if ! inspector-sbomgen container --image "${ref}" --outfile "/tmp/insp/${tag}.sbom.json" --disable-progress-bar; then
              echo "::error::inspector-sbomgen could not inventory ${ref} — did not run, not a clean pass" >&2; rc=2; continue
            fi
            key=$(python3 bin/inspector-reuse.py key "/tmp/insp/${tag}.sbom.json") || { echo "::error::no inventory key for ${ref} — did not run, not a clean pass" >&2; rc=2; continue; }
            day=$(date -u +%F)
            verdict=$(python3 bin/inspector-reuse.py decide /tmp/inspector-cache "${day}" "/tmp/insp/${tag}.sbom.json") || verdict=call
            if [ "${verdict%%$'\n'*}" = reuse ] && cp "${verdict#*$'\n'}" "/tmp/insp/${key}.findings.json"; then
              reused=$((reused+1))
            else
              rm -f "/tmp/insp/${key}.findings.json"
              aws inspector-scan scan-sbom --sbom "file:///tmp/insp/${tag}.sbom.json" --output-format CYCLONE_DX_1_5 \
                > "/tmp/insp/${key}.findings.json" || { echo "::error::inspector-scan:ScanSbom failed for ${ref} — did not run, not a clean pass" >&2; rm -f "/tmp/insp/${key}.findings.json"; rc=2; continue; }
              if ! python3 bin/inspector-reuse.py validate "/tmp/insp/${tag}.sbom.json" "/tmp/insp/${key}.findings.json"; then
                echo "::error::the ScanSbom answer for ${ref} is not the response for this image's inventory — did not run, not a clean pass" >&2; rm -f "/tmp/insp/${key}.findings.json"; rc=2; continue
              fi
              sent=$((sent+1))
              if [ "$(date -u +%F)" != "${day}" ]; then
                echo "::notice::UTC midnight passed during the ScanSbom call for ${ref}: its answer is used this run and not cached" >&2
              elif python3 bin/inspector-reuse.py store /tmp/inspector-cache "${day}" "/tmp/insp/${tag}.sbom.json" "/tmp/insp/${key}.findings.json"; then
                stored=$((stored+1))
              else
                echo "::warning::the validated ScanSbom answer for ${ref} could not be cached" >&2
              fi
            fi
            out=$(python3 bin/inspector-gate.py "${tag}" "/tmp/insp/${tag}.sbom.json" "/tmp/insp/${key}.findings.json" .vex/fosterstack-cache.openvex.json) && c=0 || c=$?
            echo "${out}"; echo "- ${out%%$'\n'*}" >> "$GITHUB_STEP_SUMMARY"
            [ "$c" -gt "$rc" ] && rc=$c
          done < /tmp/refs.txt
          echo "fresh=${stored}" >> "$GITHUB_OUTPUT"
          echo "- SBOMs assessed: ${sent} sent to Inspector, ${reused} reused (same inventory, same UTC day)" >> "$GITHUB_STEP_SUMMARY"
          if [ "$rc" -eq 1 ]; then
            echo "::error::Amazon Inspector found vulnerabilities. Fix the dependency, or publish a VEX statement via the audit-lane review." >&2
          elif [ "$rc" -ge 2 ]; then
            echo "::error::Amazon Inspector did not run on every image — a pipeline failure, not a finding and not a clean pass." >&2
          fi
          exit "$rc"

      - name: Amazon Inspector - the UTC day at save time
        id: insp-save-day
        if: always() && matrix.scanner == 'inspector'
        run: echo "date=$(date -u +%F)" >> "$GITHUB_OUTPUT"
      - name: Amazon Inspector - save today's new results (only when this run made some; same-repo runs only)
        if: always() && matrix.scanner == 'inspector' && steps.insp-scan.outputs.fresh != '' && steps.insp-scan.outputs.fresh != '0' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/inspector-cache
          key: inspector-${{ steps.insp-save-day.outputs.date }}-${{ github.run_id }}

      # The SBOMs and the raw ScanSbom responses, as evidence of what was
      # inventoried and what came back (kept even when the leg is red).
      - name: keep the Inspector SBOMs and responses
        if: always() && matrix.scanner == 'inspector'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: inspector-evidence
          path: /tmp/insp/
          if-no-files-found: warn
          retention-days: 30

  scan:
    name: scan
    needs: scanner
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: every scanner must have run and passed
        run: |
          r='${{ needs.scanner.result }}'
          echo "aggregate scanner result: ${r}"
          [ "${r}" = "success" ] || { echo "::error::one or more scanners failed, were cancelled, or were skipped (result=${r}). Per policy nothing is clean unless every scanner in the pr_gate list of scanners.json runs and passes." >&2; exit 1; }
