name: scan

# The single required "scan" status check (audit follow-up). It exists so
# a disclosed vulnerability is caught at PR time and on every push to main
# and every tag — the same policy the release chain's stage-verify applies
# at tag time, brought forward so tag day is not the first time the whole
# scanner set runs. It builds the candidate through the EXACT same build +
# image-assembly stages the release chain uses (mode: snapshot/pr), so the
# bytes scanned here are the bytes the chain would ship, then runs every
# scanner in .github/policy/scanners.json. Decision row 45: the CI gate is
# TWO scanners with DIFFERENT DATABASES (different aggregations, overlapping
# upstream sources) — grype (Anchore's own DB) scans both platform children
# of every OCI variant AND every dist archive; osv-scanner (OSV.dev via
# osv-scalibr) scans the three variants on both architectures (six children)
# AND the Go modules. Findings block at ANY severity with the published VEX
# document as grype's only exception; a scanner that cannot be installed or
# run is a PIPELINE failure (red), never a silent clean pass (see
# bin/install-scanner.sh). Trivy left this gate (row 45) for the daily
# main-candidate rescan; Snyk (row 44) runs there too.
#
# The aggregation job at the bottom is named `scan`; that is the one
# context to add to the main-protection ruleset as a required check.

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

# The caller's grant must COVER what the reusable stages REQUEST, or the
# run is a startup_failure with zero jobs (release-chain-pr.yml learned
# this the hard way). id-token/attestations/packages are unused in
# snapshot/pr mode but must be grantable for the shared stage files. Fork
# and Dependabot events have write scopes silently downgraded to read by
# GitHub; the snapshot/pr path needs none of them, so those events still
# build and scan.
permissions:
  contents: read
  id-token: write
  attestations: write
  packages: write

jobs:
  build:
    uses: ./.github/workflows/stage-build.yml
    with:
      mode: snapshot

  assemble:
    needs: build
    uses: ./.github/workflows/stage-image.yml
    with:
      mode: pr
      dist-artifact: dist-snapshot
      expected-checksums: ${{ needs.build.outputs.checksums }}
      upload-oci: true

  scanners:
    name: read the scanner list
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.read.outputs.list }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: read
        run: echo "list=$(jq -c '.scanners' .github/policy/scanners.json)" >> "$GITHUB_OUTPUT"

  scanner:
    name: scan (${{ matrix.scanner }})
    needs: [build, assemble, scanners]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        scanner: ${{ fromJSON(needs.scanners.outputs.list) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Both gate scanners read the OCI images; only grype scans the
      # release archives. osv-scanner also scans the Go modules from the
      # checkout. So: the image download + daemon load run for both; the
      # archive download + verify run for grype only.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: oci-candidate
          path: /tmp/oci/

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: matrix.scanner == 'grype'
        with:
          name: dist-snapshot
          path: dist/

      - name: verify archives before scanning them
        if: matrix.scanner == 'grype'
        env:
          EXPECTED: ${{ needs.build.outputs.checksums }}
        run: |
          set -euo pipefail
          printf '%s\n' "${EXPECTED}" > /tmp/expected-checksums.txt
          (cd dist && sha256sum -c /tmp/expected-checksums.txt --ignore-missing --strict)

      - name: install ${{ matrix.scanner }} (pinned by checksum; a scanner that can't run is a pipeline failure, not a finding)
        run: ./bin/install-scanner.sh '${{ matrix.scanner }}'

      # Load every (variant, platform) child into the docker daemon. buildx
      # writes an OCI-layout tar the scanners do not read directly, so each
      # single-arch child is loaded by ref. Both gate scanners scan these six
      # children (grype by ref; osv-scanner by `scan image`).
      - name: load every variant/platform child into the docker daemon
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq skopeo
          : > /tmp/refs.txt
          for v in production debug fips; do
            for arch in amd64 arm64; do
              ref="ghcr.io/fosterstack/cache:cand-${v}-${arch}"
              skopeo copy --override-arch "${arch}" --override-os linux \
                "oci-archive:/tmp/oci/${v}.oci" "docker-daemon:${ref}"
              echo "${ref}" >> /tmp/refs.txt
            done
          done
          echo "loaded images to scan:"; cat /tmp/refs.txt

      - name: Grype scan every loaded image and every archive
        if: matrix.scanner == 'grype'
        run: |
          set -euo pipefail
          grype db update >/dev/null 2>&1 || true
          while read -r ref; do
            echo "grype: ${ref}"
            grype "docker:${ref}" --fail-on negligible --vex .vex/fosterstack-cache.openvex.json
          done < /tmp/refs.txt
          for a in dist/*.tar.gz; do
            echo "grype archive: $a"
            grype "file:${a}" --fail-on negligible --vex .vex/fosterstack-cache.openvex.json
          done

      - name: OSV-Scanner (all six image children + the Go modules — OSV.dev)
        if: matrix.scanner == 'osv-scanner'
        run: |
          set -uo pipefail
          # osv-scanner is the second vote, on a DIFFERENT database (OSV.dev
          # via osv-scalibr/deps.dev; grype uses Anchore's own aggregation).
          # Per decision row 45 it scans the three OCI variants on both
          # architectures (the six loaded children) via `scan image` AND the Go
          # modules via `scan source`; grype covers the release archives.
          # Exit 0 = clean, 1 = vulnerabilities found (block), anything else =
          # could-not-run (also red, never a clean pass). A finding grype did
          # not also raise goes to the audit lane's VEX review. osv-scanner has
          # no OpenVEX flag; it reports no VEX-adjudicated image package today
          # (the distroless base carries none), and if it ever did, that would
          # go to the audit lane too.
          rc=0
          while read -r ref; do
            echo "osv-scanner image: ${ref}"
            osv-scanner scan image "${ref}" || { c=$?; [ "$c" -gt "$rc" ] && rc=$c; }
          done < /tmp/refs.txt
          echo "osv-scanner source: go.mod tools/requirements/go.mod"
          osv-scanner scan source go.mod tools/requirements/go.mod || { c=$?; [ "$c" -gt "$rc" ] && rc=$c; }
          if [ "$rc" -eq 0 ]; then
            echo "osv-scanner: no known vulnerabilities in the six image children or the Go modules"
          elif [ "$rc" -eq 1 ]; then
            echo "::error::OSV-Scanner found vulnerabilities. Fix the dependency, or (for a finding grype did not raise) publish a VEX statement via the audit-lane review." >&2
            exit 1
          else
            echo "::error::OSV-Scanner could not run (exit ${rc}) — scanner-could-not-run is a pipeline failure, not a finding and not a clean pass." >&2
            exit 1
          fi

  scan:
    name: scan
    needs: scanner
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: every scanner must have run and passed
        run: |
          r='${{ needs.scanner.result }}'
          echo "aggregate scanner result: ${r}"
          [ "${r}" = "success" ] || { echo "::error::one or more scanners failed, were cancelled, or were skipped (result=${r}). Per policy nothing is clean unless every scanner in scanners.json runs and passes." >&2; exit 1; }
