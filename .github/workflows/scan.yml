name: scan

# The single required "scan" status check (audit follow-up). It exists so
# a disclosed vulnerability is caught at PR time and on every push to main
# and every tag — the same policy the release chain's stage-verify applies
# at tag time, brought forward so tag day is not the first time the whole
# scanner set runs. It builds the candidate through the EXACT same build +
# image-assembly stages the release chain uses (mode: snapshot/pr), so the
# bytes scanned here are the bytes the chain would ship, then runs every
# scanner in the `pr_gate` list of .github/policy/scanners.json.
#
# Decision row 57 (supersedes row 45 for this gate): TWO scanners with
# DIFFERENT DATABASES (different aggregations, overlapping upstream
# sources) — grype (Anchore's own database) scans both platform children of
# every OCI variant AND every dist archive; Amazon Inspector scans the same
# six children (inspector-sbomgen inventories each image on the runner;
# only the SBOM goes to inspector-scan:ScanSbom). Go code: govulncheck
# (its own job), the symbol-level authority. Trivy and OSV-Scanner left
# this gate. Findings block at ANY severity with the published VEX document
# as the only exception (grype via --vex; Inspector via bin/inspector-gate.py,
# which applies the same document). A scanner that cannot be installed or
# run, or that inventories zero packages (row 53), is a PIPELINE failure
# (red), never a silent clean pass (bin/install-scanner.sh).
#
# Inspector needs no stored secret: the scanner job alone requests
# id-token: write and assumes a ScanSbom-only role by OIDC on pull requests
# (Dependabot's included), pushes to main and tags (REQ-REL-004-AC1 as
# ratified Sep 29, decision row 73; the role's trust names those subjects).
#
# The aggregation job at the bottom is named `scan`; that is the one
# context to add to the main-protection ruleset as a required check.

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

# Workflow default: read only. Each job states what it needs. The reusable-stage
# callers (build, rebuild) grant what the shared stage files REQUEST, or the run is a
# startup_failure with zero jobs (the former release-chain-pr.yml learned this the hard way);
# checks/statuses/pull-requests read are requested by Build's admission step, which snapshot mode
# does not run, but they are static job permissions of the called stage. The callers' grants
# are a static ceiling (REQ-CHAIN-004-AC14): no write but id-token. The scanner job requests
# id-token: write for the Inspector leg's role assumption. Dependabot-
# triggered runs get a read-only token that the permissions key can raise
# (GitHub docs, "Troubleshooting Dependabot on GitHub Actions"); fork
# events are downgraded and need none of this to build and scan.
permissions:
  contents: read

jobs:
  # The proof build (REQ-CHAIN-004-AC12, AC14): Build in SNAPSHOT mode, with no tag and no admission; its records are refused by every release verifier.
  build:
    permissions:
      contents: read
      checks: read
      statuses: read
      pull-requests: read
      id-token: write
    uses: ./.github/workflows/stage-build.yml
    with:
      mode: snapshot

  # The PR-mode proof of the reproducibility property (rule 31, kept): Rebuild in snapshot mode rebuilds everything on fresh runners and compares every item with
  # Build's snapshot record; it FAILS the job on any difference (REQ-CHAIN-005-AC7). The release relies only on release.yml's own Rebuild; this is a PR/main proof.
  rebuild:
    needs: build
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/stage-reproducibility.yml
    with:
      mode: snapshot

  # Check absorbs this call in PR 3 (stage-acceptance-artifacts.yml's handling of the digests JSON and of the artifact name dist is PR 3's change).
  artifact-acceptance:
    needs: build
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/stage-acceptance-artifacts.yml
    with:
      dist-artifact: dist
      expected-checksums: ${{ needs.build.outputs.digests }}

  # The required check `reproducibility` keeps its name: it passes only when the snapshot Rebuild passed, and that job fails on any differing item.
  reproducibility:
    name: reproducibility
    needs: rebuild
    runs-on: ubuntu-latest
    steps:
      - run: echo "the snapshot Rebuild compared every item with Build's and found them identical"

  scanners:
    name: read the scanner list
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.read.outputs.list }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: read
        run: echo "list=$(jq -c '.pr_gate' .github/policy/scanners.json)" >> "$GITHUB_OUTPUT"

  scanner:
    name: scan (${{ matrix.scanner }})
    needs: [build, scanners]
    runs-on: ubuntu-latest
    # id-token: write is for the Inspector leg's role assumption and is the
    # only place in this workflow's own jobs that requests it.
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        scanner: ${{ fromJSON(needs.scanners.outputs.list) }}
    env:
      INSPECTOR_ROLE: arn:aws:iam::821302803867:role/fosterstack-cache-inspector-scan
      INSPECTOR_REGION: us-east-1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Both gate scanners read the OCI images; only grype scans the
      # release archives. So: the image download + daemon load run for
      # both; the archive download + verify run for grype only.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: oci-candidate
          path: /tmp/oci/

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: matrix.scanner == 'grype'
        with:
          name: dist-snapshot
          path: dist/

      - name: verify archives before scanning them
        if: matrix.scanner == 'grype'
        env:
          EXPECTED: ${{ needs.build.outputs.checksums }}
        run: |
          set -euo pipefail
          printf '%s\n' "${EXPECTED}" > /tmp/expected-checksums.txt
          (cd dist && sha256sum -c /tmp/expected-checksums.txt --ignore-missing --strict)

      - name: install ${{ matrix.scanner }} (pinned by checksum; a scanner that can't run is a pipeline failure, not a finding)
        run: ./bin/install-scanner.sh '${{ matrix.scanner == 'inspector' && 'inspector-sbomgen' || matrix.scanner }}'

      # Load every (variant, platform) child into the docker daemon. buildx
      # writes an OCI-layout tar the scanners do not read directly, so each
      # single-arch child is loaded by ref. Both gate scanners scan these
      # six children by ref.
      - name: load every variant/platform child into the docker daemon
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq skopeo
          : > /tmp/refs.txt
          for v in production debug fips; do
            for arch in amd64 arm64; do
              ref="ghcr.io/fosterstack/cache:cand-${v}-${arch}"
              skopeo copy --override-arch "${arch}" --override-os linux \
                "oci-archive:/tmp/oci/${v}.oci" "docker-daemon:${ref}"
              echo "${ref}" >> /tmp/refs.txt
            done
          done
          echo "loaded images to scan:"; cat /tmp/refs.txt

      - name: Grype scan every loaded image and every archive
        if: matrix.scanner == 'grype'
        run: |
          set -euo pipefail
          grype db update >/dev/null 2>&1 || true
          echo "## Grype" >> "$GITHUB_STEP_SUMMARY"
          # bin/grype-scan.sh: one pass per target, counts, VEX, zero packages = red.
          g() { ./bin/grype-scan.sh "$1" "$2"; }
          while read -r ref; do g "docker:${ref}" "${ref##*:}"; done < /tmp/refs.txt
          for a in dist/*.tar.gz; do g "file:${a}" "${a#dist/}"; done

      - name: Amazon Inspector — assume the ScanSbom-only role (OIDC; no stored secret)
        if: matrix.scanner == 'inspector'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ env.INSPECTOR_ROLE }}
          aws-region: ${{ env.INSPECTOR_REGION }}
          role-session-name: cache-pr-scan-${{ github.run_id }}

      - name: Amazon Inspector scan every loaded image
        if: matrix.scanner == 'inspector'
        run: |
          set +e -uo pipefail   # the runner starts bash with -e; every image must be scanned before the verdict
          # inspector-sbomgen inventories each child on the runner; only the
          # SBOM leaves the runner. Identical inventories (a variant's two
          # platform children usually match) are sent once and their verdict
          # reused. bin/inspector-gate.py prints the package count, applies
          # the published VEX, and returns 0 clean / 1 findings / 2 did not run.
          mkdir -p /tmp/insp; rc=0; sent=0
          echo "## Amazon Inspector" >> "$GITHUB_STEP_SUMMARY"
          while read -r ref; do
            tag="${ref##*:}"
            if ! inspector-sbomgen container --image "${ref}" --outfile "/tmp/insp/${tag}.sbom.json" --disable-progress-bar; then
              echo "::error::inspector-sbomgen could not inventory ${ref} — did not run, not a clean pass" >&2; rc=2; continue
            fi
            key=$(jq -S '[.components[]? | .purl // (.name + "@" + (.version // ""))] | sort' "/tmp/insp/${tag}.sbom.json" | sha256sum | cut -c1-16)
            if [ ! -f "/tmp/insp/${key}.findings.json" ]; then
              aws inspector-scan scan-sbom --sbom "file:///tmp/insp/${tag}.sbom.json" --output-format CYCLONE_DX_1_5 \
                > "/tmp/insp/${key}.findings.json" || { echo "::error::inspector-scan:ScanSbom failed for ${ref} — did not run, not a clean pass" >&2; rm -f "/tmp/insp/${key}.findings.json"; rc=2; continue; }
              sent=$((sent+1))
            fi
            out=$(python3 bin/inspector-gate.py "${tag}" "/tmp/insp/${tag}.sbom.json" "/tmp/insp/${key}.findings.json" .vex/fosterstack-cache.openvex.json) && c=0 || c=$?
            echo "${out}"; echo "- ${out%%$'\n'*}" >> "$GITHUB_STEP_SUMMARY"
            [ "$c" -gt "$rc" ] && rc=$c
          done < /tmp/refs.txt
          echo "- SBOMs assessed: ${sent} (identical inventories assessed once)" >> "$GITHUB_STEP_SUMMARY"
          if [ "$rc" -eq 1 ]; then
            echo "::error::Amazon Inspector found vulnerabilities. Fix the dependency, or publish a VEX statement via the audit-lane review." >&2
          elif [ "$rc" -ge 2 ]; then
            echo "::error::Amazon Inspector did not run on every image — a pipeline failure, not a finding and not a clean pass." >&2
          fi
          exit "$rc"

      # The SBOMs and the raw ScanSbom responses, as evidence of what was
      # inventoried and what came back (kept even when the leg is red).
      - name: keep the Inspector SBOMs and responses
        if: always() && matrix.scanner == 'inspector'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: inspector-evidence
          path: /tmp/insp/
          if-no-files-found: warn
          retention-days: 30

  scan:
    name: scan
    needs: scanner
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: every scanner must have run and passed
        run: |
          r='${{ needs.scanner.result }}'
          echo "aggregate scanner result: ${r}"
          [ "${r}" = "success" ] || { echo "::error::one or more scanners failed, were cancelled, or were skipped (result=${r}). Per policy nothing is clean unless every scanner in the pr_gate list of scanners.json runs and passes." >&2; exit 1; }
