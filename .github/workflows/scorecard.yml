name: Scorecard

# baseline PULL-PUSH-REQ-4: posture assessment tooling, public badge on
# README (checklist item 5).
on:
  branch_protection_rule:
  schedule:
    - cron: '23 4 * * 2'
  push:
    branches: [main]

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Row 78 (owner, Sep 30); amended Oct 3 (0117/0140): the composite action's own action.yaml ran a mutable
      # tag (docker://...:v2.4.4) — a commit pin on the wrapper does not fix that. Invoked directly by digest
      # instead, same inputs (GitHub maps a docker:// step's `with:` to INPUT_<NAME> env vars regardless of the
      # action.yaml wrapper, so the image's own entrypoint behaves identically). Prove the README badge still
      # publishes after merge; revert to the composite action and outbox the trade-off if it does not.
      - uses: docker://ghcr.io/ossf/scorecard-action@sha256:ae5104dd3cc28466ebeb11144354be4cac4b7ff829654f9fab89021d71c46670 # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: results.sarif
