# The Build stage of the v0.3.0 release chain (rules 50, 51, 59, 62, 68; REQ-CHAIN-004). Called only from release.yml, and, in snapshot mode, from the proof
# workflows scan.yml and main-candidate-rescan.yml. Two jobs: `apk` builds the apks on a native runner of each architecture, `assemble` builds the images and
# archives on an ubuntu-24.04 VM from them. Every command runs through bin/witnessed-local.sh, which records the step under a throwaway key (no job here holds an id-token; Sign checks the record and signs it keyless); the
# scripts it runs are listed with their sha256 in .github/policy/chain-scripts.json. Nothing here is published: Sign gets the digests.json text (the stage
# output `digests`), Rebuild and Check get the artifacts.
# `mode` is release (the default) or snapshot (REQ-CHAIN-004-AC12): the guard step (no if: GitHub compares case-insensitively) refuses any other value, and each job has one Witness step per mode,
# gated by `if`. A snapshot has no tag, no admission and no Sign; its records carry a snapshot- step name that every verifier refuses (AC13).
# `hostile` is true only on a push of a release-candidate tag (a tag with -rc, release.yml; PR 1's REQ-CHAIN-001-AC5): the hostile step tries to defeat Sign and
# writes the raw material of its attempts; it never runs for a final tag or a branch.
# The shape of this file is judged by bin/chain-build-wiring-test.sh (an exact grammar), the behaviour of the scripts by the same test.
name: 'Stage: build'
on:
  workflow_call:
    inputs:
      hostile:
        description: release-candidate tag runs only (the hostile Build step)
        type: boolean
        default: false
      mode:
        description: release or snapshot
        type: string
        default: release
    outputs:
      digests:
        description: the digests.json text, for Sign
        value: ${{ jobs.assemble.outputs.digests }}
permissions:
  contents: read
jobs:
  apk:
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    permissions:
      contents: read
      checks: read
      statuses: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: the mode is release or snapshot
        env:
          MODE: ${{ inputs.mode }}
        run: bash bin/build-stage-refuse-mode.sh "$MODE"
      - name: install Witness (pinned by checksum)
        run: bash bin/install-scanner.sh witness
      - name: install Go (pinned by checksum)
        run: bash bin/install-scanner.sh go
      - name: install melange (pinned by checksum)
        run: bash bin/install-build-tools.sh melange
      - name: install crane (pinned by checksum)
        run: bash bin/install-scanner.sh crane
      - name: pull the archive by its committed digest
        run: bash bin/archive-pull.sh --pointer build/archive.json --out archive
      - name: unpack the host tools from the archive (bubblewrap for melange's runner)
        run: python3 -I bin/install-host-bwrap.py --archive archive --lock build/locks/host-tools.lock --root host-tools
      - name: apk under Witness
        if: ${{ inputs.mode == 'release' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash bin/witnessed-local.sh apk bin/build-stage-apk.sh
      - name: snapshot-apk under Witness
        if: ${{ inputs.mode == 'snapshot' }}
        run: bash bin/witnessed-local.sh snapshot-apk bin/build-stage-snapshot-apk.sh
      - name: sandbox wall probe (dry run only)
        if: ${{ inputs.hostile }}
        run: bash bin/chain-sandbox-probe.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: apk-${{ matrix.runner }}
          path: out
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: witness-apk-${{ matrix.runner }}
          path: witness-apk
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ inputs.mode == 'release' && matrix.runner == 'ubuntu-24.04' }}
        with:
          name: admission
          path: admission.json
  assemble:
    needs: apk
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      digests: ${{ steps.digests.outputs.digests }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: the mode is release or snapshot
        env:
          MODE: ${{ inputs.mode }}
        run: bash bin/build-stage-refuse-mode.sh "$MODE"
      - name: install Witness (pinned by checksum)
        run: bash bin/install-scanner.sh witness
      - name: install apko (pinned by checksum)
        run: bash bin/install-build-tools.sh apko
      - name: install crane (pinned by checksum)
        run: bash bin/install-scanner.sh crane
      - name: pull the archive by its committed digest
        run: bash bin/archive-pull.sh --pointer build/archive.json --out archive
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: apk-ubuntu-24.04
          path: apk/ubuntu-24.04
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: apk-ubuntu-24.04-arm
          path: apk/ubuntu-24.04-arm
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: witness-apk-ubuntu-24.04
          path: rec-apk/ubuntu-24.04
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: witness-apk-ubuntu-24.04-arm
          path: rec-apk/ubuntu-24.04-arm
      - name: build under Witness
        if: ${{ inputs.mode == 'release' }}
        run: bash bin/witnessed-local.sh build bin/build-stage-assemble.sh
      - name: snapshot-build under Witness
        if: ${{ inputs.mode == 'snapshot' }}
        run: bash bin/witnessed-local.sh snapshot-build bin/build-stage-snapshot-assemble.sh
      - id: digests
        name: expose digests.json as the stage output
        run: echo "digests=$(jq -c . digests.json)" >> "$GITHUB_OUTPUT"
      - name: hostile step (dry run only)
        if: ${{ inputs.hostile }}
        run: bash bin/chain-hostile-step.sh
      - name: upload the hostile attempts (dry run only)
        if: ${{ inputs.hostile }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hostile-attempts
          path: attempts
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: witness-build
          path: witness-build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests
          path: digests.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: items
          path: items.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ inputs.mode == 'release' }}
        with:
          name: admission-baseline
          path: admission-baseline.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: images
          path: out
