# The Build stage of the v0.3.0 release chain (rules 50, 51, 59, 62, 68; REQ-CHAIN-004). Called only from release.yml, and, in snapshot mode, from the proof
# workflows scan.yml and main-candidate-rescan.yml. Two jobs: `apk` builds the apks on a native runner of each architecture, `assemble` builds the images and
# archives on an ubuntu-24.04 VM from them. Every command runs through bin/witnessed.sh, which signs a Witness record keylessly (Fulcio) for the step; the
# scripts it runs are listed with their sha256 in .github/policy/chain-scripts.json. Nothing here is published: Sign gets the digests.json text (the stage
# output `digests`), Rebuild and Check get the artifacts.
# `mode` is release (the default) or snapshot (REQ-CHAIN-004-AC12): the first step refuses any other value, and each job has one Witness step per mode,
# gated by `if`. A snapshot has no tag, no admission and no Sign; its records carry a snapshot- step name that every verifier refuses (AC13).
# `hostile` is true only in a dry run on a branch (PR 1's REQ-CHAIN-001-AC5): the hostile step tries to defeat Sign and writes the raw
# material of its attempts; it never runs in a release.
# The shape of this file is judged by bin/chain-build-wiring-test.sh (an exact grammar), the behaviour of the scripts by the same test.
name: 'Stage: build'
on:
  workflow_call:
    inputs:
      hostile:
        description: dry run only
        type: boolean
        default: false
      mode:
        description: release or snapshot
        type: string
        default: release
    outputs:
      digests:
        description: the digests.json text, for Sign
        value: ${{ jobs.assemble.outputs.digests }}
permissions:
  contents: read
jobs:
  apk:
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    permissions:
      contents: read
      checks: read
      statuses: read
      pull-requests: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true
      - name: the mode is release or snapshot
        env:
          MODE: ${{ inputs.mode }}
        run: case "$MODE" in release|snapshot) ;; *) echo "::error::mode must be release or snapshot" >&2; exit 1 ;; esac
      - name: install Witness (pinned by checksum)
        run: ./bin/install-scanner.sh witness
      - name: apk under Witness
        if: ${{ inputs.mode == 'release' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash bin/witnessed.sh apk bin/build-stage-apk.sh
      - name: snapshot-apk under Witness
        if: ${{ inputs.mode == 'snapshot' }}
        run: bash bin/witnessed.sh snapshot-apk bin/build-stage-snapshot-apk.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: apk-${{ matrix.runner }}
          path: out
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: witness-apk-${{ matrix.runner }}
          path: witness-apk
  assemble:
    needs: apk
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    outputs:
      digests: ${{ steps.digests.outputs.digests }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true
      - name: the mode is release or snapshot
        env:
          MODE: ${{ inputs.mode }}
        run: case "$MODE" in release|snapshot) ;; *) echo "::error::mode must be release or snapshot" >&2; exit 1 ;; esac
      - name: install Witness (pinned by checksum)
        run: ./bin/install-scanner.sh witness
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: apk-ubuntu-24.04
          path: apk/ubuntu-24.04
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: apk-ubuntu-24.04-arm
          path: apk/ubuntu-24.04-arm
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: witness-apk-ubuntu-24.04
          path: rec-apk/ubuntu-24.04
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: witness-apk-ubuntu-24.04-arm
          path: rec-apk/ubuntu-24.04-arm
      - name: build under Witness
        if: ${{ inputs.mode == 'release' }}
        run: bash bin/witnessed.sh build bin/build-stage-assemble.sh
      - name: snapshot-build under Witness
        if: ${{ inputs.mode == 'snapshot' }}
        run: bash bin/witnessed.sh snapshot-build bin/build-stage-snapshot-assemble.sh
      - id: digests
        name: expose digests.json as the stage output
        run: echo "digests=$(jq -c . digests.json)" >> "$GITHUB_OUTPUT"
      - name: hostile step (dry run only)
        if: ${{ inputs.hostile }}
        run: bash bin/chain-hostile-step.sh
      - name: upload the hostile attempts (dry run only)
        if: ${{ inputs.hostile }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hostile-attempts
          path: attempts
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: witness-build
          path: witness-build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digests
          path: digests.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: items
          path: items.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: images
          path: out
