name: 'Stage: build'

# Release-chain build stage (release-chain-design.md §2 Stage 2), a
# reusable workflow so the stage has its own OIDC identity
# (job_workflow_ref names THIS file) and downstream verifiers can require
# "signed by the build stage", not merely "signed by the repository".
#
# One controlled operation: compile the binaries and produce the archives,
# checksums, and per-archive SBOMs. Materials are pinned — the toolchain
# comes from go.mod with GOTOOLCHAIN=local so Go cannot download a newer
# one, and the module manifests are verified, never mutated. In release
# mode the stage signs a build predicate whose subjects are the archive
# digests from checksums.txt: the digests are emitted HERE, by the
# builder, at the source — never resolved from a registry later.
#
# Release mode verifies the source-admission predicate on entry: the
# admission.json produced by stage-admission.yml arrives as an artifact,
# its digest is recomputed here, and the signed predicate is verified for
# that digest, for this commit, with the admission stage workflow as the
# required signer. No admission, no build.

on:
  workflow_call:
    inputs:
      mode:
        description: 'snapshot (PRs) or release (tag chain)'
        required: true
        type: string
      admission-artifact:
        description: 'artifact carrying the signed admission.json (required in release mode)'
        required: false
        type: string
        default: ''
    outputs:
      checksums:
        description: 'sha256 lines for the produced archives'
        value: ${{ jobs.build.outputs.checksums }}

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write     # release mode: sign the build predicate
      attestations: write
    outputs:
      checksums: ${{ steps.sums.outputs.checksums }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: release mode requires an admission artifact
        if: inputs.mode == 'release' && inputs.admission-artifact == ''
        run: |
          echo "::error::release mode with no admission artifact — the chain must enter through stage-admission" >&2
          exit 1

      - name: verify the source-admission predicate on entry
        if: inputs.mode == 'release'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.admission-artifact }}
          path: /tmp/admission

      - name: admission predicate must be signed by the admission stage for this commit
        if: inputs.mode == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          f=/tmp/admission/admission.json
          gh attestation verify "$f" \
            --repo "${GITHUB_REPOSITORY}" \
            --predicate-type https://fosterstack.com/attestations/source-admission/v1 \
            --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/stage-admission.yml" \
            --format json \
            --jq '.[0].verificationResult.statement.predicate | {tag, sha}' > /tmp/admitted.json
          adm_sha=$(jq -r '.sha' /tmp/admitted.json)
          adm_tag=$(jq -r '.tag' /tmp/admitted.json)
          [ "$adm_sha" = "${GITHUB_SHA}" ] \
            || { echo "::error::admission predicate admits ${adm_sha}, this build is at ${GITHUB_SHA}" >&2; exit 1; }
          [ "$adm_tag" = "${GITHUB_REF_NAME}" ] \
            || { echo "::error::admission predicate admits tag ${adm_tag}, this ref is ${GITHUB_REF_NAME}" >&2; exit 1; }
          echo "admitted: ${adm_tag} at ${adm_sha}"

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: false

      - name: pin the toolchain to go.mod (no silent upgrades)
        run: |
          echo "GOTOOLCHAIN=local" >> "$GITHUB_ENV"
          go version

      - name: verify module manifests (a build must not mutate its inputs)
        run: |
          go mod verify
          git diff --exit-code go.mod go.sum

      - uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        # Dependabot's github-actions ecosystem watches this pin; syft's
        # own identity is recorded in every SBOM document it produces.

      - name: goreleaser (binaries, archives, checksums, SBOMs — no images)
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: '2.17.1'
          args: release ${{ inputs.mode == 'snapshot' && '--snapshot' || '' }} --clean --skip=publish,announce${{ inputs.mode == 'snapshot' && ',validate' || '' }}

      - name: capture the builder's own digests
        id: sums
        run: |
          set -euo pipefail
          echo "archive digests, emitted at the source:"
          cat dist/checksums.txt
          {
            echo 'checksums<<EOF'
            cat dist/checksums.txt
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: upload dist
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-${{ inputs.mode }}
          path: dist/
          retention-days: 7
          if-no-files-found: error

      - name: write the build predicate
        if: inputs.mode == 'release'
        run: |
          set -euo pipefail
          jq -n \
            --arg goversion "$(go version)" \
            --arg goreleaser "2.17.1" \
            --arg commit "$GITHUB_SHA" \
            --arg ref "$GITHUB_REF" \
            --arg run "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --rawfile gosum go.sum \
            '{
              stage: "build",
              materials: {
                go_toolchain: $goversion,
                goreleaser: $goreleaser,
                commit: $commit,
                ref: $ref,
                gosum_sha256: ($gosum | @base64)
              },
              run: $run
            }' > /tmp/build-predicate.json
          jq . /tmp/build-predicate.json

      - name: sign the build predicate (subjects = the archive digests)
        if: inputs.mode == 'release'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: dist/checksums.txt
          predicate-type: 'https://fosterstack.com/attestations/build/v1'
          predicate-path: /tmp/build-predicate.json
