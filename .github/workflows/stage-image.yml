name: 'Stage: image assembly'

# Release-chain image-assembly stage (release-chain-design.md §2 Stage 3):
# verify the build stage's archives, extract the exact binaries, assemble
# each variant with a COPY-only Dockerfile via buildx. Zero RUN steps, so
# multi-arch needs no emulation and each image is a pure function of
# (base digest, binary bytes) — which is what makes the reproducibility
# stage's digest-equality check meaningful rather than hopeful.
#
# PR mode builds to a local OCI archive and emits the digest; nothing is
# pushed anywhere. Release mode verifies every archive against the SIGNED
# build predicate (not merely the workflow-output checksums), pushes each
# variant by digest only — no tag — to the private candidates package,
# and signs the image-build predicate: subjects are the index digests
# exactly as buildx's metadata emitted them (never a registry lookup),
# with per-platform manifest digests, the base-image digests, the binary
# sha256s, the Dockerfile hashes, and the buildx version as materials.

on:
  workflow_call:
    inputs:
      mode:
        description: 'pr (local oci, no push) or release (push candidates by digest)'
        required: true
        type: string
      dist-artifact:
        description: 'name of the uploaded dist artifact to consume'
        required: true
        type: string
      expected-checksums:
        description: 'checksums.txt content from the build stage — verified before any byte is used'
        required: true
        type: string
    outputs:
      digests:
        description: 'JSON {production, debug, fips} index digests'
        value: ${{ jobs.assemble.outputs.digests }}

permissions:
  contents: read

jobs:
  assemble:
    name: assemble
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write     # release mode: push candidates by digest
      id-token: write     # release mode: sign the image-build predicate
      attestations: write
    outputs:
      digests: ${{ steps.build.outputs.digests }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.dist-artifact }}
          path: dist/

      # Verify-before-consume: the archives must match the digests the
      # BUILDER emitted. In the full chain this comparison is against the
      # signed build predicate; the checksums travel through workflow
      # outputs (same trust domain) until the admission stage lands.
      - name: verify the archives against the builder's digests
        run: |
          set -euo pipefail
          printf '%s\n' "${EXPECTED}" > /tmp/expected-checksums.txt
          (cd dist && sha256sum -c /tmp/expected-checksums.txt --ignore-missing --strict)
          # every non-SBOM archive named by the builder must be present
          grep -oE '[^ ]+\.tar\.gz$' /tmp/expected-checksums.txt | while read -r f; do
            [ -f "dist/$f" ] || { echo "::error::builder-named archive missing: $f" >&2; exit 1; }
          done
        env:
          EXPECTED: ${{ inputs.expected-checksums }}

      # Release mode: the workflow-output comparison above is necessary
      # but not sufficient — the archives must ALSO verify against the
      # build predicate signed by the build stage, so a compromised
      # intermediary cannot substitute bytes between stages.
      - name: verify each archive against the signed build predicate
        if: inputs.mode == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          grep -oE '[^ ]+$' /tmp/expected-checksums.txt | while read -r f; do
            gh attestation verify "dist/$f" \
              --repo "${GITHUB_REPOSITORY}" \
              --predicate-type https://fosterstack.com/attestations/build/v1 \
              --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/stage-build.yml" >/dev/null
            echo "verified against build predicate: $f"
          done

      - name: extract the exact binaries into the build context
        run: |
          set -euo pipefail
          mkdir -p /tmp/imgctx/binaries/amd64 /tmp/imgctx/binaries/arm64
          tar xzf dist/fscache_*_linux_amd64.tar.gz  -C /tmp/imgctx/binaries/amd64 fscache
          tar xzf dist/fscache_*_linux_arm64.tar.gz  -C /tmp/imgctx/binaries/arm64 fscache
          tar xzf dist/fscache-fips_*_linux_amd64.tar.gz -C /tmp/imgctx/binaries/amd64 fscache-fips
          tar xzf dist/fscache-fips_*_linux_arm64.tar.gz -C /tmp/imgctx/binaries/arm64 fscache-fips
          cp build/docker/Dockerfile.* /tmp/imgctx/

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: log in to GHCR (release mode — candidates push)
        if: inputs.mode == 'release'
        run: echo '${{ github.token }}' | docker login ghcr.io -u '${{ github.actor }}' --password-stdin

      - name: assemble all variants (deterministic; provenance/SBOM exporters off)
        id: build
        run: |
          set -euo pipefail
          SDE=$(git log -1 --format=%ct)
          echo "SOURCE_DATE_EPOCH=${SDE} (commit timestamp)"
          echo "buildkit/buildx material: $(docker buildx version)"
          if [ '${{ inputs.mode }}' = 'release' ]; then
            out='type=image,name=ghcr.io/${{ github.repository_owner }}/cache-candidates,push-by-digest=true,push=true,rewrite-timestamp=true'
          fi
          cd /tmp/imgctx
          declare -A digest
          for v in production debug fips; do
            if [ '${{ inputs.mode }}' != 'release' ]; then
              out="type=oci,dest=/tmp/${v}.oci,rewrite-timestamp=true"
            fi
            SOURCE_DATE_EPOCH="${SDE}" docker buildx build \
              --platform linux/amd64,linux/arm64 \
              -f "Dockerfile.${v}" \
              --provenance=false --sbom=false \
              --output "${out}" \
              --metadata-file "/tmp/${v}.json" . >/dev/null
            digest[$v]=$(jq -r '."containerimage.digest"' "/tmp/${v}.json")
            echo "${v}: ${digest[$v]}"
          done
          jq -n --arg p "${digest[production]}" --arg d "${digest[debug]}" --arg f "${digest[fips]}" \
            '{production:$p, debug:$d, fips:$f}' | tee /tmp/digests.json
          echo "digests=$(jq -c . /tmp/digests.json)" >> "$GITHUB_OUTPUT"

      # The predicate's subjects are the digests buildx EMITTED. The
      # imagetools inspect below reads the children of those verified
      # indexes — content-addressed, so a child listed in a signed index
      # is covered by the signature on the index digest.
      - name: write the image-build predicate content (release mode)
        if: inputs.mode == 'release'
        id: predicate
        run: |
          set -euo pipefail
          repo="ghcr.io/${{ github.repository_owner }}/cache-candidates"
          for v in production debug fips; do
            d=$(jq -r --arg v "$v" '.[$v]' /tmp/digests.json)
            docker buildx imagetools inspect --raw "${repo}@${d}" \
              | jq --arg v "$v" '{variant: $v, platforms: [.manifests[] | {platform: (.platform.os + "/" + .platform.architecture), digest}]}'
          done | jq -s '.' > /tmp/platforms.json
          for v in production debug fips; do
            base=$(grep -oE 'sha256:[0-9a-f]{64}' "build/docker/Dockerfile.${v}" | head -1)
            jq -n --arg v "$v" --arg base "$base" --arg hash "$(sha256sum build/docker/Dockerfile.${v} | cut -d' ' -f1)" \
              '{variant: $v, base_digest: $base, dockerfile_sha256: $hash}'
          done | jq -s '.' > /tmp/dockerfiles.json
          (cd /tmp/imgctx/binaries && sha256sum -- */fscache*) | \
            jq -R -s '[split("\n")[] | select(length > 0) | split("  ") | {path: .[1], sha256: .[0]}]' > /tmp/binaries.json
          jq -n \
            --arg sha "${GITHUB_SHA}" \
            --arg sde "$(git log -1 --format=%ct)" \
            --arg buildx "$(docker buildx version)" \
            --slurpfile digests /tmp/digests.json \
            --slurpfile platforms /tmp/platforms.json \
            --slurpfile dockerfiles /tmp/dockerfiles.json \
            --slurpfile binaries /tmp/binaries.json \
            '{
              sha: $sha,
              index_digests: $digests[0],
              platform_manifests: $platforms[0],
              materials: {
                dockerfiles: $dockerfiles[0],
                binaries: $binaries[0],
                source_date_epoch: ($sde|tonumber),
                buildx: $buildx
              }
            }' > /tmp/image-build-predicate.json
          for v in production debug fips; do
            d=$(jq -r --arg v "$v" '.[$v]' /tmp/digests.json)
            echo "${d#sha256:}  cache-candidates-${v}"
          done > /tmp/image-subjects.txt
          cat /tmp/image-build-predicate.json

      - name: sign the image-build predicate (subjects = the emitted index digests)
        if: inputs.mode == 'release'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: /tmp/image-subjects.txt
          predicate-type: https://fosterstack.com/attestations/image-build/v1
          predicate-path: /tmp/image-build-predicate.json

      # SLSA build provenance for the images themselves: this is the
      # statement `gh attestation verify oci://…` checks by default, i.e.
      # the command the public docs give customers. Verified by the
      # authorization stage and by customers; consumed, therefore created.
      - name: attest build provenance for the images
        if: inputs.mode == 'release'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: /tmp/image-subjects.txt
