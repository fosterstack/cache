# The Release stage of the v0.3.0 release chain (rules 5, 17, 29, 50, 52, 53, 56, 57, 60, 61, 63, 64, 65, 69, 70, 71, 79; REQ-CHAIN-007). Called only from release.yml, after Check,
# Sign and Sign-rebuild (it needs exactly those three; it reaches Build and Rebuild through them). This is the ONLY file of the repository that holds a registry credential,
# the apk signing key or packages: write, and the release job binds the secrets only in the Witness steps that need them (the environment named release holds them; the job's write permissions exist from its start, which is why it needs the verify job).
# It builds nothing. Steps: checkout, the three pinned tools (Witness first, rule 68) and the pinned melange (for the apk re-signing, REQ-CHAIN-007-AC1), the earlier stages' artifacts, then six Witness steps through the one helper,
# each a committed script: release-verify (no credential is bound to this step: the tag, the release policy, every earlier stage's record in rule 69's order),
# release-apks (re-sign the apks with the stored key), release-publish (the exact image bytes by digest to ghcr.io and Docker Hub, read back),
# release-sign (signatures with the release key, each with a Rekor entry), release-assets (the evidence to the GitHub release) and release-postverify (the customer-guide
# commands that need a registry, run against what was just published, in both registries; rule 79 as amended by the owner on Oct 10). Release creates no tag.
# A release candidate (a tag vX.Y.Z-rcN, so one with a hyphen) ends after the verify job: the release job carries the job-level condition below and is skipped (and every
# witnessed step after release-verify carries it too), so no secret or key is bound to any step, nothing is pushed and no release is made (REQ-CHAIN-007-AC14). A tag that is neither is refused by release-verify's tag rule.
# The shape of this file is judged by bin/chain-release-wiring-test.sh and the closed grammar of bin/chain-sign-wiring-test.sh.
name: 'Stage: release'
on:
  workflow_call:
permissions:
  contents: read
jobs:
  # The compare job (the owner's rule of Oct 21 2026, ops/docs/ratify/2026-10-21-signer-builder-separate-jobs.md: "the signer and the builder need hardware isolation ... the best github
  # actions can do ... is to use separate jobs"): it receives Build's apks and Rebuild's apks, compares them with bin/release-compare.sh (control and data sections; signatures are checked against the committed key, not compared), and hands on one small result
  # file. It holds contents read ONLY: no environment, no secret, no write token and no identity token (an identity token can assume the signing role), so it is a plain step and
  # not a Witness step. The verify job reads the result file and checks it against Build's attested apk digests; Rebuild's apks never reach a job that holds a credential.
  compare:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: apk-ubuntu-24.04
          path: apks/ubuntu-24.04
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: apk-ubuntu-24.04-arm
          path: apks/ubuntu-24.04-arm
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rapk-ubuntu-24.04
          path: rapks/ubuntu-24.04
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rapk-ubuntu-24.04-arm
          path: rapks/ubuntu-24.04-arm
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: signed-witness-rapk-ubuntu-24.04
          path: witness-rapk-ubuntu-24.04
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: signed-witness-rapk-ubuntu-24.04-arm
          path: witness-rapk-ubuntu-24.04-arm
      - name: compare Build's and Rebuild's apks
        run: bash bin/release-compare.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: apk-compare
          path: apk-compare
          if-no-files-found: error
  # The verify job (REQ-CHAIN-007-AC1, Astra R6; handoff 0713 P2): contents read and nothing else: no identity token, no environment, no secret, no write token.
  # It verifies every earlier stage's record (release-verify under the local Witness script, a throwaway key). The release job below needs it, so no job that holds a write token or a secret starts
  # unless the records were verified by an earlier job; it also repeats release-verify on its own downloads before any credential step.
  verify:
    needs: compare
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: install witness (pinned by checksum)
        run: bash bin/install-scanner.sh witness
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: signed-witness-build
          path: witness-build
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: digests
          path: witness-build
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: items
          path: witness-build
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: admission-baseline
          path: witness-build
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: signed-witness-rebuild
          path: witness-rebuild
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: signed-witness-check
          path: witness-check
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: signed-witness-check-arm64
          path: witness-check/witness-arm64
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: check-results
          path: check-results
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: provenance
          path: provenance
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: apk-compare
          path: apk-compare
      - name: release-verify under Witness (a throwaway key, no identity token)
        run: bash bin/witnessed-local.sh release-verify bin/release-verify.sh
      - name: release-verify record holds no token (REQ-CHAIN-007-AC12)
        run: python3 -I bin/chain-verify.py record-env --record witness-release-verify/release-verify-collection.local.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: witness-release-verify
          path: witness-release-verify
          if-no-files-found: error
  release:
    needs: [compare, verify]
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: install witness (pinned by checksum)
        run: bash bin/install-scanner.sh witness
      - name: install cosign (pinned by checksum)
        run: bash bin/install-scanner.sh cosign
      - name: install crane (pinned by checksum)
        run: bash bin/install-scanner.sh crane
      - name: install melange (pinned by checksum; release-apks signs through bin/release-sign-apks.sh, which needs it)
        run: bash bin/install-build-tools.sh melange
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: signed-witness-build
          path: witness-build
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: digests
          path: witness-build
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: items
          path: witness-build
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: admission-baseline
          path: witness-build
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: signed-witness-rebuild
          path: witness-rebuild
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: signed-witness-check
          path: witness-check
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: signed-witness-check-arm64
          path: witness-check/witness-arm64
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: check-results
          path: check-results
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: provenance
          path: provenance
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: apk-compare
          path: apk-compare
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: images
          path: images
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: apk-ubuntu-24.04
          path: apks/ubuntu-24.04
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: apk-ubuntu-24.04-arm
          path: apks/ubuntu-24.04-arm
      - name: release-verify under Witness
        run: bash bin/witnessed.sh release-verify bin/release-verify.sh
      - name: release-apks under Witness
        if: ${{ !contains(github.ref_name, '-') }}
        env:
          APK_RELEASE_SIGNING_KEY: ${{ secrets.APK_RELEASE_SIGNING_KEY }}
        run: bash bin/witnessed.sh release-apks bin/release-apks.sh
      - name: release-publish under Witness
        if: ${{ !contains(github.ref_name, '-') }}
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: bash bin/witnessed.sh release-publish bin/release-publish.sh
      - name: release-sign under Witness
        if: ${{ !contains(github.ref_name, '-') }}
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: bash bin/witnessed.sh release-sign bin/release-sign.sh
      - name: release-assets under Witness
        if: ${{ !contains(github.ref_name, '-') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash bin/witnessed.sh release-assets bin/release-assets.sh
      - name: release-postverify under Witness
        if: ${{ !contains(github.ref_name, '-') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash bin/witnessed.sh release-postverify bin/release-postverify.sh
      - name: release-verify record holds no token (REQ-CHAIN-007-AC12)
        run: python3 -I bin/chain-verify.py record-env --record witness-release-verify/release-verify-collection.json
      - name: release-apks record holds no token (REQ-CHAIN-007-AC12)
        if: ${{ !contains(github.ref_name, '-') }}
        run: python3 -I bin/chain-verify.py record-env --record witness-release-apks/release-apks-collection.json
      - name: release-publish record holds no token (REQ-CHAIN-007-AC12)
        if: ${{ !contains(github.ref_name, '-') }}
        run: python3 -I bin/chain-verify.py record-env --record witness-release-publish/release-publish-collection.json
      - name: release-sign record holds no token (REQ-CHAIN-007-AC12)
        if: ${{ !contains(github.ref_name, '-') }}
        run: python3 -I bin/chain-verify.py record-env --record witness-release-sign/release-sign-collection.json
      - name: release-assets record holds no token (REQ-CHAIN-007-AC12)
        if: ${{ !contains(github.ref_name, '-') }}
        run: python3 -I bin/chain-verify.py record-env --record witness-release-assets/release-assets-collection.json
      - name: release-postverify record holds no token (REQ-CHAIN-007-AC12)
        if: ${{ !contains(github.ref_name, '-') }}
        run: python3 -I bin/chain-verify.py record-env --record witness-release-postverify/release-postverify-collection.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-evidence
          path: release-evidence
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: witness-release
          path: |
            witness-release-verify
            witness-release-apks
            witness-release-publish
            witness-release-sign
            witness-release-assets
            witness-release-postverify
