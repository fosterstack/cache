# The Release stage of the v0.3.0 release chain (rules 5, 17, 29, 50, 52, 53, 56, 57, 60, 61, 63, 64, 65, 69, 70, 71, 79; REQ-CHAIN-007). Called only from release.yml, after Check,
# Rebuild and Sign (it needs exactly those three; it reaches Build through Check). This is the ONLY file of the repository that holds a registry credential,
# the apk signing key or packages: write, and it holds them only in the Witness steps that need them (the environment named release holds the secrets).
# It builds nothing. Steps: checkout, the three pinned tools (Witness first, rule 68), the earlier stages' artifacts, then six Witness steps through the one helper,
# each a committed script: release-verify (no credential exists yet: the tag, the release policy, every earlier stage's record in rule 69's order),
# release-apks (re-sign the apks with the stored key), release-publish (the exact image bytes by digest to ghcr.io and Docker Hub, read back),
# release-sign (keyless signatures with a Rekor entry), release-assets (the evidence to the GitHub release) and release-postverify (the customer-guide
# commands that need a registry, run against what was just published, in both registries; rule 79 as amended by the owner on Oct 10). Release creates no tag.
# A release candidate (a tag vX.Y.Z-rcN, so one with a hyphen) ends after release-verify: every later step carries the condition below and is skipped, so no
# credential or key is read, nothing is pushed and no release is made (REQ-CHAIN-007-AC14). A tag that is neither is refused by release-verify's tag rule.
# The shape of this file is judged by bin/chain-release-wiring-test.sh and the closed grammar of bin/chain-sign-wiring-test.sh.
name: 'Stage: release'
on:
  workflow_call:
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: install witness (pinned by checksum)
        run: bash bin/install-scanner.sh witness
      - name: install cosign (pinned by checksum)
        run: bash bin/install-scanner.sh cosign
      - name: install crane (pinned by checksum)
        run: bash bin/install-scanner.sh crane
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: witness-build
          path: witness-build
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: digests
          path: witness-build
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: witness-rebuild
          path: witness-rebuild
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: witness-check
          path: witness-check
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: provenance
          path: provenance
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: images
          path: images
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: apk-ubuntu-24.04
          path: apks/ubuntu-24.04
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: apk-ubuntu-24.04-arm
          path: apks/ubuntu-24.04-arm
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: rapk-ubuntu-24.04
          path: rapks/ubuntu-24.04
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: rapk-ubuntu-24.04-arm
          path: rapks/ubuntu-24.04-arm
      - name: release-verify under Witness
        run: bash bin/witnessed.sh release-verify bin/release-verify.sh
      - name: release-apks under Witness
        if: ${{ !contains(github.ref_name, '-') }}
        env:
          APK_RELEASE_SIGNING_KEY: ${{ secrets.APK_RELEASE_SIGNING_KEY }}
        run: bash bin/witnessed.sh release-apks bin/release-apks.sh
      - name: release-publish under Witness
        if: ${{ !contains(github.ref_name, '-') }}
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: bash bin/witnessed.sh release-publish bin/release-publish.sh
      - name: release-sign under Witness
        if: ${{ !contains(github.ref_name, '-') }}
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: bash bin/witnessed.sh release-sign bin/release-sign.sh
      - name: release-assets under Witness
        if: ${{ !contains(github.ref_name, '-') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash bin/witnessed.sh release-assets bin/release-assets.sh
      - name: release-postverify under Witness
        if: ${{ !contains(github.ref_name, '-') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash bin/witnessed.sh release-postverify bin/release-postverify.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-evidence
          path: release-evidence
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: witness-release
          path: |
            witness-release-verify
            witness-release-apks
            witness-release-publish
            witness-release-sign
            witness-release-assets
            witness-release-postverify
