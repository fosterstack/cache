name: 'Stage: promotion'

# Release-chain promotion stage (release-chain-design.md §2 Stage 7).
# No build step of any kind. Verifies the release-authorization
# predicate for D, then copies each candidate BY DIGEST into the public
# registries — ghcr.io (canonical) and docker.io/fosterstack/cache (the
# mirror, owner decision Sep 12) — applying the version tags in the same
# operation and asserting the public digest equals D after every copy.
# Candidates never touch Docker Hub. cosign signs the public digests in
# BOTH registries (signatures are per-registry artifacts). The release
# is files: the draft GitHub Release gets the archives, checksums and
# their cosign bundle, SBOMs, VEX document, and release-manifest.json —
# then the customer-facing verify and anonymous-pull checks run against
# the public digests, and only then is the release undrafted.
#
# OWNER SETUP (TODO, required before the first tag run):
#   - Create a deployment environment named `release`
#     (Settings → Environments → New environment: release).
#   - On that environment, add two secrets:
#       DOCKERHUB_USERNAME — fosterstackadmin
#       DOCKERHUB_TOKEN    — a Docker Hub access token scoped
#                            read/write to the fosterstack/cache
#                            repository only.
#   Until the environment and secrets exist, this stage fails at the
#   Docker Hub login — the correct failure mode (no silent GHCR-only
#   promotion that docs would then misdescribe).

on:
  workflow_call:
    inputs:
      digests:
        description: 'JSON {production, debug, fips} candidate index digests'
        required: true
        type: string
      dist-artifact:
        description: 'the dist artifact (archives, checksums, SBOMs)'
        required: true
        type: string
      expected-checksums:
        description: 'checksums.txt content from the build stage'
        required: true
        type: string

permissions:
  contents: read

jobs:
  promote:
    name: promotion
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write     # create the draft release and upload assets
      packages: write     # push public images, signatures, referrers
      id-token: write     # cosign keyless signing
      attestations: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: log in to GHCR
        run: echo '${{ github.token }}' | docker login ghcr.io -u '${{ github.actor }}' --password-stdin

      - name: verify the release-authorization predicate for D on entry
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo="ghcr.io/${{ github.repository_owner }}/cache-candidates"
          for v in production debug fips; do
            d=$(jq -r --arg v "$v" '.[$v]' <<<'${{ inputs.digests }}')
            gh attestation verify "oci://${repo}@${d}" \
              --repo "${GITHUB_REPOSITORY}" \
              --predicate-type https://fosterstack.com/attestations/release-authorization/v1 \
              --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/stage-authorize.yml" \
              --format json > "/tmp/auth-${v}.json"
            auth_tag=$(jq -r '.[0].verificationResult.statement.predicate.tag' "/tmp/auth-${v}.json")
            [ "$auth_tag" = "${GITHUB_REF_NAME}" ] \
              || { echo "::error::authorization is for ${auth_tag}, this run promotes ${GITHUB_REF_NAME}" >&2; exit 1; }
            echo "authorization verified for ${v}"
          done

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.dist-artifact }}
          path: dist/

      - name: verify the archives one last time before they become release assets
        env:
          EXPECTED: ${{ inputs.expected-checksums }}
        run: |
          set -euo pipefail
          printf '%s\n' "${EXPECTED}" > /tmp/expected-checksums.txt
          (cd dist && sha256sum -c /tmp/expected-checksums.txt --ignore-missing --strict)

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: false

      - name: install crane (pinned; module proxy is checksum-verified)
        run: GOTOOLCHAIN=local go install github.com/google/go-containerregistry/cmd/crane@v0.22.1

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: log in to Docker Hub (mirror)
        run: echo '${{ secrets.DOCKERHUB_TOKEN }}' | docker login docker.io -u '${{ secrets.DOCKERHUB_USERNAME }}' --password-stdin

      - name: promote by digest to both registries, tags applied in the same operation
        id: promote
        run: |
          set -euo pipefail
          src="ghcr.io/${{ github.repository_owner }}/cache-candidates"
          ghcr="ghcr.io/${{ github.repository_owner }}/cache"
          hub="docker.io/fosterstack/cache"
          ver="${GITHUB_REF_NAME}"
          tag_for() { case "$1" in production) echo "$ver";; debug) echo "$ver-debug";; fips) echo "$ver-fips";; esac; }
          float_for() { case "$1" in production) echo "latest";; debug) echo "debug";; fips) echo "fips";; esac; }
          for v in production debug fips; do
            d=$(jq -r --arg v "$v" '.[$v]' <<<'${{ inputs.digests }}')
            t=$(tag_for "$v"); f=$(float_for "$v")
            for dst in "$ghcr" "$hub"; do
              crane copy "${src}@${d}" "${dst}:${t}"
              crane tag "${dst}:${t}" "${f}"
              for check in "$t" "$f"; do
                got=$(crane digest "${dst}:${check}")
                [ "$got" = "$d" ] \
                  || { echo "::error::post-copy digest mismatch at ${dst}:${check}: ${got} != ${d}" >&2; exit 1; }
              done
              echo "${v} -> ${dst}:${t} (+${f}) at ${d} — digest equality asserted"
            done
          done

      - name: cosign-sign the public digests in BOTH registries (keyless)
        run: |
          set -euo pipefail
          ghcr="ghcr.io/${{ github.repository_owner }}/cache"
          hub="docker.io/fosterstack/cache"
          for v in production debug fips; do
            d=$(jq -r --arg v "$v" '.[$v]' <<<'${{ inputs.digests }}')
            cosign sign --yes "${ghcr}@${d}"
            cosign sign --yes "${hub}@${d}"
          done

      - name: assemble release-manifest.json (the release evidence bundle, design §3)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ver="${GITHUB_REF_NAME}"
          ghcr="ghcr.io/${{ github.repository_owner }}/cache"
          hub="docker.io/fosterstack/cache"
          # per-AC results, copied from the verified acceptance predicate
          gh attestation verify "oci://ghcr.io/${{ github.repository_owner }}/cache-candidates@$(jq -r '.production' <<<'${{ inputs.digests }}')" \
            --repo "${GITHUB_REPOSITORY}" \
            --predicate-type https://fosterstack.com/attestations/acceptance/v1 \
            --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/stage-acceptance-predicate.yml" \
            --format json | jq '.[0].verificationResult.statement.predicate.ac_results' > /tmp/ac-results.json
          jq -c '.[0].verificationResult.statement.predicate.verified_statements' /tmp/auth-production.json > /tmp/verified.json
          jq -R -s '[split("\n")[] | select(length > 0) | split("  ") | {sha256: .[0], name: .[1]}]' \
            /tmp/expected-checksums.txt > /tmp/archives.json
          jq -n \
            --arg version "$ver" \
            --arg sha "${GITHUB_SHA}" \
            --arg generated "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg run "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}" \
            --arg workflow "${GITHUB_WORKFLOW_REF}" \
            --arg ghcr "$ghcr" --arg hub "$hub" \
            --arg baseline "requirements/releases/${ver}.yaml" \
            --arg baseline_sha "$(sha256sum "requirements/releases/${ver}.yaml" | cut -d' ' -f1)" \
            --arg evidence_sha "$(sha256sum test-evidence/mappings.yaml | cut -d' ' -f1)" \
            --argjson digests '${{ inputs.digests }}' \
            --slurpfile archives /tmp/archives.json \
            --slurpfile acs /tmp/ac-results.json \
            --slurpfile statements /tmp/verified.json \
            '{
              version: $version, commit: $sha, generated_at: $generated,
              run: {url: $run, workflow: $workflow},
              images: ($digests | to_entries | map({variant: .key, digest: .value,
                refs: [($ghcr + "@" + .value), ($hub + "@" + .value)]})),
              archives: $archives[0],
              requirements_baseline: {path: $baseline, sha256: $baseline_sha},
              test_evidence: {path: "test-evidence/mappings.yaml", sha256: $evidence_sha},
              verified_statements: $statements[0],
              ac_results: $acs[0]
            }' > /tmp/release-manifest.json
          jq . /tmp/release-manifest.json >/dev/null
          cat /tmp/release-manifest.json

      - name: attach the manifest as an OCI referrer on the public digests
        run: |
          set -euo pipefail
          ghcr="ghcr.io/${{ github.repository_owner }}/cache"
          hub="docker.io/fosterstack/cache"
          for v in production debug fips; do
            d=$(jq -r --arg v "$v" '.[$v]' <<<'${{ inputs.digests }}')
            cosign attest --yes \
              --predicate /tmp/release-manifest.json \
              --type https://fosterstack.com/attestations/release-manifest/v1 \
              "${ghcr}@${d}"
            # Docker Hub referrer support varies; the mirror referrer is
            # best-effort with a loud warning, never a silent skip.
            cosign attest --yes \
              --predicate /tmp/release-manifest.json \
              --type https://fosterstack.com/attestations/release-manifest/v1 \
              "${hub}@${d}" \
              || echo "::warning::could not attach the manifest referrer on ${hub}@${d} — GHCR referrer is authoritative"
          done

      - name: sign the checksums file (customer-verifiable bundle)
        run: |
          set -euo pipefail
          cosign sign-blob --yes dist/checksums.txt \
            --bundle /tmp/checksums.txt.cosign.bundle

      - name: create the draft release and upload every file
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ver="${GITHUB_REF_NAME}"
          gh release create "$ver" --draft --verify-tag \
            --title "fscache ${ver}" \
            --notes "See release-manifest.json for the full evidence bundle: image digests (GHCR canonical, Docker Hub mirror — identical digests), archive checksums, requirements baseline, per-AC acceptance results, and the Rekor log index of every verified statement in the release chain."
          gh release upload "$ver" \
            dist/*.tar.gz dist/checksums.txt /tmp/checksums.txt.cosign.bundle \
            /tmp/release-manifest.json \
            .vex/fosterstack-cache.openvex.json
          if compgen -G 'dist/*.sbom.json' >/dev/null; then
            gh release upload "$ver" dist/*.sbom.json
          else
            echo "::error::no SBOM files in dist — the build stage should have produced them" >&2; exit 1
          fi

      - name: customer-facing verification against the PUBLIC digests
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ghcr="ghcr.io/${{ github.repository_owner }}/cache"
          for v in production debug fips; do
            d=$(jq -r --arg v "$v" '.[$v]' <<<'${{ inputs.digests }}')
            gh attestation verify "oci://${ghcr}@${d}" \
              --repo "${GITHUB_REPOSITORY}" \
              --predicate-type https://fosterstack.com/attestations/release-authorization/v1 \
              --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/stage-authorize.yml" >/dev/null
            echo "public ${v}@${d}: chain verifiable by a customer"
          done

      - name: anonymous-pull check, both registries
        run: |
          set -euo pipefail
          DOCKER_CONFIG=$(mktemp -d); export DOCKER_CONFIG
          ghcr="ghcr.io/${{ github.repository_owner }}/cache"
          hub="docker.io/fosterstack/cache"
          ver="${GITHUB_REF_NAME}"
          for pair in "production:${ver}" "debug:${ver}-debug" "fips:${ver}-fips"; do
            v="${pair%%:*}"; t="${pair#*:}"
            d=$(jq -r --arg v "$v" '.[$v]' <<<'${{ inputs.digests }}')
            for reg in "$ghcr" "$hub"; do
              got=$(crane digest "${reg}:${t}")
              [ "$got" = "$d" ] || { echo "::error::anonymous pull of ${reg}:${t} resolves ${got}, want ${d}" >&2; exit 1; }
            done
          done
          echo "anonymous pulls resolve the promoted digests at both registries"

      - name: undraft — the release is public
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "${GITHUB_REF_NAME}" --draft=false
