# The Rebuild stage of the v0.3.0 release chain (rules 54, 62, 64; REQ-CHAIN-005). Called only from release.yml, after Build.
# `rapk` rebuilds the apks on fresh runners, `rebuild` rebuilds the images and archives and compares EVERY item with Build's items.json.
# The only output is the verdict (witness-rebuild/verdict.json, a product of Rebuild's own record); nothing is published.
# The shape of this file is judged by bin/chain-build-wiring-test.sh (an exact grammar).
name: 'Stage: rebuild'
on:
  workflow_call:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true
      - name: install Witness (pinned by checksum)
        run: ./bin/install-scanner.sh witness
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: witness-build
          path: witness-build
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: digests
          path: build-in
      - name: rapk under Witness
        run: bash bin/witnessed.sh rapk bin/build-stage-rebuild-apk.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rapk-${{ matrix.runner }}
          path: out
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: witness-rapk-${{ matrix.runner }}
          path: witness-rapk
  assemble:
    needs: apk
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true
      - name: install Witness (pinned by checksum)
        run: ./bin/install-scanner.sh witness
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: witness-build
          path: witness-build
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: digests
          path: build-in
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: items
          path: build-in
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: rapk-ubuntu-24.04
          path: rapk/ubuntu-24.04
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: rapk-ubuntu-24.04-arm
          path: rapk/ubuntu-24.04-arm
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: witness-rapk-ubuntu-24.04
          path: rec-rapk/ubuntu-24.04
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: witness-rapk-ubuntu-24.04-arm
          path: rec-rapk/ubuntu-24.04-arm
      - name: rebuild under Witness
        run: bash bin/witnessed.sh rebuild bin/build-stage-rebuild-assemble.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: witness-rebuild
          path: witness-rebuild
