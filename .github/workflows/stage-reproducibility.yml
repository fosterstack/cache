# The Rebuild stage of the v0.3.0 release chain (rules 54, 62, 64; REQ-CHAIN-005). Called only from release.yml, after Build, and, in snapshot mode, from scan.yml
# (the PR gate keeps rule 31's two-assembly reproducibility check). `rapk` rebuilds the apks on fresh runners, `rebuild` rebuilds the images and archives and
# compares EVERY item with Build's items.json. The only output is the verdict (witness-rebuild/verdict.json, or snapshot-verdict.json in snapshot mode, a product
# of Rebuild's own record); nothing is published. `mode` works as in stage-build.yml (REQ-CHAIN-005-AC7).
# The shape of this file is judged by bin/chain-build-wiring-test.sh (an exact grammar).
name: 'Stage: rebuild'
on:
  workflow_call:
    inputs:
      mode:
        description: release or snapshot
        type: string
        default: release
    outputs:
      records:
        description: the sha256 of Rebuild's record, its verdict and each rapk record it consumed, for Sign
        value: ${{ jobs.assemble.outputs.records }}
permissions:
  contents: read
jobs:
  rapk:
    runs-on: ubuntu-24.04
    outputs:
      records: ${{ steps.records.outputs.records }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: the mode is release or snapshot
        env:
          MODE: ${{ inputs.mode }}
        run: bash bin/build-stage-refuse-mode.sh "$MODE"
      - name: install Witness (pinned by checksum)
        run: bash bin/install-scanner.sh witness
      - name: install Go (pinned by checksum)
        run: bash bin/install-scanner.sh go
      - name: install melange (pinned by checksum)
        run: bash bin/install-build-tools.sh melange
      - name: install crane (pinned by checksum)
        run: bash bin/install-scanner.sh crane
      - name: pull the archive by its committed digest
        run: bash bin/archive-pull.sh --pointer build/archive.json --out archive
      - name: unpack the host tools from the archive (bubblewrap for melange's runner)
        run: python3 -I bin/install-host-bwrap.py --archive archive --lock build/locks/host-tools.lock --root host-tools
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.mode == 'release' && 'signed-witness-build' || 'witness-build' }}
          path: witness-build
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: digests
          path: build-in
      - name: rapk under Witness
        if: ${{ inputs.mode == 'release' }}
        run: bash bin/witnessed-local.sh rapk bin/build-stage-rebuild-apk.sh
      - name: snapshot-rapk under Witness
        if: ${{ inputs.mode == 'snapshot' }}
        run: bash bin/witnessed-local.sh snapshot-rapk bin/build-stage-snapshot-rebuild-apk.sh
      - id: records
        name: expose the record digests of this apk job as its output
        if: ${{ inputs.mode == 'release' }}
        run: r=$(bash bin/rebuild-records-digests.sh --rapk ubuntu-24.04 witness-rapk) && echo "records=$r" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rapk-ubuntu-24.04
          path: out
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: witness-rapk-ubuntu-24.04
          path: witness-rapk
  rapk-arm:
    runs-on: ubuntu-24.04-arm
    outputs:
      records: ${{ steps.records.outputs.records }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: the mode is release or snapshot
        env:
          MODE: ${{ inputs.mode }}
        run: bash bin/build-stage-refuse-mode.sh "$MODE"
      - name: install Witness (pinned by checksum)
        run: bash bin/install-scanner.sh witness
      - name: install Go (pinned by checksum)
        run: bash bin/install-scanner.sh go
      - name: install melange (pinned by checksum)
        run: bash bin/install-build-tools.sh melange
      - name: install crane (pinned by checksum)
        run: bash bin/install-scanner.sh crane
      - name: pull the archive by its committed digest
        run: bash bin/archive-pull.sh --pointer build/archive.json --out archive
      - name: unpack the host tools from the archive (bubblewrap for melange's runner)
        run: python3 -I bin/install-host-bwrap.py --archive archive --lock build/locks/host-tools.lock --root host-tools
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.mode == 'release' && 'signed-witness-build' || 'witness-build' }}
          path: witness-build
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: digests
          path: build-in
      - name: rapk under Witness
        if: ${{ inputs.mode == 'release' }}
        run: bash bin/witnessed-local.sh rapk bin/build-stage-rebuild-apk.sh
      - name: snapshot-rapk under Witness
        if: ${{ inputs.mode == 'snapshot' }}
        run: bash bin/witnessed-local.sh snapshot-rapk bin/build-stage-snapshot-rebuild-apk.sh
      - id: records
        name: expose the record digests of this apk job as its output
        if: ${{ inputs.mode == 'release' }}
        run: r=$(bash bin/rebuild-records-digests.sh --rapk ubuntu-24.04-arm witness-rapk) && echo "records=$r" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rapk-ubuntu-24.04-arm
          path: out
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: witness-rapk-ubuntu-24.04-arm
          path: witness-rapk
  assemble:
    needs: [rapk, rapk-arm]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      records: ${{ steps.records.outputs.records }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: the mode is release or snapshot
        env:
          MODE: ${{ inputs.mode }}
        run: bash bin/build-stage-refuse-mode.sh "$MODE"
      - name: install Witness (pinned by checksum)
        run: bash bin/install-scanner.sh witness
      - name: install apko (pinned by checksum)
        run: bash bin/install-build-tools.sh apko
      - name: install crane (pinned by checksum)
        run: bash bin/install-scanner.sh crane
      - name: pull the archive by its committed digest
        run: bash bin/archive-pull.sh --pointer build/archive.json --out archive
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.mode == 'release' && 'signed-witness-build' || 'witness-build' }}
          path: witness-build
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: digests
          path: build-in
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: items
          path: build-in
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rapk-ubuntu-24.04
          path: rapk/ubuntu-24.04
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rapk-ubuntu-24.04-arm
          path: rapk/ubuntu-24.04-arm
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: witness-rapk-ubuntu-24.04
          path: rec-rapk/ubuntu-24.04
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: witness-rapk-ubuntu-24.04-arm
          path: rec-rapk/ubuntu-24.04-arm
      - name: check the rapk records against their jobs' outputs
        if: ${{ inputs.mode == 'release' }}
        env:
          RAPK_RECORDS: ${{ needs.rapk.outputs.records }}
          RAPK_ARM_RECORDS: ${{ needs.rapk-arm.outputs.records }}
        run: bash bin/rebuild-records-digests.sh --check "$RAPK_RECORDS" "$RAPK_ARM_RECORDS"
      - name: rebuild under Witness
        if: ${{ inputs.mode == 'release' }}
        run: bash bin/witnessed-local.sh rebuild bin/build-stage-rebuild-assemble.sh
      - name: snapshot-rebuild under Witness
        if: ${{ inputs.mode == 'snapshot' }}
        run: bash bin/witnessed-local.sh snapshot-rebuild bin/build-stage-snapshot-rebuild-assemble.sh
      - id: records
        name: expose the record digests as the stage output
        if: ${{ inputs.mode == 'release' }}
        run: r=$(bash bin/rebuild-records-digests.sh witness-rebuild rec-rapk/ubuntu-24.04 rec-rapk/ubuntu-24.04-arm) && echo "records=$r" >> "$GITHUB_OUTPUT"
      # always(): the verdict (snapshot-verdict.json in snapshot mode) is the only place the per-image digests and the differing items are readable, failed comparison or not
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: witness-rebuild
          path: witness-rebuild
