# The Check stage of the v0.3.0 release chain (rules 55, 58, 66, 68, 70; REQ-CHAIN-006). Called only from release.yml, after Build, beside Rebuild and Sign.
# It downloads Build's artifacts (the candidate images as OCI layout directories, the digest list, the dist archives to scan alongside the images),
# then installs the listed scanners (grype, osv-scanner) by checksum and the pinned Go, takes govulncheck from the govulncheck-build job (below), and runs three Witness steps through the one helper: scanners, acceptance and runtime. Each step first verifies Build's record (bin/check-stage.sh),
# then runs its checks as listed plain scripts. No registry login, no packages permission, no secret: the stage only reads what the earlier stages made.
# govulncheck publishes no release binary, so it is built from the committed tools/govulncheck module (go.sum is the pin) in its own job, govulncheck-build, which holds no
# credential (REQ-REL-011-AC1: a job that holds a credential never builds). The check job, which holds no identity token either (its records are made with a throwaway key and signed by Sign), downloads that binary and installs it only
# after download-artifact's own digest check passed (it fails the step when the downloaded artifact's digest differs from the one GitHub recorded at upload; no override is set). The download
# is by the artifact id that govulncheck-build exports, not by name, so an artifact another job of the run uploads under the same name is not the one it gets. The digest check and the id prove
# only that the artifact arrived intact and is the one that job uploaded; the guarantee is that no build runs in a job that holds a credential.
# The limit of the job boundary: these jobs hold no secret, no environment, no id-token and no packages permission, but the run's artifact token is in every job, so a step of a
# job can reach the run's artifacts. Sign therefore trusts no artifact by its place: it checks each record against the digest lists the jobs publish as job outputs.
# The shape of this file is judged by bin/chain-check-wiring-test.sh (an exact grammar).
name: 'Stage: check'
on:
  workflow_call:
    outputs:
      records:
        description: the sha256 of each record file of the check job (witness-scanners, witness-acceptance, witness-runtime), for Sign
        value: ${{ jobs.check.outputs.records }}
      records-arm64:
        description: the sha256 of the record file of the check-arm64 job (witness-arm64), for Sign
        value: ${{ jobs.check-arm64.outputs.records-arm64 }}
permissions:
  contents: read
jobs:
  govulncheck-build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: install Go (pinned by checksum)
        run: bash bin/install-scanner.sh go
      - name: build govulncheck (pinned by go.sum)
        run: bash bin/install-scanner.sh govulncheck
      - name: place the built govulncheck for upload
        run: bash bin/pack-govulncheck.sh
      - id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: govulncheck
          path: govulncheck-out/govulncheck
  check:
    needs: govulncheck-build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      records: ${{ steps.records.outputs.records }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: install Witness (pinned by checksum)
        run: bash bin/install-scanner.sh witness
      - name: install grype (pinned by checksum)
        run: bash bin/install-scanner.sh grype
      - name: install osv-scanner (pinned by checksum)
        run: bash bin/install-scanner.sh osv-scanner
      - name: install Go (pinned by checksum)
        run: bash bin/install-scanner.sh go
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.govulncheck-build.outputs.artifact-id }}
          path: govulncheck-dl
      - name: install govulncheck from its build job (its download was digest-checked)
        run: bash bin/unpack-govulncheck.sh
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: signed-witness-build
          path: witness-build
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: digests
          path: witness-build
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: images
          path: images
      - name: scanners under Witness
        run: bash bin/witnessed-local.sh scanners bin/check-phase-scanners.sh
      - name: acceptance under Witness
        run: bash bin/witnessed-local.sh acceptance bin/check-phase-acceptance.sh
      - name: runtime under Witness
        run: bash bin/witnessed-local.sh runtime bin/check-phase-runtime.sh
      - id: records
        name: expose the record digests as the stage output
        run: r=$(bash bin/check-records-digests.sh witness-scanners witness-acceptance witness-runtime) && echo "records=$r" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: witness-check
          path: |
            witness-scanners
            witness-acceptance
            witness-runtime
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: check-results
          path: check-results
  # The arm64 leg (REQ-CHAIN-006-AC17): the artifact checks for the linux/arm64 binaries and images, on a hosted arm64 runner, with its own Witness record.
  check-arm64:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
    outputs:
      records-arm64: ${{ steps.records-arm64.outputs.records-arm64 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: install Witness (pinned by checksum)
        run: bash bin/install-scanner.sh witness
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: signed-witness-build
          path: witness-build
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: digests
          path: witness-build
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: images
          path: images
      - name: arm64 under Witness
        run: bash bin/witnessed-local.sh arm64 bin/check-phase-arm64.sh
      - id: records-arm64
        name: expose the record digest as the stage output
        run: r=$(bash bin/check-records-digests.sh witness-arm64) && echo "records-arm64=$r" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: witness-check-arm64
          path: witness-arm64
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: check-results-arm64
          path: check-results
