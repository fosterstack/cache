name: supply-chain

# REQ-SUP-001 (owner ratified Oct 5): the actions supply-chain checks.
#   pin-age        every push to main: the scan names every version the push moves and passes only a pin it can
#                  read (AC2). It runs the checker of the commit before the push against the pushed tree, never on
#                  pull_request or pull_request_target, with a read-only token and nothing secret.
#   daily-audit    once a day: the inventory, advisories, malicious-package reports, upstream reachability, disputed hits (AC5, AC7-AC10).
# It never produces a run, environment or secret name (AC8): the private details are written on the owner's machine, not here.

on:
  push:
    branches: [main]
  schedule:
    - cron: '53 3 * * *'    # off-peak, clear of the auditor, rescan and freshness crons (the 1,000/hour token limit is shared by the repo)
  workflow_dispatch: {}

# A pull request's FIRST run attempt of this workflow shares a group with the pull request's other first attempts, so a newer push cancels its older run. Every other run (whatever
# its event, and any re-run of any head) gets a group of its own per run and attempt: it is never cancelled, never replaced as a pending run, and a re-run of an old head cancels
# nothing. The prefix is a literal, not github.workflow, so no workflow name can collide with another's group.
concurrency:
  group: ${{ github.event_name == 'pull_request' && github.run_attempt == '1' && format('supply-chain-pr-{0}', github.event.pull_request.number) || format('supply-chain-{0}-{1}', github.run_id, github.run_attempt) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  pin-age:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Trusted checker (the commit before the push)
        if: github.event_name == 'push'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.before }}
          path: trusted
          persist-credentials: false
      - name: The pushed tree
        if: github.event_name == 'push'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: pr
          fetch-depth: 0
          persist-credentials: false
      - name: Every moved version, and what advisories say about it
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -uo pipefail
          status=0
          python3 trusted/.github/agent/supply-chain/pin-age-check.py --root pr --base ${{ github.event.before }} --head ${{ github.sha }} || status=1
          # the advisor's rulings come from the commit before the push too: the push must not bring its own
          exceptions=trusted/.github/supply-chain-exceptions.json
          if [ ! -f "$exceptions" ]; then
            exceptions="$RUNNER_TEMP/no-exceptions.json"
            echo '{"exceptions": []}' > "$exceptions"
          fi
          python3 trusted/.github/agent/supply-chain/pin-audit.py --root pr --base ${{ github.event.before }} --head ${{ github.sha }} --exceptions "$exceptions" --report-only || status=1
          exit $status

  daily-audit:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    concurrency:
      group: supply-chain-daily   # two runs at once (a manual dispatch and the cron) must not both file an issue
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Audit
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python3 .github/agent/supply-chain/pin-audit.py
