name: supply-chain

# REQ-SUP-001 (owner ratified Oct 5): the actions supply-chain checks.
#   pin-age        every pull request: a version the PR moves must be public 7 days by a server-side time (AC2-AC4). It runs the base branch's
#                  checker against the PR's tree, on pull_request (never pull_request_target), with a read-only token and nothing secret.
#   daily-audit    once a day: the inventory, advisories, malicious-package reports, upstream reachability, disputed hits (AC5, AC7-AC10).
#   rerun-held     once a day: re-runs the pin-age check of a held PR whose moved versions have reached 7 days (AC6). The only job with actions: write.
#   evidence-letter-present  once a day: from the 3rd of the month, last month's evidence letter must be on a
#                  published release and verify (REQ-REL-013). Read-only.
# It never produces a run, environment or secret name (AC8): the private details are written on the owner's machine, not here.

on:
  pull_request: {}
  schedule:
    - cron: '53 3 * * *'    # off-peak, clear of the auditor, rescan and freshness crons (the 1,000/hour token limit is shared by the repo)
  workflow_dispatch: {}

# A pull request's FIRST run attempt of this workflow shares a group with the pull request's other first attempts, so a newer push cancels its older run. Every other run (whatever
# its event, and any re-run of any head) gets a group of its own per run and attempt: it is never cancelled, never replaced as a pending run, and a re-run of an old head cancels
# nothing. The prefix is a literal, not github.workflow, so no workflow name can collide with another's group.
concurrency:
  group: ${{ github.event_name == 'pull_request' && github.run_attempt == '1' && format('supply-chain-pr-{0}', github.event.pull_request.number) || format('supply-chain-{0}-{1}', github.run_id, github.run_attempt) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  pin-age:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read   # reads the tag observations of our scheduled runs (an action's age); read-only
      checks: read    # the PR clock reads every check suite of the introducing commit; read-only
    steps:
      - name: Trusted checker (the base branch)
        if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          persist-credentials: false
      - name: The pull request's tree
        if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: pr
          fetch-depth: 0
          persist-credentials: false
      - name: Age of every moved version, and what advisories say about it
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -uo pipefail
          status=0
          python3 trusted/.github/agent/supply-chain/pin-age-check.py --root pr --base ${{ github.event.pull_request.base.sha }} --head ${{ github.event.pull_request.head.sha }} || status=1
          # the advisor's rulings come from the base branch too: a pull request must not bring its own
          exceptions=trusted/.github/supply-chain-exceptions.json
          if [ ! -f "$exceptions" ]; then
            exceptions="$RUNNER_TEMP/no-exceptions.json"
            echo '{"exceptions": []}' > "$exceptions"
          fi
          python3 trusted/.github/agent/supply-chain/pin-audit.py --root pr --base ${{ github.event.pull_request.base.sha }} --head ${{ github.event.pull_request.head.sha }} --exceptions "$exceptions" --report-only || status=1
          exit $status

  daily-audit:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    concurrency:
      group: supply-chain-daily   # two runs at once (a manual dispatch and the cron) must not both file an issue
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write
      actions: read   # reads the previous tag observations to extend them; read-only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Audit
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python3 .github/agent/supply-chain/pin-audit.py --observations-out "$RUNNER_TEMP/tag-observations/state.json"
      - name: Keep the tag observations (an action's age is when WE first saw its tag at that commit)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tag-observations
          path: ${{ runner.temp }}/tag-observations/state.json
          retention-days: 90
          if-no-files-found: error

  rerun-held:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: write
      contents: read
      pull-requests: read
      checks: read    # the PR clock of a held PR reads every check suite of its introducing commit
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Re-run held pull requests whose versions are old enough
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python3 .github/agent/supply-chain/pin-audit.py --rerun-held

  evidence-letter-present:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read    # the monthly evidence letter's daily presence check reads published releases and writes nothing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: install cosign (pinned by checksum)
        run: bash bin/install-scanner.sh cosign
      - name: Last month's evidence letter is on a published release and verifies
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash bin/evidence-letter-present.sh
