name: package build in its own VM (spike)

on:
  pull_request:
    branches:
      - chain-v030

permissions:
  contents: read

env:
  ALPINE_BRANCH: v3.24
  ALPINE_KERNEL_VERSION: 6.18.60-r0
  APORTS_SHA: 3150f5e6f1fc3f871a89ec8cb82ed183c05c6185

defaults:
  run:
    shell: bash

jobs:
  vm:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: vm-arm
            kind: arm
            runner: ubuntu-24.04-arm
            arch: aarch64
            timeout: 40
    env:
      KIND: ${{ matrix.kind }}
      TARGET_ARCH: ${{ matrix.arch }}
      MATRIX_HOST: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: KVM for the runner user (the three documented lines)
        if: ${{ matrix.kind != 'arm64-tcg' }}
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          W="$RUNNER_TEMP/spike"; mkdir -p "$W"
          if [ -c /dev/kvm ] && [ -r /dev/kvm ] && [ -w /dev/kvm ]; then echo "KVM PASS: /dev/kvm present, mode $(stat -c %a /dev/kvm), readable and writable by $(id -un)" | tee -a "$W/results.txt"
          elif [ "$KIND" = arm ]; then echo "KVM NOTE: no usable /dev/kvm on this arm runner ($(ls -l /dev/kvm 2>&1 | head -n 1))" | tee -a "$W/results.txt"
          else echo "KVM FAIL: /dev/kvm missing or not accessible to $(id -un)" | tee -a "$W/results.txt"; exit 1; fi
      - name: "tools and keys"
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          W="$RUNNER_TEMP/spike"; mkdir -p "$W"
          R() { printf '%s\n' "$*" | tee -a "$W/results.txt"; }
          HOST_ARCH=$MATRIX_HOST
          RUN_UID=$(id -u); RUN_GID=$(id -g)
          TA=${TARGET_ARCH:-x86_64}
          HOSTPKG=qemu-system-$TA
          # run a command as the runner user inside a new network namespace with only loopback up (root creates the namespace only)
          in_netns() { sudo -n /usr/bin/unshare -n /bin/bash "$W/src/netns-run.sh" "$RUN_UID" "$RUN_GID" "$HOME" "$W/tmp" "$@"; }
          mkdir -p "$W"/{bin,src,keys,cfg,lock,tmp,home}
          # the build tools, pinned by checksum by the repository's own installer
          bash bin/install-build-tools.sh melange "$W/bin"
          bash bin/install-build-tools.sh apko "$W/bin"
          # the Wolfi key: its sha256 must be the one the repository pins
          curl -sfL --max-time 60 -o "$W/keys/wolfi-signing.rsa.pub" https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
          pin=$(awk '$1=="wolfi-signing.rsa.pub" {sub("sha256:", "", $2); print $2}' build/locks/archive-keys.sha256)
          got=$(sha256sum "$W/keys/wolfi-signing.rsa.pub" | cut -d' ' -f1)
          if [ -n "$pin" ] && [ "$pin" = "$got" ]; then R "KEY wolfi-signing.rsa.pub sha256:$got equals the repository pin"; else R "FETCH FAIL key mismatch: wolfi-signing.rsa.pub sha256:$got, pin '$pin'"; exit 1; fi
          # the Alpine key (a different one signs each architecture's index): from independent sources at one aports commit; at least two must answer with the same bytes
          case "$TA" in
            x86_64) AKEY=alpine-devel@lists.alpinelinux.org-6165ee59.rsa.pub;;
            aarch64) AKEY=alpine-devel@lists.alpinelinux.org-616ae350.rsa.pub;;
          esac
          n=0; first=""; ok=yes
          for u in "https://alpinelinux.org/keys/$AKEY" \
                   "https://gitlab.alpinelinux.org/alpine/aports/-/raw/$APORTS_SHA/main/alpine-keys/$AKEY" \
                   "https://git.alpinelinux.org/aports/plain/main/alpine-keys/$AKEY?id=$APORTS_SHA"; do
            code=$(curl -s -L -o "$W/keys/alp.tmp" -w '%{http_code}' --max-time 60 "$u" || echo curl-failed)
            sum=$(sha256sum "$W/keys/alp.tmp" | cut -d' ' -f1)
            if [ "$code" = 200 ] && grep -q 'BEGIN PUBLIC KEY' "$W/keys/alp.tmp"; then
              n=$((n + 1)); R "KEY source http=$code sha256:$sum $u"
              if [ -z "$first" ]; then first=$sum; cp "$W/keys/alp.tmp" "$W/keys/alpine-1.pub"; elif [ "$first" != "$sum" ]; then ok=no; fi
            else R "KEY source http=$code (not used) $u"; fi
          done
          if [ "$ok" = yes ] && [ "$n" -ge 2 ]; then R "KEY $AKEY sha256:$first from $n independent sources, all equal"
          else R "FETCH FAIL key mismatch: $AKEY answered by $n sources, equal=$ok"; fi
      - name: "helper programs"
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          W="$RUNNER_TEMP/spike"; mkdir -p "$W"
          R() { printf '%s\n' "$*" | tee -a "$W/results.txt"; }
          HOST_ARCH=$MATRIX_HOST
          RUN_UID=$(id -u); RUN_GID=$(id -g)
          TA=${TARGET_ARCH:-x86_64}
          HOSTPKG=qemu-system-$TA
          # run a command as the runner user inside a new network namespace with only loopback up (root creates the namespace only)
          in_netns() { sudo -n /usr/bin/unshare -n /bin/bash "$W/src/netns-run.sh" "$RUN_UID" "$RUN_GID" "$HOME" "$W/tmp" "$@"; }
          # helper programs of the spike (python, standard library only), written here so the workflow is one file
          cat > "$W/src/fetch.py" <<'PYEOF'
          import base64, hashlib, importlib.util, io, json, os, re, subprocess, sys, tarfile, tempfile, urllib.request
          want, outdir, key, ihb, index_url, prefix = sys.argv[1:7]
          spec = importlib.util.spec_from_file_location("ihb", ihb); m = importlib.util.module_from_spec(spec); spec.loader.exec_module(m)
          raw = urllib.request.urlopen(index_url, timeout=120).read()
          parts = m.members(raw, "APKINDEX.tar.gz")
          sig_tar = tarfile.open(fileobj=io.BytesIO(parts[0][1]), mode="r:")
          signame = [n for n in sig_tar.getnames() if n.startswith(".SIGN.RSA")]
          assert len(signame) == 1, signame
          alg = "sha256" if signame[0].startswith(".SIGN.RSA256.") else "sha1"
          keyname = signame[0].split(".", 3)[3]
          pem = re.search(r"-----BEGIN PUBLIC KEY-----\n[A-Za-z0-9+/=\n]+?-----END PUBLIC KEY-----\n", open(key).read()).group(0)
          with tempfile.TemporaryDirectory() as d:
              open(d + "/k.pem", "w").write(pem); open(d + "/s.bin", "wb").write(sig_tar.extractfile(signame[0]).read()); open(d + "/i.bin", "wb").write(parts[1][0])
              r = subprocess.run(["/usr/bin/openssl", "dgst", "-" + alg, "-verify", d + "/k.pem", "-signature", d + "/s.bin", d + "/i.bin"], capture_output=True, text=True)
          if r.returncode != 0 or "Verified OK" not in r.stdout:
              print("FETCH FAIL index signature does not verify against", key); sys.exit(1)
          idx = {}
          for rec in tarfile.open(fileobj=io.BytesIO(parts[1][1]), mode="r:").extractfile("APKINDEX").read().decode().split("\n\n"):
              f = dict(l.split(":", 1) for l in rec.splitlines() if ":" in l)
              if "P" in f: idx[(f["P"], f["V"], f.get("A"))] = (f["C"], f.get("t", "-"))
          print("FETCH-INDEX %s sha256:%s sig:verified:%s(%s) packages:%d" % (index_url, hashlib.sha256(raw).hexdigest(), keyname, alg, len(idx)))
          bad = 0
          for p in json.load(open(want)):
              name, ver, arch, url = p["name"], p["version"], p["architecture"], p["url"]
              assert url.startswith(prefix), url
              dest = os.path.join(outdir, arch); os.makedirs(dest, exist_ok=True)
              path = os.path.join(dest, "%s-%s.apk" % (name, ver))
              body = urllib.request.urlopen(url, timeout=300).read()
              open(path, "wb").write(body)
              pp = m.members(body, path)
              chk = "Q1" + base64.b64encode(hashlib.sha1(pp[-2][0]).digest()).decode()
              info = m.pkginfo(pp[-2][1], path)
              dh = hashlib.sha256(pp[-1][0]).hexdigest() == info.get("datahash")
              ic, it = idx.get((name, ver, arch), (None, "-"))
              inidx = ic == chk and (p.get("checksum") in (None, chk))
              ok = dh and inidx
              print(("FETCH %s %s %s sha256:%s index-checksum:match datahash:ok index-build-time:%s" % (name, ver, arch, hashlib.sha256(body).hexdigest(), it))
                    if ok else "FETCH FAIL %s %s index-checksum=%s datahash=%s" % (name, ver, inidx, dh))
              bad += 0 if ok else 1
          sys.exit(1 if bad else 0)
          PYEOF
          cat > "$W/src/unpack.py" <<'PYEOF'
          import importlib.util, io, os, sys, tarfile
          rows, archive, root, ihb, arch = sys.argv[1:6]
          spec = importlib.util.spec_from_file_location("ihb", ihb); m = importlib.util.module_from_spec(spec); spec.loader.exec_module(m)
          os.makedirs(root)
          n = 0
          for row in open(rows).read().split("\n"):
              if not row: continue
              name, ver = row.split("=", 1)
              raw = open("%s/%s/%s-%s.apk" % (archive, arch, name, ver), "rb").read()
              t = tarfile.open(fileobj=io.BytesIO(m.members(raw, name)[-1][1]), mode="r:")
              for mem in t.getmembers():
                  p = os.path.normpath(mem.name)
                  if p.startswith("/") or p.startswith(".."): print("UNPACK skip", name, mem.name); continue
                  if mem.issym() and mem.linkname.startswith("/"): print("UNPACK skip absolute link", name, mem.name); continue
                  if mem.isdev() or mem.isfifo(): print("UNPACK skip device", name, mem.name); continue
                  if os.path.islink(os.path.join(root, p)) and mem.isdir(): continue
                  t.extract(mem, root, filter="tar")
                  n += 1
          print("UNPACK done: %d entries into %s" % (n, root))
          PYEOF
          cat > "$W/src/kernel.py" <<'PYEOF'
          import hashlib, importlib.util, io, os, sys, tarfile
          apk, ihb, out = sys.argv[1:4]
          spec = importlib.util.spec_from_file_location("ihb", ihb); m = importlib.util.module_from_spec(spec); spec.loader.exec_module(m)
          t = tarfile.open(fileobj=io.BytesIO(m.members(open(apk, "rb").read(), apk)[-1][1]), mode="r:")
          os.makedirs(out)
          n = 0
          for mem in t.getmembers():
              p = os.path.normpath(mem.name)
              if p.startswith(("/", "..")): raise SystemExit("KERNEL FAIL path " + mem.name)
              if p.startswith("boot/vmlinuz") and mem.isreg():
                  t.extract(mem, out, filter="data"); os.rename(os.path.join(out, p), os.path.join(out, "vmlinuz")); n += 1
              elif p.startswith("lib/modules/") and (mem.isreg() or mem.isdir()):
                  t.extract(mem, out, filter="data"); n += 1
              elif p.startswith("lib/modules/") and mem.issym():
                  print("KERNEL note: symlink in the modules tree skipped:", mem.name, "->", mem.linkname)
          vm = os.path.join(out, "vmlinuz")
          assert os.path.isfile(vm), "no vmlinuz in the apk"
          os.rename(os.path.join(out, "lib/modules"), os.path.join(out, "modules"))
          print("KERNEL image sha256:%s bytes:%d modules:%s entries:%d" % (hashlib.sha256(open(vm, "rb").read()).hexdigest(), os.path.getsize(vm), sorted(os.listdir(os.path.join(out, "modules"))), n))
          PYEOF
          # the command that runs inside the new network namespace: loopback up, then everything unprivileged
          cat > "$W/src/netns-run.sh" <<'SHEOF'
          #!/bin/bash
          # args: UID GID HOME TMPDIR COMMAND...   (runs as root in a fresh network namespace)
          set -eu
          u=$1; g=$2; h=$3; t=$4; shift 4
          /usr/sbin/ip link set lo up
          exec /usr/bin/setpriv --reuid="$u" --regid="$g" --clear-groups /usr/bin/env HOME="$h" TMPDIR="$t" "$@"
          SHEOF
          chmod 0755 "$W/src/netns-run.sh"
          cp bin/install-host-bwrap.py "$W/src/install-host-bwrap.py"
          cp bin/apk-tool.py "$W/src/apk-tool.py"
      - name: "FETCH (spike only: Wolfi closures, Alpine kernel)"
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          W="$RUNNER_TEMP/spike"; mkdir -p "$W"
          R() { printf '%s\n' "$*" | tee -a "$W/results.txt"; }
          HOST_ARCH=$MATRIX_HOST
          RUN_UID=$(id -u); RUN_GID=$(id -g)
          TA=${TARGET_ARCH:-x86_64}
          HOSTPKG=qemu-system-$TA
          # run a command as the runner user inside a new network namespace with only loopback up (root creates the namespace only)
          in_netns() { sudo -n /usr/bin/unshare -n /bin/bash "$W/src/netns-run.sh" "$RUN_UID" "$RUN_GID" "$HOME" "$W/tmp" "$@"; }
          cd "$GITHUB_WORKSPACE"
          mkdir -p "$W/lock" "$W/cfg"
          lock_to_want() { python3 -I -c '
          import json, sys
          d = json.load(open(sys.argv[1]))["contents"]["packages"]
          json.dump([{"name": p["name"], "version": p["version"], "architecture": p["architecture"], "url": p["url"], "checksum": p["checksum"]} for p in d], open(sys.argv[2], "w"))
          print(len(d))' "$1" "$2"; }
          # 1. the packages that run on the runner: QEMU and what it needs (Wolfi, x86_64 hosted)
          cat > "$W/cfg/host.yaml" <<YEOF
          contents:
            repositories:
              - https://packages.wolfi.dev/os
            keyring:
              - $W/keys/wolfi-signing.rsa.pub
            packages:
              - $HOSTPKG
          archs:
            - $HOST_ARCH
          YEOF
          "$W/bin/apko" lock "$W/cfg/host.yaml" --output "$W/lock/host.lock.json" >/dev/null
          n=$(lock_to_want "$W/lock/host.lock.json" "$W/lock/host.want.json")
          python3 -I "$W/src/fetch.py" "$W/lock/host.want.json" "$W/dl-host" "$W/keys/wolfi-signing.rsa.pub" "$W/src/install-host-bwrap.py" \
            https://packages.wolfi.dev/os/$HOST_ARCH/APKINDEX.tar.gz https://packages.wolfi.dev/os/ | tee "$W/fetch-host.log"
          R "FETCH host closure ($HOSTPKG): $n packages, $(grep -c '^FETCH FAIL' "$W/fetch-host.log" || true) failed"
          # 2. the packages that run in the guest: the init and a shell, for the TARGET architecture
          cat > "$W/cfg/guest.yaml" <<YEOF
          contents:
            repositories:
              - https://packages.wolfi.dev/os
            keyring:
              - $W/keys/wolfi-signing.rsa.pub
            packages:
              - microvm-init
              - busybox
              - wget
              - ca-certificates-bundle
          archs:
            - $TA
          YEOF
          "$W/bin/apko" lock "$W/cfg/guest.yaml" --output "$W/lock/guest.lock.json" >/dev/null
          n=$(lock_to_want "$W/lock/guest.lock.json" "$W/lock/guest.want.json")
          python3 -I "$W/src/fetch.py" "$W/lock/guest.want.json" "$W/repo" "$W/keys/wolfi-signing.rsa.pub" "$W/src/install-host-bwrap.py" \
            "https://packages.wolfi.dev/os/$TA/APKINDEX.tar.gz" https://packages.wolfi.dev/os/ | tee "$W/fetch-guest.log"
          R "FETCH guest closure ($TA: microvm-init, busybox): $n packages, $(grep -c '^FETCH FAIL' "$W/fetch-guest.log" || true) failed"
          # 3. the kernel: Alpine stable, one exact version, index signature checked against the key from two places
          printf '[{"name": "linux-virt", "version": "%s", "architecture": "%s", "url": "https://dl-cdn.alpinelinux.org/alpine/%s/main/%s/linux-virt-%s.apk"}]' \
            "$ALPINE_KERNEL_VERSION" "$TA" "$ALPINE_BRANCH" "$TA" "$ALPINE_KERNEL_VERSION" > "$W/lock/kernel.want.json"
          python3 -I "$W/src/fetch.py" "$W/lock/kernel.want.json" "$W/dl-kernel" "$W/keys/alpine-1.pub" "$W/src/install-host-bwrap.py" \
            "https://dl-cdn.alpinelinux.org/alpine/$ALPINE_BRANCH/main/$TA/APKINDEX.tar.gz" "https://dl-cdn.alpinelinux.org/alpine/$ALPINE_BRANCH/main/" | tee "$W/fetch-kernel.log"
          python3 -I "$W/src/kernel.py" "$W/dl-kernel/$TA/linux-virt-$ALPINE_KERNEL_VERSION.apk" "$W/src/install-host-bwrap.py" "$W/kernel-$TA" | tee "$W/kernel.log"
          sha256sum "$W/kernel-$TA/vmlinuz" | cut -d' ' -f1 > "$W/kernel.sha"
          R "FETCH kernel linux-virt $ALPINE_KERNEL_VERSION ($TA): $(grep '^FETCH linux-virt' "$W/fetch-kernel.log" | sed 's/^FETCH //')"
          if grep -q 'FETCH FAIL' "$W/fetch-host.log" "$W/fetch-guest.log" "$W/fetch-kernel.log"; then R "FETCH FAIL: see the step log"; exit 1; fi
          touch "$W/fetch.ok"
          echo "datahash note: every apk's data segment sha256 equals the datahash its control segment records (checked in fetch.py); Wolfi apks carry no signature of their own, the signed index binds each by checksum; the Alpine apk is bound the same way by its signed index"
      - name: "U3 and U4 (QEMU from the closure, initramfs offline)"
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          W="$RUNNER_TEMP/spike"; mkdir -p "$W"
          R() { printf '%s\n' "$*" | tee -a "$W/results.txt"; }
          HOST_ARCH=$MATRIX_HOST
          RUN_UID=$(id -u); RUN_GID=$(id -g)
          TA=${TARGET_ARCH:-x86_64}
          HOSTPKG=qemu-system-$TA
          # run a command as the runner user inside a new network namespace with only loopback up (root creates the namespace only)
          in_netns() { sudo -n /usr/bin/unshare -n /bin/bash "$W/src/netns-run.sh" "$RUN_UID" "$RUN_GID" "$HOME" "$W/tmp" "$@"; }
          cd "$GITHUB_WORKSPACE"
          [ -f "$W/fetch.ok" ] || { R "SKIP: U3/U4 not run, FETCH did not finish"; exit 1; }
          python3 -I -c '
          import json, sys
          open(sys.argv[2], "w").write("".join("%s=%s\n" % (p["name"], p["version"]) for p in json.load(open(sys.argv[1]))))' "$W/lock/host.want.json" "$W/lock/host.rows"
          # what the strict installer of the repository (bubblewrap's) says about this closure: information for the real inputs PR
          sed -e "s#usr/bin/bwrap#usr/bin/$HOSTPKG#g" "$W/src/install-host-bwrap.py" > "$W/src/install-host-strict.py"
          if python3 -I "$W/src/install-host-strict.py" --archive "$W/dl-host" --lock "$W/lock/host.rows" --root "$W/strict-try" --bin "$W/strict-bin" > "$W/strict.out" 2>&1; then
            R "U3 note: the strict installer (install-host-bwrap.py with the binary name changed) unpacks this closure"
          else
            R "U3 note: the strict installer refuses this closure: $(grep -v 'skipped absolute link' "$W/strict.out" | tail -1 | cut -c1-220)"
            grep -v '^wolfi-baselayout=' "$W/lock/host.rows" > "$W/lock/host.nobase.rows"
            if python3 -I "$W/src/install-host-strict.py" --archive "$W/dl-host" --lock "$W/lock/host.nobase.rows" --root "$W/strict-try2" --bin "$W/strict-bin2" > "$W/strict2.out" 2>&1; then
              R "U3 note: without wolfi-baselayout the strict installer unpacks it"
            else R "U3 note: without wolfi-baselayout the strict installer still refuses: $(grep -v 'skipped absolute link' "$W/strict2.out" | tail -1 | cut -c1-220)"; fi
          fi
          # the spike's own lenient unpack (tar filter, no link or device tricks): the closure goes into host-tools
          python3 -I "$W/src/unpack.py" "$W/lock/host.rows" "$W/dl-host" "$W/host-tools" "$W/src/install-host-bwrap.py" "$HOST_ARCH" | tail -1
          ld=$(ls "$W"/host-tools/usr/lib/ld-linux-*.so.*)
          cat > "$W/qemu-wrapper" <<WEOF
          #!/bin/sh
          R=$W/host-tools
          export QEMU_MODULE_DIR=\$R/usr/lib/qemu
          # no /dev/kvm (the arm hosted runner): melange asks for -accel kvm and -cpu host; the wrapper turns them into tcg and max
          if [ ! -w /dev/kvm ]; then
            prev=""; n=\$#
            while [ \$n -gt 0 ]; do
              a=\$1; shift; n=\$((n - 1)); o=\$a
              if [ "\$prev" = -accel ] && [ "\$a" = kvm ]; then a=tcg,thread=multi; fi
              if [ "\$prev" = -cpu ] && [ "\$a" = host ]; then a=max; fi
              set -- "\$@" "\$a"; prev=\$o
            done
          fi
          # diagnostic: the kernel command line without quiet and with loglevel=7; keep a copy of the initrd melange hands to qemu
          prev=""; n=\$#
          while [ \$n -gt 0 ]; do
            a=\$1; shift; n=\$((n - 1)); o=\$a
            if [ "\$prev" = -append ]; then a=\$(printf '%s' "\$a" | sed -e 's/ quiet / /' -e 's/\$/ loglevel=7/'); fi
            if [ "\$prev" = -initrd ] && [ -f "\$a" ]; then cp "\$a" $W/initrd-copy.cpio; fi
            set -- "\$@" "\$a"; prev=\$o
          done
          echo "qemu-wrapper args: \$*" >> $W/qemu-args.log
          exec $ld --library-path \$R/usr/lib:\$R/usr/lib64:\$R/lib \$R/usr/bin/$HOSTPKG -L \$R/usr/share/qemu "\$@"
          WEOF
          sudo install -m 0755 "$W/qemu-wrapper" "/usr/local/bin/$HOSTPKG"
          # melange only looks for the qemu of the machine it runs on (qemu-system-x86_64 here: exec.LookPath, qemu_runner.go) even when it builds another architecture;
          # a stub that exits at once satisfies the lookup, nothing ever runs it as a VM
          if [ "$HOSTPKG" != "qemu-system-$HOST_ARCH" ]; then
            printf '#!/bin/sh\necho "spike stub: only present so melange finds a qemu for the host architecture" >&2\nexit 1\n' > "$W/qemu-stub-x86"
            sudo install -m 0755 "$W/qemu-stub-x86" /usr/local/bin/qemu-system-$HOST_ARCH
            R "U3 note: melange's usability check looks for qemu-system-x86_64 on PATH when it builds $TA; a stub is installed for that lookup"
          fi
          ver=$("/usr/local/bin/$HOSTPKG" --version | head -n 1)
          machines=$("/usr/local/bin/$HOSTPKG" -M help | grep -cE '^(microvm|virt) ' || true)
          if [ "$machines" -ge 1 ]; then R "U3 PASS: $ver runs from the unpacked archive closure ($(wc -l < "$W/lock/host.rows") packages, no package manager), machine type listed; accelerators: $("/usr/local/bin/$HOSTPKG" -accel help 2>&1 | tr '\n' ' ')"
          else R "U3 FAIL: $HOSTPKG does not list the machine type ($ver)"; exit 1; fi
          # the initramfs, offline: a local repository (indexed with a key made here), built twice under a cut network
          "$W/bin/melange" keygen "$W/spike.rsa" >/dev/null 2>&1
          "$W/bin/melange" index --signing-key "$W/spike.rsa" -o "$W/repo/$TA/APKINDEX.tar.gz" "$W"/repo/$TA/*.apk >/dev/null 2>&1
          for i in 1 2; do
            if ! in_netns /usr/bin/env -i PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin "$W/bin/melange" initramfs --arch "$TA" \
                 --repository "$W/repo" --keyring "$W/spike.rsa.pub" --keyring "$W/keys/wolfi-signing.rsa.pub" -o "$W/initramfs-$i.cpio" > "$W/initramfs-$i.log" 2>&1; then
              R "U4 FAIL: melange initramfs (build $i) did not finish offline: $(tail -n 2 "$W/initramfs-$i.log" | tr '\n' ' ' | cut -c1-240)"; exit 1
            fi
          done
          a=$(sha256sum "$W/initramfs-1.cpio" | cut -d' ' -f1); b=$(sha256sum "$W/initramfs-2.cpio" | cut -d' ' -f1)
          same=DIFFERENT; [ "$a" = "$b" ] && same=identical
          R "U4 PASS: initramfs built offline in a network-cut namespace from a local repository, sha256:$a ($(stat -c %s "$W/initramfs-1.cpio") bytes); second build sha256:$b ($same; not a gate)"
          echo "$a" > "$W/initramfs.sha"
      - name: "wall probe (throwaway first run)"
        if: ${{ !cancelled() }}
        run: |
          set -uo pipefail
          W="$RUNNER_TEMP/spike"; mkdir -p "$W"
          R() { printf '%s\n' "$*" | tee -a "$W/results.txt"; }
          RUN_UID=$(id -u); RUN_GID=$(id -g)
          TA=${TARGET_ARCH:-x86_64}
          cd "$GITHUB_WORKSPACE"
          [ -f "$W/fetch.ok" ] && [ -f "$W/initramfs.sha" ] || { R "PROBE FAIL: setup did not finish (an earlier step failed)"; exit 1; }
          KIMG=$W/kernel-$TA/vmlinuz; KMOD=$W/kernel-$TA/modules; INIT=$W/initramfs-1.cpio
          mkdir -p "$W/tmp-probe" "$W/cache-probe" "$W/out-probe"
          # the melange the probe is given: melange as the runner user, inside the network namespace, with the arguments the probe does not know
          cat > "$W/melange-wrap.sh" <<WRAP
          #!/usr/bin/env bash
          sudo -n /usr/bin/unshare -n /bin/bash "$W/src/netns-run.sh" "$RUN_UID" "$RUN_GID" "$HOME" "$W/tmp" /usr/bin/env -i \
            PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin HOME="$W/home" LC_ALL=C SOURCE_DATE_EPOCH=1700000000 TMPDIR="$W/tmp-probe" \
            QEMU_KERNEL_IMAGE="$KIMG" QEMU_KERNEL_MODULES="$KMOD" QEMU_BASE_INITRAMFS="$INIT" "$W/bin/melange" "\$@" \
            --arch "$TA" --namespace fosterstack --signing-key "$W/spike.rsa" --keyring-append "$W/keys/wolfi-signing.rsa.pub" --keyring-append "$W/spike.rsa.pub" \
            --repository-append "$W/repo" --build-date 2023-11-14T22:13:20Z --cache-dir "$W/cache-probe" --out-dir "$W/out-probe" \
            --disk 4Gi --memory 2Gi --cpu 2 --timeout 15m 2>&1 | tee -a "$W/probe-melange.log"
          exit \${PIPESTATUS[0]}
          WRAP
          chmod +x "$W/melange-wrap.sh"
          echo "---- the wrapper ----"; cat "$W/melange-wrap.sh"
          rc=0; bash bin/vm-sandbox-probe.sh --melange "$W/melange-wrap.sh" --workdir "$W/probe" > "$W/probe.out" 2>&1 || rc=$?
          echo "---- probe output ----"; cat "$W/probe.out"
          echo "---- qemu arguments seen by the wrapper (all) ----"; cut -c1-1500 "$W/qemu-args.log" 2>&1
          echo "---- the melange log (whole) ----"; cut -c1-400 "$W/probe-melange.log" 2>/dev/null || true
          R "PROBE ($KIND $TA) exit code: $rc (0 held, 4 not held, 1 probe error or no evidence, 2 refused)"
          [ "$rc" = 0 ] || R "PROBE FAIL: exit $rc"

      - name: "initramfs inspection (arm diagnostic)"
        if: ${{ !cancelled() }}
        run: |
          set -uo pipefail
          W="$RUNNER_TEMP/spike"
          for f in "$W/initramfs-1.cpio" "$W/initrd-copy.cpio"; do
            echo "======== $f"
            [ -f "$f" ] || { echo "(missing)"; continue; }
            echo "size: $(stat -c %s "$f")"; echo "first bytes: $(head -c 16 "$f" | od -An -tx1)"
            d=$(mktemp -d); m=$(head -c 4 "$f" | od -An -tx1 | tr -d ' ')
            case "$m" in 1f8b*) c="zcat";; 28b52ffd) c="zstdcat";; fd377a58) c="xzcat";; *) c="cat";; esac
            echo "reader: $c (magic $m)"
            ( cd "$d" && $c "$f" | cpio -id --quiet 2>"$d.err" ); echo "unpack rc=$? err: $(head -c 300 "$d.err" 2>/dev/null)"
            echo "first 20 names of cpio -t:"; $c "$f" | cpio -t 2>/dev/null | head -n 20
            echo "top level: $(ls -A "$d" | tr '\n' ' ')"
            for i in init sbin/init; do
              if [ -e "$d/$i" ] || [ -L "$d/$i" ]; then echo "$i: $(ls -l "$d/$i" | cut -c1-200); first bytes: $(head -c 20 "$d/$i" | od -An -tx1); e_machine bytes 18-19: $(dd if="$d/$i" bs=1 skip=18 count=2 2>/dev/null | od -An -tx1)"; else echo "$i: absent"; fi
            done
            rm -rf "$d" "$d.err"
          done
          echo "======== qemu console, first 200 lines after 'starting VM'"
          awk '/qemu: starting VM/{f=1} f' "$W/probe-melange.log" | head -n 200 | cut -c1-260
      - name: "results"
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          W="$RUNNER_TEMP/spike"; mkdir -p "$W"
          R() { printf '%s\n' "$*" | tee -a "$W/results.txt"; }
          HOST_ARCH=$MATRIX_HOST
          RUN_UID=$(id -u); RUN_GID=$(id -g)
          TA=${TARGET_ARCH:-x86_64}
          HOSTPKG=qemu-system-$TA
          # run a command as the runner user inside a new network namespace with only loopback up (root creates the namespace only)
          in_netns() { sudo -n /usr/bin/unshare -n /bin/bash "$W/src/netns-run.sh" "$RUN_UID" "$RUN_GID" "$HOME" "$W/tmp" "$@"; }
          echo "==================== results of this job ($KIND, $TA) ===================="
          cat "$W/results.txt" 2>/dev/null || echo "(no results file)"
          { echo "## $KIND ($TA)"; echo '```'; cat "$W/results.txt" 2>/dev/null || true; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          if grep -q 'FAIL' "$W/results.txt" 2>/dev/null; then echo "at least one FAIL line: the job is red on purpose (fail closed)"; exit 1; fi
