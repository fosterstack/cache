version: 2

project_name: fscache

before:
  hooks:
    # A build must not mutate its inputs (audit §12): verify the module
    # manifests and fail if anything would change them, never rewrite.
    - go mod verify
    - git diff --exit-code go.mod go.sum

builds:
  - id: fscache
    main: ./cmd/fscache
    binary: fscache
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    # Version stamping is Go's own VCS stamping (debug.ReadBuildInfo),
    # proven in the shipped v0.1.0 binary. The former -X main.version /
    # -X main.commit ldflags referenced variables that never existed and
    # were silently discarded by the linker; they are gone, not fixed.
    ldflags:
      - -s -w
    mod_timestamp: "{{ .CommitTimestamp }}"

  # GOFIPS140=v1.0.0 selects Go's CMVP FIPS 140-3 validated cryptographic
  # module (cert #5247) at build time — addendum §4. This is a second
  # build variant of the same source, not a fork. Linux-only: the
  # Compliance-tier buyer (CMMC/800-171 contractors) deploys on Linux;
  # darwin/-fips has no market and would just double CI time for nothing.
  - id: fscache-fips
    main: ./cmd/fscache
    binary: fscache-fips
    env:
      - CGO_ENABLED=0
      - GOFIPS140=v1.0.0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: fscache-archive
    ids:
      - fscache
    formats:
      - tar.gz
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}

  - id: fscache-fips-archive
    ids:
      - fscache-fips
    formats:
      - tar.gz
    name_template: >-
      {{ .ProjectName }}-fips_{{ .Version }}_{{ .Os }}_{{ .Arch }}

checksum:
  name_template: "checksums.txt"

# Container images, built via ko (no Dockerfile, no docker daemon needed in
# CI): three variants of the SAME two Go builds above, differing only in
# base image / tags. Base pinned by digest, Google distroless, per Sprint 3
# §9's firm decision. Bump these digests like any other dependency.
# Images are NOT built here any more. The audit's central finding was a
# two-build release (a scanned snapshot vs. a published rebuild), and ko
# has no "use this binary" input, so the verify-before-consume boundary
# between compile and package cannot exist with it. Image assembly is its
# own stage: a COPY-only Dockerfile consuming the exact archived binaries
# this configuration produces, after verifying their signed statement.
# (.ko.yaml is deleted; the kos: section that lived here is gone.)

# SBOMs for the binary archives — the builder's own statement of what went
# in, generated at build time, one per archive (audit §8.4: the builder's
# SBOM is the SBOM; a scanner's SBOM is an observation).
sboms:
  - artifacts: archive

release:
  github:
    owner: fosterstack
    name: cache
  # Releases build ONLY in CI (RELEASING.md) — this is asserted by the
  # release workflow never running goreleaser outside a GitHub Actions
  # job, not by anything in this file. draft: true gives the release
  # workflow a chance to attach provenance/SBOM/signatures before the
  # release goes visible.
  draft: true

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
