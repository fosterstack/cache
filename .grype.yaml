# Documented, justified vulnerability-scan suppressions — a VEX
# assessment per addendum §7b's "no upstream fix exists" branch, not a
# blanket noise filter. Every entry here needs: no upstream fix
# available, and a specific reason this product's usage isn't affected.
# Re-review each entry whenever the underlying image is bumped.
ignore:
  - vulnerability: CVE-2025-60876
    reason: >
      BusyBox wget HTTP request-line splitting. OSV lists no fixed
      version (unresolved, affects all releases through 1.37.0 as of
      this review). VEX: NOT AFFECTED — busybox ships only in the
      :debug image variant, solely for interactive shell access when an
      operator execs in (Sprint 3 §7 item 5); nothing in this product
      invokes `busybox wget` automatically, so the vulnerable
      request-target parsing path is never reached during normal
      operation. The production and -fips image variants don't contain
      busybox at all. Re-review when upstream ships a fix.
