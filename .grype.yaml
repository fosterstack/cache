# Scanner suppressions live in .vex/, not here.
#
# Every exception is a published OpenVEX statement in
# .vex/fosterstack-cache.openvex.json, consumed by every scanner in
# .github/policy/scanners.json via their --vex inputs in CI. A Grype-only
# ignore in this file is invisible to the other scanners and to anyone
# auditing the release evidence — exactly the tool-local suppression the
# policy forbids (SECURITY.md; .vex/README.md).
#
# This file stays so that a future entry has to displace this comment to
# exist, and because a bare `grype` run without --vex (a contributor's
# local scan) will report the :debug image's busybox findings — that is
# expected; the published VEX is the disposition. History: until Sep 10,
# 2026 this file carried the CVE-2025-60876 analysis; it is now statement
# 2 of the VEX document, unchanged in substance.
ignore: []
