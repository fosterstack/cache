# Config for interactive/local use of `ko build`/`ko run` — the release
# matrix (production + debug + -fips variants) is driven by .goreleaser.yaml
# instead, since goreleaser has native ko integration (Sprint 3 §9) and is
# what CI actually runs. This file exists so `ko build ./cmd/fscache` just
# works for local dev without reading the goreleaser config.
#
# Base pinned by DIGEST, not tag (Sprint 3 §9 — firm owner decision):
# Google distroless, not Chainguard (Chainguard's free tier is
# latest-only with no stability promise — the exact upstream-rug-pull
# failure mode this product exists to fix for customers). Bump this
# digest like any other dependency when patching.
defaultBaseImage: gcr.io/distroless/static:nonroot@sha256:1c2c046bc09ed40fad370b599a0b1ae7987f55b01e247cf27a7c27cd97e5bbc7
