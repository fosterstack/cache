# The FosterStack Cache package (melange recipe). The two recipes (standard and FIPS) are GENERATED from this template by bin/gen-recipes.py and differ only
# in the package name, the package description and the two FIPS lines (the FIPS setting and its proof): rule 21. Edit THIS file, then update TEMPLATE_SHA256 in
# bin/gen-recipes.py in the same reviewed change and run bin/gen-recipes.py --write. CI runs bin/gen-recipes.py --check: both committed recipes must be exactly
# the generator's output AND this template must match its pin. The generator does not read the shell below: behaviour parity of the two builds rests on this file
# being reviewed and pinned, and the final control is build-apk.sh's check of the packaged binary (mandatory in CI).
#
# TEMPLATE CHECKLIST (the human and the reviewer go through it on EVERY change to this file):
#  - no case, if, test, [, &&, ||, $( or backtick in the build script step (the runs step that holds the go build and the proof): plain commands, one per line;
#    the one other place with shell logic is the last step (the devel/modified refusal), which only reads buildinfo.txt and must stay that way;
#  - no use of melange-out, and no literal "fips" in any case, anywhere in a runs step (the name must never steer the build);
#  - the targets.destdir substitution is only ever the path prefix of an argument (never inside a quoted test or a comparison);
#  - exactly one go build; nothing after the proof touches usr/bin or rebuilds the binary;
#  - nothing is appended to .git/info/exclude except the one line already there;
#  - the package pins and the certified module are NOT in this file: they come from build/locks/melange.lock and build/locks/fips-module.txt (the only files the daily job edits);
#  - NEGATIVE EXAMPLES that passed the old text checks and must never appear again: (1) a shell case on the package name that sets another GOFLAGS only for the
#    FIPS name; (2) a step conditioned on the package name that copies another binary over usr/bin/fscache after the proof.
#
# Modelled on: melange pkg/build/pipelines/fetch.yaml:4-6 (the fetch step needs wget), :78-90 (a checksum
# is required; the tarball is looked up in /var/cache/melange/sha256:<hex> before any download) @ b49e34ca1fd8; and
# wolfi-dev/os package files (package/environment/pipeline layout) @ 19c1f6955340.
#
# Rules (v0.3.0): 11 built from source here, never a container build file; 12 Go from go.dev pinned by sha256 and kept in the archive, never Wolfi's go package;
# 13 only the FIPS recipe sets the FIPS option (module v1.0.0) and proves the binary records the certified module (the value melange's SCA recognises,
# melange pkg/sca/sca.go:732); 15 the build tools come from the archive only and are pinned name=version (build/locks/melange.lock holds the same list); 20 the build
# records `go version -m` in the apk; 21 the two recipes are generated from this one pinned template and differ only in name, description and the FIPS lines; 24 the stamped source tree and the
# (devel)/modified refusal.
package:
  name: fscache
  version: "@VERSION@"
  epoch: 0
  description: the cache server
  copyright:
    - license: MIT
environment:
  contents:
    packages:
      - busybox=1.38.0-r3
      - ca-certificates-bundle=20260909-r2
      - cyrus-sasl-heimdal-libs=2.1.28-r58
      - gdbm=1.26-r7
      - git=2.56.0-r2
      - glibc-2.44-locale-posix=2.44-r8
      - glibc-2.44=2.44-r8
      - heimdal-libs=7.8.0-r53
      - keyutils-libs=1.6.3-r41
      - krb5-conf=1.0-r10
      - krb5-libs=1.22.2-r5
      - ld-linux-2.44=2.44-r8
      - libbrotlicommon1=1.2.0-r6
      - libbrotlidec1=1.2.0-r6
      - libbrotlienc1=1.2.0-r6
      - libcom_err=1.47.4-r3
      - libcrypt1-2.44=2.44-r8
      - libcurl-openssl4=8.23.0-r0
      - libexpat1=2.9.0-r0
      - libgcc=16.2.0-r1
      - libidn2=2.3.8-r10
      - libldap-2.7=2.7.1-r2
      - libnghttp2-14=1.70.0-r5
      - libpcre2-8-0=10.49-r1
      - libpsl=0.23.3-r2
      - libunistring=1.4.2-r4
      - libverto=0.3.2-r9
      - libxcrypt=4.5.2-r6
      - ncurses-terminfo-base=6.6.20261010-r0
      - ncurses=6.6.20261010-r0
      - nghttp3=1.18.0-r1
      - ngtcp2=1.25.0-r5
      - openssl-4.0-libcrypto=4.0.3-r6
      - openssl-4.0-libssl=4.0.3-r6
      - openssl-provider-legacy-allowed=4.0.3-r1
      - readline=8.3-r3
      - sqlite-libs=3.54.0-r0
      - wget=1.25.0-r20
      - wolfi-baselayout=20230201-r30
      - zlib=1.3.2.1_rc20260921-r0
  environment:
    GOTOOLCHAIN: local
    GOFLAGS: -mod=vendor
    GOPROXY: "off"
    CGO_ENABLED: "0"
pipeline:
  - runs: mkdir -p /usr/local/go
  - uses: fetch
    if: ${{build.arch}} == 'x86_64'
    with:
      uri: https://go.dev/dl/go1.27.2.linux-amd64.tar.gz
      expected-sha256: ecbadb99091a3f46e31f5f934b068b1864eafa7995211b39eaddf76996045fe5
      directory: /usr/local/go
      delete: true
  - uses: fetch
    if: ${{build.arch}} == 'aarch64'
    with:
      uri: https://go.dev/dl/go1.27.2.linux-arm64.tar.gz
      expected-sha256: 94f3e30b8e374bc285e7dadc11e0865726b9bc6e85b841ccceaabc0214c6b7c8
      directory: /usr/local/go
      delete: true
  - runs: |
      mkdir -p .git/refs/heads .git/refs/tags
      git config --global --add safe.directory "$PWD"
      printf '.melange*\n.config\n.gitconfig\n' >> .git/info/exclude
  # The build script holds ONLY simple commands, one per line (bin/gen-recipes.py generates both recipes from this template): it is the script in which the two recipes may differ.
  - runs: |
      export PATH=/usr/local/go/bin:$PATH
      export GOPATH=/tmp/gopath GOCACHE=/tmp/gocache
      go build -trimpath -o ${{targets.destdir}}/usr/bin/fscache ./cmd/fscache
  - runs: |
      export PATH=/usr/local/go/bin:$PATH
      mkdir -p ${{targets.destdir}}/usr/share/fscache
      go version -m ${{targets.destdir}}/usr/bin/fscache > ${{targets.destdir}}/usr/share/fscache/buildinfo.txt
  - runs: |
      if grep -Eq '\(devel\)|vcs.modified=true' ${{targets.destdir}}/usr/share/fscache/buildinfo.txt; then cat ${{targets.destdir}}/usr/share/fscache/buildinfo.txt; echo 'the binary says (devel) or vcs.modified=true' >&2; exit 1; fi
