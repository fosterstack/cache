backlog:
  - title: In-flight upload BYTE budget
    note: >
      REQ-HTTP-002 bounds upload COUNT; the per-request body cap times the
      concurrency bound already yields a worst-case byte ceiling (default
      32 x 1 GiB). A tighter shared byte budget across in-flight uploads
      (rejecting when the sum of declared Content-Lengths exceeds a cap,
      with a policy for unknown lengths) is deferred until a deployment
      demonstrates the count bound is insufficient - the unknown-length
      policy should be designed against a real case, not invented.
      Origin audit-2026-09-08, narrowed 2026-09-11.
  - title: Human-readable size units (FSCACHE_MAX_SIZE)
    note: Issue #29; v0.2 consideration, keeps _BYTES working.
  - title: Helm chart
    note: Issue #9; post-launch.
  - title: Write-provenance and writer policy
    note: Issue #8; read-only client mode, per-writer tokens, demand-driven.
  - title: /data baked into the image as the default data dir
    note: Issue #10; before beta.
  - title: Paid tiers (SSO, HA/replication, contractual CVE SLA)
    note: Described publicly as direction, not sold as available.
  - title: buildinfo FIPS label overstates what it knows (RESOLVED 2026-09-13)
    note: >
      Resolved in the v0.2.0 integrated PR: Info.FIPSModule now carries the
      GOFIPS140 build setting and FIPSNote derives the report from mode AND
      module - the forced-standard case reports "active (fips140 mode
      forced at runtime; not the validated-module build)" and never claims
      the certificate. Failing-first evidence in
      internal/buildinfo TestFIPSNoteIsTruthfulPerModeAndModule; the
      release-artifact acceptance asserts all three runtime postures.
      Origin audit-2026-09-10 (PR #43 review, finding 1); re-raised as
      Sep 12 review F06.
