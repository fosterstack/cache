    confidence: implementation-only
    notes: >
      The sweep is a scheduled job inside the existing reserved-branch-guard workflow (no new workflow file). Its planner is bin/branch-sweep.py; the keep-file is .github/branch-keep.json, an object {"keep": [{"branch", "expires" (YYYY-MM-DD), "reason"}]} read through the API at the default branch. The sweeper reads the runner's response headers by lower-case key (link). Local prune finds gone branches in a dry run with git ls-remote --heads origin (read-only); only --apply may run git fetch --prune. Branches on forks are out of scope.
    acceptance_criteria:
      - id: REQ-REPO-001-AC1
        given: "the repository's current default branch (whatever its name; a branch that was the default before a rename is an ordinary branch), with any pull request history and any age"
        when: "the sweep decides"
        then: "it keeps that branch and never deletes it; the default branch, release/ and dependabot/ names are compared without regard to letter case (MAIN, Release/1 and Dependabot/x are kept)"
        verification: { method: unit, release_blocking: false }
        status: approved
      - id: REQ-REPO-001-AC2
        given: "a branch whose name starts with release/ (for example release/1.2), merged or closed pull request or none, any age"
        when: "the sweep decides"
        then: "it keeps that branch; a branch merely named like one (release without the slash, or ending in /release/x) is not protected by this rule"
        verification: { method: unit, release_blocking: false }
        status: approved
      - id: REQ-REPO-001-AC3
        given: "a branch whose name starts with dependabot/ (Dependabot owns these), merged or closed pull request or none, any age"
        when: "the sweep decides"
        then: "it keeps that branch; a name that only begins with the letters dependabot (for example dependabot-fix) is not protected by this rule"
        verification: { method: unit, release_blocking: false }
        status: approved
      - id: REQ-REPO-001-AC4
        given: "a branch that is the head of an open pull request in this repository, including one that also has an older closed or merged pull request from the same head"
        when: "the sweep decides"
        then: "it keeps that branch whatever its age; repository names are compared without regard to letter case, so a head repository written O/R is this repository o/r; an open pull request from a fork whose branch has the same name, or whose head repository is gone, does not protect a branch here"
        verification: { method: unit, release_blocking: false }
        status: approved
      - id: REQ-REPO-001-AC5
        given: "a branch that is the base branch of an open pull request (a stacked pull request), including one whose own pull request is merged or closed, or that is idle for more than 14 days (advisor reading of the owner's Oct 8 words \"protect good branches from being deleted\")"
        when: "the sweep decides"
        then: "it keeps that branch, because deleting it would close that pull request; once no open pull request has it as base, the ordinary rules apply again"
        verification: { method: unit, release_blocking: false }
        status: approved
      - id: REQ-REPO-001-AC6
        given: "a branch named, by exact name, in an entry of the keep-file that is valid and not expired"
        when: "the sweep decides"
        then: "it keeps that branch whatever its pull requests and age; a pattern such as feat/* protects nothing by wildcard"
        verification: { method: unit, release_blocking: false }
        status: approved
      - id: REQ-REPO-001-AC7
        given: "a branch not in any kept class, no pull request from it open, whose tip commit is the head commit of at least one pull request from this repository and whose newest such pull request (by creation time) is merged"
        when: "the sweep applies"
        then: "it deletes that branch with the reason merged-pr; a pull request whose head commit is not the branch tip (new commits since, or a different head) takes no part, and the branch falls to the idle rule"
        verification: { method: unit, release_blocking: false }
        status: approved
      - id: REQ-REPO-001-AC8
        given: "a branch not in any kept class, no pull request from it open, whose tip commit is the head commit of at least one pull request from this repository and whose newest such pull request (by creation time) is closed without merging"
        when: "the sweep applies"
        then: "it deletes that branch with the reason closed-pr (a closed pull request newer than a merged one gives closed-pr, a merged one newer than a closed one gives merged-pr); a pull request whose head commit is not the branch tip takes no part, and the branch falls to the idle rule"
        verification: { method: unit, release_blocking: false }
        status: approved
      - id: REQ-REPO-001-AC9
        given: "a branch not in any kept class with no pull request at all, and the time of its newest commit"
        when: "the sweep applies"
        then: "it deletes the branch with the reason idle-14d when that commit is 14 days old or older (14 days exactly is deleted), keeps it when it is younger (13 days 23 hours is kept), and keeps it when the commit date cannot be read (a missing, malformed, timezone-less or non-text date counts as unreadable: the branch is kept, an ERROR line names it, the rest of the sweep carries on and the run exits non-zero); the age is the tip commit's committer date, not the time of the push, which is accepted; a branch that has pull requests none of which is at its tip is treated the same way"
        verification: { method: unit, release_blocking: false }
        status: approved
      - id: REQ-REPO-001-AC10
        given: "the keep-file entries"
        when: "they are read"
        then: "an entry needs a branch, an expires date written YYYY-MM-DD, and a reason; it keeps its branch from today through the expiry day inclusive (an expiry equal to today is kept); an expiry in the past is expired and keeps nothing; an expiry more than 60 days from today is invalid, reported as an error, and keeps nothing; an entry with a missing or wrongly typed field, or a branch already named by an earlier entry, is reported as an error and keeps nothing, while the other entries still count; a missing keep-file keeps nothing and is not an error"
        verification: { method: unit, release_blocking: false }
        status: approved
      - id: REQ-REPO-001-AC11
        given: "a run that starts from any ref, and a keep-file that differs between the default branch and another branch"
        when: "the sweep reads the keep-file"
        then: "it reads it through the contents API at the default branch only, never from the checkout or from a pull request's branch, so a branch cannot protect itself by editing the file"
        verification: { method: unit, release_blocking: false }
        status: approved
      - id: REQ-REPO-001-AC12
        given: "a keep-file that is not valid JSON or not the expected shape"
        when: "the sweep runs"
        then: "the file keeps nothing, the summary carries a line starting ERROR keep-file, every never-touched rule is still honoured and the rest of the sweep completes, and the run exits non-zero at the end; a keep-file that cannot be fetched for a reason other than not found (a server error, or a request that raises) deletes nothing and fails the job; a request that raises before any deletion, whichever call it is, deletes nothing and exits non-zero"
        verification: { method: unit, release_blocking: false }
        status: approved
      - id: REQ-REPO-001-AC13
        given: "a sweep that deletes or would delete a branch"
        when: "it writes its job summary (and standard output)"
        then: "each deletion is one line, DELETE <full commit sha> <reason> <branch> when applied and WOULD-DELETE <full commit sha> <reason> <branch> in a dry run, so the branch can be recreated with git push origin <sha>:refs/heads/<name> while GitHub still stores the commit (a branch that had a pull request also stays reachable through refs/pull/N/head); a failed deletion is a FAILED line in the same form; the same lines are also written to a log file that the job uploads as the artifact branch-sweep-log, retained 90 days, because job summaries age out; each DELETE, SKIPPED and FAILED line is appended to that log file and flushed before the next API call, so a cancelled, timed-out or crashed run keeps the lines for the branches already handled; a branch restored from its logged sha is swept again by the same rules on the next run, with no special protection"
        verification: { method: unit, release_blocking: false }
        status: approved
      - id: REQ-REPO-001-AC14
        given: "a manual run or a scheduled run"
        when: "the sweep starts"
        then: "it deletes nothing unless told to apply (--apply); a manual run has an input dry-run whose default is true and a dry run lists WOULD-DELETE lines and says dry-run: nothing deleted; the scheduled run applies, and a manual run applies only when the input is exactly false (the lowercase string false or the boolean false, which reaches the step as that string), compared case-sensitively in the step, not in an expression: the step receives the raw event name and the raw input through env and applies only for the schedule event or for that exact value, so False, FALSE, ' false' and 'false ' are dry runs: an absent, empty, true or any other value is a dry run, and an unset or odd mode variable in the job never applies"
        verification: { method: unit, release_blocking: false }
        status: approved
      - id: REQ-REPO-001-AC15
        given: "a branch chosen for deletion, including names with slashes, spaces, #, ? or % and non-ASCII characters"
        when: "the sweep deletes it"
        then: "it sends exactly DELETE repos/<owner>/<repo>/git/refs/heads/<name> with the name percent-encoded except for slashes, and the only requests it ever makes are reads (GET) and those deletions: no tag, no other ref, no push"
        verification: { method: unit, release_blocking: false }
        status: approved
      - id: REQ-REPO-001-AC16
        given: "more than 100 branches and more than 100 pull requests"
        when: "the sweep lists them"
        then: "it reads every page (100 per page, following the next-page link) before deciding anything; if any listing request fails (including a 404) or returns something that is not a list, or the listing is cut short, it deletes nothing, writes an ERROR line, and exits non-zero (fail closed); cut short means a next-page link whose following page fails, a page limit of 200 pages reached while a next-page link remains, or a full page that repeats the one before it, with or without a next-page link; a full page with no next-page link is followed by one more request, a short or empty page without a next-page link ends the listing, a short page that has a next-page link is followed by the next numbered page request (pages are requested by number, page=N, not by following the link URL), a second full page in a row without a next-page link is an error, and a full 200th page without a next-page link ends the listing and is not an error; exactly 100 or 200 items, and 1,050 items over 11 pages, are read in full (with the next-page links the API sends); an empty branch list is not an error and deletes nothing"
        verification: { method: unit, release_blocking: false }
        status: approved
      - id: REQ-REPO-001-AC17
        given: "a deletion the API refuses"
        when: "the sweep runs"
        then: "it logs a FAILED line (a request that raises is a FAILED line too), goes on to the remaining branches, and exits non-zero at the end; after three consecutive 403 or 429 answers to deletions it stops, writes an ERROR line, makes no further deletion in that run and exits non-zero; just before each deletion it re-reads the branch and the open pull requests that have it as head or base, and if the branch's commit changed, the branch is gone, or an open pull request appeared it makes no delete call and logs a SKIPPED changed line with the planned sha, reason and branch (a re-read that answers anything but 200 with a list or a commit, a 404 on the open pull request check included, or that raises, logs SKIPPED unverified, makes no delete call and exits non-zero; three consecutive 403 or 429 answers to re-reads stop the run in the same way; answers to re-reads and answers to deletions are counted as two separate streaks, and any other answer of the same kind, a clean 200 re-read included, breaks that kind's streak); a second run over the repository left by the first deletes nothing"
        verification: { method: unit, release_blocking: false }
        status: approved
      - id: REQ-REPO-001-AC18
        given: "the reserved-branch-guard workflow"
        when: "it is read"
        then: "it keeps its push trigger on the reserved branches and adds schedule (daily) and workflow_dispatch with the input dry-run defaulting to true; the guard job runs only on push; the sweep job runs only on schedule or workflow_dispatch and only from the repository's default branch, read from the event (never a literal branch name); no job condition mentions the dry-run input"
        verification: { method: ci-workflow, release_blocking: false }
        status: approved
      - id: REQ-REPO-001-AC19
        given: "the same workflow"
        when: "it is read"
        then: "the sweep job's permissions are exactly contents: write and pull-requests: read, the guard job and the workflow keep only contents: read, no secret is referenced (the job token only), no run step of any job, the guard job included, interpolates a ${{ }} expression (values reach scripts only through env), and every action reference is a full commit digest; the sweep job's last step, which always runs, uploads the log as the artifact branch-sweep-log with a retention of 90 days, using the same digest-pinned upload-artifact reference as the other workflows"
        verification: { method: ci-workflow, release_blocking: false }
        status: approved
      - id: REQ-REPO-001-AC20
        given: "the required allowlist job in ci.yml"
        when: "it is read"
        then: "it runs bin/branch-sweep-test.sh"
        verification: { method: ci-workflow, release_blocking: false }
        status: approved
      - id: REQ-REPO-001-AC21
        given: "the sweeper's files (bin/branch-sweep.py, bin/local-prune.sh, their tests and the keep-file)"
        when: "the layout check runs"
        then: "they are repository hygiene, not the daily scanner's files: they live outside the auditor's tree, their paths do not name it, they do not refer to it, and the layout check stays green"
        verification: { method: ci-workflow, release_blocking: false }
        status: approved
      - id: REQ-REPO-001-AC22
        given: "a local branch whose upstream is gone (git branch -vv shows [gone])"
        when: "bin/local-prune.sh --apply runs"
        then: "it deletes the branch when all its commits are already in origin/main (reason merged-into-main) or a pull request from this repository (never a fork's pull request of the same name) whose head commit is the branch tip is merged or closed with none of this repository's pull requests from the branch open (reason pr-merged or pr-closed); a branch with commits after its pull request's head is kept; it prints the deleted sha and runs git worktree prune"
        verification: { method: unit, release_blocking: false }
        status: approved
      - id: REQ-REPO-001-AC23
        given: "a local branch with no upstream, or one whose upstream still exists, or the current branch, or one checked out in a live worktree (clean or with uncommitted changes) or being rebased in one (rebase in progress), or a gone branch with unmerged commits and an open, unknown or not-at-its-tip pull request, or only a fork's pull request"
        when: "bin/local-prune.sh --apply runs"
        then: "it keeps that branch, and it removes nothing that has uncommitted changes"
        verification: { method: unit, release_blocking: false }
        status: approved
      - id: REQ-REPO-001-AC24
        given: "bin/local-prune.sh run without arguments"
        when: "it runs"
        then: "it changes nothing (no branch deleted, no worktree record pruned, no ref or remote-tracking ref changed, no fetch run, no FETCH_HEAD written), prints would-delete lines with the sha and a line saying dry-run, and acts only with --apply; in a dry run gone-detection reads the remote with git ls-remote --heads origin (read-only) and a remote that cannot be read keeps every branch; --apply may run git fetch --prune first; a branch whose upstream is on a remote other than origin is kept; the merged-into-main check in a dry run uses the sha of main read from git ls-remote --heads origin, and only when that commit exists locally, otherwise (or when the remote's main does not contain the branch) the branch falls to the pull request lookup and is kept if that finds nothing, and a stale origin/main tracking ref is never used to decide"
        verification: { method: unit, release_blocking: false }
        status: approved
      - id: REQ-REPO-001-AC25
        given: "a branch that the branches API marks protected (protected: true), with any pull request history and any age"
        when: "the sweep decides"
        then: "it keeps that branch with the reason protected and makes no delete call for it, so a protected branch never produces a FAILED line"
        verification: { method: unit, release_blocking: false }
        status: approved

  # ── The v0.3.0 release chain: the Sign boundary (pipeline lane, PR 1) ─────

  - id: REQ-CHAIN-001
    title: The Sign job is its own workflow file and cannot be reached from Build
    statement: >
      The release provenance shall be written and signed keyless by a Sign job that lives in its own workflow file, runs on its own fresh GitHub-hosted runner, never runs code from the build, receives only Build's digests, and whose signing identity no other job can obtain, so that a malicious Build step cannot produce provenance that Release accepts (SLSA Build Level 3 design).
    source: [.github/workflows/stage-sign.yml, .github/workflows/release.yml, bin/chain-verify.py, bin/chain-hostile-step.sh, .github/policy/chain-signers.json]
    tier: community
    introduced: v0.3.0
    origin: v0.3.0 rules 50, 50a, 52, 52a, 59 (owner RATIFIED Oct 9 2026 11:51 EDT, ops/docs/ratify/2026-10-09-v030-rules.md; advisor read-back approved, handoff 0325)
    confidence: implementation-only
    notes: >
      stage-sign.yml is the one new workflow file v0.3.0 adds (rule 52). PR 1 builds the Sign side and the verify side; Release's own signing of the policy (rule 57) is PR 4. Public copy says "designed to SLSA Build Level 3", never "certified" (rule 50a, 84). Dry run (pipeline design, round 5-6; advisor to confirm): on a workflow_dispatch on a branch Sign writes a record marked dryRun and its SAN ref is the branch; such a record can only be judged under a dry_run policy by the dry run's own verify job (stage sign only), while Release makes its policy with --tag, every stage-start refuses a dry_run policy, and a provenance carrying dryRun true is refused under any non-dry policy; every job after Sign also carries the tag-ref conjunct in release.yml.
    acceptance_criteria:
      - id: REQ-CHAIN-001-AC1
        given: "the workflow files of the release chain"
        when: "they are parsed"
        then: "stage-sign.yml is a reusable workflow with exactly one job; it is the only workflow file v0.3.0 adds beyond the files that existed at v0.2.2; the Sign job runs on a GitHub-hosted runner (never self-hosted); and no other workflow, composite action or .yaml file signs provenance, every other signing call being listed with its reason in .github/policy/chain-signers.json"
        verification: { method: ci-workflow, release_blocking: true }
        status: proposed
      - id: REQ-CHAIN-001-AC2
        given: "the Sign job"
        when: "its inputs and steps are read"
        then: "its only input is Build's digest list; the one thing it downloads is Build's signed Witness record (the artifact witness-build), as data only, verified against Build's identity before it is read and never executed; none of its steps runs anything Build produced; its job is exactly: checkout, that one download, install the pinned signing tool, write the digest list to a file, one `chain-verify.py sign --check` command, upload the provenance folder; and that command refuses to sign (and writes nothing) unless Build's verified record attests the digest file by the sha256 of its bytes (the real Witness product subject file:digests.json) and the file's own content passes the format check on its own (a JSON object, no duplicate key, every name plain: lower-case letters, digits and hyphens, no code, no path; every value sha256: and 64 lower-case hex characters); the policy it checks against is made per tag by the check itself from the committed template, the committed trust file and the tag in GITHUB_REF (refs/tags/vX.Y.Z exactly: -rc1 tags, other tags, a branch on a push and an empty ref are refused; the one other mode is a dry run, chosen by the run itself as a workflow_dispatch on a branch, where the policy is made for that branch, the provenance says dryRun true and a DRY-RUN marker sits beside it, and Release's tag-pinned policy can never accept such a record); the signing tool is never started on a refusal (the check comes before the signature); the provenance it writes is SLSA v1 with a real buildDefinition and runDetails.builder.id, and what it writes verifies as it stands (certificate, intermediates, timestamp and Rekor entry from the signing bundle)"
        verification: { method: unit, release_blocking: true }
        status: proposed
      - id: REQ-CHAIN-001-AC3
        given: "the Sign job's identity token and signing key"
        when: "every step of every stage file is read"
        then: "no step of Sign touches the identity token request at all (the signing tool asks for it inside its own process), so it is never written to a file, an artifact, a log or a step output (or the environment file); the only artifact Sign uploads is the provenance bundle; the short-lived signing key exists only in the signing tool's memory for that run; and Sign's workflow file references no repository or environment secret"
        verification: { method: ci-workflow, release_blocking: true }
        status: proposed
      - id: REQ-CHAIN-001-AC4
        given: "provenance written by the Sign job"
        when: "bin/chain-verify.py checks it"
        then: "it is a standard SLSA provenance record (v1) signed keyless with a certificate whose identity is exactly stage-sign.yml of this repository at the tag (the certificate's SAN), whose top-level workflow (the Build Config URI extension) is release.yml of this repository at the same tag, and whose OIDC issuer is GitHub Actions, with the timestamp authority's stamp; provenance signed under any other identity (Build's, Rebuild's, Check's, a sibling file, a file whose name only resembles Sign's, another repository, another tag or a branch) is refused, and so is a certificate that has Sign's SAN but was issued to a run of any other top-level workflow (a second workflow that calls stage-sign.yml), one at another tag or on a branch, and one with the issuer or the Build Config URI extension missing and the refusal names the identity found; provenance presented as any other stage's record is refused"
        verification: { method: unit, release_blocking: true }
        status: proposed
      - id: REQ-CHAIN-001-AC5
        given: "a dry run on GitHub in which a deliberately hostile Build step runs (the runtime proof; the static judge alone does not satisfy this AC)"
        when: "the step tries, as six separate cases each on its own, to mint a certificate in Sign's identity, to read Sign's token, to read Sign's key material, to hand Sign code or a path instead of digests, to forge provenance that Release would accept, and to get provenance accepted from a second workflow that calls stage-sign.yml at the tag (that workflow exists only on a throwaway commit of the pull request branch and is removed before the merge)"
        then: "every attempt fails or is refused by Release's checks, each outcome is the verifier's own result (its exit code), never the hostile step's report of itself, the refusal names the stage and the reason, the test fails if any attempt is accepted, and the GitHub dry run must be green and its run linked in the pull request before the pull request merges; each of the six cases is judged by the verifier invocation pinned for it and counts only when its stage and cause fit the attempt (a refusal because the material was missing or unreadable never counts: a missing file is an error, not a refusal, and writes no row), the results come from the run's own artifact (never a file in the repository), and the verifying job holds no identity token, runs only an allowlist of steps (checkout, the downloads, one policy made for the run's own ref, the attempts, one positive control, collect, upload), and judges every attempt against the same policy as a positive control that must be ACCEPTED (this run's genuine Sign provenance), so a policy that refuses everything cannot make the attempts look refused; the token and key attempts must leave a transcript (an empty material file is an error)"
        verification: { method: ci-workflow, release_blocking: true }
        status: proposed

  - id: REQ-CHAIN-002
    title: Timestamps, the transparency log and the per-tag release policy
    statement: >
      Every keyless signature in the release chain shall carry Sigstore's public timestamp so it can be checked after its ten-minute certificate expires, everything a customer verifies shall have an entry in Rekor, and each tag shall have a release policy made from a committed template that accepts exactly the stage identities of that tag and no others.
    source: [.github/policy/release-policy.template.json, bin/chain-verify.py, .github/policy/sigstore-trust.json]
    tier: community
    introduced: v0.3.0
    origin: v0.3.0 rules 53, 53a, 53b, 57 (verify side) (owner RATIFIED Oct 9 2026; spikes (a) and (b), ops/handoffs/outbox/2026-10-09-harness-witness-spikes-a-c.md and 2026-10-09-pipeline-spike-b-policy.md)
    confidence: implementation-only
    notes: >
      PR 1 writes the template and the verify side only; Release signing the finished policy (rule 57) is PR 4. Witness's stage records cannot go to Rekor (Witness has no Rekor support); they carry the timestamp authority's stamp and are kept as release evidence (rule 53b). Advisor reading, Oct 9 (handoff 0334; the ratified text is unchanged): a stage's identity in rules 52/52a/57 is the certificate whose SAN (Build Signer URI) is the stage file at the tag AND whose Build Config URI extension (OID 1.3.6.1.4.1.57264.1.18, the top-level workflow) is release.yml at the same tag, issued by GitHub's OIDC issuer; the policy pins all three. Witness's own verify can check the issuer but not the Build Config URI (in-toto-witness options/verify.go:80-99), so bin/chain-verify.py checks it. The OIDC issuer is read from OID .1.8; the spike certificate dumps list .1.1 and not .1.8, so the dry run must confirm .1.8 is present on a real certificate.
    acceptance_criteria:
      - id: REQ-CHAIN-002-AC1
        given: "a keyless record whose certificate expired 15 or more minutes ago"
        when: "bin/chain-verify.py checks it from files alone with the network cut"
        then: "it is accepted when it carries a valid timestamp from the authority named in the release policy and refused when the timestamp is missing, from another authority, dated before the certificate's validity or after it expired, taken over a different signature, or when the payload or the signature was altered after signing; the same record is refused when the policy names no authority; the check runs with the network cut"
        verification: { method: unit, release_blocking: true }
        status: proposed
      - id: REQ-CHAIN-002-AC2
        given: "the committed policy template and a tag T"
        when: "the policy for T is made and used to check records"
        then: "it accepts a record signed under the named stage file's identity at T, refuses a record from a sibling stage file at T, refuses the same stage file at any other tag, a tag that only begins like T, a branch, another repository or a certificate from another OIDC issuer, requires the certificate's Build Config URI extension to be release.yml of this repository at T (so a second workflow that calls a stage file is refused even though its SAN is the stage's), and pins Sigstore's root, the timestamp authority's root and the Rekor key by the hashes in the committed trust file, refusing a bundle whose hash differs"
        verification: { method: unit, release_blocking: true }
        status: proposed
      - id: REQ-CHAIN-002-AC3
        given: "a customer-verifiable record (image signature, SLSA provenance, SBOM, lock or release file signature)"
        when: "bin/chain-verify.py checks it"
        then: "whether a record needs a Rekor entry is decided by its type, never by a flag the caller sets: every type except Witness's stage records (the SLSA provenance, the signed release policy, and the rest) is refused unless Rekor holds a correctly signed entry for that very record, whose body binds the record's payload hash, signature and certificate; an entry for another record (or with another record's signature or certificate), with a bad or edited signed timestamp, or from another key is refused; Witness's stage records are exempt and are checked for the timestamp instead"
        verification: { method: unit, release_blocking: true }
        status: proposed
      - id: REQ-CHAIN-002-AC4
        given: "the Sign and Build signing steps"
        when: "the workflow files are read"
        then: "nothing a step passes to the signing tool or into a certificate claim comes from a secret, a token or an environment secret; the certificate carries only the public repository, workflow file, commit and run"
        verification: { method: ci-workflow, release_blocking: false }
        status: proposed

  - id: REQ-CHAIN-003
    title: Each stage verifies the one before it; only standard record types; every action pinned
    statement: >
      Every stage after Build shall first verify the previous stage's signed record with one shared plain script and stop on failure, naming the stage; only Witness's standard records, SLSA provenance and the signed release policy shall exist as signed record types; every signed record shall have a distinct claim and a named consumer; and every action reference shall be a full commit digest and be on the committed allowed-actions list.
    source: [bin/chain-verify.py, .github/policy/allowed-actions.json, .github/policy/chain-records.json, .github/agent/bin/check-action-pins.py]
    tier: community
    introduced: v0.3.0
    origin: v0.3.0 rules 58, 63, 66, 67 (owner RATIFIED Oct 9 2026; pin checker scope per the owner on Oct 3, plain forms only)
    confidence: implementation-only
    notes: >
