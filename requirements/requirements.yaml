  - id: REQ-SCAN-001
    title: The four-scanner panel on the daily rescan
    statement: >
      The daily main-candidate rescan shall use four scanners: Grype, Docker Scout and Amazon Inspector on all six images, and Google Artifact Analysis on the three variants on linux/amd64 only; Trivy and Snyk shall not be run by it.
    source: [.github/workflows/main-candidate-rescan.yml]
    tier: community
    introduced: v0.3.0
    origin: scanner-panel rule 1 (owner, Oct 2 2026; ops/docs/ratify/2026-10-02-scanner-panel-rules.md)
    confidence: implementation-only
    acceptance_criteria:
      - id: REQ-SCAN-001-AC1
        given: "the daily main-candidate rescan"
        when: "it runs"
        then: "Grype, Docker Scout and Amazon Inspector each scan all six images (production, debug and fips, each on linux/amd64 and linux/arm64); the set is fixed in the workflow, not computed at build time"
        verification: { method: ci-workflow, release_blocking: false }
        status: approved
      - id: REQ-SCAN-001-AC2
        given: "the daily main-candidate rescan"
        when: "it runs"
        then: "Google Artifact Analysis scans the three variants on linux/amd64 only, never arm64"
        verification: { method: ci-workflow, release_blocking: false }
        status: approved
      - id: REQ-SCAN-001-AC3
        given: "the daily main-candidate rescan"
        when: "it runs"
        then: "Trivy and Snyk are not run by its scanner panel"
        verification: { method: ci-workflow, release_blocking: false }
        status: approved

