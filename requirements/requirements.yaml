  - id: REQ-REL-006
    title: Frozen release baselines stay fixed
    statement: >
      A frozen release baseline shall be fixed at a named commit, and the
      freeze check shall compare it with the requirements file as of that
      commit, never with main's current file; editing the requirements on
      main shall never turn a frozen baseline red; a frozen baseline shall
      change only by an owner-ratified amendment recorded in the register,
      applied as a new fixed commit.
    source: [tools/requirements/main.go, requirements/releases/, .github/workflows/ci.yml, .github/workflows/stage-admission.yml]
