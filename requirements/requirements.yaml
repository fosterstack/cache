    origin: AC1 to AC3 are the matrix page's REQ-AUD-18 rows (the auditor matrix page in the auditor directory, lines 91 to 93), owner-ratified in #113 (commit 731f2d1, Sep 25 2026, matrix: ratify REQ-AUD-14..18); the AC3 mechanism is option C (owner, Sep 27 2026); AC1 carries two owner amendments: the two traceability files test-evidence/mappings.yaml and test-evidence/unmapped.yaml (owner, Oct 2 2026) and the patch-release classifier bin/patch-decide.py with its test bin/patch-decide-test.sh (owner, Oct 3 2026, "I ratify b."). AC4 is the second-seat substitute (owner, Oct 9 2026, "stop all codex no more codex reviews until after 1AM Saturday. replace all codex with opus medium." and "Proceed with opus just for this one that codex is hung up on"; advisor 0317).
