    tier: community
    introduced: v0.3.0
    origin: v0.3.0 rules 31, 54, 58, 59, 62, 64, 70 (owner RATIFIED Oct 9 2026; advisor read-back approved, handoff 0338)
    confidence: implementation-only
    notes: >
      Release publishes Build's bytes and never Rebuild's (rule 64), so Rebuild's only output is its verdict. The compared items follow cache's interface note: per-architecture apk (apk-tool.py digest), local index, modules SBOM, inputs manifest, full lock file, the OCI image index digest and each per-architecture manifest digest (OUT/<variant>.digest and .manifests), the SBOM files and the binary; the layout of the apkindex, inputs manifest and binary items is PROPOSED/UNVERIFIED in the tests.
    acceptance_criteria:
      - id: REQ-CHAIN-005-AC1
        given: "stage-reproducibility.yml"
        when: "it is parsed"
        then: "it has the same shape as Build (REQ-CHAIN-004-AC1 and AC2: an apk matrix job and an assemble job, each directly on a GitHub-hosted VM, the one Witness line through bin/witnessed.sh with the steps rapk and rebuild, no secrets, no packages write, no admission token) with its own checkout on a fresh runner, and its first action after the policy is made is chain-verify.py stage-start against Build's record, before any build"
        verification: { method: ci-workflow, release_blocking: true }
        status: proposed
      - id: REQ-CHAIN-005-AC2
        given: "bin/build-stage.sh run in Rebuild"
        when: "it rebuilds"
        then: "it builds the same commit with the same two scripts, the same pinned tools and the same SOURCE_DATE_EPOCH as Build (the tagged commit's committer time), and then compares instead of publishing; it fetches nothing Build produced except the signed record and the digest list it compares against"
