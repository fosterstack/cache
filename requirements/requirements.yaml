eds.decide.outputs.tagged == 'true' }}, patch-failed needs exactly the five chain jobs, and a dry-run dispatch input, when present, is of type boolean (a string would make inputs.dry-run == true false and silently skip the dry run); and the workflow-level permissions are contents read. The real release.yml fails this check until PRs 3 and 4 remove the old admission, image, scans, acceptance, authorization and promotion calls and the broad workflow permissions (the cutover pull request)"
