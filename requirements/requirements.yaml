  - id: REQ-AUD-019
    title: The auditor unit tests touch no real system path
    statement: >
      The auditor's Python unit tests shall not open, list, create, link, stat or resolve any real system path: a runtime guard armed for the whole test run fails any such call that leaves the test's temporary directory, the repository checkout and the interpreter's own environment; the Python tests are also scanned statically in full for a system-path literal outside a reviewed allow-list; and every other test script (shell) is scanned statically only for a symbolic link made to an absolute target and for creating files without a temporary directory. Go and Java tests are not scanned statically; the runtime guard covers whatever test discovery actually runs.
    source: [auditor directory bin/tests/fs_guard.py, auditor directory bin/tests/test_fs_guard.py, auditor directory bin/tests/system_path_allowlist.py]
    tier: community
    introduced: v0.3.0
    origin: the macOS "administer your computer" prompts of Oct 9 2026, traced (advisor) to a test that made a symbolic link to a system path under the command sandbox, and the advisor ruling that the whole class is fixed with a tripwire; the scope of the static scan was narrowed by the advisor (option A) after seven review rounds in which a growing list of shell spellings never converged. AC1 to AC3 are approved (advisor step 5, Oct 10 2026); this repository records an approval in origin, there being no per-criterion approval field.
    confidence: implementation-only
    notes: >
      The runtime guard is an audit hook plus wrappers installed by test_0000_arm_fs_guard.py, the first module discovery imports (digits sort before letters; test_fs_guard.py asserts that it sorts first and that an early and a late module are both guarded). Import-time code of a module that sorted before it would be unguarded; none does, and a new one named test_0* before it would fail that assertion; it judges the resolved path of each call (symbolic links followed, ".." applied after a link, a dir_fd or an open fd resolved to its directory) against the temporary directory, the checkout and the interpreter environment (read only), and is proven by mutants run in a container. The static literal scan keeps a reviewed allow-list (system_path_allowlist.py) whose whole-file rows pin the file byte for byte. The shell scan is limited to ln -s / cp -s (and the hard-link form) with an absolute target and to a script that creates files without ever calling mktemp or tempfile (the mktemp rule); the scan does not check that every file lands under the temp directory, the runtime guard (AC1) is what catches a stray path. The shell checks are a lint of plain forms, not a security control. The static scans read only git-tracked files and skip test_fs_guard.py itself and the coverage gate script; Python helpers outside the test file name pattern (fixtures, fs_guard.py) are not literal-scanned; a metadata exemption listed in AC1 (ancestors of a root, sysconfig directories, the stdlib zip, pyvenv.cfg, the trusted user base, /dev/null and /dev/urandom, descriptors open at arming, ctypes.CDLL(None)) is deliberate, not a gap. A container job whose HOME is not the account's home directory loses the user-scheme metadata entries (coverage stats them); the guard then refuses, it does not widen. The runtime guard is a tripwire for accidental access to real system paths by the repository's own tests; it is not a security boundary against test code that deliberately subverts it (replacing the SQLite authorizer, swallowing the refusal, or altering sys.path). Documented residuals of the runtime guard (it is a tripwire, see AC1): a test can replace the SQLite authorizer with set_authorizer; a refusal can be swallowed by an except Exception that catches the SQLite DatabaseError, or by asyncio.gather(return_exceptions=True) in the main thread; a C library that opens a file without emitting an audit event (ssl, posix.stat) is not seen; other runners than discovery (python -m unittest <module>, the direct test_panel_sdk_probe.py run in ci.yml, pytest) do not arm the guard; and a package that sorts before the arming module would be imported unguarded. PLAIN FORMS ONLY (AC2): the Python literal scan detects an absolute path whose first component is one of a fixed name list (etc usr var private Library System opt bin sbin dev home root proc sys Users tmp Applications Volumes run srv lib lib64 boot mnt nix cores Network snap workspace github media data afs net scratch export exports nfs Developer lost+found vol pkg swapfile imagegeneration datadisk cdrom lib32 libx32 init __w _work docker-entrypoint.d entrypoint.sh sw firmlinks and the *.usr-is-merged names), in any letter case, with extra slashes, /./ or /../ before the name, a digit or underscore after it, a brace list (/{etc,usr}) or a one-character ? wildcard (/e?c); a first component that starts with a dot or contains a glob character; ~user; a chain of two or more ../; --option=/abs, an attached -C/, source=/, a redirect into /; the bare root (/, //, /., /.., /./, quoted, with an r/b/u/f prefix, or as an argument of a listed command such as ls, cd, find, grep, cat, cp, tar, git, test), cwd='/', open('/'), os.path.join('/', ...); os.sep and os.path.sep as a call argument, an assignment or inside abspath, realpath and normpath (not as a string-method argument such as .split(os.sep)); a home form (~/, $HOME, ${HOME, expanduser, Path.home, os.environ['HOME'], os.getenv('HOME'), os.environ.get('HOME'), pwd.getpwuid, pwd.getpwnam, cd ~, a bare cd, file: URIs, a chain of three ../); and, by syntax tree, os.symlink, os.link, symlink_to and hardlink_to with an absolute constant in any argument. It does not detect a path built at run time or by concatenation, a first component outside the list (unless it starts with a dot or contains a glob character), or anything in a file outside the name pattern. The shell checks (AC3) detect: ln or cp (also by /bin/ln or /usr/bin/ln) with the flags -s, -l, --symbolic, --symbolic-link in any position, or a hard ln, whose operand is absolute: starts with / (also / alone and //), ~, $'/..', a {/x,y} brace list, a ${V:-/x} ${V-/x} ${V=/x} ${V+/x} ${V:=/x} ${V:+/x} default (the ${V?/x} and ${V:?/x} forms are not detected), or an attached -t/x or --target-directory=/x, across a backslash-newline continuation; and a script in which a creator command word (mkdir, touch, cp, mv, ln, install, tee, mkfifo, mknod, dd of=, sed -i, git init or clone, after VAR=, sudo, env, command, exec, time, nice, xargs, !, then, do) or a redirect (>, >>, >| to a word that is not a descriptor &N, &-, a process substitution or /dev/null) appears outside comments, single and double quotes (except their $( ) and backtick substitutions), $(( )) and heredoc bodies, and mktemp is never a command word and python tempfile is never called outside a comment. Go and Java tests are out of the static scan by decision; they run under the same guard only where discovery runs them in the Python interpreter.
    acceptance_criteria:
      - id: REQ-AUD-019-AC1
        given: "any auditor Python unit test run by test discovery or the auditor coverage gate (the guard is armed by the first module discovery imports, test_0000_arm_fs_guard.py, so the import-time code of every other test module is guarded too)"
        when: "a call opens, lists, creates, links, renames, removes, stats or resolves a path (including through a symbolic link, a dir_fd, an open file descriptor, a socket address or a database file) that is outside the test's temporary directory, the repository checkout and the interpreter's own environment, or writes inside the interpreter's environment other than its bytecode cache"
        then: "the call fails at once with an error that cannot be swallowed by an ordinary except Exception, and a violation raised in a worker thread, a finaliser or a future fails the run at exit; what is allowed is exactly this: the temporary directory and the repository checkout (read and write); the interpreter's own environment (its prefix, standard library, site-packages and, when the user home is trusted as below, the user site-packages; and every sys.path entry that is under those directories or a standard temp parent; all read only, plus its bytecode cache: mkdir of a __pycache__ directory and open, rename or remove of a .pyc file in one); metadata only (stat, lstat, realpath, exists, statvfs, pathconf) of the ancestors of every allowed root (the root directory, /Users, /var, /opt, /opt/homebrew, the home directory), of every directory a sysconfig scheme names (for example /opt/homebrew/bin) and of a pyvenv.cfg beside an ancestor; the stdlib zip beside the standard library directory (python3XY.zip) and, as metadata only, the paths of the *_user sysconfig schemes and the user base, which count only when HOME is the account's own home directory (from the password database) or under a standard temp parent and PYTHONUSERBASE is unset or under one (a HOME of /etc or /Users/other gives no entry at all); a sys.path entry outside the interpreter's directories and the temp parents gives nothing, not even metadata; the device /dev/null (opened, also for writing) and the device /dev/urandom (opened for reading); metadata, reads and listings of either device and of /dev as an ancestor are not blocked, but nothing else may be done to them (no write other than opening /dev/null, no remove, rename, chmod, utime or truncate); every file descriptor that was already open when the guard was armed; and ctypes.CDLL(None). A temp directory named by the environment (TMPDIR) counts only under a standard temp parent and never when it is the home directory. The runtime guard is a tripwire for accidental access to real system paths by the repository's own tests; it is not a security boundary against test code that deliberately subverts it (replacing the SQLite authorizer, swallowing the refusal, or altering sys.path)."
        verification: { method: unit, release_blocking: false }
        status: approved
      - id: REQ-AUD-019-AC2
        given: "a Python test file in the repository"
        when: "the static scan reads it"
        then: "it fails, naming the file and line, on a system-path literal (an absolute path under a top-level system directory, the bare root, a home-directory form, a dot or glob first component, or a chain of parent directories) unless a reviewed allow-list row approves that one complete token as pure data, and a whole-file row pins the file byte for byte"
        verification: { method: unit, release_blocking: false }
        status: approved
      - id: REQ-AUD-019-AC3
        given: "a shell test script (or any other non-Python test script), and a Go or Java test"
        when: "the static scan reads them"
        then: "a shell script fails, naming the file and line, only for two things: a symlink with an absolute target created by ln -s or cp -s (also ln -sf, ln -sfn, ln --symbolic, cp --symbolic-link, and a hard ln to an absolute target), and a script that creates files (mkdir, touch, cp, mv, ln, install, tee, a redirect) without ever calling mktemp or tempfile (the mktemp rule), reporting the first offending line; Go and Java tests are not scanned statically; the shell checks are a lint of plain forms, not a security control, and the runtime guard (AC1) is the control"
        verification: { method: unit, release_blocking: false }
        status: approved
