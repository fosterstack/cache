# FosterStack Cache — requirements.
#
# The only place requirements live (traceability-plan.md §5). The baseline
# below was EXTRACTED from the repository at the audited revision — read from
# the docs and the implementation, then written down — and is described
# publicly as exactly that. It is not requirements-first and does not claim
# to be. Requirements added after Sep 8, 2026 are written before their
# implementation and carry an `origin`.
#
# Rules (traceability-plan.md):
# - Never reverse-engineer an AC from a test. Read the claim, write the AC,
#   then look for the test.
# - Implementation code is never verification.
# - Requirements are deprecated, never deleted.
# - `confidence` records where a requirement came from:
#     documented          — a public doc states it
#     implementation-only — the code does it; no doc promises it
#     claimed-unverified  — a public doc claims it; no evidence exists yet
#     ambiguous           — sources disagree or the claim is unclear
# - AC status is exact-state: every AC is `approved` while the baseline is
#   approved (flipped all-at-once by owner approval, granted 2026-09-11)
#   and `proposed` otherwise. An omitted status never validates.

baseline:
  extracted_from: acd8bac2f9427dee63c71384dcbfecdb5c7ccf1b
  extracted_on: 2026-09-08
  approved: true
  approved_on: 2026-09-21
  note: >
    Extraction sources: README.md, SECURITY.md, RELEASING.md, CONTRIBUTING.md,
    docs/*.md (nine files), cmd/fscache, internal/{server,cache,blobstore,
    metadata,metrics,buildinfo}, .goreleaser.yaml, and the CI workflows, all
    at the extracted_from revision. Behaviors present at that revision but
    not in the v0.1.0 tag (the status page family and the fips140 startup
    field, shipped Sep 7) carry introduced: v0.2.0 - the first release that
    will contain them. Future behavior is in backlog.yaml, not here.

requirements:

  # ── Cache protocol ────────────────────────────────────────────────────

  - id: REQ-PROTO-001
    title: HTTP cache round trip
    statement: >
      The server shall store a blob on PUT, return the identical bytes on
      GET, report existence and size on HEAD, and return 404 for a key that
      has no entry.
    source: [README.md "Why this exists", docs/gradle.md, docs/docker-deploy.md "Verify it is working", internal/server/server.go]
    tier: community
    introduced: v0.1.0
    confidence: documented
    acceptance_criteria:
      - id: REQ-PROTO-001-AC1
        given: a running server with an empty store
        when: a client PUTs a body to /some-key and then GETs /some-key
        then: the PUT returns 201, the GET returns 200 with byte-identical content and a correct Content-Length
        verification: { method: http-integration, release_blocking: true }
        status: approved
      - id: REQ-PROTO-001-AC2
        given: a stored key
        when: a client sends HEAD for that key and GET for an absent key
        then: HEAD returns 200 with the stored size and no body; the GET of the absent key returns 404
        verification: { method: http-integration, release_blocking: true }
        status: approved

  - id: REQ-PROTO-002
    title: Request path is the cache key
    statement: >
      The server shall treat the entire request path, with the leading slash
      removed, as the cache key - no path prefix exists and none is required
      on either side. This requirement covers only the non-reserved cache
      namespace: the reserved application paths ("/", /healthz, /metrics,
      /statusz) are outside it, their GET behavior is specified by their own
      requirements (REQ-OBS-001, REQ-OBS-002, REQ-OBS-003, REQ-PROTO-006),
      and reserved-path write handling is specified by REQ-PROTO-007.
    source: [docs/gradle.md "trailing slash", docs/docker-deploy.md, internal/server/server.go cacheEndpoint]
    tier: community
    introduced: v0.1.0
    confidence: documented
    notes: >
      Recorded at review (Sep 10): a PUT to a reserved path such as
      /healthz is currently accepted into the cache namespace while its
      GET answers with the endpoint response. DECIDED (owner, 2026-09-11):
      reserved paths refuse writes — REQ-PROTO-007 is the contract, and
      the server change ships in v0.2.0.
    acceptance_criteria:
      - id: REQ-PROTO-002-AC1
        given: a running server
        when: a client PUTs to an ordinary, non-reserved cache path such as /a/nested/key and GETs the same path
        then: the round trip succeeds, the same bytes are not visible under any other path, and the reserved endpoints continue to answer as endpoints
        verification: { method: http-integration, release_blocking: true }
        status: approved

  - id: REQ-PROTO-003
    title: Key validation
    statement: >
      The server shall reject, with HTTP 400, any key whose segments are not
      1-255 characters of [A-Za-z0-9._-], any key of more than 16 segments,
      any empty key, and any "." or ".." segment; path traversal shall not
      be able to escape the store root.
    source: [docs/docker-deploy.md "Verify it is working", internal/blobstore/blobstore.go ValidateKey]
    tier: community
    introduced: v0.1.0
    confidence: documented
    notes: >
      Recorded at review (Sep 10): Go's HTTP router redirects some
      dot-segment and repeated-slash paths (e.g. /a/../b, /a//b, /a/./b
      answer 307 to the normalized path) BEFORE key validation runs, so a
      helper-level test cannot stand in for this HTTP contract, and a
      redirect-following client may resubmit to the normalized key.
      DECIDED (owner, 2026-09-11): malformed keys are REJECTED with HTTP
      400 through the real router — never normalized, no redirects.
      IMPLEMENTED (v0.2.0): a front controller ahead of ServeMux
      (internal/server.go newFrontController/rawPathIsMalformed) rejects a
      raw path with an empty, ".", or ".." segment (literal or
      percent-encoded) with 400 before ServeMux can redirect; verified by
      TestMalformedPathsRejectedNoRedirect with redirect-following
      disabled. A weaker check must not certify the stronger promise.
    acceptance_criteria:
      - id: REQ-PROTO-003-AC1
        given: a running server, exercised through its real HTTP routing stack by a client that does NOT follow redirects
        when: the client requests keys containing a space, a "..", an empty segment, a 17th segment, or a 256-character segment - each in raw and percent-encoded form
        then: every such request receives HTTP 400 - a 307 redirect is a failure of this criterion, not proof - and no request mutates the store or creates a file outside the store root
        verification: { method: http-integration, release_blocking: true }
        status: approved
      - id: REQ-PROTO-003-AC2
        given: the bare root path (empty key) via PUT
        when: a client PUTs to /
        then: the server returns 400
        verification: { method: http-integration, release_blocking: false }
        status: approved

  - id: REQ-PROTO-004
    title: Method surface
    statement: >
      The server shall answer methods other than GET, PUT, and HEAD on cache
      paths with HTTP 405 and an Allow header naming the three supported
      methods.
    source: [internal/server/server.go cacheEndpoint]
    tier: community
    introduced: v0.1.0
    confidence: implementation-only
    acceptance_criteria:
      - id: REQ-PROTO-004-AC1
        given: a running server
        when: a client sends DELETE to a cache path
        then: 'the response is 405 with "Allow: GET, PUT, HEAD"'
        verification: { method: http-integration, release_blocking: false }
        status: approved

  - id: REQ-PROTO-005
    title: Body-size cap
    statement: >
      The server shall reject a PUT whose body exceeds FSCACHE_MAX_BODY_BYTES
      with HTTP 413, without storing a partial entry; the default cap shall
      be 1 GiB.
    source: [README.md configuration table, internal/server/server.go handlePut]
    tier: community
    introduced: v0.1.0
    confidence: documented
    acceptance_criteria:
      - id: REQ-PROTO-005-AC1
        given: a server with a small configured body cap
        when: a client PUTs a body larger than the cap
        then: the response is 413 and a subsequent GET of that key returns 404
        verification: { method: http-integration, release_blocking: true }
        status: approved

  - id: REQ-PROTO-006
    title: Browser landing page
    statement: >
      The server shall answer a browser GET of the bare root with an HTML
      landing page (HTTP 200) rather than an error, without shadowing any
      cache key.
    source: [internal/server/status.go handleRoot, docs/migrate-from-bcn.md]
    tier: community
    introduced: v0.2.0
    confidence: documented
    acceptance_criteria:
      - id: REQ-PROTO-006-AC1
        given: a running server holding a stored key
        when: a client GETs / and then GETs the stored key
        then: the root returns 200 HTML linking /statusz, and the stored key still returns its bytes
        verification: { method: http-integration, release_blocking: false }
        status: approved

  - id: REQ-PROTO-007
    title: Reserved paths refuse writes
    statement: >
      PUT and DELETE to the reserved application paths ("/", /healthz,
      /metrics, /statusz) shall return HTTP 405 with "Allow: GET, HEAD" and
      shall store nothing: the reserved namespace is read-only, and a write
      aimed at it is a client error, never a silent cache entry.
    source: [owner decision 2026-09-11, resolving the reserved-path backlog entry from the Sep 10 PR 43 review]
    tier: community
    introduced: v0.2.0
    origin: audit-2026-09-10; owner decision 2026-09-11
    confidence: documented
    acceptance_criteria:
      - id: REQ-PROTO-007-AC1
        given: a running server
        when: a client sends PUT and DELETE to each of "/", /healthz, /metrics, and /statusz
        then: 'every response is 405 with "Allow: GET, HEAD", nothing is stored under any key, and the four endpoints continue to answer GET as before'
        verification: { method: http-integration, release_blocking: true }
        status: approved
  # ── Configuration ─────────────────────────────────────────────────────

  - id: REQ-CFG-001
    title: Configuration surface and defaults
    statement: >
      The server shall be configured solely by environment variables:
      FSCACHE_ADDR (default ":8080"), FSCACHE_DATA_DIR (default "./data"),
      FSCACHE_MAX_BYTES (default 0, unbounded), FSCACHE_MAX_BODY_BYTES
      (default 1 GiB), FSCACHE_USERNAME and FSCACHE_PASSWORD (default
      unset). No runtime reconfiguration surface shall exist.
    source: [README.md configuration table, docs/docker-deploy.md "Configuration", cmd/fscache/main.go]
    tier: community
    introduced: v0.1.0
    confidence: documented
    notes: >
      Known defect recorded at extraction, not blessed as behavior: at the
      extracted revision an unparseable numeric value silently fell back to
      the default. The fail-closed replacement is REQ-CFG-003 (v0.2.0,
      requirements-first).
    acceptance_criteria:
      - id: REQ-CFG-001-AC1
        given: a server started with no environment variables set
        when: it starts
        then: it listens on :8080, stores under ./data, applies no size cap, caps bodies at 1 GiB, and disables auth
        verification: { method: unit, release_blocking: true }
        status: approved
      - id: REQ-CFG-001-AC2
        given: a server started with every variable set to a custom valid value
        when: it starts
        then: each value is honored, observably (listen address, data location, cap behavior, auth behavior)
        verification: { method: component, release_blocking: true }
        status: approved

  - id: REQ-CFG-002
    title: Credentials are both-or-neither
    statement: >
      The server shall refuse to start when exactly one of FSCACHE_USERNAME
      and FSCACHE_PASSWORD is set, with an error naming both variables.
    source: [README.md configuration table "required together", cmd/fscache/main.go run]
    tier: community
    introduced: v0.1.0
    confidence: documented
    acceptance_criteria:
      - id: REQ-CFG-002-AC1
        given: an environment with only FSCACHE_USERNAME set
        when: the server starts
        then: it exits non-zero with a message naming both variables, and the same holds for password-only
        verification: { method: unit, release_blocking: true }
        status: approved

  - id: REQ-CFG-003
    title: Invalid configuration fails startup
    statement: >
      The server shall refuse to start when a numeric configuration variable
      (FSCACHE_MAX_BYTES, FSCACHE_MAX_BODY_BYTES) is unparseable, carries
      trailing garbage, is negative, or overflows, exiting non-zero with a
      message naming the variable and the offending value. It shall never
      silently substitute a default for an invalid value: a typo in a size
      cap must stop the server, not unbound the cache.
    source: [test-strategy.md §2.1, audit §16, backlog entry resolved by this requirement]
    tier: community
    introduced: v0.2.0
    origin: audit-2026-09-08
    confidence: documented
    acceptance_criteria:
      - id: REQ-CFG-003-AC1
        given: an environment with FSCACHE_MAX_BYTES set to an unparseable value, a value with trailing garbage, a negative value, or an overflowing value
        when: the server starts
        then: startup fails with an error naming FSCACHE_MAX_BYTES and the value, for every listed case, and the same holds for FSCACHE_MAX_BODY_BYTES
        verification: { method: unit, release_blocking: true }
        status: approved

  # ── Authentication ────────────────────────────────────────────────────

  - id: REQ-AUTH-001
    title: Basic Auth on the cache surface
    statement: >
      When credentials are configured, the server shall require HTTP Basic
      Auth on every cache request and on the status surfaces, answering
      unauthenticated or wrong-credential requests with 401 and a
      WWW-Authenticate header, and never storing or serving data for them.
    source: [README.md, docs/gradle.md §2, docs/kubernetes.md, internal/server/server.go withAuth]
    tier: community
    introduced: v0.1.0
    confidence: documented
    acceptance_criteria:
      - id: REQ-AUTH-001-AC1
        given: a server with credentials configured
        when: requests arrive with no credentials, wrong credentials, and correct credentials
        then: the first two receive 401 with WWW-Authenticate and cause no store change; the third succeeds
        verification: { method: http-integration, release_blocking: true }
        status: approved
      - id: REQ-AUTH-001-AC2
        given: a server with credentials configured
        when: /statusz and the root landing page are requested without credentials
        then: both return 401; with credentials both return 200
        verification: { method: http-integration, release_blocking: false }
        status: approved

  - id: REQ-AUTH-002
    title: Constant-time credential comparison
    statement: >
      The server shall compare presented credentials in constant time, with
      both username and password comparisons always evaluated.
    source: [SECURITY.md "Data handling" context, www index "Authentication" card, internal/server/server.go withAuth]
    tier: community
    introduced: v0.1.0
    confidence: documented
    acceptance_criteria:
      - id: REQ-AUTH-002-AC1
        given: the auth implementation
        when: it is inspected
        then: comparison uses crypto/subtle.ConstantTimeCompare for both fields with no short-circuit between them
        verification: { method: inspection, release_blocking: false }
        status: approved

  - id: REQ-AUTH-003
    title: Probes and scrapers stay open
    statement: >
      /healthz and /metrics shall remain reachable without credentials even
      when authentication is enabled.
    source: [docs/gradle.md §6, docs/kubernetes.md, internal/server/server.go New]
    tier: community
    introduced: v0.1.0
    confidence: documented
    acceptance_criteria:
      - id: REQ-AUTH-003-AC1
        given: a server with credentials configured
        when: /healthz and /metrics are requested without credentials
        then: both return 200
        verification: { method: http-integration, release_blocking: true }
        status: approved

  - id: REQ-AUTH-004
    title: Credentials tolerated by a no-auth server
    statement: >
      A server with authentication disabled shall accept requests that carry
      an Authorization header, ignoring the header, so one client
      configuration works against test and production instances.
    source: [docs/gradle.md §2 "Configure the credentials block unconditionally"]
    tier: community
    introduced: v0.1.0
    confidence: documented
    acceptance_criteria:
      - id: REQ-AUTH-004-AC1
        given: a server with no credentials configured
        when: a client PUTs and GETs with a Basic Auth header present
        then: the round trip succeeds exactly as without the header
        verification: { method: http-integration, release_blocking: false }
        status: approved

  - id: REQ-AUTH-005
    title: Read-only credentials
    statement: >
      In addition to the read-write credential pair, the server shall
      support an optional read-only credential pair (FSCACHE_RO_USERNAME
      and FSCACHE_RO_PASSWORD, default unset). Read-only credentials
      authenticate exactly like read-write credentials for GET and HEAD on
      every authenticated surface, and receive HTTP 403 with nothing
      stored for PUT and DELETE: developer laptops read, only the
      identities holding the read-write pair write. Configuration is
      fail-closed: the pair is both-or-neither, requires the read-write
      pair to be configured, and its username must differ from the
      read-write username.
    source: [github issue 8 "read-only client mode", competitive-2026-09]
    tier: community
    introduced: v0.2.0
    origin: github issue 8; competitive-2026-09; owner decision 2026-09-12
    confidence: documented
    acceptance_criteria:
      - id: REQ-AUTH-005-AC1
        given: a server with both credential pairs configured and a stored key
        when: GET, HEAD, PUT, and DELETE arrive with read-only credentials, and the same requests arrive with read-write credentials
        then: with read-only credentials GET and HEAD succeed identically to read-write, PUT and DELETE return 403 and store nothing; with read-write credentials all behave as without the read-only pair
        verification: { method: http-integration, release_blocking: true }
        status: approved
      - id: REQ-AUTH-005-AC2
        given: a server with both credential pairs configured
        when: requests arrive with wrong credentials and with valid read-only credentials
        then: 'wrong credentials receive 401 with WWW-Authenticate; valid read-only credentials never receive 401, and their 403 carries no WWW-Authenticate - the identity was accepted, the verb was refused'
        verification: { method: http-integration, release_blocking: true }
        status: approved
      - id: REQ-AUTH-005-AC3
        given: environments with an incomplete read-only pair, a read-only pair without the read-write pair, and a read-only username equal to the read-write username
        when: the server starts
        then: each start fails non-zero with a message naming the offending variables; a complete, distinct configuration starts
        verification: { method: unit, release_blocking: true }
        status: approved
      - id: REQ-AUTH-005-AC4
        given: the auth implementation with two credential pairs
        when: it is inspected
        then: every credential comparison uses crypto/subtle.ConstantTimeCompare and all comparisons are evaluated with no short-circuit that leaks which pair matched
        verification: { method: inspection, release_blocking: false }
        status: approved

  - id: REQ-HTTP-001
    title: Server timeouts
    statement: >
      The HTTP server shall run with explicit timeouts, generous where a
      legitimate cache transfer is slow and tight where only a stuck or
      idle connection waits - ReadHeaderTimeout 10s, IdleTimeout 120s, and
      read/write deadlines of 20 minutes per request (enough for the
      documented 1 GiB body cap over a slow CI link, roughly 0.9 MB/s
      sustained, and finite where today is infinite). The values are
      configuration constants proposed by engineering on 2026-09-11 and
      adjustable by requirement change, not by silent edit.
    source: [test-strategy.md section 2.3, audit section 19]
    tier: community
    introduced: v0.2.0
    origin: audit-2026-09-08
    confidence: documented
    acceptance_criteria:
      - id: REQ-HTTP-001-AC1
        given: the constructed HTTP server
        when: its timeout configuration is examined
        then: ReadHeaderTimeout is 10s, IdleTimeout is 120s, and ReadTimeout and WriteTimeout are 20 minutes - none unset
        verification: { method: unit, release_blocking: true }
        status: approved

  - id: REQ-HTTP-002
    title: Bounded concurrent uploads
    statement: >
      The server shall bound concurrent PUT processing: at most
      FSCACHE_MAX_CONCURRENT_UPLOADS uploads in flight (default 32; 0
      disables the bound), with excess requests refused with HTTP 429 and
      a Retry-After header, storing nothing. Build clients treat any error
      as a cache miss, so a refused upload degrades a build's caching,
      never the build. Slow clients can therefore hold at most a bounded
      number of upload slots, temp files, and file handles.
    source: [test-strategy.md section 2.3, audit section 19]
    tier: community
    introduced: v0.2.0
    origin: audit-2026-09-08
    confidence: documented
    acceptance_criteria:
      - id: REQ-HTTP-002-AC1
        given: a server configured with an upload concurrency limit of 1 and one slow upload in progress
        when: a second PUT arrives
        then: it receives 429 with a Retry-After header and stores nothing, while the first upload completes normally; after it completes, a new PUT succeeds
        verification: { method: http-integration, release_blocking: true }
        status: approved
      - id: REQ-HTTP-002-AC2
        given: an environment setting FSCACHE_MAX_CONCURRENT_UPLOADS to an invalid value
        when: the server starts
        then: startup fails per REQ-CFG-003's fail-closed rule
        verification: { method: unit, release_blocking: false }
        status: approved

  # ── Storage ───────────────────────────────────────────────────────────

  - id: REQ-STORE-001
    title: Durable storage across restart
    statement: >
      Stored entries shall survive a clean server restart: a key stored
      before shutdown shall be retrievable, byte-identical, after the
      process is stopped and started against the same data directory.
    source: [docs/docker-deploy.md "persistent (named volume) deployment", docs/install.md systemd unit]
    tier: community
    introduced: v0.1.0
    confidence: documented
    acceptance_criteria:
      - id: REQ-STORE-001-AC1
        given: a server that stored a key and shut down cleanly
        when: a new process starts on the same data directory and the key is requested
        then: the identical bytes return, and store totals reflect the entry
        verification: { method: component, release_blocking: true }
        status: approved

  - id: REQ-STORE-002
    title: Atomic writes
    statement: >
      An interrupted or failed upload shall leave no partial entry: a key is
      either fully stored and retrievable or absent, and a failed overwrite
      shall preserve the previous value.
    source: [internal/blobstore/blobstore.go temp-file-and-rename write path]
    tier: community
    introduced: v0.1.0
    confidence: implementation-only
    acceptance_criteria:
      - id: REQ-STORE-002-AC1
        given: an upload that fails or is cancelled mid-body
        when: the same key is subsequently requested
        then: either 404 (never stored) or the previous complete value; never truncated bytes
        verification: { method: component, release_blocking: true }
        status: approved

  - id: REQ-STORE-003
    title: Tight on-disk permissions
    statement: >
      The store shall create directories with mode 0750 and blob files with
      mode 0600.
    source: [internal/blobstore/blobstore.go dirPerm/filePerm]
    tier: community
    introduced: v0.1.0
    confidence: implementation-only
    acceptance_criteria:
      - id: REQ-STORE-003-AC1
        given: a fresh store that has accepted one entry
        when: the on-disk tree is examined
        then: every directory is 0750 and every blob file 0600
        verification: { method: component, release_blocking: false }
        status: approved

  - id: REQ-STORE-004
    title: A stored reply means a stored entry
    statement: >
      A PUT shall succeed only when the blob is on disk AND its metadata
      record is written: if the metadata record fails, the server shall
      remove the blob and fail the PUT. A cache that says "stored" has
      stored it — retrievable, indexed, counted, and evictable.
    source: [audit-response-2026-09-08 §4.7 (decided), test-strategy.md §2.2, audit §18]
    tier: community
    introduced: v0.2.0
    origin: audit-2026-09-08
    confidence: documented
    acceptance_criteria:
      - id: REQ-STORE-004-AC1
        given: a cache whose metadata store fails on the record step
        when: a client PUTs an entry
        then: the PUT returns an error, the blob is not left on disk, and the entry is absent from both stores afterward
        verification: { method: component, release_blocking: true }
        status: approved

  - id: REQ-STORE-005
    title: Startup reconciliation after unclean shutdown
    statement: >
      The server shall write a marker file at startup and remove it on
      clean shutdown. When the marker is present at startup (an unclean
      exit), the server shall reconcile the two stores before serving:
      blobs without a metadata record are adopted (size from disk, recency
      now), records without a blob are dropped, stale temporary files are
      removed, totals are recomputed, and the reconciliation counts are
      logged. Blobs are truth; metadata is a rebuildable index. Clean
      restarts skip the walk.
    source: [audit-response-2026-09-08 §4.7 (decided), test-strategy.md §2.2, audit §18]
    tier: community
    introduced: v0.2.0
    origin: audit-2026-09-08
    confidence: documented
    acceptance_criteria:
      - id: REQ-STORE-005-AC1
        given: a store holding a blob with no metadata record (as after a crash between the two writes)
        when: reconciliation runs
        then: the blob is adopted - it appears in totals and entry count, is retrievable, and participates in eviction
        verification: { method: component, release_blocking: true }
        status: approved
      - id: REQ-STORE-005-AC2
        given: a metadata record whose blob is missing
        when: reconciliation runs
        then: the record is dropped and totals no longer include it
        verification: { method: component, release_blocking: true }
        status: approved
      - id: REQ-STORE-005-AC3
        given: a data directory with an unclean-shutdown marker and one of each inconsistency
        when: the server starts
        then: reconciliation runs before serving and logs the adopted/dropped counts; a subsequent clean restart does not walk
        verification: { method: component, release_blocking: false }
        status: approved

  # ── Eviction ──────────────────────────────────────────────────────────

  - id: REQ-EVICT-001
    title: Size-capped LRU eviction
    statement: >
      With FSCACHE_MAX_BYTES set, the server shall bound the COMMITTED
      LIVE-CACHE BLOB BYTES - the total size of indexed, retrievable
      entries, measured after an operation completes - by evicting
      least-recently-used entries; with the cap at 0 the store shall be
      unbounded. This is a bounded live-cache size with documented
      temporary headroom, not a hard filesystem quota: temporary and
      in-flight disk usage during writes, and concurrent-write headroom,
      are outside this requirement and need requirements of their own
      before any hard disk ceiling is claimed.
    source: [README.md "Full core", docs/docker-deploy.md "Sizing", internal/cache/cache.go]
    tier: community
    introduced: v0.1.0
    confidence: documented
    notes: >
      Recorded at review (Sep 10): the implementation writes the incoming
      object before evicting, and an entry LARGER than the whole cap is
      accepted and then immediately evicted itself (write succeeds, read
      returns not-found, indexed total returns to zero). The oversized-
      entry policy is an open product decision in backlog.yaml; this
      criterion is therefore limited to entries that individually fit
      within the cap, so it describes the extracted contract without
      silently strengthening it. DECIDED (owner, 2026-09-11): oversized
      entries are rejected — REQ-EVICT-002 is the contract, and the server
      change ships in v0.2.0.
    acceptance_criteria:
      - id: REQ-EVICT-001-AC1
        given: a server with a small cap, holding entries that exceed it in aggregate, where each entry's individual size is at most the cap
        when: a new entry no larger than the cap is stored
        then: least-recently-used entries are removed until the new entry fits, the new entry is retrievable afterward, and the committed live-cache blob bytes, measured after the operation completes, do not exceed the cap
        verification: { method: component, release_blocking: true }
        status: approved
      - id: REQ-EVICT-001-AC2
        given: a capped store where an old key is re-read
        when: eviction next runs
        then: the re-read key is treated as recently used and outlives never-read older entries
        verification: { method: component, release_blocking: false }
        status: approved

  - id: REQ-EVICT-002
    title: Oversized entries are rejected, not churned
    statement: >
      A PUT whose entry is larger than the configured cache cap
      (FSCACHE_MAX_BYTES, when set) shall be rejected with HTTP 413 and the
      response header "X-FSCache-Reject: entry-exceeds-cache-cap", storing
      nothing and evicting nothing. This rejection is distinct from the
      body-limit rejection (REQ-PROTO-005): a request over
      FSCACHE_MAX_BODY_BYTES is refused for its size on the wire and does
      not carry this header; a request over the cache cap is refused
      because it can never live in the cache, and says so. Build clients
      treat any 413 as a cache miss, so a build containing such an
      artifact completes normally without remote caching for it.
    source: [owner decision 2026-09-11, resolving the oversized-entry backlog entry from the Sep 10 PR 43 review]
    tier: community
    introduced: v0.2.0
    origin: audit-2026-09-10; owner decision 2026-09-11
    confidence: documented
    acceptance_criteria:
      - id: REQ-EVICT-002-AC1
        given: a server with a small configured cache cap holding existing entries
        when: a client PUTs an entry larger than the whole cap
        then: 'the response is 413 with header "X-FSCache-Reject: entry-exceeds-cache-cap", a GET of that key returns 404, and every previously stored entry is still present - nothing was evicted for an entry that could never fit'
        verification: { method: http-integration, release_blocking: true }
        status: approved
      - id: REQ-EVICT-002-AC2
        given: the same server
        when: a client PUTs a body exceeding FSCACHE_MAX_BODY_BYTES but not the cache cap
        then: the response is 413 WITHOUT the X-FSCache-Reject entry-exceeds-cache-cap header - the two rejections stay distinguishable
        verification: { method: http-integration, release_blocking: true }
        status: approved
      - id: REQ-EVICT-002-AC3
        given: a real Gradle build producing one cacheable output larger than the configured cap
        when: the build runs against the server twice
        then: both builds complete successfully, the oversized output is simply never cached, and other outputs still round-trip
        verification: { method: acceptance-gradle, release_blocking: true }
        status: approved
      - id: REQ-EVICT-002-AC4
        given: a real Maven build producing one cacheable output larger than the configured cap
        when: the build runs against the server twice
        then: both builds complete successfully with the oversized output uncached and other outputs still cached
        verification: { method: acceptance-maven, release_blocking: true }
        status: approved

