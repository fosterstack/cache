  - id: REQ-SUP-001
    title: Actions supply-chain checks
    statement: >
      Our workflows shall take no new version of an action, or of a tool, image or package they download, until it has been public 7 days; shall check every version we use, every day, against the public advisory and malware lists; and shall say publicly only what they know.
    source: [.github/workflows/supply-chain.yml, .github/dependabot.yml, .github/supply-chain-exceptions.json]
    tier: community
    introduced: v0.3.0
    origin: actions supply-chain checks (owner, Oct 5 2026, ops/docs/ratify/2026-10-05-actions-supply-chain.md rules 1-3 and 5; advisor 0172, 0175)
    confidence: implementation-only
    acceptance_criteria:
      - id: REQ-SUP-001-AC1
        given: "Dependabot's configuration"
        when: "it is read"
        then: "the github-actions and pip entries wait 7 days (a 7-day cooldown), and the gomod and docker entries are unchanged"
        verification: { method: ci-workflow, release_blocking: false }
        status: approved
      - id: REQ-SUP-001-AC2
        given: "a pull request that moves an action pin, or the version of a tool, image or package a workflow downloads (the version inputs of installer actions, install-scanner.sh pins, go install, pip install and release-asset downloads (curl or wget of a GitHub release) in run steps, container images our workflows run, local composite actions under .github/actions, the auditor's hash-pinned Python packages)"
        when: "the age check runs"
        then: "it names every version that moved; the product's base image (build/docker FROM lines), Go modules and the Go toolchain are not covered and are skipped"
        verification: { method: ci-workflow, release_blocking: false }
        status: approved
      - id: REQ-SUP-001-AC3
        given: "a moved version"
        when: "its age is measured"
        then: "only a server-side time counts: for an action, the first time our own scheduled run on main saw the tag point at the exact commit (the tag in the version comment must resolve to that commit) or the PR clock, whichever is older, and a release date alone never counts; for a downloaded tool, the newest of the release date and its asset's own created and updated times; a package index's newest upload time; the Go module index's timestamp; a registry's own push or creation time for an image; the PR clock is the earliest workflow run on the commit that introduced the version in the pull request; never a commit or tag date and never an image's own created field; a version public less than 7 days, or whose age cannot be proven, fails the check"
        verification: { method: ci-workflow, release_blocking: false }
        status: approved
      - id: REQ-SUP-001-AC4
        given: "any pull request"
        when: "the check runs"
        then: "it runs on every pull request (no path filter) on pull_request, never pull_request_target, with a read-only token and no secrets, and passes within a minute when no pin moves"
        verification: { method: ci-workflow, release_blocking: false }
        status: approved
      - id: REQ-SUP-001-AC5
        given: "any day"
        when: "the daily check runs"
        then: "it lists every version the age check covers, plus the actions and images called inside the actions we pin (each pinned action read at its commit; ones on moving tags are reported as information), checks each against the GitHub advisory database and OSV with its malicious-package reports, and checks that each pinned commit is reachable from a branch or tag of the action's own repository, not only a fork"
        verification: { method: ci-workflow, release_blocking: false }
        status: approved
      - id: REQ-SUP-001-AC6
        given: "a pull request held by the age check (for example a Dependabot security update, which skips the cooldown)"
        when: "the daily check runs"
        then: "it re-runs that pull request's age check, so it turns green on day 7 with no human step"
        verification: { method: ci-workflow, release_blocking: false }
        status: approved
      - id: REQ-SUP-001-AC7
        given: "a hit"
        when: "the daily check finds it"
        then: "it opens one issue, updated on later days and never a new one each day, that names the pinned version, the advisory id and the rollback: the newest clean version that is at least 7 days old, or dropping the action, never a brand-new release"
        verification: { method: ci-workflow, release_blocking: false }
        status: approved
      - id: REQ-SUP-001-AC8
        given: "a hit with no clean version at least 7 days old, or a hit whose bad version we ran in the last 90 days"
        when: "the issue is opened"
        then: "it is labelled owner-decision (every hit carries supply-chain-hit), and the workflow never produces the runs, their environments or the secret names they could reach: not in the issue, a log or an artifact"
        verification: { method: ci-workflow, release_blocking: false }
        status: approved
      - id: REQ-SUP-001-AC9
        given: "any public report or issue the checks write"
        when: "it states the result"
        then: "it says at most 'no known-compromised versions as of <date>', never 'no supply chain issues'"
        verification: { method: ci-workflow, release_blocking: false }
        status: approved
      - id: REQ-SUP-001-AC10
        given: "two advisory lists that disagree about whether a version we use is affected (one says affected; the other, for the same incident, says not)"
        when: "the daily check or the pull request check runs"
        then: "it neither reports clean nor rolls back: with no matching exception it reports a disputed hit, as a public-facts-only issue labelled supply-chain-hit, to the advisor; with a matching exception it passes; an exception is a checked-in entry (the advisory ids, the package, the version, evidence links, its date and each advisory's last-modified time) and applies only while both advisories are unchanged since it was written"
        verification: { method: ci-workflow, release_blocking: false }
        status: approved
      - id: REQ-SUP-001-AC13
        given: "a workflow job that runs pip install"
        when: "the workflows are read"
        then: "an earlier step of that same job installs pip itself (including a virtual environment's own pip, before anything is installed through that environment) at one pinned version from a hash-checked requirement file (pip-requirements.txt in the auditor tree), with --require-hashes and --only-binary=:all:, before any other pip install of that job, and the job logs the pip version, and a failed pin stops every later install of that job; the requirement file holds exactly one requirement, pip==<version>, with at least one --hash=sha256:, a version public at least 7 days; and that file is under Dependabot's 7-day cooldown"
        verification: { method: ci-workflow, release_blocking: false }
        status: approved

