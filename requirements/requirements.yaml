        given: "the four panel scanners"
        when: "they scan"
        then: "no scanner-specific ignore list and no suppression configured in any vendor account applies; the published OpenVEX file is the only exception"
        verification: { method: ci-workflow, release_blocking: false }
        status: approved
      - id: REQ-SCAN-004-AC2
        given: "a finding the VEX covers and one it does not, for each of the four scanners"
        when: "the panel judges them"
        then: "Grype and Docker Scout are given the VEX file directly; Inspector's and Google's results are filtered against it by our pipeline; the covered finding is dropped and the uncovered one remains"
        verification: { method: unit, release_blocking: false }
        status: approved

  - id: REQ-SCAN-005
