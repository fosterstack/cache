      68 as amended by the owner: every command run under Witness is wrapped in timeout 540. The wrapping lives in ONE committed helper, bin/witnessed.sh,
      which holds ALL the Witness flags; the judges are the three functions of the Rule 68 seam in bin/chain-test-shape.py. Fulcio's keyless certificate
      lives ten minutes and Witness verifies it at the timestamp's time (harness spike (d) tests that against a build longer than 12 minutes: if the
      wrapping has to change, only the seam and its fixtures change; the real phase times, cache-48, are about 3 minutes for build-apk.sh emulated and 8
