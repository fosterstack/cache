        status: approved
      - id: REQ-REL-009-AC3
        given: "a push to main that removes a critical or high finding present in the latest release, on a patch-clean main"
        when: "release.yml runs on that push"
        then: "it cuts the patch in that run"
        verification: { method: ci-workflow, release_blocking: false }
