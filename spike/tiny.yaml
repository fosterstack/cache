package:
  name: spike-tiny
  version: 1.0.0
  epoch: 0
  description: a tiny package for the VM build spike
  copyright:
    - license: Apache-2.0

environment:
  contents:
    packages:
      - busybox
      - wget
      - ca-certificates-bundle

pipeline:
  - name: identity
    runs: |
      echo "SPIKE-GUEST: kernel=$(uname -sr) uid=$(id -u) user=$(id -un)"
      echo "SPIKE-GUEST: root-mount=$(busybox awk '$2=="/"{print $1" "$3}' /proc/mounts | head -1)"
  - name: egress
    runs: |
      echo "SPIKE-GUEST: applets=$(busybox --list | tr '\n' ' ')"
      echo "SPIKE-GUEST: wget=$(command -v wget || echo none)"
      rc=0; wget -T 6 -t 1 -q -O /dev/null https://1.1.1.1/ >/dev/null 2>&1 || rc=$?
      echo "SPIKE-GUEST: egress-connect rc=$rc"
      rc=0; wget -T 6 -t 1 -q -O /dev/null https://example.com/ >/dev/null 2>&1 || rc=$?
      echo "SPIKE-GUEST: dns rc=$rc"
  - name: hostile
    runs: |
      P=/proc/1/root
      LD=$(ls $P/usr/lib/ld-linux-*.so.* $P/lib/ld-linux-*.so.* 2>/dev/null | head -n 1)
      M="$LD --library-path $P/usr/lib:$P/lib $P/usr/bin/mount"
      echo "SPIKE-GUEST: mount-program loader=${LD:-none} mount=$([ -x $P/usr/bin/mount ] && echo yes || echo no)"
      echo "SPIKE-GUEST: 9p-mounts-before=$(busybox awk '$3=="9p"{print $1" "$2" "$4}' /proc/1/mounts 2>/dev/null | tr '\n' ';')"
      mkdir -p /tmp/spike-9p
      rc=0; $M -t 9p -o trans=virtio,version=9p2000.L,msize=104857600 defaultshare /tmp/spike-9p >/tmp/spike-mount.out 2>&1 || rc=$?
      echo "SPIKE-GUEST: 9p-remount rc=$rc out=$(head -c 240 /tmp/spike-mount.out | tr '\n' ' ')"
      if [ "$rc" = 0 ]; then
        echo "SPIKE-GUEST: share-holds=$(ls -A /tmp/spike-9p | head -n 4 | tr '\n' ' ')"
        rc=0; $M -o remount,rw /tmp/spike-9p >/dev/null 2>&1 || rc=$?; echo "SPIKE-GUEST: remount-rw rc=$rc"
        rc=0; echo guest > /tmp/spike-9p/spike-guest-file 2>/dev/null || rc=$?; echo "SPIKE-GUEST: write-in-share rc=$rc"
        rc=0; ln -s /tmp/spike-canary-outside /tmp/spike-9p/spike-escape-link 2>/dev/null || rc=$?; echo "SPIKE-GUEST: symlink-in-share rc=$rc"
        rc=0; echo SPIKE-GUEST-WROTE >> /tmp/spike-9p/spike-escape-link 2>/dev/null || rc=$?; echo "SPIKE-GUEST: write-through-link rc=$rc"
        rc=0; echo SPIKE-GUEST-WROTE > /tmp/spike-9p/spike-canary-in-checkout.txt 2>/dev/null || rc=$?; echo "SPIKE-GUEST: overwrite-checkout-copy rc=$rc"
        echo "SPIKE-GUEST: link-target-seen-by-guest=$(readlink /tmp/spike-9p/spike-escape-link 2>&1)"
      fi
      echo "SPIKE-GUEST: hostile done"
  - name: install
    runs: |
      mkdir -p ${{targets.destdir}}/usr/share/spike-tiny
      echo tiny > ${{targets.destdir}}/usr/share/spike-tiny/hello.txt
