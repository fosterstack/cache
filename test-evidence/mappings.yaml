# AC-to-evidence mappings (traceability-plan.md §5).
#
# Mapping opened 2026-09-11, after owner approval of the baseline. Rules
# applied here, conservatively:
#
# - An AC is mapped only to evidence at (or above) its required depth. A
#   blobstore or helper test never stands in for an http-integration AC,
#   and a workflow weaker than the AC's assertions is not mapped (the
#   Gradle acceptance workflow asserts less than REQ-GRADLE-001-AC1
#   demands, so it stays unmapped until remediation item 1.5 strengthens
#   it).
# - An AC whose behavior the current implementation does not satisfy
#   (REQ-PROTO-003-AC1) is never mapped to a passing test.
# - v0.2.0 contracts without implementations, and ACs whose evidence class
#   does not exist yet (acceptance-release-artifact, denied-egress runs),
#   stay unmapped. Unmapped release-blocking ACs are the to-do list the
#   matrix exists to expose.
#
# go-test refs are "<package dir>:<TestName>" and the validator fails if
# the named test does not exist in that directory.

